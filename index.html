      if (limit !== null && limit !== undefined) result = result.slice(0, limit);
      if (adaptive) {
        if (result.length) {
          // base 非空：抽 base 15%（至少 2 張）維持卡一起洗牌；
          // 維持卡是 limit 之外的額外加碼。
          var m = Math.min(maintPool.length,
                           Math.max(MAINT_MIN_DRAW,
                                    Math.floor(result.length * MAINT_PCT / 100)));
          if (m > 0) {
            sample(maintPool, m).forEach(function (triple) {
              result.push(maintenanceEntry(triple[0], triple[1], triple[2]));
            });
            shuffle(result);
          }
        } else if (maintPool.length) {
          // 今日到期卡已清空：回傳純維持複習，讓使用者永遠有東西可刷。
          var k = Math.min(limit || MAINT_PURE_MAX, MAINT_PURE_MAX);
          result = sample(maintPool, Math.min(maintPool.length, k)).map(function (triple) {
            return maintenanceEntry(triple[0], triple[1], triple[2]);
          });
        }
      }
      return { cards: result };
    }

    // ── WebApp._classify_speed ──
    function classifySpeed(mode, ms) {
      if (!ms || ms <= 0 || typeof mode !== "string" || !hasOwn(SPEED_DEFAULTS, mode)) {
        return "normal";
      }
      if (ms > ABS_SLOW_MS) return "slow";
      var data = progress.data;
      var modeN = isPlainObject(data.mode_n) ? data.mode_n : {};
      var modeMs = isPlainObject(data.mode_ms) ? data.mode_ms : {};
      var n = toInt(getOwn(modeN, mode) || 0, 0);
      var ewma = getOwn(modeMs, mode);
      if (n >= 3 && typeof ewma === "number" && isFinite(ewma) && ewma > 0) {
        if (ms < 0.7 * ewma) return "fast";
        if (ms > 1.6 * ewma) return "slow";
        return "normal";
      }
      var fastT = SPEED_DEFAULTS[mode][0];
      var slowT = SPEED_DEFAULTS[mode][1];
      if (ms < fastT) return "fast";
      if (ms > slowT) return "slow";
      return "normal";
    }

    // ── WebApp._update_mode_stats ──
    function updateModeStats(mode, ms) {
      if (!ms || ms <= 0 || typeof mode !== "string" || !hasOwn(SPEED_DEFAULTS, mode)) return;
      var pair = progress.modeStats();
      var modeMs = pair[0], modeN = pair[1];
      var old = getOwn(modeMs, mode);
      var n = toInt(getOwn(modeN, mode) || 0, 0);
      if (n > 0 && typeof old === "number" && isFinite(old) && old > 0) {
        modeMs[mode] = pyRound(0.8 * old + 0.2 * ms);
      } else {
        modeMs[mode] = Math.trunc(ms);
      }
      modeN[mode] = n + 1;
    }

    // ── WebApp._answer_item ──
    function answerItem(langKey, text, correct, srs, mode, ms, confidence) {
      var card = progress.card(langKey, text);
      var wasDue = cardDue(card);
      var lvOld = cardLv(card);
      var fastOld = cardFast(card);
      var verifyBefore = cardVerify(card);
      var speed = classifySpeed(mode, ms);

      var box = null;
      var due = null;
      var lvNew, fastNew, verifyNew, reason;
      if (!correct) {
        lvNew = Math.max(lvOld - 2, 0);
        fastNew = 0;
        verifyNew = null;
        reason = "答錯了，掌握度下降，之後會加強複習這個字。";
      } else {
        updateModeStats(mode, ms);
        var suspicious = (confidence === "guess") || (speed === "slow");
        if (suspicious) {
          lvNew = lvOld;
          fastNew = 0;
          verifyNew = (mode === "spell" || mode === "cloze") ? "listen_mc" : "spell";
          var verifyZh = (verifyNew === "listen_mc") ? "聽力" : "拼寫";
          if (confidence === "guess") {
            reason = "既然是用猜的，掌握度先不變，之後會用" + verifyZh + "再確認一次。";
          } else {
            reason = "答對了，但反應偏慢，先不升級，之後會用" + verifyZh + "確認是真的記得。";
          }
        } else {
          if (confidence === "hesitant") {
            lvNew = lvOld;
            fastNew = 0;
            reason = "答對了，不過有些猶豫，掌握度先維持不變。";
          } else if (speed === "fast" || confidence === "fast") {
            lvNew = Math.min(lvOld + 1, MAX_LV);
            fastNew = fastOld + 1;
            if (fastNew >= 2) {
              lvNew = Math.min(lvNew + 1, MAX_LV);
              reason = "連續快答全對，掌握度跳升！";
            } else {
              reason = "又快又準，掌握度上升！";
            }
          } else {
            lvNew = Math.min(lvOld + 1, MAX_LV);
            fastNew = 0;
            reason = "答對了，掌握度上升。";
          }
          if (lvNew === lvOld && lvOld === MAX_LV && confidence !== "hesitant") {
            reason = "答對了，掌握度已是最高，繼續保持！";
          }
          // verify 清除時機：以 verify 題型答對且速度非 slow 且非 guess
          if (verifyBefore && mode === verifyBefore &&
              speed !== "slow" && confidence !== "guess") {
            verifyNew = null;
            reason = "換題型驗證通過，看來你是真的記得這個字！";
          } else {
            verifyNew = verifyBefore;
          }
        }
      }

      card.lv = lvNew;
      card.fast = fastNew;
      card.verify = verifyNew;

      var pair;
      if (!correct) {
        if (srs) {
          pair = progress.rateFlashcard(langKey, text, false);
          box = pair[0]; due = pair[1];
        } else {
          progress.record(false, langKey, text);
        }
      } else if (srs && !wasDue) {
        // 未到期卡答對（任何速度/信心）：box 不變，due 重設為
        // 今天＋該盒間隔；「不推進排程」規則只適用於到期卡。
        box = cardBox(card);
        due = addDaysStr((BOX_INTERVALS[box] !== undefined) ? BOX_INTERVALS[box] : 0);
        card.due = due;
        progress.record(true, langKey, text);
      } else if (confidence === "guess" || speed === "slow") {
        // 到期卡可疑的對：box 與 due 完全不動，只記統計
        progress.record(true, langKey, text);
        if (srs) {
          box = cardBox(card);
          due = (card.due === undefined) ? null : card.due;
        }
      } else {
        if (srs) {
          pair = progress.rateFlashcard(langKey, text, true);
          box = pair[0]; due = pair[1];
        } else {
          progress.record(true, langKey, text);
        }
      }

      return [box, due, lvNew, lvNew - lvOld, verifyNew, reason];
    }

    // ── WebApp.answer ──
    function answer(langKey, text, correct, srs, mode, ms, confidence) {
      var box = null, due = null, lv = null, delta = 0, verifyNext = null, reason = "";
      if (text && itemTexts[langKey] && itemTexts[langKey].has(text)) {
        // 單字卡：走自適應引擎（含 SRS 與統計）
        var r = answerItem(langKey, text, correct, srs, mode, ms, confidence);
        box = r[0]; due = r[1]; lv = r[2]; delta = r[3]; verifyNext = r[4]; reason = r[5];
      } else {
        // 字母／文法等非單字內容：維持現狀，只記每日統計
        progress.record(correct);
      }
      return {
        ok: true, box: box, due: due, state: state(),
        lv: lv, delta: delta, verify_next: verifyNext, reason_zh: reason,
      };
    }

    // ── WebApp.complete_lesson ──
    // 標記課程完成（重複標記冪等）；只更新 streak/last_study_date，
    // 不動 daily 答題統計。
    function completeLesson(langKey, lessonId) {
      var done = progress.lessonsDone(langKey);
      if (done.indexOf(lessonId) === -1) done.push(lessonId);
      progress.touchStudyDay();
      progress.save();
      return { ok: true, lessons_done: done.slice() };
    }

    // ── WebApp.insights ──
    function insights() {
      var p = progress.data;
      var rawMs = isPlainObject(p.mode_ms) ? p.mode_ms : {};
      var avgMs = {};
      Object.keys(rawMs).forEach(function (k) {
        var v = rawMs[k];
        if (typeof v === "number" && isFinite(v)) avgMs[k] = pyRound(v);
      });
      var languages = langs.map(function (lang) {
        var code = lang.language;
        var cards = progress.cards(code);
        var lvDist = [0, 0, 0, 0, 0, 0];
        var weak = [];
        lang.items.forEach(function (it) {
          var key = it.text || "";
          var card = getOwn(cards, key);
          if (!isPlainObject(card)) {
            lvDist[0] += 1;   // 未作答過的卡計入 lv0
            return;
          }
          var lv = cardLv(card);
          lvDist[lv] += 1;
          var wrong = toInt(card.wrong || 0, 0);
          var cor = toInt(card.correct || 0, 0);
          if (wrong >= 1) {
            weak.push({
              text: key,
              zh: getStr(it, "zh"),
              lv: lv,
              wrong: wrong,
              correct: cor,
            });
          }
        });
        weak.sort(function (a, b) {
          if (b.wrong !== a.wrong) return b.wrong - a.wrong;
          var ra = a.correct / (a.correct + a.wrong);
          var rb = b.correct / (b.correct + b.wrong);
          return ra - rb;
        });
        return {
          key: code,
          display_name_zh: lang.display_name_zh,
          lv_dist: lvDist,
          weak: weak.slice(0, 8),
          avg_ms: avgMs,
        };
      });
      var daily = isPlainObject(p.daily) ? p.daily : {};
      var daily7 = [];
      for (var i = 6; i >= 0; i--) {
        var d = addDaysStr(-i);
        var day = getOwn(daily, d);
        if (!isPlainObject(day)) day = {};
        daily7.push({
          date: d,
          answered: toInt(day.answered || 0, 0),
          correct: toInt(day.correct || 0, 0),
        });
      }
      return {
        languages: languages,
        daily7: daily7,
        streak: toInt(p.streak || 0, 0),
      };
    }

    // ── 對外 API（皆 async；資料形狀與 study_app.py 各端點一致）──────

    return {
      // GET /api/state
      apiState: async function () {
        return state();
      },

      // GET /api/language/<key>
      apiLanguage: async function (key) {
        var lang = getOwn(byKey, key);
        if (!lang) throw new Error("找不到語言：" + key);
        return lang.raw;
      },

      // GET /api/session?lang=&limit=&mode=
      apiSession: async function (lang, limit, mode) {
        var langKey = (typeof lang === "string" && lang.trim() !== "") ? lang.trim() : "all";
        if (langKey !== "all" && !hasOwn(byKey, langKey)) {
          throw new Error("找不到語言：" + langKey);
        }
        var lim = null;
        if (limit !== null && limit !== undefined && String(limit).trim() !== "") {
          if (typeof limit === "number") {
            if (!Number.isInteger(limit)) throw new Error("limit 必須是整數");
            lim = limit;
          } else {
            try { lim = pyInt(String(limit).trim()); }
            catch (e) { throw new Error("limit 必須是整數"); }
          }
          if (lim < 0) throw new Error("limit 不可為負數");
        }
        var m = (typeof mode === "string" && mode.trim() !== "") ? mode.trim() : "adaptive";
        if (m !== "adaptive" && m !== "classic") {
          throw new Error("mode 必須是 adaptive 或 classic");
        }
        return sessionCards(langKey, lim, m);
      },

      // POST /api/answer
      apiAnswer: async function (body) {
        if (!isPlainObject(body)) throw new Error("JSON 格式錯誤");
        var langKey = body.lang;
        if (typeof langKey !== "string" || !hasOwn(byKey, langKey)) {
          throw new Error("找不到語言：" + langKey);
        }
        var text = body.text;
        if (typeof text !== "string" || text.trim() === "") {
          throw new Error("缺少 text 欄位");
        }
        var correct = body.correct;
        if (typeof correct !== "boolean") {
          throw new Error("correct 必須是布林值");
        }
        var srs = Boolean(body.srs);
        if (srs && !(itemTexts[langKey] && itemTexts[langKey].has(text))) {
          throw new Error("找不到單字：" + text);
        }
        // 可選新欄位（缺漏或格式不符時忽略，確保舊呼叫行為完全不變）
        var mode = body.mode;
        mode = (typeof mode === "string" && mode.trim() !== "") ? mode.trim() : null;
        var ms = toInt(body.ms || 0, 0);
        if (ms < 0) ms = 0;
        var confidence = body.confidence;
        if (CONFIDENCES.indexOf(confidence) === -1) confidence = null;
        return answer(langKey, text, correct, srs, mode, ms, confidence);
      },

      // POST /api/lesson
      apiLesson: async function (lang, id) {
        if (typeof lang !== "string" || !hasOwn(byKey, lang)) {
          throw new Error("找不到語言：" + lang);
        }
        if (typeof id !== "string" ||
            !(lessonIds[lang] && lessonIds[lang].has(id))) {
          throw new Error("找不到課程：" + id);
        }
        return completeLesson(lang, id);
      },

      // GET /api/insights
      apiInsights: async function () {
        return insights();
      },

      // 匯出進度（JSON 字串，格式與 data/progress.json 完全相同）
      exportProgress: async function () {
        return JSON.stringify(progress.data, null, 2);
      },

      // 匯入進度：驗證結構後整份取代並存檔；非法時 throw 繁中錯誤訊息
      importProgress: async function (str) {
        if (typeof str !== "string" || str.trim() === "") {
          throw new Error("匯入失敗：請提供進度 JSON 字串。");
        }
        var raw;
        try { raw = JSON.parse(str); }
        catch (e) { throw new Error("匯入失敗：不是有效的 JSON 格式。"); }
        if (!isPlainObject(raw)) {
          throw new Error("匯入失敗：進度檔必須是 JSON 物件。");
        }
        if (!isPlainObject(raw.languages)) {
          throw new Error("匯入失敗：缺少 languages 欄位或格式不正確。");
        }
        if (!isPlainObject(raw.daily)) {
          throw new Error("匯入失敗：缺少 daily 欄位或格式不正確。");
        }
        var lk, ck, dk;
        for (lk in raw.languages) {
          if (!hasOwn(raw.languages, lk)) continue;
          var lv = raw.languages[lk];
          if (!isPlainObject(lv)) {
            throw new Error("匯入失敗：languages." + lk + " 格式不正確。");
          }
          if (lv.cards !== undefined && lv.cards !== null && !isPlainObject(lv.cards)) {
            throw new Error("匯入失敗：languages." + lk + ".cards 格式不正確。");
          }
          if (isPlainObject(lv.cards)) {
            for (ck in lv.cards) {
              if (!hasOwn(lv.cards, ck)) continue;
              if (!isPlainObject(lv.cards[ck])) {
                throw new Error("匯入失敗：languages." + lk + ".cards 內的卡片「" + ck + "」格式不正確。");
              }
            }
          }
        }
        for (dk in raw.daily) {
          if (!hasOwn(raw.daily, dk)) continue;
          if (!isPlainObject(raw.daily[dk])) {
            throw new Error("匯入失敗：daily." + dk + " 格式不正確。");
          }
        }
        if (raw.streak !== undefined && raw.streak !== null &&
            typeof raw.streak !== "number" && typeof raw.streak !== "string") {
          throw new Error("匯入失敗：streak 欄位格式不正確。");
        }
        if (raw.last_study_date !== undefined && raw.last_study_date !== null &&
            typeof raw.last_study_date !== "string") {
          throw new Error("匯入失敗：last_study_date 欄位格式不正確。");
        }
        if (raw.mode_ms !== undefined && !isPlainObject(raw.mode_ms)) {
          throw new Error("匯入失敗：mode_ms 欄位格式不正確。");
        }
        if (raw.mode_n !== undefined && !isPlainObject(raw.mode_n)) {
          throw new Error("匯入失敗：mode_n 欄位格式不正確。");
        }
        progress.data = Progress.defaultData();
        progress._merge(raw);
        progress.save();
        return { ok: true, state: state() };
      },

      // 清除全部進度並存檔
      resetProgress: async function () {
        progress.data = Progress.defaultData();
        progress.save();
        return { ok: true, state: state() };
      },
    };
  }

  // ── 匯出（瀏覽器 + Node）──────────────────────────────────────────

  if (typeof module !== "undefined" && module.exports) {
    module.exports = { createEngine: createEngine };
  }
  if (typeof window !== "undefined") {
    window.createEngine = createEngine;
  } else if (typeof globalThis !== "undefined") {
    globalThis.createEngine = createEngine;
  }
})();

/* profiles.js — 使用者設定檔管理（隨身版 v2）
 *
 * 讓同一支手機（或分享出去的同一個檔案）可以多人使用，進度互不干擾：
 *   - localStorage "ll-profiles" = {"list":["名字",...],"current":"名字"}
 *   - 每個設定檔的進度各自存在 "language-learning-progress:<名字>"
 *   - v1 舊 key "language-learning-progress" 有資料時，建立第一個設定檔的
 *     當下靜默搬移進該設定檔（搬移後刪除舊 key），v1 使用者升級不掉進度。
 *
 * 用法：
 *   const profiles = createProfileStore(store);
 *     store = {get(key): string|null, set(key, value), remove(key)}
 *             （localStorage 包裝或記憶體物件皆可）
 *   方法：load / list / current / validateName / create / switchTo /
 *         remove / progressKey。create、switchTo、remove 失敗時 throw
 *         繁中錯誤訊息。
 *
 * 同時支援瀏覽器（window.createProfileStore）與 Node（module.exports）。
 */
(function () {
  "use strict";

  var PROFILES_KEY = "ll-profiles";
  var LEGACY_PROGRESS_KEY = "language-learning-progress"; // v1 單人版舊 key
  var MAX_NAME_LEN = 12;

  function progressKey(name) {
    return LEGACY_PROGRESS_KEY + ":" + name;
  }

  function isPlainObject(v) {
    return typeof v === "object" && v !== null && !Array.isArray(v);
  }

  function createProfileStore(store) {
    if (!store || typeof store.get !== "function" ||
        typeof store.set !== "function" || typeof store.remove !== "function") {
      throw new Error("store 必須提供 get()、set()、remove() 方法");
    }

    // 讀取設定檔清單；不存在或格式壞掉時回 null（視同首次開啟）
    function load() {
      var txt;
      try { txt = store.get(PROFILES_KEY); } catch (e) { return null; }
      if (txt === null || txt === undefined || txt === "") return null;
      var raw;
      try { raw = JSON.parse(txt); } catch (e) { return null; }
      if (!isPlainObject(raw)) return null;
      var list = (Array.isArray(raw.list) ? raw.list : []).filter(function (n) {
        return typeof n === "string" && n.trim() !== "";
      });
      if (!list.length) return null;
      var current = (typeof raw.current === "string" && list.indexOf(raw.current) !== -1)
        ? raw.current
        : list[0];
      return { list: list, current: current };
    }

    function save(p) {
      store.set(PROFILES_KEY, JSON.stringify({ list: p.list, current: p.current }));
    }

    // 暱稱驗證：去頭尾空白後 1-12 字、不可空白、不可與現有設定檔重複
    function validateName(name, list) {
      if (typeof name !== "string") {
        return { ok: false, error: "請輸入暱稱。" };
      }
      var n = name.trim();
      if (!n) return { ok: false, error: "暱稱不可空白。" };
      var len;
      try { len = Array.from(n).length; } catch (e) { len = n.length; }
      if (len > MAX_NAME_LEN) {
        return { ok: false, error: "暱稱最長 " + MAX_NAME_LEN + " 個字。" };
      }
      if (list && list.indexOf(n) !== -1) {
        return { ok: false, error: "已有同名設定檔，請換一個暱稱。" };
      }
      return { ok: true, name: n };
    }

    // v1 舊 key 有資料 → 搬進指定設定檔並刪除舊 key；回傳是否有搬移
    function migrateLegacy(name) {
      var old;
      try { old = store.get(LEGACY_PROGRESS_KEY); } catch (e) { old = null; }
      if (old === null || old === undefined || old === "") return false;
      store.set(progressKey(name), old);
      store.remove(LEGACY_PROGRESS_KEY);
      return true;
    }

    // 建立設定檔並切換為目前使用者；第一個設定檔會承接 v1 舊進度
    function create(name) {
      var p = load();
      var v = validateName(name, p ? p.list : []);
      if (!v.ok) throw new Error(v.error);
      var isFirst = (p === null);
      if (isFirst) p = { list: [], current: "" };
      p.list.push(v.name);
      p.current = v.name;
      save(p);
      if (isFirst) migrateLegacy(v.name);
      return v.name;
    }

    function switchTo(name) {
      var p = load();
      if (!p || p.list.indexOf(name) === -1) {
        throw new Error("找不到設定檔：" + name);
      }
      p.current = name;
      save(p);
      return name;
    }

    // 刪除設定檔（連同其進度 key）；不可刪最後一個。回傳刪除後的目前使用者
    function remove(name) {
      var p = load();
      if (!p || p.list.indexOf(name) === -1) {
        throw new Error("找不到設定檔：" + name);
      }
      if (p.list.length <= 1) {
        throw new Error("至少要保留一個設定檔，無法刪除。");
      }
      p.list = p.list.filter(function (n) { return n !== name; });
      if (p.current === name) p.current = p.list[0];
      save(p);
      store.remove(progressKey(name));
      return p.current;
    }

    return {
      load: load,
      list: function () { var p = load(); return p ? p.list.slice() : []; },
      current: function () { var p = load(); return p ? p.current : null; },
      validateName: function (name) {
        var p = load();
        return validateName(name, p ? p.list : []);
      },
      create: create,
      switchTo: switchTo,
      remove: remove,
      progressKey: progressKey,
    };
  }

  if (typeof module !== "undefined" && module.exports) {
    module.exports = { createProfileStore: createProfileStore };
  }
  if (typeof window !== "undefined") {
    window.createProfileStore = createProfileStore;
  } else if (typeof globalThis !== "undefined") {
    globalThis.createProfileStore = createProfileStore;
  }
})();

/* ============================================================
 * 語言學習小幫手 — 前端 SPA（原生 JS、無框架、無外部資源）
 * hash 路由：#/home、#/lang/<key>、#/flash/<key|all>、#/smart/<key|all>、
 *           #/quiz/<key>、#/spell/<key>、#/alphabet/<key>、#/grammar/<key>、
 *           #/list/<key>、#/stats、#/lessons/<key>、#/lesson/<key>/<id>、#/data
 * ============================================================ */
'use strict';

/* ===================== 常數 ===================== */

const LANG_COLOR = {
  english: 'var(--lang-en)',
  japanese: 'var(--lang-jp)',
  korean: 'var(--lang-kr)'
};
const LANG_SOFT = {
  english: 'var(--lang-en-soft)',
  japanese: 'var(--lang-jp-soft)',
  korean: 'var(--lang-kr-soft)'
};
const PRIMARY = 'var(--primary)';
const VERSION_DATE = '2026-07-29';
const VOICE_LANG = { english: 'en-US', japanese: 'ja-JP', korean: 'ko-KR' };
const GROUP_NAME = { hiragana: '平假名', katakana: '片假名' };
const FLASH_LIMIT = 20;
const FORMAT_ZH = {
  mc_f2z: '選擇題（外語→中文）',
  mc_kana: '選擇題（假名認讀）',
  mc_z2f: '選擇題（中文→外語）',
  spell: '拼寫',
  listen_mc: '聽力選擇',
  cloze: '例句填空',
  flash: '單字卡'
};

function formatName(fmt) { return FORMAT_ZH[fmt] || fmt; }

/* ===================== 全域狀態 ===================== */

const state = {
  app: null,        // GET /api/state 的結果
  langCache: {},    // key -> GET /api/language/<key> 的結果
  timers: [],       // 本頁註冊的 setTimeout id（切頁清除）
  keyHandler: null, // 本頁註冊的 document keydown handler（切頁清除）
  seq: 0,           // 路由序號，避免非同步 render 蓋到新頁
  toastTimer: null
};

const appRoot = document.getElementById('app');

/* ===================== 小工具 ===================== */

/** 建立 DOM 元素；children 一律以 textContent 方式插入，防 XSS */
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style') el.style.cssText = v;
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : String(v));
    }
  }
  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pct(correct, total) {
  if (!total) return '—';
  return Math.round((correct / total) * 100) + '%';
}

function baseLang(key) {
  if (!key) return null;
  for (const b of ['english', 'japanese', 'korean']) {
    if (key === b || key.indexOf(b) !== -1) return b;
  }
  return null;
}

function langColor(key) {
  return LANG_COLOR[baseLang(key)] || PRIMARY;
}

function langSoft(key) {
  return LANG_SOFT[baseLang(key)] || 'var(--primary-soft)';
}

/** 是否含漢字（日文「假名認讀」分級出題用） */
function hasKanji(s) {
  return /[\u4E00-\u9FFF]/.test(String(s || ''));
}

/** 從 reading（「假名 空格 romaji」格式）取開頭連續非 ASCII 字元段；取不到回空字串 */
function kanaOf(card) {
  const m = /^[^\x00-\x7F]+/.exec(String((card && card.reading) || '').trim());
  return m ? m[0] : '';
}

/** 日文卡且 text 含漢字時回傳假名題面，否則回 null（null＝照常顯示 text）。
 *  langKey 供本身沒有 lang 欄位的項目（經典測驗 items、單字池）指定語言。 */
function jpKana(card, langKey) {
  if (baseLang(langKey || card.lang) !== 'japanese') return null;
  if (!hasKanji(card.text)) return null;
  return kanaOf(card) || null;
}

function addTimer(fn, ms) {
  const id = setTimeout(fn, ms);
  state.timers.push(id);
  return id;
}

function todayText() {
  try {
    return new Date().toLocaleDateString('zh-TW', {
      year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
    });
  } catch (e) {
    return new Date().toISOString().slice(0, 10);
  }
}

/** 拼寫比對用正規化：轉小寫、移除所有空白與標點符號 */
function normAns(s) {
  return String(s || '').toLowerCase().replace(/[\s\p{P}\p{S}]/gu, '');
}

/* ===================== Toast ===================== */

function showToast(msg, ok) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('ok', !!ok);
  t.classList.add('show');
  if (state.toastTimer) clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(() => t.classList.remove('show'), 4000);
}

/* ===================== API ===================== */

/* 本地引擎 + 使用者設定檔（v3）：
 * 進度依設定檔分開存 localStorage（"language-learning-progress:<暱稱>"），
 * 設定檔清單存 "ll-profiles"；localStorage 不可用時退回記憶體（僅本次瀏覽有效）。 */
const store = (() => {
  const mem = Object.create(null);
  return {
    get(k) {
      try {
        const v = localStorage.getItem(k);
        if (v !== null) return v;
      } catch (e) { /* localStorage 不可用 */ }
      return (k in mem) ? mem[k] : null;
    },
    set(k, v) {
      try { localStorage.setItem(k, v); } catch (e) { /* 空間不足等，僅記憶體保存 */ }
      mem[k] = v;
    },
    remove(k) {
      try { localStorage.removeItem(k); } catch (e) { /* 忽略 */ }
      delete mem[k];
    }
  };
})();

const profiles = createProfileStore(store);
let engine = null;

/** 以「目前設定檔」的進度 key 重建學習引擎 */
function buildEngine() {
  const key = profiles.progressKey(profiles.current());
  engine = createEngine(DATA, {
    get() { return store.get(key); },
    set(s) { store.set(key, s); }
  });
}

/** 頂欄顯示目前設定檔名（點擊跳資料頁）；尚未建立設定檔時隱藏 */
function updateProfileChip() {
  const btn = document.getElementById('profile-btn');
  if (!btn) return;
  const name = profiles.current();
  btn.textContent = '👤 ' + (name || '');
  btn.style.display = (name && engine) ? '' : 'none'; // 快速登入頁（尚未選人）不顯示
}

/** 切換／建立設定檔後：重建引擎、清空快取（state／語言資料）、導回首頁重新載入 */
function reloadForProfile() {
  buildEngine();
  state.app = null;
  state.langCache = {};
  updateProfileChip();
  go('#/home');
  onRoute();
}

/* api()：以本地引擎取代原本的 fetch 後端，呼叫端的路徑字串完全不變 */
async function api(path, opts) {
  opts = opts || {};
  try {
    let m;
    if (path === '/api/state') return await engine.apiState();
    if ((m = path.match(/^\/api\/language\/([^/?]+)$/))) {
      return await engine.apiLanguage(decodeURIComponent(m[1]));
    }
    if (path === '/api/session' || path.indexOf('/api/session?') === 0) {
      const q = new URLSearchParams(path.split('?')[1] || '');
      return await engine.apiSession(q.get('lang'), q.get('limit'), q.get('mode'));
    }
    if (path === '/api/answer') return await engine.apiAnswer(opts.body || {});
    if (path === '/api/lesson') {
      const b = opts.body || {};
      return await engine.apiLesson(b.lang, b.id);
    }
    if (path === '/api/insights') return await engine.apiInsights();
    if (path === '/api/say') return { ok: true }; // 隨身版：發音只用瀏覽器語音合成
    throw new Error('未知的 API 路徑：' + path);
  } catch (e) {
    showToast(e && e.message ? e.message : '發生錯誤');
    throw e;
  }
}

async function loadState(force) {
  if (!state.app || force) state.app = await api('/api/state');
  return state.app;
}

async function loadLang(key) {
  if (!state.langCache[key]) state.langCache[key] = await api('/api/language/' + encodeURIComponent(key));
  return state.langCache[key];
}

/** 送出作答；成功後同步全域 state。extra 可帶 { mode, ms, confidence }（皆可選） */
async function postAnswer(lang, text, correct, srs, extra) {
  const body = { lang: lang, text: text, correct: !!correct, srs: !!srs };
  if (extra) {
    if (extra.mode) body.mode = extra.mode;
    if (typeof extra.ms === 'number') body.ms = Math.round(extra.ms);
    if (extra.confidence) body.confidence = extra.confidence;
  }
  const res = await api('/api/answer', { method: 'POST', body: body });
  if (res && res.state) state.app = res.state;
  return res;
}

/** 非 SRS 作答：背景送出，失敗只顯示 toast、不中斷流程 */
function postAnswerQuiet(lang, text, correct) {
  postAnswer(lang, text, correct, false).catch(() => {});
}

/* ===================== 發音 ===================== */

// 預先觸發 voices 載入（部分瀏覽器為非同步），並監聽 voiceschanged 更新快取
let voicesCache = [];
function refreshVoices() {
  try { voicesCache = speechSynthesis.getVoices() || []; } catch (e) { voicesCache = []; }
}
try {
  if (window.speechSynthesis) {
    refreshVoices();
    speechSynthesis.onvoiceschanged = refreshVoices;
  }
} catch (e) { /* 忽略 */ }

function sayFallback(lang, text) {
  /* 隨身版：無後端可代打，發音只靠瀏覽器 speechSynthesis，此處靜默。 */
}

function speak(lang, text) {
  if (!text) return;
  const tag = VOICE_LANG[baseLang(lang)];
  if (!tag) { sayFallback(lang, text); return; }
  try {
    if (window.speechSynthesis && window.SpeechSynthesisUtterance) {
      const prefix = tag.slice(0, 2).toLowerCase();
      const voices = voicesCache.length ? voicesCache : (speechSynthesis.getVoices() || []);
      const voice = voices.find(v => String(v.lang || '').toLowerCase().replace('_', '-').startsWith(prefix));
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      if (voice) u.voice = voice; // 找不到完全對應的語音時交給系統依 lang 挑
      u.lang = tag;
      u.rate = 0.95;
      speechSynthesis.speak(u);
      return;
    }
  } catch (e) { /* 靜默 */ }
  sayFallback(lang, text);
}

function speakBtn(lang, text, extraClass) {
  return h('button', {
    type: 'button',
    class: 'btn btn-ghost speak-btn' + (extraClass ? ' ' + extraClass : ''),
    title: '發音（s）',
    'aria-label': '發音',
    onclick: (e) => { e.stopPropagation(); speak(lang, text); }
  }, '🔊');
}

/* ===================== 路由 ===================== */

function go(hash) { location.hash = hash; }

function cleanup() {
  for (const id of state.timers) clearTimeout(id);
  state.timers = [];
  if (state.keyHandler) {
    document.removeEventListener('keydown', state.keyHandler);
    state.keyHandler = null;
  }
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) { /* 忽略 */ }
}

function setKeyHandler(fn) {
  state.keyHandler = fn;
  document.addEventListener('keydown', fn);
}

function setPage(...nodes) {
  const page = h('div', { class: 'page' }, nodes);
  appRoot.replaceChildren(page);
  window.scrollTo(0, 0);
  return page;
}

function setNavActive(name) {
  document.getElementById('nav-home').classList.toggle('active', name === 'home');
  document.getElementById('nav-stats').classList.toggle('active', name === 'stats');
  document.getElementById('nav-data').classList.toggle('active', name === 'data');
}

function onRoute() {
  cleanup();
  const seq = ++state.seq;
  if (!engine) { renderWelcome(); return; } // 首次開啟：先建立設定檔
  const hash = location.hash || '#/home';
  let m;
  if (hash === '#/home' || hash === '#/' || hash === '#') {
    setNavActive('home'); renderHome(seq);
  } else if (hash === '#/stats') {
    setNavActive('stats'); renderStats(seq);
  } else if (hash === '#/data') {
    setNavActive('data'); renderData(seq);
  } else if ((m = hash.match(/^#\/lang\/([\w-]+)$/))) {
    setNavActive(''); renderLangMenu(seq, m[1]);
  } else if ((m = hash.match(/^#\/lessons\/([\w-]+)$/))) {
    setNavActive(''); renderLessons(seq, m[1]);
  } else if ((m = hash.match(/^#\/lesson\/([\w-]+)\/([\w-]+)$/))) {
    setNavActive(''); renderLesson(seq, m[1], m[2]);
  } else if ((m = hash.match(/^#\/flash\/([\w-]+)$/))) {
    setNavActive(''); renderFlash(seq, m[1]);
  } else if ((m = hash.match(/^#\/smart\/([\w-]+)$/))) {
    setNavActive(''); renderSmart(seq, m[1]);
  } else if ((m = hash.match(/^#\/quiz\/([\w-]+)$/))) {
    setNavActive(''); renderQuiz(seq, m[1]);
  } else if ((m = hash.match(/^#\/spell\/([\w-]+)$/))) {
    setNavActive(''); renderSpell(seq, m[1]);
  } else if ((m = hash.match(/^#\/alphabet\/([\w-]+)$/))) {
    setNavActive(''); renderAlphabet(seq, m[1]);
  } else if ((m = hash.match(/^#\/grammar\/([\w-]+)$/))) {
    setNavActive(''); renderGrammar(seq, m[1]);
  } else if ((m = hash.match(/^#\/list\/([\w-]+)$/))) {
    setNavActive(''); renderList(seq, m[1]);
  } else {
    go('#/home');
  }
}

function stale(seq) { return seq !== state.seq; }

function loadingPage() {
  setPage(h('p', { class: 'loading' }, '載入中…'));
}

function errorPage(backHash) {
  setPage(
    h('div', { class: 'card center-card' },
      h('p', { class: 'big-emoji' }, '😢'),
      h('p', null, '資料載入失敗，請重試一次。'),

/** 將含【重點】標記的文字轉成節點陣列（純 textContent 切割，不用 innerHTML） */
function markupNodes(body) {
  const s = String(body || '');
  const nodes = [];
  const re = /【([^】]*)】/g;
  let last = 0;
  let m;
  while ((m = re.exec(s)) !== null) {
    if (m.index > last) nodes.push(s.slice(last, m.index));
    if (m[1]) nodes.push(h('strong', { class: 'em-mark' }, m[1]));
    last = m.index + m[0].length;
  }
  if (last < s.length) nodes.push(s.slice(last));
  return nodes;
}

/** 取語言資料中的課程清單（缺漏、非陣列、無 id 一律容錯） */
function lessonsOf(data) {
  if (!data || !Array.isArray(data.lessons)) return [];
  return data.lessons.filter(ls => ls && typeof ls === 'object' && ls.id);
}

/** 已完成課程 id 集合（取自 /api/state，舊後端無此欄位時為空集合） */
function lessonsDoneSet(key) {
  const info = findLangInfo(key);
  return new Set((info && Array.isArray(info.lessons_done)) ? info.lessons_done : []);
}

/* ---- 單一課程頁 ---- */

async function renderLesson(seq, key, id) {
  loadingPage();
  let data;
  try {
    await loadState();
    data = await loadLang(key);
  } catch (e) { if (!stale(seq)) errorPage('#/lessons/' + key); return; }
  if (stale(seq)) return;
  const lessons = lessonsOf(data);
  const idx = lessons.findIndex(ls => ls.id === id);
  if (idx === -1) {
    setPage(
      backBtn('#/lessons/' + key, '返回課程列表'),
      h('div', { class: 'card center-card' },
        h('p', { class: 'big-emoji' }, '😢'),
        h('p', null, '找不到這一課，請回課程列表重新選擇。'),
        h('button', { type: 'button', class: 'btn btn-primary', onclick: () => go('#/lessons/' + key) }, '返回課程列表')
      )
    );
    return;
  }
  const lesson = lessons[idx];
  const nextLesson = lessons[idx + 1] || null;
  const doneBefore = lessonsDoneSet(key).has(id);
  const color = langColor(key);

  let completing = false;
  /** 完課：POST /api/lesson（重複標記由後端冪等處理）→ toast → 前往 nextHash */
  async function completeLesson(nextHash) {
    if (completing) return;
    completing = true;
    let res;
    try {
      res = await api('/api/lesson', { method: 'POST', body: { lang: key, id: id } });
    } catch (e) { completing = false; return; } // toast 已由 api() 顯示
    if (res && Array.isArray(res.lessons_done)) {
      const info = findLangInfo(key);
      if (info) info.lessons_done = res.lessons_done.slice(); // 同步快取，列表立即打勾
    }
    if (stale(seq)) return;
    showToast('已完成「' + (lesson.title || id) + '」🎉', true);
    go(nextHash);
  }

  function finishButtons() {
    const btns = [
      h('button', {
        type: 'button', class: 'btn btn-primary btn-big',
        onclick: () => completeLesson('#/lessons/' + key)
      }, '完成本課 ✓')
    ];
    if (nextLesson) {
      btns.push(h('button', {
        type: 'button', class: 'btn btn-ghost',
        onclick: () => completeLesson('#/lesson/' + key + '/' + nextLesson.id)
      }, '下一課：' + (nextLesson.title || nextLesson.id)));
    }
    return h('div', { class: 'btn-row' }, btns);
  }

  function textNode(sec) {
    return h('p', { class: 'lesson-para' }, markupNodes(sec.body));
  }

  function tipNode(sec) {
    return h('div', { class: 'tip-box' }, '💡 ', markupNodes(sec.body));
  }

  function soundsNode(sec) {
    const cells = (Array.isArray(sec.items) ? sec.items : [])
      .filter(it => it && it.text)
      .map(it =>
        h('button', {
          type: 'button', class: 'sound-cell', title: '點擊發音',
          onclick: () => speak(key, it.text)
        },
          h('span', { class: 'sound-text' }, it.text),
          it.sub ? h('span', { class: 'sound-sub muted' }, it.sub) : null,
          it.zh ? h('span', { class: 'sound-zh muted' }, it.zh) : null
        ));
    return h('section', { class: 'lesson-section' },
      sec.title ? h('h3', { style: 'color:' + color }, sec.title) : null,
      h('div', { class: 'sound-grid' }, cells),
      h('p', { class: 'muted small' }, '🔊 點任一格可發音')
    );
  }

  function tableNode(sec) {
    return h('section', { class: 'lesson-section' },
      sec.title ? h('h3', { style: 'color:' + color }, sec.title) : null,
      h('div', { class: 'table-wrap' },
        h('table', { class: 'lesson-table' },
          (Array.isArray(sec.headers) && sec.headers.length)
            ? h('thead', null, h('tr', null, sec.headers.map(x => h('th', null, x))))
            : null,
          h('tbody', null, (Array.isArray(sec.rows) ? sec.rows : []).map(r =>
            h('tr', null, (Array.isArray(r) ? r : [r]).map(c => h('td', null, c)))))
        )
      )
    );
  }

  /** 隨堂測驗：逐題四選一、即時對錯上色＋詳解，答完顯示本課小結（含完課按鈕） */
  function quizNode(sec) {
    const questions = (Array.isArray(sec.questions) ? sec.questions : [])
      .filter(q => q && Array.isArray(q.options) && q.options.length > 0);
    const area = h('div', { class: 'lesson-quiz' });
    const s = { i: 0, correct: 0, locked: false };

    function renderSummary() {
      area.replaceChildren(
        h('div', { class: 'card center-card' },
          h('p', { class: 'big-emoji' }, questions.length > 0 && s.correct === questions.length ? '💯' : '🏁'),
          h('h2', null, '本課小結'),
          questions.length > 0
            ? h('p', { class: 'result-num', style: 'color:' + color },
                '隨堂測驗答對 ' + s.correct + '/' + questions.length +
                '（' + pct(s.correct, questions.length) + '）')
            : null,
          doneBefore ? h('p', { class: 'muted small' }, '這一課之前已完成，重做不會重複計數。') : null,
          finishButtons()
        )
      );
    }

    function renderQ() {
      if (s.i >= questions.length) { renderSummary(); return; }
      s.locked = false;
      const q = questions[s.i];
      const feedback = h('div', { class: 'quiz-feedback' });
      const nextWrap = h('div', { class: 'btn-row' });
      const optBtns = q.options.map((opt, oi) => {
        const btn = h('button', { type: 'button', class: 'btn opt-btn' }, opt);
        btn.addEventListener('click', () => {
          if (s.locked) return;
          s.locked = true;
          const ok = oi === q.answer;
          if (ok) s.correct++;
          for (const b of optBtns) b.disabled = true;
          if (optBtns[q.answer]) optBtns[q.answer].classList.add('opt-correct');
          if (!ok) btn.classList.add('opt-wrong');
          feedback.replaceChildren(...[
            h('p', { class: ok ? 'fb-ok' : 'fb-no' }, ok ? '✔ 答對了！' : '✘ 答錯了'),
            q.explain_zh ? h('div', { class: 'explain-box' },
              h('p', { class: 'fb-ans' }, '詳解'),
              h('p', null, q.explain_zh)) : null
          ].filter(Boolean));
          nextWrap.replaceChildren(
            h('button', {
              type: 'button', class: 'btn btn-primary',
              onclick: () => { s.i++; renderQ(); }
            }, s.i + 1 >= questions.length ? '看本課小結' : '下一題')
          );
        });
        return btn;
      });
      area.replaceChildren(
        h('div', { class: 'card quiz-card' },
          h('p', { class: 'progress-text' },
            '隨堂測驗 第 ' + (s.i + 1) + '/' + questions.length + ' 題・答對 ' + s.correct),
          h('p', { class: 'quiz-question' }, q.question),
          h('div', { class: 'opt-list' }, optBtns),
          feedback,
          nextWrap
        )
      );
    }

    renderQ();
    return h('section', { class: 'lesson-section' },
      sec.title ? h('h3', { style: 'color:' + color }, sec.title) : null,
      area
    );
  }

  // 依序渲染 sections：連續的內容節合成一張卡片，quiz 自成一區；未知型別跳過
  const flow = [];
  let buf = [];
  function flush() {
    if (buf.length) { flow.push(h('div', { class: 'card lesson-card' }, buf)); buf = []; }
  }
  let hasQuiz = false;
  for (const sec of (Array.isArray(lesson.sections) ? lesson.sections : [])) {
    if (!sec || typeof sec !== 'object') continue;
    if (sec.type === 'text') buf.push(textNode(sec));
    else if (sec.type === 'tip') buf.push(tipNode(sec));
    else if (sec.type === 'sounds') buf.push(soundsNode(sec));
    else if (sec.type === 'table') buf.push(tableNode(sec));
    else if (sec.type === 'quiz') { hasQuiz = true; flush(); flow.push(quizNode(sec)); }
  }
  flush();
  if (!hasQuiz) {
    // 資料缺 quiz 時（容錯）：仍可直接完課
    flow.push(h('div', { class: 'card center-card' },
      doneBefore ? h('p', { class: 'muted small' }, '這一課之前已完成，重做不會重複計數。') : null,
      finishButtons()));
  }

  setPage(
    backBtn('#/lessons/' + key, '返回課程列表'),
    h('div', { class: 'lang-page-header', style: 'border-color:' + color },
      h('p', { class: 'muted small lesson-kicker' },
        '第 ' + (idx + 1) + ' 課' +
        (lesson.minutes ? '・約 ' + lesson.minutes + ' 分鐘' : '') +
        (doneBefore ? '・✓ 已完成' : '')),
      h('h1', { style: 'color:' + color }, lesson.title || id),
      lesson.subtitle ? h('p', { class: 'muted' }, lesson.subtitle) : null
    ),
    h('div', { class: 'lesson-flow' }, flow)
  );
}

        backBtn(backHash, key === 'all' ? '返回首頁' : '返回'),

          h('span', { class: 'progress-text' }, (s.i + 1) + '/' + cards.length)
        )
      ),
      h('h1', { class: 'flash-title', style: 'color:' + color }, title),
      h('div', { class: 'flash-wrap' }, flashCard),
      h('div', { class: 'flash-tools' }, speakBtn(card.lang, card.text)),
      s.flipped
        ? h('div', { class: 'btn-row answer-row' },
            h('button', { type: 'button', class: 'btn btn-good btn-big', onclick: () => answer(true, 'fast') }, '秒答（1）'),
            h('button', { type: 'button', class: 'btn btn-mid btn-big', onclick: () => answer(true, 'hesitant') }, '猶豫了一下（2）'),
            h('button', { type: 'button', class: 'btn btn-bad btn-big', onclick: () => answer(false, null) }, '不記得（3）')
          )

    );
  }

  setKeyHandler((e) => {
    if (e.isComposing || e.keyCode === 229) return;
    if (s.done) return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); }
    else if (e.key === '1' && s.flipped) answer(true, 'fast');
    else if (e.key === '2' && s.flipped) answer(true, 'hesitant');
    else if (e.key === '3' && s.flipped) answer(false, null);
    else if (e.key === 's' || e.key === 'S') speak(cards[s.i].lang, cards[s.i].text);
  });

  renderCard();
}

/* ===================== 智慧練習 ===================== */

/** 智慧練習用四選一：干擾項取同語言單字池、依顯示值去重（以 text 判斷同一張卡） */
function buildSmartOptions(card, pool, field) {
  const p = precisionOptions(card, field);
  if (p) return p;
  const seen = new Set([card[field]]);
  const sameTopic = [];
  const others = [];
  for (const it of shuffle(pool)) {
    if (it.text === card.text) continue;
    const v = it[field];
    if (!v || seen.has(v)) continue;
    seen.add(v);
    if (card.topic && it.topic === card.topic) sameTopic.push(it);
    else others.push(it);
  }
  return shuffle([card].concat(sameTopic.concat(others).slice(0, 3)));
}

/** cloze 顯示文字：優先用後端帶的 cloze 欄位，否則以例句挖空 */
function clozeText(card) {
  if (card.cloze) return String(card.cloze);
  if (card.example && String(card.example).indexOf(card.text) !== -1) {
    return String(card.example).split(card.text).join('＿＿＿');
  }
  return '';
}

/** 後端未帶 format 時的保險：依 lv 對應題型階梯 */
function smartFormat(card) {
  if (card.format) return card.format;
  if (card.verify) return card.verify;
  const lv = typeof card.lv === 'number' ? card.lv : 0;
  const canCloze = clozeText(card) !== '';
  // 日文含漢字（且取得到假名）items 的專屬階梯：lv1 假名認讀、lv2 才進 mc_z2f
  if (jpKana(card)) {
    if (lv <= 0) return 'mc_f2z';
    if (lv === 1) return 'mc_kana';
    if (lv === 2) return 'mc_z2f';
    if (lv === 3) return 'spell';
    if (lv === 4) return 'listen_mc';
    return shuffle(['spell', 'listen_mc', 'mc_kana'].concat(canCloze ? ['cloze'] : []))[0];
  }
  if (lv <= 0) return 'mc_f2z';
  if (lv === 1) return 'mc_z2f';
  if (lv === 2) return 'spell';
  if (lv === 3) return 'listen_mc';
  if (lv === 4) return canCloze ? 'cloze' : 'spell';
  return shuffle(['spell', 'listen_mc'].concat(canCloze ? ['cloze'] : []))[0];
}

/** 智慧練習拼寫比對：沿用既有 normAns 與 spellCandidates 規則 */
function smartSpellOk(card, raw) {
  if (baseLang(card.lang) === 'english') {
    return raw.trim().toLowerCase() === String(card.text).trim().toLowerCase();
  }
  const n = normAns(raw);
  return n !== '' && spellCandidates(card).indexOf(n) !== -1;
}

async function renderSmart(seq, key) {

  const backHash = key === 'all' ? '#/home' : '#/lang/' + key;

  if (cards.length === 0) {

      )
    );

  // 預載各語言單字池（供四選一干擾項）
  await Promise.all(
    Array.from(new Set(cards.map(c => c.lang))).map(l => loadLang(l).catch(() => null))
  );
  if (stale(seq)) return;

  const s = { i: 0, answered: 0, correct: 0, upgrades: 0, maint: 0, verifyList: [], done: false };
  // 整場都是維持卡＝今日到期卡已清空，後端只回傳維持複習
  const allMaint = cards.every(c => c.maintenance);
  let cur = null; // 當前題目的鍵盤操作：{ pick, next, replay }

  const page = setPage(h('div', { id: 'smart-area' }));
  const area = page.querySelector('#smart-area');

  setKeyHandler((e) => {
    if (e.isComposing || e.keyCode === 229) return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
    if (!cur || s.done) return;
    if (e.key >= '1' && e.key <= '4' && cur.pick) cur.pick(Number(e.key) - 1);
    else if (e.key === 'Enter' && cur.next) { e.preventDefault(); cur.next(); }
    else if ((e.key === 's' || e.key === 'S') && cur.replay) cur.replay();
  });

  function renderSummary() {
    s.done = true;
    cur = null;
    const verifyRows = s.verifyList.map(v =>
      h('li', { class: 'verify-item' },
        h('span', { class: 'verify-text' }, v.text),
        v.zh ? h('span', { class: 'muted' }, '（' + v.zh + '）') : null,
        h('span', { class: 'chip chip-static' }, formatName(v.verify))
      ));
    area.replaceChildren(
      h('div', null,
        backBtn(backHash, key === 'all' ? '返回首頁' : '返回'),
        h('div', { class: 'card center-card' },
          h('p', { class: 'big-emoji' }, s.answered > 0 && s.correct === s.answered ? '💯' : '🏁'),
          h('h2', null, '智慧練習結束'),
          h('p', { class: 'result-num', style: 'color:' + color },
            '答對率 ' + pct(s.correct, s.answered) + '（' + s.correct + '/' + s.answered + '）'),
          h('p', null, '掌握度升級：' + s.upgrades + ' 個字'),
          s.maint > 0 ? h('p', null, '維持複習：' + s.maint + ' 張') : null,
          verifyRows.length
            ? h('div', { class: 'verify-list' },
                h('h3', null, '這些字之後會換題型再確認'),
                h('ul', null, verifyRows))
            : null,
          h('div', { class: 'btn-row' },
            h('button', { type: 'button', class: 'btn btn-primary', onclick: () => onRoute() }, '再來一輪'),
            h('button', { type: 'button', class: 'btn btn-ghost', onclick: () => go('#/home') }, '回首頁')
          )
        )
      )
    );
  }

  function renderQ() {
    if (s.i >= cards.length) { renderSummary(); return; }
    const card = cards[s.i];
    const cardColor = key === 'all' ? langColor(card.lang) : color;
    let fmt = smartFormat(card);
    // 容錯：未知題型一律退回 mc_f2z（顯示與回報的 mode 保持一致）
    if (['mc_f2z', 'mc_kana', 'mc_z2f', 'spell', 'listen_mc', 'cloze'].indexOf(fmt) === -1) fmt = 'mc_f2z';
    if (fmt === 'cloze' && clozeText(card) === '') fmt = 'spell';
    if (fmt === 'mc_kana' && !jpKana(card)) fmt = 'mc_f2z'; // 取不到假名（或非日文含漢字）退回一般題
    const base = baseLang(card.lang);
    const showReading = card.reading && (base === 'japanese' || base === 'korean');
    const readingPart = card.reading ? '（' + card.reading + '）' : '';
    const pool = (state.langCache[card.lang] && state.langCache[card.lang].items) || [];

    const feedback = h('div', { class: 'quiz-feedback' });
    const nextWrap = h('div', { class: 'btn-row' });

    let t0 = 0;       // 本題 render 完成的時間（performance.now()）
    let ms = 0;       // 第一次作答動作為止的毫秒數
    let ok = false;
    let revealed = false;
    let posting = false;
    let kanjiLine = null; // 日文假名題面：作答後揭曉漢字用（對錯皆顯示）

    function stopClock() { ms = Math.max(1, Math.round(performance.now() - t0)); }

    let advanced = false;
    function advance() {
      // 防重複前進（下一題鈕＋Enter＋自動 timer）；已切頁時不再前進（避免在背景出題、自動播音）
      if (advanced || s.done || stale(seq)) return;
      advanced = true;
      s.i++;
      renderQ();
    }

    /** 作答當下立即送出 POST（答對帶 confidence:"sure"，答錯不帶），回應後補顯示掌握度變化 */
    async function submitResult() {
      if (posting) return;
      posting = true;
      let res = null;
      try {
        res = await postAnswer(card.lang, card.text, ok, true,
          { mode: fmt, ms: ms, confidence: ok ? 'sure' : null });
      } catch (e) {
        if (ok) advance(); // 答錯時保留回饋畫面，仍可按「下一題」
        return;
      }
      if (s.done || stale(seq)) return;
      if (res && typeof res.lv === 'number') {
        const delta = typeof res.delta === 'number' ? res.delta : 0;
        const oldLv = res.lv - delta;
        if (delta > 0) s.upgrades++;
        if (res.verify_next) s.verifyList.push({ text: card.text, zh: card.zh, verify: res.verify_next });
        const extraNodes = [
          h('p', { class: 'lv-line ' + (delta > 0 ? 'lv-up' : (delta < 0 ? 'lv-down' : 'lv-keep')) },
            '掌握度 ' + oldLv + ' → ' + res.lv +
            (delta > 0 ? '（+' + delta + '）' : (delta < 0 ? '（' + delta + '）' : '（不變）'))),
          res.reason_zh ? h('p', { class: 'reason-line muted small' }, res.reason_zh) : null
        ].filter(Boolean);
        feedback.append(...extraNodes);
      }
      if (ok) addTimer(advance, 1100); // 答對：稍候自動進下一題（timer 登記在本頁，切頁即清除）
    }

    /** 作答後回饋並立即送出：答對自動前進；答錯顯示正解＋note，按「下一題」（或 Enter）才前進 */
    function showFeedback(ansLine, ansAlways) {
      revealed = true;
      s.answered++;
      if (ok) s.correct++;
      if (card.maintenance) s.maint++;
      const fbNodes = [
        h('p', { class: ok ? 'fb-ok' : 'fb-no' }, ok ? '✔ 答對了！' : '✘ 答錯了'),
        (!ok || ansAlways) ? h('p', { class: 'fb-ans' }, (ok ? '答案：' : '正解：') + ansLine) : null,
        kanjiLine ? h('p', { class: 'fb-ans' }, kanjiLine) : null,
        (!ok && card.note) ? h('p', { class: 'fb-note muted' }, '💡 ' + card.note) : null,
        card.reason_zh ? h('p', { class: 'reason-line muted small' }, '💬 ' + card.reason_zh) : null
      ].filter(Boolean);
      feedback.replaceChildren(...fbNodes);
      const replay = fmt === 'listen_mc' ? () => speak(card.lang, card.text) : null;
      if (ok) {
        nextWrap.replaceChildren();
        cur = { replay: replay };
      } else {
        const nextBtn = h('button', { type: 'button', class: 'btn btn-primary', onclick: advance }, '下一題');
        nextWrap.replaceChildren(nextBtn);
        cur = { next: advance, replay: replay };
        nextBtn.focus();
      }
      submitResult();
    }

    function mcBlock(field, ansLine, ansAlways) {
      const options = buildSmartOptions(card, pool, field);
      const optBtns = options.map((opt, idx) => {
        // 日文選項以假名顯示（pool 項目沒有 lang 欄位，語言以 card.lang 為準）；比對仍用物件同一性
        const kana = field === 'text' ? jpKana(opt, card.lang) : null;
        const btn = h('button', { type: 'button', class: 'btn opt-btn' }, kana || opt[field]);
        btn.addEventListener('click', () => choose(idx));
        return btn;
      });
      function choose(idx) {
        if (revealed || idx < 0 || idx >= optBtns.length) return;
        stopClock(); // 第一次作答動作停止計時
        ok = options[idx] === card;
        for (const b of optBtns) b.disabled = true;
        optBtns[options.indexOf(card)].classList.add('opt-correct');
        if (!ok) optBtns[idx].classList.add('opt-wrong');
        showFeedback(ansLine, ansAlways);
      }
      return { optBtns: optBtns, choose: choose };
    }

    function spellForm(ansLine) {
      const input = h('input', {
        type: 'text', class: 'spell-input', autocomplete: 'off',
        autocapitalize: 'off', spellcheck: 'false', placeholder: '輸入答案後按 Enter'
      });
      const form = h('form', { class: 'spell-form' },
        input,
        h('button', { type: 'button', class: 'btn btn-ghost', onclick: () => {
          if (revealed) return;
          stopClock();
          ok = false;
          input.disabled = true;
          showFeedback(ansLine, true);
        } }, '跳過'),
        h('button', { type: 'submit', class: 'btn btn-primary' }, '送出')
      );
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (revealed) return;
        stopClock(); // 送出拼寫＝第一次作答動作
        ok = smartSpellOk(card, input.value);
        input.disabled = true;
        showFeedback(ansLine, true);
      });
      // IME（注音／日文輸入法）選字時按 Enter 不送出
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.isComposing || e.keyCode === 229)) e.preventDefault();
      });
      return { input: input, form: form };
    }

    let qCard;
    let focusEl = null;
    if (fmt === 'mc_z2f') {
      // 選項以假名顯示時，答對也揭曉「正解＝漢字（reading）」

    area.replaceChildren(

  }

/* ===================== 選擇題測驗 ===================== */

/** 精準辨析選項：item 帶 distractors_zh 且問中文意思時，用策劃過的近義陷阱取代隨機干擾 */
function precisionOptions(item, field) {
  const ds = item.distractors_zh;
  if (field !== 'zh' || !Array.isArray(ds) || ds.length < 3) return null;
  const opts = ds.slice(0, 3).filter(v => v && v !== item.zh).map(v => ({ zh: v }));
  if (opts.length < 3) return null;
  return shuffle([item].concat(opts));
}

/** 產生四選一選項：干擾項優先取同 topic、依顯示值去重 */
function buildOptions(item, allItems, field) {
  const p = precisionOptions(item, field);
  if (p) return p;
  const ansVal = item[field];
  const seen = new Set([ansVal]);
  const sameTopic = [];
  const others = [];
  for (const it of shuffle(allItems)) {
    if (it === item) continue;
    const v = it[field];
    if (!v || seen.has(v)) continue;
    seen.add(v);
    if (it.topic === item.topic) sameTopic.push(it);
    else others.push(it);
  }
  const distractors = sameTopic.concat(others).slice(0, 3);
  return shuffle([item].concat(distractors));
}

async function renderQuiz(seq, key) {
  loadingPage();
  let data;
  try { data = await loadLang(key); } catch (e) { if (!stale(seq)) errorPage('#/lang/' + key); return; }
  if (stale(seq)) return;
  const items = (data && data.items) || [];
  const color = langColor(key);
  const base = baseLang(key);

  const setup = { dir: 'f2z', count: 10 };

  function renderSetup() {
    function segBtn(label, on, fn) {
      return h('button', { type: 'button', class: 'seg-btn' + (on ? ' active' : ''), onclick: fn }, label);
    }
    setPage(
      backBtn('#/lang/' + key, '返回'),
      h('h1', { style: 'color:' + color }, '✅ 選擇題測驗'),
      h('div', { class: 'card setup-card' },
        h('h3', null, '出題方向'),
        h('div', { class: 'seg' },
          segBtn('外語 → 中文', setup.dir === 'f2z', () => { setup.dir = 'f2z'; renderSetup(); }),
          segBtn('中文 → 外語', setup.dir === 'z2f', () => { setup.dir = 'z2f'; renderSetup(); })
        ),
        h('h3', null, '題數'),
        h('div', { class: 'seg' },
          segBtn('10 題', setup.count === 10, () => { setup.count = 10; renderSetup(); }),
          segBtn('20 題', setup.count === 20, () => { setup.count = 20; renderSetup(); }),
          segBtn('全部（' + items.length + '）', setup.count === 0, () => { setup.count = 0; renderSetup(); })
        ),
        h('button', { type: 'button', class: 'btn btn-primary btn-big start-btn', onclick: startQuiz }, '開始測驗')
      )
    );
  }

  function startQuiz() {
    cleanup();
    const n = setup.count === 0 ? items.length : Math.min(setup.count, items.length);
    const qs = shuffle(items).slice(0, n);
    const s = { i: 0, correct: 0, locked: false, autoTimer: null };

    function renderEnd() {
      setPage(
        backBtn('#/lang/' + key, '返回'),
        h('div', { class: 'card center-card' },
          h('p', { class: 'big-emoji' }, s.correct === qs.length ? '💯' : '🏁'),
          h('h2', null, '測驗結束'),
          h('p', { class: 'result-num', style: 'color:' + color },
            '答對 ' + s.correct + '/' + qs.length + '（' + pct(s.correct, qs.length) + '）'),
          h('div', { class: 'btn-row' },
            h('button', { type: 'button', class: 'btn btn-primary', onclick: renderSetup }, '再測一次'),
            h('button', { type: 'button', class: 'btn btn-ghost', onclick: () => go('#/lang/' + key) }, '返回')
          )
        )
      );
    }

    function renderQ() {
      if (s.i >= qs.length) { renderEnd(); return; }
      s.locked = false;
      const item = qs[s.i];
      const qField = setup.dir === 'f2z' ? 'text' : 'zh';
      const aField = setup.dir === 'f2z' ? 'zh' : 'text';
      const options = buildOptions(item, items, aField);
      const feedback = h('div', { class: 'quiz-feedback' });
      const nextBtnWrap = h('div', { class: 'btn-row' });

      function goNext() {
        if (s.autoTimer) { clearTimeout(s.autoTimer); s.autoTimer = null; }
        s.i++;
        renderQ();
      }

      const optBtns = options.map(opt => {
        const btn = h('button', { type: 'button', class: 'btn opt-btn' }, opt[aField]);
        btn.addEventListener('click', () => {
          if (s.locked) return;
          s.locked = true;
          const ok = opt === item;
          if (ok) s.correct++;
          for (const b of optBtns) {
            b.disabled = true;
            if (b === btn && !ok) b.classList.add('opt-wrong');
          }
          const rightBtn = optBtns[options.indexOf(item)];
          rightBtn.classList.add('opt-correct');
          const ansLine = setup.dir === 'z2f' && item.reading
            ? item.text + '（' + item.reading + '）' : item[aField];
          feedback.append(...[
            h('p', { class: ok ? 'fb-ok' : 'fb-no' }, ok ? '✔ 答對了！' : '✘ 答錯了'),
            h('p', { class: 'fb-ans' }, '正解：' + ansLine),
            item.note ? h('p', { class: 'fb-note muted' }, '💡 ' + item.note) : null
          ].filter(Boolean));
          nextBtnWrap.append(
            h('button', { type: 'button', class: 'btn btn-primary', onclick: goNext }, '下一題')
          );
          postAnswerQuiet(key, item.text, ok);
          if (ok) s.autoTimer = addTimer(goNext, 1000);
        });
        return btn;
      });

      setPage(
        h('div', { class: 'flash-top' },
          backBtn('#/lang/' + key, '返回'),
          h('span', { class: 'progress-text' }, '第 ' + (s.i + 1) + '/' + qs.length + ' 題・答對 ' + s.correct)
        ),
        h('div', { class: 'card quiz-card' },
          h('p', { class: 'muted small' }, setup.dir === 'f2z' ? '選出正確的中文意思' : '選出正確的外語'),
          h('p', { class: 'quiz-question' }, item[qField]),
          (setup.dir === 'f2z' && item.reading && (base === 'japanese' || base === 'korean'))
            ? h('p', { class: 'muted' }, item.reading) : null,
          h('div', { class: 'opt-list' }, optBtns),
          feedback,
          nextBtnWrap
        )
      );
    }

    renderQ();
  }

  if (items.length < 4) {
    setPage(backBtn('#/lang/' + key, '返回'),
      h('div', { class: 'card center-card' }, h('p', null, '單字數不足，無法出題。')));
    return;
  }
  renderSetup();
}

/* ===================== 拼寫練習 ===================== */

/** 取得可接受答案（正規化後）：原文、reading、reading 的羅馬拼音／原文部分 */
function spellCandidates(item) {
  const cands = [item.text];
  if (item.reading) {
    cands.push(item.reading);
    const romaji = String(item.reading).replace(/[^\x20-\x7E]/g, '');
    if (romaji.trim()) cands.push(romaji);
    const native = String(item.reading).replace(/[\x21-\x7E]/g, '');
    if (native.trim()) cands.push(native);
  }
  return cands.map(normAns).filter(Boolean);
}

function romajiFirstLetter(item) {
  const romaji = String(item.reading || '').replace(/[^A-Za-z]/g, '');
  return romaji ? romaji[0] : '';
}

async function renderSpell(seq, key) {
  loadingPage();
  let data;
  try { data = await loadLang(key); } catch (e) { if (!stale(seq)) errorPage('#/lang/' + key); return; }
  if (stale(seq)) return;
  const items = (data && data.items) || [];
  const color = langColor(key);
  const base = baseLang(key);
  const isEnglish = base === 'english';

  function startRound() {
    cleanup();
    const round = shuffle(items).slice(0, Math.min(10, items.length));
    const s = { i: 0, correct: 0, locked: false };

    function renderEnd() {
      setPage(
        backBtn('#/lang/' + key, '返回'),
        h('div', { class: 'card center-card' },
          h('p', { class: 'big-emoji' }, s.correct === round.length ? '💯' : '🏁'),
          h('h2', null, '拼寫練習結束'),
          h('p', { class: 'result-num', style: 'color:' + color },
            '答對 ' + s.correct + '/' + round.length + '（' + pct(s.correct, round.length) + '）'),
          h('div', { class: 'btn-row' },
            h('button', { type: 'button', class: 'btn btn-primary', onclick: startRound }, '再來一輪'),
            h('button', { type: 'button', class: 'btn btn-ghost', onclick: () => go('#/lang/' + key) }, '返回')
          )
        )
      );
    }

    function checkInput(item, raw) {
      if (isEnglish) {
        return raw.trim().toLowerCase() === String(item.text).trim().toLowerCase();
      }
      const n = normAns(raw);
      return n !== '' && spellCandidates(item).indexOf(n) !== -1;
    }

    function renderQ() {
      if (s.i >= round.length) { renderEnd(); return; }
      s.locked = false;
      const item = round[s.i];
      const input = h('input', {
        type: 'text', class: 'spell-input', autocomplete: 'off',
        autocapitalize: 'off', spellcheck: 'false', placeholder: '輸入答案後按 Enter'
      });
      const feedback = h('div', { class: 'quiz-feedback' });
      const nextWrap = h('div', { class: 'btn-row' });

      let advanced = false;
      function goNext() {
        if (advanced) return;
        advanced = true;
        s.i++;
        renderQ();
      }

      function reveal(ok) {
        s.locked = true;
        input.disabled = true;
        if (ok) s.correct++;
        const readingPart = item.reading ? '（' + item.reading + '）' : '';
        feedback.replaceChildren(
          h('p', { class: ok ? 'fb-ok' : 'fb-no' }, ok ? '✔ 答對了！' : '✘ 不對喔'),
          h('p', { class: 'fb-ans' }, '答案：' + item.text + readingPart),
          item.note ? h('p', { class: 'fb-note muted' }, '💡 ' + item.note) : null
        );
        nextWrap.replaceChildren(
          speakBtn(key, item.text),
          h('button', { type: 'button', class: 'btn btn-primary', onclick: goNext }, '下一題')
        );
        postAnswerQuiet(key, item.text, ok);
        if (ok) addTimer(goNext, 1200);
      }

      const form = h('form', { class: 'spell-form' },
        input,
        h('button', { type: 'button', class: 'btn btn-ghost', onclick: () => {
          if (s.locked) return;
          let hint = '提示：首字是「' + String(item.text)[0] + '」';
          if (!isEnglish) {
            const r = romajiFirstLetter(item);
            if (r) hint += '，羅馬拼音以「' + r + '」開頭';
          }
          feedback.replaceChildren(h('p', { class: 'fb-hint' }, hint));
        } }, '提示'),
        h('button', { type: 'button', class: 'btn btn-ghost', onclick: () => { if (!s.locked) reveal(false); } }, '跳過'),
        h('button', { type: 'submit', class: 'btn btn-primary' }, '送出')
      );
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (s.locked) return;
        reveal(checkInput(item, input.value));
      });
      // IME（注音／日文輸入法）選字時按 Enter 不送出
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.isComposing || e.keyCode === 229)) e.preventDefault();
      });

      setPage(
        h('div', { class: 'flash-top' },
          backBtn('#/lang/' + key, '返回'),
          h('span', { class: 'progress-text' }, '第 ' + (s.i + 1) + '/' + round.length + ' 題・答對 ' + s.correct)
        ),
        h('div', { class: 'card quiz-card' },
          h('h1', { class: 'inline-title', style: 'color:' + color }, '⌨️ 拼寫練習'),
          h('p', null, h('span', { class: 'chip chip-static' }, item.topic || '一般')),
          h('p', { class: 'quiz-question' }, item.zh),
          h('p', { class: 'muted small' },
            isEnglish ? '請輸入英文單字（不分大小寫）' : '可輸入原文或羅馬拼音'),
          form,
          feedback,
          nextWrap
        )
      );
      input.focus();
    }

    renderQ();
  }

  if (items.length === 0) {
    setPage(backBtn('#/lang/' + key, '返回'),
      h('div', { class: 'card center-card' }, h('p', null, '目前沒有單字資料。')));
    return;
  }
  startRound();
}

async function renderAlphabet(seq, key) {
  loadingPage();
  let data;

      h('div', { class: 'card center-card' }, h('p', null, '此語言沒有字母資料。')));
    return;
  }

  const groups = [];
  for (const a of alphabet) {
    if (groups.indexOf(a.group) === -1) groups.push(a.group);

      renderTabs(),
      h('p', { class: 'muted small' }, '點任一格可發音'),

      h('button', {
        type: 'button',
        class: 'chip' + (ui.activeGroups.has(g) ? ' on' : ''),

          if (ui.activeGroups.has(g)) {
            if (ui.activeGroups.size > 1) ui.activeGroups.delete(g);

            ui.activeGroups.add(g);
          }
          render();
