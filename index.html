","sub":"no","zh":""},{"text":"あした","sub":"a-shi-ta ashita","zh":"明天"},{"text":"きのう","sub":"ki-no-u kinou","zh":"昨天"},{"text":"ねこ","sub":"ne-ko neko","zh":"貓"},{"text":"いち","sub":"i-chi ichi","zh":"一"},{"text":"に","sub":"ni","zh":"二"},{"text":"さん","sub":"sa-n san","zh":"三"}]},{"type":"quiz","title":"小試身手","questions":[{"question":"「し」的羅馬拼音是？","options":["si","shi","chi","tsu"],"answer":1,"explain_zh":"し是さ行的例外，唸 shi 不是 si。chi 是ち、tsu 是つ，這三個例外要一起記。"},{"question":"下面哪個假名唸「tsu」？","options":["ち","つ","て","と"],"answer":1,"explain_zh":"つ唸 tsu（像小海浪）。ち唸 chi、て唸 te、と唸 to。"},{"question":"「あした（明天）」的第二個假名「し」屬於哪一行？","options":["あ行","さ行","た行","な行"],"answer":1,"explain_zh":"し是さ行的い段（sa shi su se so 的第二個）。雖然發音是 shi，家族仍然是 s 家的。"},{"question":"「く」的發音是？","options":["ku","ke","ko","ka"],"answer":0,"explain_zh":"く在か行的う段，k＋u＝ku。け是 ke、こ是 ko、か是 ka。"}]}]},{"id":"jp-04","title":"は〜ん：五十音完賽","subtitle":"剩下 21 個一次收完，含「は唸 wa」的例外預告","minutes":8,"sections":[{"type":"text","body":"今天把剩下的假名一次收完：は、ま、や、ら、わ行，加上特立獨行的「ん」——收完這 21 個，46 個基本假名就全部到手了！這幾行大致都很乖，只有幾個特別的地方，我會沿路提醒你。"},{"type":"sounds","title":"點擊聽發音：は行・ま行","items":[{"text":"は","sub":"ha","zh":""},{"text":"ひ","sub":"hi","zh":""},{"text":"ふ","sub":"fu（介於 hu 和 fu 之間，輕輕吹氣）","zh":""},{"text":"へ","sub":"he","zh":""},{"text":"ほ","sub":"ho","zh":""},{"text":"ま","sub":"ma","zh":""},{"text":"み","sub":"mi","zh":""},{"text":"む","sub":"mu","zh":""},{"text":"め","sub":"me","zh":""},{"text":"も","sub":"mo","zh":""}]},{"type":"text","body":"先埋個伏筆：【は當助詞的時候唸 wa，不唸 ha】。你一定聽過「こんにちは」（konnichiwa）——句尾那個字其實就是は！因為它原本是助詞，所以保留了 wa 的唸法。第 9 課講助詞時會完整解釋，現在先記口訣：句子中間或句尾孤零零的は，十之八九唸 wa。"},{"type":"sounds","title":"點擊聽發音：や行・ら行・わ行・ん","items":[{"text":"や","sub":"ya","zh":""},{"text":"ゆ","sub":"yu","zh":""},{"text":"よ","sub":"yo","zh":""},{"text":"ら","sub":"ra（舌尖輕彈上顎）","zh":""},{"text":"り","sub":"ri","zh":""},{"text":"る","sub":"ru","zh":""},{"text":"れ","sub":"re","zh":""},{"text":"ろ","sub":"ro","zh":""},{"text":"わ","sub":"wa","zh":""},{"text":"を","sub":"o（只當助詞使用）","zh":""},{"text":"ん","sub":"n（唯一沒有母音的假名）","zh":""}]},{"type":"sounds","title":"點擊聽發音：馬上就能唸的單字","items":[{"text":"わたし","sub":"wa-ta-shi watashi","zh":"我"},{"text":"ひま","sub":"hi-ma hima","zh":"有空、閒"},{"text":"ほんとう","sub":"ho-n-to-u hontou","zh":"真的"},{"text":"またあした","sub":"ma-ta-a-shi-ta mata ashita","zh":"明天見"}]},{"type":"tip","body":"ら行不是英文的 R 也不是 L：舌尖在上顎輕輕彈一下就好，聽起來介於「ㄌ」和「ㄖ」之間。唸得不夠標準沒關係，日本人一定聽得懂。"},{"type":"quiz","title":"小試身手","questions":[{"question":"「こんにちは」句尾的「は」唸什麼？","options":["ha","wa","ba","pa"],"answer":1,"explain_zh":"這個は原本是助詞，所以唸 wa——整句是 konnichiwa。は當助詞時一律唸 wa，第 9 課會再詳細說明。"},{"question":"唯一一個不含母音的假名是？","options":["ん","を","わ","む"],"answer":0,"explain_zh":"ん只有鼻音 n，沒有母音，也不能當一個字的開頭。を唸 o、わ唸 wa、む唸 mu，都含母音。"},{"question":"「を」平常什麼時候會用到？","options":["當名詞的開頭","只當助詞使用","表示疑問","外來語專用"],"answer":1,"explain_zh":"現代日文的を只有一個工作：當助詞標示動作對象（第 9 課登場），發音同お（o）。一般單字裡不會出現。"},{"question":"「ふ」的發音比較接近？","options":["用力咬唇的英文 F","輕輕吹氣的 fu","捲舌的 hu","台語的「褲」"],"answer":1,"explain_zh":"ふ介於 hu 和 fu 之間：嘴唇不咬、不太圓，像吹蠟燭前輕輕吐氣。Hepburn 拼音寫作 fu。"},{"question":"「ほんとう（真的）」裡的「ん」，羅馬拼音寫成？","options":["m","n","ng","不用寫"],"answer":1,"explain_zh":"ん的 Hepburn 拼音是 n：ho-n-to-u → hontou。它自己占一拍，唸的時候不要吞掉。"}]}]},{"id":"jp-05","title":"濁音與半濁音","subtitle":"兩個小記號，舊假名變新聲音","minutes":6,"sections":[{"type":"text","body":"好消息：接下來不用再背新形狀了！日文用兩個小記號讓舊假名變出新聲音：【濁點「゛」（右上角兩點）】和【半濁點「゜」（右上角小圈圈）】。加上濁點，聲音會「變濁」——原本清脆的 k、s、t、h，變成聲帶震動的 g、z、d、b。你可以把手放在喉嚨上感覺：唸 ka 喉嚨不震，唸 ga 會震。"},{"type":"table","title":"點點圈圈變音表","headers":["原本","加記號之後","變化規律"],"rows":[["か行（k）","が行（g）","か ka → が ga、こ ko → ご go"],["さ行（s）","ざ行（z）","さ sa → ざ za，但し shi → じ ji"],["た行（t）","だ行（d）","た ta → だ da，但ち → ぢ ji、つ → づ zu"],["は行（h）＋゛","ば行（b）","は ha → ば ba、ほ ho → ぼ bo"],["は行（h）＋゜","ぱ行（p）","は ha → ぱ pa、ひ hi → ぴ pi"]]},{"type":"sounds","title":"點擊聽發音：清濁比一比","items":[{"text":"か","sub":"ka（清）","zh":""},{"text":"が","sub":"ga（濁：か＋゛）","zh":""},{"text":"た","sub":"ta（清）","zh":""},{"text":"だ","sub":"da（濁：た＋゛）","zh":""},{"text":"は","sub":"ha（清）","zh":""},{"text":"ば","sub":"ba（濁：は＋゛）","zh":""},{"text":"ぱ","sub":"pa（半濁：は＋゜）","zh":""}]},{"type":"sounds","title":"點擊聽發音：用得到的單字","items":[{"text":"てがみ","sub":"te-ga-mi tegami","zh":"信（第 1 課的陷阱漢字「手紙」！）"},{"text":"ともだち","sub":"to-mo-da-chi tomodachi","zh":"朋友"},{"text":"げんき","sub":"ge-n-ki genki","zh":"有精神、健康"},{"text":"だいがくせい","sub":"da-i-ga-ku-se-i daigakusei","zh":"大學生"},{"text":"かんぱい","sub":"ka-n-pa-i kanpai","zh":"乾杯"}]},{"type":"tip","body":"小圈圈「゜」是は行的專利，只有ぱぴぷぺぽ這五個。另外じ（し＋゛）和ぢ（ち＋゛）發音相同，現代日文幾乎都用じ；ず和づ也一樣，都唸 zu。"},{"type":"quiz","title":"小試身手","questions":[{"question":"「か」加上濁點「゛」之後唸什麼？","options":["ga","ka","pa","ba"],"answer":0,"explain_zh":"か行加濁點變が行：k 變成 g，所以か ka → が ga。ba 是は＋゛、pa 是は＋゜。"},{"question":"小圈圈「゜」（半濁點）只能加在哪一行？","options":["か行","さ行","た行","は行"],"answer":3,"explain_zh":"半濁點是は行專用：はひふへほ → ぱぴぷぺぽ（pa pi pu pe po）。其他行都不能加圈圈。"},{"question":"「かんぱい（乾杯）」的「ぱ」是怎麼來的？","options":["は加濁點゛","は加半濁點゜","ば加濁點゛","一個全新的假名"],"answer":1,"explain_zh":"ぱ＝は＋小圈圈゜，唸 pa。加兩點゛的話是ば（ba），完全不同的音，喝酒前看清楚。"},{"question":"「じ」和「ぢ」的發音關係是？","options":["完全不同","發音相同，都唸 ji","只有聲調不同","ぢ不發音"],"answer":1,"explain_zh":"じ和ぢ在現代日文發音相同（ji），一般單字幾乎都寫じ。ず和づ也同理，都唸 zu。"}]}]},{"id":"jp-06","title":"拗音、促音、長音","subtitle":"きょ、っ、おう——長度和停頓會改變意思","minutes":7,"sections":[{"type":"text","body":"今天學三個讓發音「變形」的規則：拗音（合體音）、促音（停頓音）、長音（拉長音）。規則本身不難，但它們決定了日文的節奏，而且【長度不同，意思就完全不同】——這是台灣學習者最容易忽略、也最容易鬧笑話的地方。"},{"type":"text","body":"【拗音】＝ い段假名＋縮小的ゃ、ゅ、ょ，兩個字【合唸成一拍】。き＋小さいょ＝きょ（kyo），一口氣滑出來，不是 ki-yo 兩拍。你早就聽過拗音了：東京（とうきょう）、旅行（りょこう）、勉強（べんきょう）裡全都有。判斷訣竅：ゃゅょ寫得比較小就是拗音，正常大小的や、ゆ、よ就是獨立一拍。"},{"type":"sounds","title":"點擊聽發音：拗音練習","items":[{"text":"きょ","sub":"kyo（き＋小ょ，一拍）","zh":""},{"text":"しゃ","sub":"sha（し＋小ゃ）","zh":""},{"text":"じゅ","sub":"ju（じ＋小ゅ）","zh":""},{"text":"りょ","sub":"ryo（り＋小ょ）","zh":""},{"text":"きょう","sub":"kyou","zh":"今天"},{"text":"りょこう","sub":"ryokou","zh":"旅行"},{"text":"べんきょう","sub":"benkyou","zh":"唸書、學習"}]},{"type":"text","body":"【促音】＝ 縮小的っ。它本身不出聲，而是【停頓一拍】，像音樂的休止符：喉嚨憋住，再爆出下一個音。ちょっと（chotto，等一下）中間就要憋一下再說 to。你出門時說的いってきます（我出門了）也有促音。羅馬拼音的寫法是把下一個子音重複寫：chotto、ittekimasu。【長音】則相反＝把母音拉長一拍，例如お段後面加う：ありがとう的とう就是長音；え段後面加い通常也是長音，像第 5 課的だいがくせい，せい要拉長唸。"},{"type":"sounds","title":"點擊聽發音：長度決定意思！","items":[{"text":"おばさん","sub":"obasan（4 拍）","zh":"阿姨"},{"text":"おばあさん","sub":"obaasan（5 拍，多一拍長音）","zh":"奶奶、老太太"},{"text":"おじさん","sub":"ojisan","zh":"叔叔"},{"text":"おじいさん","sub":"ojiisan","zh":"爺爺、老先生"},{"text":"ちょっと","sub":"chotto（っ＝停一拍）","zh":"等一下、有一點"},{"text":"いってきます","sub":"ittekimasu","zh":"我出門了"}]},{"type":"tip","body":"日文的節奏單位是「拍」：拗音きょ算一拍、促音っ算一拍（無聲）、長音多一拍。心裡打拍子唸：おばさん 4 拍、おばあさん 5 拍——把阿姨叫成奶奶，友誼可能就沒了。"},{"type":"quiz","title":"小試身手","questions":[{"question":"「きょ」的正確唸法是？","options":["ki-yo，兩拍","kyo，一拍","ko，一拍","kya，一拍"],"answer":1,"explain_zh":"小的ょ表示拗音：き和ょ合體成 kyo，一口氣一拍唸完。如果寫成正常大小的きよ才是 ki-yo 兩拍。"},{"question":"促音「っ」要怎麼發音？","options":["唸 tsu","停頓一拍，不出聲","把前面的母音拉長","小聲唸一次"],"answer":1,"explain_zh":"小っ不發音，作用是停頓一拍：喉嚨憋住再爆出下一個音，像ちょっと的 cho（憋）to。正常大小的つ才唸 tsu。"},{"question":"「おばあさん」的意思是？","options":["阿姨","奶奶、老太太","姊姊","媽媽"],"answer":1,"explain_zh":"おばあさん（obaasan，5 拍）是奶奶；少一拍的おばさん（obasan，4 拍）才是阿姨。長音差一拍，輩分差一輩。"},{"question":"「ちょっと」總共有幾拍？","options":["2 拍","3 拍","4 拍","5 拍"],"answer":1,"explain_zh":"ちょ（拗音一拍）＋っ（促音一拍）＋と（一拍）＝3 拍。唸的時候：cho—（停）—to。"}]}]},{"id":"jp-07","title":"片假名與外來語","subtitle":"同樣的發音、不同的形狀，動漫迷的必修課","minutes":6,"sections":[{"type":"text","body":"好消息：片假名【不用學新發音】！它和平假名一一對應、同音不同形——就像英文的大寫和小寫。ア＝あ、カ＝か、ン＝ん。片假名負責外來語、外國人名地名和強調，對愛看動漫、愛喝手搖飲的你來說超實用：アニメ、ラーメン、タピオカ全是片假名。"},{"type":"table","title":"平假名 vs 片假名對照（節選）","headers":["平假名","片假名","羅馬拼音"],"rows":[["あ","ア","a"],["い","イ","i"],["う","ウ","u"],["か","カ","ka"],["さ","サ","sa"],["し","シ","shi"],["つ","ツ","tsu"],["そ","ソ","so"],["ら","ラ","ra"],["ん","ン","n"]]},{"type":"text","body":"片假名的長音不用う，直接畫一條線【ー】：ラーメン的ー就是把 ra 拉長一拍。另外有兩對雙胞胎要小心：【シ（shi）vs ツ（tsu）】和【ン（n）vs ソ（so）】。分辨口訣：シ和ン的小點偏【橫躺】、最後一筆由下往上挑；ツ和ソ的小點偏【站立】、最後一筆由上往下撇。"},{"type":"sounds","title":"點擊聽發音：你早就會的外來語","items":[{"text":"アニメ","sub":"a-ni-me anime","zh":"動畫"},{"text":"カラオケ","sub":"ka-ra-o-ke karaoke","zh":"卡拉OK"},{"text":"ラーメン","sub":"raamen（ー＝長音）","zh":"拉麵"},{"text":"ゲーム","sub":"geemu","zh":"電玩遊戲"},{"text":"ドラマ","sub":"do-ra-ma dorama","zh":"連續劇、日劇"},{"text":"スタンプ","sub":"su-ta-n-pu sutanpu","zh":"貼圖"},{"text":"タピオカミルクティー","sub":"tapioka mirukutii","zh":"珍珠奶茶"}]},{"type":"tip","body":"外來語多半來自英文，但發音已經「日文化」：要用日文的拍子唸才道地。ゲーム是 ge-e-mu 三拍，不是英文的 game——用英文發音日本人反而聽不懂。"},{"type":"quiz","title":"小試身手","questions":[{"question":"片假名和平假名的關係是？","options":["發音相同、形狀不同","發音不同、形狀相同","完全無關的兩套系統","片假名是漢字的簡體"],"answer":0,"explain_zh":"兩套假名一一對應、發音完全相同，只是字形不同、分工不同：平假名管文法，片假名管外來語。"},{"question":"片假名的長音記號是？","options":["う","゛","ー","っ"],"answer":2,"explain_zh":"片假名長音直接畫一條線ー，像ラーメン、ゲーム。う是平假名的長音寫法，゛是濁點，っ是促音。"},{"question":"「ラーメン」的意思是？","options":["咖哩","拉麵","壽司","烏龍麵"],"answer":1,"explain_zh":"ラーメン＝拉麵（ra-a-me-n，4 拍）。這個詞本來就是從中文「拉麵」傳過去的，繞了一圈又回來了。"},{"question":"「シ、ツ、ソ、ン」這四個雙胞胎裡，唸「tsu」的是哪一個？","options":["シ","ツ","ソ","ン"],"answer":1,"explain_zh":"ツ的兩個小點站立、最後一筆由上往下撇。シ是 shi（點橫躺、往上挑）、ソ是 so、ン是 n，這四個是片假名最有名的雙胞胎。"}]}]},{"id":"jp-08","title":"基本句型：です／ます","subtitle":"禮貌體是什麼？套公式開口說第一句日文","minutes":6,"sections":[{"type":"text","body":"文字關卡全部通過，開始說句子！日文分「常體」（對熟朋友、家人）和【禮貌體】（對剛認識的人、長輩、店員）。禮貌體的招牌就是句尾的【です】和【ます】——把「客氣」全部打包在句尾。零基礎先學禮貌體最安全，走遍日本都不失禮。"},{"type":"text","body":"最基本的句型：【A は B です】＝「A 是 B」。注意！這裡的は是助詞，唸 wa——第 4 課的伏筆正式回收。「私は台湾人です」（watashi wa taiwanjin desu）＝我是台灣人。把 B 換掉，就能介紹身分、職業、興趣，一個公式打天下。"},{"type":"table","title":"套公式練習：A は B です","headers":["日文","羅馬拼音","中文"],"rows":[["私は台湾人です","watashi wa taiwanjin desu","我是台灣人"],["私は大学生です","watashi wa daigakusei desu","我是大學生"],["私は会社員です","watashi wa kaishain desu","我是上班族"],["趣味は旅行です","shumi wa ryokou desu","我的興趣是旅行"]]},{"type":"text","body":"想問問題？句尾加一個【か】就好，連問號都可以省：「お名前は何ですか」（請問你叫什麼名字？）。動詞的禮貌體則用【ます】結尾：「日本語を勉強しています」（我正在學日文）——〜しています是「正在做〜」的固定句型，句中的を就是第 4 課預告過的助詞（標示動作對象，下一課正式介紹），現在先整句背起來。過去式則是【ました】：「台湾から来ました」（我從台灣來，から＝「從〜」）。"},{"type":"sounds","title":"點擊聽發音：開口說說看","items":[{"text":"私は台湾人です","sub":"watashi wa taiwanjin desu","zh":"我是台灣人"},{"text":"大学生です","sub":"daigakusei desu","zh":"我是大學生"},{"text":"お名前は何ですか","sub":"onamae wa nan desu ka","zh":"請問你叫什麼名字？"},{"text":"台湾から来ました","sub":"taiwan kara kimashita","zh":"我從台灣來"},{"text":"日本語を勉強しています","sub":"nihongo o benkyou shite imasu","zh":"我正在學日文"}]},{"type":"tip","body":"日文超愛省略「我」：自我介紹時直接說「大学生です」反而更自然，不用每一句都わたし開頭——聽的人知道你在說自己。"},{"type":"quiz","title":"小試身手","questions":[{"question":"對初次見面的日本人說話，應該用哪種說法最安全？","options":["常體","禮貌體（です／ます）","全部用漢字筆談","英文就好"],"answer":1,"explain_zh":"禮貌體（です／ます結尾）對任何人都不失禮，是零基礎的最佳選擇。常體只對熟朋友和家人使用。"},{"question":"「私は台湾人です」的「は」唸什麼？","options":["ha","wa","ba","不發音"],"answer":1,"explain_zh":"這個は是主題助詞，所以唸 wa：watashi wa taiwanjin desu。は只有在單字內部才唸 ha。"},{"question":"要把「これは何です＿」變成疑問句，句尾要加？","options":["ね","よ","か","わ"],"answer":2,"explain_zh":"句尾加か就是疑問句：「これは何ですか」＝這是什麼？ね是尋求同意（對吧），よ是提醒告知，都不是疑問。"},{"question":"「台湾から来ました」的「ました」表示？","options":["未來","現在進行","過去","命令"],"answer":2,"explain_zh":"ます的過去式是ました：「来ました」＝來了（已經發生）。現在進行是「〜しています」，像「勉強しています」。"}]}]},{"id":"jp-09","title":"助詞入門：は／が／を／に／で","subtitle":"句子的快遞標籤，各自有各自的工作","minutes":7,"sections":[{"type":"text","body":"日文的語序很自由，為什麼日本人不會搞混「誰吃了誰」？因為每個名詞後面都掛著一張【助詞】小標籤，寫明它在句子裡的工作——就像寄包裹要貼標籤：收件人、寄件人、內容物一目瞭然。助詞就是句子的【快遞標籤】，貼對了，字序怎麼排都不會誤會。"},{"type":"table","title":"五大助詞的工作","headers":["助詞","唸法","工作","比喻"],"rows":[["は","wa","標示主題：這句話在講誰","聚光燈——打在主角身上"],["が","ga","標示主語、新資訊、喜好的對象","舉手——「是我！」"],["を","o","標示動作的對象（受詞）","箭靶——動作射向誰"],["に","ni","目的地、時間、存在的地點","圖釘——釘在地圖或月曆上"],["で","de","動作發生的場所、使用的工具","舞台——在哪裡演這齣戲"]]},{"type":"text","body":"實際走一遍：「私は学生です」——は把聚光燈打在「我」身上。「りんごを食べます」——を告訴你「吃」的箭靶是蘋果。「学校に行きます」——に把目的地釘在學校。「図書館で勉強します」——で說明「唸書」這齣戲在圖書館的舞台上演。最後一個大魔王：中文說「喜歡貓」感覺像動詞吃受詞，但日文的「好き」是形容詞，喜歡的對象要用が：【猫が好きです】——這是台灣人最常犯的錯，現在就記牢！"},{"type":"sounds","title":"點擊聽發音：五大助詞例句","items":[{"text":"私は台湾人です","sub":"watashi wa taiwanjin desu","zh":"我是台灣人（は＝主題）"},{"text":"りんごを食べます","sub":"ringo o tabemasu","zh":"吃蘋果（を＝動作對象）"},{"text":"学校に行きます","sub":"gakkou ni ikimasu","zh":"去學校（に＝目的地）"},{"text":"図書館で勉強します","sub":"toshokan de benkyou shimasu","zh":"在圖書館唸書（で＝動作場所）"},{"text":"猫が好きです","sub":"neko ga suki desu","zh":"我喜歡貓（が＝喜好對象）"}]},{"type":"tip","body":"に vs で 快速判斷：只是「到達、存在」用に（学校に行きます）；要在那裡「做動作」用で（図書館で勉強します）。問自己：有沒有在那裡演戲？有就用で。"},{"type":"quiz","title":"小試身手","questions":[{"question":"わたし＿学生です。","options":["は","が","を","に"],"answer":0,"explain_zh":"「は」是主題助詞，把聚光燈打在「我」身上：我是學生。注意這個は唸 wa。を標示動作對象、に是目的地，都不適合這句。"},{"question":"毎日りんご＿食べます。","options":["は","が","を","で"],"answer":2,"explain_zh":"「吃」的箭靶是蘋果，動作對象用を：「りんごを食べます」。這個を唸 o。"},{"question":"図書館＿勉強します。","options":["に","を","で","が"],"answer":2,"explain_zh":"「唸書」是在圖書館上演的動作，動作發生的場所用で。に只表示到達或存在（例：図書館にいます），沒有演戲的成分。"},{"question":"私は猫＿好きです。","options":["を","が","で","に"],"answer":1,"explain_zh":"「好き」是形容詞，喜歡的對象用が：「猫が好きです」。中文的「喜歡」是動詞所以很想用を——這是台灣學習者最常見的錯誤，記住「が好き」！"},{"question":"明日、学校＿行きます。","options":["を","に","で","は"],"answer":1,"explain_zh":"移動的目的地用に（圖釘釘在學校）：「学校に行きます」＝去學校。で是動作發生的場所，不用於單純移動的終點。"}]}]},{"id":"jp-10","title":"打招呼與自我介紹","subtitle":"把前九課全部串起來，完成你的日文出道作","minutes":6,"sections":[{"type":"text","body":"最後一課！我們把前九課學的假名、發音規則、です／ます句型和助詞全部組合起來，完成一段能實戰的自我介紹。先從一天的打招呼開始——注意「こんにちは」「こんばんは」句尾的は都唸 wa，因為它們原本就是助詞（第 4 課和第 9 課的知識在這裡會合了）。"},{"type":"table","title":"一天的打招呼","headers":["時機","日文","羅馬拼音"],"rows":[["早上","おはようございます","ohayou gozaimasu"],["白天見面","こんにちは","konnichiwa"],["晚上見面","こんばんは","konbanwa"],["睡前","おやすみなさい","oyasuminasai"],["道別","じゃあ、またね","jaa, mata ne"]]},{"type":"sounds","title":"點擊聽發音：打招呼","items":[{"text":"おはようございます","sub":"ohayou gozaimasu（よう＝長音）","zh":"早安"},{"text":"こんにちは","sub":"konnichiwa（は唸 wa！）","zh":"你好／午安"},{"text":"こんばんは","sub":"konbanwa","zh":"晚安（晚上見面時）"},{"text":"はじめまして","sub":"hajimemashite","zh":"初次見面，你好"},{"text":"また明日","sub":"mata ashita","zh":"明天見"}]},{"type":"text","body":"接著是重頭戲：完整自我介紹範本。把它背起來，就是你的日文出道作。仔細看，裡面藏了多少學過的東西：【勉強（べんきょう）】有拗音和長音、【は】唸 wa、【を】唸 o、句句都是禮貌體です／ます——前九課一次驗收。其中「〜と呼んでください」（請叫我〜）用到還沒教的文法，先整句當模板背起來就好。"},{"type":"sounds","title":"點擊聽發音：完整自我介紹範本（跟著唸）","items":[{"text":"はじめまして","sub":"hajimemashite","zh":"初次見面，你好"},{"text":"私は台湾人です","sub":"watashi wa taiwanjin desu","zh":"我是台灣人"},{"text":"アミと呼んでください","sub":"ami to yonde kudasai","zh":"請叫我阿美（換成你的名字）"},{"text":"大学生です","sub":"daigakusei desu","zh":"我是大學生"},{"text":"日本語を勉強しています","sub":"nihongo o benkyou shite imasu","zh":"我正在學日文"},{"text":"趣味は旅行です","sub":"shumi wa ryokou desu","zh":"我的興趣是旅行"},{"text":"よろしくお願いします","sub":"yoroshiku onegaishimasu","zh":"請多多指教"}]},{"type":"tip","body":"自我介紹的結尾一定要說「よろしくお願いします」（請多多指教）——這是日本社交的萬用結尾，說的時候微微點頭鞠躬，好感度直接加倍。"},{"type":"quiz","title":"小試身手","questions":[{"question":"早上在學校遇到老師，應該說？","options":["こんばんは","おはようございます","おやすみなさい","ただいま"],"answer":1,"explain_zh":"早上用「おはようございます」。こんばんは是晚上見面用、おやすみなさい是睡前說、ただいま是回到家說「我回來了」。"},{"question":"「はじめまして」什麼時候用？","options":["每天見面都說","初次見面時","道別時","吃飯前"],"answer":1,"explain_zh":"はじめまして＝「初次見面，你好」，只在第一次見面時說，是自我介紹的開場白。之後見面就用こんにちは等日常招呼。"},{"question":"自我介紹的結尾最適合說哪一句？","options":["さようなら","いってきます","よろしくお願いします","ごちそうさまでした"],"answer":2,"explain_zh":"「よろしくお願いします」（請多多指教）是自我介紹的標準結尾。さようなら是再見、いってきます是出門說的、ごちそうさまでした是吃飽後說的。"},{"question":"「日本語を勉強しています」的「勉強」是什麼意思？","options":["勉強、將就","學習","很強壯","努力工作"],"answer":1,"explain_zh":"第 1 課的陷阱漢字回收！「勉強（べんきょう）」是唸書、學習，整句＝我正在學日文。注意べんきょう裡有拗音きょ和長音。"},{"question":"「こんにちは」的正確羅馬拼音是？","options":["konnichiha","konnichiwa","konnichiba","konnitiwa"],"answer":1,"explain_zh":"句尾的は是助詞出身，唸 wa：konnichiwa。另外ち的 Hepburn 拼音是 chi 不是 ti，所以 konnitiwa 也不對。"}]}]}]},"korean":{"language":"korean","display_name_zh":"韓文","alphabet":[{"char":"ㄱ","roman":"g/k","group":"基本子音"},{"char":"ㄴ","roman":"n","group":"基本子音"},{"char":"ㄷ","roman":"d/t","group":"基本子音"},{"char":"ㄹ","roman":"r/l","group":"基本子音"},{"char":"ㅁ","roman":"m","group":"基本子音"},{"char":"ㅂ","roman":"b/p","group":"基本子音"},{"char":"ㅅ","roman":"s","group":"基本子音"},{"char":"ㅇ","roman":"-/ng","group":"基本子音"},{"char":"ㅈ","roman":"j","group":"基本子音"},{"char":"ㅊ","roman":"ch","group":"基本子音"},{"char":"ㅋ","roman":"k","group":"基本子音"},{"char":"ㅌ","roman":"t","group":"基本子音"},{"char":"ㅍ","roman":"p","group":"基本子音"},{"char":"ㅎ","roman":"h","group":"基本子音"},{"char":"ㄲ","roman":"kk","group":"雙子音"},{"char":"ㄸ","roman":"tt","group":"雙子音"},{"char":"ㅃ","roman":"pp","group":"雙子音"},{"char":"ㅆ","roman":"ss","group":"雙子音"},{"char":"ㅉ","roman":"jj","group":"雙子音"},{"char":"ㅏ","roman":"a","group":"基本母音"},{"char":"ㅑ","roman":"ya","group":"基本母音"},{"char":"ㅓ","roman":"eo","group":"基本母音"},{"char":"ㅕ","roman":"yeo","group":"基本母音"},{"char":"ㅗ","roman":"o","group":"基本母音"},{"char":"ㅛ","roman":"yo","group":"基本母音"},{"char":"ㅜ","roman":"u","group":"基本母音"},{"char":"ㅠ","roman":"yu","group":"基本母音"},{"char":"ㅡ","roman":"eu","group":"基本母音"},{"char":"ㅣ","roman":"i","group":"基本母音"},{"char":"ㅐ","roman":"ae","group":"複合母音"},{"char":"ㅒ","roman":"yae","group":"複合母音"},{"char":"ㅔ","roman":"e","group":"複合母音"},{"char":"ㅖ","roman":"ye","group":"複合母音"},{"char":"ㅘ","roman":"wa","group":"複合母音"},{"char":"ㅙ","roman":"wae","group":"複合母音"},{"char":"ㅚ","roman":"oe","group":"複合母音"},{"char":"ㅝ","roman":"wo","group":"複合母音"},{"char":"ㅞ","roman":"we","group":"複合母音"},{"char":"ㅟ","roman":"wi","group":"複合母音"},{"char":"ㅢ","roman":"ui","group":"複合母音"}],"items":[{"text":"안녕하세요","reading":"annyeonghaseyo","zh":"你好","topic":"打招呼","example":"안녕하세요! 오늘 날씨 좋네요.","example_zh":"你好！今天天氣真好。","note":"最通用的존댓말問候，任何時段都能用；對親近朋友可改用반말的안녕。"},{"text":"안녕","reading":"annyeong","zh":"嗨（半語）","topic":"打招呼","example":"안녕! 오랜만이야.","example_zh":"嗨！好久不見。","note":"반말，只能對同齡好友或晚輩用；對長輩或初次見面的人用會很失禮。"},{"text":"처음 뵙겠습니다","reading":"cheoeum boepgetseumnida","zh":"初次見面（很正式）","topic":"打招呼","example":"처음 뵙겠습니다. 잘 부탁드립니다.","example_zh":"初次見面，請多多指教。","note":"합쇼體的正式說法，適合正式場合或對長輩；朋友間用만나서 반가워요就好。"},{"text":"만나서 반가워요","reading":"mannaseo bangawoyo","zh":"很高興認識你","topic":"打招呼","example":"만나서 반가워요. 이야기 많이 들었어요.","example_zh":"很高興認識你，久仰大名。","note":"初次見面必備句；반말是만나서 반가워，更正式是반갑습니다。"},{"text":"잘 지냈어요?","reading":"jal jinaesseoyo?","zh":"最近過得好嗎？","topic":"打招呼","example":"오랜만이에요. 잘 지냈어요?","example_zh":"好久不見，最近過得好嗎？","note":"對一陣子沒見的朋友用；반말是잘 지냈어?。回答可以說네, 잘 지냈어요。"},{"text":"오랜만이에요","reading":"oraenmanieyo","zh":"好久不見","topic":"打招呼","example":"와, 진짜 오랜만이에요!","example_zh":"哇，真的好久不見！","note":"반말是오랜만이야；更正式可說오랜만입니다。"},{"text":"안녕히 가세요","reading":"annyeonghi gaseyo","zh":"再見（對要離開的人說）","topic":"打招呼","example":"","example_zh":"","note":"自己留在原地、對方離開時說；如果是自己離開，要對留下的人說안녕히 계세요，兩句別搞混。"},{"text":"안녕히 계세요","reading":"annyeonghi gyeseyo","zh":"再見（自己離開時說）","topic":"打招呼","example":"","example_zh":"","note":"自己要走、對方留下時說；掛電話或離開店家時也常用。"},{"text":"잘 가","reading":"jal ga","zh":"再見／路上小心（半語）","topic":"打招呼","example":"잘 가! 내일 봐.","example_zh":"再見！明天見。","note":"반말，只對親近朋友用；존댓말可說잘 가요或조심히 가세요。"},{"text":"또 만나요","reading":"tto mannayo","zh":"下次再見","topic":"打招呼","example":"오늘 즐거웠어요. 또 만나요!","example_zh":"今天很開心，下次再見！","note":"道別時表達想再見面的心意，交朋友時很好用；반말是또 만나자。"},{"text":"좋은 아침이에요","reading":"joeun achimieyo","zh":"早安","topic":"打招呼","example":"","example_zh":"","note":"早上打招呼用；其實韓國人早上也常直接說안녕하세요。"},{"text":"잘 자요","reading":"jal jayo","zh":"晚安（睡前）","topic":"打招呼","example":"늦었네요. 잘 자요!","example_zh":"很晚了，晚安！","note":"睡前道晚安用；반말是잘 자，對長輩要說안녕히 주무세요。"},{"text":"어서 오세요","reading":"eoseo oseyo","zh":"歡迎光臨","topic":"打招呼","example":"","example_zh":"","note":"進店家時店員會說的話，聽懂就好；朋友來家裡玩也可以這樣歡迎對方。"},{"text":"수고하셨습니다","reading":"sugohasyeotseumnida","zh":"辛苦了","topic":"打招呼","example":"오늘 수고하셨습니다!","example_zh":"今天辛苦了！","note":"工作、活動結束時互相慰勞的話，職場文化必備；對平輩朋友可說수고했어요。"},{"text":"잘 부탁드립니다","reading":"jal butakdeurimnida","zh":"請多多指教","topic":"打招呼","example":"앞으로 잘 부탁드립니다.","example_zh":"今後請多多指教。","note":"自我介紹結尾的固定句，類似日文的「請多關照」；朋友間可說잘 부탁해요。"},{"text":"이름이 뭐예요?","reading":"ireumi mwoyeyo?","zh":"你叫什麼名字？","topic":"自我介紹","example":"이름이 뭐예요? 저는 유진이에요.","example_zh":"你叫什麼名字？我是宥真。","note":"해요體的問法，適合同輩之間；對長輩要用更尊敬的성함이 어떻게 되세요?。"},{"text":"성함이 어떻게 되세요?","reading":"seonghami eotteoke doeseyo?","zh":"請問您貴姓大名？","topic":"自我介紹","example":"","example_zh":"","note":"성함是이름的敬語，對長輩或正式場合使用，顯得有禮貌。"},{"text":"저는 대만 사람이에요","reading":"jeoneun daeman saramieyo","zh":"我是台灣人","topic":"自我介紹","example":"저는 대만 사람이에요. 대만 알아요?","example_zh":"我是台灣人，你知道台灣嗎？","note":"대만＝台灣；韓國人對台灣的珍珠奶茶（버블티）和小籠包很熟悉，是很好的話題。"},{"text":"저는 대만에서 왔어요","reading":"jeoneun daemaneseo wasseoyo","zh":"我從台灣來","topic":"自我介紹","example":"","example_zh":"","note":"에서表示出發點；自我介紹時和저는 대만 사람이에요搭配使用。"},{"text":"저는 타이베이에 살아요","reading":"jeoneun taibeie sarayo","zh":"我住在台北","topic":"自我介紹","example":"저는 타이베이에 살아요. 서울하고 비슷해요.","example_zh":"我住在台北，和首爾有點像。","note":"에＋살다表示居住地點；也可換成고향은 타이베이예요（我的家鄉是台北）。"},{"text":"저는 학생이에요","reading":"jeoneun haksaengieyo","zh":"我是學生","topic":"自我介紹","example":"저는 대학생이에요.","example_zh":"我是大學生。","note":"대학생＝大學生、대학원생＝研究生；학생有尾音所以接이에요。"},{"text":"저는 회사원이에요","reading":"jeoneun hoesawonieyo","zh":"我是上班族","topic":"自我介紹","example":"","example_zh":"","note":"회사원泛指公司職員；介紹職業時的常用句型是저는＋職業＋이에요/예요。"},{"text":"무슨 일을 하세요?","reading":"museun ireul haseyo?","zh":"你從事什麼工作？","topic":"自我介紹","example":"","example_zh":"","note":"用하세요帶敬語比較有禮貌；初次見面問工作在韓國很常見，不算失禮。"},{"text":"몇 살이에요?","reading":"myeot sarieyo?","zh":"你幾歲？","topic":"自我介紹","example":"실례지만 몇 살이에요?","example_zh":"不好意思，請問你幾歲？","note":"韓國人常問年齡是為了決定稱謂（哥哥姊姊等）；問長輩要改用연세가 어떻게 되세요?，並先說실례지만緩和語氣。"},{"text":"저는 스물다섯 살이에요","reading":"jeoneun seumuldaseot sarieyo","zh":"我二十五歲","topic":"自我介紹","example":"","example_zh":"","note":"說年齡用固有數字（하나、둘…）；韓國2023年起改用滿年齡（만 나이），聊年齡時可以確認一下。"},{"text":"한국어를 배우고 있어요","reading":"hangugeoreul baeugo isseoyo","zh":"我正在學韓語","topic":"自我介紹","example":"요즘 한국어를 배우고 있어요.","example_zh":"我最近在學韓語。","note":"-고 있어요表示正在進行；說出這句韓國朋友通常會很開心並放慢語速。"},{"text":"한국어를 조금 할 줄 알아요","reading":"hangugeoreul jogeum hal jul arayo","zh":"我會說一點韓語","topic":"自我介紹","example":"","example_zh":"","note":"-(으)ㄹ 줄 알다表示會做某事；搭配천천히 말해 주세요（請說慢一點）更實用。"},{"text":"어디에서 왔어요?","reading":"eodieseo wasseoyo?","zh":"你來自哪裡？","topic":"自我介紹","example":"","example_zh":"","note":"問對方出身地；也可以說고향이 어디예요?（你家鄉在哪？）。"},{"text":"대만에 와 본 적이 있어요?","reading":"daemane wa bon jeogi isseoyo?","zh":"你來過台灣嗎？","topic":"自我介紹","example":"대만에 와 본 적이 있어요? 야시장 꼭 가 보세요.","example_zh":"你來過台灣嗎？一定要去逛夜市。","note":"-아/어 본 적이 있다表示經驗；邀請對方來台灣玩是拉近距離的好話題。"},{"text":"우리 친구 해요","reading":"uri chingu haeyo","zh":"我們當朋友吧","topic":"自我介紹","example":"나이도 같은데 우리 친구 해요.","example_zh":"年紀一樣，我們當朋友吧。","note":"韓國的친구通常指同齡朋友；同齡朋友熟了之後會提議말 놓다（改說半語）。"},{"text":"취미가 뭐예요?","reading":"chwimiga mwoyeyo?","zh":"你的興趣是什麼？","topic":"興趣嗜好","example":"취미가 뭐예요? 저는 여행을 좋아해요.","example_zh":"你的興趣是什麼？我喜歡旅行。","note":"認識新朋友的萬用開場問題；반말是취미가 뭐야?。"},{"text":"제 취미는 여행이에요","reading":"je chwimineun yeohaengieyo","zh":"我的興趣是旅行","topic":"興趣嗜好","example":"","example_zh":"","note":"제＝저의（我的）縮寫；回答句型是제 취미는＋名詞＋이에요/예요。"},{"text":"저는 음악 듣는 걸 좋아해요","reading":"jeoneun eumak deunneun geol joahaeyo","zh":"我喜歡聽音樂","topic":"興趣嗜好","example":"","example_zh":"","note":"動詞＋는 걸 좋아해요＝喜歡做某事；걸是것을的口語縮寫。"},{"text":"케이팝을 좋아해요","reading":"keipabeul joahaeyo","zh":"我喜歡K-POP","topic":"興趣嗜好","example":"케이팝을 좋아해요. 특히 아이돌 노래요.","example_zh":"我喜歡K-POP，特別是偶像的歌。","note":"K-POP是和韓國人聊天的超級破冰話題；可以接著問최애가 누구예요?（你的本命是誰？）。"},{"text":"어떤 가수를 좋아해요?","reading":"eotteon gasureul joahaeyo?","zh":"你喜歡哪位歌手？","topic":"興趣嗜好","example":"","example_zh":"","note":"어떤＝哪種、哪位；把가수換成배우（演員）、음식（食物）就能延伸話題。"},{"text":"드라마 자주 봐요?","reading":"deurama jaju bwayo?","zh":"你常看韓劇嗎？","topic":"興趣嗜好","example":"요즘 무슨 드라마 봐요?","example_zh":"你最近在看什麼劇？","note":"韓劇是共同話題寶庫；口語中常省略助詞（드라마를→드라마），聽起來更自然。"},{"text":"저는 영화 보는 것을 좋아해요","reading":"jeoneun yeonghwa boneun geoseul joahaeyo","zh":"我喜歡看電影","topic":"興趣嗜好","example":"","example_zh":"","note":"보는 것을＝「看」這件事；口語常縮成보는 걸。"},{"text":"운동을 좋아해요?","reading":"undongeul joahaeyo?","zh":"你喜歡運動嗎？","topic":"興趣嗜好","example":"무슨 운동을 좋아해요?","example_zh":"你喜歡什麼運動？","note":"韓國人流行헬스（上健身房）、등산（爬山）、야구（棒球）；台灣人愛棒球這點很有共鳴。"},{"text":"저는 등산을 자주 가요","reading":"jeoneun deungsaneul jaju gayo","zh":"我常去爬山","topic":"興趣嗜好","example":"","example_zh":"","note":"자주＝經常；爬山在韓國是全民運動，週末山上滿滿都是人。"},{"text":"게임 좋아해요?","reading":"geim joahaeyo?","zh":"你喜歡玩遊戲嗎？","topic":"興趣嗜好","example":"같이 게임할래요?","example_zh":"要一起打電動嗎？","note":"韓國電競文化盛行，롤（英雄聯盟）幾乎人人知道；一起打遊戲是快速變熟的方法。"},{"text":"사진 찍는 걸 좋아해요","reading":"sajin jjingneun geol joahaeyo","zh":"我喜歡拍照","topic":"興趣嗜好","example":"","example_zh":"","note":"찍다＝拍（照）；可延伸說인생샷（人生美照）這個流行語。"},{"text":"요리하는 것을 좋아해요","reading":"yorihaneun geoseul joahaeyo","zh":"我喜歡做菜","topic":"興趣嗜好","example":"대만 요리를 만들어 줄게요.","example_zh":"我做台灣菜給你吃。","note":"請韓國朋友吃台灣家常菜是很棒的交流方式；요리하다＝做菜。"},{"text":"주말에 보통 뭐 해요?","reading":"jumare botong mwo haeyo?","zh":"你週末通常做什麼？","topic":"興趣嗜好","example":"","example_zh":"","note":"보통＝通常；這句能自然帶出對方的生活習慣和興趣，比直接問취미更口語。"},{"text":"독서를 좋아해요","reading":"dokseoreul joahaeyo","zh":"我喜歡閱讀","topic":"興趣嗜好","example":"","example_zh":"","note":"독서＝讀書（閱讀興趣）；공부（唸書）和독서不同，別混用。"},{"text":"우리 취미가 같네요!","reading":"uri chwimiga ganneyo!","zh":"我們興趣一樣耶！","topic":"興趣嗜好","example":"우리 취미가 같네요! 다음에 같이 해요.","example_zh":"我們興趣一樣耶！下次一起吧。","note":"-네요表示驚訝或感嘆，發現共同點時說這句可以瞬間拉近距離。"},{"text":"시간 있어요?","reading":"sigan isseoyo?","zh":"你有空嗎？","topic":"邀約出遊","example":"내일 시간 있어요?","example_zh":"你明天有空嗎？","note":"邀約的起手式；반말是시간 있어?。"},{"text":"주말에 시간 있어요?","reading":"jumare sigan isseoyo?","zh":"你週末有空嗎？","topic":"邀約出遊","example":"","example_zh":"","note":"에表示時間點；주말＝週末、평일＝平日。"},{"text":"같이 밥 먹을래요?","reading":"gachi bap meogeullaeyo?","zh":"要一起吃飯嗎？","topic":"邀約出遊","example":"언제 같이 밥 먹을래요?","example_zh":"什麼時候要一起吃個飯？","note":"-(으)ㄹ래요?詢問對方意願；韓國人說「改天一起吃飯」（언제 밥 한번 먹어요）有時只是客套，要約就給出具體時間。"},{"text":"커피 한잔 할래요?","reading":"keopi hanjan hallaeyo?","zh":"要喝杯咖啡嗎？","topic":"邀約出遊","example":"","example_zh":"","note":"韓國咖啡廳文化超發達，약속（約見面）常常就是喝咖啡聊天。"},{"text":"같이 영화 볼래요?","reading":"gachi yeonghwa bollaeyo?","zh":"要一起看電影嗎？","topic":"邀約出遊","example":"","example_zh":"","note":"같이＝一起，發音是[가치]；把영화換成전시회（展覽）、콘서트（演唱會）就能套用。"},{"text":"언제 만날까요?","reading":"eonje mannalkkayo?","zh":"我們什麼時候見面好呢？","topic":"邀約出遊","example":"","example_zh":"","note":"-(으)ㄹ까요?表示和對方商量；반말是언제 만날까?。"},{"text":"어디에서 만날까요?","reading":"eodieseo mannalkkayo?","zh":"我們在哪裡見面好呢？","topic":"邀約出遊","example":"홍대입구역에서 만날까요?","example_zh":"要在弘大入口站見面嗎？","note":"에서表示動作發生地點；韓國人習慣約在地鐵站출구（出口）幾號見。"},{"text":"토요일 어때요?","reading":"toyoil eottaeyo?","zh":"星期六如何？","topic":"邀約出遊","example":"","example_zh":"","note":"어때요?＝如何？提議時間、地點、食物都能用，超實用。"},{"text":"좋아요, 그때 봐요","reading":"joayo, geuttae bwayo","zh":"好啊，到時候見","topic":"邀約出遊","example":"","example_zh":"","note":"答應邀約的自然回覆；그때＝那個時候；반말是좋아, 그때 보자。"},{"text":"미안해요, 그날은 약속이 있어요","reading":"mianhaeyo, geunareun yaksogi isseoyo","zh":"抱歉，那天我有約了","topic":"邀約出遊","example":"","example_zh":"","note":"약속＝約會、約定（不限戀愛）；婉拒後補一句다음에 같이 가요會更周到。"},{"text":"다음에 같이 가요","reading":"daeume gachi gayo","zh":"下次一起去吧","topic":"邀約出遊","example":"","example_zh":"","note":"다음에＝下次；語氣友善，婉拒或道別時都好用。"},{"text":"제가 데리러 갈게요","reading":"jega derireo galgeyo","zh":"我去接你","topic":"邀約出遊","example":"","example_zh":"","note":"-(으)러 가다表示去做某事；-(으)ㄹ게요表示自己的承諾，體貼度滿分。"},{"text":"몇 시에 만날까요?","reading":"myeot sie mannalkkayo?","zh":"幾點見面好呢？","topic":"邀約出遊","example":"몇 시에 만날까요? 두 시 어때요?","example_zh":"幾點見面好呢？兩點如何？","note":"時間的「點」用固有數字：한 시、두 시、세 시。"},{"text":"늦지 마세요","reading":"neutji maseyo","zh":"別遲到喔","topic":"邀約出遊","example":"","example_zh":"","note":"-지 마세요＝請不要…；朋友間可開玩笑地說늦지 마!。"},{"text":"오늘 정말 즐거웠어요","reading":"oneul jeongmal jeulgeowosseoyo","zh":"今天真的很開心","topic":"邀約出遊","example":"오늘 정말 즐거웠어요. 다음에 또 만나요.","example_zh":"今天真的很開心，下次再約。","note":"約會、聚會結束後的完美收尾句，通常會再傳一次訊息表達，這是韓國的社交禮貌。"},{"text":"밥 먹었어요?","reading":"bap meogeosseoyo?","zh":"你吃飯了嗎？","topic":"吃飯聊天","example":"밥 먹었어요? 아직이면 같이 먹어요.","example_zh":"你吃飯了嗎？還沒的話一起吃吧。","note":"韓國人的國民問候語，其實是關心不是真的問；就像台灣人說「呷飽未」。"},{"text":"배고파요","reading":"baegopayo","zh":"我餓了","topic":"吃飯聊天","example":"배고파요. 밥 먹으러 가요.","example_zh":"我餓了，去吃飯吧。","note":"반말是배고파；相反是배불러요（我吃飽了）。"},{"text":"뭐 먹고 싶어요?","reading":"mwo meokgo sipeoyo?","zh":"你想吃什麼？","topic":"吃飯聊天","example":"","example_zh":"","note":"-고 싶어요表示想做某事；韓國人常回아무거나（隨便都行），這時就換你提議吧。"},{"text":"저는 매운 음식을 좋아해요","reading":"jeoneun maeun eumsigeul joahaeyo","zh":"我喜歡吃辣的","topic":"吃飯聊天","example":"","example_zh":"","note":"매운 음식＝辣的食物；韓國的辣和台灣不同，是又辣又甜的辣，敢吃辣會被稱讚。"},{"text":"매운 거 잘 못 먹어요","reading":"maeun geo jal mot meogeoyo","zh":"我不太能吃辣","topic":"吃飯聊天","example":"매운 거 잘 못 먹어요. 덜 맵게 해 주세요.","example_zh":"我不太能吃辣，請做得不要太辣。","note":"잘 못＋動詞＝不太會…；點餐時說덜 맵게（辣度減量）很實用。"},{"text":"이거 진짜 맛있어요","reading":"igeo jinjja masisseoyo","zh":"這個真的好吃","topic":"吃飯聊天","example":"","example_zh":"","note":"진짜＝真的（口語）；更誇張可以說대박 맛있어요（好吃到不行）。"},{"text":"맛있게 드세요","reading":"masitge deuseyo","zh":"請慢用","topic":"吃飯聊天","example":"","example_zh":"","note":"드시다是먹다的敬語；開動前對方說這句，回네, 잘 먹겠습니다就對了。"},{"text":"잘 먹겠습니다","reading":"jal meokgetseumnida","zh":"我開動了","topic":"吃飯聊天","example":"","example_zh":"","note":"飯前固定用語，字面是「我會好好地吃」，被請客時說更是必備禮貌。"},{"text":"잘 먹었습니다","reading":"jal meogeotseumnida","zh":"我吃飽了／謝謝招待","topic":"吃飯聊天","example":"","example_zh":"","note":"飯後固定用語；和잘 먹겠습니다（飯前）是一組，時態不同別搞混。"},{"text":"건배!","reading":"geonbae!","zh":"乾杯！","topic":"吃飯聊天","example":"자, 건배해요!","example_zh":"來，乾杯！","note":"和長輩喝酒時要雙手拿杯、側身喝，這是重要的韓國酒桌禮儀。"},{"text":"제가 살게요","reading":"jega salgeyo","zh":"我請客","topic":"吃飯聊天","example":"오늘은 제가 살게요.","example_zh":"今天我請客。","note":"사다在這裡是「請客」；韓國常由年長者或先提議的人買單，比較少各付各的。"},{"text":"다음에는 제가 살게요","reading":"daeumeneun jega salgeyo","zh":"下次換我請","topic":"吃飯聊天","example":"","example_zh":"","note":"被請客後這樣回，表示想繼續來往，是維持友誼的漂亮話。"},{"text":"뭐 마실래요?","reading":"mwo masillaeyo?","zh":"你要喝什麼？","topic":"吃飯聊天","example":"","example_zh":"","note":"마시다＝喝；在咖啡廳幫朋友點餐時的常用句。"},{"text":"한국 음식을 좋아해요","reading":"hanguk eumsigeul joahaeyo","zh":"我喜歡韓國菜","topic":"吃飯聊天","example":"한국 음식을 좋아해요. 특히 삼겹살이요.","example_zh":"我喜歡韓國菜，特別是烤五花肉。","note":"說出具體菜名（떡볶이、김치찌개、삼겹살）會讓話題更熱絡。"},{"text":"치맥 먹으러 갈래요?","reading":"chimaek meogeureo gallaeyo?","zh":"要去吃炸雞配啤酒嗎？","topic":"吃飯聊天","example":"","example_zh":"","note":"치맥＝치킨（炸雞）＋맥주（啤酒），韓國的國民組合；-(으)러 가다＝去做某事。"},{"text":"한국어 잘하시네요","reading":"hangugeo jalhasineyo","zh":"你韓語說得真好","topic":"稱讚回應","example":"","example_zh":"","note":"韓國人對外國人說韓語幾乎必給這句鼓勵；-시-是敬語，對朋友說잘하네요即可。"},{"text":"아니에요, 아직 멀었어요","reading":"anieyo, ajik meoreosseoyo","zh":"沒有啦，還差得遠","topic":"稱讚回應","example":"","example_zh":"","note":"韓國文化重視謙虛，被稱讚時先謙虛再道謝最得體；아직 멀었어요字面是「還很遠」。"},{"text":"정말 대단해요","reading":"jeongmal daedanhaeyo","zh":"真的很厲害","topic":"稱讚回應","example":"혼자 다 했어요? 정말 대단해요!","example_zh":"你自己全部完成？真的很厲害！","note":"대단하다＝了不起；반말是대단해。"},{"text":"오늘 옷이 예뻐요","reading":"oneul osi yeppeoyo","zh":"你今天的衣服好漂亮","topic":"稱讚回應","example":"","example_zh":"","note":"예쁘다多用於物品或女生；稱讚男生帥用멋있어요。"},{"text":"감사합니다","reading":"gamsahamnida","zh":"謝謝（正式）","topic":"稱讚回應","example":"","example_zh":"","note":"最安全的道謝，任何場合都不失禮；更輕鬆的說法是고마워요。"},{"text":"고마워요","reading":"gomawoyo","zh":"謝謝（해요體）","topic":"稱讚回應","example":"도와줘서 고마워요.","example_zh":"謝謝你幫我。","note":"朋友間的自然道謝；반말是고마워，正式場合用감사합니다。"},{"text":"천만에요","reading":"cheonmaneyo","zh":"不客氣","topic":"稱讚回應","example":"","example_zh":"","note":"教科書標準說法，實際口語更常聽到아니에요（沒什麼）。"},{"text":"과찬이세요","reading":"gwachaniseyo","zh":"您過獎了","topic":"稱讚回應","example":"","example_zh":"","note":"有點正式的謙虛回應，用在長輩或客套場合，朋友間說아니에요就好。"},{"text":"멋있어요","reading":"meosisseoyo","zh":"好帥／好棒","topic":"稱讚回應","example":"오늘 진짜 멋있어요!","example_zh":"你今天真的好帥！","note":"稱讚外表或表現都行；口語常說멋져요，반말是멋있어。"},{"text":"귀여워요","reading":"gwiyeowoyo","zh":"好可愛","topic":"稱讚回應","example":"","example_zh":"","note":"韓國人也常用귀엽다形容行為可愛；對不熟的異性使用要注意分寸。"},{"text":"목소리가 좋네요","reading":"moksoriga jonneyo","zh":"你的聲音真好聽","topic":"稱讚回應","example":"","example_zh":"","note":"-네요表示當下的感嘆；具體的稱讚比籠統的更讓人開心。"},{"text":"센스가 있으시네요","reading":"senseuga isseusineyo","zh":"你很有品味／很機靈","topic":"稱讚回應","example":"","example_zh":"","note":"센스（sense）是韓式外來語，指眼光好、反應快，送禮或穿搭被稱讚센스是高評價。"},{"text":"덕분이에요","reading":"deokbunieyo","zh":"託你的福","topic":"稱讚回應","example":"다 덕분이에요. 고마워요.","example_zh":"都是託你的福，謝謝。","note":"把功勞歸給對方的謙虛說法；덕분에＋句子＝多虧了…。"},{"text":"별말씀을요","reading":"byeolmalsseumeullyo","zh":"哪裡的話","topic":"稱讚回應","example":"","example_zh":"","note":"對長輩的道謝或稱讚謙虛回應時用，禮貌度高。"},{"text":"힘내세요","reading":"himnaeseyo","zh":"加油","topic":"稱讚回應","example":"시험 잘 볼 거예요. 힘내세요!","example_zh":"考試一定會順利的，加油！","note":"힘＝力量、내다＝拿出；安慰朋友時搭配파이팅!（fighting）更有活力，반말是힘내。"},{"text":"오늘 날씨가 좋네요","reading":"oneul nalssiga jonneyo","zh":"今天天氣真好","topic":"日常閒聊","example":"","example_zh":"","note":"天氣是萬用開場白；-네요讓語氣聽起來像自然的感嘆而不是報告。"},{"text":"요즘 어떻게 지내요?","reading":"yojeum eotteoke jinaeyo?","zh":"最近過得怎麼樣？","topic":"日常閒聊","example":"","example_zh":"","note":"요즘＝最近；比잘 지냈어요?更日常，適合常見面的朋友。"},{"text":"바빠요?","reading":"bappayo?","zh":"你忙嗎？","topic":"日常閒聊","example":"요즘 많이 바빠요?","example_zh":"最近很忙嗎？","note":"傳訊息開頭的體貼問法；반말是바빠?。"},{"text":"요즘 좀 바빠요","reading":"yojeum jom bappayo","zh":"最近有點忙","topic":"日常閒聊","example":"","example_zh":"","note":"좀＝조금（一點）的縮寫，口語超常用。"},{"text":"피곤해요","reading":"pigonhaeyo","zh":"我好累","topic":"日常閒聊","example":"어제 잠을 못 자서 피곤해요.","example_zh":"昨天沒睡好，好累。","note":"반말是피곤해；韓國人聊天超常說피곤하다，很有共鳴的一句。"},{"text":"오늘 뭐 했어요?","reading":"oneul mwo haesseoyo?","zh":"你今天做了什麼？","topic":"日常閒聊","example":"","example_zh":"","note":"했어요是하다的過去式；朋友間閒聊、訊息裡都常用。"},{"text":"비가 와요","reading":"biga wayo","zh":"下雨了","topic":"日常閒聊","example":"비가 와요. 우산 있어요?","example_zh":"下雨了，你有傘嗎？","note":"韓文的下雨是「雨來了」（비가 오다）；下雨天韓國人習慣吃부침개（煎餅）配막걸리（小米酒）。"},{"text":"날씨가 너무 더워요","reading":"nalssiga neomu deowoyo","zh":"天氣好熱","topic":"日常閒聊","example":"","example_zh":"","note":"너무＝太、非常；台灣的濕熱天氣正好可以拿來聊。"},{"text":"날씨가 추워요","reading":"nalssiga chuwoyo","zh":"天氣好冷","topic":"日常閒聊","example":"","example_zh":"","note":"韓國冬天可到零下十幾度，跟韓國朋友聊台灣「濕冷」的體感差異很有趣。"},{"text":"그래요?","reading":"geuraeyo?","zh":"是喔？／這樣啊？","topic":"日常閒聊","example":"","example_zh":"","note":"萬用附和語，表示有在聽；語調上揚是疑問，下降是理解。반말是그래?。"},{"text":"맞아요","reading":"majayo","zh":"沒錯","topic":"日常閒聊","example":"맞아요, 저도 그렇게 생각해요.","example_zh":"沒錯，我也這麼想。","note":"表示同意的高頻附和語；반말是맞아。"},{"text":"진짜요?","reading":"jinjjayo?","zh":"真的嗎？","topic":"日常閒聊","example":"","example_zh":"","note":"口語比정말요?更常用；반말是진짜?，聊天時的必備反應詞。"},{"text":"저도요","reading":"jeodoyo","zh":"我也是","topic":"日常閒聊","example":"","example_zh":"","note":"도＝也；반말是나도，找到共同點時馬上接這句。"},{"text":"무슨 일 있어요?","reading":"museun il isseoyo?","zh":"發生什麼事了嗎？","topic":"日常閒聊","example":"표정이 안 좋네요. 무슨 일 있어요?","example_zh":"你臉色不太好，發生什麼事了嗎？","note":"關心朋友的溫暖問句；무슨 일＝什麼事。"},{"text":"걱정하지 마세요","reading":"geokjeonghaji maseyo","zh":"別擔心","topic":"日常閒聊","example":"","example_zh":"","note":"-지 마세요＝請不要…；반말是걱정하지 마或걱정 마。"},{"text":"카톡 해요","reading":"katok haeyo","zh":"用KakaoTalk聊吧","topic":"網路聊天用語","example":"이따가 카톡 해요.","example_zh":"待會用KakaoTalk聊。","note":"카톡＝카카오톡（KakaoTalk）縮寫，韓國人幾乎人人都用，地位等於台灣的LINE。"},{"text":"카톡 아이디 알려 주세요","reading":"katok aidi allyeo juseyo","zh":"請告訴我你的KakaoTalk ID","topic":"網路聊天用語","example":"","example_zh":"","note":"알려 주세요＝請告訴我；交換카톡是韓國交朋友的標準流程。"},{"text":"ㅋㅋㅋ","reading":"kekeke","zh":"哈哈哈（韓式笑聲）","topic":"網路聊天用語","example":"진짜 웃겨요 ㅋㅋㅋ","example_zh":"真的好好笑 ㅋㅋㅋ","note":"模擬크크笑聲的子音ㅋ，等於台灣的「哈哈哈」；只打一個ㅋ可能顯得敷衍，多打幾個比較熱情。"},{"text":"ㅎㅎ","reading":"hehe","zh":"呵呵（微笑）","topic":"網路聊天用語","example":"","example_zh":"","note":"比ㅋㅋ溫和收斂的笑，語氣友善；對長輩傳訊息用ㅎㅎ比ㅋㅋ安全。"},{"text":"ㅠㅠ","reading":"yuyu","zh":"嗚嗚（哭哭表情）","topic":"網路聊天用語","example":"시험 망했어요 ㅠㅠ","example_zh":"考試考砸了 ㅠㅠ","note":"母音ㅠ長得像流淚的眼睛；也寫成ㅜㅜ，表達難過、撒嬌都可以。"},{"text":"대박","reading":"daebak","zh":"太讚了／不得了","topic":"網路聊天用語","example":"대박! 진짜예요?","example_zh":"太扯了！真的假的？","note":"驚訝、讚嘆都能用的萬能流行語，正負面情境皆可；朋友間口語，正式場合別用。"},{"text":"헐","reading":"heol","zh":"傻眼／天啊","topic":"網路聊天用語","example":"","example_zh":"","note":"表示震驚或無言的感嘆詞，類似台灣的「傻眼」；屬於年輕人口語。"},{"text":"인스타 해요?","reading":"inseuta haeyo?","zh":"你有玩Instagram嗎？","topic":"網路聊天用語","example":"인스타 해요? 맞팔해요!","example_zh":"你有玩IG嗎？互追吧！","note":"인스타＝인스타그램縮寫；맞팔＝互相追蹤，交換IG是年輕人交友定番。"},{"text":"팔로우할게요","reading":"pallouhalgeyo","zh":"我會追蹤你","topic":"網路聊天用語","example":"","example_zh":"","note":"팔로우＝follow的韓式外來語；-(으)ㄹ게요表示自己主動要做的事。"},{"text":"셀카","reading":"selka","zh":"自拍","topic":"網路聊天用語","example":"같이 셀카 찍어요!","example_zh":"一起自拍吧！","note":"셀카＝셀프 카메라縮寫；合照則說같이 사진 찍어요。"},{"text":"답장 늦어서 미안해요","reading":"dapjang neujeoseo mianhaeyo","zh":"抱歉回覆晚了","topic":"網路聊天用語","example":"","example_zh":"","note":"답장＝回訊；-아/어서表示原因；韓國人回訊速度快，晚回補這句很加分。"},{"text":"이모티콘","reading":"imotikon","zh":"貼圖／表情符號","topic":"網路聊天用語","example":"이 이모티콘 너무 귀여워요.","example_zh":"這個貼圖太可愛了。","note":"KakaoTalk的貼圖文化和LINE類似，送朋友이모티콘是小小的心意。"},{"text":"단톡방","reading":"dantokbang","zh":"群組聊天室","topic":"網路聊天用語","example":"","example_zh":"","note":"단체 카카오톡 방（團體聊天房）的縮寫，等於LINE群組。"},{"text":"읽씹","reading":"ikssip","zh":"已讀不回","topic":"網路聊天用語","example":"읽씹하지 마세요 ㅠㅠ","example_zh":"不要已讀不回啦 ㅠㅠ","note":"읽다（讀）＋씹다（嚼／無視）的合成流行語；年輕人俚語，只在熟人間開玩笑用。"},{"text":"최애","reading":"choeae","zh":"本命／最愛","topic":"網路聊天用語","example":"최애가 누구예요?","example_zh":"你的本命是誰？","note":"최애＝最愛，追星族指最喜歡的成員；聊K-POP時的關鍵單字。"},{"text":"하나, 둘, 셋","reading":"hana, dul, set","zh":"一、二、三（固有數字）","topic":"數字時間","example":"하나, 둘, 셋! 찍을게요.","example_zh":"一、二、三！要拍囉。","note":"固有數字用於數個數、年齡、點鐘；拍照倒數也用它。"},{"text":"일, 이, 삼","reading":"il, i, sam","zh":"一、二、三（漢字數字）","topic":"數字時間","example":"","example_zh":"","note":"漢字數字用於日期、金額、電話號碼、分鐘；發音和台語有點像，台灣人好記。"},{"text":"지금 몇 시예요?","reading":"jigeum myeot siyeyo?","zh":"現在幾點？","topic":"數字時間","example":"","example_zh":"","note":"몇＝幾；「點」用固有數字、「分」用漢字數字，是初學最容易搞混的地方。"},{"text":"세 시 반이에요","reading":"se si banieyo","zh":"三點半","topic":"數字時間","example":"","example_zh":"","note":"반＝半；셋在시前要變成세（셋→세 시）。"},{"text":"오늘 며칠이에요?","reading":"oneul myeochirieyo?","zh":"今天幾號？","topic":"數字時間","example":"","example_zh":"","note":"며칠＝幾號，注意不寫成몇일；日期用漢字數字。"},{"text":"칠월 십오일이에요","reading":"chirwol siboirieyo","zh":"是七月十五日","topic":"數字時間","example":"","example_zh":"","note":"月份用漢字數字＋월；注意六月是유월、十月是시월，發音特殊。"},{"text":"무슨 요일이에요?","reading":"museun yoirieyo?","zh":"今天星期幾？","topic":"數字時間","example":"","example_zh":"","note":"요일＝星期；월화수목금토일分別對應星期一到日，跟日文的曜日同源。"},{"text":"금요일이에요","reading":"geumyoirieyo","zh":"是星期五","topic":"數字時間","example":"불금이에요!","example_zh":"是火熱星期五（週五夜）！","note":"불금＝불타는 금요일（燃燒的星期五），類似「週五夜狂歡」的流行語。"},{"text":"생일이 언제예요?","reading":"saengiri eonjeyeyo?","zh":"你生日是什麼時候？","topic":"數字時間","example":"","example_zh":"","note":"韓國人生日早上喝미역국（海帶湯）；記住朋友生日傳祝福訊息很重要。"},{"text":"전화번호가 뭐예요?","reading":"jeonhwabeonhoga mwoyeyo?","zh":"你的電話號碼是多少？","topic":"數字時間","example":"","example_zh":"","note":"號碼用漢字數字唸；0唸공，例如010是공일공。"},{"text":"얼마예요?","reading":"eolmayeyo?","zh":"多少錢？","topic":"數字時間","example":"이거 얼마예요?","example_zh":"這個多少錢？","note":"購物必備句；金額用漢字數字＋원（韓元）。"},{"text":"만 원이에요","reading":"man wonieyo","zh":"一萬韓元","topic":"數字時間","example":"","example_zh":"","note":"注意韓文的一萬直接說만，不說일만；一萬韓元約台幣兩百多元。"},{"text":"한 시간 후에 만나요","reading":"han sigan hue mannayo","zh":"一小時後見","topic":"數字時間","example":"","example_zh":"","note":"시간＝小時（時間長度）用固有數字；후에＝之後、전에＝之前。"},{"text":"십 분만 기다려 주세요","reading":"sip bunman gidaryeo juseyo","zh":"請等我十分鐘","topic":"數字時間","example":"","example_zh":"","note":"분（分鐘）用漢字數字；만＝只、僅僅，加上去語氣更客氣。"},{"text":"내일 오후 두 시 어때요?","reading":"naeil ohu du si eottaeyo?","zh":"明天下午兩點如何？","topic":"數字時間","example":"","example_zh":"","note":"오전＝上午、오후＝下午；둘在시前變成두（둘→두 시）。"},{"text":"도와주세요","reading":"dowajuseyo","zh":"請幫幫我","topic":"求助應急","example":"","example_zh":"","note":"緊急求助用；緊急程度高時可大喊도와주세요!，一般請求用下一句更客氣。"},{"text":"좀 도와주시겠어요?","reading":"jom dowajusigesseoyo?","zh":"可以幫我一下嗎？","topic":"求助應急","example":"","example_zh":"","note":"-아/어 주시겠어요?是非常客氣的請求句型；좀讓語氣更軟。"},{"text":"한국어를 잘 못해요","reading":"hangugeoreul jal motaeyo","zh":"我韓語說得不好","topic":"求助應急","example":"한국어를 잘 못해요. 영어로 해도 돼요?","example_zh":"我韓語不好，可以用英文嗎？","note":"遇到聽不懂時先說這句，對方通常會放慢或改用簡單的字。"},{"text":"천천히 말해 주세요","reading":"cheoncheonhi malhae juseyo","zh":"請說慢一點","topic":"求助應急","example":"","example_zh":"","note":"천천히＝慢慢地；-아/어 주세요＝請幫我…，初學者保命句。"},{"text":"다시 한번 말해 주세요","reading":"dasi hanbeon malhae juseyo","zh":"請再說一次","topic":"求助應急","example":"","example_zh":"","note":"다시＝再、한번＝一次；口語也常說네?（什麼？）請對方重複，但對長輩用這句更禮貌。"},{"text":"이게 무슨 뜻이에요?","reading":"ige museun tteusieyo?","zh":"這是什麼意思？","topic":"求助應急","example":"","example_zh":"","note":"뜻＝意思；學語言時常用，也可指著單字問이 단어 무슨 뜻이에요?。"},{"text":"화장실이 어디예요?","reading":"hwajangsiri eodiyeyo?","zh":"廁所在哪裡？","topic":"求助應急","example":"","example_zh":"","note":"어디예요?＝在哪裡？把화장실換成지하철역（地鐵站）、편의점（便利商店）就能通用。"},{"text":"길을 잃었어요","reading":"gireul ireosseoyo","zh":"我迷路了","topic":"求助應急","example":"길을 잃었어요. 여기가 어디예요?","example_zh":"我迷路了，這裡是哪裡？","note":"잃다＝丟失；迷路時搭配手機地圖給對方看最有效。"},{"text":"지갑을 잃어버렸어요","reading":"jigabeul ireobeoryeosseoyo","zh":"我的錢包不見了","topic":"求助應急","example":"","example_zh":"","note":"잃어버리다＝弄丟；휴대폰（手機）、여권（護照）都能套進去，旅行必備。"},{"text":"여기가 어디예요?","reading":"yeogiga eodiyeyo?","zh":"這裡是哪裡？","topic":"求助應急","example":"","example_zh":"","note":"여기＝這裡、거기＝那裡（近對方）、저기＝那裡（都遠）。"},{"text":"영어 할 수 있어요?","reading":"yeongeo hal su isseoyo?","zh":"你會說英文嗎？","topic":"求助應急","example":"","example_zh":"","note":"-(으)ㄹ 수 있다＝能夠…；也可以問중국어 할 수 있어요?（你會說中文嗎？）。"},{"text":"몸이 안 좋아요","reading":"momi an joayo","zh":"我身體不舒服","topic":"求助應急","example":"오늘 몸이 안 좋아요. 먼저 갈게요.","example_zh":"我今天不太舒服，先走了。","note":"안＋形容詞＝否定；請假或提早離開時的常用理由。"},{"text":"병원에 가야 해요","reading":"byeongwone gaya haeyo","zh":"我需要去醫院","topic":"求助應急","example":"","example_zh":"","note":"-아/어야 해요＝必須…；韓國的약국（藥局）也能處理小病痛。"},{"text":"경찰서가 어디예요?","reading":"gyeongchalseoga eodiyeyo?","zh":"警察局在哪裡？","topic":"求助應急","example":"","example_zh":"","note":"韓國報警電話是112、火警救護是119，和台灣的110／119不同，要記住。"},{"text":"잠깐만요","reading":"jamkkanmannyo","zh":"等一下／借過一下","topic":"求助應急","example":"","example_zh":"","note":"請對方稍等或在人群中借過都用這句；잠시만요意思相同、更正式一點。"}],"grammar":[{"question":"저는 학생___.（我是學生）","options":["이에요","예요","이요","요"],"answer":0,"explain_zh":"名詞結尾有尾音（받침）時接이에요，沒有尾音時接예요。학생的생以ㅇ結尾有尾音，所以是학생이에요。"},{"question":"제 친구는 가수___.（我朋友是歌手）","options":["이에요","예요","은요","이요"],"answer":1,"explain_zh":"가수的수以母音結尾、沒有尾音，所以接예요：가수예요。有尾音才接이에요。"},{"question":"저___ 대만 사람이에요.（我是台灣人）","options":["는","은","이","가"],"answer":0,"explain_zh":"介紹自己時主題用은/는。저沒有尾音接는；은接在有尾音的字後面。이/가用於強調或帶出新資訊，這裡不適合。"},{"question":"이름___ 뭐예요?（你叫什麼名字？）","options":["은","는","이","가"],"answer":2,"explain_zh":"疑問詞（뭐、누구、어디）前面詢問的對象是新資訊，用主格助詞이/가。이름的름有尾音（ㅁ），所以用이：이름이 뭐예요?。"},{"question":"저는 김치___ 좋아해요.（我喜歡泡菜）","options":["을","를","이","가"],"answer":1,"explain_zh":"좋아해요是他動詞，前面的受詞要接을/를。김치的치沒有尾音，所以接를：김치를 좋아해요。"},{"question":"아침에 밥___ 먹어요.（早上吃飯）","options":["을","를","은","는"],"answer":0,"explain_zh":"먹다的受詞接을/를。밥有尾音（ㅂ），所以接을：밥을 먹어요。를接在沒有尾音的字後面。"},{"question":"저는 매일 학교___ 가요.（我每天去學校）","options":["에","에서","를","은"],"answer":0,"explain_zh":"에表示移動的目的地或方向，和가다（去）、오다（來）搭配：학교에 가요。에서表示動作進行的場所，不能和單純的「去」搭配。"},{"question":"도서관___ 공부해요.（在圖書館唸書）","options":["에","에서","로","까지"],"answer":1,"explain_zh":"공부하다（唸書）是在某地進行的動作，動作發生的場所用에서：도서관에서 공부해요。에用於存在或目的地，例如도서관에 있어요。"},{"question":"A: 주말에 뭐 ___? B: 친구를 만나요.（A：週末要做什麼？）","options":["해요","이에요","있어요","예요"],"answer":0,"explain_zh":"問「做什麼」用動詞하다的해요體：뭐 해요?。이에요/예요接名詞表示「是…」，있어요表示「有／在」，語意都不合。"},{"question":"A: 이게 뭐예요? B: 한국어 책___.（B：是韓語書）","options":["예요","이에요","은요","가요"],"answer":1,"explain_zh":"책有尾音（ㄱ），所以接이에요：책이에요。예요接在沒有尾音的名詞後面，例如의자예요。"},{"question":"저는 아침마다 커피___ 마셔요.（我每天早上喝咖啡）","options":["을","를","이","은"],"answer":1,"explain_zh":"마시다（喝）的受詞接을/를。커피的피沒有尾音，所以接를：커피를 마셔요。"},{"question":"내일 시간이 ___?（你明天有時間嗎？）","options":["있어요","해요","가요","이에요"],"answer":0,"explain_zh":"表示「有／擁有」用있어요，否定是없어요。시간이 있어요?＝有時間嗎？해요是「做」、가요是「去」，語意不合。"},{"question":"어디___ 왔어요?（你從哪裡來？）","options":["에","에서","를","와"],"answer":1,"explain_zh":"에서除了表示動作場所，也表示出發點（從…）：어디에서 왔어요?＝你從哪裡來？回答是대만에서 왔어요（我從台灣來）。"},{"question":"매운 음식을 ___ 먹어요.（我不能吃辣的食物）","options":["안","못","잘","더"],"answer":1,"explain_zh":"못表示「能力上做不到」，안表示「主觀上不想做」。「不能吃辣」是能力問題，所以用못 먹어요；如果說안 먹어요是「我（選擇）不吃」。"},{"question":"주말에 같이 영화 ___?（週末要不要一起看電影？）","options":["볼래요","봤어요","보세요","봐요"],"answer":0,"explain_zh":"-(으)ㄹ래요?用於詢問對方的意願、提出邀約：볼래요?＝要看嗎？봤어요是過去式「看了」，보세요是命令「請看」，봐요當疑問時偏向確認而非邀約，最自然的邀約說法是볼래요?。"}],"lessons":[{"id":"kr-01","title":"韓文字是拼出來的","subtitle":"看懂一個字的積木結構，你就贏一半了","minutes":5,"sections":[{"type":"text","body":"很多人第一眼看到韓文，會覺得像神祕符號或圈圈叉叉。先告訴你一個好消息：韓文其實是【拼音文字】，就像注音或英文字母一樣，是用少少的字母「拼」出來的。它叫한글（Hangeul），是十五世紀世宗大王找學者設計的文字，目標就是【讓一般老百姓也學得會】，所以規則非常整齊。你不需要像學漢字那樣背幾千個字——只要學會二十幾個字母和拼法，理論上所有韓文你都唸得出來。"},{"type":"text","body":"韓文最特別的地方是：字母不是一個接一個排成一排，而是【組成一個方塊】，一塊就是一個音節，像堆積木。每一塊最多有三層：\n\n【초성（初聲）】＝開頭的子音\n【중성（中聲）】＝中間的母音\n【종성（終聲）】＝收尾的子音（可有可無）\n\n拿「韓國」的「韓」＝한來拆解看看：\nㅎ（h）＋ㅏ（a）＋ㄴ（n）→ 한（han）\n\n是不是很像注音的「ㄏ＋ㄢ＝韓」？只是韓文把它們【疊在同一個方塊裡】。以後看到韓文，先在心裡把方塊拆開，就一點都不可怕了。"},{"type":"tip","body":"有個小規則先記著：子音ㅇ放在字首時【不發音】，只是佔位用的（因為每個方塊規定要有開頭子音）。所以안唸「an」，不是「ngan」。"},{"type":"sounds","title":"點擊聽發音：拆積木","items":[{"text":"하","sub":"ㅎ + ㅏ = ha","zh":""},{"text":"안","sub":"ㅇ(不發音) + ㅏ + ㄴ = an","zh":""},{"text":"한","sub":"ㅎ + ㅏ + ㄴ = han","zh":"「韓」的音"},{"text":"안녕","sub":"an-nyeong","zh":"嗨（跟好朋友打招呼）"}]},{"type":"quiz","title":"小試身手","questions":[{"question":"한這個字，是由幾個字母拼起來的？","options":["1 個","2 個","3 個","4 個"],"answer":2,"explain_zh":"한＝ㅎ＋ㅏ＋ㄴ，共 3 個字母：開頭子音、中間母音、收尾子音，疊成一個方塊。"},{"question":"韓文的每一個方塊字，代表的是什麼？","options":["一個單字","一個音節","一個句子","一個聲調"],"answer":1,"explain_zh":"一塊＝一個音節。像안녕就是兩個音節、兩個方塊：안＋녕。"},{"question":"초성（初聲）指的是方塊裡的哪個部分？","options":["收尾的子音","中間的母音","開頭的子音","字的聲調"],"answer":2,"explain_zh":"초성＝開頭子音、중성＝中間母音、종성＝收尾子音。照順序記：初、中、終。"},{"question":"안的第一個字母ㅇ，在字首時要怎麼唸？","options":["唸 ng","不發音，只是佔位","唸 h","唸 m"],"answer":1,"explain_zh":"ㅇ在字首不發音，純粹佔開頭子音的位子，所以안唸「an」。它放在字尾時才唸 ng，這個之後會學到。"}]}]},{"id":"kr-02","title":"基本母音 10 個","subtitle":"點在哪邊、加不加橫，一套邏輯全記住","minutes":6,"sections":[{"type":"text","body":"韓文的基本母音有 10 個，全部由三種筆畫組合：【短橫（點）代表天、橫線ㅡ代表地、直線ㅣ代表人】，是不是很有哲學味？實際記的時候更簡單，用「方向」記：\n\n直線在中間，【點朝右（ㅏ）或朝左（ㅓ）】；橫線在中間，【點朝上（ㅗ）或朝下（ㅜ）】。然後有一個萬用規則：【一點變兩點，前面就多一個 y 的音】，例如ㅏ（a）→ㅑ（ya）、ㅗ（o）→ㅛ（yo）。所以你其實只要記 6 個基本形，剩下的用規則推就好。\n\n母音自己不能單獨成塊，前面要放不發音的ㅇ佔位，所以下面的發音練習都寫成아、야這種形式。"},{"type":"table","title":"形狀記憶法","headers":["字母","羅馬拼音","形狀怎麼記","口型提示"],"rows":[["ㅏ","a","點朝右＝嘴巴向外打開","像注音的ㄚ"],["ㅓ","eo","點朝左＝聲音悶回來","嘴巴放鬆的「喔」，比ㅗ開"],["ㅗ","o","點朝上＝聲音往上","嘴唇收圓的ㄛ"],["ㅜ","u","點朝下＝聲音往下","像注音的ㄨ"],["ㅡ","eu","一條地平線","嘴角往兩邊拉的「呃」"],["ㅣ","i","一個人站著","像注音的ㄧ"],["ㅑ ㅕ ㅛ ㅠ","ya yeo yo yu","兩點＝前面加 y","把上面四個加上ㄧ的滑音"]]},{"type":"sounds","title":"點擊聽發音：10 個母音","items":[{"text":"아","sub":"ㅏ · a","zh":""},{"text":"야","sub":"ㅑ · ya","zh":""},{"text":"어","sub":"ㅓ · eo","zh":""},{"text":"여","sub":"ㅕ · yeo","zh":""},{"text":"오","sub":"ㅗ · o","zh":""},{"text":"요","sub":"ㅛ · yo","zh":""},{"text":"우","sub":"ㅜ · u","zh":""},{"text":"유","sub":"ㅠ · yu","zh":""},{"text":"으","sub":"ㅡ · eu","zh":""},{"text":"이","sub":"ㅣ · i","zh":""}]},{"type":"tip","body":"偷偷預告：韓國人傳訊息打「ㅠㅠ」是哭哭的意思——因為ㅠ長得像一雙流眼淚的眼睛。學會母音，連韓國網路梗都看得懂了。"},{"type":"quiz","title":"小試身手","questions":[{"question":"母音上的一點變成兩點（如ㅏ→ㅑ），發音會怎麼變？","options":["前面多一個 y 的音","變成長音","變成鼻音","完全沒變"],"answer":0,"explain_zh":"一點變兩點＝加 y：ㅏ(a)→ㅑ(ya)、ㅓ(eo)→ㅕ(yeo)、ㅗ(o)→ㅛ(yo)、ㅜ(u)→ㅠ(yu)，一條規則搞定四個母音。"},{"question":"ㅓ的羅馬拼音是哪一個？","options":["a","eo","o","u"],"answer":1,"explain_zh":"點朝左的ㅓ是 eo，發音像嘴巴放鬆、開比較大的「喔」。點朝右的ㅏ才是 a。"},{"question":"韓國人聊天打「ㅠㅠ」是什麼意思？","options":["大笑","生氣","哭哭／嗚嗚","驚訝"],"answer":2,"explain_zh":"ㅠ像流淚的眼睛，所以ㅠㅠ（或ㅜㅜ）＝嗚嗚哭哭。大笑是子音ㅋㅋㅋ，之後會學到。"},{"question":"ㅡ（eu）的發音最接近下面哪一個？","options":["嘴巴大開的ㄚ","像ㄧ的音","嘴角往兩邊拉、齒縫擠出來的「呃」","嘴唇收圓的ㄡ"],"answer":2,"explain_zh":"ㅡ是中文沒有的音：嘴巴不圓、嘴角往兩邊拉，喉嚨發出短短的「呃」。多聽幾次音檔模仿看看。"}]}]},{"id":"kr-03","title":"基本子音 14 個","subtitle":"字母形狀就是你的嘴巴構造圖","minutes":7,"sections":[{"type":"text","body":"基本子音有 14 個。當年設計時有個超聰明的巧思：【字母形狀模仿發音時的口腔動作】。例如：\n\n・ㄱ：舌根抬起頂住的樣子 → g/k\n・ㄴ：舌尖頂上排牙齦的樣子 → n\n・ㅁ：嘴唇閉起來的形狀 → m\n・ㅅ：像牙齒的形狀 → s\n・ㅇ：喉嚨的圓形 → 字首不發音\n\n其他子音大多是在這五個基本形上【加筆畫，表示氣更強】：ㄱ→ㅋ、ㄷ→ㅌ、ㅂ→ㅍ、ㅈ→ㅊ。也就是說，長得像的子音，發音位置也一樣，只差送氣強弱。"},{"type":"table","title":"14 個子音與注音對照","headers":["字母","羅馬拼音","接近的注音","小提醒"],"rows":[["ㄱ","g/k","ㄍ～ㄎ之間","字首輕、字中偏濁"],["ㄴ","n","ㄋ",""],["ㄷ","d/t","ㄉ～ㄊ之間","字首輕、字中偏濁"],["ㄹ","r/l","ㄌ","帶一點彈舌，介於 r 和 l"],["ㅁ","m","ㄇ",""],["ㅂ","b/p","ㄅ～ㄆ之間","字首輕、字中偏濁"],["ㅅ","s","ㄙ","遇到ㅣ時唸起來像「西」（拼寫仍是 si）"],["ㅇ","-/ng","（字首不發音）","字尾才唸 ng"],["ㅈ","j","ㄗ～ㄐ之間",""],["ㅊ","ch","ㄘ～ㄑ之間","ㅈ的送氣版"],["ㅋ","k","ㄎ","ㄱ的送氣版"],["ㅌ","t","ㄊ","ㄷ的送氣版"],["ㅍ","p","ㄆ","ㅂ的送氣版"],["ㅎ","h","ㄏ",""]]},{"type":"sounds","title":"點擊聽發音：子音＋ㅏ","items":[{"text":"가","sub":"ga","zh":""},{"text":"나","sub":"na","zh":""},{"text":"다","sub":"da","zh":""},{"text":"라","sub":"ra","zh":""},{"text":"마","sub":"ma","zh":""},{"text":"바","sub":"ba","zh":""},{"text":"사","sub":"sa","zh":""},{"text":"아","sub":"a（ㅇ不發音）","zh":""},{"text":"자","sub":"ja","zh":""},{"text":"차","sub":"cha","zh":""},{"text":"카","sub":"ka","zh":""},{"text":"타","sub":"ta","zh":""},{"text":"파","sub":"pa","zh":""},{"text":"하","sub":"ha","zh":""}]},{"type":"tip","body":"ㄱ標成 g/k、ㄷ標成 d/t，不是課本在耍你——同一個字母在字首聽起來偏清（像ㄎ），夾在母音中間偏濁（像ㄍ）。不用糾結，跟著音檔唸，嘴巴會自己找到位置。"},{"type":"quiz","title":"小試身手","questions":[{"question":"ㅁ的形狀，模仿的是發音時的哪個部位？","options":["舌根","閉起來的嘴唇","牙齒","喉嚨"],"answer":1,"explain_zh":"ㅁ就是嘴唇閉起來的方形，發 m 音。喉嚨的圓形是ㅇ、牙齒是ㅅ、舌根是ㄱ。"},{"question":"ㅎ的發音最接近哪個注音？","options":["ㄏ","ㄋ","ㄇ","ㄌ"],"answer":0,"explain_zh":"ㅎ＝h＝ㄏ。像하（ha）、안녕하세요的하就是它。"},{"question":"ㅋ、ㅌ、ㅍ、ㅊ和ㄱ、ㄷ、ㅂ、ㅈ的關係是什麼？","options":["完全無關","是它們的送氣加強版","是它們的鼻音版","只是寫法不同、發音相同"],"answer":1,"explain_zh":"加一筆＝送氣變強：ㄱ→ㅋ、ㄷ→ㅌ、ㅂ→ㅍ、ㅈ→ㅊ。發音位置相同，只差那口氣。"},{"question":"哪個子音放在字首時不發音？","options":["ㅅ","ㅇ","ㄹ","ㅍ"],"answer":1,"explain_zh":"ㅇ在字首只是佔位不發音（아＝a）；放在字尾當收尾音時才唸 ng。"}]}]},{"id":"kr-04","title":"拼讀組合：가나다라開口唸","subtitle":"子音×母音，你已經能唸出真正的韓文了","minutes":7,"sections":[{"type":"text","body":"字母都認識了，現在把積木疊起來！子音＋母音就是一個完整的音節：ㄱ＋ㅏ＝가（ga）、ㄴ＋ㅜ＝누（nu）。韓國小朋友學拼讀時就是唸【가나다라마바사……】，地位跟我們的ㄅㄆㄇㄈ一樣。"},{"type":"text","body":"疊法只有兩種，看母音的長相決定：\n\n・【直式母音】（ㅏㅑㅓㅕㅣ）：寫在子音的【右邊】→ 가、니\n・【橫式母音】（ㅗㅛㅜㅠㅡ）：寫在子音的【下面】→ 고、누\n\n道理很直觀：直的站旁邊、橫的躺下面，方塊才會方方正正。"},{"type":"table","title":"迷你拼音表（子音×母音）","headers":["","ㅏ (a)","ㅗ (o)","ㅜ (u)","ㅣ (i)"],"rows":[["ㄱ (g)","가 ga","고 go","구 gu","기 gi"],["ㄴ (n)","나 na","노 no","누 nu","니 ni"],["ㄷ (d)","다 da","도 do","두 du","디 di"],["ㄹ (r)","라 ra","로 ro","루 ru","리 ri"],["ㅁ (m)","마 ma","모 mo","무 mu","미 mi"],["ㅅ (s)","사 sa","소 so","수 su","시 si"]]},{"type":"sounds","title":"點擊聽發音：拼讀練習","items":[{"text":"가나다라","sub":"ga-na-da-ra","zh":"韓文的「ㄅㄆㄇㄈ」"},{"text":"나","sub":"na","zh":"我（跟熟朋友說話時用的「我」）"},{"text":"우리","sub":"u-ri","zh":"我們"},{"text":"어디","sub":"eo-di","zh":"哪裡"},{"text":"여기","sub":"yeo-gi","zh":"這裡"},{"text":"가수","sub":"ga-su","zh":"歌手"},{"text":"커피","sub":"keo-pi","zh":"咖啡"}]},{"type":"tip","body":"從今天起，看到韓劇片名、專輯封面、泡麵包裝，都試著拆拆看、唸唸看。拼對一個字的成就感，比背十個單字還持久。"},{"type":"quiz","title":"小試身手","questions":[{"question":"ㄴ＋ㅜ拼起來是哪個字？","options":["누","나","니","노"],"answer":0,"explain_zh":"ㅜ是橫式母音，寫在ㄴ下面＝누（nu）。나是ㄴ＋ㅏ、니是ㄴ＋ㅣ、노是ㄴ＋ㅗ。"},{"question":"ㅗ這種橫式母音，要寫在子音的哪裡？","options":["右邊","下面","上面","左邊"],"answer":1,"explain_zh":"橫式母音（ㅗㅜㅡ等）躺在子音下面，如고、누；直式母音（ㅏㅓㅣ等）站在右邊，如가、니。"},{"question":"어디是什麼意思？","options":["我們","哪裡","這裡","歌手"],"answer":1,"explain_zh":"어디＝哪裡。之後問路的어디예요?（在哪裡？）就是用它。우리＝我們、여기＝這裡、가수＝歌手。"},{"question":"기是由哪兩個字母拼成的？","options":["ㄱ＋ㅣ","ㄴ＋ㅣ","ㄱ＋ㅏ","ㅋ＋ㅣ"],"answer":0,"explain_zh":"기＝ㄱ（g）＋ㅣ（i）＝gi。여기（這裡）的기就是它。"}]}]},{"id":"kr-05","title":"收尾音받침","subtitle":"疊在最下面的第三塊積木，只有 7 種聲音","minutes":7,"sections":[{"type":"text","body":"還記得第一課的한嗎？最下面那個ㄴ就是【받침（收尾音）】——疊在音節方塊最底部的子音。받침原意是「墊子、支架」，很形象吧。\n\n好消息是：雖然很多子音都能當받침，但實際發音【只有 7 種代表音】。而且這 7 種對台灣人不算陌生——ㄱ、ㄷ、ㅂ收尾就像台語的入聲字（例如台語「十」sip 結尾閉嘴唇的感覺），是短促的急煞車，不把音完整發出來。"},{"type":"table","title":"7 種代表音","headers":["代表音","羅馬拼音","感覺","例字"],"rows":[["ㄱ","k","舌根急煞，像台語「國」的尾音","한국（韓國）"],["ㄴ","n","舌尖抵住，像ㄢㄣ的尾音","시간（時間）"],["ㄷ","t","舌尖急煞（ㅅㅈㅊㅌㅎ等收尾都唸它）","듣다（聽）"],["ㄹ","l","舌尖輕捲，像英文的 l","잘（好好地）"],["ㅁ","m","閉上嘴唇哼一下","이름（名字）"],["ㅂ","p","閉上嘴唇急煞，像台語「十」","밥（飯）"],["ㅇ","ng","鼻音，像ㄤㄥ的尾音","학생（學生）"]]},{"type":"sounds","title":"點擊聽發音：받침例字","items":[{"text":"밥","sub":"bap · ㅂ收尾","zh":"飯"},{"text":"한국","sub":"han-guk · ㄴ和ㄱ收尾","zh":"韓國"},{"text":"이름","sub":"i-reum · ㅁ收尾","zh":"名字"},{"text":"학생","sub":"hak-saeng · ㄱ和ㅇ收尾","zh":"學生"},{"text":"잘","sub":"jal · ㄹ收尾","zh":"好好地"},{"text":"시간","sub":"si-gan · ㄴ收尾","zh":"時間"}]},{"type":"tip","body":"ㅅ、ㅈ、ㅊ、ㅌ、ㅎ當받침時通通唸成ㄷ（t）的急煞音。所以看到陌生받침別慌，先想「它屬於 7 種裡的哪一種」。"},{"type":"quiz","title":"小試身手","questions":[{"question":"받침寫在音節方塊的什麼位置？","options":["左上","右上","最下面","寫在前一個字的旁邊"],"answer":2,"explain_zh":"받침（收尾音）疊在方塊最底部，是第三層積木，例如한最下面的ㄴ。"},{"question":"학생這個詞裡，總共有幾個받침？","options":["0 個","1 個","2 個","3 個"],"answer":2,"explain_zh":"학的ㄱ和생的ㅇ，共 2 個받침。所以唸 hak-saeng，一個急煞一個鼻音。"},{"question":"ㅅ當받침的時候，實際唸成哪個代表音？","options":["ㄱ（k）","ㄷ（t）","ㅂ（p）","ㅇ（ng）"],"answer":1,"explain_zh":"ㅅ、ㅈ、ㅊ、ㅌ、ㅎ收尾時全部歸到ㄷ（t）的舌尖急煞音，這就是「很多字母、只有 7 種聲音」的意思。"},{"question":"밥（飯）的收尾音，發音的感覺是？","options":["閉上嘴唇急煞的 p","舌尖的 t","鼻音 ng","捲舌的 r"],"answer":0,"explain_zh":"ㅂ받침＝雙唇閉住、聲音急停，很像台語入聲「十（sip）」的結尾。之後學밥 먹었어요?（吃飯了嗎？）就用得到。"}]}]},{"id":"kr-06","title":"雙子音與複合母音","subtitle":"喉嚨繃緊的緊音，還有ㅐ/ㅔ的世紀難題","minutes":7,"sections":[{"type":"text","body":"先幫第三課的舊朋友取正式名字：가這種基本版子音叫【平音】，카這種加筆畫的送氣加強版叫【激音】。今天要認識第三兄弟——把子音寫兩次的【雙子音（緊音）】：ㄲ、ㄸ、ㅃ、ㅆ、ㅉ。它的訣竅是【喉嚨和肌肉繃緊、完全不送氣】，聲音又短又硬。\n\n拿手掌放嘴巴前面感覺一下三兄弟的差別：\n・가（平音）：輕輕的，一點點氣\n・카（激音）：一大口氣噴在手上\n・까（緊音）：【幾乎沒有氣】，但喉嚨緊緊的、音很結實\n\n有點像台語「餅（piánn）」開頭那種又硬又不噴氣的感覺。網路笑聲ㅋㅋㅋ用的是激音ㅋ，而진짜（真的）的ㅉ就是緊音——唸對了才有那種「真·的·假·的！」的力道。"},{"type":"sounds","title":"點擊聽發音：緊音","items":[{"text":"까","sub":"kka","zh":""},{"text":"따","sub":"tta","zh":""},{"text":"빠","sub":"ppa","zh":""},{"text":"싸","sub":"ssa","zh":""},{"text":"짜","sub":"jja","zh":""},{"text":"진짜","sub":"jin-jja","zh":"真的"},{"text":"오빠","sub":"o-ppa","zh":"哥哥（女生的叫法）"}]},{"type":"text","body":"母音也能組合。最常用的是這幾個：ㅐ（ae）、ㅔ（e）、ㅘ（wa）、ㅝ（wo）、ㅟ（wi）、ㅢ（ui）。還記得第二課「一點變兩點＝加 y」嗎？這裡一樣通用：ㅐ→ㅒ（yae）、ㅔ→ㅖ（ye），像正式回答「是」的예用的就是ㅖ。\n\n然後是初學者的世紀難題：【ㅐ和ㅔ聽起來到底差在哪？】答案讓你安心——【現代韓國人自己也唸得一模一樣】，連他們拼字都會拼錯。所以策略很簡單：發音都唸「ㄝ」就好，【拼寫跟著單字背】：대만（台灣）用ㅐ、게임（遊戲）用ㅔ，看到一個記一個，不用糾結耳朵。"},{"type":"sounds","title":"點擊聽發音：ㅐ/ㅔ常見字","items":[{"text":"대만","sub":"dae-man · 用ㅐ","zh":"台灣"},{"text":"네","sub":"ne · 用ㅔ","zh":"是的"},{"text":"게임","sub":"ge-im · 用ㅔ","zh":"遊戲"},{"text":"어때요?","sub":"eo-ttae-yo · 用ㅐ","zh":"如何？怎麼樣？"}]},{"type":"tip","body":"自我介紹說「我是台灣人」的대만就是ㅐ；約朋友問「星期六如何？」的어때요?也是ㅐ，而且還有緊音ㄸ。這兩個字之後的課會天天見。"},{"type":"quiz","title":"小試身手","questions":[{"question":"緊音（ㄲㄸㅃㅆㅉ）的發音特徵是什麼？","options":["送出一大口氣","喉嚨繃緊、幾乎不送氣","帶鼻音","要捲舌"],"answer":1,"explain_zh":"緊音的關鍵是肌肉繃緊＋不送氣，聲音短而結實。送一大口氣的是激音（ㅋㅌㅍㅊ）。"},{"question":"진짜（真的）裡的ㅉ屬於哪一類？","options":["平音","激音","緊音","收尾音"],"answer":2,"explain_zh":"ㅉ是ㅈ寫兩次的緊音。唸진짜時짜要又短又硬、不噴氣，才有「真的假的！」的味道。"},{"question":"ㅐ和ㅔ在現代韓語口語中的差別是？","options":["差非常多，聽錯會鬧笑話","發音幾乎一樣，靠背單字記拼寫","ㅐ是長音、ㅔ是短音","ㅐ只用在外來語"],"answer":1,"explain_zh":"現代韓國人把ㅐ和ㅔ唸得一樣，連母語者都會拼錯。發音統一唸「ㄝ」，拼寫跟著單字記就好。"},{"question":"대만（台灣）的대，用的是哪個母音？","options":["ㅔ","ㅐ","ㅖ","ㅘ"],"answer":1,"explain_zh":"대만用ㅐ（ae）：daeman。跟韓國朋友自我介紹저는 대만 사람이에요（我是台灣人）時就會寫到它。"}]}]},{"id":"kr-07","title":"連音與音變入門","subtitle":"為什麼먹어요唸成「머거요」？","minutes":6,"sections":[{"type":"text","body":"你可能發現了：韓文有時候【寫的和唸的不一樣】。別怕，這不是陷阱，是為了唸起來順口。音變規則不少，但初學只要抓【最常見的 3 種】就夠用了。\n\n第一種也是最重要的：【連音】。當一個字有받침、下一個字以ㅇ（空位）開頭時，받침會【滑過去佔那個空位】。經典例子：먹어요（吃）——먹的ㄱ滑到어上面，實際唸成【머거요】。寫是먹어요，唸是머거요，就這麼回事。"},{"type":"table","title":"最常見的 3 種音變","headers":["規則","怎麼變","例子","實際唸法"],"rows":[["連音","받침滑到下一個ㅇ的空位","먹어요（吃）","머거요"],["ㅎ弱化","夾在母音間的ㅎ幾乎消失","좋아요（好、讚）","조아요"],["鼻音化","ㅂ遇到ㄴ變成ㅁ","합니다（正式語尾）","함니다"]]},{"type":"sounds","title":"點擊聽發音：寫的vs唸的","items":[{"text":"먹어요","sub":"meogeoyo · 唸[머거요]","zh":"吃"},{"text":"좋아요","sub":"joayo · 唸[조아요]","zh":"好、讚"},{"text":"맛있어요","sub":"masisseoyo · 唸[마시써요]","zh":"好吃"},{"text":"감사합니다","sub":"gamsahamnida · 唸[감사함니다]","zh":"謝謝（正式）"}]},{"type":"tip","body":"不用死背規則！這些音變都是「嘴巴偷懶的自然結果」，跟著音檔多唸幾次，你的嘴巴自己就會變過去。規則只是幫你理解「為什麼聽起來不一樣」。"},{"type":"quiz","title":"小試身手","questions":[{"question":"먹어요實際上唸成什麼？","options":["먹-어-요 一格一格分開唸","머거요","멍어요","메꺼요"],"answer":1,"explain_zh":"먹的받침ㄱ滑到下一格어的ㅇ空位上：먹어요→[머거요]。這就是連音。"},{"question":"連音會在什麼情況下發生？","options":["前字有받침、後字以ㅇ開頭時","兩個字都沒有받침時","只在唱歌的時候","只在正式場合"],"answer":0,"explain_zh":"받침後面接ㅇ開頭（空位）的字，받침就滑過去，例如맛있어요唸[마시써요]。"},{"question":"감사합니다的합니다部分，實際唸成？","options":["합니다，照字唸","함니다","하니다","합미다"],"answer":1,"explain_zh":"ㅂ받침遇到ㄴ會鼻音化變成ㅁ：합니다→[함니다]。以後聽到「感謝哈姆尼達」就知道為什麼了。"},{"question":"좋아요裡的ㅎ怎麼處理？","options":["用力唸得很重","幾乎不發音，唸成[조아요]","變成ㄱ的音","變成ㅁ的音"],"answer":1,"explain_zh":"ㅎ夾在母音之間會弱化到幾乎聽不見：좋아요→[조아요]。按讚的「좋아요」就是這個字。"}]}]},{"id":"kr-08","title":"打招呼句型","subtitle":"拆解안녕하세요，順便學會「我是○○」","minutes":7,"sections":[{"type":"text","body":"終於要開口說整句了！先拆解你一定聽過的안녕하세요：\n\n【안녕】＝漢字「安寧」，就是平安的意思\n【하세요】＝動詞하다（做）的客氣尊敬形\n\n合起來像客氣地問候「您安好嗎？」，所以안녕하세요不分早午晚、對誰都能用，是最萬用的問候。而單獨一句【안녕】是半語（반말），只能對很熟的同齡朋友或晚輩說——對長輩或初次見面的人只說안녕會很失禮，這是韓國文化的大地雷，先記起來。"},{"type":"sounds","title":"點擊聽發音：打招呼","items":[{"text":"안녕하세요","sub":"annyeonghaseyo","zh":"你好（萬用）"},{"text":"안녕","sub":"annyeong","zh":"嗨（只對熟朋友）"},{"text":"만나서 반가워요","sub":"mannaseo bangawoyo","zh":"很高興認識你"}]},{"type":"text","body":"打完招呼就要自我介紹了。韓文的「是～」放在句尾，有兩張面孔：【이에요／예요】。選哪個只看一件事——【前面名詞的最後一個字有沒有받침】：\n\n・有받침 → 이에요：학생【이에요】（是學生，생有ㅇ받침）\n・沒받침 → 예요：가수【예요】（是歌手，수沒받침）\n\n為什麼？有받침時多墊一個이，唸起來才順——還記得第七課的連音嗎？사람이에요會唸成[사라미에요]，람的ㅁ剛好滑到이的空位上。\n\n例句裡有兩個新面孔先打個照面：【저】是「我」的客氣說法（第四課的나只對熟朋友用），後面的【는】是「說到我呢～」的主題小尾巴，先把저는（我呢）當固定組合記住；【제】＝「我的」。至於問名字的이름이 뭐예요?，句中的이也是一個小助詞，現階段把整句當固定句型背起來最省力。"},{"type":"table","title":"이에요／예요 選擇器","headers":["名詞結尾","接什麼","例句","意思"],"rows":[["有받침（학생）","이에요","저는 학생이에요","我是學生"],["沒받침（가수）","예요","제 친구는 가수예요","我朋友是歌手"],["有받침（사람）","이에요","저는 대만 사람이에요","我是台灣人"]]},{"type":"sounds","title":"點擊聽發音：自我介紹","items":[{"text":"저는 대만 사람이에요","sub":"jeoneun daeman saramieyo","zh":"我是台灣人"},{"text":"저는 학생이에요","sub":"jeoneun haksaengieyo","zh":"我是學生"},{"text":"이름이 뭐예요?","sub":"ireumi mwoyeyo?","zh":"你叫什麼名字？"}]},{"type":"tip","body":"跟韓國朋友第一次見面的黃金三句：안녕하세요 → 저는 대만 사람이에요 → 만나서 반가워요。講完這三句，對方通常眼睛會亮起來。"},{"type":"quiz","title":"小試身手","questions":[{"question":"對初次見面的長輩打招呼，應該說哪句？","options":["안녕","안녕하세요","잘 가","야!"],"answer":1,"explain_zh":"안녕하세요對誰都不失禮；안녕是半語，只能對很熟的同齡朋友用，對長輩說會很沒禮貌。"},{"question":"저는 학생___.（我是學生）空格填什麼？","options":["예요","이에요","이야","요"],"answer":1,"explain_zh":"학생的생有받침（ㅇ），所以接이에요：학생이에요。"},{"question":"제 친구는 가수___.（我朋友是歌手）空格填什麼？","options":["예요","이에요","은요","이요"],"answer":0,"explain_zh":"가수的수以母音結尾、沒有받침，所以接예요：가수예요。"},{"question":"안녕하세요的안녕，原本的意思是？","options":["安寧、平安","再見","吃飯了嗎","早上好"],"answer":0,"explain_zh":"안녕＝漢字「安寧」。안녕하세요字面是「願你平安」，所以任何時段、任何對象都適用。"}]}]},{"id":"kr-09","title":"해요體入門","subtitle":"交朋友最好用的說話方式，變化規則一次搞定","minutes":7,"sections":[{"type":"text","body":"韓語說話有「等級」，初學先認識三層就好：\n\n・【합쇼體】（-습니다）：最正式，新聞、面試、對客戶\n・【해요體】（-아/어요）：客氣又不僵硬，日常最常用\n・【반말】（半語）：只對很熟的同齡朋友或晚輩\n\n為什麼交朋友用【해요體】？因為它是「禮貌與親切的甜蜜點」——夠尊重、不失禮，又不會像합쇼體那樣有距離感。對新認識的韓國朋友用해요體，等對方提議말 놓자（我們講半語吧），再切換成반말，這是韓國交友的標準流程。"},{"type":"text","body":"해요體的變化規則，最簡版只有三條：\n\n1. 去掉原形的다，看語幹最後一個母音\n2. 是【ㅏ或ㅗ】→ 接아요；【其他】→ 接어요\n3. 【하다結尾】的動詞 → 直接變해요\n\n例如：가다（去）→ 가＋아요 → 縮成【가요】；먹다（吃）→ 먹＋어요 →【먹어요】；좋아하다（喜歡）→【좋아해요】。就這樣，你已經會變韓語動詞了。"},{"type":"table","title":"動詞變化練習","headers":["原形","規則","해요體","意思"],"rows":[["가다","ㅏ → 아요（縮寫）","가요","去"],["먹다","ㅓ → 어요","먹어요","吃"],["마시다","시＋어요 → 縮成셔요","마셔요","喝"],["있다","有받침擋著不能縮，直接接어요","있어요","有、在"],["좋아하다","하다 → 해요","좋아해요","喜歡"]]},{"type":"sounds","title":"點擊聽發音：해요體動詞","items":[{"text":"가요","sub":"gayo","zh":"去"},{"text":"먹어요","sub":"meogeoyo","zh":"吃"},{"text":"마셔요","sub":"masyeoyo","zh":"喝"},{"text":"있어요","sub":"isseoyo","zh":"有、在"},{"text":"좋아해요","sub":"joahaeyo","zh":"喜歡"},{"text":"케이팝 좋아해요","sub":"keipap joahaeyo","zh":"我喜歡 K-POP（口語常這樣直接說）"}]},{"type":"tip","body":"해요體還有隱藏福利：同一句話【句尾上揚就是問句】。커피 마셔요?（要喝咖啡嗎？）↗、커피 마셔요（我在喝咖啡）↘——不用改字，改語調就好。"},{"type":"quiz","title":"小試身手","questions":[{"question":"跟剛認識的韓國朋友說話，最安全的說話方式是？","options":["반말（半語）","해요體","都用英文","합쇼體全程到底"],"answer":1,"explain_zh":"해요體客氣又親切，是交朋友的預設值。반말要等夠熟、對方提議之後才能用；합쇼體太正式會有距離感。"},{"question":"먹다（吃）的해요體是？","options":["먹아요","먹어요","먹여요","먹해요"],"answer":1,"explain_zh":"먹的母音是ㅓ，不是ㅏ/ㅗ，所以接어요：먹어요。還記得嗎？實際唸起來是[머거요]。"},{"question":"하다（做）的해요體是？","options":["해요","하아요","하요","했요"],"answer":0,"explain_zh":"하다家族是特例，直接變해요。所以좋아하다→좋아해요、말하다→말해요，超多動詞都適用。"},{"question":"가다（去）的語幹母音是ㅏ，所以要接？","options":["아요，而且가아縮成가，變가요","어요，變가어요","여요，變가여요","해요，變가해요"],"answer":0,"explain_zh":"ㅏ/ㅗ接아요；가＋아重複了就縮成一個가，所以是가요。오다（來）同理變와요。"}]}]},{"id":"kr-10","title":"數字與時間","subtitle":"兩套數字系統，用錯場合韓國人會愣一下","minutes":8,"sections":[{"type":"text","body":"韓語有【兩套數字】，這是初學最容易搞混的地方，先把觀念建好：\n\n・【漢字語數字】일、이、삼、사……：從漢字「一二三」來的，發音跟台語有夠像（일=一 il、삼=三 sam），台灣人根本自帶外掛\n・【固有語數字】하나、둘、셋、넷……：韓語土生土長的數法\n\n粗略的分工是：【漢字語管「編號類」】（日期、金額、電話號碼、分鐘），【固有語管「數東西類」】（幾個、幾歲、幾點鐘、幾個人）。拍照倒數「一、二、三！」用的是固有語：하나, 둘, 셋!"},{"type":"sounds","title":"點擊聽發音：兩套數字","items":[{"text":"일, 이, 삼","sub":"il, i, sam · 漢字語","zh":"一、二、三（編號類）"},{"text":"하나, 둘, 셋","sub":"hana, dul, set · 固有語","zh":"一、二、三（數東西類）"}]},{"type":"table","title":"什麼場合用哪套？","headers":["場合","用哪套","例子"],"rows":[["日期、月份","漢字語","칠월 십오일（7月15日）"],["金額","漢字語","만 원（一萬韓元）"],["電話號碼","漢字語","010＝공일공（0唸공）"],["分鐘","漢字語","십 분（10分鐘）"],["點鐘","固有語","세 시（3點）"],["年齡","固有語","스물다섯 살（25歲）"],["數個數、人數","固有語","커피 한 잔（一杯咖啡）"]]},{"type":"text","body":"最經典的混合題：講時間時【「點」用固有語、「分」用漢字語】，同一句話兩套並用——세 시 십 분（3點10分）。\n\n還有一個小變身要注意：固有語數字接單位詞時，前四個會「瘦身」：하나→【한】、둘→【두】、셋→【세】、넷→【네】。所以是한 시（1點）、두 시（2點）、세 시（3點），不是하나 시。"},{"type":"sounds","title":"點擊聽發音：時間與金額","items":[{"text":"지금 몇 시예요?","sub":"jigeum myeot siyeyo?","zh":"現在幾點？"},{"text":"세 시 반이에요","sub":"se si banieyo · 반＝漢字「半」","zh":"三點半"},{"text":"얼마예요?","sub":"eolmayeyo?","zh":"多少錢？"},{"text":"만 원이에요","sub":"man wonieyo","zh":"一萬韓元"}]},{"type":"tip","body":"韓文的「一萬」直接說만，不說일만——所以是만 원（一萬韓元），約台幣兩百多元。去韓國逛街聽到만 원別再等「一」了。"},{"type":"quiz","title":"小試身手","questions":[{"question":"「三點」的韓語怎麼說？","options":["세 시","삼 시","셋 시","서 시"],"answer":0,"explain_zh":"點鐘用固有語，而且셋接시時要瘦身成세：세 시。삼是漢字語，用在分鐘、日期那邊。"},{"question":"唸電話號碼要用哪套數字？","options":["固有語（하나둘셋）","漢字語（일이삼）","兩套隨便混用","只能用英文唸"],"answer":1,"explain_zh":"電話號碼是「編號類」，用漢字語，而且0唸공：010＝공일공。"},{"question":"세 시 십 분（3點10分）這句話，「분（分）」用的是哪套？","options":["漢字語","固有語","兩套都不是","英文外來語"],"answer":0,"explain_zh":"時間是兩套並用的經典：「點」用固有語（세 시）、「分」用漢字語（십 분），一句話裡兩套一起上場。"},{"question":"만 원是多少錢？","options":["十萬韓元","一千韓元","一萬韓元","一百韓元"],"answer":2,"explain_zh":"만＝萬，만 원＝一萬韓元。注意韓文直接說만，不說일만，跟中文習慣不同。"}]}]}]}};

/* engine.js — 語言學習小幫手 學習引擎（純 JS 移植版）
 *
 * 1:1 移植自 study_app.py 的 Progress / WebApp 邏輯：
 *   - SRS：Leitner 5 盒，間隔 0/1/2/4/7 天；記得升盒（最多 5）、不記得回第 1 盒。
 *   - 自適應引擎：lv 0-5 題型階梯、verify 優先、速度分類（預設門檻 / EWMA 相對門檻）、
 *     連續快答跳升、未到期卡答對只重設 due、可疑答對凍結 box/due。
 *   - 日文「含漢字」items 改走假名認讀階梯（JP_KANJI_LADDER，lv1=mc_kana）；
 *     items 有 distractors_zh（≥3）時 session 卡帶出前 3 個精準辨析干擾項。
 *   - 維持複習：已見過、未到期、lv≥3 的卡按比例回鍋（base 15%、下限 2；
 *     到期卡清空時純維持複習上限 10）。
 *   - 教學課程：語言資料頂層 lessons（含 id 的物件才算）；完成課程冪等記錄於
 *     progress 根層 "lessons": {語言: [id, ...]}，只更新 streak/last_study_date、
 *     不動 daily 答題統計（對應 Python touch_study_day）。
 *   - 進度序列化格式與 data/progress.json 完全相同
 *     （languages/daily/streak/last_study_date/mode_ms/mode_n/lessons；
 *       卡片含 box/due/correct/wrong/lv/fast/verify），可與 Mac 版互相匯入匯出。
 *
 * 用法：
 *   const engine = createEngine(DATA, storage);
 *     DATA    = {english: {...}, japanese: {...}, korean: {...}}（同 data/*.json 內容）
 *     storage = {get(): string|null, set(string)}（localStorage 或記憶體物件）
 *   方法（皆為 async）：apiState / apiLanguage / apiSession / apiAnswer /
 *   apiLesson / apiInsights / exportProgress / importProgress / resetProgress。
 *
 * 同時支援瀏覽器（window.createEngine）與 Node（module.exports.createEngine）。
 */
(function () {
  "use strict";

  // ── 常數（與 study_app.py 完全一致）──────────────────────────────

  var BOX_INTERVALS = { 1: 0, 2: 1, 3: 2, 4: 4, 5: 7 }; // 盒號 → 間隔天數
  var MAX_BOX = 5;

  var MAX_LV = 5;              // 掌握度 0-5
  var ABS_SLOW_MS = 25000;     // 超過一律視為 slow

  // 題型 → [預設 fast 門檻, 預設 slow 門檻]；樣本 n≥3 後改用相對門檻
  var SPEED_DEFAULTS = {
    mc_f2z: [4000, 10000],
    mc_z2f: [4000, 10000],
    mc_kana: [4000, 10000],
    listen_mc: [4000, 10000],
    spell: [8000, 20000],
    cloze: [8000, 20000],
  };
  var ADAPTIVE_FORMATS = Object.keys(SPEED_DEFAULTS);
  var CONFIDENCES = ["fast", "sure", "hesitant", "guess"];

  var LV_LADDER = { 0: "mc_f2z", 1: "mc_z2f", 2: "spell", 3: "listen_mc", 4: "cloze" };

  // 日文「含漢字」items 專屬階梯：假名認讀（mc_kana）成為 lv1 難度關卡；
  // 其他語言與純假名日文 items 維持 LV_LADDER。
  var JP_KANJI_LADDER = { 0: "mc_f2z", 1: "mc_kana", 2: "mc_z2f",
                          3: "spell", 4: "listen_mc" };

  var CLOZE_BLANK = "＿＿＿";

  var LADDER_REASONS = {
    mc_f2z: "還在初步認識階段，先從選出中文意思開始。",
    mc_kana: "假名認讀關卡：不給漢字，確認你真的會唸。",
    mc_z2f: "已經認得這個字，反過來由中文選出外語加深印象。",
    spell: "選擇題都沒問題了，改用拼寫確認真的記住了。",
    listen_mc: "拼得出來了，換聽發音選意思，練習用耳朵辨認。",
    cloze: "掌握度很高，用例句挖空考驗實際運用。",
  };
  var REASON_LV4_NO_CLOZE = "掌握度很高，這個字沒有合適例句，用拼寫再鞏固一次。";
  var REASON_LV5 = "已完全掌握，隨機換題型保持記憶新鮮。";

  var MAINT_MIN_LV = 3;    // 已見過、今日未到期、lv≥ 此值的卡才進維持池
  var MAINT_PCT = 15;      // base 非空時，抽 base 的 15% 當維持卡
  var MAINT_MIN_DRAW = 2;  // 但至少抽 2 張（不超過維持池大小）
  var MAINT_PURE_MAX = 10; // base 為空時，純維持複習最多回傳張數
  var MAINT_REASON_PREFIX = "維持複習：熟練的字定期回鍋防遺忘——";

  var VERIFY_REASONS = {
    spell: "上次答對但有點可疑（偏慢或用猜的），改用拼寫確認是真的記得。",
    listen_mc: "上次答對但有點可疑（偏慢或用猜的），改用聽力確認是真的記得。",
  };
  var REASON_VERIFY_OTHER = "換個題型再確認一次，看看上次答對不是僥倖。";

  // ── 小工具（模擬 Python 語意）────────────────────────────────────

  function isPlainObject(v) {
    return typeof v === "object" && v !== null && !Array.isArray(v);
  }

  function hasOwn(obj, key) {
    return Object.prototype.hasOwnProperty.call(obj, key);
  }

  function getOwn(obj, key) {
    return hasOwn(obj, key) ? obj[key] : undefined;
  }

  // 模擬 Python int()：數字截斷、字串必須是純整數、其他丟例外
  function pyInt(v) {
    if (typeof v === "boolean") return v ? 1 : 0;
    if (typeof v === "number") {
      if (!isFinite(v)) throw new Error("int() 轉換失敗");
      return Math.trunc(v);
    }
    if (typeof v === "string") {
      var s = v.trim();
      if (/^[+-]?\d+$/.test(s)) return parseInt(s, 10);
      throw new Error("int() 轉換失敗");
    }
    throw new Error("int() 轉換失敗");
  }

  // 模擬 try: int(x) except: fallback
  function toInt(v, fb) {
    try { return pyInt(v); } catch (e) { return fb; }
  }

  // 模擬 Python 3 round()（銀行家捨入）
  function pyRound(x) {
    var f = Math.floor(x);
    var d = x - f;
    if (d < 0.5) return f;
    if (d > 0.5) return f + 1;
    return (f % 2 === 0) ? f : f + 1;
  }

  // ── 日期（一律本地時區 YYYY-MM-DD，與 Python date.today() 一致）──

  function pad2(n) { return n < 10 ? "0" + n : "" + n; }

  function fmtDate(d) {
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }

  function todayDate() {
    var n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }

  function todayStr() { return fmtDate(todayDate()); }

  // 今天 + n 天（n 可為負）的 YYYY-MM-DD
  function addDaysStr(n) {
    var t = todayDate();
    return fmtDate(new Date(t.getFullYear(), t.getMonth(), t.getDate() + n));
  }

  // 模擬 datetime.strptime(s, "%Y-%m-%d")：失敗回 null
  function parseDate(s) {
    var m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(s));
    if (!m) return null;
    var y = +m[1], mo = +m[2], da = +m[3];
    var dt = new Date(y, mo - 1, da);
    if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== da) return null;
    return dt;
  }

  // ── 卡片欄位讀取（card_lv / card_fast / card_verify 對應）─────────

  function cardLv(card) {
    if (!isPlainObject(card)) return 0;
    var lv = card.lv;
    if (lv === undefined || lv === null) {
      var box = toInt(card.box || 1, 1);
      return Math.min(Math.max(box - 1, 0), MAX_LV);
    }
    var v = toInt(lv, null);
    if (v === null) return 0;
    return Math.min(Math.max(v, 0), MAX_LV);
  }

  function cardFast(card) {
    if (!isPlainObject(card)) return 0;
    var v = toInt(card.fast || 0, null);
    if (v === null) return 0;
    return Math.max(v, 0);
  }

  function cardVerify(card) {
    if (!isPlainObject(card)) return null;
    var v = card.verify;
    return (typeof v === "string" && v !== "") ? v : null;
  }

  // ── 日文判定（jp_has_kanji / jp_kana 對應）────────────────────────

  // 含漢字判定：text 含 U+4E00–U+9FFF 任一字元
  function jpHasKanji(text) {
    var s = text ? String(text) : "";
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      if (c >= 0x4e00 && c <= 0x9fff) return true;
    }
    return false;
  }

  // 取假名段：reading 開頭連續非 ASCII 字元（格式「假名 空格 romaji」）
  function jpKana(reading) {
    var s = reading ? String(reading) : "";
    var kana = "";
    for (var i = 0; i < s.length; i++) {
      if (s.charCodeAt(i) < 128) break;
      kana += s.charAt(i);
    }
    return kana;
  }

  // ── 亂數工具（random.shuffle / random.choice / random.sample 對應）─

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function choice(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function sample(arr, k) {
    var a = arr.slice();
    var n = a.length;
    if (k > n) k = n;
    for (var i = 0; i < k; i++) {
      var j = i + Math.floor(Math.random() * (n - i));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a.slice(0, k);
  }

  // ── Progress（progress.json 讀寫；結構與 Python 版完全一致）───────

  function Progress(storage) {
    this.storage = storage;
    this.data = Progress.defaultData();
    this._warned = false;
    this._load();
  }

  Progress.defaultData = function () {
    return { languages: {}, daily: {}, streak: 0, last_study_date: null };
  };

  Progress.prototype._load = function () {
    var txt;
    try { txt = this.storage.get(); } catch (e) { return; }
    if (txt === null || txt === undefined) return;
    var raw;
    try { raw = JSON.parse(txt); } catch (e) { return; }
    this._merge(raw);
  };

  // 與 Python Progress._load 相同的欄位驗證與合併（含保留未知根層欄位）
  Progress.prototype._merge = function (raw) {
    if (!isPlainObject(raw)) return;
    if (isPlainObject(raw.languages)) this.data.languages = raw.languages;
    if (isPlainObject(raw.daily)) this.data.daily = raw.daily;
    this.data.streak = toInt(raw.streak || 0, 0);
    this.data.last_study_date = (raw.last_study_date === undefined) ? null : raw.last_study_date;
    for (var k in raw) {
      if (!hasOwn(raw, k)) continue;
      if (k !== "languages" && k !== "daily" && k !== "streak" && k !== "last_study_date") {
        this.data[k] = raw[k];
      }
    }
  };

  Progress.prototype.modeStats = function () {
    if (!isPlainObject(this.data.mode_ms)) this.data.mode_ms = {};
    if (!isPlainObject(this.data.mode_n)) this.data.mode_n = {};
    return [this.data.mode_ms, this.data.mode_n];
  };

  Progress.prototype.save = function () {
    try {
      this.storage.set(JSON.stringify(this.data, null, 2));
    } catch (e) {
      if (!this._warned) {
        if (typeof console !== "undefined") console.warn("警告：進度無法存檔（" + e + "）。");
        this._warned = true;
      }
    }
  };

  Progress.prototype.cards = function (language) {
    if (!isPlainObject(this.data.languages)) this.data.languages = {};
    var lang = getOwn(this.data.languages, language);
    if (!isPlainObject(lang)) {
      lang = {};
      this.data.languages[language] = lang;
    }
    if (!isPlainObject(lang.cards)) lang.cards = {};
    return lang.cards;
  };

  Progress.prototype.card = function (language, key) {
    var cards = this.cards(language);
    var card = getOwn(cards, key);
    if (!isPlainObject(card)) {
      card = { box: 1, due: todayStr(), correct: 0, wrong: 0 };
      cards[key] = card;
    }
    if (!hasOwn(card, "box")) card.box = 1;
    if (!hasOwn(card, "due")) card.due = todayStr();
    if (!hasOwn(card, "correct")) card.correct = 0;
    if (!hasOwn(card, "wrong")) card.wrong = 0;
    return card;
  };

  // 該語言已完成課程 id 清單（缺漏或格式錯誤時建立空清單）
  Progress.prototype.lessonsDone = function (language) {
    if (!isPlainObject(this.data.lessons)) this.data.lessons = {};
    var done = getOwn(this.data.lessons, language);
    if (!Array.isArray(done)) {
      done = [];
      this.data.lessons[language] = done;
    }
    return done;
  };

  // 記為當日學習活動：只更新 streak/last_study_date，不動 daily 統計
  Progress.prototype.touchStudyDay = function () {
    var today = todayStr();
    var last = this.data.last_study_date;
    if (last !== today) {
      var yesterday = addDaysStr(-1);
      if (last === yesterday) {
        this.data.streak = toInt(this.data.streak || 0, 0) + 1;
      } else {
        this.data.streak = 1;
      }
      this.data.last_study_date = today;
    }
  };

  // 記錄一次作答（每次作答即時存檔）
  Progress.prototype.record = function (correct, language, key) {
    var today = todayStr();
    this.touchStudyDay();
    if (!isPlainObject(this.data.daily)) this.data.daily = {};
    var day = getOwn(this.data.daily, today);
    if (!isPlainObject(day)) {
      day = { answered: 0, correct: 0 };
      this.data.daily[today] = day;
    }
    day.answered = toInt(day.answered || 0, 0) + 1;
    if (correct) day.correct = toInt(day.correct || 0, 0) + 1;
    if (language && key) {
      var card = this.card(language, key);
      var field = correct ? "correct" : "wrong";
      card[field] = toInt(card[field] || 0, 0) + 1;
    }
    this.save();
  };

  // 單字卡自評：記得→升盒（最多 5）；不記得→退回第 1 盒
  Progress.prototype.rateFlashcard = function (language, key, remembered) {
    var card = this.card(language, key);
    var box = toInt(card.box || 1, 1);
    box = Math.min(Math.max(box, 1), MAX_BOX);
    box = remembered ? Math.min(box + 1, MAX_BOX) : 1;
    card.box = box;
    var interval = (BOX_INTERVALS[box] !== undefined) ? BOX_INTERVALS[box] : 0;
    card.due = addDaysStr(interval);
    this.record(remembered, language, key);
    return [box, card.due];
  };

  // ── 引擎本體（WebApp 對應）────────────────────────────────────────

  function createEngine(DATA, storage) {
    if (!isPlainObject(DATA)) throw new Error("DATA 必須是物件（{語言: 資料}）");
    if (!storage || typeof storage.get !== "function" || typeof storage.set !== "function") {
      throw new Error("storage 必須提供 get() 與 set() 方法");
    }

    // load_languages 對應：容錯處理缺欄位（DATA 的 key 相當於檔名主幹）
    var langs = [];
    Object.keys(DATA).forEach(function (key) {
      var raw = DATA[key];
      if (!isPlainObject(raw)) return;
      var alphabet = (Array.isArray(raw.alphabet) ? raw.alphabet : []).filter(function (a) {
        return isPlainObject(a) && a.char;
      });
      var items = (Array.isArray(raw.items) ? raw.items : []).filter(function (i) {
        return isPlainObject(i) && i.text;
      });
      var grammar = (Array.isArray(raw.grammar) ? raw.grammar : []).filter(function (g) {
        return isPlainObject(g) && g.question && Array.isArray(g.options) && g.options.length > 0;
      });
      var lessons = (Array.isArray(raw.lessons) ? raw.lessons : []).filter(function (l) {
        return isPlainObject(l) && l.id;
      });
      langs.push({
        language: raw.language || key,
        display_name_zh: raw.display_name_zh || raw.language || key,
        alphabet: alphabet,
        items: items,
        grammar: grammar,
        lessons: lessons,
        raw: raw,
      });
    });

    var byKey = {};
    var itemTexts = {};
    var lessonIds = {};
    langs.forEach(function (l) {
      byKey[l.language] = l;
      itemTexts[l.language] = new Set(l.items.map(function (i) { return i.text || ""; }));
      lessonIds[l.language] = new Set(l.lessons.map(function (les) { return getOwn(les, "id"); }));
    });

    var progress = new Progress(storage);

    // ── WebApp._card_due ──
    function cardDue(card) {
      var d = parseDate(card.due);
      return d === null || d.getTime() <= todayDate().getTime();
    }

    // ── WebApp._card_box ──
    function cardBox(card) {
      var b = toInt(card.box || 1, 1);
      return Math.min(Math.max(b, 1), MAX_BOX);
    }

    // ── WebApp.state ──
    function state() {
      var p = progress.data;
      var daily = isPlainObject(p.daily) ? p.daily : {};
      var t = getOwn(daily, todayStr());
      if (!isPlainObject(t)) t = {};
      var totalAns = 0, totalCor = 0;
      Object.keys(daily).forEach(function (k) {
        var d = daily[k];
        if (isPlainObject(d)) {
          totalAns += toInt(d.answered || 0, 0);
          totalCor += toInt(d.correct || 0, 0);
        }
      });
      var languages = langs.map(function (lang) {
        var code = lang.language;
        var cards = progress.cards(code);
        var dueCount = 0, newCount = 0;
        lang.items.forEach(function (it) {
          var card = getOwn(cards, it.text || "");
          if (!isPlainObject(card)) newCount++;        // 從未作答過的卡
          else if (cardDue(card)) dueCount++;          // 今日到期且已見過的卡
        });
        return {
          key: code,
          display_name_zh: lang.display_name_zh,
          items_count: lang.items.length,
          alphabet_count: lang.alphabet.length,
          grammar_count: lang.grammar.length,
          due_count: dueCount,
          new_count: newCount,
          lessons_count: lang.lessons.length,
          lessons_done: progress.lessonsDone(code).slice(),
        };
      });
      return {
        languages: languages,
        streak: toInt(p.streak || 0, 0),
        today: { answered: toInt(t.answered || 0, 0), correct: toInt(t.correct || 0, 0) },
        total: { answered: totalAns, correct: totalCor },
      };
    }

    // ── WebApp._assign_format：verify 優先，否則依 lv 走題型階梯 ──
    // 日文「含漢字」items（text 含 U+4E00–U+9FFF 且 reading 取得到假名段）
    // 改走 JP_KANJI_LADDER：0→mc_f2z、1→mc_kana（假名認讀）、2→mc_z2f、
    // 3→spell、4→listen_mc，5→從 spell/listen_mc/mc_kana（有合適例句時
    // 另含 cloze）隨機；verify 優先規則照舊。
    function assignFormat(entry, card) {
      var text = entry.text;
      var example = entry.example;
      var clozeOk = (typeof example === "string" && example !== "" &&
                     !!text && example.indexOf(text) !== -1);
      var jpKanji = (entry.lang === "japanese" && jpHasKanji(text) &&
                     !!jpKana(entry.reading));
      var lv = cardLv(card);
      var verify = cardVerify(card);
      var fmt, reason;
      if (verify !== null && ADAPTIVE_FORMATS.indexOf(verify) !== -1) {
        fmt = verify;
        if (fmt === "cloze" && !clozeOk) fmt = "spell";
        reason = (VERIFY_REASONS[fmt] !== undefined) ? VERIFY_REASONS[fmt] : REASON_VERIFY_OTHER;
        entry.verify = fmt;   // 前端據此標示「驗證題」
      } else if (lv >= MAX_LV) {
        var choices = (jpKanji ? ["spell", "listen_mc", "mc_kana"]
                               : ["spell", "listen_mc"])
                        .concat(clozeOk ? ["cloze"] : []);
        fmt = choice(choices);
        reason = REASON_LV5;
      } else {
        var ladder = jpKanji ? JP_KANJI_LADDER : LV_LADDER;
        fmt = (ladder[lv] !== undefined) ? ladder[lv] : "mc_f2z";
        reason = (LADDER_REASONS[fmt] !== undefined) ? LADDER_REASONS[fmt] : LADDER_REASONS.mc_f2z;
        if (fmt === "cloze" && !clozeOk) {
          fmt = "spell";
          reason = REASON_LV4_NO_CLOZE;
        }
      }
      entry.format = fmt;
      entry.lv = lv;
      entry.reason_zh = reason;
      if (fmt === "cloze") {
        // Python str.replace 會取代全部出現位置
        entry.cloze = example.split(text).join(CLOZE_BLANK);
      }
    }

    // ── WebApp._item_entry ──
    function getStr(it, key) {
      return hasOwn(it, key) ? it[key] : "";
    }

    function itemEntry(code, it) {
      var entry = {
        lang: code,
        text: getStr(it, "text"),
        reading: getStr(it, "reading"),
        zh: getStr(it, "zh"),
        topic: getStr(it, "topic"),
        example: getStr(it, "example"),
        example_zh: getStr(it, "example_zh"),
        note: getStr(it, "note"),
        box: 1,
      };
      // 精準辨析干擾項（目前用於日文）：有才帶，前端出題優先採用
      var ds = getOwn(it, "distractors_zh");
      if (Array.isArray(ds) && ds.length >= 3) {
        entry.distractors_zh = ds.slice(0, 3).map(function (x) { return String(x); });
      }
      return entry;
    }

    // ── WebApp._maintenance_entry ──
    function maintenanceEntry(code, it, card) {
      var entry = itemEntry(code, it);
      entry.box = cardBox(card);
      assignFormat(entry, card);
      entry.maintenance = true;
      entry.reason_zh = MAINT_REASON_PREFIX + entry.reason_zh;
      return entry;
    }

    // ── WebApp.session_cards ──
    function sessionCards(langKey, limit, mode) {
      var adaptive = (mode === "adaptive");
      var list = (langKey === "all") ? langs : [byKey[langKey]];
      var dueCards = [];
      var newCards = [];
      var maintPool = [];   // [code, item, card]：已見過、未到期、lv≥3
      list.forEach(function (lang) {
        var code = lang.language;
        var cards = progress.cards(code);
        lang.items.forEach(function (it) {
          var key = it.text || "";
          var card = getOwn(cards, key);
          var entry;
          if (!isPlainObject(card)) {
            entry = itemEntry(code, it);
            if (adaptive) assignFormat(entry, null);
            newCards.push(entry);
          } else if (cardDue(card)) {
            entry = itemEntry(code, it);
            entry.box = cardBox(card);
            if (adaptive) assignFormat(entry, card);
            dueCards.push(entry);
          } else if (adaptive && cardLv(card) >= MAINT_MIN_LV) {
            maintPool.push([code, it, card]);
          }
        });
      });
      shuffle(dueCards);
      shuffle(newCards);
      var result = dueCards.concat(newCards);
