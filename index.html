for its impeccable service and elegant setting.","example_zh":"這家餐廳以無可挑剔的服務與優雅的環境聞名。","note":"高頻搭配 impeccable service/manners；同義 flawless。"},{"text":"subpar","reading":"adj.","zh":"低於水準的；不合格的","topic":"餐廳飯店","example":"Several guests complained about the subpar service at the front desk.","example_zh":"多位房客抱怨櫃檯服務水準低落。","note":"客訴信高頻；同義 below standard；par＝標準。"},{"text":"lukewarm","reading":"adj.","zh":"微溫的；不冷不熱的","topic":"餐廳飯店","example":"The customer sent the soup back because it arrived lukewarm.","example_zh":"顧客把湯退回，因為送上桌時只剩微溫。","note":"客訴常見；比喻義「反應冷淡」：a lukewarm response。"},{"text":"stale","reading":"adj.","zh":"不新鮮的；走味的","topic":"餐廳飯店","example":"The reviewer noted that the bread served with the meal tasted stale.","example_zh":"評論者指出隨餐附上的麵包吃起來不新鮮。","note":"多指麵包、空氣不新鮮；反義 fresh；比喻義「老套的」。"},{"text":"gluten-free","reading":"adj.","zh":"無麩質的","topic":"餐廳飯店","example":"The café offers several gluten-free options for guests with allergies.","example_zh":"這家咖啡館為過敏的客人提供多種無麩質選擇。","note":"菜單常見標示；同類構詞 sugar-free、dairy-free。"},{"text":"produce","reading":"n.","zh":"農產品；蔬果","topic":"餐廳飯店","example":"The chef buys fresh produce from the farmers' market every morning.","example_zh":"主廚每天早上到農夫市集採買新鮮蔬果。","note":"名詞重音在前、不可數；勿與動詞 produce（生產）及 product 混淆。"},{"text":"pantry","reading":"n.","zh":"食品儲藏室","topic":"餐廳飯店","example":"Please restock the pantry with flour and sugar before the weekend rush.","example_zh":"請在週末尖峰前補齊食品儲藏室的麵粉和糖。","note":"指廚房旁存放乾貨的空間；辦公室的茶水間也可稱 pantry。"},{"text":"platter","reading":"n.","zh":"大淺盤；拼盤","topic":"餐廳飯店","example":"The seafood platter for two is the most popular item on the menu.","example_zh":"雙人海鮮拼盤是菜單上最受歡迎的品項。","note":"常見 cheese/seafood platter；比 plate 大，用於分食。"},{"text":"overcharge","reading":"v.","zh":"超收（費用）","topic":"餐廳飯店","example":"The guest claimed he was overcharged for the minibar items on his final bill.","example_zh":"這位房客表示帳單上的迷你吧費用被超收了。","note":"客訴信高頻：be overcharged for；反義 undercharge。"},{"text":"out of order","reading":"phr.","zh":"故障；無法使用","topic":"餐廳飯店","example":"The ice machine on the third floor is out of order at the moment.","example_zh":"三樓的製冰機目前故障無法使用。","note":"公告高頻；多指電梯、販賣機等設備；與 out of stock（缺貨）區分。"},{"text":"rave review","reading":"n.","zh":"極高的評價；盛讚","topic":"餐廳飯店","example":"The newly opened bistro has received rave reviews from local food critics.","example_zh":"這家新開幕的小餐館獲得當地美食評論家的一致盛讚。","note":"固定搭配 receive/earn rave reviews；rave 單獨作動詞＝狂讚。"},{"text":"gourmet","reading":"adj.","zh":"美食的；高級的（食物）","topic":"餐廳飯店","example":"The hotel's package includes a gourmet dinner prepared by an award-winning chef.","example_zh":"飯店套裝行程包含由得獎主廚烹調的美饌晚餐。","note":"置於名詞前：gourmet meal/coffee；作名詞指「美食家」。"},{"text":"hygiene","reading":"n.","zh":"衛生","topic":"餐廳飯店","example":"All kitchen staff must complete a food hygiene training course.","example_zh":"所有廚房人員都必須完成食品衛生訓練課程。","note":"不可數；搭配 food/personal hygiene；形容詞 hygienic。"},{"text":"toast","reading":"n.","zh":"敬酒；乾杯","topic":"餐廳飯店","example":"The president proposed a toast to the retiring general manager at the banquet.","example_zh":"總裁在宴會上向即將退休的總經理敬酒致意。","note":"固定搭配 propose a toast to；另義「吐司」，依語境判斷。"},{"text":"reorder","reading":"v.","zh":"再訂購;重新訂購","topic":"購物訂單","example":"Once inventory falls below fifty units, the system will automatically reorder the item from our supplier.","example_zh":"一旦庫存低於五十件,系統就會自動向供應商再訂購該品項。","note":"搭配 reorder level/point(再訂購點);名詞動詞同形。"},{"text":"preorder","reading":"v.","zh":"預購","topic":"購物訂單","example":"Customers who preorder the new tablet will receive a protective case at no additional cost.","example_zh":"預購新款平板的顧客可免費獲得保護殼一個。","note":"亦拼作 pre-order;搭配 available for preorder(開放預購)。"},{"text":"bundle","reading":"n.","zh":"組合包;套裝","topic":"購物訂單","example":"The software bundle includes a word processor, a spreadsheet program, and one year of technical support.","example_zh":"這個軟體組合包內含文書處理器、試算表程式,以及一年的技術支援。","note":"動詞用法 be bundled with(與…綁售)也是 Part 5 常考。"},{"text":"rain check","reading":"n.","zh":"缺貨補購憑證","topic":"購物訂單","example":"The advertised grill was sold out, so the store issued me a rain check for the sale price.","example_zh":"廣告上的烤肉架賣完了,所以店家開給我一張可依特價補購的憑證。","note":"慣用語 take a rain check(改天再約)在 Part 2 也常出現。"},{"text":"point of sale","reading":"n.","zh":"銷售點;結帳處","topic":"購物訂單","example":"Discounts are applied automatically at the point of sale, so no coupon is required.","example_zh":"折扣會在結帳時自動套用,因此不需要出示折價券。","note":"縮寫 POS;搭配 point-of-sale system(收銀系統)。"},{"text":"price tag","reading":"n.","zh":"價格標籤","topic":"購物訂單","example":"If an item is missing its price tag, the cashier will scan a duplicate at the register.","example_zh":"若商品缺少價格標籤,收銀員會在收銀台掃描另一件同款商品的標籤。","note":"引申義「代價」: come with a hefty price tag(價格不菲)。"},{"text":"flat rate","reading":"n.","zh":"均一費率","topic":"購物訂單","example":"We charge a flat rate of five dollars for shipping, regardless of the order's weight or size.","example_zh":"無論訂單重量或大小,我們的運費一律收取五美元。","note":"形容詞寫法 flat-rate shipping;與 flat fee 同義。"},{"text":"order confirmation","reading":"n.","zh":"訂單確認信;訂購確認","topic":"購物訂單","example":"An order confirmation containing your invoice number will be emailed to you within minutes of purchase.","example_zh":"含有發票編號的訂單確認信會在下單後幾分鐘內寄到你的信箱。","note":"Part 7 高頻文件類型;搭配 confirmation number(確認編號)。"},{"text":"cash on delivery","reading":"phr.","zh":"貨到付款","topic":"購物訂單","example":"Customers who choose cash on delivery must pay the courier the exact amount when the package arrives.","example_zh":"選擇貨到付款的顧客,須在包裹送達時將正確金額付給快遞員。","note":"縮寫 COD;與 payment in advance(預先付款)相對。"},{"text":"past due","reading":"phr.","zh":"逾期未付的","topic":"購物訂單","example":"Our records show that invoice #4471 is now thirty days past due; please remit payment promptly.","example_zh":"我們的紀錄顯示,編號4471的發票已逾期三十天未付,請儘速匯款。","note":"與 overdue 同義;催款信(collection letter)必考用語。"},{"text":"balance due","reading":"n.","zh":"應付餘額","topic":"購物訂單","example":"A deposit of twenty percent is required now, and the balance due must be paid before the furniture is delivered.","example_zh":"現在須支付兩成訂金,應付餘額則須在家具送達前付清。","note":"balance 在帳務中指「餘額」;搭配 outstanding balance(未結清餘額)。"},{"text":"grace period","reading":"n.","zh":"寬限期","topic":"購物訂單","example":"The credit card offers a 25-day grace period during which no interest is charged on new purchases.","example_zh":"這張信用卡提供二十五天寬限期,期間新消費不計利息。","note":"搭配 a 30-day grace period;常見於帳單與租約。"},{"text":"late fee","reading":"n.","zh":"滯納金","topic":"購物訂單","example":"To avoid a late fee, please make sure your payment is posted by the fifth of each month.","example_zh":"為避免產生滯納金,請確保款項於每月五日前入帳。","note":"同義 late charge;搭配 incur a late fee(產生滯納金)。"},{"text":"restocking fee","reading":"n.","zh":"退貨整理費","topic":"購物訂單","example":"Opened electronics may be returned within fourteen days but are subject to a fifteen percent restocking fee.","example_zh":"已拆封的電子產品可於十四天內退貨,但須收取百分之十五的退貨整理費。","note":"退貨政策常見條款;be subject to+費用 為高頻句型。"},{"text":"promo code","reading":"n.","zh":"促銷代碼;折扣碼","topic":"購物訂單","example":"Enter the promo code SPRING25 at checkout to receive twenty-five percent off your first online order.","example_zh":"結帳時輸入促銷代碼SPRING25,首筆網路訂單即可享七五折。","note":"promo 為 promotion 的縮寫;同義 coupon code、discount code。"},{"text":"membership","reading":"n.","zh":"會員資格","topic":"購物訂單","example":"Your membership entitles you to free delivery and early access to seasonal sales.","example_zh":"你的會員資格可享免費配送,並可提前參加季節特賣。","note":"搭配 renew a membership(續會)、membership fee(會費)。"},{"text":"list price","reading":"n.","zh":"定價;標價","topic":"購物訂單","example":"All floor models are being sold at thirty percent below the list price this weekend.","example_zh":"本週末所有展示機一律以低於定價三成的價格出售。","note":"與 sale price(特價)相對;同義 sticker price。"},{"text":"trade-in","reading":"n.","zh":"舊換新;折抵","topic":"購物訂單","example":"Bring in your old phone and receive a trade-in credit of up to two hundred dollars toward a new model.","example_zh":"帶舊手機來店,即可獲得最高兩百美元的舊換新折抵金,用於購買新機。","note":"動詞形式 trade in your old car;搭配 trade-in value(折抵價值)。"},{"text":"discontinue","reading":"v.","zh":"停產;停售;終止","topic":"購物訂單","example":"The manufacturer has decided to discontinue this model, so remaining stock will not be replenished.","example_zh":"製造商已決定停產此型號,因此剩餘庫存將不再補貨。","note":"搭配 a discontinued item(停產品項);勿與 disconnect(切斷)混淆。"},{"text":"substitute","reading":"n.","zh":"替代品;代替者","topic":"購物訂單","example":"If the requested item is unavailable, we will ship a substitute of equal or greater value.","example_zh":"若您指定的商品缺貨,我們將寄出等值或更高價值的替代品。","note":"substitute A for B(以A代B);動詞名詞同形。"},{"text":"comparable","reading":"adj.","zh":"相當的;可相比的","topic":"購物訂單","example":"If the item is out of stock, customers may select a comparable product at the same price.","example_zh":"若商品缺貨,顧客可用相同價格選購同等級的產品。","note":"搭配 comparable to;勿與 compatible(相容的)混淆。"},{"text":"claim","reading":"n.","zh":"索賠;申訴","topic":"購物訂單","example":"To file a claim for a damaged shipment, submit photographs of the package within seven days of delivery.","example_zh":"若要就受損貨件提出索賠,請於送達後七天內提交包裹照片。","note":"搭配 file/submit a claim;warranty claim(保固索賠)。"},{"text":"complaint","reading":"n.","zh":"投訴;抱怨","topic":"購物訂單","example":"The customer service team responds to every complaint within one business day.","example_zh":"客服團隊會在一個工作天內回覆每一件投訴。","note":"搭配 file/lodge a complaint;勿與 compliment(讚美)混淆。"},{"text":"acknowledge","reading":"v.","zh":"確認收到;承認","topic":"購物訂單","example":"We acknowledge receipt of your order and will send a tracking number once it has shipped.","example_zh":"我們確認已收到您的訂單,出貨後將寄送追蹤編號給您。","note":"acknowledge receipt of 為商業書信固定句型;名詞 acknowledgment。"},{"text":"void","reading":"v.","zh":"使無效;作廢","topic":"購物訂單","example":"Opening the sealed casing yourself will void the manufacturer's warranty immediately.","example_zh":"自行拆開密封外殼將立即使原廠保固失效。","note":"高頻搭配 void the warranty(使保固失效);形容詞見 null and void(無效的)。"},{"text":"process","reading":"v.","zh":"處理(訂單、退款等)","topic":"購物訂單","example":"Refunds are processed within five business days and credited to the original form of payment.","example_zh":"退款將於五個工作天內處理完成,並退回原付款方式。","note":"搭配 process an order/a refund/a payment;名詞義「流程」重音在第一音節。"},{"text":"shipping label","reading":"n.","zh":"出貨標籤;寄件標籤","topic":"購物訂單","example":"Print the prepaid shipping label and attach it securely to the outside of the return package.","example_zh":"請列印預付運費的寄件標籤,並牢牢貼在退貨包裹外側。","note":"搭配 prepaid shipping label(預付運費標籤);退貨說明常見。"},{"text":"deduct","reading":"v.","zh":"扣除","topic":"購物訂單","example":"The cost of the missing accessories will be deducted from your refund amount.","example_zh":"缺少的配件費用將從你的退款金額中扣除。","note":"搭配 deduct A from B;名詞 deduction(扣除額)。"},{"text":"prorated","reading":"adj.","zh":"按比例計算的","topic":"購物訂單","example":"If you cancel mid-month, you will receive a prorated refund for the unused portion of your subscription.","example_zh":"若你在月中取消,未使用的訂閱期間將按比例退費。","note":"動詞 prorate;常見於帳單、租金與會費情境。"},{"text":"storefront","reading":"n.","zh":"店面","topic":"購物訂單","example":"The bakery is renovating its storefront to attract more foot traffic from the new transit station.","example_zh":"這家烘焙坊正在翻修店面,希望吸引新捷運站帶來的更多來客。","note":"online storefront 指網路商店頁面;foot traffic(來客量)為高頻搭配。"},{"text":"showroom","reading":"n.","zh":"展示中心;展售間","topic":"購物訂單","example":"Visit our showroom to see the full line of office furniture before placing a bulk order.","example_zh":"大量訂購前,歡迎蒞臨我們的展示中心參觀全系列辦公家具。","note":"搭配 showroom floor;與 warehouse(倉庫)區分。"},{"text":"storewide","reading":"adj.","zh":"全店的","topic":"購物訂單","example":"The anniversary event features storewide discounts of up to fifty percent for three days only.","example_zh":"週年慶活動提供全店最低五折優惠,只有三天。","note":"亦作副詞: save 20% storewide;類似構詞 companywide、nationwide。"},{"text":"grand opening","reading":"n.","zh":"盛大開幕","topic":"購物訂單","example":"To celebrate our grand opening, the first one hundred customers will receive a complimentary gift bag.","example_zh":"為慶祝盛大開幕,前一百名顧客將獲贈免費禮品袋。","note":"Part 7 廣告高頻;相關 ribbon-cutting ceremony(剪綵儀式)。"},{"text":"raffle","reading":"n.","zh":"抽獎","topic":"購物訂單","example":"Every purchase over fifty dollars earns one entry in the raffle for a weekend getaway.","example_zh":"消費滿五十美元即可獲得一次抽獎機會,獎品為週末小旅行。","note":"搭配 raffle ticket、raffle drawing;同類字 sweepstakes(抽獎活動)。"},{"text":"introductory","reading":"adj.","zh":"初次優惠的;入門的","topic":"購物訂單","example":"New subscribers enjoy an introductory rate of $9.99 per month for the first six months.","example_zh":"新訂戶前六個月可享每月9.99美元的優惠價。","note":"搭配 introductory offer/price/rate;期滿後常接 regular rate(原價)。"},{"text":"while supplies last","reading":"phr.","zh":"售完為止;數量有限","topic":"購物訂單","example":"The free tote bag is available with any purchase, while supplies last.","example_zh":"任何消費即可獲得免費托特包,送完為止。","note":"廣告固定語;同義 while stocks last。"},{"text":"non-refundable","reading":"adj.","zh":"不可退款的","topic":"購物訂單","example":"The deposit is non-refundable, but it may be applied toward a future reservation.","example_zh":"訂金恕不退還,但可折抵日後的預訂費用。","note":"相關 non-transferable(不可轉讓的);反義 refundable(可退款的)。"},{"text":"carry","reading":"v.","zh":"(商店)販售、備有","topic":"購物訂單","example":"Do you carry this jacket in a larger size, or would I need to order it online?","example_zh":"這件外套你們有賣大一點的尺寸嗎,還是我得上網訂購?","note":"多義字,多益常考「店內有售」之義;Part 2 高頻問句 Do you carry...?"},{"text":"household","reading":"n.","zh":"家庭;家戶","topic":"日常生活","example":"The new energy plan could reduce the average household's utility bills by fifteen percent.","example_zh":"新的能源方案可望讓一般家庭的水電瓦斯費減少百分之十五。","note":"常作形容詞: household appliances/expenses(家用電器/家庭開支)。"},{"text":"sublet","reading":"v.","zh":"轉租","topic":"日常生活","example":"Tenants may not sublet the apartment without the landlord's prior written consent.","example_zh":"未經房東事先書面同意,房客不得轉租公寓。","note":"搭配 sublet an apartment;租約(lease)條款常見,名詞同形。"},{"text":"condominium","reading":"n.","zh":"共管公寓大廈","topic":"日常生活","example":"Residents of the condominium share the cost of maintaining the lobby and elevators.","example_zh":"這棟公寓大廈的住戶共同分攤大廳與電梯的維護費用。","note":"縮寫 condo;與 apartment(出租公寓)區分,condo 通常為自有產權。"},{"text":"real estate","reading":"n.","zh":"房地產;不動產","topic":"日常生活","example":"Local real estate prices have risen steadily since the subway line was extended.","example_zh":"自從捷運路線延伸以來,當地房地產價格持續穩定上漲。","note":"搭配 real estate agent/agency(房仲);英式常用 property。"},{"text":"clogged","reading":"adj.","zh":"堵塞的","topic":"日常生活","example":"The kitchen sink is clogged again, so I have arranged for a plumber to come tomorrow morning.","example_zh":"廚房水槽又堵住了,所以我已安排水電工明天早上過來。","note":"搭配 clogged drain/pipe(堵塞的排水管);動詞為 clog。"},{"text":"mow the lawn","reading":"phr.","zh":"修剪草坪","topic":"日常生活","example":"My neighbor mows the lawn every Saturday morning before it gets too hot.","example_zh":"我的鄰居每週六早上趁天氣還不太熱時修剪草坪。","note":"Part 1 圖片題高頻;相關 lawn mower(割草機)、trim the hedges(修剪樹籬)。"},{"text":"vacuum","reading":"v.","zh":"用吸塵器打掃","topic":"日常生活","example":"Please vacuum the carpet in the meeting room before the clients arrive this afternoon.","example_zh":"請在客戶今天下午抵達前,用吸塵器把會議室的地毯吸乾淨。","note":"名詞 vacuum cleaner(吸塵器);Part 1 常見動作。"},{"text":"resident","reading":"n.","zh":"居民;住戶","topic":"日常生活","example":"All residents are advised that the parking garage will be closed for repairs this weekend.","example_zh":"特此通知所有住戶,停車場本週末將關閉進行維修。","note":"Part 7 社區公告常以 Dear Residents 開頭;形容詞 residential(住宅的)。"},{"text":"ordinance","reading":"n.","zh":"地方法規;條例","topic":"日常生活","example":"A new city ordinance prohibits parking on Main Street during morning rush hour.","example_zh":"一項新的市府條例禁止早上尖峰時段在主街停車。","note":"搭配 city/municipal ordinance;勿與 ordnance(軍械)混淆。"},{"text":"water main","reading":"n.","zh":"自來水總管","topic":"日常生活","example":"A broken water main has forced the city to shut off service to several blocks of Elm Street.","example_zh":"自來水總管破裂,市府被迫暫停榆樹街好幾個街區的供水。","note":"搭配 water main break/repair;市政停水公告(Part 7)常見。"},{"text":"closure","reading":"n.","zh":"關閉;封閉","topic":"日常生活","example":"Commuters should expect lane closures on the bridge throughout the month of August.","example_zh":"整個八月期間,通勤族應預期橋上會有車道封閉的情況。","note":"搭配 road/lane/temporary closure;勿與 clearance(出清、淨空)混淆。"},{"text":"resurface","reading":"v.","zh":"重鋪(路面)","topic":"日常生活","example":"Crews will resurface Oak Avenue next week, so drivers should follow the posted detour.","example_zh":"工程人員下週將重鋪橡樹大道的路面,駕駛請依照告示改道行駛。","note":"道路施工公告高頻;同類字 repave(重新鋪路)。"},{"text":"pothole","reading":"n.","zh":"路面坑洞","topic":"日常生活","example":"Residents can report potholes through the city's mobile app, and crews will repair them within days.","example_zh":"居民可透過市府的手機應用程式通報路面坑洞,工程人員會在幾天內修補。","note":"搭配 fill/repair a pothole;市政新聞與公告常見。"},{"text":"timetable","reading":"n.","zh":"時刻表;時間表","topic":"日常生活","example":"According to the new timetable, the express train to the airport departs every twenty minutes.","example_zh":"根據新的時刻表,開往機場的快車每二十分鐘一班。","note":"同義 schedule;勿與 timeline(時間軸)、timesheet(工時表)混淆。"},{"text":"dairy","reading":"n.","zh":"乳製品","topic":"日常生活","example":"Dairy and other perishable items are kept in the refrigerated section at the back of the store.","example_zh":"乳製品和其他易腐壞的商品放置在店內後方的冷藏區。","note":"搭配 dairy products;勿與 diary(日記)拼寫混淆。"},{"text":"spoil","reading":"v.","zh":"(食物)腐壞;寵壞","topic":"日常生活","example":"Put the milk back in the refrigerator right away so that it does not spoil.","example_zh":"請立刻把牛奶放回冰箱,以免壞掉。","note":"相關 perishable(易腐壞的);spoiled food(壞掉的食物)。"},{"text":"thaw","reading":"v.","zh":"解凍;融化","topic":"日常生活","example":"Thaw the frozen chicken in the refrigerator overnight rather than on the kitchen counter.","example_zh":"冷凍雞肉請放冰箱冷藏解凍一晚,不要放在流理台上退冰。","note":"反義 freeze(冷凍);亦可指天氣回暖。"},{"text":"recipe","reading":"n.","zh":"食譜;祕訣","topic":"日常生活","example":"This soup recipe calls for fresh basil, but dried herbs will also work.","example_zh":"這道湯的食譜需要新鮮羅勒,但用乾燥香料也可以。","note":"搭配 call for(需要…材料);a recipe for success(成功祕訣)。"},{"text":"clinic","reading":"n.","zh":"診所","topic":"日常生活","example":"The walk-in clinic on Center Street accepts patients without appointments until 9 p.m.","example_zh":"中央街的免預約診所收治未預約病患至晚上九點。","note":"搭配 walk-in clinic(免預約診所)、dental clinic(牙醫診所)。"},{"text":"ailment","reading":"n.","zh":"小病;病痛","topic":"日常生活","example":"The pharmacist can recommend over-the-counter remedies for common ailments such as colds and headaches.","example_zh":"藥師可以針對感冒、頭痛等常見小病推薦非處方藥。","note":"搭配 minor/common ailment;程度比 disease(疾病)輕微。"},{"text":"remedy","reading":"n.","zh":"療法;補救辦法","topic":"日常生活","example":"Drinking warm tea with honey is a popular home remedy for a sore throat.","example_zh":"喝加蜂蜜的溫茶是治喉嚨痛常見的居家療法。","note":"搭配 home remedy(居家療法);動詞義「補救」: remedy the situation。"},{"text":"first aid","reading":"n.","zh":"急救","topic":"日常生活","example":"All staff members are required to complete basic first aid training once a year.","example_zh":"所有員工每年都必須完成一次基礎急救訓練。","note":"搭配 first aid kit(急救箱)、first aid training;作形容詞時加連字號。"},{"text":"drowsiness","reading":"n.","zh":"睡意;昏昏欲睡","topic":"日常生活","example":"This medication may cause drowsiness, so avoid driving or operating machinery after taking it.","example_zh":"本藥品可能引起睡意,服用後請避免開車或操作機械。","note":"藥品標示固定用語 may cause drowsiness;形容詞 drowsy。"},{"text":"side effect","reading":"n.","zh":"副作用","topic":"日常生活","example":"Common side effects of the medication include mild headaches and an upset stomach.","example_zh":"這種藥常見的副作用包括輕微頭痛與腸胃不適。","note":"搭配 common/adverse side effects;藥品說明(Part 7)必考。"},{"text":"work out","reading":"phr.","zh":"健身;順利解決","topic":"日常生活","example":"I usually work out at the fitness center near my office before heading home.","example_zh":"我通常在回家前先到公司附近的健身中心運動。","note":"多義: 運動/(事情)順利發展;名詞 workout(一次鍛鍊)。"},{"text":"leisure","reading":"n.","zh":"休閒;閒暇","topic":"日常生活","example":"The hotel offers plenty of leisure facilities, including a pool, a sauna, and tennis courts.","example_zh":"這家飯店提供豐富的休閒設施,包括游泳池、三溫暖和網球場。","note":"搭配 leisure time/activities;at your leisure(在你方便的時候)。"},{"text":"pastime","reading":"n.","zh":"消遣;娛樂","topic":"日常生活","example":"Gardening remains a favorite pastime among the town's retired residents.","example_zh":"園藝仍是鎮上退休居民最喜愛的消遣。","note":"搭配 favorite/popular pastime;注意拼寫只有一個 t。"},{"text":"recreational","reading":"adj.","zh":"休閒的;娛樂的","topic":"日常生活","example":"The city plans to convert the vacant lot into a recreational area with walking trails and picnic tables.","example_zh":"市府計畫將這塊空地改建為附有步道與野餐桌的休閒區。","note":"搭配 recreational facilities/activities;名詞 recreation。"},{"text":"stroll","reading":"v.","zh":"散步;漫步","topic":"日常生活","example":"After dinner, we strolled along the riverfront and watched the street performers.","example_zh":"晚餐後,我們沿著河濱漫步,欣賞街頭藝人的表演。","note":"Part 1 高頻動作;名詞用法 take a stroll(散個步)。"},{"text":"periodical","reading":"n.","zh":"期刊","topic":"日常生活","example":"Current periodicals may be read in the library but cannot be checked out.","example_zh":"最新一期的期刊僅供館內閱覽,不得外借。","note":"圖書館公告常見;勿與 peripheral(周邊設備)、periodic(週期性的)混淆。"},{"text":"charity","reading":"n.","zh":"慈善機構;慈善","topic":"日常生活","example":"All proceeds from the bake sale will be donated to a local charity that supports food banks.","example_zh":"義賣烘焙點心的全部收益將捐給支持食物銀行的當地慈善機構。","note":"搭配 charity event/drive;proceeds go to charity 為高頻句型。"},{"text":"fundraiser","reading":"n.","zh":"募款活動","topic":"日常生活","example":"The community center's annual fundraiser brought in over thirty thousand dollars for the youth sports program.","example_zh":"社區中心的年度募款活動為青少年體育計畫募得超過三萬美元。","note":"相關 fundraising campaign(募款活動);raise funds(募集資金)。"},{"text":"volunteer","reading":"n.","zh":"志工","topic":"日常生活","example":"The festival organizers are looking for volunteers to help direct visitors and hand out programs.","example_zh":"活動主辦單位正在尋找志工協助引導民眾並發放節目表。","note":"動詞用法 volunteer to do sth(自願做某事);形容詞 voluntary(自願的)。"},{"text":"admission","reading":"n.","zh":"入場費;入場許可","topic":"日常生活","example":"Admission to the museum is free on the first Sunday of every month.","example_zh":"每個月的第一個週日,博物館免費入場。","note":"搭配 admission fee(入場費)、free admission(免費入場)。"},{"text":"exhibit","reading":"n.","zh":"展覽;展品","topic":"日常生活","example":"The new photography exhibit at the gallery will run through the end of October.","example_zh":"藝廊的新攝影展將持續展出到十月底。","note":"搭配 on exhibit(展出中);run through(展至…)為高頻用法;exhibition 同義。"},{"text":"matinee","reading":"n.","zh":"日場(電影、演出)","topic":"日常生活","example":"Matinee tickets are five dollars cheaper than tickets for evening performances.","example_zh":"日場票比晚場演出的票便宜五美元。","note":"指下午場次;戲院與劇場廣告(Part 7)高頻,源自法文。"},{"text":"intermission","reading":"n.","zh":"中場休息","topic":"日常生活","example":"Refreshments will be sold in the lobby during the fifteen-minute intermission.","example_zh":"十五分鐘的中場休息期間,大廳將販售茶點。","note":"搭配 during (the) intermission;勿與 intersection(十字路口)混淆。"},{"text":"usher","reading":"n.","zh":"帶位員","topic":"日常生活","example":"An usher will show you to your seats once the doors open at 7:30.","example_zh":"七點半開放入場後,帶位員會引導你們入座。","note":"動詞義「引領」: usher in a new era(開啟新時代)亦常考。"},{"text":"box office","reading":"n.","zh":"售票處;票房","topic":"日常生活","example":"Tickets purchased online may be picked up at the box office one hour before the show.","example_zh":"網路購買的票券可於開演前一小時至售票處領取。","note":"搭配 box office hit(賣座強片);相關 will-call window(取票窗口)。"},{"text":"thermostat","reading":"n.","zh":"溫度調節器;恆溫器","topic":"日常生活","example":"To save energy, set the thermostat a few degrees lower before you leave the house.","example_zh":"為了省電,出門前請把溫度調節器調低幾度。","note":"搭配 adjust/set the thermostat;字首 thermo- 表「熱」。"},{"text":"hardware store","reading":"n.","zh":"五金行","topic":"日常生活","example":"You can pick up paint, nails, and light bulbs at the hardware store on Maple Street.","example_zh":"你可以在楓樹街的五金行買到油漆、釘子和燈泡。","note":"hardware 亦指電腦硬體;同類 home improvement store(居家修繕用品店)。"}],"grammar":[{"question":"All employees must submit their expense reports to the accounting department for ______.","options":["approve","approval","approving","approved"],"answer":1,"explain_zh":"介系詞 for 之後須接名詞,故選 (B) approval(核准)。approve 是動詞,approved 是過去分詞,for approving 不符合此處「送交以待核准」的固定用法 for approval。"},{"question":"By the time the auditors arrive next week, the finance team ______ all the quarterly statements.","options":["completes","has completed","will have completed","had completed"],"answer":2,"explain_zh":"by the time + 現在式子句表示未來某時間點之前,主要子句須用未來完成式 will have + p.p.,故選 (C)。had completed 用於過去完成,與 next week 矛盾。"},{"question":"The new safety regulations ______ by all factory workers starting next month.","options":["must observe","must be observed","must be observing","must have observed"],"answer":1,"explain_zh":"主詞 regulations(法規)是「被遵守」的對象,且句中有 by all factory workers,須用被動語態 must be + p.p.,故選 (B)。"},{"question":"The seminar has been rescheduled ______ October 12 due to the speaker's travel delay.","options":["on","in","for","by"],"answer":2,"explain_zh":"reschedule sth for + 新日期是固定搭配,表示「改期到某日」,故選 (C) for。on 雖可接日期,但與 reschedule 搭配時慣用 for。"},{"question":"______ the marketing budget was reduced, the campaign still exceeded its sales targets.","options":["Despite","Although","Because","Therefore"],"answer":1,"explain_zh":"空格後是完整子句(主詞+動詞),須用從屬連接詞,語意為讓步「雖然」,故選 (B) Although。Despite 是介系詞只能接名詞,Therefore 是副詞不能引導子句。"},{"question":"Applicants ______ résumés are received by Friday will be contacted for an interview.","options":["who","whose","which","whom"],"answer":1,"explain_zh":"空格後接名詞 résumés,表示「應徵者的履歷」,須用所有格關係代名詞 whose,故選 (B)。who、whom 後不能直接接名詞表所屬關係。"},{"question":"The new photocopier is far more efficient ______ the model it replaced.","options":["as","than","to","from"],"answer":1,"explain_zh":"前面有比較級 more efficient,後面必須搭配 than,故選 (B)。as 用於原級比較 as...as,superior 才搭配 to。"},{"question":"Ms. Chen responded ______ to the client's complaint, offering a full refund within an hour.","options":["prompt","promptly","promptness","prompted"],"answer":1,"explain_zh":"修飾動詞 responded 須用副詞,故選 (B) promptly(迅速地)。prompt 是形容詞,promptness 是名詞,皆不能修飾動詞。"},{"question":"Since the company ______ its mobile app last year, online orders have doubled.","options":["launches","launched","has launched","will launch"],"answer":1,"explain_zh":"since 引導的子句表示過去的起點,且有明確過去時間 last year,須用過去簡單式,故選 (B) launched;主要子句才用現在完成式 have doubled。"},{"question":"All complimentary breakfast vouchers ______ at the front desk upon check-in.","options":["distribute","are distributed","distributing","have distributed"],"answer":1,"explain_zh":"主詞 vouchers(餐券)是「被發放」的對象,須用被動語態 be + p.p.,故選 (B) are distributed。主動的 (A)(D) 缺少受詞且語意不通。"},{"question":"Please review the attached contract and return a signed copy ______ the end of the week.","options":["until","by","in","at"],"answer":1,"explain_zh":"表示「在某期限之前完成」的一次性動作,須用 by(不晚於),故選 (B)。until 表「持續到某時間點」,用於持續性動作,與 return 不合。"},{"question":"You may pay the invoice ______ by bank transfer or by credit card.","options":["neither","both","either","whether"],"answer":2,"explain_zh":"與後面的 or 搭配的相關連接詞是 either...or...(兩者擇一),故選 (C)。neither 搭配 nor,both 搭配 and。"},{"question":"The warehouse, ______ was renovated last spring, can now store twice as much inventory.","options":["that","which","where","what"],"answer":1,"explain_zh":"逗號後的非限定關係子句不能用 that,先行詞 warehouse 是事物且在子句中作主詞,故選 (B) which。where 是關係副詞,後面須接完整子句。"},{"question":"Of the three shipping options, express delivery is the ______.","options":["fast","faster","fastest","most fast"],"answer":2,"explain_zh":"of the three(三者之中)搭配 the + 最高級,fast 為單音節形容詞,最高級為 fastest,故選 (C)。兩者比較才用 faster。"},{"question":"The board praised the ______ of the new logistics system, which cut delivery times by 30 percent.","options":["efficient","efficiently","efficiency","efficiencies"],"answer":2,"explain_zh":"定冠詞 the 之後、of 之前須接名詞,故選 (C) efficiency(效率)。efficient 是形容詞,efficiently 是副詞;此處指系統整體效率,用單數不可數形式。"},{"question":"The technicians ______ the server issue when the power outage occurred.","options":["troubleshoot","were troubleshooting","have troubleshot","will troubleshoot"],"answer":1,"explain_zh":"when + 過去式(occurred)表示過去某時間點,當時正在進行的動作用過去進行式,故選 (B) were troubleshooting(當時正在排除故障)。"},{"question":"Employees ______ to attend the orientation session unless they have prior approval from their supervisor.","options":["require","are required","requiring","have required"],"answer":1,"explain_zh":"「員工被要求參加」須用被動 be required to + 原形動詞,故選 (B)。主動 require 後面應接受詞(要求某人),此處無受詞,語意也不通。"},{"question":"The hotel is conveniently located ______ walking distance of the convention center.","options":["within","among","between","along"],"answer":0,"explain_zh":"within walking distance of...(在步行可達的距離內)是固定搭配,故選 (A) within。此為多益地點描述的高頻片語。"},{"question":"Please keep your receipt ______ you need to exchange the merchandise later.","options":["in case","so that","even though","as if"],"answer":0,"explain_zh":"語意為「以防之後需要換貨」,表防備用 in case + 子句,故選 (A)。so that 表目的(為了能夠),even though 表讓步,皆不符語意。"},{"question":"The consultant ______ the firm hired last month has already streamlined several procedures.","options":["whose","whom","which","what"],"answer":1,"explain_zh":"先行詞 consultant 是人,且在子句 the firm hired ___ 中作受詞,須用受格關係代名詞 whom,故選 (B)。which 用於事物,whose 後須接名詞。"},{"question":"The ______ we confirm the itinerary, the cheaper the airfare will be.","options":["soon","sooner","soonest","more soon"],"answer":1,"explain_zh":"「the + 比較級, the + 比較級」句型表示「越…就越…」,與後半句 the cheaper 對應,故選 (B) sooner。soon 的比較級直接加 -er,不用 more。"},{"question":"The lease agreement clearly ______ that tenants must give sixty days' notice before moving out.","options":["states","stating","statement","state"],"answer":0,"explain_zh":"本句缺主要動詞,主詞 The lease agreement 為第三人稱單數,合約條款內容用現在簡單式,故選 (A) states(載明)。state 未加 s,stating 與 statement 都不能當主要動詞。"},{"question":"Mr. Rossi ______ for the firm for fifteen years before he was promoted to regional director.","options":["works","has worked","had worked","is working"],"answer":2,"explain_zh":"before 子句用過去式 was promoted,升遷之前持續十五年的動作發生得更早,須用過去完成式 had + p.p.,故選 (C) had worked。"},{"question":"A revised itinerary ______ to all conference attendees as soon as the schedule is finalized.","options":["will send","will be sent","is sending","has sent"],"answer":1,"explain_zh":"主詞 itinerary(行程表)是「被寄送」的對象,且時間子句 as soon as... 用現在式代替未來,主要子句用未來被動 will be + p.p.,故選 (B)。"},{"question":"______ accordance with company policy, all travel expenses must be submitted within thirty days.","options":["In","On","At","By"],"answer":0,"explain_zh":"in accordance with...(依照、根據)是固定片語,故選 (A) In。此片語與 according to 同義,是 Part 5 高頻考點。"},{"question":"The shipment was delayed ______ severe weather conditions along the delivery route.","options":["because","due to","since","now that"],"answer":1,"explain_zh":"空格後是名詞片語 severe weather conditions,須用介系詞片語 due to(由於),故選 (B)。because、since、now that 都是連接詞,後面必須接完整子句。"},{"question":"The seminar will be held in Room 402, ______ the product demonstration took place last year.","options":["which","that","where","when"],"answer":2,"explain_zh":"空格後 the product demonstration took place 是完整子句,先行詞 Room 402 是地點,須用關係副詞 where,故選 (C)。which 之後應接缺主詞或受詞的不完整子句。"},{"question":"This quarter's revenue is significantly higher than ______ of the same period last year.","options":["that","those","this","these"],"answer":0,"explain_zh":"比較對象是 the revenue of the same period last year,為避免重複,用指示代名詞替代單數不可數名詞 revenue,須用 that,故選 (A)。those 用於替代複數名詞。"},{"question":"The manual provides step-by-step instructions to help users ______ install the software.","options":["success","successful","successfully","succeed"],"answer":2,"explain_zh":"空格修飾動詞 install(如何安裝),須用副詞,故選 (C) successfully(成功地)。help sb (to) + 原形動詞的結構已由 install 擔任,空格只能是修飾語。"},{"question":"The defective items ______ to the supplier for a full refund last Tuesday.","options":["returned","were returned","have returned","are returning"],"answer":1,"explain_zh":"主詞 items(瑕疵品)是「被退回」的對象,須用被動語態;又有明確過去時間 last Tuesday,用過去式被動 were returned,故選 (B)。have returned 不能與明確過去時間連用。"},{"question":"By the time the auditors arrive next Monday, the finance team ___ the quarterly reports.","options":["will complete","completed","will have completed","has completed"],"answer":2,"explain_zh":"考點：by the time + 未來時間點，主要子句須用未來完成式，表示「屆時已完成」。(A) will complete 只表未來動作，無法表達在稽核人員抵達前已完成；(B) completed 過去式與 next Monday 矛盾；(D) has completed 現在完成式不能與明確的未來時間搭配。"},{"question":"The company ___ its headquarters to Singapore three years ago.","options":["has relocated","relocated","had relocated","relocates"],"answer":1,"explain_zh":"考點：three years ago 是明確過去時間點，須用過去簡單式。(A) has relocated 現在完成式不可與 ago 連用；(C) had relocated 過去完成式需要另一個更晚的過去事件作參照；(D) relocates 現在式與過去時間矛盾。"},{"question":"Ms. Tanaka ___ for the marketing department since she joined the firm in 2019.","options":["works","has worked","worked","is working"],"answer":1,"explain_zh":"考點：since + 過去時間點，表示從過去持續到現在，須用現在完成式。(A) works 現在簡單式無法表達持續至今；(C) worked 過去式表示已結束的動作，與 since 語意不合；(D) is working 現在進行式不能與 since 2019 搭配表達持續期間。"},{"question":"The board members ___ the merger proposal when the CEO unexpectedly walked in yesterday.","options":["were discussing","are discussing","have discussed","discuss"],"answer":0,"explain_zh":"考點：過去某動作進行中被另一過去動作打斷，須用過去進行式 were discussing。(B) are discussing 現在進行式與 yesterday 矛盾；(C) have discussed 現在完成式不可與明確過去時間連用；(D) discuss 現在式時態錯誤。"},{"question":"The company's sales figures ___ steadily since the new pricing strategy was introduced.","options":["rose","have risen","rise","had risen"],"answer":1,"explain_zh":"考點：since + 過去事件，主要子句用現在完成式表示持續到現在的變化。(A) rose 過去式無法表達持續至今；(C) rise 現在簡單式與 since 子句不搭；(D) had risen 過去完成式需要另一個過去參照點，此處沒有。"},{"question":"Last quarter, the firm ___ a record number of overseas orders.","options":["receives","has received","received","will receive"],"answer":2,"explain_zh":"考點：Last quarter 是明確的過去時間，須用過去簡單式。(A) receives 現在式與過去時間矛盾；(B) has received 現在完成式不可與明確過去時間連用；(D) will receive 未來式與 last 矛盾。"},{"question":"By next April, Ms. Chen ___ for the firm for exactly ten years.","options":["will have worked","will work","has worked","worked"],"answer":0,"explain_zh":"考點：by + 未來時間點搭配一段期間（for ten years），須用未來完成式，表示到那時累積的年資。(B) will work 無法表達累積到某時間點的持續；(C) has worked 現在完成式不能與 next April 搭配；(D) worked 過去式與未來時間矛盾。"},{"question":"The board of directors ___ the revised budget proposal at tomorrow afternoon's meeting.","options":["reviewed","has reviewed","had reviewed","will review"],"answer":3,"explain_zh":"考點：tomorrow afternoon 是未來時間，須用未來式 will review。(A) reviewed 過去式與未來時間矛盾；(B) has reviewed 現在完成式表示已發生，與 tomorrow 不合；(C) had reviewed 過去完成式時態完全錯誤。"},{"question":"Before the merger was publicly announced, few employees ___ of the negotiations.","options":["have heard","hear","had heard","will hear"],"answer":2,"explain_zh":"考點：before + 過去事件，更早發生的動作用過去完成式 had heard，表示「在宣布之前就已聽說」。(A) have heard 現在完成式與過去敘事不合；(B) hear 現在式時態錯誤；(D) will hear 未來式與過去語境矛盾。"},{"question":"The IT department ___ the new accounting software at the moment, so some systems may be temporarily unavailable.","options":["installs","installed","has installed","is installing"],"answer":3,"explain_zh":"考點：at the moment 表示「此刻正在進行」，須用現在進行式。(A) installs 現在簡單式表習慣性動作，與 at the moment 不合；(B) installed 過去式與現在時間矛盾；(C) has installed 表示已完成，則系統不該仍然無法使用，語意矛盾。"},{"question":"Once the contract ___ signed by both parties, we will begin production immediately.","options":["will be","is","had been","would be"],"answer":1,"explain_zh":"考點：once／when／as soon as 引導的時間副詞子句中，即使指未來，也須用現在式代替未來式。(A) will be 時間子句中不可用 will；(C) had been 過去完成式與未來語境矛盾；(D) would be 用於假設語氣，此處是確定會發生的條件。"},{"question":"Every morning, the store manager ___ the cash registers before opening the doors to customers.","options":["checks","is checking","checked","has checked"],"answer":0,"explain_zh":"考點：Every morning 表示例行習慣，須用現在簡單式。(B) is checking 進行式表示此刻正在做，與習慣性頻率副詞不搭；(C) checked 過去式與 every morning 表達的常態不合；(D) has checked 現在完成式無法表達反覆的例行動作。"},{"question":"Each of the job applicants ___ required to submit two professional references.","options":["are","were","is","have been"],"answer":2,"explain_zh":"考點：each of + 複數名詞，主詞核心是 each，動詞用單數 is。(A) are 誤把 applicants 當主詞；(B) were 除了單複數錯誤外，語境也非過去；(D) have been 複數完成式，同樣犯了主詞一致的錯誤。"},{"question":"The number of customer complaints ___ decreased significantly since the new return policy took effect.","options":["have","has","are","were"],"answer":1,"explain_zh":"考點：the number of + 複數名詞指「數量」本身，視為單數，且 since 搭配完成式，故用 has decreased。(A) have 誤把 complaints 當主詞；(C) are、(D) were 皆為 be 動詞，無法與過去分詞 decreased 構成完成式，且單複數也錯。注意：a number of（許多）才接複數動詞。"},{"question":"Neither the manager nor his assistants ___ aware of the sudden schedule change.","options":["was","is","has been","were"],"answer":3,"explain_zh":"考點：neither A nor B 採「就近原則」，動詞與較近的主詞 assistants（複數）一致，故用 were。(A) was、(B) is、(C) has been 皆為單數動詞，誤與較遠的 the manager 一致。"},{"question":"A list of approved vendors ___ available on the company intranet.","options":["is","are","were","have been"],"answer":0,"explain_zh":"考點：主詞核心是 a list（單數），of approved vendors 只是修飾語，動詞用單數 is。(B) are、(C) were、(D) have been 皆誤把介系詞片語中的 vendors 當作主詞而用了複數動詞。"},{"question":"Everyone attending the annual conference ___ to register at the front desk by Friday.","options":["need","are needing","needs","have needed"],"answer":2,"explain_zh":"考點：everyone 是不定代名詞，一律視為單數，動詞用 needs。(A) need 複數動詞，主詞一致錯誤；(B) are needing 除單複數錯誤外，need 為狀態動詞通常不用進行式；(D) have needed 複數完成式，主詞一致錯誤。"},{"question":"A wide variety of payment options ___ offered on our online store.","options":["is","are","was","has been"],"answer":1,"explain_zh":"考點：a variety of + 複數名詞，語意重點在後面的複數名詞 options，動詞用複數 are。(A) is、(C) was、(D) has been 皆為單數動詞，誤以為 variety 是主詞核心。比較：the variety of... 才接單數動詞。"},{"question":"The CEO, along with several board members, ___ scheduled to visit the Osaka plant next week.","options":["are","were","have been","is"],"answer":3,"explain_zh":"考點：along with／together with／as well as 插入語不影響主詞單複數，主詞仍是 The CEO（單數），動詞用 is。(A) are、(C) have been 誤把 board members 算進主詞；(B) were 單複數與時態皆不合（next week 指未來安排）。"},{"question":"Approximately forty percent of the annual budget ___ allocated to research and development.","options":["are","were","have been","is"],"answer":3,"explain_zh":"考點：百分比＋of＋名詞時，動詞與 of 後面的名詞一致；budget 為單數不可數概念，故用 is。(A) are、(C) have been 為複數動詞，只有當 of 後面是複數名詞（如 forty percent of the employees）才適用；(B) were 單複數錯誤且無過去語境。"},{"question":"There ___ still several unresolved issues that must be addressed before the product launch.","options":["is","was","are","has been"],"answer":2,"explain_zh":"考點：there be 句型中，動詞與後面的真主詞一致；several unresolved issues 為複數，故用 are。(A) is、(D) has been 為單數動詞；(B) was 除單複數錯誤外，still 與待辦語境顯示是現在狀態，不用過去式。"},{"question":"All expense reports must ___ by the department head before reimbursement can be processed.","options":["approve","be approved","approving","have approved"],"answer":1,"explain_zh":"考點：報告是「被核准」的對象，且情態動詞 must 後接原形，被動語態為 must be approved。(A) approve 主動語態，報告不會自己核准；(C) approving 情態動詞後不可接 V-ing；(D) have approved 主動完成式，語態錯誤。by the department head 是被動語態的明顯線索。"},{"question":"The annual shareholders' meeting ___ in the hotel's grand ballroom next Thursday.","options":["will hold","is holding","will be held","holds"],"answer":2,"explain_zh":"考點：會議是「被舉行」的，須用被動語態；搭配 next Thursday 用未來被動 will be held。(A) will hold 主動語態，會議不能自己舉行；(B) is holding 主動進行式，語態錯誤；(D) holds 主動現在式，語態錯誤。hold 與 meeting 的搭配幾乎都考被動。"},{"question":"The defective units ___ to the manufacturer for a full refund last week.","options":["returned","have returned","were returned","returning"],"answer":2,"explain_zh":"考點：瑕疵品是「被退回」的，且 last week 為過去時間，用過去被動 were returned。(A) returned 主動過去式，物品不會自己退回；(B) have returned 主動完成式且不可與 last week 連用；(D) returning 非完整動詞，句子缺乏述語。"},{"question":"All new employees ___ to complete the safety training program by the end of their first month.","options":["require","are required","requiring","have required"],"answer":1,"explain_zh":"考點：be required to V「被要求做某事」為固定被動用法，員工是被要求的對象。(A) require 主動語態，變成員工去要求別人，語意顛倒；(C) requiring 非完整動詞；(D) have required 主動完成式，語態錯誤。"},{"question":"The updated privacy policy ___ to all staff members via email yesterday afternoon.","options":["announced","has announced","is announcing","was announced"],"answer":3,"explain_zh":"考點：政策是「被公告」的，且 yesterday afternoon 為過去時間，用過去被動 was announced。(A) announced 主動過去式，政策不會自己公告；(B) has announced 主動完成式且不可與明確過去時間連用；(C) is announcing 主動進行式，語態與時態皆錯。"},{"question":"Applications for the regional manager position are currently ___.","options":["accepting","accepts","being accepted","accept"],"answer":2,"explain_zh":"考點：申請書是「正在被受理」，currently 搭配現在進行被動 are being accepted。(A) accepting 主動進行式，申請書不會自己受理，語態顛倒；(B) accepts 第三人稱單數現在式，不能直接接在 be 動詞 are 之後；(D) accept 原形動詞，同樣無法與 are 連用構成正確句構。"},{"question":"The main conference room ___ at the moment, so please use Room B for today's meeting.","options":["is renovating","renovates","has renovated","is being renovated"],"answer":3,"explain_zh":"考點：會議室是「正在被整修」，at the moment 搭配現在進行被動 is being renovated。(A) is renovating 主動進行式，會議室不會自己整修；(B) renovates、(C) has renovated 皆為主動語態，語意顛倒，且時態與「此刻」不合。"},{"question":"The renovation of the lobby ___ by the time the safety inspectors visit in September.","options":["will have been completed","will complete","is completing","has completed"],"answer":0,"explain_zh":"考點：整修工程是「被完成」的，且 by the time + 未來時間須用未來完成式，合併為未來完成被動 will have been completed。(B) will complete 主動語態，工程不會自己完成事情；(C) is completing 主動進行式，語態錯誤；(D) has completed 主動完成式，語態錯誤且無法搭配未來時間點。"},{"question":"If the shipment ___ delayed again, we will have to look for a more reliable supplier.","options":["is","will be","were","would be"],"answer":0,"explain_zh":"考點：第一類條件句（未來很可能發生），if 子句用現在式，主句用 will；主句已有 will have to，故 if 子句用 is delayed。(B) will be：if 子句不可用 will；(C) were、(D) would be 屬於第二類假設語氣，但主句用的是 will 而非 would，前後不一致。"},{"question":"If Mr. Park ___ his sales targets last quarter, he would have received a substantial bonus.","options":["met","meets","had met","would meet"],"answer":2,"explain_zh":"考點：第三類條件句（與過去事實相反），if 子句用過去完成式 had met，主句用 would have + p.p.；last quarter 與主句 would have received 是明確線索。(A) met 是第二類假設用的過去式，與主句形式不搭；(B) meets 現在式，與過去假設矛盾；(D) would meet 不可用於 if 子句。"},{"question":"If the company ___ more in employee training, staff turnover would decrease significantly.","options":["invests","invested","had invested","will invest"],"answer":1,"explain_zh":"考點：第二類條件句（與現在事實相反的假設），if 子句用過去式 invested，主句用 would + 原形；主句 would decrease 是關鍵線索。(A) invests 現在式屬第一類條件句，須搭配主句 will；(C) had invested 屬第三類，主句須為 would have decreased；(D) will invest：if 子句不可用 will。"},{"question":"The director requested that the financial report ___ submitted no later than noon on Friday.","options":["is","was","will be","be"],"answer":3,"explain_zh":"考點：request／suggest／demand／insist 等要求動詞後的 that 子句用假設語氣，動詞用原形（should 被省略），故為 (should) be submitted。(A) is、(B) was、(C) will be 皆為一般時態變化，不符合要求動詞後子句須用原形動詞的規則。"},{"question":"___ the meeting be postponed, all participants will be notified by email at least two hours in advance.","options":["Should","Unless","If","Would"],"answer":0,"explain_zh":"考點：Should + 主詞 + 原形動詞為 If the meeting should be postponed 的倒裝，表「萬一」，是正式商業書信常見句型。(B) Unless、(C) If 為連接詞，後面須接一般語序與正確時態（the meeting is postponed），不能直接接原形 be；(D) Would 不用於此種倒裝條件句。"},{"question":"If I ___ in your position, I would accept the overseas assignment without hesitation.","options":["am","was","were","be"],"answer":2,"explain_zh":"考點：第二類假設語氣（與現在事實相反）中，be 動詞不論人稱一律用 were，If I were... 為固定用法。(A) am 直說法現在式，與主句 would accept 不搭；(B) was 是口語中常見的錯誤，正式文法與多益測驗以 were 為標準答案；(D) be 原形動詞，文法不通。"},{"question":"The marketing team proposed a highly ___ strategy to expand into Southeast Asian markets.","options":["innovate","innovative","innovation","innovatively"],"answer":1,"explain_zh":"考點：詞性辨析。空格位於冠詞 a 與名詞 strategy 之間，且被副詞 highly 修飾，需要形容詞 innovative（創新的）。innovate 是動詞、innovation 是名詞、innovatively 是副詞，皆無法修飾名詞 strategy。"},{"question":"All applicants must submit their documents ___ to avoid processing delays.","options":["promptly","prompt","promptness","prompted"],"answer":0,"explain_zh":"考點：詞性辨析。空格修飾動詞 submit（如何提交），需要副詞 promptly（迅速地）。prompt 是形容詞、promptness 是名詞、prompted 是過去分詞，都不能修飾動詞。"},{"question":"The ___ of the new payroll system will begin next quarter.","options":["implement","implemented","implementation","implementable"],"answer":2,"explain_zh":"考點：詞性辨析。空格位於冠詞 The 之後、of 片語之前，作句子主詞，需要名詞 implementation（實施）。implement 是動詞、implemented 是過去式／過去分詞、implementable 是形容詞，皆不能當主詞名詞。"},{"question":"Ms. Tanaka is widely respected for her ___ handling of customer complaints.","options":["profession","professional","professionally","professionalism"],"answer":1,"explain_zh":"考點：詞性辨析。空格修飾動名詞轉化的名詞 handling，需要形容詞 professional（專業的）。professionalism（專業精神）與 profession（職業）皆為名詞，不能連續修飾另一個名詞；professionally 是副詞，不能修飾名詞。"},{"question":"The auditors found the financial records to be ___ accurate.","options":["surprise","surprising","surprisingly","surprised"],"answer":2,"explain_zh":"考點：詞性辨析。空格修飾形容詞 accurate（準確的），修飾形容詞需要副詞 surprisingly（出乎意料地）。surprising 與 surprised 是形容詞、surprise 是名詞或動詞，皆不能修飾形容詞。"},{"question":"Because demand has grown ___, the factory will add a second production shift.","options":["considerable","considerably","consideration","considerate"],"answer":1,"explain_zh":"考點：詞性辨析。空格修飾動詞 has grown（成長的程度），需要副詞 considerably（相當大地）。considerable（可觀的）與 considerate（體貼的）是形容詞、consideration（考量）是名詞，皆不能修飾動詞。"},{"question":"To remain ___ in the global market, the firm invests heavily in research.","options":["compete","competitive","competitively","competition"],"answer":1,"explain_zh":"考點：詞性辨析。remain 是連綴動詞，後面接形容詞作主詞補語，故選 competitive（有競爭力的）。compete 是動詞、competitively 是副詞、competition 是名詞，皆不能作 remain 的補語。"},{"question":"Please read the attached contract ___ before signing it.","options":["careful","carefully","carefulness","care"],"answer":1,"explain_zh":"考點：詞性辨析。空格修飾動詞 read（如何閱讀），需要副詞 carefully（仔細地）。careful 是形容詞、carefulness 與 care 是名詞，皆不能直接修飾動詞。"},{"question":"The seminar provided practical advice on how to communicate ___ with international clients.","options":["effective","effectively","effectiveness","effect"],"answer":1,"explain_zh":"考點：詞性辨析。空格修飾動詞 communicate（如何溝通），需要副詞 effectively（有效地）。effective 是形容詞、effectiveness 與 effect 是名詞，皆無法修飾動詞。"},{"question":"All expense reports must be submitted ___ the end of the month.","options":["until","by","among","during"],"answer":1,"explain_zh":"考點：介系詞。submit 是瞬間動作，表達「最晚在某時間點之前完成」用 by。until 表示動作「持續到」某時間點，只搭配持續性動作（如 stay、wait），是最常見的干擾錯誤；among 用於三者以上之間；during 後接一段期間表「在……期間」，皆不合語意。"},{"question":"The new branch office is conveniently located ___ walking distance of the central station.","options":["in","within","at","by"],"answer":1,"explain_zh":"考點：介系詞固定用法。within walking distance of（在步行可達的距離內）是固定搭配。in 是常見誤選，但標準用法為 within；at 與 by 皆不能與 walking distance 搭配。"},{"question":"Ms. Alvarez has been with the company ___ more than fifteen years.","options":["since","for","during","from"],"answer":1,"explain_zh":"考點：介系詞。for + 一段時間（fifteen years）表示持續多久，搭配完成式。since 後接起始時間點（如 since 2010）；during 後接特定名稱的期間（如 during the meeting），不接數字長度；from 需與 to 搭配表起訖。"},{"question":"___ the exception of the sales division, all departments met their quarterly targets.","options":["By","With","In","For"],"answer":1,"explain_zh":"考點：介系詞固定用法。with the exception of（除……之外）是固定片語，等同於 except for。By、In、For 皆不能與 the exception of 構成正確片語。"},{"question":"The success of the advertising campaign depends largely ___ timely social media engagement.","options":["on","to","with","for"],"answer":0,"explain_zh":"考點：動詞與介系詞搭配。depend on（取決於、依賴）是固定搭配。depend 不與 to、with、for 連用；此類動詞搭配（rely on、consist of、comply with）是多益高頻考點。"},{"question":"Payment is due ___ receipt of the invoice.","options":["upon","at","in","to"],"answer":0,"explain_zh":"考點：介系詞固定用法。(up)on receipt of（一收到……即）是商業書信固定用語，due upon receipt 意為「收到發票後立即付款」。at、in、to 皆不能與 receipt 構成此意的搭配。"},{"question":"The conference room is reserved ___ 2 P.M. to 4 P.M. on Thursday for the budget review.","options":["from","between","at","since"],"answer":0,"explain_zh":"考點：介系詞配對。from A to B 表示時間起訖。between 是常見干擾項，但必須與 and 搭配（between 2 P.M. and 4 P.M.）；at 只接單一時間點；since 表「自……以來」須搭配完成式。"},{"question":"___ the heavy rain, the outdoor product launch proceeded as scheduled.","options":["Although","Despite","Even though","However"],"answer":1,"explain_zh":"考點：連接詞 vs 介系詞。空格後是名詞片語 the heavy rain（無主詞動詞），須用介系詞 Despite。Although 與 Even though 是連接詞，後面必須接完整子句；However 是轉折副詞，不能直接接名詞片語。"},{"question":"___ the shipment arrived two days late, the client did not cancel the order.","options":["Despite","Because of","Although","In spite of"],"answer":2,"explain_zh":"考點：連接詞 vs 介系詞。空格後是完整子句（the shipment arrived...有主詞有動詞），須用連接詞 Although。Despite、Because of、In spite of 都是介系詞（片語），只能接名詞片語，不能接子句。"},{"question":"The board meeting was postponed ___ the CEO's flight was delayed by bad weather.","options":["because of","due to","because","owing to"],"answer":2,"explain_zh":"考點：連接詞 vs 介系詞。空格後是完整子句（the CEO's flight was delayed），須用連接詞 because。because of、due to、owing to 皆為介系詞片語，只能接名詞（如 because of the delay），不能接子句。"},{"question":"___ its compact size, the new printer can handle large-volume printing jobs.","options":["Even though","While","In spite of","Whereas"],"answer":2,"explain_zh":"考點：連接詞 vs 介系詞。空格後是名詞片語 its compact size，須用介系詞片語 In spite of（儘管）。Even though、While、Whereas 都是連接詞，後面必須接含主詞與動詞的完整子句。"},{"question":"Please silence your mobile phones ___ the keynote presentation.","options":["while","during","when","as"],"answer":1,"explain_zh":"考點：連接詞 vs 介系詞。空格後是名詞片語 the keynote presentation，須用介系詞 during（在……期間）。while、when、as 都是連接詞，後面須接子句（如 while the speaker is presenting），是本題的典型干擾項。"},{"question":"___ visiting the production facility, all guests must wear protective helmets.","options":["During","While","Despite","Among"],"answer":1,"explain_zh":"考點：連接詞 vs 介系詞。While + V-ing 是「While they are visiting」省略主詞與 be 動詞的分詞構句，表「在參觀時」。During 是介系詞，只能接名詞（during the visit），不能接 V-ing 動作句型；Despite visiting 文法可行但語意不通（「儘管參觀」與戴安全帽無讓步關係）；Among 表「在……之中」完全不合。"},{"question":"The product launch will go ahead next month ___ the marketing budget is approved this week.","options":["unless","provided that","in case of","despite"],"answer":1,"explain_zh":"考點：連接詞辨析。provided that（只要、假如）引導條件子句：只要預算獲批，發表會就會進行。unless（除非……否則不）語意剛好相反；in case of 是介系詞片語，只能接名詞；despite 也是介系詞且表讓步，皆不合。"},{"question":"Employees ___ complete the certification course will receive a salary increase.","options":["who","whom","which","whose"],"answer":0,"explain_zh":"考點：關係代名詞。先行詞 Employees 是人，且關係代名詞在子句中作主詞（___ complete the course），須用主格 who。whom 是受格，不能作主詞；which 用於事物；whose 是所有格，後面須接名詞。"},{"question":"The proposal ___ the board approved yesterday will take effect in January.","options":["who","whose","which","whom"],"answer":2,"explain_zh":"考點：關係代名詞。先行詞 The proposal 是事物，且關係代名詞在子句中作 approved 的受詞，須用 which（此處亦可用 that）。who 與 whom 只用於人；whose 是所有格，後面必須接名詞。"},{"question":"Mr. Chen, ___ office is next to the conference room, will lead the internal audit.","options":["who","whose","whom","which"],"answer":1,"explain_zh":"考點：關係代名詞所有格。空格後接名詞 office，表示「他的辦公室」，須用所有格 whose。who 是主格、whom 是受格，後面都不能直接接名詞表所屬；which 用於事物且非所有格。"},{"question":"The consultant ___ we hired last month has already improved workflow efficiency.","options":["whom","which","whose","what"],"answer":0,"explain_zh":"考點：關係代名詞。先行詞 The consultant 是人，且關係代名詞在子句中作 hired 的受詞（we hired ___），須用受格 whom。which 用於事物；whose 是所有格須接名詞；what 不能接在先行詞之後（what 本身已含先行詞）。"},{"question":"The company will relocate its headquarters to Austin, ___ operating costs are considerably lower.","options":["which","where","that","what"],"answer":1,"explain_zh":"考點：關係副詞 vs 關係代名詞。空格後的子句 operating costs are considerably lower 結構完整（不缺主詞或受詞），且先行詞 Austin 是地點，須用關係副詞 where。which 與 that 是關係代名詞，須在子句中擔任主詞或受詞；that 也不能用於逗號後的非限定子句；what 不能接先行詞。"},{"question":"Applicants must submit a design portfolio, ___ should include at least three recent projects.","options":["that","which","who","whom"],"answer":1,"explain_zh":"考點：關係代名詞非限定用法。逗號後的非限定關係子句補充說明 portfolio（事物），須用 which。that 不能用於逗號後的非限定子句（多益高頻陷阱）；who 與 whom 用於人，且 whom 是受格也不能作子句主詞。"},{"question":"Of all the regional branches, the Singapore office reported the ___ sales growth this quarter.","options":["higher","highest","most high","more highly"],"answer":1,"explain_zh":"考點：最高級。Of all the regional branches（在所有分公司之中）表示三者以上的比較範圍，須用最高級 the highest。higher 是比較級，用於兩者比較且常搭配 than；most high 是錯誤形式（單音節形容詞加 -est 而非 most）；more highly 是副詞比較級，不能修飾名詞 growth。"},{"question":"The new model is significantly ___ than its predecessor in terms of energy consumption.","options":["efficient","more efficient","most efficient","efficiently"],"answer":1,"explain_zh":"考點：比較級。句中的 than 是關鍵線索，須搭配比較級 more efficient。原級 efficient 不能與 than 連用；most efficient 是最高級，須搭配 the 且不與 than 連用；efficiently 是副詞，此處需要形容詞作補語。"},{"question":"The sooner we finalize the contract terms, ___ we can begin production.","options":["sooner","the sooner","soonest","the soonest"],"answer":1,"explain_zh":"考點：雙重比較句型。「The + 比較級..., the + 比較級...」表示「越……就越……」，前半句 The sooner 已定型，後半句須對稱使用 the sooner。單獨的 sooner 缺少定冠詞 the；soonest 與 the soonest 是最高級，不能用於此句型。"},{"question":"This year's trade fair attracted twice ___ visitors as last year's event.","options":["as many","more","as much","many more"],"answer":0,"explain_zh":"考點：倍數比較句型。「倍數 + as many/much + 名詞 + as」是固定句型；visitors 是可數名詞，須用 as many。as much 用於不可數名詞（常見干擾項）；more 與 many more 須搭配 than 而非 as，且不能與倍數詞 twice 連用。"},{"question":"Among the three proposals submitted, Ms. Rivera's was ___ detailed.","options":["more","the most","most of","the more"],"answer":1,"explain_zh":"考點：最高級。Among the three proposals（三者之中）須用最高級 the most detailed。more 是比較級且缺少比較對象 than；most of 後面須接名詞（如 most of the proposals），不能修飾形容詞；the more 用於兩者之間的比較（the more detailed of the two）。"},{"question":"Sales figures for July were even ___ than analysts had predicted.","options":["high","higher","highest","more high"],"answer":1,"explain_zh":"考點：比較級。句中的 than 須搭配比較級 higher，even 用於強調比較級（even higher 遠比預期更高）。原級 high 不能與 than 連用；highest 是最高級；more high 是錯誤形式，單音節形容詞 high 的比較級是加 -er。"}],"lessons":[{"id":"en-01","title":"Part 5 二十秒解題 SOP","subtitle":"先看選項再看題,30 題只給你 10 分鐘","minutes":7,"sections":[{"type":"text","body":"開始前,先花 30 秒建立多益的「地圖」。多益(TOEIC)聽力+閱讀共 200 題:聽力是 Part 1-4 共 100 題、約 45 分鐘,跟著音檔走,不能自己控制節奏;閱讀是 Part 5(單句填空 30 題)、Part 6(段落填空 16 題)、Part 7(閱讀測驗 54 題)共 100 題、75 分鐘,節奏完全由你掌握。之後的課提到「Part 幾」,回來看這張地圖就好。"},{"type":"text","body":"Part 5 共 30 題單句填空,是整份閱讀最能「省時間」的地方。我們的目標很明確:【平均一題 20 秒】,把省下來的時間全部留給 Part 7。祕訣只有一句話:【先看選項,再看題目】。四個選項長什麼樣子,就決定了這是哪種題型、你該看哪裡——大部分題目根本不用把整句讀完。"},{"type":"tip","body":"拿到題目,眼睛先掃四個選項。選項的「長相」會告訴你:這題要看哪裡、能不能秒殺。"},{"type":"table","title":"選項長相 → 題型判斷表","headers":["選項長相","題型","解法"],"rows":[["同字根、不同字尾(approve / approval / approved)","詞性題","只看【空格前後 2-3 個字】,判斷缺名詞、動詞還是形容詞"],["同一個動詞、不同時態(works / worked / has worked)","時態題","找【時間線索字】:yesterday、since、next week、by the time"],["四個完全不同的單字(order / place / stock / date)","字彙題","乖乖讀完整句抓語意,20 秒內選不出就先猜再前進"],["連接詞與介系詞混排(although / despite / because of)","文法題","看空格後面接【子句還是名詞】:連接詞接子句(裡面有主詞+動詞的一小句),介系詞只接名詞"]]},{"type":"text","body":"【實戰示範 1:詞性題】\n\nThe company announced the ______ of a new branch in Kaohsiung.\n(A) open (B) opens (C) opening (D) openly\n(公司宣布將在高雄開設新分店。)\n\n第一步:掃選項——同字根 open、不同字尾,是【詞性題】。\n第二步:只看空格前後——the ______ of。冠詞 the 和介系詞 of 的中間,只能放【名詞】。\n第三步:四個選項裡的名詞是 (C) opening,選它。整句其實不用讀完,10 秒收工。"},{"type":"text","body":"【實戰示範 2:時態題】\n\nMs. Chen ______ for the company since 2019.\n(A) works (B) worked (C) has worked (D) is working\n(陳小姐自 2019 年起就在這間公司服務。)\n\n第一步:掃選項——同一個動詞 work 換時態,是【時態題】。\n第二步:找時間線索——句尾的【since 2019】,代表「從過去某時間點持續到現在」。\n第三步:since + 過去時間點,固定搭配【現在完成式】,選 (C) has worked。看到 since 就想到 has/have + 過去分詞(動詞的 p.p. 形,如 worked、written),練成反射動作。"},{"type":"text","body":"【實戰示範 3:字彙題】\n\nThe photocopier on the third floor is out of ______, so please use the one near the mailroom.\n(A) order (B) place (C) stock (D) date\n(三樓的影印機故障了,請改用收發室旁邊那台。)\n\n第一步:掃選項——四個不相干的名詞,是【字彙題】,這種題就必須讀整句。\n第二步:抓語意——後半句說「請改用另一台」,可見這台壞了。\n第三步:out of order 是「故障」的固定搭配,選 (A)。順便一起記:out of stock 缺貨、out of date 過期,都是多益高頻。"},{"type":"tip","body":"20 秒不是每題都硬撐滿:詞性題常常 10 秒就收,省下的時間補貼字彙題。真的選不出來,【猜一個、劃卡、往前走】,Part 5 沒有任何一題值得你耗 1 分鐘。"},{"type":"quiz","title":"小試身手","questions":[{"question":"The manager asked for a quick ______ of the sales figures.\n(經理要求一份銷售數字的簡短摘要。)","options":["summarize","summary","summarized","summarily"],"answer":1,"explain_zh":"選項同字根不同字尾→詞性題。只看空格前後:a quick ______ of,冠詞+形容詞後面要接【名詞】,故選 summary。summarize 是動詞,summarily 是副詞,都放不進這個位置。"},{"question":"The finance team ______ the budget report yesterday.\n(財務團隊昨天提交了預算報告。)","options":["submit","submits","submitted","will submit"],"answer":2,"explain_zh":"同一動詞換時態→時態題。時間線索字是【yesterday】,明確指過去,用過去簡單式 submitted。will submit 與 yesterday 直接矛盾。"},{"question":"Employees must ______ original receipts to the accounting department to be reimbursed.\n(員工必須將收據正本交給會計部門才能請款。)","options":["describe","submit","purchase","attend"],"answer":1,"explain_zh":"四個不同單字→字彙題,要讀整句:句尾 to be reimbursed(獲得核銷)提示要【提交 submit】收據。submit 與 reimburse 都是多益超高頻字,建議整組記住。"},{"question":"看到選項是 rely / reliable / reliably / reliance,你的第一反應應該是?","options":["這是字彙題,把整句慢慢讀完","這是詞性題,只看空格前後判斷詞性","這是時態題,快找時間線索","先讀完整篇文章再回來"],"answer":1,"explain_zh":"四個選項同字根(rely)不同字尾→標準【詞性題】。動詞 rely、形容詞 reliable、副詞 reliably、名詞 reliance,只要看空格前後判斷缺什麼詞性即可,通常 10 秒內解決。"}]}]},{"id":"en-02","title":"Part 7 定位法","subtitle":"帶著問題找答案,別把文章從頭讀到尾","minutes":7,"sections":[{"type":"text","body":"Part 7 共 54 題,分成單篇與多篇(兩三篇一組互相對照)大約 15 組文章,如果每篇都從頭讀到尾,時間絕對不夠。750+ 的讀法是【帶著問題去找答案】:先讀題目→圈出關鍵字→回文章掃描定位→只精讀答案附近的一兩句。把文章當成資料庫,題目才是你的搜尋關鍵字。"},{"type":"tip","body":"圈關鍵字要挑【不會被改寫的字】:人名、公司名、日期、數字、金額。像 good、important 這種到處都有的字,定位不了。"},{"type":"table","title":"Part 7 題型對策表","headers":["題目長相","題型","對策"],"rows":[["What is the purpose of…? / Why was the email sent?","主旨題","看【標題+第一段】,通常不必讀完全文"],["When / Where / How much / Who…?","細節題","圈關鍵字回文章掃描,答案就在關鍵字附近一兩句"],["What is NOT mentioned…?","NOT 題","反過來拿【四個選項】回文章逐一核對,刪掉有寫的三個"],["imply / infer / suggest / most likely","推論題","找文章裡的【證據句】做一小步推理,嚴禁腦補"],["雙篇/三篇的數字、日期比對題","交叉定位題","單篇找不到完整答案時,到另一篇找【配對的資訊】"]]},{"type":"text","body":"【NOT 題:反著做】\n\n一般題目是「拿題目找答案」,NOT 題要【拿選項回去對文章】。例如題目問 What is NOT mentioned as being included?(何者未被提及包含在內?),文章寫了 a handout, a certificate, and free parking(講義、證書、免費停車),那這三個選項就能一一刪掉,剩下沒出現的那個就是答案。\n\nNOT 題費時但送分——四個選項有三個的答案都直接寫在文章裡,只要耐心逐一打勾刪去,幾乎不會錯。時間緊的時候,它的優先度高於推論題。"},{"type":"text","body":"【推論題:答案永遠換句話說】\n\n看到 imply、infer、most likely,先深呼吸:答案一定【有憑有據】,只是被「同義改寫 (paraphrase)」了。文章寫 The elevator is out of order.(電梯故障),正確選項會寫成 It is not working.(它無法運作);文章寫 complimentary breakfast(免費早餐),選項會寫 free meal。\n\n做法:圈題目關鍵字→找到證據句→在選項裡找那句話的「變裝版」。如果某個選項需要你想像文章沒寫的劇情,再合理都不能選。"},{"type":"text","body":"【雙篇/三篇:交叉定位】\n\n多篇閱讀每組 5 題,固定有 1-2 題要【兩篇一起看】才解得開。經典模式:第一篇公告寫 Orders placed by May 5 will receive a 10% discount.(5 月 5 日前下訂享九折),第二篇 email 裡顧客寫 I placed my order on May 3.(我 5 月 3 日下訂)——兩邊各只有一半線索,合起來才推得出:這位顧客拿得到折扣。\n\n訣竅:在單篇裡怎麼找都缺一塊資訊時,不要慌,那就是交叉題,立刻去另一篇找【日期、金額、方案名稱】的配對資訊。"},{"type":"quiz","title":"小試身手","questions":[{"question":"拿到一題 Part 7 細節題(例如 When will the workshop be held?),正確的第一步是?","options":["從文章第一句開始精讀","先讀題目、圈出關鍵字 workshop,再回文章掃描","先把四個選項都翻成中文","先跳過,細節題都很難"],"answer":1,"explain_zh":"定位法的核心:先讀題目圈關鍵字,再帶著關鍵字回文章掃描。細節題其實是 Part 7 最好拿的分數,答案就在關鍵字附近一兩句。"},{"question":"【短文】The one-day workshop includes a printed handout, a certificate of completion, and free parking.\n(這場一日工作坊包含紙本講義、結業證書與免費停車。)\n\nWhat is NOT included in the workshop?","options":["A handout","A certificate","Free parking","Lunch"],"answer":3,"explain_zh":"NOT 題用刪去法:handout、certificate、free parking 三項文章都明確寫到,逐一刪掉;Lunch 從頭到尾沒出現,故為正解。"},{"question":"文章寫 The photocopier is out of order.(影印機故障了。)下列哪個選項是它的正確同義改寫?","options":["It is brand new.","It is not working.","It is for sale.","It has been moved upstairs."],"answer":1,"explain_zh":"out of order = 故障 = not working。Part 7 的正確答案幾乎都是原文的【同義改寫】,平常背單字時多記同義說法,考場上才認得出變裝後的答案。"},{"question":"【公告】Orders placed by May 5 will receive a 10% discount.\n【Email】I placed my order on May 3.\n(公告:5/5 前下訂享九折。Email:我 5/3 下訂。)\n\nWhat can be inferred about the customer?","options":["The order was cancelled.","The customer will get a discount.","The customer paid full price.","Shipping is free."],"answer":1,"explain_zh":"典型交叉定位題:公告給條件(5/5 前下訂→九折),email 給事實(5/3 下訂),兩篇合起來推出顧客符合折扣資格。取消、全額、免運文章都沒有根據。"}]}]},{"id":"en-03","title":"聽力先讀題","subtitle":"耳朵聽這一組,眼睛已在下一組","minutes":6,"sections":[{"type":"text","body":"Part 3(對話)加 Part 4(獨白)共 69 題,是聽力的大魔王,也是 750+ 的關鍵戰場。核心心法一句話:【耳朵在聽這一組,眼睛已經在下一組】。每個 Part 開頭都會播大約 30 秒的 directions(考試說明),內容年年一樣,完全不用聽——這 30 秒是送你的【預讀時間】,拿來讀第一組的 3 個題目和 12 個選項。"},{"type":"text","body":"【預讀要讀什麼?】\n\n先圈題目的疑問詞和關鍵字:Where 問地點、What problem 問麻煩事、do next 問下一步。再快速掃選項——選項本身會洩題:看到 boarding pass、gate、departure,八成是機場;看到 invoice、refund、exchange,就是客服或購物場景。\n\n開播前你心裡已經有劇本,聽的時候只是在【驗證預測】,不是從零理解——這就是先讀題和裸聽的差距。"},{"type":"table","title":"Part 3/4 高頻題型與線索位置","headers":["題目關鍵字","在問什麼","答案通常出現在"],"rows":[["Where / Who most likely","場景、說話者身分","對話【開頭一兩句】"],["What problem / Why is … calling","問題點、來電目的","前中段,常跟在 but、unfortunately、however 後面"],["What will … do next / What is … asked to do","下一步行動","對話【結尾】"],["Look at the graphic(圖表題)","對照圖表選答案","對話唸的是圖表的【另一欄】,眼睛要盯著圖對照"]]},{"type":"sounds","title":"點擊聽發音:先讀題必認的高頻題目句","items":[{"text":"Where most likely are the speakers?","sub":"場景題:答案通常藏在開頭前兩句","zh":"說話者最有可能在哪裡?"},{"text":"What problem does the woman mention?","sub":"問題題:注意 but、unfortunately 後面那句","zh":"女士提到了什麼問題?"},{"text":"Why is the man calling?","sub":"目的題:開頭常見 I'm calling to…","zh":"男士為什麼打這通電話?"},{"text":"What will the listeners most likely do next?","sub":"下一步題:線索固定在結尾","zh":"聽眾接下來最可能做什麼?"},{"text":"What does the speaker imply when he says, “It's already Friday”?","sub":"說話者意圖題:聽語氣,想「他為什麼要講這句」","zh":"說話者說「都已經星期五了」,是想表達什麼?"}]},{"type":"text","body":"【跟丟了怎麼止損?】\n\n一定會發生:恍神兩秒、一個關鍵字沒聽懂,整段就糊了。這時唯一正確的動作是——【立刻猜一個答案、劃卡、翻頁預讀下一組】。最忌諱的是回想「剛剛到底說了什麼」:你多想 5 秒,下一組的預讀時間就沒了,跟丟一題會變成跟丟一組。口訣:【丟一題,認;丟一組,虧】。\n\n另外,每組 3 題請在對話播完、題目語音還在慢慢唸時就作答完畢,把題與題之間的 8 秒空檔全部存起來,拿去預讀下一組。"},{"type":"tip","body":"聽力請【邊做邊劃卡】,聽完一題馬上劃,千萬不要想「先圈在題本、最後再補劃」——聽力結束會直接進閱讀,沒有任何補劃時間。"},{"type":"quiz","title":"小試身手","questions":[{"question":"Part 3 開頭播放 directions(考試說明)的 30 秒,750+ 考生應該做什麼?","options":["認真聽說明,避免違規","閉眼休息、養精蓄銳","預讀第一組的題目和選項","偷偷開始寫閱讀"],"answer":2,"explain_zh":"directions 內容每次考試都一樣,不需要聽。這 30 秒是黃金預讀時間,拿來圈第一組題目的疑問詞、掃選項預測場景。(偷寫閱讀是違規行為,會被取消資格。)"},{"question":"某題的選項出現 boarding pass、gate 14、departure time,這組對話的場景最可能是?","options":["餐廳","機場","銀行","健身房"],"answer":1,"explain_zh":"boarding pass(登機證)、gate(登機門)、departure(起飛/出發)都是機場字彙——選項會洩題,先讀選項就能預測場景,聽的時候只是驗證。"},{"question":"題目問 What will the man do next?(男士接下來會做什麼?),答案的線索通常出現在對話的哪裡?","options":["開頭第一句","中段轉折處","結尾","題目本身"],"answer":2,"explain_zh":"「下一步」類題目線索幾乎固定在【對話結尾】,常見句型如 I'll send it right away. 記住位置規律:場景在開頭、問題在中段、下一步在結尾。"},{"question":"聽到一半恍神,整段對話跟丟了,最正確的處理是?","options":["閉上眼睛努力回想剛剛的內容","這三題先空著,等聽力全部結束再回來想","馬上猜一個答案劃卡,搶先預讀下一組","舉手請監考人員重播"],"answer":2,"explain_zh":"止損原則:立刻猜、立刻劃、立刻預讀下一組。回想只會賠掉下一組的預讀時間;空著不劃最後也沒時間補;音檔不可能重播。丟一題認了,別讓它變成丟一組。"}]}]},{"id":"en-04","title":"時間分配與考前策略","subtitle":"把每一秒花在拿得到的分數上","minutes":7,"sections":[{"type":"text","body":"閱讀 100 題只有 75 分鐘,平均一題 45 秒——但【平均分配就是輸】。Part 5 一題 20 秒能解,Part 7 一題卻常要 1 分鐘,所以要把 Part 5、Part 6 省下的每一秒,全部搬去餵 Part 7。750+(藍色證書)不要求你每題都寫完、每題都對,要求的是【把時間花在拿得到的分數上】。"},{"type":"table","title":"閱讀 75 分鐘切法","headers":["大題","題數","建議時間","平均每題"],"rows":[["Part 5 單句填空","30 題","10 分鐘","約 20 秒"],["Part 6 段落填空","16 題","8 分鐘","約 30 秒"],["Part 7 閱讀測驗","54 題","55 分鐘","約 60 秒"],["劃卡檢查緩衝","—","2 分鐘","—"]]},{"type":"text","body":"【Part 6 是什麼?兩分鐘補課】\n\n前面的課教了 Part 5 和 Part 7,中間夾著的 Part 6 是【段落填空】:4 篇短文、每篇 4 個空格,共 16 題。其中大多數空格就是把 Part 5 的詞性題、時態題搬進文章裡,直接用第一課的 SOP 解;每篇另有 1 題【句子插入題】(從四句話中挑一句放進空格),這種題必須讀懂空格【前後各一句】,看代名詞(it、they)和轉折詞(however、therefore)接不接得上。所以 Part 6 的節奏是:一般空格 20 秒、句子插入題 40 秒,平均每題約 30 秒。"},{"type":"text","body":"【學會放棄,是 750 的必修課】\n\n該果斷放掉的題:Part 5 裡四個單字都不認識的字彙題(多瞪 30 秒也不會突然認識)、三篇閱讀裡最繞的推論題、時間不夠時 Part 7 最後一組裡最難定位的那一兩題(先把好定位的細節題撈完)。\n\n多益【答錯不倒扣】,所以答案卡上絕對不能有空格——決定放棄的題目,統一猜同一個字母(例如全部猜 B):不用每題重新猶豫、不容易劃錯格,把腦力和秒數留給拿得到的分數。"},{"type":"tip","body":"手錶設三個檢查點:進 Part 6 時大約過了 10 分鐘、進 Part 7 時約 18-20 分鐘、開始最後的多篇閱讀前至少還剩 15 分鐘。一超時就加速,別戀戰。"},{"type":"text","body":"【劃卡節奏】\n\n閱讀建議【做完一頁劃一頁】:一題一劃會不斷打斷思考,全部留到最後劃則是拿人生開玩笑(收卷不等人)。鈴響前 5 分鐘,不管寫到哪,先停下來確認答案卡【100 格全滿】,再回去繼續寫。\n\n聽力則相反:邊聽邊劃、一題一劃,因為聽力結束直接進閱讀,完全沒有補劃時間。"},{"type":"table","title":"考前一天與當天 checklist","headers":["時間","要做的事"],"rows":[["考前一天","備妥應試通知與【有效身分證件正本】、2B 鉛筆兩支+橡皮擦、無聲手錶;查好考場位置與交通"],["考前一天","只複習【錯題本和高頻單字】,不塞新東西;做一回聽力保持耳朵手感;12 點前睡"],["考試當天","提早 40 分鐘到考場;早餐吃平常熟悉的食物;進試場前先上廁所"],["考試當天","試音時確認喇叭方位與音量;深呼吸,提醒自己:跟丟就止損、寫不完就猜同一個字母"]]},{"type":"quiz","title":"小試身手","questions":[{"question":"計時 20 秒!Employees who work overtime will be ______ accordingly.\n(加班的員工將獲得相應的補償。)","options":["compensate","compensated","compensation","compensating"],"answer":1,"explain_zh":"詞性題只看空格前後:will be ______ 是被動語態(主詞是「被」處理的一方),be 後面接【過去分詞】,選 compensated。compensation(補償金)是名詞,放進 be 後面反而變成「員工是補償金」,不通。這組字是 Part 5 的常客。"},{"question":"依照本課的切法,Part 5 的 30 題大約該用多少時間?","options":["10 分鐘","20 分鐘","30 分鐘","5 分鐘"],"answer":0,"explain_zh":"Part 5 用約 10 分鐘(每題 20 秒)、Part 6 約 8 分鐘,才能給 Part 7 留滿 55 分鐘。花 20-30 分鐘寫 Part 5,Part 7 一定寫不完。"},{"question":"Part 5 遇到四個選項都不認識的字彙題,最好的做法是?","options":["動用所有字根字首知識,耗 2 分鐘也要解出來","先跳過空著,等全部寫完再回來","20 秒內猜固定字母、劃卡,立刻前進","從這題開始放棄整份閱讀"],"answer":2,"explain_zh":"不認識就是不認識,多瞪 30 秒不會突然認識。多益答錯不倒扣,猜一個固定字母、劃卡、前進,把時間省給 Part 7。空著不劃有忘記補劃的風險。"},{"question":"關於劃卡,下列哪個做法【最危險】?","options":["閱讀做完一頁劃一頁","聽力邊聽邊劃、一題一劃","鈴響前 5 分鐘確認 100 格全滿","全部寫完題本,最後 3 分鐘一次劃 100 題"],"answer":3,"explain_zh":"留到最後一次劃 100 題,只要時間估錯或劃錯位,整份考卷就毀了,而且收卷不等人。正確做法是閱讀一頁一劃、聽力一題一劃,並在鈴響前確認全滿。"},{"question":"考前一天,最【不】建議做的事是?","options":["翻自己的錯題本","確認證件和 2B 鉛筆都備好","熬夜狂背 500 個新單字","做一回聽力維持耳朵手感"],"answer":2,"explain_zh":"考前一天塞新單字幾乎記不住,還會賠上睡眠——聽力最吃專注力,睡不飽最傷分。正確做法:複習舊的、備齊物品、維持手感、早點睡。"}]}]}]},"japanese":{"language":"japanese","display_name_zh":"日文","alphabet":[{"char":"あ","roman":"a","group":"hiragana"},{"char":"い","roman":"i","group":"hiragana"},{"char":"う","roman":"u","group":"hiragana"},{"char":"え","roman":"e","group":"hiragana"},{"char":"お","roman":"o","group":"hiragana"},{"char":"か","roman":"ka","group":"hiragana"},{"char":"き","roman":"ki","group":"hiragana"},{"char":"く","roman":"ku","group":"hiragana"},{"char":"け","roman":"ke","group":"hiragana"},{"char":"こ","roman":"ko","group":"hiragana"},{"char":"さ","roman":"sa","group":"hiragana"},{"char": zh":"你好，最近好嗎？","note":"白天最通用的招呼語；字尾寫作「は」但唸作 wa。","distractors_zh":["早安（早上專用）","晚安（晚上見面用）","再見（白天道別）"]},{"text":"こんばんは","reading":"こんばんは konbanwa","zh":"晚安（晚上見面時）","topic":"打招呼","example":"","example_zh":"","note":"傍晚以後見面時使用，禮貌體與常體場合都通用。","distractors_zh":["晚安（睡前道別）","再見（晚上道別時）","你好（白天見面時）"]},{"text":"はじめまして","reading":"はじめまして hajimemashite","zh":"初次見面，你好","topic":"打招呼","example":"はじめまして、台湾から来ました。","example_zh":"初次見面，我從台灣來的。","note":"第一次見面時的開場白，後面通常接自我介紹。","distractors_zh":["我是第一次來","那麼，我們開始吧","歡迎光臨，請進"]},{"text":"よろしくお願いします","reading":"よろしくおねがいします yoroshiku onegaishimasu","zh":"請多多指教","topic":"打招呼","example":"リンです。よろしくお願いします。","example_zh":"我姓林，請多多指教。","note":"自我介紹結尾必說的一句；對朋友可以簡化成「よろしく」。","distractors_zh":["拜託幫幫我","請多保重","幸會幸會"]},{"text":"お久しぶりです","reading":"おひさしぶりです ohisashiburi desu","zh":"好久不見","topic":"打招呼","example":"お久しぶりです。元気でしたか。","example_zh":"好久不見，你過得好嗎？","note":"久別重逢時用；對朋友可以說常體的「久しぶり！」。","distractors_zh":["初次見面","等你很久了","後會有期"]},{"text":"お元気ですか","reading":"おげんきですか ogenki desu ka","zh":"你好嗎？","topic":"打招呼","example":"","example_zh":"","note":"多用於久未見面或書信問候；日本人日常見面較少這樣問。","distractors_zh":["你病好了嗎？","振作點好嗎？","你有空嗎？"]},{"text":"おかげさまで元気です","reading":"おかげさまでげんきです okagesama de genki desu","zh":"託您的福，我很好","topic":"打招呼","example":"","example_zh":"","note":"回應「お元気ですか」的客氣說法，展現日式的謙虛與感謝。","distractors_zh":["彼此彼此，你也好嗎？","多虧你幫忙，得救了","老樣子，馬馬虎虎啦"]},{"text":"じゃあ、またね","reading":"じゃあ、またね jaa, mata ne","zh":"那，再見囉","topic":"打招呼","example":"","example_zh":"","note":"常體，朋友之間道別用；對長輩或上司改說「失礼します」較妥。","distractors_zh":["那麼，明天見囉","好，就這麼說定了","之後再說吧"]},{"text":"また明日","reading":"またあした mata ashita","zh":"明天見","topic":"打招呼","example":"","example_zh":"","note":"常體說法，同學、同事、朋友間道別常用。","distractors_zh":["又是明天啊","後天見","改天見囉"]},{"text":"おやすみなさい","reading":"おやすみなさい oyasuminasai","zh":"晚安（睡前）","topic":"打招呼","example":"","example_zh":"","note":"睡前或深夜道別用；朋友間可以只說「おやすみ」。","distractors_zh":["晚安（晚上見面問候）","請好好休息一下","請放假休息吧"]},{"text":"さようなら","reading":"さようなら sayounara","zh":"再見","topic":"打招呼","example": :"特殊唸法 kyou；「今日は暇です」＝我今天有空。","distractors_zh":["現在、目前","今年","這幾天"]},{"text":"明日","reading":"あした ashita","zh":"明天","topic":"數字時間","example":"","example_zh":"","note":"口語唸「あした」，較正式的場合唸「あす」。","distractors_zh":["明年","後天","天亮、清晨"]},{"text":"昨日","reading":"きのう kinou","zh":"昨天","topic":"數字時間","example":"","example_zh":"","note":"特殊唸法 kinou；搭配動詞過去形「ました」使用。","distractors_zh":["去年","前天","之前、以前"]},{"text":"月曜日","reading":"げつようび getsuyoubi","zh":"星期一","topic":"數字時間","example":"","example_zh":"","note":"星期依序：月・火・水・木・金・土・日曜日，約時間必背。","distractors_zh":["每月一號","星期日","一個月"]},{"text":"誕生日はいつですか","reading":"たんじょうびはいつですか tanjoubi wa itsu desu ka","zh":"你生日是什麼時候？","topic":"數字時間","example":"","example_zh":"","note":"聊生日、星座是日本年輕人常見話題；「いつ」＝什麼時候。","distractors_zh":["你是哪一年出生的？","你生日想要什麼？","生日派對是什麼時候？"]},{"text":"何歳ですか","reading":"なんさいですか nansai desu ka","zh":"你幾歲？","topic":"數字時間","example":"","example_zh":"","note":"問年齡在日本較敏感，熟了再問比較好；更客氣的說法是「おいくつですか」。","distractors_zh":["你幾年級？","你屬什麼生肖？","你哪一年出生的？"]},{"text":"すみません","reading":"すみません sumimasen","zh":"不好意思／抱歉／謝謝","topic":"求助應急","example":"","example_zh":"","note":"叫住店員、問路、道歉、道謝都可用，是日本生活最高頻的一個詞。","distractors_zh":["沒關係／不要緊","不客氣（回應道謝時）","萬分抱歉（鄭重道歉）"]},{"text":"助けてください","reading":"たすけてください tasukete kudasai","zh":"請幫幫我／救命","topic":"求助應急","example":"","example_zh":"","note":"緊急狀況求助用；一般請人幫小忙說「手伝ってもらえますか」即可。","distractors_zh":["請幫我一個小忙","饒了我吧","請告訴我該怎麼辦"]},{"text":"道に迷いました","reading":"みちにまよいました michi ni mayoimashita","zh":"我迷路了","topic":"求助應急","example":"すみません、道に迷いました。駅はどこですか。","example_zh":"不好意思，我迷路了，請問車站在哪裡？","note":"問路開場白；日本人多半會熱心指路甚至帶你走一段。","distractors_zh":["我很猶豫、拿不定主意","我給人添麻煩了","我走錯路了"]},{"text":"駅はどこですか","reading":"えきはどこですか eki wa doko desu ka","zh":"車站在哪裡？","topic":"求助應急","example":"","example_zh":"","note":"「〜はどこですか」是問地點的萬用句型。","distractors_zh":["公車站牌在哪裡？","這裡是哪一站？","車站的出口在哪裡？"]},{"text":"トイレはどこですか","reading":"トイレはどこですか toire wa doko desu ka","zh":"廁所在哪裡？","topic":"求助應急","example":"","example_zh":"","note":"商店、車站都能用；更客氣可說「お手洗いはどこですか」。","distractors_zh":["浴室在哪裡？","可以借用一下廁所嗎？","廁所現在有人嗎？"]},{"text":"もう一度お願いします","reading":"もういちどおねがいします mou ichido onegaishimasu","zh":"請再說一次","topic":"求助應急","example":"","example_zh":"","note":"聽不清楚時用，比只說「え？」有禮貌得多。","distractors_zh":["請再給我一個","請再等我一下","麻煩你了（拜託）"]},{"text":"ゆっくり話してください","reading":"ゆっくりはなしてください yukkuri hanashite kudasai","zh":"請說慢一點","topic":"求助應急","example":"","example_zh":"","note":"初學者保命句；可加「すみません」開頭更客氣。","distractors_zh":["請慢慢來，不用急","請好好休息","請大聲一點說"]},{"text":"日本語がわかりません","reading":"にほんごがわかりません nihongo ga wakarimasen","zh":"我聽不懂日文","topic":"求助應急","example":"","example_zh":"","note":"可改說「少しだけわかります（我只懂一點點）」，對方會放慢速度。","distractors_zh":["我不會說日文","我聽不清楚","我沒學過日文"]},{"text":"英語を話せますか","reading":"えいごをはなせますか eigo o hanasemasu ka","zh":"你會說英文嗎？","topic":"求助應急","example":"","example_zh":"","note":"「話せます」是「話す」的可能形，表示會說。","distractors_zh":["請用英文說","你聽得懂英文嗎？","我可以說英文嗎？"]},{"text":"財布をなくしました","reading":"さいふをなくしました saifu o nakushimashita","zh":"我的錢包不見了","topic":"求助應急","example":"","example_zh":"","note":"遺失物品可到「交番（派出所）」求助，日本失物找回率很高。","distractors_zh":["我的錢包被偷了","我把錢包忘在家裡了","我身上沒錢了"]},{"text":"気分が悪いです","reading":"きぶんがわるいです kibun ga warui desu","zh":"我不太舒服","topic":"求助應急","example":"","example_zh":"","note":"身體不適時說；「具合が悪いです」也通用。","distractors_zh":["我心情很差","我感冒了","這裡空氣不好"]},{"text":"病院に行きたいです","reading":"びょういんにいきたいです byouin ni ikitai desu","zh":"我想去醫院","topic":"求助應急","example":"","example_zh":"","note":"「〜たいです」表示想做某事；情況緊急可請人叫救護車（救急車）。","distractors_zh":["請帶我去醫院","我必須去醫院","我想去藥局買藥"]},{"text":"警察を呼んでください","reading":"けいさつをよんでください keisatsu o yonde kudasai","zh":"請幫我叫警察","topic":"求助應急","example":"","example_zh":"","note":"日本報警電話是110，救護車與消防是119，跟台灣不同要記清楚。","distractors_zh":["請幫我叫救護車","請問派出所在哪裡？","請把警察的電話告訴我"]},{"text":"写真を撮ってもらえますか","reading":"しゃしんをとってもらえますか shashin o totte moraemasu ka","zh":"可以幫我拍照嗎？","topic":"求助應急","example":"","example_zh":"","note":"「〜てもらえますか」是請求協助的客氣句型，旅遊必備。","distractors_zh":["我可以幫你拍照嗎？","我可以在這裡拍照嗎？","可以給我這張照片嗎？"]},{"text":"Wi-Fiはありますか","reading":"ワイファイはありますか waifai wa arimasu ka","zh":"有 Wi-Fi 嗎？","topic":"求助應急","example":"","example_zh":"","note":"「〜はありますか」用來詢問有無某物；咖啡廳、飯店都用得到。","distractors_zh":["Wi-Fi 密碼是多少？","Wi-Fi 是免費的嗎？","Wi-Fi 連不上了"]}],"grammar":[{"question":"わたし＿学生です。","options":["は","が","を","に"],"answer":0,"explain_zh":"「は」是主題助詞，標示句子的主題「我」，整句意思是「我是學生」。「が」用於強調或新資訊的主語，「を」標示動作對象，「に」表示時間或方向，都不適合這裡的自我介紹句。注意「は」當助詞時唸 wa。"},{"question":"毎日りんご＿食べます。","options":["は","が","を","で"],"answer":2,"explain_zh":"「を」標示他動詞的受詞（動作對象），「りんごを食べます」＝吃蘋果。「は」是主題、「が」是主語、「で」表示地點或手段，都不能標示「吃」的對象。"},{"question":"明日、学校＿行きます。","options":["を","に","で","は"],"answer":1,"explain_zh":"移動動詞「行きます」的目的地用「に」（或「へ」）標示，「学校に行きます」＝去學校。「で」表示動作進行的地點（在某處做某事），不用於單純的移動目的地。"},{"question":"図書館＿勉強します。","options":["に","を","で","が"],"answer":2,"explain_zh":"「で」表示動作發生的場所，「図書館で勉強します」＝在圖書館唸書。「に」表示存在或到達的地點（例：図書館にいます），但「唸書」是動作，動作發生地要用「で」。"},{"question":"これは何です＿。","options":["ね","よ","か","わ"],"answer":2,"explain_zh":"「か」放在句尾把直述句變成疑問句，「これは何ですか」＝這是什麼？日文疑問句不一定要問號，加「か」即可。「ね」表示尋求同意，「よ」表示提醒告知，都不是疑問。"},{"question":"＿は私の本です。（東西在自己手上）","options":["これ","それ","あれ","どれ"],"answer":0,"explain_zh":"こ／そ／あ／ど系統：「これ」指離說話者近的東西，東西在自己手上當然用「これ」。「それ」指離聽話者近、「あれ」指離兩人都遠、「どれ」是疑問詞「哪一個」。"},{"question":"「あなたの傘はどれですか。」句中「どれ」的意思是？","options":["這個","那個","哪一個","那裡"],"answer":2,"explain_zh":"「どれ」是「ど」系疑問詞，意思是「（三個以上之中的）哪一個」，整句＝「你的傘是哪一把？」。「這個」是これ、「那個」是それ／あれ、「那裡」是そこ／あそこ。"},{"question":"私は猫＿好きです。","options":["を","が","で","へ"],"answer":1,"explain_zh":"「好き（喜歡）」是な形容詞，喜歡的對象用「が」標示：「猫が好きです」＝我喜歡貓。中文的「喜歡」是動詞所以容易想用「を」，這是台灣學習者最常見的錯誤之一，要特別記住「が好き」。"},{"question":"毎朝コーヒーを飲み＿。（表示每天的習慣）","options":["ます","ました","ません","ましょう"],"answer":0,"explain_zh":"「ます」是動詞的禮貌體現在形，表示現在的習慣或未來的動作，「毎朝飲みます」＝每天早上都喝。「ました」是過去、「ません」是否定、「ましょう」是「一起～吧」的提議，都不符合表達習慣的語意。"},{"question":"昨日、映画を見＿。","options":["ます","ました","ません","ましょう"],"answer":1,"explain_zh":"句首有「昨日（昨天）」，是過去的事，動詞要用過去禮貌形「ました」：「昨日、映画を見ました」＝昨天看了電影。時間詞和動詞時態必須一致。"},{"question":"部屋に猫＿います。","options":["は","が","を","で"],"answer":1,"explain_zh":"存在句「（場所）に（物／人）が います・あります」中，存在的主體用「が」標示：「部屋に猫がいます」＝房間裡有貓。有生命用「います」、無生命用「あります」。"},{"question":"一緒に昼ご飯を食べ＿か。（邀約對方）","options":["ます","ません","ました","ましょう"],"answer":1,"explain_zh":"「〜ませんか」是客氣的邀約句型，字面是否定疑問「不～嗎？」，實際意思是「要不要一起～？」：「一緒に食べませんか」＝要不要一起吃？「ましょうか」也能用於提議，但空格後已有「か」，填「ましょう」會變成商量語氣，邀約別人時最自然的是「ませんか」。"},{"question":"バス＿学校に行きます。","options":["で","に","を","は"],"answer":0,"explain_zh":"「で」除了表示動作地點，也表示手段、工具，「バスで行きます」＝搭公車去。交通工具＋「で」是固定用法；「に」在本句已用於目的地「学校に」。"},{"question":"＿レストランはおいしいですか。（指離聽話者近的那間）","options":["この","その","あの","どの"],"answer":1,"explain_zh":"「その＋名詞」指離聽話者近（或剛才話題中提到）的事物，所以是「その レストラン」＝你那邊／你說的那間餐廳。「この」離說話者近、「あの」離兩人都遠、「どの」是「哪一間」。注意這組必須接名詞，不能單獨使用。"},{"question":"私は日本人＿ありません。","options":["では","には","とは","へは"],"answer":0,"explain_zh":"「です」的禮貌否定形是「ではありません」：「日本人ではありません」＝我不是日本人。口語常說「じゃありません」或「じゃないです」。其他選項無法構成「です」的否定形。"}],"lessons":[{"id":"jp-01","title":"日文文字系統","subtitle":"三種文字一次看懂，還有你的漢字優勢","minutes":5,"sections":[{"type":"text","body":"歡迎來到日文的世界！先別急著背五十音，我們先搞清楚一件事：日文的一句話裡，其實同時混用了【三種文字】。看看這句：「私はアニメが好きです」（我喜歡動畫）——「私」「好」是漢字，「は」「が」「です」是平假名，「アニメ」是片假名。三種文字不是互相取代，而是像一個團隊各司其職。"},{"type":"table","title":"三種文字的分工","headers":["文字","長相","負責的工作","例子"],"rows":[["平假名","圓圓軟軟","文法骨架：助詞、語尾變化、日本原有的字","は、です、ありがとう"],["片假名","方方直直","外來語、外國人名地名、強調","アニメ、ラーメン、カラオケ"],["漢字","你早就認識","表達主要意思：名詞、動詞的核心","私、台湾、勉強"]]},{"type":"text","body":"身為台灣人，你已經「免費」認識兩千多個漢字——日本學生要學到高中才學完的東西，你入學第一天就會了。看日文文章常常能猜出五六成意思，這是超大的優勢。但小心！【有些漢字在日文裡的意思跟中文完全不一樣】，直接用中文腦去讀會鬧笑話。下面這幾個是最經典的陷阱。"},{"type":"sounds","title":"點擊聽發音：台灣人最容易誤會的漢字","items":[{"text":"勉強","sub":"べんきょう benkyou","zh":"唸書、學習（不是「勉強接受」的勉強！）"},{"text":"手紙","sub":"てがみ tegami","zh":"信（不是衛生紙！）"},{"text":"大丈夫","sub":"だいじょうぶ daijoubu","zh":"沒問題、不要緊（不是男子漢！）"},{"text":"娘","sub":"むすめ musume","zh":"女兒（不是媽媽！）"},{"text":"新聞","sub":"しんぶん shinbun","zh":"報紙（不是電視新聞！）"}]},{"type":"tip","body":"看到漢字先開心，再查一下發音和意思。把日文漢字當成「長得像的遠房親戚」，不要當成同一個人——長相熟悉，脾氣可能完全不同。"},{"type":"quiz","title":"小試身手","questions":[{"question":"日文句子裡負責「助詞、語尾變化」等文法工作的文字是？","options":["平假名","片假名","漢字","羅馬字"],"answer":0,"explain_zh":"平假名是日文的文法骨架，像「は」「です」這些助詞和句尾都是平假名。片假名管外來語，漢字管主要意思。"},{"question":"「アニメ」「ラーメン」這種線條方方直直的文字是？","options":["漢字","平假名","片假名","注音符號"],"answer":2,"explain_zh":"片假名的筆畫方正直硬，專門用來寫外來語和外國名字。平假名則是圓圓軟軟的。"},{"question":"日文的「勉強」是什麼意思？","options":["勉強、將就","唸書、學習","強迫別人","加油打氣"],"answer":1,"explain_zh":"「勉強（べんきょう）」在日文是「唸書、學習」。「日本語を勉強しています」＝我正在學日文，完全沒有中文「將就」的意思。"},{"question":"日本朋友說要寄「手紙」給你，他要寄的是？","options":["衛生紙","紙鈔","信","名片"],"answer":2,"explain_zh":"「手紙（てがみ）」是信。這是最經典的中日漢字陷阱之一，在日本跟人要「手紙」對方會拿信紙給你，不是衛生紙。"}]}]},{"id":"jp-02","title":"五十音的結構","subtitle":"行與段的地圖：背的是規律，不是 46 個隨機符號","minutes":5,"sections":[{"type":"text","body":"五十音聽起來很嚇人：「天啊，要背 46 個符號！」其實完全不是這樣。五十音是一張【超有規律的地圖】：橫向叫【行】，每一行共用同一個子音（か行全部 k 開頭）；縱向叫【段】，每一段共用同一個母音（あ段全部以 a 結尾）。先看地圖，再認字，事半功倍。"},{"type":"table","title":"平假名五十音地圖","headers":["行＼段","a","i","u","e","o"],"rows":[["あ行（母音）","あ","い","う","え","お"],["か行（k）","か","き","く","け","こ"],["さ行（s）","さ","し","す","せ","そ"],["た行（t）","た","ち","つ","て","と"],["な行（n）","な","に","ぬ","ね","の"],["は行（h）","は","ひ","ふ","へ","ほ"],["ま行（m）","ま","み","む","め","も"],["や行（y）","や","―","ゆ","―","よ"],["ら行（r）","ら","り","る","れ","ろ"],["わ行（w）","わ","―","―","―","を"],["撥音（鼻音）","ん","―","―","―","―"]]},{"type":"text","body":"所以你真正要背的是：【5 個母音＋每行一個子音】。子音 k 配上母音 a、i、u、e、o，就自動生出かきくけこ；換成 s 就是さしすせそ。少數幾個字（し、ち、つ、ふ）發音有點特別，之後遇到再圈起來就好。順帶一提，表格裡 a、i、u、e、o 這種【用英文字母標注日文發音】的寫法叫「羅馬拼音」，本課程採用全世界最通行的 Hepburn（黑本式）拼音，之後每個單字都會附上。這張地圖以後查字典、打字、學動詞變化全都用得到，是整個日文的骨架。"},{"type":"sounds","title":"點擊聽發音：一切的基礎——五個母音","items":[{"text":"あ","sub":"a（嘴巴自然張開，像注音的「ㄚ」）","zh":""},{"text":"い","sub":"i（嘴角往兩邊，像「一」）","zh":""},{"text":"う","sub":"u（嘴唇放鬆，不用嘟太圓）","zh":""},{"text":"え","sub":"e（像注音的「ㄝ」）","zh":""},{"text":"お","sub":"o（像注音的「ㄛ」）","zh":""}]},{"type":"tip","body":"背五十音永遠【一行一行背】：かきくけこ、さしすせそ……像唱歌一樣有節奏。不要跳著背，「行與段」的位置感之後學文法還會一直用到。"},{"type":"quiz","title":"小試身手","questions":[{"question":"「か行」的五個假名（かきくけこ）共用什麼？","options":["同一個母音","同一個子音 k","同樣的筆畫數","同樣的聲調"],"answer":1,"explain_zh":"「行」是子音家族：か行全部以子音 k 開頭，再分別配上母音 a、i、u、e、o。母音相同的家族叫「段」。"},{"question":"「あ段」是所有母音為 a 的假名，下面哪一個屬於あ段？","options":["か","き","く","け"],"answer":0,"explain_zh":"か＝ka，母音是 a，所以屬於あ段。き（ki）在い段、く（ku）在う段、け（ke）在え段。"},{"question":"背五十音時，真正的核心是？","options":["46 個毫無關聯的符號","5 個母音＋每行的子音規律","全部漢字的讀音","英文字母對照表"],"answer":1,"explain_zh":"五十音是「子音 × 母音」的組合地圖。抓住 5 個母音和每行的子音，46 個假名就是規律的排列，不是隨機符號。"},{"question":"子音 s 遇到母音 a，會組成哪個假名？","options":["さ","し","す","せ"],"answer":0,"explain_zh":"s＋a＝sa＝さ。し是 shi（い段）、す是 su（う段）、せ是 se（え段）。"}]}]},{"id":"jp-03","title":"あ〜な行：前 25 個假名","subtitle":"用形狀聯想記字，一次拿下半張地圖","minutes":8,"sections":[{"type":"text","body":"今天正式開始認字！我們一口氣拿下前五行：あ、か、さ、た、な，共 25 個假名——超過一半了。記形狀最好的方法是【聯想】：平假名多半是從漢字草書簡化來的，用「它長得像什麼」來記，比死背快十倍。下面的小抄挑幾個最好記的給你。"},{"type":"table","title":"形狀聯想小抄","headers":["假名","羅馬拼音","聯想"],"rows":[["あ","a","從漢字「安」變來，仔細看中間藏著一個「女」"],["い","i","從「以」變來，就是「以」的左半邊兩筆"],["う","u","從「宇」變來，像「宇」的上面兩筆"],["か","ka","從「加」變來，右上那一點是「加」的口"],["き","ki","像一把鑰匙（key），發音剛好也是 ki"],["さ","sa","長得像き少一橫，唸 sa"],["し","shi","一根釣魚線垂下來，甩竿「咻」（shi）"],["つ","tsu","像一道小海浪，浪打過來「tsu〜」"],["な","na","從「奈」變來，左上還留著「奈」的影子"]]},{"type":"sounds","title":"點擊聽發音：あ行・か行","items":[{"text":"あ","sub":"a","zh":""},{"text":"い","sub":"i","zh":""},{"text":"う","sub":"u","zh":""},{"text":"え","sub":"e","zh":""},{"text":"お","sub":"o","zh":""},{"text":"か","sub":"ka","zh":""},{"text":"き","sub":"ki","zh":""},{"text":"く","sub":"ku","zh":""},{"text":"け","sub":"ke","zh":""},{"text":"こ","sub":"ko","zh":""}]},{"type":"sounds","title":"點擊聽發音：さ行・た行（注意三個例外！）","items":[{"text":"さ","sub":"sa","zh":""},{"text":"し","sub":"shi（例外！不是 si）","zh":""},{"text":"す","sub":"su","zh":""},{"text":"せ","sub":"se","zh":""},{"text":"そ","sub":"so","zh":""},{"text":"た","sub":"ta","zh":""},{"text":"ち","sub":"chi（例外！不是 ti）","zh":""},{"text":"つ","sub":"tsu（例外！不是 tu）","zh":""},{"text":"て","sub":"te","zh":""},{"text":"と","sub":"to","zh":""}]},{"type":"tip","body":"た行有兩個叛徒：ち唸 chi、つ唸 tsu，不是 ti、tu；加上さ行的し（shi），這三個是五十音最重要的例外，現在就把它們圈起來。"},{"type":"sounds","title":"點擊聽發音：な行＋你已經看得懂的單字","items":[{"text":"な","sub":"na","zh":""},{"text":"に","sub":"ni","zh":""},{"text":"ぬ","sub":"nu","zh":""},{"text":"ね","sub":"ne","zh":""},{"text":"の
