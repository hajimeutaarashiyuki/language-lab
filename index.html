le_zh":"週末要不要一起去逛街？","note":"「名詞＋に行く」＝去做某事；買い物＝購物。","level":"N5"},{"text":"カフェでお茶しませんか","reading":"カフェでおちゃしませんか kafe de ocha shimasen ka","zh":"要不要去咖啡廳喝個茶？","topic":"邀約出遊","example":"疲れましたね。カフェでお茶しませんか。","example_zh":"有點累了呢，要不要去咖啡廳坐坐？","note":"「お茶する」＝去咖啡廳坐坐聊天，不一定真的喝茶。","level":"N5"},{"text":"海に行きたいです","reading":"うみにいきたいです umi ni ikitai desu","zh":"我想去海邊","topic":"邀約出遊","example":"今年の夏、海に行きたいです。","example_zh":"今年夏天我想去海邊。","note":"「動詞ます形去ます＋たい」＝想做…；行きます→行きたい。","level":"N5"},{"text":"温泉に行きたいです","reading":"おんせんにいきたいです onsen ni ikitai desu","zh":"我想去泡溫泉","topic":"邀約出遊","example":"日本で温泉に行きたいです。","example_zh":"我想在日本去泡溫泉。","note":"溫泉是日本人最愛的話題之一，聊旅行計畫必備。","level":"N5"},{"text":"うちに来ませんか","reading":"うちにきませんか uchi ni kimasen ka","zh":"要不要來我家？","topic":"邀約出遊","example":"今度、うちに来ませんか。","example_zh":"下次要不要來我家？","note":"「来る」的ます形是「来ます（きます）」；被邀去家裡是交情變好的訊號。","level":"N5"},{"text":"台湾に来てください","reading":"たいわんにきてください taiwan ni kite kudasai","zh":"請來台灣玩","topic":"邀約出遊","example":"今度、ぜひ台湾に来てください。案内します。","example_zh":"下次請一定要來台灣，我帶你逛。","note":"「来る」的て形是「来て（きて）」；「案内します」＝我帶路。","level":"N5"},{"text":"今、どこにいますか","reading":"いま、どこにいますか ima, doko ni imasu ka","zh":"你現在在哪裡？","topic":"邀約出遊","example":"もしもし、今、どこにいますか。","example_zh":"喂，你現在在哪裡？","note":"約見面找人必用；人用「います」，東西用「あります」。","level":"N5"},{"text":"もうすぐ着きます","reading":"もうすぐつきます mou sugu tsukimasu","zh":"我快到了","topic":"邀約出遊","example":"ごめん、もうすぐ着きます！","example_zh":"抱歉，我快到了！","note":"「着く」＝到達；快遲到時先傳這句。","level":"N5"},{"text":"何時に着きますか","reading":"なんじにつきますか nanji ni tsukimasu ka","zh":"你幾點會到？","topic":"邀約出遊","example":"A：何時に着きますか。 B：三時ごろです。","example_zh":"A：你幾點會到？ B：大概三點。","note":"「ごろ」＝大約…左右，接在時間後面。","level":"N5"},{"text":"何で行きますか","reading":"なにでいきますか nani de ikimasu ka","zh":"要怎麼去（搭什麼去）？","topic":"邀約出遊","example":"A：何で行きますか。 B：電車で行きましょう。","example_zh":"A：要搭什麼去？ B：搭電車去吧。","note":"「で」表示交通工具；口語也常唸「なんで」。","level":"N5"},{"text":"タクシーで行きましょう","reading":"タクシーでいきましょう takushii de ikimashou","zh":"我們搭計程車去吧","topic":"邀約出遊","example":"時間がありませんから、タクシーで行きましょう。","example_zh":"沒時間了，我們搭計程車去吧。","note":"「〜から」＝因為…；理由放前面是口語自然順序。","level":"N5"},{"text":"歩いて行きましょう","reading":"あるいていきましょう aruite ikimashou","zh":"我們走路去吧","topic":"邀約出遊","example":"近いですから、歩いて行きましょう。","example_zh":"很近，我們走路去吧。","note":"「歩いて」是「歩く」的て形，走路去不加「で」。","level":"N5"},{"text":"午後三時に会いましょう","reading":"ごごさんじにあいましょう gogo sanji ni aimashou","zh":"下午三點見吧","topic":"邀約出遊","example":"じゃあ、午後三時に駅で会いましょう。","example_zh":"那就下午三點在車站見吧。","note":"「会う」的ます形是「会います」；時間點用「に」。","level":"N5"},{"text":"天気がいいから、公園に行きませんか","reading":"てんきがいいから、こうえんにいきませんか tenki ga ii kara, kouen ni ikimasen ka","zh":"天氣很好，要不要去公園？","topic":"邀約出遊","example":"天気がいいから、公園に行きませんか。","example_zh":"天氣很好，要不要去公園走走？","note":"把理由和邀約接在一起，聽起來更自然。","level":"N5"},{"text":"今日は楽しかったです","reading":"きょうはたのしかったです kyou wa tanoshikatta desu","zh":"今天玩得很開心","topic":"邀約出遊","example":"今日は楽しかったです。ありがとうございました。","example_zh":"今天玩得很開心，謝謝你。","note":"聚會結束的定番句；い形容詞過去形：楽しい→楽しかった。","level":"N5"},{"text":"また遊びましょう","reading":"またあそびましょう mata asobimashou","zh":"下次再一起玩吧","topic":"邀約出遊","example":"また遊びましょうね。","example_zh":"下次再一起玩吧。","note":"「遊ぶ」的ます形是「遊びます」；道別時說表示還想再見面。","level":"N5"},{"text":"気をつけて帰ってください","reading":"きをつけてかえってください ki o tsukete kaette kudasai","zh":"回家路上小心","topic":"邀約出遊","example":"もう遅いですね。気をつけて帰ってください。","example_zh":"很晚了呢，回家路上小心。","note":"「帰る」的て形是「帰って」；聚會散場的溫柔收尾句。","level":"N5"},{"text":"映画は何時からですか","reading":"えいがはなんじからですか eiga wa nanji kara desu ka","zh":"電影幾點開始？","topic":"邀約出遊","example":"A：映画は何時からですか。 B：七時からです。","example_zh":"A：電影幾點開始？ B：七點開始。","note":"「〜から」＝從…開始；「〜まで」＝到…結束。","level":"N5"},{"text":"朝ごはんを食べましたか","reading":"あさごはんをたべましたか asagohan o tabemashita ka","zh":"你吃早餐了嗎？","topic":"吃飯聊天","example":"A：朝ごはんを食べましたか。 B：いいえ、まだです。","example_zh":"A：你吃早餐了嗎？ B：還沒。","note":"「食べました」是「食べます」的過去形；「まだです」＝還沒。","level":"N5"},{"text":"昼ごはん","reading":"ひるごはん hirugohan","zh":"午餐","topic":"吃飯聊天","example":"昼ごはん、一緒にどうですか。","example_zh":"午餐要不要一起吃？","note":"更口語的說法是「ランチ」。","level":"N5"},{"text":"晩ごはん","reading":"ばんごはん bangohan","zh":"晚餐","topic":"吃飯聊天","example":"今日の晩ごはんは何ですか。","example_zh":"今天晚餐吃什麼？","note":"也說「夕飯（ゆうはん）」；宵夜是「夜食（やしょく）」。","level":"N5"},{"text":"ご飯","reading":"ごはん gohan","zh":"飯、一餐","topic":"吃飯聊天","example":"今度、一緒にご飯を食べましょう。","example_zh":"下次一起吃個飯吧。","note":"可指白飯，也泛指「吃飯」；朋友間常說「ご飯行こう」。","level":"N5"},{"text":"水","reading":"みず mizu","zh":"水","topic":"吃飯聊天","example":"すみません、お水をください。","example_zh":"不好意思，請給我水。","note":"餐廳要水說「お水をください」，日本餐廳冰水免費；熱水是「お湯」。","level":"N5"},{"text":"お茶","reading":"おちゃ ocha","zh":"茶","topic":"吃飯聊天","example":"温かいお茶をください。","example_zh":"請給我熱茶。","note":"日本的「お茶」通常指綠茶，而且大多是無糖的。","level":"N5"},{"text":"ビール","reading":"ビール biiru","zh":"啤酒","topic":"吃飯聊天","example":"とりあえずビールをお願いします。","example_zh":"先來杯啤酒。","note":"「とりあえずビール（總之先來啤酒）」是居酒屋開場定番。","level":"N5"},{"text":"肉","reading":"にく niku","zh":"肉","topic":"吃飯聊天","example":"肉と魚、どちらが好きですか。","example_zh":"肉和魚你比較喜歡哪個？","note":"牛肉＝牛肉（ぎゅうにく）、豬肉＝豚肉（ぶたにく）、雞肉＝鶏肉（とりにく）。","level":"N5"},{"text":"魚","reading":"さかな sakana","zh":"魚","topic":"吃飯聊天","example":"魚はあまり食べません。","example_zh":"我不太吃魚。","note":"「あまり＋否定」＝不太…；點餐聊口味常用。","level":"N5"},{"text":"野菜","reading":"やさい yasai","zh":"蔬菜","topic":"吃飯聊天","example":"野菜をもっと食べてください。","example_zh":"你要多吃點蔬菜。","note":"「もっと」＝更多；「食べて」是「食べる」的て形。","level":"N5"},{"text":"卵","reading":"たまご tamago","zh":"蛋","topic":"吃飯聊天","example":"卵アレルギーがあります。","example_zh":"我對蛋過敏。","note":"「〜アレルギーがあります」點餐保命句，把卵換成其他食材即可。","level":"N5"},{"text":"パン","reading":"パン pan","zh":"麵包","topic":"吃飯聊天","example":"朝はいつもパンを食べます。","example_zh":"我早上都吃麵包。","note":"來自葡萄牙語的外來語；「いつも」＝總是。","level":"N5"},{"text":"果物","reading":"くだもの kudamono","zh":"水果","topic":"吃飯聊天","example":"台湾の果物は安くておいしいですよ。","example_zh":"台灣的水果又便宜又好吃喔。","note":"「安くて」是い形容詞て形，用來連接兩個形容詞。","level":"N5"},{"text":"寿司","reading":"すし sushi","zh":"壽司","topic":"吃飯聊天","example":"お寿司を食べに行きませんか。","example_zh":"要不要去吃壽司？","note":"常加「お」說「お寿司」；迴轉壽司是「回転寿司」。","level":"N5"},{"text":"甘いです","reading":"あまいです amai desu","zh":"很甜","topic":"吃飯聊天","example":"このケーキ、甘くておいしいです。","example_zh":"這蛋糕又甜又好吃。","note":"い形容詞；否定是「甘くないです」。","level":"N5"},{"text":"ちょっと辛いです","reading":"ちょっとからいです chotto karai desu","zh":"有點辣","topic":"吃飯聊天","example":"これ、ちょっと辛いですよ。大丈夫ですか。","example_zh":"這個有點辣喔，你可以嗎？","note":"「ちょっと」放形容詞前＝有點…，語氣比較緩和。","level":"N5"},{"text":"熱いですから、気をつけてください","reading":"あついですから、きをつけてください atsui desu kara, ki o tsukete kudasai","zh":"很燙，請小心","topic":"吃飯聊天","example":"このスープ、熱いですから、気をつけてください。","example_zh":"這個湯很燙，請小心。","note":"「熱い」指東西燙，「暑い」指天氣熱，發音相同、漢字不同。","level":"N5"},{"text":"冷たい飲み物はありますか","reading":"つめたいのみものはありますか tsumetai nomimono wa arimasu ka","zh":"有冰的飲料嗎？","topic":"吃飯聊天","example":"すみません、冷たい飲み物はありますか。","example_zh":"不好意思，有冰的飲料嗎？","note":"「冷たい」指東西冰涼，「寒い」指天氣冷。","level":"N5"},{"text":"お腹がいっぱいです","reading":"おなかがいっぱいです onaka ga ippai desu","zh":"我吃飽了","topic":"吃飯聊天","example":"もうお腹がいっぱいです。ごちそうさまでした。","example_zh":"我已經吃飽了，謝謝招待。","note":"婉拒再添菜的好用句；朋友間說「お腹いっぱい」。","level":"N5"},{"text":"のどが渇きました","reading":"のどがかわきました nodo ga kawakimashita","zh":"我口渴了","topic":"吃飯聊天","example":"のどが渇きました。何か飲みませんか。","example_zh":"我口渴了，要不要喝點什麼？","note":"口渴固定用「渇く」；朋友間常說「のど渇いた」。","level":"N5"},{"text":"メニューをお願いします","reading":"メニューをおねがいします menyuu o onegaishimasu","zh":"請給我菜單","topic":"吃飯聊天","example":"すみません、メニューをお願いします。","example_zh":"不好意思，請給我菜單。","note":"「〜をお願いします」是點餐、拜託事情的萬用句型。","level":"N5"},{"text":"これを二つください","reading":"これをふたつください kore o futatsu kudasai","zh":"這個請給我兩份","topic":"吃飯聊天","example":"すみません、これを二つください。","example_zh":"不好意思，這個請給我兩份。","note":"指著菜單說就通；一份是「一つ」。","level":"N5"},{"text":"持ち帰りでお願いします","reading":"もちかえりでおねがいします mochikaeri de onegaishimasu","zh":"我要外帶","topic":"吃飯聊天","example":"A：店内でお召し上がりですか。 B：持ち帰りでお願いします。","example_zh":"A：內用嗎？ B：外帶，麻煩了。","note":"速食店、飲料店必用；內用回答「店内で」。","level":"N5"},{"text":"おかわり","reading":"おかわり okawari","zh":"再來一碗／續杯","topic":"吃飯聊天","example":"すみません、ご飯のおかわりをください。","example_zh":"不好意思，請再給我一碗飯。","note":"白飯、飲料再來一份都叫「おかわり」；「おかわり自由」＝免費續。","level":"N5"},{"text":"まずい","reading":"まずい mazui","zh":"難吃","topic":"吃飯聊天","example":"昨日の店、ちょっとまずかったね。","example_zh":"昨天那家店有點難吃耶。","note":"語氣直接，在店裡別大聲說；「まずい」另外也有「糟糕了」的意思。","level":"N5"},{"text":"日本料理が好きですか","reading":"にほんりょうりがすきですか nihon ryouri ga suki desu ka","zh":"你喜歡日本料理嗎？","topic":"吃飯聊天","example":"A：日本料理が好きですか。 B：はい、大好きです。","example_zh":"A：你喜歡日本料理嗎？ B：喜歡，超喜歡的。","note":"「好き」的對象用「が」；反問台灣料理也是好話題。","level":"N5"},{"text":"何を飲みますか","reading":"なにをのみますか nani o nomimasu ka","zh":"你要喝什麼？","topic":"吃飯聊天","example":"A：何を飲みますか。 B：ビールにします。","example_zh":"A：你要喝什麼？ B：我要啤酒。","note":"「飲む」的ます形是「飲みます」；回答用「〜にします（我決定要…）」。","level":"N5"},{"text":"これ、食べてください","reading":"これ、たべてください kore, tabete kudasai","zh":"這個你吃吃看","topic":"吃飯聊天","example":"これ、おいしいですよ。食べてください。","example_zh":"這個很好吃喔，你吃吃看。","note":"「食べて」是「食べる」的て形；分食物給朋友時搭配「どうぞ」更客氣。","level":"N5"},{"text":"何か食べに行きましょう","reading":"なにかたべにいきましょう nanika tabe ni ikimashou","zh":"我們去吃點東西吧","topic":"吃飯聊天","example":"お腹がすきましたね。何か食べに行きましょう。","example_zh":"肚子餓了呢，我們去吃點東西吧。","note":"「ます形去ます＋に行く」＝去做某事；「何か」＝某個什麼。","level":"N5"},{"text":"店","reading":"みせ mise","zh":"店、店家","topic":"吃飯聊天","example":"あの店、安くておいしいですよ。","example_zh":"那家店又便宜又好吃喔。","note":"「〜屋」表示…店：ラーメン屋、パン屋。","level":"N5"},{"text":"歌が上手ですね","reading":"うたがじょうずですね uta ga jouzu desu ne","zh":"你唱歌真好聽","topic":"稱讚回應","example":"A：歌が上手ですね。 B：いえいえ、そんなことないです。","example_zh":"A：你唱歌真好聽。 B：沒有啦，才沒有。","note":"「上手」的對象用「が」；卡拉OK必用稱讚。","level":"N5"},{"text":"料理が上手ですね","reading":"りょうりがじょうずですね ryouri ga jouzu desu ne","zh":"你菜做得真好","topic":"稱讚回應","example":"A：料理が上手ですね。 B：ありがとうございます。","example_zh":"A：你菜做得真好。 B：謝謝。","note":"被請吃飯時說這句，主人會很開心。","level":"N5"},{"text":"すてきですね","reading":"すてきですね suteki desu ne","zh":"好棒／好有質感喔","topic":"稱讚回應","example":"そのかばん、すてきですね。","example_zh":"你那個包包好好看喔。","note":"稱讚物品、穿搭、氣質都通用，比「かわいい」更成熟的說法。","level":"N5"},{"text":"きれいですね","reading":"きれいですね kirei desu ne","zh":"好漂亮喔","topic":"稱讚回應","example":"この写真、きれいですね。","example_zh":"這張照片好漂亮喔。","note":"「きれい」是な形容詞：きれいな写真；也可指乾淨。","level":"N5"},{"text":"親切ですね","reading":"しんせつですね shinsetsu desu ne","zh":"你人真好／真親切","topic":"稱讚回應","example":"台湾の人は本当に親切ですね。","example_zh":"台灣人真的很親切呢。","note":"日本人常這樣稱讚台灣，可以回「そうですか、うれしいです」。","level":"N5"},{"text":"いいですね","reading":"いいですね ii desu ne","zh":"真好耶／不錯耶","topic":"稱讚回應","example":"A：週末、海に行きます。 B：いいですね！","example_zh":"A：我週末要去海邊。 B：真好耶！","note":"對方分享計畫或東西時的萬用回應，會話的潤滑劑。","level":"N5"},{"text":"よかったですね","reading":"よかったですね yokatta desu ne","zh":"太好了呢","topic":"稱讚回應","example":"A：試験に合格しました。 B：よかったですね！","example_zh":"A：我考試通過了。 B：太好了呢！","note":"替對方開心時用；「よかった」是「いい」的過去形。","level":"N5"},{"text":"頑張ってください","reading":"がんばってください ganbatte kudasai","zh":"加油","topic":"稱讚回應","example":"A：明日、日本語の試験があります。 B：頑張ってください！","example_zh":"A：我明天有日文考試。 B：加油！","note":"幫人打氣的定番；朋友間說「頑張って」或「頑張れ」。","level":"N5"},{"text":"どこで買いましたか","reading":"どこでかいましたか doko de kaimashita ka","zh":"你在哪裡買的？","topic":"稱讚回應","example":"そのかばん、かわいいですね。どこで買いましたか。","example_zh":"你那個包包好可愛喔，在哪裡買的？","note":"「買う」的過去形「買いました」；稱讚完接這句，話題自然延伸。","level":"N5"},{"text":"若いですね","reading":"わかいですね wakai desu ne","zh":"你好年輕喔","topic":"稱讚回應","example":"A：もう四十歳ですよ。 B：えー、若いですね！","example_zh":"A：我已經四十歲了喔。 B：咦，你好年輕喔！","note":"聽到對方年齡時的常見反應，帶著驚訝語氣說更自然。","level":"N5"},{"text":"毎日コーヒーを飲みます","reading":"まいにちコーヒーをのみます mainichi koohii o nomimasu","zh":"我每天喝咖啡","topic":"日常閒聊","example":"毎日コーヒーを飲みます。一日二杯ぐらいです。","example_zh":"我每天都喝咖啡，一天大概兩杯。","note":"「飲む」的ます形是「飲みます」；頻率詞放句首很自然。","level":"N5"},{"text":"よくユーチューブを見ます","reading":"よくユーチューブをみます yoku yuuchuubu o mimasu","zh":"我常看YouTube","topic":"日常閒聊","example":"暇な時、よくユーチューブを見ます。","example_zh":"有空的時候我常看YouTube。","note":"「見る」的ます形是「見ます」；「よく」＝常常。","level":"N5"},{"text":"音楽を聴きます","reading":"おんがくをききます ongaku o kikimasu","zh":"我聽音樂","topic":"日常閒聊","example":"電車の中でいつも音楽を聴きます。","example_zh":"我在電車上都聽音樂。","note":"「聴く」和「聞く」同音，聽音樂習慣用「聴く」。","level":"N5"},{"text":"七時に起きます","reading":"しちじにおきます shichiji ni okimasu","zh":"我七點起床","topic":"日常閒聊","example":"毎朝七時に起きます。","example_zh":"我每天早上七點起床。","note":"「起きる」的ます形是「起きます」；時間點後面加「に」。","level":"N5"},{"text":"十二時に寝ます","reading":"じゅうにじにねます juuniji ni nemasu","zh":"我十二點睡覺","topic":"日常閒聊","example":"いつも十二時ごろ寝ます。","example_zh":"我通常十二點左右睡。","note":"「寝る」的ます形是「寝ます」；「ごろ」＝大約。","level":"N5"},{"text":"週末は何をしますか","reading":"しゅうまつはなにをしますか shuumatsu wa nani o shimasu ka","zh":"你週末要做什麼？","topic":"日常閒聊","example":"A：週末は何をしますか。 B：家でゆっくりします。","example_zh":"A：你週末要做什麼？ B：在家耍廢休息。","note":"閒聊萬用開場；回答什麼都可以接。","level":"N5"},{"text":"家でゆっくりしました","reading":"いえでゆっくりしました ie de yukkuri shimashita","zh":"我在家耍廢休息","topic":"日常閒聊","example":"A：昨日、何をしましたか。 B：家でゆっくりしました。","example_zh":"A：你昨天做了什麼？ B：在家耍廢休息。","note":"「ゆっくりする」＝悠閒放鬆，回答週末話題的萬用句。","level":"N5"},{"text":"昨日、友達に会いました","reading":"きのう、ともだちにあいました kinou, tomodachi ni aimashita","zh":"我昨天跟朋友見面","topic":"日常閒聊","example":"昨日、友達に会って、映画を見ました。","example_zh":"我昨天跟朋友見面，一起看了電影。","note":"「会う」的對象用助詞「に」：友達に会う。","level":"N5"},{"text":"何を買いましたか","reading":"なにをかいましたか nani o kaimashita ka","zh":"你買了什麼？","topic":"日常閒聊","example":"A：デパートに行きました。 B：何を買いましたか。","example_zh":"A：我去了百貨公司。 B：買了什麼？","note":"「買う」的ます形是「買います」，過去形「買いました」。","level":"N5"},{"text":"犬を飼っています","reading":"いぬをかっています inu o katte imasu","zh":"我有養狗","topic":"日常閒聊","example":"犬を飼っています。名前はモモです。","example_zh":"我有養狗，名字叫桃桃。","note":"養寵物用「飼う」，持續狀態用「飼っています」。","level":"N5"},{"text":"電車で会社に行きます","reading":"でんしゃでかいしゃにいきます densha de kaisha ni ikimasu","zh":"我搭電車上班","topic":"日常閒聊","example":"毎日、電車で会社に行きます。","example_zh":"我每天搭電車去公司。","note":"交通工具用助詞「で」；目的地用「に」。","level":"N5"},{"text":"今日は晴れです","reading":"きょうははれです kyou wa hare desu","zh":"今天是晴天","topic":"日常閒聊","example":"今日は晴れですね。どこか行きませんか。","example_zh":"今天天氣真好，要不要出去走走？","note":"天氣名詞：晴れ、雨、曇り、雪。","level":"N5"},{"text":"明日は雨です","reading":"あしたはあめです ashita wa ame desu","zh":"明天會下雨","topic":"日常閒聊","example":"明日は雨ですよ。傘を忘れないでください。","example_zh":"明天會下雨喔，別忘了帶傘。","note":"「〜ないでください」＝請不要…。","level":"N5"},{"text":"曇りです","reading":"くもりです kumori desu","zh":"陰天","topic":"日常閒聊","example":"今日はずっと曇りです。","example_zh":"今天一整天都是陰天。","note":"「曇り」來自動詞「曇る」；「ずっと」＝一直。","level":"N5"},{"text":"雨が降っています","reading":"あめがふっています ame ga futte imasu","zh":"正在下雨","topic":"日常閒聊","example":"外は雨が降っていますよ。","example_zh":"外面正在下雨喔。","note":"下雨的動詞是「降る」；正在下用て形＋います。","level":"N5"},{"text":"雪","reading":"ゆき yuki","zh":"雪","topic":"日常閒聊","example":"台湾ではあまり雪が降りません。","example_zh":"台灣不太會下雪。","note":"「雪が降る」＝下雪；很多台灣人第一次看雪都在日本，是好話題。","level":"N5"},{"text":"風が強いですね","reading":"かぜがつよいですね kaze ga tsuyoi desu ne","zh":"風好大喔","topic":"日常閒聊","example":"今日は風が強いですね。","example_zh":"今天風好大喔。","note":"「風」和「風邪（感冒）」同音，都唸かぜ。","level":"N5"},{"text":"台風が来ます","reading":"たいふうがきます taifuu ga kimasu","zh":"颱風要來了","topic":"日常閒聊","example":"週末、台風が来ますよ。","example_zh":"週末颱風要來了喔。","note":"台日都有颱風，這個話題很有共鳴。","level":"N5"},{"text":"今日は暖かいですね","reading":"きょうはあたたかいですね kyou wa atatakai desu ne","zh":"今天很暖和呢","topic":"日常閒聊","example":"今日は暖かいですね。春ですね。","example_zh":"今天好暖和喔，春天到了呢。","note":"「暖かい」用於天氣；東西溫熱用「温かい」，同音。","level":"N5"},{"text":"涼しくなりましたね","reading":"すずしくなりましたね suzushiku narimashita ne","zh":"變涼了呢","topic":"日常閒聊","example":"最近、涼しくなりましたね。","example_zh":"最近變涼了呢。","note":"「い形容詞去い＋くなる」＝變得…；秋天寒暄定番。","level":"N5"},{"text":"蒸し暑いですね","reading":"むしあついですね mushiatsui desu ne","zh":"好悶熱喔","topic":"日常閒聊","example":"台湾の夏は本当に蒸し暑いですね。","example_zh":"台灣的夏天真的好悶熱喔。","note":"又濕又熱用「蒸し暑い」，形容台灣夏天最貼切。","level":"N5"},{"text":"明日の天気はどうですか","reading":"あしたのてんきはどうですか ashita no tenki wa dou desu ka","zh":"明天天氣怎麼樣？","topic":"日常閒聊","example":"明日の天気はどうですか。雨ですか。","example_zh":"明天天氣怎麼樣？會下雨嗎？","note":"出遊前一天的必問句；「どうですか」＝如何。","level":"N5"},{"text":"傘","reading":"かさ kasa","zh":"傘","topic":"日常閒聊","example":"傘を持っていますか。","example_zh":"你有帶傘嗎？","note":"「傘をさす」＝撐傘；便利商店的透明傘叫「ビニール傘」。","level":"N5"},{"text":"梅雨","reading":"つゆ tsuyu","zh":"梅雨","topic":"日常閒聊","example":"六月は梅雨で、毎日雨です。","example_zh":"六月是梅雨季，每天都下雨。","note":"特殊唸法「つゆ」；台日都有梅雨季，聊天氣好用。","level":"N5"},{"text":"高いですね","reading":"たかいですね takai desu ne","zh":"好貴喔","topic":"日常閒聊","example":"えっ、三千円？ちょっと高いですね。","example_zh":"咦，三千日圓？有點貴耶。","note":"「高い」＝貴，也指「高」；反義詞是「安い」。","level":"N5"},{"text":"安いですね","reading":"やすいですね yasui desu ne","zh":"好便宜喔","topic":"日常閒聊","example":"これ、百円？安いですね！","example_zh":"這個一百日圓？好便宜喔！","note":"逛街、逛夜市聊價錢必用。","level":"N5"},{"text":"大きいですね","reading":"おおきいですね ookii desu ne","zh":"好大喔","topic":"日常閒聊","example":"この犬、大きいですね！","example_zh":"這隻狗好大喔！","note":"反義詞是「小さい」。","level":"N5"},{"text":"新しいです","reading":"あたらしいです atarashii desu","zh":"是新的","topic":"日常閒聊","example":"この店は新しくてきれいです。","example_zh":"這家店又新又乾淨。","note":"「新しくて」是て形，用來連接兩個形容詞。","level":"N5"},{"text":"古いです","reading":"ふるいです furui desu","zh":"很舊","topic":"日常閒聊","example":"この店は古いですが、とても有名です。","example_zh":"這家店很老，但非常有名。","note":"「が」＝但是；「古い」不能用來形容人老。","level":"N5"},{"text":"難しいです","reading":"むずかしいです muzukashii desu","zh":"很難","topic":"日常閒聊","example":"漢字は難しいですが、面白いです。","example_zh":"漢字很難，但是很有趣。","note":"聊學日文的感想必用；反義詞是「簡単」「易しい」。","level":"N5"},{"text":"簡単です","reading":"かんたんです kantan desu","zh":"很簡單","topic":"日常閒聊","example":"この料理は簡単ですよ。すぐできます。","example_zh":"這道菜很簡單喔，馬上就能做好。","note":"「簡単」是な形容詞：簡単な料理。","level":"N5"},{"text":"楽しいです","reading":"たのしいです tanoshii desu","zh":"很開心、很好玩","topic":"日常閒聊","example":"日本語の勉強は楽しいです。","example_zh":"學日文很開心。","note":"過去形是「楽しかったです」。","level":"N5"},{"text":"今週は忙しいです","reading":"こんしゅうはいそがしいです konshuu wa isogashii desu","zh":"我這週很忙","topic":"日常閒聊","example":"すみません、今週は忙しいです。来週はどうですか。","example_zh":"不好意思，我這週很忙，下週怎麼樣？","note":"婉拒邀約時附上替代方案，就不會失禮。","level":"N5"},{"text":"遠いです","reading":"とおいです tooi desu","zh":"很遠","topic":"日常閒聊","example":"A：空港は近いですか。 B：いいえ、ちょっと遠いです。","example_zh":"A：機場近嗎？ B：不，有點遠。","note":"「ちょっと＋形容詞」＝有點…。","level":"N5"},{"text":"近いです","reading":"ちかいです chikai desu","zh":"很近","topic":"日常閒聊","example":"私の家は駅から近いです。","example_zh":"我家離車站很近。","note":"「〜から近い」＝離…很近。","level":"N5"},{"text":"早いですね","reading":"はやいですね hayai desu ne","zh":"好早喔／好快喔","topic":"日常閒聊","example":"もう終わりましたか。早いですね！","example_zh":"已經做完了？好快喔！","note":"「早い（時間早）」和「速い（速度快）」同音，口語常混用。","level":"N5"},{"text":"広いですね","reading":"ひろいですね hiroi desu ne","zh":"好寬敞喔","topic":"日常閒聊","example":"この部屋、広いですね。","example_zh":"這個房間好寬敞喔。","note":"空間大小用「広い／狭い」，不用「大きい／小さい」。","level":"N5"},{"text":"多いですね","reading":"おおいですね ooi desu ne","zh":"好多喔","topic":"日常閒聊","example":"今日は人が多いですね。","example_zh":"今天人好多喔。","note":"「人が多い」＝人很多；反義詞是「少ない」。","level":"N5"},{"text":"つまらなかったです","reading":"つまらなかったです tsumaranakatta desu","zh":"（當時）很無聊","topic":"日常閒聊","example":"昨日の映画、ちょっとつまらなかったです。","example_zh":"昨天那部電影有點無聊。","note":"「つまらない」的過去形；聊觀後感常用。","level":"N5"},{"text":"家","reading":"いえ ie","zh":"家","topic":"日常閒聊","example":"今日は一日家にいました。","example_zh":"我今天一整天都在家。","note":"口語也常唸「うち」；「家にいます」＝在家。","level":"N5"},{"text":"部屋","reading":"へや heya","zh":"房間","topic":"日常閒聊","example":"私の部屋は小さいですが、好きです。","example_zh":"我的房間雖然小，但我很喜歡。","note":"飯店房間也叫「部屋」。","level":"N5"},{"text":"学校","reading":"がっこう gakkou","zh":"學校","topic":"日常閒聊","example":"学校は九時から四時までです。","example_zh":"學校從九點到四點。","note":"「から〜まで」＝從…到…。","level":"N5"},{"text":"デパート","reading":"デパート depaato","zh":"百貨公司","topic":"日常閒聊","example":"週末、デパートで買い物しました。","example_zh":"我週末在百貨公司買了東西。","note":"動作發生的地點用「で」。","level":"N5"},{"text":"本屋","reading":"ほんや honya","zh":"書店","topic":"日常閒聊","example":"帰りに本屋に行きたいです。","example_zh":"回家路上想去一下書店。","note":"「〜屋」＝…店：パン屋、花屋、ラーメン屋。","level":"N5"},{"text":"公園","reading":"こうえん kouen","zh":"公園","topic":"日常閒聊","example":"朝、よく公園を散歩します。","example_zh":"我早上常去公園散步。","note":"「散歩する」＝散步；日本的公園是賞櫻勝地。","level":"N5"},{"text":"あとで連絡します","reading":"あとでれんらくします ato de renraku shimasu","zh":"我晚點聯絡你","topic":"網路聊天用語","example":"ごめん、今ちょっと忙しいです。あとで連絡します。","example_zh":"抱歉，我現在有點忙，晚點聯絡你。","note":"「連絡する」＝聯絡；朋友間說「あとで連絡するね」。","level":"N5"},{"text":"電話番号を教えてください","reading":"でんわばんごうをおしえてください denwa bangou o oshiete kudasai","zh":"請告訴我你的電話號碼","topic":"網路聊天用語","example":"よかったら、電話番号を教えてください。","example_zh":"方便的話，請告訴我你的電話號碼。","note":"「よかったら」＝方便的話，讓請求變委婉。","level":"N5"},{"text":"メッセージ","reading":"メッセージ messeeji","zh":"訊息","topic":"網路聊天用語","example":"メッセージ、ありがとう。","example_zh":"謝謝你的訊息。","note":"傳訊息＝「メッセージを送る」。","level":"N5"},{"text":"動画","reading":"どうが douga","zh":"影片","topic":"網路聊天用語","example":"この動画、面白いから見てください。","example_zh":"這支影片很好笑，你看一下。","note":"YouTube影片、短影音都叫「動画」。","level":"N5"},{"text":"グループ","reading":"グループ guruupu","zh":"群組","topic":"網路聊天用語","example":"クラスのLINEグループに入ってください。","example_zh":"請加入班上的LINE群組。","note":"「グループに入る」＝加入群組。","level":"N5"},{"text":"電話してもいいですか","reading":"でんわしてもいいですか denwa shite mo ii desu ka","zh":"我可以打電話給你嗎？","topic":"網路聊天用語","example":"今、電話してもいいですか。","example_zh":"現在可以打電話給你嗎？","note":"「てもいいですか」＝可以…嗎；打過去前先傳這句很有禮貌。","level":"N5"},{"text":"今、大丈夫ですか","reading":"いま、だいじょうぶですか ima, daijoubu desu ka","zh":"現在方便嗎？","topic":"網路聊天用語","example":"今、大丈夫ですか。ちょっと話したいです。","example_zh":"現在方便嗎？想跟你聊一下。","note":"打電話、傳訊息開頭的體貼用語。","level":"N5"},{"text":"場所を送ってください","reading":"ばしょをおくってください basho o okutte kudasai","zh":"把地點傳給我","topic":"網路聊天用語","example":"お店の場所を送ってください。","example_zh":"把店的位置傳給我。","note":"「送る」＝傳送；約見面時請對方傳地圖定位。","level":"N5"},{"text":"この写真、見てください","reading":"このしゃしん、みてください kono shashin, mite kudasai","zh":"你看這張照片","topic":"網路聊天用語","example":"この写真、見てください。昨日の夜市です。","example_zh":"你看這張照片，昨天的夜市。","note":"「見て」是「見る」的て形；分享照片的定番開場。","level":"N5"},{"text":"返事","reading":"へんじ henji","zh":"回覆","topic":"網路聊天用語","example":"返事、遅くなってごめんね。","example_zh":"抱歉這麼晚才回你。","note":"「返事」＝回覆、回應；回訊息、回信多說「返信」。","level":"N5"},{"text":"四","reading":"よん yon","zh":"四","topic":"數字時間","example":"家族は四人です。","example_zh":"我家有四個人。","note":"也唸「し」；四人唸「よにん」，四點唸「よじ」。","level":"N5"},{"text":"五","reading":"ご go","zh":"五","topic":"數字時間","example":"五時に駅で会いましょう。","example_zh":"五點在車站見吧。","note":"五點＝五時（ごじ）。","level":"N5"},{"text":"六","reading":"ろく roku","zh":"六","topic":"數字時間","example":"朝六時に起きます。","example_zh":"我早上六點起床。","note":"六百唸「ろっぴゃく」，音會變。","level":"N5"},{"text":"七","reading":"なな nana","zh":"七","topic":"數字時間","example":"七時はどうですか。","example_zh":"七點怎麼樣？","note":"也唸「しち」；七點唸「しちじ」，報數常用「なな」避免聽錯。","level":"N5"},{"text":"八","reading":"はち hachi","zh":"八","topic":"數字時間","example":"八時に店の前で会いましょう。","example_zh":"八點在店門口見吧。","note":"八百唸「はっぴゃく」，音會變。","level":"N5"},{"text":"九","reading":"きゅう kyuu","zh":"九","topic":"數字時間","example":"授業は九時からです。","example_zh":"課九點開始。","note":"也唸「く」；九點唸「くじ」。","level":"N5"},{"text":"一つ","reading":"ひとつ hitotsu","zh":"一個","topic":"數字時間","example":"これを一つください。","example_zh":"這個請給我一個。","note":"和語數法：一つ、二つ、三つ…點餐買東西超好用。","level":"N5"},{"text":"二つ","reading":"ふたつ futatsu","zh":"兩個","topic":"數字時間","example":"肉まんを二つください。","example_zh":"請給我兩個肉包。","note":"數東西不知道量詞時，用「〜つ」最保險。","level":"N5"},{"text":"二人です","reading":"ふたりです futari desu","zh":"兩位／兩個人","topic":"數字時間","example":"A：何名様ですか。 B：二人です。","example_zh":"A：請問幾位？ B：兩位。","note":"進餐廳店員會問人數；一個人是「一人（ひとり）」。","level":"N5"},{"text":"火曜日","reading":"かようび kayoubi","zh":"星期二","topic":"數字時間","example":"火曜日は暇ですか。","example_zh":"你星期二有空嗎？","note":"星期記法：月火水木金土日。","level":"N5"},{"text":"水曜日","reading":"すいようび suiyoubi","zh":"星期三","topic":"數字時間","example":"水曜日に映画を見に行きます。","example_zh":"我星期三要去看電影。","note":"具體的日子、星期後面用「に」。","level":"N5"},{"text":"木曜日","reading":"もくようび mokuyoubi","zh":"星期四","topic":"數字時間","example":"木曜日はちょっと忙しいです。","example_zh":"星期四我有點忙。","note":"喬時間時說「〜はちょっと…」婉轉表示不行。","level":"N5"},{"text":"金曜日","reading":"きんようび kinyoubi","zh":"星期五","topic":"數字時間","example":"金曜日の夜、飲みに行きませんか。","example_zh":"星期五晚上要不要去喝一杯？","note":"週五晚上是日本人聚餐定番時段；「飲みに行く」＝去喝一杯。","level":"N5"},{"text":"日曜日","reading":"にちようび nichiyoubi","zh":"星期日","topic":"數字時間","example":"日曜日は家族とご飯を食べます。","example_zh":"星期日我和家人一起吃飯。","note":"「と」＝和…一起。","level":"N5"},{"text":"今週","reading":"こんしゅう konshuu","zh":"這週","topic":"數字時間","example":"今週はずっと雨ですね。","example_zh":"這週一直在下雨呢。","note":"「ずっと」＝一直。","level":"N5"},{"text":"来週","reading":"らいしゅう raishuu","zh":"下週","topic":"數字時間","example":"来週、時間がありますか。","example_zh":"你下週有時間嗎？","note":"下下週是「再来週（さらいしゅう）」。","level":"N5"},{"text":"先週","reading":"せんしゅう senshuu","zh":"上週","topic":"數字時間","example":"先週、九份に行きました。","example_zh":"我上週去了九份。","note":"同系列：先月（上個月）、去年（去年）。","level":"N5"},{"text":"午前","reading":"ごぜん gozen","zh":"上午","topic":"數字時間","example":"午前中は授業があります。","example_zh":"我整個上午都有課。","note":"「午前中」＝整個上午；上午十點＝午前十時。","level":"N5"},{"text":"午後","reading":"ごご gogo","zh":"下午","topic":"數字時間","example":"午後は暇です。","example_zh":"我下午有空。","note":"下午三點＝午後三時。","level":"N5"},{"text":"毎日","reading":"まいにち mainichi","zh":"每天","topic":"數字時間","example":"毎日、日本語を勉強しています。","example_zh":"我每天都在學日文。","note":"同系列：毎朝（每天早上）、毎晩（每天晚上）、毎週（每週）。","level":"N5"},{"text":"何時から何時までですか","reading":"なんじからなんじまでですか nanji kara nanji made desu ka","zh":"從幾點到幾點？","topic":"數字時間","example":"すみません、お店は何時から何時までですか。","example_zh":"不好意思，請問店開到幾點？","note":"問營業時間的固定句型；「から〜まで」＝從…到…。","level":"N5"},{"text":"何分かかりますか","reading":"なんぷんかかりますか nanpun kakarimasu ka","zh":"要花幾分鐘？","topic":"數字時間","example":"駅まで何分かかりますか。","example_zh":"到車站要花幾分鐘？","note":"「かかる」＝花費（時間、錢）；「〜まで」＝到…為止。","level":"N5"},{"text":"何時に起きますか","reading":"なんじにおきますか nanji ni okimasu ka","zh":"你幾點起床？","topic":"數字時間","example":"A：毎朝何時に起きますか。 B：七時ごろです。","example_zh":"A：你每天早上幾點起床？ B：七點左右。","note":"生活作息話題常用；回答加「ごろ」表示大約。","level":"N5"},{"text":"コンビニはどこですか","reading":"コンビニはどこですか konbini wa doko desu ka","zh":"便利商店在哪裡？","topic":"求助應急","example":"すみません、コンビニはどこですか。","example_zh":"不好意思，請問便利商店在哪裡？","note":"「〜はどこですか」找地方萬用句；全稱「コンビニエンスストア」。","level":"N5"},{"text":"ここはどこですか","reading":"ここはどこですか koko wa doko desu ka","zh":"這裡是哪裡？","topic":"求助應急","example":"すみません、ここはどこですか。","example_zh":"不好意思，請問這裡是哪裡？","note":"迷路時拿著地圖問人用。","level":"N5"},{"text":"ここ","reading":"ここ koko","zh":"這裡","topic":"求助應急","example":"ここに座ってもいいですか。","example_zh":"我可以坐這裡嗎？","note":"位置三兄弟：ここ（這裡）、そこ（那裡）、あそこ（那邊遠處）。","level":"N5"},{"text":"そこ","reading":"そこ soko","zh":"那裡（離對方近）","topic":"求助應急","example":"そこに置いてください。","example_zh":"請放在那裡。","note":"指離對方近的地方；「置く」＝放置。","level":"N5"},{"text":"あそこ","reading":"あそこ asoko","zh":"那邊（較遠處）","topic":"求助應急","example":"トイレはあそこですよ。","example_zh":"廁所在那邊喔。","note":"指離雙方都遠的地方。","level":"N5"},{"text":"右","reading":"みぎ migi","zh":"右邊","topic":"求助應急","example":"そこを右に曲がってください。","example_zh":"請在那裡右轉。","note":"「曲がる」＝轉彎；問路時一定會聽到。","level":"N5"},{"text":"左","reading":"ひだり hidari","zh":"左邊","topic":"求助應急","example":"左に大きいスーパーがあります。","example_zh":"左邊有一家大超市。","note":"「〜に〜があります」＝某處有某物。","level":"N5"},{"text":"まっすぐ","reading":"まっすぐ massugu","zh":"直走、筆直","topic":"求助應急","example":"この道をまっすぐ行ってください。","example_zh":"請沿這條路直走。","note":"問路三寶：まっすぐ、右、左。","level":"N5"},{"text":"上","reading":"うえ ue","zh":"上面","topic":"求助應急","example":"かばんはテーブルの上にあります。","example_zh":"包包在桌上。","note":"位置句型「名詞の上／下にあります」；下面是「下（した）」。","level":"N5"},{"text":"中","reading":"なか naka","zh":"裡面","topic":"求助應急","example":"財布はかばんの中にあります。","example_zh":"錢包在包包裡。","note":"「名詞の中」＝…的裡面；外面是「外（そと）」。","level":"N5"},{"text":"前","reading":"まえ mae","zh":"前面","topic":"求助應急","example":"駅の前で待っていますね。","example_zh":"我在車站前面等你喔。","note":"「待っています」＝我等你；後面是「後ろ（うしろ）」。","level":"N5"},{"text":"隣","reading":"となり tonari","zh":"隔壁、旁邊","topic":"求助應急","example":"コンビニは銀行の隣にあります。","example_zh":"便利商店在銀行隔壁。","note":"人坐旁邊也用：隣に座ってもいいですか。","level":"N5"},{"text":"近く","reading":"ちかく chikaku","zh":"附近","topic":"求助應急","example":"この近くにATMはありますか。","example_zh":"這附近有ATM嗎？","note":"「この近くに〜はありますか」找東西萬用句。","level":"N5"},{"text":"二階にあります","reading":"にかいにあります nikai ni arimasu","zh":"在二樓","topic":"求助應急","example":"A：トイレはどこですか。 B：二階にあります。","example_zh":"A：廁所在哪裡？ B：在二樓。","note":"樓層：一階（いっかい）、二階、三階（さんがい）。","level":"N5"},{"text":"ちょっと待ってください","reading":"ちょっとまってください chotto matte kudasai","zh":"請等一下","topic":"求助應急","example":"すみません、ちょっと待ってください。","example_zh":"不好意思，請等我一下。","note":"「待つ」的て形是「待って」；朋友間說「ちょっと待って」。","level":"N5"},{"text":"これをください","reading":"これをください kore o kudasai","zh":"請給我這個","topic":"求助應急","example":"（メニューを指して）これをください。","example_zh":"（指著菜單）請給我這個。","note":"指著商品或菜單說就通，旅行最強一句。","level":"N5"},{"text":"見せてください","reading":"みせてください misete kudasai","zh":"請給我看一下","topic":"求助應急","example":"すみません、それを見せてください。","example_zh":"不好意思，那個請給我看一下。","note":"購物時請店員拿商品給你看。","level":"N5"},{"text":"手伝ってください","reading":"てつだってください tetsudatte kudasai","zh":"請幫我一下","topic":"求助應急","example":"すみません、ちょっと手伝ってください。","example_zh":"不好意思，請幫我一下。","note":"「手伝う」唸「てつだう」，て形是「手伝って」。","level":"N5"},{"text":"手伝いましょうか","reading":"てつだいましょうか tetsudaimashou ka","zh":"我來幫你吧？","topic":"求助應急","example":"荷物、多いですね。手伝いましょうか。","example_zh":"行李好多喔，我來幫你吧？","note":"「〜ましょうか」＝我來…吧？主動提供幫忙的句型。","level":"N5"},{"text":"タクシーを呼んでください","reading":"タクシーをよんでください takushii o yonde kudasai","zh":"請幫我叫計程車","topic":"求助應急","example":"すみません、タクシーを呼んでください。","example_zh":"不好意思，請幫我叫計程車。","note":"「呼ぶ」的て形是「呼んで」；在飯店櫃檯常用。","level":"N5"},{"text":"行き方を教えてください","reading":"いきかたをおしえてください ikikata o oshiete kudasai","zh":"請告訴我怎麼去","topic":"求助應急","example":"駅までの行き方を教えてください。","example_zh":"請告訴我到車站怎麼走。","note":"「ます形去ます＋方」＝…的方法：行き方、使い方、読み方。","level":"N5"},{"text":"ちょっと聞いてもいいですか","reading":"ちょっときいてもいいですか chotto kiite mo ii desu ka","zh":"可以問一下嗎？","topic":"求助應急","example":"すみません、ちょっと聞いてもいいですか。","example_zh":"不好意思，可以問一下嗎？","note":"開口問路、問問題前的緩衝句；「聞く」的て形是「聞いて」。","level":"N5"},{"text":"お腹が痛いです","reading":"おなかがいたいです onaka ga itai desu","zh":"我肚子痛","topic":"求助應急","example":"すみません、お腹が痛いです。薬はありますか。","example_zh":"不好意思，我肚子痛，有藥嗎？","note":"「痛い」前面的部位用「が」。","level":"N5"},{"text":"頭が痛いです","reading":"あたまがいたいです atama ga itai desu","zh":"我頭痛","topic":"求助應急","example":"頭が痛いです。今日は早く帰ります。","example_zh":"我頭痛，今天要早點回家。","note":"「早く」＝早點、快點；請假、早退時用得到。","level":"N5"},{"text":"風邪をひきました","reading":"かぜをひきました kaze o hikimashita","zh":"我感冒了","topic":"求助應急","example":"風邪をひきました。今日は休みます。","example_zh":"我感冒了，今天要請假休息。","note":"感冒固定搭配「風邪をひく」；對方會回你「お大事に」。","level":"N5"},{"text":"空港までどうやって行きますか","reading":"くうこうまでどうやっていきますか kuukou made douyatte ikimasu ka","zh":"到機場要怎麼去？","topic":"求助應急","example":"すみません、空港までどうやって行きますか。","example_zh":"不好意思，請問到機場要怎麼去？","note":"「どうやって」＝怎麼（用什麼方法）；問交通方式必用。","level":"N5"},{"text":"スーパー","reading":"スーパー suupaa","zh":"超市","topic":"求助應急","example":"この近くにスーパーはありますか。","example_zh":"這附近有超市嗎？","note":"全稱「スーパーマーケット」，日常都說「スーパー」。","level":"N5"},{"text":"銀行","reading":"ぎんこう ginkou","zh":"銀行","topic":"求助應急","example":"銀行は何時までですか。","example_zh":"銀行開到幾點？","note":"領錢是「お金をおろす」。","level":"N5"},{"text":"ホテル","reading":"ホテル hoteru","zh":"飯店","topic":"求助應急","example":"（住所を見せて）このホテルはどこですか。","example_zh":"（出示地址）請問這間飯店在哪裡？","note":"找不到飯店時，給對方看地址最快。","level":"N5"},{"text":"バス停","reading":"バスてい basutei","zh":"公車站","topic":"求助應急","example":"バス停はどこですか。","example_zh":"公車站在哪裡？","note":"公車是「バス」，站牌是「バス停」；電車的車站是「駅」。","level":"N5"},{"text":"お邪魔します","reading":"おじゃまします ojama shimasu","zh":"打擾了（進別人家時）","topic":"打招呼","example":"A：どうぞ、入ってください。 B：お邪魔します。","example_zh":"A：請進。 B：打擾了。","note":"進入別人家或辦公室時說；離開時說「お邪魔しました」。","level":"N5"},{"text":"気をつけてね","reading":"きを つけてね ki o tsukete ne","zh":"路上小心／保重","topic":"打招呼","example":"A：じゃあ、帰るね。 B：うん、気をつけてね。","example_zh":"A：那我回去囉。 B：嗯，路上小心。","note":"道別時的貼心結尾語，禮貌一點說「気をつけてください」。","level":"N5"},{"text":"こちらこそ","reading":"こちらこそ kochirakoso","zh":"我才是（彼此彼此）","topic":"打招呼","example":"A：今日はありがとうございました。 B：いえ、こちらこそ。","example_zh":"A：今天謝謝你了。 B：不會，我才要謝謝你。","note":"對方道謝或請多指教時的萬用回應，表示「彼此彼此」。","level":"N5"},{"text":"久しぶり！元気だった？","reading":"ひさしぶり！げんきだった？ hisashiburi! genki datta?","zh":"好久不見！最近好嗎？（常體）","topic":"打招呼","example":"A：久しぶり！元気だった？ B：うん、元気だったよ。","example_zh":"A：好久不見！最近好嗎？ B：嗯，我很好喔。","note":"「お久しぶりです」的朋友版；「だった」是「です」的常體過去形。","level":"N5"},{"text":"また連絡するね","reading":"また れんらくするね mata renraku suru ne","zh":"我再跟你聯絡喔","topic":"打招呼","example":"A：今日は楽しかった！また連絡するね。 B：うん、待ってるね。","example_zh":"A：今天好開心！我再跟你聯絡喔。 B：嗯，等你喔。","note":"道別時的常用結尾；句尾「ね」讓語氣更親切。","level":"N5"},{"text":"日本語が少しできます","reading":"にほんごが すこし できます nihongo ga sukoshi dekimasu","zh":"我會一點日語","topic":"自我介紹","example":"A：日本語ができますか。 B：はい、少しできます。","example_zh":"A：你會日語嗎？ B：會，會一點。","note":"「できます」表示會、能做到；對象用助詞「が」。","level":"N5"},{"text":"中国語と英語が話せます","reading":"ちゅうごくごと えいごが はなせます chuugokugo to eigo ga hanasemasu","zh":"我會說中文和英文","topic":"自我介紹","example":"私は中国語と英語が話せます。日本語は勉強中です。","example_zh":"我會說中文和英文，日語還在學。","note":"「話せます」是「話します」的可能形；並列用「と」連接。","level":"N5"},{"text":"漢字は読めますが、話すのは苦手です","reading":"かんじは よめますが、はなすのは にがてです kanji wa yomemasu ga, hanasu no wa nigate desu","zh":"漢字看得懂，但不太會說","topic":"自我介紹","example":"A：日本語上手ですね。 B：漢字は読めますが、話すのは苦手です。","example_zh":"A：你日語很好耶。 B：漢字看得懂，但不太會說。","note":"台灣學習者的實用自白句；「〜が」表示轉折「雖然…但是」。","level":"N5"},{"text":"お仕事は何ですか","reading":"おしごとは なんですか oshigoto wa nan desu ka","zh":"請問您做什麼工作？","topic":"自我介紹","example":"A：お仕事は何ですか。 B：エンジニアです。","example_zh":"A：請問您做什麼工作？ B：我是工程師。","note":"詢問職業的禮貌說法，加「お」表示對對方的尊重。","level":"N5"},{"text":"どこで働いていますか","reading":"どこで はたらいていますか doko de hataraite imasu ka","zh":"你在哪裡工作？","topic":"自我介紹","example":"A：どこで働いていますか。 B：台北の会社で働いています。","example_zh":"A：你在哪裡工作？ B：我在台北的公司上班。","note":"「どこで＋動詞」問地點；「働いています」表示目前的工作狀態。","level":"N5"},{"text":"日本語はどのくらい勉強していますか","reading":"にほんごは どのくらい べんきょうしていますか nihongo wa dono kurai benkyou shite imasu ka","zh":"你日語學多久了？","topic":"自我介紹","example":"A：日本語はどのくらい勉強していますか。 B：一年ぐらいです。","example_zh":"A：你日語學多久了？ B：大概一年。","note":"「どのくらい」問時間長度或程度，回答常配「ぐらい（大約）」。","level":"N5"},{"text":"半年ぐらい勉強しています","reading":"はんとしぐらい べんきょうしています hantoshi gurai benkyou shite imasu","zh":"我學了大概半年","topic":"自我介紹","example":"A：日本語、長いですか。 B：いいえ、半年ぐらい勉強しています。","example_zh":"A：日語學很久了嗎？ B：沒有，大概學了半年。","note":"「〜ています」表示從過去持續到現在；「ぐらい」表示大約。","level":"N5"},{"text":"日本に住みたいです","reading":"にほんに すみたいです nihon ni sumitai desu","zh":"我想住在日本","topic":"自我介紹","example":"A：将来の夢は何ですか。 B：日本に住みたいです。","example_zh":"A：你未來的夢想是什麼？ B：我想住在日本。","note":"「動詞ます形去ます＋たい」表示自己想做的事。","level":"N5"},{"text":"将来、日本で働きたいです","reading":"しょうらい、にほんで はたらきたいです shourai, nihon de hatarakitai desu","zh":"將來想在日本工作","topic":"自我介紹","example":"日本語を頑張っています。将来、日本で働きたいですから。","example_zh":"我很努力學日語，因為將來想在日本工作。","note":"「働きたい」＝想工作；地點用「で」。聊人生目標的必備句。","level":"N5"},{"text":"車の運転ができます","reading":"くるまの うんてんが できます kuruma no unten ga dekimasu","zh":"我會開車","topic":"自我介紹","example":"A：車の運転ができますか。 B：はい、できます。台湾で免許を取りました。","example_zh":"A：你會開車嗎？ B：會，我在台灣考到駕照了。","note":"「名詞＋ができます」表示具備某種能力或技能。","level":"N5"},{"text":"料理が得意です","reading":"りょうりが とくいです ryouri ga tokui desu","zh":"我很擅長做菜","topic":"自我介紹","example":"A：料理が得意です。 B：すごい！今度作ってください。","example_zh":"A：我很會做菜。 B：好厲害！下次做給我吃。","note":"「得意」是拿手；比「上手」更適合說自己，說別人用「上手」。","level":"N5"},{"text":"歌が苦手です","reading":"うたが にがてです uta ga nigate desu","zh":"我不太會唱歌","topic":"自我介紹","example":"A：カラオケに行きましょう。 B：実は歌が苦手です…。","example_zh":"A：我們去唱KTV吧。 B：其實我不太會唱歌……。","note":"「苦手」表示不擅長或有點怕，語氣比「下手」委婉。","level":"N5"},{"text":"どうして日本語を勉強していますか","reading":"どうして にほんごを べんきょうしていますか doushite nihongo o benkyou shite imasu ka","zh":"你為什麼學日語？","topic":"自我介紹","example":"A：どうして日本語を勉強していますか。 B：旅行が好きだからです。","example_zh":"A：你為什麼學日語？ B：因為我喜歡旅行。","note":"「どうして」問原因，回答常用「〜からです（因為…）」。","level":"N5"},{"text":"アニメが好きだから、日本語を始めました","reading":"アニメが すきだから、にほんごを はじめました anime ga suki dakara, nihongo o hajimemashita","zh":"因為喜歡動畫，所以開始學日語","topic":"自我介紹","example":"A：どうして日本語を？ B：アニメが好きだから、始めました。","example_zh":"A：為什麼學日語？ B：因為喜歡動畫就開始學了。","note":"「な形容詞＋だから」表示原因；台灣學習者最常見的理由句。","level":"N5"},{"text":"泳げますか","reading":"およげますか oyogemasu ka","zh":"你會游泳嗎？","topic":"自我介紹","example":"A：泳げますか。 B：少しだけ泳げます。","example_zh":"A：你會游泳嗎？ B：只會游一點點。","note":"「泳げます」是「泳ぎます」的可能形；問對方能力的常見句。","level":"N5"},{"text":"ピアノが弾けます","reading":"ピアノが ひけます piano ga hikemasu","zh":"我會彈鋼琴","topic":"自我介紹","example":"A：楽器ができますか。 B：はい、ピアノが弾けます。","example_zh":"A：你會樂器嗎？ B：會，我會彈鋼琴。","note":"「弾けます」是「弾きます」的可能形；可能形前面助詞用「が」。","level":"N5"},{"text":"週末はよくカフェに行きます","reading":"しゅうまつは よく カフェに いきます shuumatsu wa yoku kafe ni ikimasu","zh":"週末我常去咖啡廳","topic":"興趣嗜好","example":"A：週末は何をしますか。 B：よくカフェに行きます。","example_zh":"A：你週末都做什麼？ B：我常去咖啡廳。","note":"「よく」＝經常，放在動詞前；頻率副詞的代表。","level":"N5"},{"text":"時々ジムに行きます","reading":"ときどき ジムに いきます tokidoki jimu ni ikimasu","zh":"我偶爾去健身房","topic":"興趣嗜好","example":"A：運動していますか。 B：時々ジムに行きます。","example_zh":"A：你有在運動嗎？ B：偶爾去健身房。","note":"「時々」＝有時、偶爾，頻率比「よく」低。","level":"N5"},{"text":"毎日アニメを見ています","reading":"まいにち アニメを みています mainichi anime o mite imasu","zh":"我每天都看動畫","topic":"興趣嗜好","example":"A：アニメ、好きですね。 B：はい、毎日見ています。","example_zh":"A：你真的很愛動畫耶。 B：對，每天都看。","note":"「毎日＋〜ています」表示每天的習慣。","level":"N5"},{"text":"ギターが少し弾けます","reading":"ギターが すこし ひけます gitaa ga sukoshi hikemasu","zh":"我會彈一點吉他","topic":"興趣嗜好","example":"A：ギターが少し弾けます。 B：かっこいい！今度聞かせてください。","example_zh":"A：我會彈一點吉他。 B：好帥！下次彈給我聽。","note":"加「少し」是謙虛的說法，日語會話中很自然。","level":"N5"},{"text":"日本の映画をもっと見たいです","reading":"にほんの えいがを もっと みたいです nihon no eiga o motto mitai desu","zh":"我想看更多日本電影","topic":"興趣嗜好","example":"日本の映画をもっと見たいです。おすすめはありますか。","example_zh":"我想看更多日本電影，有推薦的嗎？","note":"「もっと」＝更多、更加；配「〜たい」表達願望。","level":"N5"},{"text":"ライブに行ってみたいです","reading":"ライブに いってみたいです raibu ni itte mitai desu","zh":"我想去看看演唱會","topic":"興趣嗜好","example":"日本のアイドルのライブに行ってみたいです。","example_zh":"我想去看看日本偶像的演唱會。","note":"「〜てみたい」＝想試試看做某事，比「〜たい」多了嘗試的語感。","level":"N5"},{"text":"最近、何か面白いドラマありますか","reading":"さいきん、なにか おもしろい ドラマ ありますか saikin, nanika omoshiroi dorama arimasu ka","zh":"最近有什麼好看的劇嗎？","topic":"興趣嗜好","example":"A：最近、何か面白いドラマありますか。 B：ありますよ！今度教えますね。","example_zh":"A：最近有什麼好看的劇嗎？ B：有喔！下次跟你說。","note":"「何か」＝某個什麼；口語中常省略「が」，是找話題的好句子。","level":"N5"},{"text":"どんな音楽をよく聞きますか","reading":"どんな おんがくを よく ききますか donna ongaku o yoku kikimasu ka","zh":"你常聽什麼樣的音樂？","topic":"興趣嗜好","example":"A：どんな音楽をよく聞きますか。 B：J-POPをよく聞きます。","example_zh":"A：你常聽什麼樣的音樂？ B：我常聽日本流行樂。","note":"「どんな＋名詞」問種類，聊興趣的萬用疑問句型。","level":"N5"},{"text":"どんなゲームをやっていますか","reading":"どんな ゲームを やっていますか donna geemu o yatte imasu ka","zh":"你在玩什麼遊戲？","topic":"興趣嗜好","example":"A：どんなゲームをやっていますか。 B：スマホゲームをやっています。","example_zh":"A：你在玩什麼遊戲？ B：我在玩手遊。","note":"口語中玩遊戲多用「やる」；「やっています」表示目前有在玩。","level":"N5"},{"text":"スポーツはあまりしません","reading":"スポーツは あまり しません supootsu wa amari shimasen","zh":"我不太運動","topic":"興趣嗜好","example":"A：スポーツはしますか。 B：あまりしません。見るのは好きです。","example_zh":"A：你有運動嗎？ B：不太運動，但喜歡看比賽。","note":"「あまり＋否定」＝不太…；後面一定要接否定形。","level":"N5"},{"text":"読書","reading":"どくしょ dokusho","zh":"閱讀","topic":"興趣嗜好","example":"A：趣味は何ですか。 B：読書です。最近は小説を読んでいます。","example_zh":"A：你的興趣是什麼？ B：閱讀，最近在看小說。","note":"自我介紹講興趣的常見單字，「読書をします」＝閱讀。","level":"N5"},{"text":"釣り","reading":"つり tsuri","zh":"釣魚","topic":"興趣嗜好","example":"父の趣味は釣りです。週末はいつも海に行きます。","example_zh":"我爸的興趣是釣魚，週末總是去海邊。","note":"來自動詞「釣る」；「釣りに行きます」＝去釣魚。","level":"N5"},{"text":"温泉に行くのが好きです","reading":"おんせんに いくのが すきです onsen ni iku no ga suki desu","zh":"我喜歡去泡溫泉","topic":"興趣嗜好","example":"A：日本で何がしたいですか。 B：温泉に行くのが好きだから、北海道に行きたいです。","example_zh":"A：你想在日本做什麼？ B：因為喜歡泡溫泉，想去北海道。","note":"「温泉」是台日共通話題；北投、烏來聊起來就會用到。","level":"N5"},{"text":"日本の歌が歌えます","reading":"にほんの うたが うたえます nihon no uta ga utaemasu","zh":"我會唱日文歌","topic":"興趣嗜好","example":"A：カラオケで何を歌いますか。 B：日本の歌が少し歌えます。","example_zh":"A：你KTV都唱什麼？ B：我會唱一點日文歌。","note":"「歌えます」是「歌います」的可能形；KTV話題必備。","level":"N5"},{"text":"甘いものが大好きです","reading":"あまいものが だいすきです amai mono ga daisuki desu","zh":"我超愛甜食","topic":"興趣嗜好","example":"A：デザート、食べますか。 B：もちろん！甘いものが大好きです。","example_zh":"A：要吃甜點嗎？ B：當然！我超愛甜食。","note":"「大好き」＝非常喜歡，程度比「好き」強；對象用助詞「が」。","level":"N5"},{"text":"休みの日は何をしていますか","reading":"やすみのひは なにを していますか yasumi no hi wa nani o shite imasu ka","zh":"你放假都在做什麼？","topic":"興趣嗜好","example":"A：休みの日は何をしていますか。 B：家で映画を見ています。","example_zh":"A：你放假都在做什麼？ B：在家看電影。","note":"認識新朋友時的必問句；「〜ていますか」問平常的習慣。","level":"N5"},{"text":"家でゴロゴロするのが好きです","reading":"いえで ゴロゴロするのが すきです ie de gorogoro suru no ga suki desu","zh":"我喜歡在家耍廢","topic":"興趣嗜好","example":"A：週末は？ B：家でゴロゴロするのが好きです。","example_zh":"A：週末呢？ B：我喜歡在家耍廢。","note":"擬態語「ゴロゴロ」＝懶洋洋地滾來滾去，年輕人聊天超常用。","level":"N5"},{"text":"韓国ドラマも見ますか","reading":"かんこくドラマも みますか kankoku dorama mo mimasu ka","zh":"你也看韓劇嗎？","topic":"興趣嗜好","example":"A：日本のドラマが好きです。 B：韓国ドラマも見ますか。","example_zh":"A：我喜歡日劇。 B：那你也看韓劇嗎？","note":"助詞「も」＝也；把話題延伸出去的好用句型。","level":"N5"},{"text":"今度の日曜日、何か予定がありますか","reading":"こんどの にちようび、なにか よていが ありますか kondo no nichiyoubi, nanika yotei ga arimasu ka","zh":"這個星期天你有什麼安排嗎？","topic":"邀約出遊","example":"A：今度の日曜日、何か予定がありますか。 B：いいえ、特にないです。","example_zh":"A：這個星期天你有什麼安排嗎？ B：沒有，沒什麼特別的。","note":"邀約前先探對方時間的禮貌開場；「特にないです」＝沒特別安排。","level":"N5"},{"text":"どこに行きたいですか","reading":"どこに いきたいですか doko ni ikitai desu ka","zh":"你想去哪裡？","topic":"邀約出遊","example":"A：どこに行きたいですか。 B：うーん、海に行きたいです。","example_zh":"A：你想去哪裡？ B：嗯……我想去海邊。","note":"「どこ」＋「〜たい」問對方的願望，規劃行程必用。","level":"N5"},{"text":"何か持っていきましょうか","reading":"なにか もっていきましょうか nanika motte ikimashou ka","zh":"需要我帶什麼過去嗎？","topic":"邀約出遊","example":"A：明日、うちでパーティーをします。 B：いいですね。何か持っていきましょうか。","example_zh":"A：明天在我家辦派對。 B：好耶！需要我帶什麼過去嗎？","note":"受邀時體貼的一問；「〜ましょうか」表示主動提議幫忙。","level":"N5"},{"text":"何時に集まりますか","reading":"なんじに あつまりますか nanji ni atsumarimasu ka","zh":"幾點集合？","topic":"邀約出遊","example":"A：何時に集まりますか。 B：十時に駅で集まりましょう。","example_zh":"A：幾點集合？ B：十點在車站集合吧。","note":"「集まります」＝集合；時間點用助詞「に」。","level":"N5"},{"text":"どうやって行きますか","reading":"どうやって いきますか douyatte ikimasu ka","zh":"要怎麼去？","topic":"邀約出遊","example":"A：どうやって行きますか。 B：MRTで行きましょう。","example_zh":"A：要怎麼去？ B：搭捷運去吧。","note":"「どうやって」問方法、手段，交通、做法都能問。","level":"N5"},{"text":"電車で行きましょう","reading":"でんしゃで いきましょう densha de ikimashou","zh":"我們搭電車去吧","topic":"邀約出遊","example":"A：バスと電車、どちらがいいですか。 B：電車で行きましょう。速いから。","example_zh":"A：公車和電車哪個好？ B：搭電車去吧，因為比較快。","note":"交通工具用助詞「で」；「〜ましょう」提議一起做。","level":"N5"},{"text":"誰と行きますか","reading":"だれと いきますか dare to ikimasu ka","zh":"你和誰去？","topic":"邀約出遊","example":"A：明日、日本に行きます。 B：いいなあ。誰と行きますか。","example_zh":"A：我明天要去日本。 B：真好～你和誰去？","note":"「誰と」＝和誰；一個人去則說「一人で行きます」。","level":"N5"},{"text":"何人で行きますか","reading":"なんにんで いきますか nannin de ikimasu ka","zh":"你們幾個人去？","topic":"邀約出遊","example":"A：何人で行きますか。 B：四人で行きます。","example_zh":"A：你們幾個人去？ B：四個人去。","note":"「何人（なんにん）」問人數；「〜人で」表示以幾人的規模行動。","level":"N5"},{"text":"明日は用事があるから、行けません","reading":"あしたは ようじが あるから、いけません ashita wa youji ga aru kara, ikemasen","zh":"明天有事，所以不能去","topic":"邀約出遊","example":"A：明日、映画はどうですか。 B：すみません、明日は用事があるから、行けません。","example_zh":"A：明天看電影如何？ B：抱歉，明天有事所以不能去。","note":"「〜から」說明理由；「行けません」是「行きます」的可能形否定。","level":"N5"},{"text":"雨だから、今日はやめましょう","reading":"あめだから、きょうは やめましょう ame dakara, kyou wa yamemashou","zh":"因為下雨，今天先取消吧","topic":"邀約出遊","example":"A：雨だから、今日はやめましょう。 B：そうですね。また今度にしましょう。","example_zh":"A：因為下雨，今天先取消吧。 B：說得也是，改天再約吧。","note":"「名詞＋だから」表示原因；「やめましょう」＝作罷、取消。","level":"N5"},{"text":"行けたら行きます","reading":"いけたら いきます iketara ikimasu","zh":"可以的話我就去（不確定時）","topic":"邀約出遊","example":"A：土曜日のパーティー、来ますか。 B：うーん、行けたら行きます。","example_zh":"A：星期六的派對你來嗎？ B：嗯……可以的話我就去。","note":"曖昧的回答，日本人聽起來常常等於「大概不會去」，要注意語感。","level":"N5"},{"text":"何時までに帰りたいですか","reading":"なんじまでに かえりたいですか nanji made ni kaeritai desu ka","zh":"你想在幾點前回家？","topic":"邀約出遊","example":"A：何時までに帰りたいですか。 B：十時までに帰りたいです。","example_zh":"A：你想在幾點前回家？ B：我想十點前回到家。","note":"「までに」＝在…之前（期限），和「まで（持續到…）」不同。","level":"N5"},{"text":"ディズニーランドに行ってみたいです","reading":"ディズニーランドに いってみたいです dizuniirando ni itte mitai desu","zh":"我想去看看迪士尼樂園","topic":"邀約出遊","example":"A：東京で行きたいところは？ B：ディズニーランドに行ってみたいです。","example_zh":"A：在東京想去哪裡？ B：我想去看看迪士尼樂園。","note":"「〜てみたい」＝想體驗看看；聊旅遊願望的高頻句。","level":"N5"},{"text":"チケットはもう買いましたか","reading":"チケットは もう かいましたか chiketto wa mou kaimashita ka","zh":"票已經買了嗎？","topic":"邀約出遊","example":"A：チケットはもう買いましたか。 B：いいえ、まだです。","example_zh":"A：票已經買了嗎？ B：還沒。","note":"「もう〜ましたか」問是否完成；回答「まだです」＝還沒。","level":"N5"},{"text":"まだ決めていません","reading":"まだ きめていません mada kimete imasen","zh":"還沒決定","topic":"邀約出遊","example":"A：週末はどこに行きますか。 B：まだ決めていません。","example_zh":"A：週末要去哪？ B：還沒決定。","note":"「まだ＋〜ていません」＝還沒做；不要說成「まだ決めません」。","level":"N5"},{"text":"どこか涼しいところに行きたいです","reading":"どこか すずしい ところに いきたいです dokoka suzushii tokoro ni ikitai desu","zh":"我想去個涼快的地方","topic":"邀約出遊","example":"暑いですね。どこか涼しいところに行きたいです。","example_zh":"好熱喔，想去個涼快的地方。","note":"「どこか」＝某個地方；「涼しい」形容天氣涼爽。","level":"N5"},{"text":"場所はどこにしますか","reading":"ばしょは どこに しますか basho wa doko ni shimasu ka","zh":"地點要選哪裡？","topic":"邀約出遊","example":"A：場所はどこにしますか。 B：駅の近くのカフェにしましょう。","example_zh":"A：地點要選哪裡？ B：就選車站附近的咖啡廳吧。","note":"「〜にします」表示做決定，點餐、選地點都用這個句型。","level":"N5"},{"text":"私はどこでもいいですよ","reading":"わたしは どこでも いいですよ watashi wa doko demo ii desu yo","zh":"我哪裡都可以喔","topic":"邀約出遊","example":"A：どこで食べますか。 B：私はどこでもいいですよ。","example_zh":"A：要在哪吃？ B：我哪裡都可以喔。","note":"「疑問詞＋でも」＝都行；「何でもいい」「いつでもいい」同型。","level":"N5"},{"text":"疲れたから、少し休みませんか","reading":"つかれたから、すこし やすみませんか tsukareta kara, sukoshi yasumimasen ka","zh":"走累了，要不要休息一下？","topic":"邀約出遊","example":"A：疲れたから、少し休みませんか。 B：いいですね。あそこに座りましょう。","example_zh":"A：走累了，要不要休息一下？ B：好啊，去那邊坐吧。","note":"「〜ませんか」委婉邀請；前面用「から」帶出理由更自然。","level":"N5"},{"text":"そろそろ帰りましょうか","reading":"そろそろ かえりましょうか sorosoro kaerimashou ka","zh":"差不多該回去了吧？","topic":"邀約出遊","example":"A：もう九時ですね。そろそろ帰りましょうか。 B：そうですね。","example_zh":"A：已經九點了耶，差不多該回去了吧？ B：也是。","note":"「そろそろ」＝差不多該…；提議結束聚會的委婉說法。","level":"N5"},{"text":"また誘ってもいいですか","reading":"また さそっても いいですか mata sasotte mo ii desu ka","zh":"下次可以再約你嗎？","topic":"邀約出遊","example":"A：今日はありがとう。また誘ってもいいですか。 B：もちろん！","example_zh":"A：今天謝謝你，下次可以再約你嗎？ B：當然！","note":"「〜てもいいですか」請求許可；「誘う」＝邀約。","level":"N5"},{"text":"すみません、注文をお願いします","reading":"すみません、ちゅうもんを おねがいします sumimasen, chuumon o onegai shimasu","zh":"不好意思，我要點餐","topic":"吃飯聊天","example":"（店員を呼んで）すみません、注文をお願いします。","example_zh":"（叫店員）不好意思，我要點餐。","note":"日本餐廳常要主動叫店員；「すみません」在這裡是「不好意思」的呼喚。","level":"N5"},{"text":"お水をください","reading":"おみずを ください omizu o kudasai","zh":"請給我水","topic":"吃飯聊天","example":"すみません、お水をください。","example_zh":"不好意思，請給我水。","note":"日本餐廳的水通常免費；加「お」更有禮貌。","level":"N5"},{"text":"とりあえずビールで","reading":"とりあえず ビールで toriaezu biiru de","zh":"先來杯啤酒（居酒屋常用）","topic":"吃飯聊天","example":"A：お飲み物は？ B：とりあえずビールで。","example_zh":"A：請問喝什麼？ B：先來杯啤酒。","note":"居酒屋的經典句；「とりあえず」＝總之先…，是高頻膠水詞。","level":"N5"},{"text":"店内で食べます","reading":"てんないで たべます tennai de tabemasu","zh":"我要內用","topic":"吃飯聊天","example":"A：お持ち帰りですか。 B：いいえ、店内で食べます。","example_zh":"A：請問外帶嗎？ B：不，我要內用。","note":"和「持ち帰り」成對記；店員常問「店内でお召し上がりですか」。","level":"N5"},{"text":"大盛りにしてください","reading":"おおもりに してください oomori ni shite kudasai","zh":"請幫我加大份量","topic":"吃飯聊天","example":"すみません、ご飯を大盛りにしてください。","example_zh":"不好意思，白飯請幫我加大。","note":"「大盛り」＝大碗；拉麵店、丼飯店常用，有些店免費。","level":"N5"},{"text":"温かいのと冷たいの、どちらにしますか","reading":"あたたかいのと つめたいの、どちらに しますか atatakai no to tsumetai no, dochira ni shimasu ka","zh":"要熱的還是冰的？","topic":"吃飯聊天","example":"A：お茶は温かいのと冷たいの、どちらにしますか。 B：冷たいのをください。","example_zh":"A：茶要熱的還是冰的？ B：請給我冰的。","note":"「〜の」代替名詞；「どちらにしますか」＝要選哪個。","level":"N5"},{"text":"甘い","reading":"あまい amai","zh":"甜的","topic":"吃飯聊天","example":"このケーキ、甘くておいしいですね。","example_zh":"這個蛋糕又甜又好吃耶。","note":"い形容詞；「甘すぎる」＝太甜，台灣飲料話題常用。","level":"N5"},{"text":"辛い","reading":"からい karai","zh":"辣的","topic":"吃飯聊天","example":"A：これ、辛いですか。 B：ちょっと辛いですよ。","example_zh":"A：這個辣嗎？ B：有一點辣喔。","note":"注意「辛い（からい）」是辣；同字讀「つらい」時是痛苦。","level":"N5"},{"text":"酸っぱい","reading":"すっぱい suppai","zh":"酸的","topic":"吃飯聊天","example":"このレモンティー、ちょっと酸っぱいですね。","example_zh":"這杯檸檬茶有點酸耶。","note":"い形容詞；形容檸檬、醋等味道。","level":"N5"},{"text":"しょっぱい","reading":"しょっぱい shoppai","zh":"鹹的","topic":"吃飯聊天","example":"このスープ、少ししょっぱいです。","example_zh":"這個湯有點鹹。","note":"口語常用「しょっぱい」，書面也說「塩辛い」。","level":"N5"},{"text":"苦い","reading":"にがい nigai","zh":"苦的","topic":"吃飯聊天","example":"ブラックコーヒーは苦いから、あまり飲みません。","example_zh":"黑咖啡很苦，所以我不太喝。","note":"い形容詞；五味「甘い・辛い・酸っぱい・しょっぱい・苦い」一起記。","level":"N5"},{"text":"熱いから、気をつけてください","reading":"あついから、きを つけてください atsui kara, ki o tsukete kudasai","zh":"很燙，請小心","topic":"吃飯聊天","example":"A：熱いから、気をつけてください。 B：はい、ありがとうございます。","example_zh":"A：很燙，請小心。 B：好的，謝謝。","note":"店員上菜常說；「熱い」指東西燙，「暑い」指天氣熱。","level":"N5"},{"text":"何か飲みたいです","reading":"なにか のみたいです nanika nomitai desu","zh":"我想喝點什麼","topic":"吃飯聊天","example":"暑いですね。何か冷たいものが飲みたいです。","example_zh":"好熱喔，想喝點冰的。","note":"「何か」＝某個什麼；「何か＋動詞たい」表達模糊的願望。","level":"N5"},{"text":"私は牛肉が食べられません","reading":"わたしは ぎゅうにくが たべられません watashi wa gyuuniku ga taberaremasen","zh":"我不能吃牛肉","topic":"吃飯聊天","example":"A：すき焼きはどうですか。 B：すみません、私は牛肉が食べられません。","example_zh":"A：壽喜燒如何？ B：不好意思，我不能吃牛肉。","note":"「食べられません」是可能形否定；台灣不吃牛的人聚餐必備句。","level":"N5"},{"text":"パクチーは抜きでお願いします","reading":"パクチーは ぬきで おねがいします pakuchii wa nuki de onegai shimasu","zh":"請不要加香菜","topic":"吃飯聊天","example":"すみません、パクチーは抜きでお願いします。","example_zh":"不好意思，請不要加香菜。","note":"「〜抜きで」＝去掉…；「ねぎ抜きで（不加蔥）」同型。","level":"N5"},{"text":"あまり辛くしないでください","reading":"あまり からく しないでください amari karaku shinaide kudasai","zh":"請不要做太辣","topic":"吃飯聊天","example":"A：辛さはどうしますか。 B：あまり辛くしないでください。","example_zh":"A：辣度要怎麼調？ B：請不要做太辣。","note":"「〜ないでください」＝請不要…；「辛くする」＝弄辣。","level":"N5"},{"text":"おかわりできますか","reading":"おかわり できますか okawari dekimasu ka","zh":"可以續（飯／杯）嗎？","topic":"吃飯聊天","example":"A：ご飯のおかわりできますか。 B：はい、無料です。","example_zh":"A：白飯可以續碗嗎？ B：可以，免費。","note":"「おかわり」＝再來一份；日本很多定食店白飯可免費續。","level":"N5"},{"text":"これはどうやって食べますか","reading":"これは どうやって たべますか kore wa douyatte tabemasu ka","zh":"這個要怎麼吃？","topic":"吃飯聊天","example":"A：これはどうやって食べますか。 B：このソースをつけて食べてください。","example_zh":"A：這個要怎麼吃？ B：請沾這個醬吃。","note":"「どうやって」問方法；第一次吃日本料理時超實用。","level":"N5"},{"text":"一口食べてみますか","reading":"ひとくち たべてみますか hitokuchi tabete mimasu ka","zh":"要吃一口看看嗎？","topic":"吃飯聊天","example":"A：それ、おいしそうですね。 B：一口食べてみますか。","example_zh":"A：那個看起來好好吃喔。 B：要吃一口看看嗎？","note":"「〜てみます」＝試試看；朋友分食時的自然對話。","level":"N5"},{"text":"別々にお願いします","reading":"べつべつに おねがいします betsubetsu ni onegai shimasu","zh":"請幫我們分開結帳","topic":"吃飯聊天","example":"A：お会計はご一緒ですか。 B：別々にお願いします。","example_zh":"A：請問一起結嗎？ B：請分開結。","note":"結帳時和「割り勘」不同：別々是各付各的帳單。","level":"N5"},{"text":"カードで払えますか","reading":"カードで はらえますか kaado de haraemasu ka","zh":"可以刷卡嗎？","topic":"吃飯聊天","example":"A：カードで払えますか。 B：すみません、現金だけです。","example_zh":"A：可以刷卡嗎？ B：不好意思，只收現金。","note":"「払えます」是「払います」的可能形；日本仍有不少店只收現金。","level":"N5"},{"text":"ここ、よく来るんですか","reading":"ここ、よく くるんですか koko, yoku kurun desu ka","zh":"你常來這裡嗎？","topic":"吃飯聊天","example":"A：ここ、よく来るんですか。 B：はい、月に二回ぐらい来ます。","example_zh":"A：你常來這裡嗎？ B：對，一個月來兩次左右。","note":"「〜んですか」帶有關心語氣的提問，吃飯閒聊的自然開場。","level":"N5"},{"text":"定食","reading":"ていしょく teishoku","zh":"定食（套餐）","topic":"吃飯聊天","example":"お昼はいつも駅前の店で定食を食べます。","example_zh":"中午我都在車站前的店吃定食。","note":"日本平價食堂的主角，主菜＋飯＋味噌湯＋小菜的組合。","level":"N5"},{"text":"予約していません。席はありますか","reading":"よやくしていません。せきは ありますか yoyaku shite imasen. seki wa arimasu ka","zh":"我沒訂位，請問有位子嗎？","topic":"吃飯聊天","example":"A：予約していません。席はありますか。 B：二名様ですね。ございますよ。","example_zh":"A：我沒訂位，請問有位子嗎？ B：兩位對嗎？有位子喔。","note":"現場候位必用；「席」＝座位，「予約」＝預約。","level":"N5"},{"text":"髪型、変えましたか？似合っていますね","reading":"かみがた、かえましたか？にあっていますね kamigata, kaemashita ka? niatte imasu ne","zh":"你換髮型了？很適合你耶","topic":"稱讚回應","example":"A：髪型、変えましたか？似合っていますね。 B：ありがとう、昨日切りました。","example_zh":"A：你換髮型了？很適合你耶。 B：謝謝，昨天剪的。","note":"注意到對方變化＋稱讚，是日本人拉近距離的經典組合。","level":"N5"},{"text":"発音がきれいですね","reading":"はつおんが きれいですね hatsuon ga kirei desu ne","zh":"你的發音很漂亮耶","topic":"稱讚回應","example":"A：発音がきれいですね。 B：ありがとうございます。毎日練習しています。","example_zh":"A：你的發音很漂亮耶。 B：謝謝，我每天都在練習。","note":"「きれい」也能形容聲音、發音；稱讚學語言的人最常用。","level":"N5"},{"text":"字が上手ですね","reading":"じが じょうずですね ji ga jouzu desu ne","zh":"你的字寫得真好","topic":"稱讚回應","example":"A：字が上手ですね。 B：いえいえ、そんなことないです。","example_zh":"A：你的字寫得真好。 B：哪裡哪裡，沒有啦。","note":"「〜が上手ですね」稱讚別人的技能；回應常用謙虛句。","level":"N5"},{"text":"よく知っていますね","reading":"よく しっていますね yoku shitte imasu ne","zh":"你懂得真多耶","topic":"稱讚回應","example":"A：この店は五十年前からありますよ。 B：よく知っていますね！","example_zh":"A：這家店五十年前就有了喔。 B：你懂得真多耶！","note":"對方展現知識時的稱讚；「よく」在這裡是「真的很」的語氣。","level":"N5"},{"text":"頑張りましたね","reading":"がんばりましたね ganbarimashita ne","zh":"你很努力了呢","topic":"稱讚回應","example":"A：やっとN5に合格しました。 B：頑張りましたね！おめでとう！","example_zh":"A：我終於考過N5了。 B：你很努力了呢！恭喜！","note":"肯定對方付出的努力；「おめでとう」＝恭喜，常一起用。","level":"N5"},{"text":"私もそう思います","reading":"わたしも そう おもいます watashi mo sou omoimasu","zh":"我也這麼覺得","topic":"稱讚回應","example":"A：この店、おいしいですね。 B：私もそう思います。","example_zh":"A：這家店很好吃耶。 B：我也這麼覺得。","note":"附和對方意見的萬用句；會話中的重要膠水句。","level":"N5"},{"text":"写真、上手に撮れていますね","reading":"しゃしん、じょうずに とれていますね shashin, jouzu ni torete imasu ne","zh":"這照片拍得真好耶","topic":"稱讚回應","example":"A：この写真、上手に撮れていますね。 B：ありがとう。新しいスマホで撮りました。","example_zh":"A：這照片拍得真好耶。 B：謝謝，是用新手機拍的。","note":"看朋友的照片時稱讚用；「撮れています」表示拍出來的成果好。","level":"N5"},{"text":"仕事が早いですね","reading":"しごとが はやいですね shigoto ga hayai desu ne","zh":"你動作真快耶","topic":"稱讚回應","example":"A：もう全部終わりましたよ。 B：えっ、仕事が早いですね！","example_zh":"A：我全部做完囉。 B：欸，你動作真快耶！","note":"稱讚對方做事有效率的固定說法；「早い」指時間上的快。","level":"N5"},{"text":"褒めすぎですよ","reading":"ほめすぎですよ homesugi desu yo","zh":"你太會誇了啦","topic":"稱讚回應","example":"A：日本人みたいですね！ B：いやいや、褒めすぎですよ。","example_zh":"A：你根本像日本人！ B：沒有沒有，你太會誇了啦。","note":"「動詞ます形去ます＋すぎ」＝太過…；被稱讚時的輕鬆回應。","level":"N5"},{"text":"照れますね","reading":"てれますね teremasu ne","zh":"好害羞喔","topic":"稱讚回應","example":"A：今日、かわいいですね。 B：えっ、照れますね。","example_zh":"A：你今天好可愛喔。 B：欸，好害羞喔。","note":"被稱讚時自然的反應；「照れる」＝不好意思、害羞。","level":"N5"},{"text":"それ、いいですね！どこで買いましたか","reading":"それ、いいですね！どこで かいましたか sore, ii desu ne! doko de kaimashita ka","zh":"那個好讚喔！在哪買的？","topic":"稱讚回應","example":"A：それ、いいですね！どこで買いましたか。 B：ネットで買いました。","example_zh":"A：那個好讚喔！在哪買的？ B：網購買的。","note":"稱讚＋疑問詞「どこで」延伸話題，一句話兩個功能。","level":"N5"},{"text":"声がすてきですね","reading":"こえが すてきですね koe ga suteki desu ne","zh":"你的聲音很好聽耶","topic":"稱讚回應","example":"A：声がすてきですね。 B：本当ですか。うれしいです。","example_zh":"A：你的聲音很好聽耶。 B：真的嗎？好開心。","note":"「すてき」是萬用稱讚詞，外表、物品、聲音都能用。","level":"N5"},{"text":"いつも何時に起きますか","reading":"いつも なんじに おきますか itsumo nanji ni okimasu ka","zh":"你平常都幾點起床？","topic":"日常閒聊","example":"A：いつも何時に起きますか。 B：七時ごろ起きます。","example_zh":"A：你平常都幾點起床？ B：大概七點起床。","note":"「いつも」＝平常、總是；問生活作息的常見句。","level":"N5"},{"text":"毎朝コーヒーを飲みます","reading":"まいあさ コーヒーを のみます maiasa koohii o nomimasu","zh":"我每天早上都喝咖啡","topic":"日常閒聊","example":"A：朝は何を飲みますか。 B：毎朝コーヒーを飲みます。","example_zh":"A：你早上都喝什麼？ B：每天早上都喝咖啡。","note":"「毎朝」＝每天早上；同系列有毎晩、毎日、毎週。","level":"N5"},{"text":"たまに映画を見に行きます","reading":"たまに えいがを みに いきます tamani eiga o mi ni ikimasu","zh":"我偶爾去看電影","topic":"日常閒聊","example":"A：映画館に行きますか。 B：たまに見に行きます。","example_zh":"A：你會去電影院嗎？ B：偶爾會去看。","note":"「たまに」頻率比「時々」更低；「〜に行きます」表示去做某事。","level":"N5"},{"text":"全然眠れませんでした","reading":"ぜんぜん ねむれませんでした zenzen nemuremasen deshita","zh":"我完全睡不著","topic":"日常閒聊","example":"A：眠そうですね。 B：昨日、暑くて全然眠れませんでした。","example_zh":"A：你看起來很睏耶。 B：昨天熱到完全睡不著。","note":"「全然＋否定」＝完全不…；抱怨睡眠的高頻句。","level":"N5"},{"text":"あまりテレビを見ません","reading":"あまり テレビを みません amari terebi o mimasen","zh":"我不太看電視","topic":"日常閒聊","example":"A：あのニュース、見ましたか。 B：すみません、あまりテレビを見ません。","example_zh":"A：那個新聞你看了嗎？ B：抱歉，我不太看電視。","note":"「あまり＋否定」＝不太…；現代人常說改看YouTube。","level":"N5"},{"text":"最近、あまり寝ていません","reading":"さいきん、あまり ねていません saikin, amari nete imasen","zh":"最近都沒什麼睡","topic":"日常閒聊","example":"A：顔色が悪いですよ。 B：最近、あまり寝ていません。","example_zh":"A：你臉色不太好耶。 B：最近都沒什麼睡。","note":"「寝ていません」表示持續的狀態；學生上班族都常說。","level":"N5"},{"text":"熱があります","reading":"ねつが あります netsu ga arimasu","zh":"我發燒了","topic":"日常閒聊","example":"今日は熱があるから、休みます。","example_zh":"今天發燒了，所以請假。","note":"「熱がある」＝有發燒；請假、就醫都會用到。","level":"N5"},{"text":"のどが痛いです","reading":"のどが いたいです nodo ga itai desu","zh":"我喉嚨痛","topic":"日常閒聊","example":"のどが痛いから、今日はあまり話せません。","example_zh":"喉嚨痛，今天不太能說話。","note":"感冒三句組：頭が痛い、熱がある、のどが痛い。","level":"N5"},{"text":"花粉症です","reading":"かふんしょうです kafunshou desu","zh":"我有花粉症","topic":"日常閒聊","example":"A：くしゃみが多いですね。 B：花粉症です。春はつらいです。","example_zh":"A：你一直打噴嚏耶。 B：我有花粉症，春天很難受。","note":"日本春天的國民話題；台灣人去日本旅遊也可能中招。","level":"N5"},{"text":"元気が出ました","reading":"げんきが でました genki ga demashita","zh":"我打起精神來了","topic":"日常閒聊","example":"おいしいものを食べて、元気が出ました。","example_zh":"吃了好吃的東西，整個人都有精神了。","note":"「元気が出る」＝恢復精神；感謝別人鼓勵時也可說。","level":"N5"},{"text":"緊張しています","reading":"きんちょうしています kinchou shite imasu","zh":"我好緊張","topic":"日常閒聊","example":"A：明日は面接ですね。 B：はい、今から緊張しています。","example_zh":"A：明天就是面試了耶。 B：對，現在就開始緊張了。","note":"「緊張する」＝緊張；考試、面試、告白前都用得到。","level":"N5"},{"text":"楽しみです","reading":"たのしみです tanoshimi desu","zh":"好期待喔","topic":"日常閒聊","example":"A：来週、日本に行きます。 B：いいなあ、楽しみですね。","example_zh":"A：我下週要去日本。 B：真好～很期待吧。","note":"表達期待的萬用句；「楽しみにしています」是更禮貌的版本。","level":"N5"},{"text":"びっくりしました","reading":"びっくりしました bikkuri shimashita","zh":"嚇我一跳","topic":"日常閒聊","example":"A：実は来月、結婚します。 B：えっ、びっくりしました！おめでとう！","example_zh":"A：其實我下個月要結婚了。 B：欸，嚇我一跳！恭喜！","note":"聽到意外消息的第一反應；口語也常只說「びっくりした！」。","level":"N5"},{"text":"残念です","reading":"ざんねんです zannen desu","zh":"好可惜","topic":"日常閒聊","example":"A：明日のイベント、中止だそうです。 B：えー、残念です。","example_zh":"A：聽說明天的活動取消了。 B：欸～好可惜。","note":"表達遺憾的基本句；「残念ですね」可以安慰別人。","level":"N5"},{"text":"大変でしたね","reading":"たいへんでしたね taihen deshita ne","zh":"你辛苦了／真是不容易","topic":"日常閒聊","example":"A：昨日、終電を逃しました。 B：それは大変でしたね。","example_zh":"A：我昨天錯過末班車了。 B：那真是辛苦你了。","note":"聽別人抱怨後的同理回應，會話中的重要接話句。","level":"N5"},{"text":"眠いから、先に寝ますね","reading":"ねむいから、さきに ねますね nemui kara, saki ni nemasu ne","zh":"我睏了，先去睡囉","topic":"日常閒聊","example":"もう十二時ですね。眠いから、先に寝ますね。おやすみ。","example_zh":"已經十二點了耶。我睏了，先去睡囉，晚安。","note":"「い形容詞＋から」表原因；聊天收尾的自然說法。","level":"N5"},{"text":"暑いから、エアコンをつけましょう","reading":"あついから、エアコンを つけましょう atsui kara, eakon o tsukemashou","zh":"好熱，開冷氣吧","topic":"日常閒聊","example":"A：暑いから、エアコンをつけましょう。 B：お願いします。","example_zh":"A：好熱，開冷氣吧。 B：麻煩了。","note":"「つけます」＝打開（電器）；關掉是「消します」。","level":"N5"},{"text":"どうしたんですか","reading":"どうしたんですか doushitan desu ka","zh":"你怎麼了？","topic":"日常閒聊","example":"A：どうしたんですか。元気がないですね。 B：ちょっと疲れました。","example_zh":"A：你怎麼了？看起來沒什麼精神耶。 B：我有點累了。","note":"看到對方不對勁時關心用；朋友之間說「どうしたの？」。","level":"N5"},{"text":"何かあったんですか","reading":"なにか あったんですか nanika attan desu ka","zh":"發生什麼事了嗎？","topic":"日常閒聊","example":"A：はあ…。 B：何かあったんですか。","example_zh":"A：唉……。 B：發生什麼事了嗎？","note":"比「どうしたんですか」更深入的關心；「あった」是「ある」的過去形。","level":"N5"},{"text":"大丈夫ですか","reading":"だいじょうぶですか daijoubu desu ka","zh":"你還好嗎？","topic":"日常閒聊","example":"A：大丈夫ですか。顔色が悪いですよ。 B：大丈夫です。ありがとう。","example_zh":"A：你還好嗎？臉色不太好耶。 B：我沒事，謝謝。","note":"萬用關心句；回答「大丈夫です」也可用來婉拒別人的好意。","level":"N5"},{"text":"心配しないでください","reading":"しんぱいしないで ください shinpai shinaide kudasai","zh":"請不要擔心","topic":"日常閒聊","example":"A：一人で帰れますか。 B：はい、心配しないでください。","example_zh":"A：你一個人回得去嗎？ B：可以，請不要擔心。","note":"「〜ないでください」＝請不要…；安撫別人的常用句。","level":"N5"},{"text":"疲れているみたいですね","reading":"つかれている みたいですね tsukarete iru mitai desu ne","zh":"你看起來很累耶","topic":"日常閒聊","example":"A：疲れているみたいですね。 B：ええ、最近残業が多くて。","example_zh":"A：你看起來很累耶。 B：對啊，最近常加班。","note":"「〜みたい」＝看起來像…；體貼地觀察對方狀態。","level":"N5"},{"text":"週末はどうでしたか","reading":"しゅうまつは どうでしたか shuumatsu wa dou deshita ka","zh":"你週末過得怎麼樣？","topic":"日常閒聊","example":"A：週末はどうでしたか。 B：友達と夜市に行きました。楽しかったです。","example_zh":"A：你週末過得怎麼樣？ B：和朋友去了夜市，很開心。","note":"「どうでしたか」問過去的感想；週一見面的萬用開場。","level":"N5"},{"text":"まあまあです","reading":"まあまあです maamaa desu","zh":"還好、普普通通","topic":"日常閒聊","example":"A：最近、仕事はどうですか。 B：まあまあです。","example_zh":"A：最近工作怎麼樣？ B：還好，普普通通。","note":"不好不壞時的萬用回答；語氣輕鬆自然。","level":"N5"},{"text":"相変わらずです","reading":"あいかわらずです aikawarazu desu","zh":"老樣子","topic":"日常閒聊","example":"A：最近どうですか。 B：相変わらずです。忙しいです。","example_zh":"A：最近怎麼樣？ B：老樣子，很忙。","note":"「相変わらず」＝和以前一樣；久違見面的自然回答。","level":"N5"},{"text":"それはよかった","reading":"それは よかった sore wa yokatta","zh":"那真是太好了（常體）","topic":"日常閒聊","example":"A：熱、下がったよ。 B：それはよかった。","example_zh":"A：我退燒了喔。 B：那真是太好了。","note":"朋友間的常體回應；禮貌場合說「それはよかったですね」。","level":"N5"},{"text":"今、話せますか","reading":"いま、はなせますか ima, hanasemasu ka","zh":"現在方便講話嗎？","topic":"網路聊天用語","example":"（LINEで）今、話せますか。ちょっと相談があります。","example_zh":"（LINE上）現在方便講話嗎？有點事想找你商量。","note":"打電話或語音前先確認對方方便，網路時代的禮貌。","level":"N5"},{"text":"あとで返信します","reading":"あとで へんしんします atode henshin shimasu","zh":"我晚點回你","topic":"網路聊天用語","example":"今、仕事中だから、あとで返信します。","example_zh":"我現在在上班，晚點回你。","note":"「あとで」＝等一下、之後；先讀不回時的緩衝句。","level":"N5"},{"text":"スクショ","reading":"スクショ sukusho","zh":"截圖","topic":"網路聊天用語","example":"その画面、スクショして送ってください。","example_zh":"那個畫面截圖傳給我。","note":"「スクリーンショット」的縮寫；動詞化說「スクショする」。","level":"N5"},{"text":"グループに招待してもいいですか","reading":"グループに しょうたいしても いいですか guruupu ni shoutai shite mo ii desu ka","zh":"可以把你加進群組嗎？","topic":"網路聊天用語","example":"A：旅行のグループに招待してもいいですか。 B：はい、お願いします。","example_zh":"A：可以把你加進旅遊群組嗎？ B：好，麻煩你了。","note":"LINE群組文化日台共通；「招待する」＝邀請。","level":"N5"},{"text":"通知に気づきませんでした","reading":"つうちに きづきませんでした tsuuchi ni kizukimasen deshita","zh":"我沒注意到通知","topic":"網路聊天用語","example":"ごめん、通知に気づきませんでした。今見ました。","example_zh":"抱歉，我沒注意到通知，剛剛才看到。","note":"晚回訊息的萬用理由；「気づく」＝發現、注意到。","level":"N5"},{"text":"電波が悪いです","reading":"でんぱが わるいです denpa ga warui desu","zh":"訊號不好","topic":"網路聊天用語","example":"すみません、電波が悪いです。声が聞こえません。","example_zh":"不好意思，訊號不好，聽不到你的聲音。","note":"「電波」＝訊號；視訊、通話斷斷續續時必說。","level":"N5"},{"text":"充電が切れそうです","reading":"じゅうでんが きれそうです juuden ga kiresou desu","zh":"手機快沒電了","topic":"網路聊天用語","example":"充電が切れそうだから、また後でね。","example_zh":"手機快沒電了，晚點再聊喔。","note":"「〜そうです」＝眼看就要…；結束聊天的常見理由。","level":"N5"},{"text":"リンクを送りますね","reading":"リンクを おくりますね rinku o okurimasu ne","zh":"我把連結傳給你喔","topic":"網路聊天用語","example":"あの店のリンクを送りますね。見てみてください。","example_zh":"我把那家店的連結傳給你喔，看看吧。","note":"「送ります」＝傳送；句尾「ね」表示知會對方。","level":"N5"},{"text":"どういう意味ですか","reading":"どういう いみですか dou iu imi desu ka","zh":"是什麼意思？","topic":"網路聊天用語","example":"A：「草」ってどういう意味ですか。 B：「笑える」という意味です。","example_zh":"A：「草」是什麼意思？ B：就是「好笑」的意思。","note":"看不懂流行語、縮寫時必用；「〜って」＝所謂的…。","level":"N5"},{"text":"打ち間違えました","reading":"うちまちがえました uchimachigaemashita","zh":"我打錯字了","topic":"網路聊天用語","example":"すみません、さっきのは打ち間違えました。","example_zh":"抱歉，剛剛那個是打錯字了。","note":"「打つ＋間違える」＝打錯；傳錯訊息後的補救句。","level":"N5"},{"text":"それな","reading":"それな sorena","zh":"就是說啊（網路流行語）","topic":"網路聊天用語","example":"A：月曜日、学校行きたくない…。 B：それな。","example_zh":"A：星期一好不想上學……。 B：就是說啊。","note":"年輕人表示強烈同意的流行語，只用於熟人和網路聊天。","level":"N5"},{"text":"週に一回","reading":"しゅうに いっかい shuu ni ikkai","zh":"一週一次","topic":"數字時間","example":"週に一回、日本語のレッスンがあります。","example_zh":"我一週上一次日語課。","note":"「期間＋に＋次數」表頻率；週に二回、月に一回同型。","level":"N5"},{"text":"一日三回","reading":"いちにち さんかい ichinichi sankai","zh":"一天三次","topic":"數字時間","example":"この薬は一日三回、食後に飲んでください。","example_zh":"這個藥請一天三次、飯後服用。","note":"藥袋上的高頻用語；「食後」＝飯後，「食前」＝飯前。","level":"N5"},{"text":"毎週","reading":"まいしゅう maishuu","zh":"每週","topic":"數字時間","example":"毎週金曜日に日本語の授業があります。","example_zh":"每週五有日語課。","note":"「毎＋時間單位」系列：毎日、毎週、毎月、毎年。","level":"N5"},{"text":"毎月","reading":"まいつき maitsuki","zh":"每個月","topic":"數字時間","example":"毎月、給料日は二十五日です。","example_zh":"每個月的發薪日是二十五號。","note":"讀「まいつき」；「毎月一回」＝每月一次。","level":"N5"},{"text":"毎年","reading":"まいとし maitoshi","zh":"每年","topic":"數字時間","example":"毎年、家族と日本に旅行に行きます。","example_zh":"我每年都和家人去日本旅行。","note":"口語多讀「まいとし」，「まいねん」也通。","level":"N5"},{"text":"さっき","reading":"さっき sakki","zh":"剛剛","topic":"數字時間","example":"さっき駅で先生に会いました。","example_zh":"我剛剛在車站遇到老師。","note":"口語高頻詞；比「先ほど」隨性，朋友之間用這個。","level":"N5"},{"text":"あとで","reading":"あとで atode","zh":"等一下、待會","topic":"數字時間","example":"A：今、いいですか。 B：ごめん、あとでもいいですか。","example_zh":"A：現在方便嗎？ B：抱歉，可以等一下嗎？","note":"「じゃ、またあとで」＝待會見；會話膠水詞。","level":"N5"},{"text":"もうすぐ","reading":"もうすぐ mousugu","zh":"快要、馬上就","topic":"數字時間","example":"もうすぐ誕生日ですね。何がほしいですか。","example_zh":"你生日快到了耶，想要什麼？","note":"「もうすぐ着きます」＝快到了；等人傳訊息超常用。","level":"N5"},{"text":"これから","reading":"これから korekara","zh":"接下來、現在開始","topic":"數字時間","example":"A：今どこですか。 B：これから家を出ます。","example_zh":"A：你現在在哪？ B：我現在正要出門。","note":"「これからもよろしく」＝今後也請多指教，另一個高頻用法。","level":"N5"},{"text":"今週末","reading":"こんしゅうまつ konshuumatsu","zh":"這個週末","topic":"數字時間","example":"今週末、一緒に買い物に行きませんか。","example_zh":"這個週末要不要一起去逛街？","note":"「今週＋末」＝本週末；約人的高頻時間詞。","level":"N5"},{"text":"半分","reading":"はんぶん hanbun","zh":"一半","topic":"數字時間","example":"大きいから、半分ずつ食べましょう。","example_zh":"太大了，我們一人一半吃吧。","note":"「半分ずつ」＝各一半；分食物時的可愛用法。","level":"N5"},{"text":"いくらですか","reading":"いくらですか ikura desu ka","zh":"多少錢？","topic":"數字時間","example":"A：すみません、これはいくらですか。 B：五百円です。","example_zh":"A：不好意思，這個多少錢？ B：五百日圓。","note":"購物必備第一句；「いくら」專問價錢。","level":"N5"},{"text":"全部でいくらですか","reading":"ぜんぶで いくらですか zenbu de ikura desu ka","zh":"總共多少錢？","topic":"數字時間","example":"A：全部でいくらですか。 B：全部で三千円です。","example_zh":"A：總共多少錢？ B：總共三千日圓。","note":"「全部で」＝合計；結帳時確認總額用。","level":"N5"},{"text":"千円です","reading":"せんえんです sen en desu","zh":"一千日圓","topic":"數字時間","example":"A：このTシャツはいくらですか。 B：千円です。安いでしょう。","example_zh":"A：這件T恤多少錢？ B：一千日圓，很便宜吧。","note":"金額說法：百円、千円、一万円；「円」讀「えん」。","level":"N5"},{"text":"十分ぐらいかかります","reading":"じゅっぷんぐらい かかります juppun gurai kakarimasu","zh":"大概要十分鐘","topic":"數字時間","example":"A：時間、どのくらいかかりますか。 B：十分ぐらいかかります。","example_zh":"A：要花多久時間？ B：大概十分鐘。","note":"「ぐらい」＝大約；「十分」口語常讀「じゅっぷん」。","level":"N5"},{"text":"何曜日ですか","reading":"なんようびですか nanyoubi desu ka","zh":"星期幾？","topic":"數字時間","example":"A：テストは何曜日ですか。 B：木曜日です。","example_zh":"A：考試是星期幾？ B：星期四。","note":"「何曜日」問星期；日期用「何日」，時間用「何時」。","level":"N5"},{"text":"そろそろ時間です","reading":"そろそろ じかんです sorosoro jikan desu","zh":"時間差不多了","topic":"數字時間","example":"A：そろそろ時間です。行きましょうか。 B：はい。","example_zh":"A：時間差不多了，我們走吧？ B：好。","note":"提醒該出發、該結束的委婉說法；「そろそろ」是高頻副詞。","level":"N5"},{"text":"試着してもいいですか","reading":"しちゃくしても いいですか shichaku shite mo ii desu ka","zh":"可以試穿嗎？","topic":"求助應急","example":"A：試着してもいいですか。 B：はい、こちらへどうぞ。","example_zh":"A：可以試穿嗎？ B：可以，這邊請。","note":"逛服飾店必備；「試着室」＝試衣間。","level":"N5"},{"text":"もっと大きいサイズはありますか","reading":"もっと おおきい サイズは ありますか motto ookii saizu wa arimasu ka","zh":"有大一點的尺寸嗎？","topic":"求助應急","example":"A：もっと大きいサイズはありますか。 B：確認しますね。","example_zh":"A：有大一點的尺寸嗎？ B：我幫您確認一下。","note":"「もっと＋形容詞」＝更…；小一點說「もっと小さいサイズ」。","level":"N5"},{"text":"別の色はありますか","reading":"べつの いろは ありますか betsu no iro wa arimasu ka","zh":"有別的顏色嗎？","topic":"求助應急","example":"A：別の色はありますか。 B：白と黒がございます。","example_zh":"A：有別的顏色嗎？ B：有白色和黑色。","note":"「別の＋名詞」＝其他的…；購物比較時常用。","level":"N5"},{"text":"見ているだけです","reading":"みている だけです mite iru dake desu","zh":"我只是看看","topic":"求助應急","example":"A：何かお探しですか。 B：見ているだけです。ありがとうございます。","example_zh":"A：請問在找什麼嗎？ B：我只是看看，謝謝。","note":"店員來搭話時的萬用回應；「だけ」＝只是。","level":"N5"},{"text":"これにします","reading":"これに します kore ni shimasu","zh":"我要這個（決定購買）","topic":"求助應急","example":"A：どちらになさいますか。 B：これにします。","example_zh":"A：請問要哪一個？ B：我要這個。","note":"「〜にします」表示決定；點餐選商品都用這句。","level":"N5"},{"text":"袋をください","reading":"ふくろを ください fukuro o kudasai","zh":"請給我袋子","topic":"求助應急","example":"A：袋はご利用ですか。 B：はい、袋をください。","example_zh":"A：請問需要袋子嗎？ B：要，請給我袋子。","note":"日本塑膠袋要收費；不用時說「袋はいりません」。","level":"N5"},{"text":"免税できますか","reading":"めんぜい できますか menzei dekimasu ka","zh":"可以退稅嗎？","topic":"求助應急","example":"A：免税できますか。 B：はい、パスポートをお願いします。","example_zh":"A：可以退稅嗎？ B：可以，請出示護照。","note":"觀光購物必備；免稅需要出示護照。","level":"N5"},{"text":"レシートをください","reading":"レシートを ください reshiito o kudasai","zh":"請給我收據","topic":"求助應急","example":"すみません、レシートをください。","example_zh":"不好意思，請給我收據。","note":"「レシート」＝明細收據；報帳用的正式收據是「領収書」。","level":"N5"},{"text":"両替はどこでできますか","reading":"りょうがえは どこで できますか ryougae wa doko de dekimasu ka","zh":"哪裡可以換錢？","topic":"求助應急","example":"A：両替はどこでできますか。 B：二階の銀行でできますよ。","example_zh":"A：哪裡可以換錢？ B：二樓的銀行可以喔。","note":"「両替」＝換匯；「どこでできますか」問可執行的地點。","level":"N5"},{"text":"ここから駅までどうやって行きますか","reading":"ここから えきまで どうやって いきますか koko kara eki made douyatte ikimasu ka","zh":"從這裡到車站要怎麼走？","topic":"求助應急","example":"A：ここから駅までどうやって行きますか。 B：この道をまっすぐ行ってください。","example_zh":"A：從這裡到車站要怎麼走？ B：這條路直走就到了。","note":"「から〜まで」＝從…到…；問路的完整句型。","level":"N5"},{"text":"何番線ですか","reading":"なんばんせんですか nanbansen desu ka","zh":"在幾號月台？","topic":"求助應急","example":"A：大阪行きは何番線ですか。 B：三番線です。","example_zh":"A：往大阪的車在幾號月台？ B：三號月台。","note":"「〜番線」＝…號月台；「〜行き」＝開往…。","level":"N5"},{"text":"この電車は新宿に行きますか","reading":"この でんしゃは しんじゅくに いきますか kono densha wa shinjuku ni ikimasu ka","zh":"這班電車有到新宿嗎？","topic":"求助應急","example":"A：すみません、この電車は新宿に行きますか。 B：はい、行きますよ。","example_zh":"A：不好意思，這班電車有到新宿嗎？ B：有，會到喔。","note":"上車前跟站務員或乘客確認，搭錯車前的救命句。","level":"N5"},{"text":"終電は何時ですか","reading":"しゅうでんは なんじですか shuuden wa nanji desu ka","zh":"末班車是幾點？","topic":"求助應急","example":"A：終電は何時ですか。 B：十二時半です。","example_zh":"A：末班車是幾點？ B：十二點半。","note":"「終電」＝末班電車；日本電車沒有跑整夜，要注意。","level":"N5"},{"text":"切符はどこで買えますか","reading":"きっぷは どこで かえますか kippu wa doko de kaemasu ka","zh":"車票要在哪裡買？","topic":"求助應急","example":"A：切符はどこで買えますか。 B：あそこの券売機で買えます。","example_zh":"A：車票要在哪裡買？ B：在那邊的售票機可以買。","note":"「買えます」是「買います」的可能形；「券売機」＝售票機。","level":"N5"},{"text":"薬局はどこですか","reading":"やっきょくは どこですか yakkyoku wa doko desu ka","zh":"藥局在哪裡？","topic":"求助應急","example":"A：すみません、薬局はどこですか。 B：あの角にありますよ。","example_zh":"A：不好意思，藥局在哪裡？ B：在那個轉角喔。","note":"「ドラッグストア」也通；身體不舒服時先找藥局。","level":"N5"},{"text":"頭痛薬はありますか","reading":"ずつうやくは ありますか zutsuuyaku wa arimasu ka","zh":"有頭痛藥嗎？","topic":"求助應急","example":"A：頭痛薬はありますか。 B：はい、こちらです。","example_zh":"A：有頭痛藥嗎？ B：有，在這邊。","note":"「〜薬」系列：風邪薬（感冒藥）、胃薬（胃藥）。","level":"N5"},{"text":"熱があるから、今日は休みたいです","reading":"ねつが あるから、きょうは やすみたいです netsu ga aru kara, kyou wa yasumitai desu","zh":"因為發燒，今天想請假","topic":"求助應急","example":"すみません、熱があるから、今日は休みたいです。","example_zh":"不好意思，因為發燒，今天想請假。","note":"「から」帶理由＋「〜たい」表達請求；請假的完整句。","level":"N5"},{"text":"病院は近くにありますか","reading":"びょういんは ちかくに ありますか byouin wa chikaku ni arimasu ka","zh":"附近有醫院嗎？","topic":"求助應急","example":"A：病院は近くにありますか。 B：はい、歩いて五分です。","example_zh":"A：附近有醫院嗎？ B：有，走路五分鐘。","note":"「近くに〜ありますか」問附近設施，換名詞就能問遍。","level":"N5"},{"text":"けがをしました","reading":"けがを しました kega o shimashita","zh":"我受傷了","topic":"求助應急","example":"転んで、足にけがをしました。","example_zh":"我跌倒，腳受傷了。","note":"固定搭配「けがをする」；「転ぶ」＝跌倒。","level":"N5"},{"text":"パスポートをなくしました","reading":"パスポートを なくしました pasupooto o nakushimashita","zh":"我的護照弄丟了","topic":"求助應急","example":"すみません、パスポートをなくしました。どうすればいいですか。","example_zh":"不好意思，我的護照弄丟了，該怎麼辦？","note":"「なくしました」＝弄丟了；「どうすればいいですか」＝該怎麼辦。","level":"N5"},{"text":"ここに書いてもらえますか","reading":"ここに かいて もらえますか koko ni kaite moraemasu ka","zh":"可以幫我寫在這裡嗎？","topic":"求助應急","example":"すみません、聞き取れないので、ここに書いてもらえますか。","example_zh":"不好意思，我聽不懂，可以幫我寫在這裡嗎？","note":"聽不懂時請對方筆談，台灣人靠漢字就能懂大半，超實用。","level":"N5"},{"text":"やばい","reading":"やばい yabai","zh":"糟了／超讚（萬用感嘆）","topic":"日常閒聊","example":"このラーメン、やばい！うますぎ。","example_zh":"這碗拉麵太狂了！好吃到不行。","note":"年輕人的萬用詞，可表「糟糕」也可表「超棒」，全靠語氣和情境分辨；正式場合、對長輩不要用。","distractors_zh":["好可惜喔","太便宜了吧","好噁心喔","馬馬虎虎","太無聊了","還好而已"],"level":"N5"},{"text":"えー！？","reading":"えー！？ ee!?","zh":"咦——！？（驚訝）","topic":"日常閒聊","example":"えー！？本当に？","example_zh":"咦——！？真的假的？","note":"聽到意外消息的反射反應，朋友間高頻，音拉得越長越驚訝；對長輩改說「えっ、そうなんですか」。","distractors_zh":["呃，我想想","欸，你聽我說","好啊，沒問題","算了吧","什麼嘛，原來如此","喂！站住"],"level":"N5"},{"text":"うそ！","reading":"うそ uso","zh":"不會吧！／騙人！","topic":"日常閒聊","example":"A：明日テストだよ。 B：うそ！聞いてない！","example_zh":"A：明天要考試喔。 B：不會吧！沒人跟我說！","note":"表示驚訝的反應詞，不是真的在指責對方說謊；朋友間高頻。對長輩用「本当ですか」。","distractors_zh":["你說謊要道歉","這是謊報","小聲一點","真的喔","我不相信你這個人","開玩笑的啦"],"level":"N5"},{"text":"へえ〜","reading":"へえ hee","zh":"是喔～（表示新奇）","topic":"日常閒聊","example":"へえ、台湾ってそんなに近いんだ。","example_zh":"是喔～原來台灣這麼近啊。","note":"聽到新資訊時的相槌（附和聲），拉長音表示越感興趣；面無表情地說會顯得敷衍。朋友間、同事間都可用。","distractors_zh":["蛤？你說什麼","哦，我早就知道了","欸，等一下","是的，遵命","哇，嚇死我了","嗯哼，然後呢"],"level":"N5"},{"text":"なるほど","reading":"なるほど naruhodo","zh":"原來如此","topic":"日常閒聊","example":"なるほど、そういうことか。","example_zh":"原來如此，是這麼回事啊。","note":"表示理解對方說明；朋友、同事間都可用，但對長輩連發「なるほどですね」會被視為輕率，改說「勉強になります」。","distractors_zh":["果然沒錯","不出所料","原來是你","道理何在？","大概吧","我不太懂"],"level":"N5"},{"text":"たしかに","reading":"たしかに tashika ni","zh":"確實／有道理","topic":"日常閒聊","example":"A：夜市、平日のほうが空いてるよ。 B：たしかに。","example_zh":"A：夜市平日比較不擠喔。 B：確實。","note":"同意對方論點的高頻回應，年輕人常單獨一句「たしかに」；比「そうですね」更有「被你說服了」的味道。","distractors_zh":["我確認一下","確定要這樣嗎？","的確很奇怪","請確實執行","沒錯，是我做的","應該不會吧"],"level":"N5"},{"text":"だよね","reading":"だよね da yo ne","zh":"就是說啊／對吧","topic":"日常閒聊","example":"A：この店、高くない？ B：だよね。","example_zh":"A：這家店會不會太貴？ B：就是說啊。","note":"附和、尋求共鳴的萬用回應，女生也常說「よね〜」；只對朋友用，對長輩改說「そうですよね」。","distractors_zh":["是這樣嗎？","才不是呢","隨便你啦","我說得對吧？","原來如此","你確定？"],"level":"N5"},{"text":"わかる〜","reading":"わかる wakaru","zh":"我懂～（超有同感）","topic":"日常閒聊","example":"A：月曜日って眠いよね。 B：わかる〜。","example_zh":"A：星期一就是特別睏。 B：我懂～。","note":"表達共鳴的高頻反應詞，拉長音共感越強；網路上還會寫成「わかりみが深い」。朋友間專用。","distractors_zh":["我知道了，會照辦","我認識他","我來說明","我會查清楚","我猜得到","原來你懂喔"],"level":"N5"},{"text":"びっくりした！","reading":"びっくりした bikkuri shita","zh":"嚇我一跳！","topic":"日常閒聊","example":"急に声かけないでよ、びっくりした！","example_zh":"不要突然叫我啦，嚇我一跳！","note":"受驚後脫口而出的反應；對長輩可加禮貌說「びっくりしました」。","distractors_zh":["太令人失望了","我嚇唬你的","好期待喔","真是巧合","別嚇唬我","我心臟不好"],"level":"N5"},{"text":"よかった！","reading":"よかった yokatta","zh":"太好了！","topic":"日常閒聊","example":"財布あった？よかった！","example_zh":"錢包找到了？太好了！","note":"鬆一口氣或替對方開心時用；「〜てよかった」＝還好有…。對長輩說「よかったですね」。","distractors_zh":["好險我沒去","那就好，再見","以前比較好","算你好運","太好笑了","做得好"],"level":"N5"},{"text":"ドンマイ","reading":"ドンマイ donmai","zh":"別在意／沒關係啦","topic":"日常閒聊","example":"A：ごめん、負けちゃった。 B：ドンマイドンマイ！","example_zh":"A：抱歉，我輸了。 B：別在意別在意！","note":"源自英語 don't mind，安慰隊友、朋友失誤時用，運動場上高頻；只用於同輩或晚輩，對長輩不適合。","distractors_zh":["是我的錯","不要碰我","加油好嗎","你很煩欸","別客氣","輸不起喔"],"level":"N5"},{"text":"えっと…","reading":"えっと… etto...","zh":"呃…／我想想…","topic":"日常閒聊","example":"えっと、駅は…あっちです。","example_zh":"呃…車站是…在那邊。","note":"思考時的填充詞，用來爭取時間，比沉默自然；面試等正式場合用太多會顯得不俐落。","distractors_zh":["欸，你過來","等等我","也就是說","總而言之","哇，嚇我一跳","打招呼用語"],"level":"N5"},{"text":"あのー","reading":"あのー anoo","zh":"那個…（開口搭話）","topic":"日常閒聊","example":"あのー、ちょっといいですか。","example_zh":"那個…可以打擾一下嗎？","note":"搭話、開口前的緩衝詞，比直接切入柔和，跟中文「那個…」功能幾乎相同；任何場合都可用。","distractors_zh":["那個東西給我","你聽我說完","喂！站住","嗯，我同意","那位是誰？","久等了"],"level":"N5"},{"text":"なんか","reading":"なんか nanka","zh":"總覺得／就是…","topic":"日常閒聊","example":"なんか、今日眠いんだよね。","example_zh":"總覺得今天特別睏。","note":"口語超高頻的填充詞，放句首緩和開場；連發太多會顯得沒條理，正式報告時要避免。","distractors_zh":["你說什麼？","沒什麼事","有什麼嗎？","什麼嘛！","七個左右","任何東西都行"],"level":"N5"},{"text":"とりあえず","reading":"とりあえず toriaezu","zh":"總之先／姑且","topic":"日常閒聊","example":"とりあえずビールで！","example_zh":"總之先來啤酒！","note":"「先做再說」的語感，居酒屋名句「とりあえずビール」；口語書面都通用，年輕人更省略成「とりま」。","distractors_zh":["立刻馬上","從頭開始","總而言之（下結論）","不管怎樣都拒絕","暫停一下","輪流來"],"level":"N5"},{"text":"いいなあ","reading":"いいなあ ii naa","zh":"好好喔／好羨慕","topic":"日常閒聊","example":"来週日本に行くの？いいなあ。","example_zh":"你下週要去日本？好好喔。","note":"表達羨慕的高頻感嘆，「なあ」帶自言自語式的餘韻，不帶酸味；朋友間用。","distractors_zh":["那樣不行啦","真是個好人","可以嗎？","太好了，恭喜","不用了，謝謝","好啊，走吧"],"level":"N5"},{"text":"しんどい","reading":"しんどい shindoi","zh":"好累／好辛苦","topic":"日常閒聊","example":"今週ずっと残業でしんどい…。","example_zh":"這週一直加班，累爆了…。","note":"原為關西方言，現已全國通用；身體累、心累都能用，年輕人也拿來形容精神上的辛苦。對上司改說「少し疲れました」。","distractors_zh":["好無聊","好緊張","好嚴格","好麻煩","身體很結實","心情很好"],"level":"N5"},{"text":"めんどくさい","reading":"めんどくさい mendokusai","zh":"好麻煩／懶得弄","topic":"日常閒聊","example":"雨の日の洗濯、めんどくさいなあ。","example_zh":"下雨天洗衣服真的好麻煩。","note":"「面倒くさい」的口語連讀，更懶的說法是「めんどい」；在職場說出口會顯得沒幹勁，注意場合。","distractors_zh":["好複雜難懂","好臭喔","好可怕","時間不夠用","好無趣","人手不足"],"level":"N5"},{"text":"食べちゃった","reading":"たべちゃった tabechatta","zh":"（不小心）吃掉了","topic":"日常閒聊","example":"ごめん、最後のケーキ食べちゃった。","example_zh":"抱歉，最後一塊蛋糕被我吃掉了。","note":"「〜てしまった→〜ちゃった」的縮約形，帶「不小心／糟糕」的語感，各種動詞都能套用；朋友、家人間的口語。","distractors_zh":["我想吃","我正在吃","我吃不下了","被別人吃掉了","我請客吃飯了","我咬一口就停了"],"level":"N5"},{"text":"もう行かなきゃ","reading":"もういかなきゃ mou ikanakya","zh":"我得走了","topic":"日常閒聊","example":"やば、終電！もう行かなきゃ。","example_zh":"糟了，末班車！我得走了。","note":"「〜なければならない→〜なきゃ」的縮約形，聚會先走時的高頻句；對長輩說「そろそろ失礼します」。","distractors_zh":["我不想去","我已經到了","你快走啦","我還能再待一下","我不去了喔","我去去就回"],"level":"N5"},{"text":"いいじゃん！","reading":"いいじゃん ii jan","zh":"不錯啊！／很好啊！","topic":"日常閒聊","example":"その服、いいじゃん！","example_zh":"那件衣服不錯嘛！","note":"「〜じゃない→〜じゃん」是關東起源的口語，稱讚、贊同都可用；只對同輩或晚輩使用，對長輩失禮。","distractors_zh":["不太行吧","這不是很奇怪嗎","算了吧","隨便啦","不錯是不錯，可是…","太誇張了吧"],"level":"N5"},{"text":"なんだっけ？","reading":"なんだっけ nan da kke","zh":"是什麼來著？","topic":"日常閒聊","example":"あの店の名前、なんだっけ？","example_zh":"那家店叫什麼來著？","note":"「〜っけ」用於想不起來、向自己或對方再確認，如「明日だっけ？（是明天來著？）」；朋友間高頻。","distractors_zh":["到底是什麼！","什麼都可以","你說什麼？","竟然是這樣","就是那個啊","什麼時候來著？"],"level":"N5"},{"text":"かも","reading":"かも kamo","zh":"說不定／可能","topic":"日常閒聊","example":"明日、雨かも。","example_zh":"明天說不定會下雨。","note":"「かもしれない」的省略，句尾輕輕帶過，LINE 上超高頻；正式場合用完整的「かもしれません」。","distractors_zh":["鴨子","絕對是","但願如此","大概不會","看情況再說","應該說"],"level":"N5"},{"text":"エモい","reading":"エモい emoi","zh":"有 fu／莫名感動","topic":"網路聊天用語","example":"夕日の写真、めっちゃエモい。","example_zh":"夕陽的照片超有 fu 的。","note":"源自英語 emotional，形容戳中情緒、帶懷舊感傷氛圍的事物；年輕人用語，長輩多半聽不懂。","distractors_zh":["好噁心","好時髦","好樸素","好熱鬧","畫質很好","太吵了"],"level":"N5"},{"text":"ガチで","reading":"ガチで gachi de","zh":"認真地／真的（不是開玩笑）","topic":"網路聊天用語","example":"このゲーム、ガチで面白いよ。","example_zh":"這遊戲是真的好玩。","note":"源自相撲用語「ガチンコ（真劍勝負）」，強調不是客套或玩笑；年輕人用語，正式場合用「本当に」。","distractors_zh":["偶爾","順便","勉強算是","開玩笑地","隨便做做","幾乎不"],"level":"N5"},{"text":"神","reading":"かみ kami","zh":"神級／超讚","topic":"網路聊天用語","example":"このアプリ、神なんだけど。","example_zh":"這個 APP 也太神了吧。","note":"把人事物捧為「神」表示極度讚賞，如「神対応（神級應對）」「神回（神集數）」；網路與年輕人用語，對長輩或正式場合不要用。","distractors_zh":["紙","頭髮","上面","雷聲","拜拜用品","髮型師"],"level":"N5"},{"text":"ワンチャン","reading":"ワンチャン wanchan","zh":"搞不好有機會","topic":"網路聊天用語","example":"今から行けば、ワンチャン間に合うかも。","example_zh":"現在出發的話，搞不好還來得及。","note":"one chance 的縮語，表示「說不定、有一線機會」；大學生高頻用語，長輩聽不懂，正式場合不可用。","distractors_zh":["小狗狗","一次機會都沒有","穩贏的","一天一次","單人房","再一次"],"level":"N5"},{"text":"とりま","reading":"とりま torima","zh":"總之先（網路縮語）","topic":"網路聊天用語","example":"とりま駅集合で！","example_zh":"總之先約車站集合！","note":"「とりあえず、まあ」的縮語，十幾二十歲的用語，LINE 高頻；三十歲以上用會有點尷尬，正式場合絕對不行。","distractors_zh":["鳥類","總結來說","馬上到","取消好了","等一下喔","先解散"],"level":"N5"},{"text":"詰んだ","reading":"つんだ tsunda","zh":"完蛋了／沒救了","topic":"網路聊天用語","example":"レポート明日までなのに全然書いてない。詰んだ。","example_zh":"報告明天截止我完全沒寫，完蛋了。","note":"源自將棋的「詰み（將死）」，遊戲玩家與年輕人表示「無路可走」的半開玩笑絕望感；網路、朋友間用。","distractors_zh":["堆起來了","塞住了","贏定了","認輸吧","被將軍了（下棋中）","好無聊"],"level":"N5"},{"text":"バズる","reading":"バズる bazuru","zh":"（在網路上）爆紅","topic":"網路聊天用語","example":"この動画、バズってるね。","example_zh":"這支影片爆紅了耶。","note":"源自英語 buzz，指貼文被瘋轉、按讚數暴衝；「バズった」＝紅了。網路用語，但新聞也會使用。","distractors_zh":["當機了","被檢舉了","被罵爆了","被洗版了","掉粉了","已讀不回"],"level":"N5"},{"text":"リプ","reading":"リプ ripu","zh":"回覆（貼文）","topic":"網路聊天用語","example":"リプありがとう！","example_zh":"謝謝你的回覆！","note":"reply 的縮語，主要指在 X（推特）等社群上的公開回覆；私訊是「DM」。網路限定用語。","distractors_zh":["轉發","按讚","私訊","取消追蹤","唇膏","截圖"],"level":"N5"},{"text":"わろた","reading":"わろた warota","zh":"笑死（網路用語）","topic":"網路聊天用語","example":"その写真、わろた。","example_zh":"那張照片笑死。","note":"「笑った」的關西腔變體轉為網路用語，和「草」同類；基本上只用於網路打字，實際唸出來會很尷尬。","distractors_zh":["哭了","傻眼","生氣了","笑不出來","得救了","輸了"],"level":"N5"},{"text":"知らんけど","reading":"しらんけど shiran kedo","zh":"我也不確定啦（免責句尾）","topic":"網路聊天用語","example":"あの店、明日休みらしいよ。知らんけど。","example_zh":"那家店明天好像公休喔。我也不確定就是了。","note":"從關西腔紅遍全國的流行句尾，發表意見後補一句卸責，帶自嘲式幽默；朋友間、網路上用，正式場合不可。","distractors_zh":["你不知道嗎？","我早就知道了","不知道就別說","聽說是真的","我不想知道","雖然我知道"],"level":"N5"},{"text":"めっちゃ","reading":"めっちゃ metcha","zh":"超、非常","topic":"日常閒聊","level":"N5","example":"この店の唐揚げ、めっちゃうまいやん！","example_zh":"這家店的炸雞超好吃的耶！","note":"＝標準語的「とても／すごく」。關西年輕人口頭禪等級的超高頻詞，語氣輕鬆隨性，朋友之間隨時可用；現在連關東年輕人也常講。","distractors_zh":["稍微、一點點","難得、偶爾","完全不","大概、可能","太過分了","亂七八糟"]},{"text":"ほんま","reading":"ほんま honma","zh":"真的","topic":"日常閒聊","level":"N5","example":"A：明日から東京行くねん。 B：え、ほんまに？","example_zh":"A：我明天要去東京。 B：欸，真的假的？","note":"＝標準語的「本当」。「ほんまに？」＝「本当に？」，表達驚訝或確認，關西人一天會講好幾次；也常說「ほんまや！（真的耶！）」，是聊天必備的附和詞。","distractors_zh":["假的、騙人的","差不多","本來、原本","偶爾","麻煩的","隨便啦"]},{"text":"あかん","reading":"あかん akan","zh":"不行、不可以、糟糕","topic":"日常閒聊","level":"N5","example":"それ食べたらあかんで！","example_zh":"那個不能吃啦！","note":"＝標準語的「だめ」。禁止、失敗、狀況不妙都能用，一個詞走遍關西；連說「あかんあかん」表示強烈否定，語氣直接但帶親切感。","distractors_zh":["可以喔","打不開","天亮了","我不要","好可惜","太棒了"]},{"text":"ええ","reading":"ええ ee","zh":"好、不錯","topic":"日常閒聊","level":"N5","example":"この店、雰囲気ええなあ。","example_zh":"這家店氣氛真好耶。","note":"＝標準語的「いい」。「ええなあ」＝「いいなあ（真好～）」、「ええで」＝「いいよ（可以呀）」、「ええやん」＝「いいじゃん（不錯啊）」；回應朋友提議時的超高頻詞。","distractors_zh":["咦？（表示驚訝）","是的（回答）","不行","圖畫","討厭","隨便"]},{"text":"おおきに","reading":"おおきに ookini","zh":"謝謝","topic":"日常閒聊","level":"N5","example":"A：これ、どうぞ。 B：おおきに！","example_zh":"A：這個給你。 B：多謝啦！","note":"＝標準語的「ありがとう」。大阪、京都的店家常對客人說；年輕人日常較少用，但外國人用了會有濃濃關西味，容易逗朋友開心、拉近距離。","distractors_zh":["好大喔","不客氣","歡迎光臨","多多益善","慢走喔","打擾了"]},{"text":"なんでやねん","reading":"なんでやねん nande ya nen","zh":"為什麼啦！／搞什麼啦！（吐槽）","topic":"日常閒聊","level":"N5","example":"A：実は俺、宇宙人やねん。 B：なんでやねん！","example_zh":"A：其實我是外星人。 B：是要騙誰啦！","note":"＝標準語的「なんでだよ／どうしてだ」。關西漫才文化的經典吐槽句，朋友講蠢話或冷笑話時用來接梗；語氣是搞笑不是生氣，會用這句瞬間變自己人。","distractors_zh":["為什麼不早說？","原來如此！","你說得對！","怎麼辦才好？","到底是誰啦！","好好笑喔！"]},{"text":"ちゃう","reading":"ちゃう chau","zh":"不是、不對","topic":"日常閒聊","level":"N5","example":"A：それ、新しいスマホ？ B：ちゃうちゃう、前からのやつ。","example_zh":"A：那是新手機嗎？ B：不是不是，是之前那支。","note":"＝標準語的「違う」。連說「ちゃうちゃう」加強否定；放句尾的「〜ちゃう？」則變成「〜じゃない？（不是嗎？）」的意思，聊天時要靠語調分辨。","distractors_zh":["對啊、沒錯","茶（飲料）","借過一下","等一下","知道了","差不多"]},{"text":"せやな","reading":"せやな se ya na","zh":"是啊、說得也是","topic":"日常閒聊","level":"N5","example":"A：今日めっちゃ暑いなあ。 B：せやな。","example_zh":"A：今天有夠熱的。 B：就是說啊。","note":"＝標準語的「そうだね」。附和朋友的萬用相槌；同一家族還有「せやで」＝「そうだよ」、「せやろ？」＝「でしょ？」，一組記起來聊天更順。","distractors_zh":["才不是咧","是嗎？（表示懷疑）","拜託你了","好狹窄喔","隨便你","原來是你"]},{"text":"行かへん","reading":"いかへん ikahen","zh":"不去（關西的否定說法）","topic":"日常閒聊","level":"N5","example":"明日のカラオケ、うちは行かへんで。","example_zh":"明天的卡拉OK我不去喔。","note":"關西弁把否定的「〜ない」說成「〜へん」＝標準語的「行かない」。同理：食べない→食べへん、わからない→わからへん；聽懂這條規則，關西人的聊天就大致跟得上。","distractors_zh":["要去喔","去過了","很想去","不要來","快去啦","去哪裡？"]},{"text":"〜やん","reading":"〜やん yan","zh":"〜嘛、〜不是嗎（句尾語氣詞）","topic":"日常閒聊","level":"N5","example":"この店、安くてうまいやん！","example_zh":"這家店又便宜又好吃，超讚的嘛！","note":"＝標準語的「〜じゃん／〜じゃない」。表示輕微驚訝或尋求同意，如「ええやん（很好啊）」「知ってるやん（你不是知道嘛）」；朋友閒聊的高頻句尾。","distractors_zh":["〜嗎？（單純疑問）","〜吧（推測）","〜喔（單純告知）","〜啦（撒嬌拜託）","〜了（動作完成）","〜呢（表示疑惑）"]},{"text":"好きやねん","reading":"すきやねん suki ya nen","zh":"我（就是）喜歡啦","topic":"日常閒聊","level":"N5","example":"実はな、たこ焼きがめっちゃ好きやねん。","example_zh":"老實說，我超愛章魚燒的啦。","note":"「や」＝標準語的「だ」、「ねん」＝標準語「〜んだ」的關西版，合起來是帶感情的說明語氣，整句＝「好きなんだ」
