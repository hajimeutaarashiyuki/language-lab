:"layoff","reading":"n.","zh":"裁員","topic":"辦公室","example":"The company announced that no further layoffs are planned for this fiscal year.","example_zh":"公司宣布本會計年度不再有進一步的裁員計畫。","note":"動詞片語為 lay off workers；與 resign（辭職）方向相反。"},{"text":"understaffed","reading":"adj.","zh":"人手不足的","topic":"辦公室","example":"The customer service center is understaffed, so wait times have increased noticeably.","example_zh":"客服中心人手不足，因此等候時間明顯變長。","note":"同義 short-staffed；反義 overstaffed（人員過多）。"},{"text":"morale","reading":"n.","zh":"士氣","topic":"辦公室","example":"Team-building activities were organized to boost employee morale after the busy season.","example_zh":"旺季過後，公司舉辦團隊活動以提振員工士氣。","note":"boost/improve morale；勿與 moral（道德的）混淆。"},{"text":"proficient","reading":"adj.","zh":"精通的；熟練的","topic":"辦公室","example":"Applicants should be proficient in spreadsheet software and basic data analysis.","example_zh":"應徵者應精通試算表軟體與基礎資料分析。","note":"be proficient in/at；名詞 proficiency 常見於徵才條件。"},{"text":"oversee","reading":"v.","zh":"監督；督導","topic":"辦公室","example":"Mr. Tsai was promoted to oversee daily operations at the northern distribution center.","example_zh":"蔡先生獲升遷，負責督導北部配送中心的日常營運。","note":"同義字 supervise；三態 oversee-oversaw-overseen。"},{"text":"liaison","reading":"n.","zh":"聯絡窗口；聯繫","topic":"辦公室","example":"Ms. Fan serves as the liaison between the Taipei office and our overseas suppliers.","example_zh":"范小姐擔任台北辦公室與海外供應商之間的聯絡窗口。","note":"liaison between A and B；動詞為 liaise with。"},{"text":"inquiry","reading":"n.","zh":"詢問；洽詢","topic":"辦公室","example":"Please direct all inquiries about invoices to the accounting department at extension 305.","example_zh":"所有關於發票的詢問，請洽會計部門分機 305。","note":"make an inquiry about；動詞為 inquire（詢問）。"},{"text":"venue","reading":"n.","zh":"（活動）場地；會場","topic":"會議簡報","example":"The annual shareholders meeting will be held at a larger venue to accommodate more attendees.","example_zh":"年度股東會將改在更大的場地舉行，以容納更多與會者。","note":"conference/event venue；change of venue（更換場地）常見於通知。"},{"text":"projector","reading":"n.","zh":"投影機","topic":"會議簡報","example":"Please make sure the projector in Conference Room B is working before the client arrives.","example_zh":"請在客戶抵達前確認 B 會議室的投影機可正常運作。","note":"set up the projector；screen（布幕）為相關字。"},{"text":"conference room","reading":"n.","zh":"會議室","topic":"會議簡報","example":"The conference room on the ninth floor can be reserved through the online booking system.","example_zh":"九樓的會議室可透過線上預約系統預訂。","note":"reserve/book a conference room；同義 meeting room。"},{"text":"registration","reading":"n.","zh":"報名；登記","topic":"會議簡報","example":"Registration for the marketing seminar closes on Friday, so sign up early.","example_zh":"行銷研討會的報名於週五截止，請及早報名。","note":"registration form/fee/desk 都是高頻搭配；動詞為 register。"},{"text":"RSVP","reading":"v.","zh":"回覆是否出席","topic":"會議簡報","example":"Please RSVP by May 10 so that we can finalize the seating arrangements.","example_zh":"請於五月十日前回覆是否出席，以便我們確定座位安排。","note":"源自法文；邀請函常見 RSVP by＋日期。"},{"text":"seminar","reading":"n.","zh":"研討會；講習會","topic":"會議簡報","example":"The firm is hosting a free seminar on tax planning for small business owners.","example_zh":"該公司將為小型企業主舉辦免費的稅務規劃研討會。","note":"attend/host a seminar；規模通常小於 conference。"},{"text":"workshop","reading":"n.","zh":"工作坊；實作課程","topic":"會議簡報","example":"Participants in the writing workshop will practice drafting effective business e-mails.","example_zh":"寫作工作坊的學員將練習撰寫有效的商務電子郵件。","note":"hands-on workshop（實作工作坊）；另一義為「工場」。"},{"text":"panel","reading":"n.","zh":"座談小組；專家小組","topic":"會議簡報","example":"A panel of industry experts will discuss emerging trends in electronic commerce.","example_zh":"由業界專家組成的座談小組將討論電子商務的新興趨勢。","note":"panel discussion（座談會）；成員稱 panelist。"},{"text":"moderator","reading":"n.","zh":"（座談）主持人","topic":"會議簡報","example":"The moderator invited questions from the audience after each speaker finished.","example_zh":"每位講者結束後，主持人便邀請觀眾提問。","note":"動詞 moderate a discussion；與 host（活動主持人）略有不同。"},{"text":"facilitator","reading":"n.","zh":"引導者；會議促進者","topic":"會議簡報","example":"An outside facilitator was hired to keep the strategy session focused and on schedule.","example_zh":"公司聘請外部引導者，讓策略會議聚焦並按時程進行。","note":"動詞 facilitate（促進、使順利進行）為 Part 5 高頻字。"},{"text":"participant","reading":"n.","zh":"參加者；與會者","topic":"會議簡報","example":"Each participant will receive a certificate upon completing the two-day training.","example_zh":"每位參加者完成兩天訓練後將獲得證書。","note":"participate in（參加）；與 attendee 為近義字。"},{"text":"Q&A session","reading":"n.","zh":"問答時間","topic":"會議簡報","example":"The presenter reserved the last fifteen minutes for a Q&A session with the audience.","example_zh":"簡報者保留最後十五分鐘與觀眾進行問答時間。","note":"hold/open a Q&A session；Q&A 即 questions and answers。"},{"text":"refreshments","reading":"n.","zh":"茶點；點心飲料","topic":"會議簡報","example":"Light refreshments will be served in the lobby during the afternoon break.","example_zh":"下午休息時間將在大廳供應簡單茶點。","note":"常用複數；refreshments will be served 為公告高頻句。"},{"text":"recap","reading":"v.","zh":"重點回顧；扼要重述","topic":"會議簡報","example":"Before closing the meeting, the chair recapped the main decisions and next steps.","example_zh":"會議結束前，主席扼要重述了主要決議與後續步驟。","note":"recap the main points；亦可作名詞 a quick recap。"},{"text":"wrap up","reading":"phr.","zh":"結束；收尾","topic":"會議簡報","example":"Let's wrap up the discussion so that we can end the meeting on time.","example_zh":"我們把討論收個尾，好讓會議準時結束。","note":"wrap up a meeting/project；名詞形為 wrap-up。"},{"text":"kick off","reading":"phr.","zh":"開始；展開","topic":"會議簡報","example":"The general manager will kick off the conference with a short welcome speech.","example_zh":"總經理將以簡短的歡迎致詞為大會揭開序幕。","note":"kickoff meeting（專案啟動會議）為職場高頻用語。"},{"text":"go over","reading":"phr.","zh":"逐項檢視；複習","topic":"會議簡報","example":"Let's go over the quarterly sales figures before we present them to the board.","example_zh":"在向董事會報告之前，我們先逐項檢視季度銷售數字。","note":"go over the agenda/figures；與 review 同義。"},{"text":"bring up","reading":"phr.","zh":"提出（話題、議題）","topic":"會議簡報","example":"If you have any concerns about the budget, please bring them up at tomorrow's meeting.","example_zh":"若你對預算有任何疑慮，請在明天的會議上提出。","note":"bring up an issue/topic；與 raise a question 同義。"},{"text":"point out","reading":"phr.","zh":"指出","topic":"會議簡報","example":"The consultant pointed out several weaknesses in the current distribution strategy.","example_zh":"顧問指出目前配銷策略的幾項弱點。","note":"point out that＋子句亦常見；名詞 point（要點）。"},{"text":"address","reading":"v.","zh":"處理；探討（議題）","topic":"會議簡報","example":"The next agenda item addresses the rising cost of raw materials.","example_zh":"下一項議程將探討原物料成本上漲的問題。","note":"address an issue/concern；另一義為「向…發表演說」。"},{"text":"clarify","reading":"v.","zh":"澄清；說明清楚","topic":"會議簡報","example":"Could you clarify what you meant by the term 'flexible budget' in your slides?","example_zh":"可以請你說明簡報中「彈性預算」一詞的意思嗎？","note":"clarify a point；名詞 clarification（澄清）常見於商務信件。"},{"text":"emphasize","reading":"v.","zh":"強調","topic":"會議簡報","example":"The speaker emphasized the importance of following up with clients within 24 hours.","example_zh":"講者強調在二十四小時內跟進客戶的重要性。","note":"emphasize the importance of；名詞為 emphasis on。"},{"text":"highlight","reading":"v.","zh":"凸顯；標示重點","topic":"會議簡報","example":"The report highlights three areas where the company can cut operating costs.","example_zh":"這份報告凸顯了公司可削減營運成本的三個領域。","note":"亦可作名詞「亮點」；highlights of the year（年度大事）。"},{"text":"demonstrate","reading":"v.","zh":"示範；證明","topic":"會議簡報","example":"The sales representative will demonstrate the new software during the product briefing.","example_zh":"業務代表將在產品說明會上示範新軟體。","note":"demonstration（示範）常縮寫為 demo；give a demo。"},{"text":"outline","reading":"n.","zh":"大綱；概要","topic":"會議簡報","example":"Please send me an outline of your presentation by Wednesday for review.","example_zh":"請在週三前把你的簡報大綱寄給我審閱。","note":"亦可作動詞「概述」：outline the plan。"},{"text":"overview","reading":"n.","zh":"概觀；總覽","topic":"會議簡報","example":"The first slide provides a brief overview of the company's performance this quarter.","example_zh":"第一張投影片簡要呈現公司本季的營運概況。","note":"give/provide an overview of 為簡報開場高頻句型。"},{"text":"objective","reading":"n.","zh":"目標；目的","topic":"會議簡報","example":"The main objective of today's session is to agree on next year's marketing budget.","example_zh":"今天會議的主要目標是就明年的行銷預算達成共識。","note":"meet/achieve an objective；形容詞義為「客觀的」。"},{"text":"milestone","reading":"n.","zh":"里程碑；重要階段","topic":"會議簡報","example":"Reaching one million subscribers is a major milestone for the streaming service.","example_zh":"訂閱數達到一百萬是該串流服務的重要里程碑。","note":"reach/mark a milestone；專案管理情境高頻字。"},{"text":"feedback","reading":"n.","zh":"回饋意見","topic":"會議簡報","example":"Please provide feedback on the draft proposal before the end of the week.","example_zh":"請在本週結束前針對提案草稿提供回饋意見。","note":"不可數名詞；give/provide feedback on 為高頻搭配。"},{"text":"proposal","reading":"n.","zh":"提案；企劃書","topic":"會議簡報","example":"The committee will review the budget proposal at its next monthly meeting.","example_zh":"委員會將於下次月會審查這份預算提案。","note":"submit/approve/reject a proposal；動詞為 propose。"},{"text":"initiative","reading":"n.","zh":"新方案；主動性","topic":"會議簡報","example":"The recycling initiative announced at the meeting will begin next month.","example_zh":"會議上宣布的回收方案將於下個月啟動。","note":"launch an initiative（推出方案）；take the initiative（主動行動）。"},{"text":"forecast","reading":"n.","zh":"預測；預報","topic":"會議簡報","example":"According to the latest sales forecast, revenue will grow by eight percent next quarter.","example_zh":"根據最新的銷售預測，下一季營收將成長百分之八。","note":"sales forecast；動詞三態 forecast-forecast-forecast。"},{"text":"projection","reading":"n.","zh":"預估（值）；推估","topic":"會議簡報","example":"The financial projections on slide six assume stable exchange rates through 2027.","example_zh":"第六張投影片的財務預估假設匯率在二〇二七年前維持穩定。","note":"financial/sales projections 常用複數；與 forecast 為近義字。"},{"text":"benchmark","reading":"n.","zh":"基準；標竿","topic":"會議簡報","example":"Customer satisfaction scores will serve as the benchmark for evaluating the new service.","example_zh":"顧客滿意度分數將作為評估新服務的基準。","note":"set a benchmark；serve as a benchmark for 為高頻句型。"},{"text":"statistics","reading":"n.","zh":"統計數據","topic":"會議簡報","example":"The statistics presented in the report were compiled from last year's customer surveys.","example_zh":"報告中呈現的統計數據彙整自去年的顧客問卷調查。","note":"statistics show that…；單數 statistic 指「一項數據」。"},{"text":"attendance","reading":"n.","zh":"出席（率）","topic":"會議簡報","example":"Attendance at this year's trade show exceeded ten thousand for the first time.","example_zh":"今年商展的出席人數首次突破一萬人。","note":"attendance is required（務必出席）；take attendance（點名）。"},{"text":"reschedule","reading":"v.","zh":"改期；重新安排時間","topic":"會議簡報","example":"Owing to the typhoon warning, the product launch has been rescheduled for August 3.","example_zh":"由於颱風警報，產品發表會已改期至八月三日。","note":"reschedule A for＋新日期；與 postpone（延期）方向相近。"},{"text":"call off","reading":"phr.","zh":"取消","topic":"會議簡報","example":"The outdoor press event was called off because of the severe weather forecast.","example_zh":"由於天氣預報惡劣，戶外記者會已被取消。","note":"同義 cancel；call off a meeting/event 為高頻搭配。"},{"text":"constructive","reading":"adj.","zh":"建設性的","topic":"會議簡報","example":"The design team welcomed the constructive criticism offered during the review meeting.","example_zh":"設計團隊樂於接受審查會議中提出的建設性批評。","note":"constructive feedback/criticism 為固定搭配。"},{"text":"concise","reading":"adj.","zh":"簡潔的","topic":"會議簡報","example":"Keep your slides concise so the audience can grasp the key points quickly.","example_zh":"投影片要簡潔，讓觀眾能快速掌握重點。","note":"concise summary/report；副詞 concisely。"},{"text":"informative","reading":"adj.","zh":"內容豐富的；有參考價值的","topic":"會議簡報","example":"Attendees described the keynote speech as both informative and inspiring.","example_zh":"與會者形容這場主題演講內容豐富且鼓舞人心。","note":"highly informative 為高頻搭配；動詞 inform（通知）。"},{"text":"persuasive","reading":"adj.","zh":"有說服力的","topic":"會議簡報","example":"Her persuasive presentation convinced the board to fund the expansion project.","example_zh":"她深具說服力的簡報使董事會同意資助擴張計畫。","note":"persuasive argument；動詞 persuade sb to do sth。"},{"text":"rehearse","reading":"v.","zh":"排練；預演","topic":"會議簡報","example":"The team met on Thursday to rehearse the client presentation one final time.","example_zh":"團隊於週四集合，為客戶簡報做最後一次排練。","note":"名詞 rehearsal；dress rehearsal（正式彩排）。"},{"text":"visual aid","reading":"n.","zh":"視覺輔助教材","topic":"會議簡報","example":"Effective visual aids, such as charts and graphs, make complex data easier to follow.","example_zh":"圖表等有效的視覺輔助教材能讓複雜的數據更容易理解。","note":"use visual aids in a presentation 為高頻情境。"},{"text":"transcript","reading":"n.","zh":"逐字稿；文字記錄","topic":"會議簡報","example":"A full transcript of the earnings call will be posted on the investor relations page.","example_zh":"法說會的完整逐字稿將公布在投資人關係網頁上。","note":"另一常考義為「成績單」；動詞 transcribe（謄寫）。"},{"text":"briefing","reading":"n.","zh":"簡報說明會；情況說明","topic":"會議簡報","example":"All sales staff must attend the morning briefing before the store opens.","example_zh":"所有門市銷售人員在開店前必須參加晨間簡報。","note":"press briefing（記者會）；動詞 brief sb on sth。"},{"text":"tentative","reading":"adj.","zh":"暫定的","topic":"會議簡報","example":"A tentative agenda for the annual conference will be distributed next week.","example_zh":"年度大會的暫定議程將於下週發放。","note":"tentative schedule/date；副詞 tentatively scheduled 常考。"},{"text":"preliminary","reading":"adj.","zh":"初步的","topic":"會議簡報","example":"Preliminary survey results suggest strong demand for the new subscription plan.","example_zh":"初步調查結果顯示新訂閱方案的需求強勁。","note":"preliminary results/findings 為高頻搭配。"},{"text":"subsequently","reading":"adv.","zh":"隨後；接著","topic":"會議簡報","example":"The proposal was approved in March and subsequently implemented across all branches.","example_zh":"該提案於三月獲准，隨後在所有分公司實施。","note":"Part 5 高頻副詞；形容詞 subsequent to（在…之後）。"},{"text":"approximately","reading":"adv.","zh":"大約","topic":"會議簡報","example":"The presentation will last approximately forty minutes, followed by a short discussion.","example_zh":"簡報將進行約四十分鐘，之後有簡短討論。","note":"修飾數字；同義 roughly、about，正式文件偏好 approximately。"},{"text":"finalize","reading":"v.","zh":"定案；最終確定","topic":"會議簡報","example":"We need to finalize the seminar program before the invitations are printed.","example_zh":"我們必須在邀請函付印前將研討會議程定案。","note":"finalize the details/schedule；形容詞 final（最終的）。"},{"text":"distribute","reading":"v.","zh":"分發；配送","topic":"會議簡報","example":"Copies of the meeting agenda were distributed to everyone at the door.","example_zh":"會議議程的影本已在入口處分發給每一位與會者。","note":"distribute A to B；名詞 distribution（配銷、分發）。"},{"text":"availability","reading":"n.","zh":"（時間）有空與否；可得性","topic":"會議簡報","example":"Please let me know your availability so we can schedule the project kickoff meeting.","example_zh":"請告知你有空的時間，以便我們安排專案啟動會議。","note":"check one's availability 為約時間高頻句；形容詞 available。"},{"text":"reminder","reading":"n.","zh":"提醒（通知）","topic":"會議簡報","example":"This is a friendly reminder that the budget review meeting begins at 2 p.m. today.","example_zh":"友善提醒：預算審查會議於今天下午兩點開始。","note":"a friendly/gentle reminder 為商務郵件開頭高頻用語。"},{"text":"sign up","reading":"phr.","zh":"報名；登記參加","topic":"會議簡報","example":"Employees interested in the leadership workshop should sign up by Friday.","example_zh":"有意參加領導力工作坊的員工請於週五前報名。","note":"sign up for＋活動；與 register for 同義。"},{"text":"turnout","reading":"n.","zh":"出席人數；到場人數","topic":"會議簡報","example":"The turnout for the product demonstration was higher than the organizers expected.","example_zh":"產品展示會的到場人數比主辦單位預期的還多。","note":"a high/low turnout；勿與 turnover（流動率、營業額）混淆。"},{"text":"compromise","reading":"n.","zh":"妥協；折衷方案","topic":"會議簡報","example":"After hours of negotiation, the two sides finally reached a compromise on pricing.","example_zh":"經過數小時協商，雙方終於在定價上達成妥協。","note":"reach a compromise；動詞用法 compromise on sth。"},{"text":"resolution","reading":"n.","zh":"決議；解決","topic":"會議簡報","example":"The board passed a resolution to open two new branches in Southeast Asia.","example_zh":"董事會通過決議，將在東南亞開設兩間新分公司。","note":"pass/adopt a resolution；另一義為「解析度」。"},{"text":"action item","reading":"n.","zh":"（會議決定的）待辦事項","topic":"會議簡報","example":"The minutes list each action item along with the person responsible and the due date.","example_zh":"會議紀錄列出每項待辦事項、負責人與完成期限。","note":"assign action items；與 to-do list 概念相近但更正式。"},{"text":"timeline","reading":"n.","zh":"時程表；時間軸","topic":"會議簡報","example":"The project timeline shows that testing will begin in the second week of September.","example_zh":"專案時程表顯示測試將於九月第二週開始。","note":"meet the timeline（趕上時程）；與 schedule 為近義字。"},{"text":"stakeholder","reading":"n.","zh":"利害關係人","topic":"會議簡報","example":"All key stakeholders will be invited to comment on the draft policy before it is finalized.","example_zh":"政策草案定案前，將邀請所有主要利害關係人提供意見。","note":"key stakeholders；勿與 shareholder（股東）混淆。"},{"text":"chairperson","reading":"n.","zh":"主席","topic":"會議簡報","example":"The chairperson opened the meeting by welcoming the newly elected board members.","example_zh":"主席在會議開始時歡迎新當選的董事會成員。","note":"亦作 chair；chair a meeting（主持會議）為動詞用法。"},{"text":"commence","reading":"v.","zh":"開始","topic":"會議簡報","example":"The awards ceremony will commence promptly at 6 p.m. in the grand ballroom.","example_zh":"頒獎典禮將於下午六點整在大宴會廳準時開始。","note":"正式用字，同義 begin/start；名詞 commencement 另指「畢業典禮」。"},{"text":"conclude","reading":"v.","zh":"結束；作出結論","topic":"會議簡報","example":"The seminar will conclude with a panel discussion and a networking reception.","example_zh":"研討會將以座談討論與交流茶會作結。","note":"conclude with；名詞 conclusion（結論）。"},{"text":"concur","reading":"v.","zh":"意見一致；同意","topic":"會議簡報","example":"The committee members concurred with the auditor's recommendation to tighten controls.","example_zh":"委員會成員一致同意稽核員加強控管的建議。","note":"concur with sb/sth；比 agree 更正式，Part 5 高頻。"},{"text":"webinar","reading":"n.","zh":"線上研討會","topic":"會議簡報","example":"A recording of the webinar will be e-mailed to everyone who registered.","example_zh":"線上研討會的錄影將以電子郵件寄給所有報名者。","note":"由 web＋seminar 組成；host/join a webinar。"},{"text":"impromptu","reading":"adj.","zh":"即席的；未經準備的","topic":"會議簡報","example":"The CEO gave an impromptu speech to thank the staff for their hard work.","example_zh":"執行長即席發表談話，感謝員工的辛勞。","note":"impromptu speech/meeting；與 spontaneous 意思相近。"},{"text":"prioritize","reading":"v.","zh":"排定優先順序；優先處理","topic":"會議簡報","example":"During the planning session, managers were asked to prioritize the proposed projects.","example_zh":"在規劃會議中，經理們被要求為提案專案排定優先順序。","note":"prioritize tasks；名詞 priority（優先事項）。"},{"text":"allocate","reading":"v.","zh":"分配（時間、預算、資源）","topic":"會議簡報","example":"The chair allocated ten minutes at the end of the meeting for questions.","example_zh":"主席在會議最後分配了十分鐘供大家提問。","note":"allocate A to B；名詞 allocation（分配）。"},{"text":"onboarding","reading":"n.","zh":"新進員工到職訓練","topic":"人事招募","example":"All new hires must complete the onboarding process within their first week.","example_zh":"所有新進員工必須在到職第一週內完成到職訓練流程。","note":"常搭配 onboarding process/program；別與 orientation（迎新說明會）混淆。"},{"text":"shortlist","reading":"v.","zh":"將…列入決選名單","topic":"人事招募","example":"Only five applicants were shortlisted for the final interview.","example_zh":"只有五位應徵者被列入最終面試的決選名單。","note":"常見被動用法 be shortlisted for；名詞指「決選名單」。"},{"text":"cover letter","reading":"phr.","zh":"求職信","topic":"人事招募","example":"Please submit a cover letter along with your resume by Friday.","example_zh":"請於週五前連同履歷一併繳交求職信。","note":"搭配 submit/attach a cover letter。"},{"text":"job opening","reading":"phr.","zh":"職缺","topic":"人事招募","example":"The marketing department has two job openings for experienced designers.","example_zh":"行銷部門目前有兩個資深設計師的職缺。","note":"同義 vacancy、opening；搭配 fill a job opening。"},{"text":"internship","reading":"n.","zh":"實習","topic":"人事招募","example":"The company offers a paid internship program for college students every summer.","example_zh":"該公司每年夏天為大學生提供支薪實習計畫。","note":"搭配 paid/unpaid internship；complete an internship 完成實習。"},{"text":"apprentice","reading":"n.","zh":"學徒","topic":"人事招募","example":"Each apprentice works under a senior technician for at least six months.","example_zh":"每位學徒都要在資深技師底下工作至少六個月。","note":"apprenticeship 為「學徒制」；別與 intern（實習生）混淆。"},{"text":"mentor","reading":"n.","zh":"導師；資深指導者","topic":"人事招募","example":"Each new employee is paired with a mentor during the first three months.","example_zh":"每位新進員工在前三個月都會配對一位導師。","note":"mentee 為「受指導者」；mentoring program 指導計畫。"},{"text":"staffing","reading":"n.","zh":"人員配置","topic":"人事招募","example":"The hotel adjusts its staffing levels during the peak tourist season.","example_zh":"這家飯店會在旅遊旺季調整人員配置。","note":"搭配 staffing levels/needs；staffing agency 人力仲介公司。"},{"text":"headcount","reading":"n.","zh":"員工人數；編制人數","topic":"人事招募","example":"Management approved an increase in headcount for the customer service team.","example_zh":"管理階層核准增加客服團隊的編制人數。","note":"搭配 increase/reduce headcount。"},{"text":"attrition","reading":"n.","zh":"人員自然流失","topic":"人事招募","example":"The company plans to reduce its workforce through attrition rather than layoffs.","example_zh":"公司計畫透過人員自然流失而非裁員來縮減人力。","note":"搭配 through/by attrition；指離退職缺不補的減員方式。"},{"text":"retention","reading":"n.","zh":"員工留任","topic":"人事招募","example":"Flexible schedules have significantly improved our employee retention rate.","example_zh":"彈性工時大幅提升了我們的員工留任率。","note":"搭配 employee/staff retention；動詞為 retain。"},{"text":"relocation","reading":"n.","zh":"調職搬遷；遷移","topic":"人事招募","example":"The company covers relocation expenses for employees transferred overseas.","example_zh":"公司會負擔外派海外員工的搬遷費用。","note":"搭配 relocation package/expenses；動詞 relocate。"},{"text":"reassign","reading":"v.","zh":"重新分派；調任","topic":"人事招募","example":"Several engineers were reassigned to the new product development team.","example_zh":"幾位工程師被調任到新產品開發團隊。","note":"常用被動 be reassigned to + 部門/職務。"},{"text":"credential","reading":"n.","zh":"資歷證明；證書","topic":"人事招募","example":"Applicants should list their professional credentials in the online application form.","example_zh":"應徵者應在線上申請表中列出專業資歷證明。","note":"常用複數 credentials；verify credentials 查核資歷。"},{"text":"proficiency","reading":"n.","zh":"精通；熟練度","topic":"人事招募","example":"Proficiency in both English and Japanese is required for this position.","example_zh":"這個職位要求精通英文與日文。","note":"搭配 proficiency in + 語言/技能；形容詞 proficient。"},{"text":"aptitude","reading":"n.","zh":"天資；性向","topic":"人事招募","example":"Candidates must pass an aptitude test before the second interview.","example_zh":"應徵者必須在第二次面試前通過性向測驗。","note":"搭配 aptitude for + 領域；aptitude test 性向測驗。"},{"text":"prerequisite","reading":"n.","zh":"先決條件","topic":"人事招募","example":"A valid driver's license is a prerequisite for the delivery position.","example_zh":"有效駕照是這個送貨職位的先決條件。","note":"搭配 a prerequisite for/of；與 requirement 意思相近。"},{"text":"appoint","reading":"v.","zh":"任命","topic":"人事招募","example":"The board appointed Ms. Lopez as the new director of human resources.","example_zh":"董事會任命羅培茲女士為新任人資總監。","note":"搭配 appoint sb as/to + 職位；名詞 appointment 另指「約定會面」。"},{"text":"headhunter","reading":"n.","zh":"獵人頭專員；高階人才仲介","topic":"人事招募","example":"A headhunter contacted her about an executive position at a rival firm.","example_zh":"一位獵人頭專員聯繫她，洽談競爭對手公司的高階職位。","note":"較正式的說法為 executive recruiter。"},{"text":"expertise","reading":"n.","zh":"專業知識","topic":"人事招募","example":"Her expertise in labor law makes her an ideal candidate for the compliance role.","example_zh":"她在勞動法方面的專業知識使她成為法遵職位的理想人選。","note":"不可數名詞；搭配 expertise in + 領域。"},{"text":"competent","reading":"adj.","zh":"能幹的；能勝任的","topic":"人事招募","example":"We are seeking a competent administrator to manage the branch office.","example_zh":"我們正在尋找一位能幹的行政人員來管理分公司。","note":"別與 competitive（有競爭力的）混淆；名詞 competence。"},{"text":"dedicated","reading":"adj.","zh":"盡心盡力的；專用的","topic":"人事招募","example":"The award recognizes dedicated employees who have served for over ten years.","example_zh":"該獎項表彰服務超過十年、盡心盡力的員工。","note":"搭配 dedicated to + 名詞；另可指「專用的」，如 a dedicated hotline。"},{"text":"diligent","reading":"adj.","zh":"勤勉的","topic":"人事招募","example":"Diligent interns often receive full-time offers after graduation.","example_zh":"勤勉的實習生畢業後常會收到正職聘書。","note":"副詞 diligently 為 Part 5 常考；名詞 diligence。"},{"text":"versatile","reading":"adj.","zh":"多才多藝的；用途廣泛的","topic":"人事招募","example":"The agency is looking for a versatile writer who can handle various types of content.","example_zh":"該公司正在尋找能處理各類內容、多才多藝的寫手。","note":"可形容人或工具；名詞 versatility。"},{"text":"work ethic","reading":"phr.","zh":"工作態度；敬業精神","topic":"人事招募","example":"The supervisor praised the new recruit for her strong work ethic.","example_zh":"主管稱讚這位新進人員有極佳的敬業精神。","note":"搭配 a strong/good work ethic；此處 ethic 用單數。"},{"text":"take on","reading":"phr.","zh":"僱用；承接","topic":"人事招募","example":"The factory plans to take on fifty seasonal workers before the holidays.","example_zh":"這家工廠計畫在節慶前僱用五十名季節性員工。","note":"受詞為人時指「僱用」，為工作時指「承擔」：take on new responsibilities。"},{"text":"step down","reading":"phr.","zh":"辭職；卸任","topic":"人事招募","example":"The CEO will step down at the end of the year after two decades of service.","example_zh":"執行長將在服務二十年後於年底卸任。","note":"搭配 step down as/from + 職位；語氣比 resign 委婉。"},{"text":"lay off","reading":"phr.","zh":"資遣；裁員","topic":"人事招募","example":"The airline was forced to lay off hundreds of ground staff during the downturn.","example_zh":"這家航空公司在景氣低迷期間被迫資遣數百名地勤人員。","note":"名詞為 layoff；與 dismiss（因過失解僱）語意不同。"},{"text":"hand in","reading":"phr.","zh":"繳交；遞交","topic":"人事招募","example":"Mr. Park handed in his resignation letter after accepting a job overseas.","example_zh":"朴先生接受海外工作後遞交了辭呈。","note":"常搭配 hand in one's resignation/report；同義 submit。"},{"text":"absenteeism","reading":"n.","zh":"曠職；經常性缺勤","topic":"人事招募","example":"The new wellness program has reduced absenteeism by nearly twenty percent.","example_zh":"新的健康促進計畫使缺勤率降低了近百分之二十。","note":"指習慣性缺勤；單次缺席為 absence。"},{"text":"leave of absence","reading":"phr.","zh":"留職停薪；長假","topic":"人事招募","example":"She requested a leave of absence to care for her elderly parents.","example_zh":"她申請留職停薪以照顧年邁的雙親。","note":"搭配 take/request a leave of absence。"},{"text":"maternity leave","reading":"phr.","zh":"產假","topic":"人事招募","example":"Our company offers twelve weeks of paid maternity leave.","example_zh":"我們公司提供十二週的支薪產假。","note":"相關詞 paternity leave（陪產假）、parental leave（育嬰假）。"},{"text":"sabbatical","reading":"n.","zh":"長期休假；進修假","topic":"人事招募","example":"After seven years with the firm, employees may apply for a six-month sabbatical.","example_zh":"在公司服務滿七年後，員工可申請六個月的長期休假。","note":"搭配 take/go on (a) sabbatical。"},{"text":"notice period","reading":"phr.","zh":"離職預告期間","topic":"人事招募","example":"The employment contract specifies a one-month notice period for resignation.","example_zh":"僱傭合約明定辭職須有一個月的預告期間。","note":"相關片語 give notice（提出離職預告）。"},{"text":"remuneration","reading":"n.","zh":"報酬；薪酬","topic":"人事招募","example":"The remuneration package includes a base salary, bonuses, and stock options.","example_zh":"薪酬方案包含底薪、獎金與股票選擇權。","note":"正式用語；固定搭配 remuneration package。"},{"text":"stipend","reading":"n.","zh":"津貼；補助金","topic":"人事招募","example":"Interns receive a monthly stipend to cover transportation and meals.","example_zh":"實習生每月可領取津貼以支應交通與餐費。","note":"多指實習、研究等定額給付，非正式薪資。"},{"text":"pension","reading":"n.","zh":"退休金","topic":"人事招募","example":"Employees may begin drawing their pension at the age of sixty-five.","example_zh":"員工可自六十五歲起開始領取退休金。","note":"搭配 pension plan/scheme；receive/draw a pension。"},{"text":"commission","reading":"n.","zh":"佣金；抽成","topic":"人事招募","example":"Sales representatives earn a ten percent commission on every contract they close.","example_zh":"業務代表每成交一份合約可賺取百分之十的佣金。","note":"搭配 earn/receive a commission；on commission 抽佣制。"},{"text":"pay raise","reading":"phr.","zh":"加薪","topic":"人事招募","example":"After her successful project, Ms. Ito requested a pay raise from her manager.","example_zh":"專案成功後，伊藤小姐向主管提出加薪要求。","note":"英式常說 pay rise；搭配 ask for/grant a pay raise。"},{"text":"demote","reading":"v.","zh":"降職","topic":"人事招募","example":"The manager was demoted to assistant supervisor after the audit revealed errors.","example_zh":"稽核發現疏失後，該經理被降職為副主管。","note":"反義 promote；名詞 demotion。"},{"text":"dismiss","reading":"v.","zh":"解僱；駁回","topic":"人事招募","example":"Any employee who violates the safety code may be dismissed without notice.","example_zh":"任何違反安全規範的員工都可能被無預警解僱。","note":"名詞 dismissal；另有「駁回、不予考慮」之意。"},{"text":"screen","reading":"v.","zh":"篩選","topic":"人事招募","example":"The HR team screens hundreds of applications before scheduling interviews.","example_zh":"人資團隊在安排面試前會先篩選數百份應徵資料。","note":"搭配 screen applicants/candidates；screening process 篩選流程。"},{"text":"background check","reading":"phr.","zh":"背景調查","topic":"人事招募","example":"All job offers are contingent upon a satisfactory background check.","example_zh":"所有錄取通知都以背景調查結果合格為前提。","note":"搭配 conduct/run a background check。"},{"text":"outsource","reading":"v.","zh":"外包","topic":"人事招募","example":"The company decided to outsource its payroll processing to a local firm.","example_zh":"公司決定將薪資作業外包給一家本地廠商。","note":"搭配 outsource A to B；名詞 outsourcing。"},{"text":"seasoned","reading":"adj.","zh":"經驗豐富的","topic":"人事招募","example":"We prefer a seasoned recruiter who has handled high-volume hiring.","example_zh":"我們偏好處理過大量招募作業、經驗豐富的招募專員。","note":"搭配 a seasoned professional/veteran；同義 experienced。"},{"text":"seniority","reading":"n.","zh":"年資","topic":"人事招募","example":"Vacation days are allocated according to each employee's seniority.","example_zh":"休假天數依照每位員工的年資分配。","note":"搭配 based on seniority；形容詞 senior。"},{"text":"entry-level","reading":"adj.","zh":"初階的；基層的","topic":"人事招募","example":"This entry-level position requires no prior work experience.","example_zh":"這個初階職位不要求任何工作經驗。","note":"搭配 entry-level position/job；相對於 senior-level。"},{"text":"job fair","reading":"phr.","zh":"就業博覽會","topic":"人事招募","example":"The university will host a job fair where students can meet corporate recruiters.","example_zh":"這所大學將舉辦就業博覽會，讓學生與企業招募人員見面。","note":"同義 career fair；搭配 attend/host a job fair。"},{"text":"formerly","reading":"adv.","zh":"以前；先前","topic":"人事招募","example":"Mr. Reed, formerly a branch manager, now leads the recruiting division.","example_zh":"里德先生先前是分行經理，現在領導招募部門。","note":"別與 formally（正式地）混淆，Part 5 常考。"},{"text":"shortly","reading":"adv.","zh":"不久；很快","topic":"人事招募","example":"The human resources office will contact successful applicants shortly after the deadline.","example_zh":"人資辦公室將在截止日後不久聯繫獲選的應徵者。","note":"shortly after/before + 時間點；意思等於 soon。"},{"text":"preferably","reading":"adv.","zh":"最好；以…為佳","topic":"人事招募","example":"Applicants should have a marketing degree, preferably with two years of experience.","example_zh":"應徵者應具行銷學位，最好還有兩年工作經驗。","note":"求才廣告高頻字；常放在補充條件之前。"},{"text":"accounts payable","reading":"phr.","zh":"應付帳款","topic":"財務會計","example":"The accounts payable department processes all vendor invoices within thirty days.","example_zh":"應付帳款部門會在三十天內處理所有供應商的發票。","note":"縮寫 AP；相對於 accounts receivable（應收帳款）。"},{"text":"accounts receivable","reading":"phr.","zh":"應收帳款","topic":"財務會計","example":"Our accounts receivable have increased because several clients delayed their payments.","example_zh":"由於數家客戶延遲付款，我們的應收帳款增加了。","note":"縮寫 AR；搭配 collect accounts receivable。"},{"text":"balance sheet","reading":"phr.","zh":"資產負債表","topic":"財務會計","example":"The accountant prepares a balance sheet at the end of each quarter.","example_zh":"會計師在每季結束時編製資產負債表。","note":"與 income statement（損益表）並列為主要財務報表。"},{"text":"bookkeeping","reading":"n.","zh":"簿記；記帳","topic":"財務會計","example":"Accurate bookkeeping is essential for preparing year-end financial statements.","example_zh":"精確的記帳對編製年終財務報表至關重要。","note":"bookkeeper 記帳員；注意 oo-kk-ee 的特殊拼法。"},{"text":"cash flow","reading":"phr.","zh":"現金流量","topic":"財務會計","example":"The store improved its cash flow by offering discounts for early payments.","example_zh":"這家店藉由提供提前付款折扣改善了現金流量。","note":"搭配 cash flow problems/statement。"},{"text":"dividend","reading":"n.","zh":"股利；股息","topic":"財務會計","example":"Shareholders will receive a dividend of two dollars per share this year.","example_zh":"股東今年每股將獲得兩美元的股利。","note":"搭配 pay/declare a dividend。"},{"text":"equity","reading":"n.","zh":"股東權益；股權","topic":"財務會計","example":"The founder still holds forty percent of the company's equity.","example_zh":"創辦人仍持有公司百分之四十的股權。","note":"會計上指資產減負債後的權益；equity stake 持股。"},{"text":"collateral","reading":"n.","zh":"擔保品；抵押品","topic":"財務會計","example":"The bank required the building as collateral for the business loan.","example_zh":"銀行要求以這棟大樓作為商業貸款的擔保品。","note":"搭配 as collateral for a loan；不可數名詞。"},{"text":"creditor","reading":"n.","zh":"債權人","topic":"財務會計","example":"The company negotiated a repayment schedule with its major creditors.","example_zh":"公司與主要債權人協商還款時程。","note":"反義 debtor（債務人）。"},{"text":"debtor","reading":"n.","zh":"債務人","topic":"財務會計","example":"The collection agency contacts debtors whose accounts are more than ninety days past due.","example_zh":"催收公司會聯繫帳款逾期超過九十天的債務人。","note":"與 creditor 相對；debt 為「債務」，b 不發音。"},{"text":"disbursement","reading":"n.","zh":"支付；支出款項","topic":"財務會計","example":"All cash disbursements over five hundred dollars require the director's approval.","example_zh":"所有超過五百美元的現金支付都需要總監核准。","note":"動詞 disburse；正式會計用語。"},{"text":"gross","reading":"adj.","zh":"總的；未扣除的","topic":"財務會計","example":"The company's gross profit rose by eight percent in the second quarter.","example_zh":"公司第二季的毛利成長了百分之八。","note":"gross income/profit 為未扣除成本費用；相對於 net（淨的）。"},{"text":"margin","reading":"n.","zh":"利潤率；毛利","topic":"財務會計","example":"Rising material costs have squeezed the manufacturer's profit margins.","example_zh":"原物料成本上漲壓縮了這家製造商的利潤率。","note":"搭配 profit margin、narrow/wide margin。"},{"text":"overhead","reading":"n.","zh":"經常性開支；間接成本","topic":"財務會計","example":"Moving to a smaller office significantly reduced the startup's overhead.","example_zh":"搬到較小的辦公室大幅降低了這家新創公司的經常性開支。","note":"指租金、水電等固定開銷；不可數名詞。"},{"text":"proceeds","reading":"n.","zh":"收入；所得款項","topic":"財務會計","example":"All proceeds from the charity auction will be donated to local schools.","example_zh":"慈善拍賣的所有收入將捐給當地學校。","note":"恆用複數；搭配 proceeds from + 活動。"},{"text":"reconcile","reading":"v.","zh":"核對帳目；調和","topic":"財務會計","example":"The clerk reconciles the bank statement with the company ledger every month.","example_zh":"職員每個月都會核對銀行對帳單與公司帳冊。","note":"搭配 reconcile A with B；名詞 reconciliation。"},{"text":"subsidy","reading":"n.","zh":"補助金；補貼","topic":"財務會計","example":"The government provides subsidies to small businesses that hire recent graduates.","example_zh":"政府提供補助金給僱用應屆畢業生的小型企業。","note":"動詞 subsidize；搭配 government subsidy。"},{"text":"tariff","reading":"n.","zh":"關稅","topic":"財務會計","example":"New tariffs on imported steel have raised production costs for automakers.","example_zh":"進口鋼材的新關稅提高了汽車製造商的生產成本。","note":"搭配 impose a tariff on + 商品。"},{"text":"deduction","reading":"n.","zh":"扣除額；扣款","topic":"財務會計","example":"Employees can see all tax deductions itemized on their pay statements.","example_zh":"員工可以在薪資單上看到逐項列出的所有稅款扣除額。","note":"搭配 tax deduction；動詞 deduct。"},{"text":"withhold","reading":"v.","zh":"預扣；扣留","topic":"財務會計","example":"Employers are required to withhold income tax from employees' wages.","example_zh":"雇主必須從員工薪資中預扣所得稅。","note":"三態 withhold-withheld-withheld；withholding tax 預扣稅款。"},{"text":"write off","reading":"phr.","zh":"沖銷；認列損失","topic":"財務會計","example":"The firm decided to write off the unpaid invoice as a bad debt.","example_zh":"公司決定將這筆未收款項沖銷為呆帳。","note":"名詞為 write-off；搭配 write off a debt/loss。"},{"text":"yield","reading":"n.","zh":"收益率；報酬","topic":"財務會計","example":"Government bonds offer a lower yield but carry less risk than stocks.","example_zh":"公債的收益率較低，但風險也比股票小。","note":"作動詞指「產生（收益）」：yield a profit。"},{"text":"accrue","reading":"v.","zh":"累積；應計","topic":"財務會計","example":"Interest accrues daily on any outstanding balance.","example_zh":"未清償餘額每日都會累積利息。","note":"會計用語 accrued expenses 應計費用。"},{"text":"outstanding","reading":"adj.","zh":"未清償的；傑出的","topic":"財務會計","example":"Please settle any outstanding balance before the end of the billing cycle.","example_zh":"請在帳單週期結束前結清所有未清償餘額。","note":"多益常考「未付的」語意：outstanding balance/payment。"},{"text":"incur","reading":"v.","zh":"招致；產生費用","topic":"財務會計","example":"Travelers will incur additional charges for any excess baggage.","example_zh":"旅客若行李超重將產生額外費用。","note":"搭配 incur expenses/costs/losses；過去式 incurred。"},{"text":"itemize","reading":"v.","zh":"逐項列出","topic":"財務會計","example":"Please itemize all business expenses on the reimbursement form.","example_zh":"請在請款單上逐項列出所有公務支出。","note":"搭配 itemized bill/receipt 明細帳單。"},{"text":"bankruptcy","reading":"n.","zh":"破產","topic":"財務會計","example":"The retailer filed for bankruptcy after years of declining sales.","example_zh":"這家零售商在銷售額連年下滑後聲請破產。","note":"固定搭配 file for/declare bankruptcy；形容詞 bankrupt。"},{"text":"merger","reading":"n.","zh":"公司合併","topic":"財務會計","example":"The merger between the two banks created the largest lender in the region.","example_zh":"這兩家銀行的合併造就了該區域最大的貸款機構。","note":"搭配 merger with/between；mergers and acquisitions 即 M&A。"},{"text":"acquisition","reading":"n.","zh":"收購；併購","topic":"財務會計","example":"The acquisition of the software startup cost the corporation fifty million dollars.","example_zh":"收購這家軟體新創公司花了該企業五千萬美元。","note":"動詞 acquire；搭配 the acquisition of + 公司。"},{"text":"shareholder","reading":"n.","zh":"股東","topic":"財務會計","example":"Shareholders will vote on the proposed merger at the annual meeting.","example_zh":"股東將在年度大會上就合併提案進行表決。","note":"同義 stockholder；shareholders' meeting 股東會。"},{"text":"portfolio","reading":"n.","zh":"投資組合；作品集","topic":"財務會計","example":"A diversified portfolio helps investors reduce overall risk.","example_zh":"多元化的投資組合有助投資人降低整體風險。","note":"財務指投資組合；求職情境則指作品集。"},{"text":"interest rate","reading":"phr.","zh":"利率","topic":"財務會計","example":"The central bank raised interest rates to curb inflation.","example_zh":"中央銀行升息以抑制通貨膨脹。","note":"搭配 raise/lower interest rates。"},{"text":"principal","reading":"n.","zh":"本金","topic":"財務會計","example":"Each monthly payment covers both the principal and the interest on the loan.","example_zh":"每月還款同時涵蓋貸款的本金與利息。","note":"別與 principle（原則）混淆，Part 5 常考。"},{"text":"mortgage","reading":"n.","zh":"房屋貸款；抵押貸款","topic":"財務會計","example":"The couple took out a thirty-year mortgage to buy their first home.","example_zh":"這對夫妻辦了三十年期的房貸來購買第一間房子。","note":"搭配 take out/pay off a mortgage；t 不發音。"},{"text":"take out","reading":"phr.","zh":"辦理（貸款、保險）","topic":"財務會計","example":"Many small businesses take out loans to cover seasonal inventory purchases.","example_zh":"許多小型企業會辦理貸款以支應季節性進貨。","note":"搭配 take out a loan/an insurance policy。"},{"text":"inflation","reading":"n.","zh":"通貨膨脹","topic":"財務會計","example":"Rising inflation has increased the cost of raw materials across the industry.","example_zh":"通貨膨脹上升使整個產業的原物料成本增加。","note":"反義 deflation；搭配 curb/combat inflation。"},{"text":"recession","reading":"n.","zh":"經濟衰退","topic":"財務會計","example":"Many firms froze hiring during the recession to control costs.","example_zh":"許多公司在經濟衰退期間凍結招募以控制成本。","note":"搭配 during a recession、economic recession。"},{"text":"markup","reading":"n.","zh":"加價；加成","topic":"財務會計","example":"The boutique applies a fifty percent markup on all imported handbags.","example_zh":"這家精品店對所有進口手提包加價百分之五十。","note":"反義 markdown（降價）；動詞為 mark up。"},{"text":"rebate","reading":"n.","zh":"退款；回饋金","topic":"財務會計","example":"Customers can claim a one-hundred-dollar rebate by mailing in the completed form.","example_zh":"顧客只要寄回填妥的表格即可申請一百美元的退款。","note":"與 refund 不同，rebate 指購買後部分金額的回饋。"},{"text":"down payment","reading":"phr.","zh":"頭期款","topic":"財務會計","example":"The dealership requires a twenty percent down payment on all vehicle purchases.","example_zh":"這家經銷商要求所有購車案支付兩成頭期款。","note":"搭配 make/put down a down payment。"},{"text":"bottom line","reading":"phr.","zh":"淨利；最終損益","topic":"財務會計","example":"Cutting delivery costs had an immediate effect on the company's bottom line.","example_zh":"削減運送成本對公司的淨利立即產生了影響。","note":"口語另指「重點、關鍵」。"},{"text":"break even","reading":"phr.","zh":"損益兩平","topic":"財務會計","example":"The new branch is expected to break even within its first year of operation.","example_zh":"新分店預計在營運第一年內達到損益兩平。","note":"名詞與形容詞寫作 break-even (point)。"},{"text":"cost-effective","reading":"adj.","zh":"具成本效益的；划算的","topic":"財務會計","example":"Videoconferencing is a cost-effective alternative to frequent business travel.","example_zh":"視訊會議是頻繁出差之外更具成本效益的替代方案。","note":"同義 economical；比較級 more cost-effective。"},{"text":"lump sum","reading":"phr.","zh":"一次付清的整筆款項","topic":"財務會計","example":"Retiring employees may choose a lump sum instead of monthly pension payments.","example_zh":"退休員工可選擇一次領取整筆款項，而非按月領取退休金。","note":"搭配 in a lump sum 一次付清。"},{"text":"quotation","reading":"n.","zh":"報價；報價單","topic":"財務會計","example":"Please request a written quotation from at least three suppliers before ordering.","example_zh":"下單前請至少向三家供應商索取書面報價單。","note":"口語常縮為 quote；搭配 request/provide a quotation。"},{"text":"estimate","reading":"n.","zh":"估價；估計","topic":"財務會計","example":"The contractor provided a detailed estimate for the office renovation.","example_zh":"承包商為辦公室整修提供了詳細的估價單。","note":"搭配 a rough estimate 粗估；動詞與名詞字尾發音不同。"},{"text":"wire transfer","reading":"phr.","zh":"電匯","topic":"財務會計","example":"The supplier requested payment by wire transfer before shipping the goods.","example_zh":"供應商要求在出貨前以電匯付款。","note":"搭配 by wire transfer；英式常說 bank transfer。"},{"text":"direct deposit","reading":"phr.","zh":"薪資直接入帳","topic":"財務會計","example":"Salaries are paid by direct deposit on the last business day of each month.","example_zh":"薪資於每月最後一個營業日直接匯入帳戶。","note":"搭配 by/through direct deposit；sign up for direct deposit。"},{"text":"surcharge","reading":"n.","zh":"附加費","topic":"財務會計","example":"A three percent surcharge applies to all credit card payments.","example_zh":"所有信用卡付款需加收百分之三的附加費。","note":"搭配 impose/add a surcharge；fuel surcharge 燃油附加費。"},{"text":"exempt","reading":"adj.","zh":"免除的；豁免的","topic":"財務會計","example":"Nonprofit organizations are exempt from most federal taxes.","example_zh":"非營利組織可免繳大多數聯邦稅。","note":"搭配 be exempt from + 名詞；tax-exempt 免稅的。"},{"text":"discrepancy","reading":"n.","zh":"不一致；出入","topic":"財務會計","example":"The auditor found a discrepancy between the recorded sales and the actual deposits.","example_zh":"稽核人員發現帳列銷售額與實際存款金額有出入。","note":"搭配 a discrepancy between A and B；複數 discrepancies。"},{"text":"capital","reading":"n.","zh":"資本；資金","topic":"財務會計","example":"The startup raised additional capital to expand into overseas markets.","example_zh":"這家新創公司募集額外資本以拓展海外市場。","note":"搭配 raise capital；capital expenditure 資本支出。"},{"text":"appreciate","reading":"v.","zh":"增值；感激","topic":"財務會計","example":"Property values in the district have appreciated steadily over the past decade.","example_zh":"該區的房地產價值在過去十年間穩定增值。","note":"財務語意「增值」為多益陷阱題；反義 depreciate。"},{"text":"set aside","reading":"phr.","zh":"撥出；預留","topic":"財務會計","example":"The company sets aside two percent of revenue for emergency reserves.","example_zh":"公司撥出營收的百分之二作為緊急準備金。","note":"搭配 set aside funds/money for + 目的。"},{"text":"draw up","reading":"phr.","zh":"擬定；草擬","topic":"財務會計","example":"The finance director will draw up next year's budget by the end of November.","example_zh":"財務總監將在十一月底前擬定明年度預算。","note":"受詞常為 budget/contract/plan。"},{"text":"pay off","reading":"phr.","zh":"還清；得到回報","topic":"財務會計","example":"The company paid off its long-term debt three years ahead of schedule.","example_zh":"公司提前三年還清了長期債務。","note":"另指努力「得到回報」：The investment paid off."},{"text":"substantially","reading":"adv.","zh":"大幅地；相當多地","topic":"財務會計","example":"Operating expenses have decreased substantially since the merger.","example_zh":"自合併以來，營運費用已大幅下降。","note":"常修飾 increase/decrease/reduce；形容詞 substantial。"},{"text":"annually","reading":"adv.","zh":"每年地","topic":"財務會計","example":"The finance committee reviews the investment portfolio annually.","example_zh":"財務委員會每年檢視一次投資組合。","note":"同義 yearly/per year；Part 5 頻率副詞考點。"},{"text":"advertise","reading":"v.","zh":"刊登廣告；宣傳","topic":"行銷業務","example":"The company plans to advertise its new skincare line in several fashion magazines next quarter.","example_zh":"該公司計畫下一季在多本時尚雜誌上為新的保養品系列刊登廣告。","note":"常搭配 advertise a position/product；名詞為 advertisement。"},{"text":"billboard","reading":"n.","zh":"大型廣告看板","topic":"行銷業務","example":"Renting a billboard near the highway exit has noticeably increased foot traffic to our showroom.","example_zh":"在高速公路出口附近租用廣告看板，明顯增加了展示中心的來客數。","note":"戶外廣告常與 outdoor advertising 一起出現在 Part 7 廣告文。"},{"text":"brand awareness","reading":"n.","zh":"品牌知名度","topic":"行銷業務","example":"The sponsorship deal is expected to raise brand awareness among younger consumers.","example_zh":"這項贊助合約預期能提升品牌在年輕消費族群中的知名度。","note":"常搭配 raise/build/increase brand awareness。"},{"text":"clientele","reading":"n.","zh":"客群；顧客群","topic":"行銷業務","example":"The boutique caters to an upscale clientele that values personalized service.","example_zh":"這家精品店服務重視個人化服務的高端客群。","note":"集合名詞，指整體顧客群；勿與 client（單一客戶）混淆。"},{"text":"cold call","reading":"n.","zh":"陌生開發電話","topic":"行銷業務","example":"New sales staff must complete a training session before making cold calls to potential clients.","example_zh":"新進業務人員必須先完成訓練課程，才能對潛在客戶進行陌生開發電話。","note":"動詞用法 cold-call someone；與 follow-up call（後續電話）相對。"},{"text":"consumer","reading":"n.","zh":"消費者","topic":"行銷業務","example":"Recent surveys show that consumers are increasingly willing to pay more for eco-friendly packaging.","example_zh":"近期調查顯示，消費者越來越願意為環保包裝多付一些錢。","note":"常見搭配 consumer demand/behavior；與 customer（顧客）略有差異。"},{"text":"coupon","reading":"n.","zh":"折價券","topic":"行銷業務","example":"Customers who subscribe to our newsletter will receive a coupon for 20 percent off their next purchase.","example_zh":"訂閱電子報的顧客將獲得下次消費八折的折價券。","note":"常搭配 redeem a coupon（兌換折價券）；注意到期日 expiration date。"},{"text":"differentiate","reading":"v.","zh":"使有差異；做出區隔","topic":"行銷業務","example":"Superior after-sales service helps the brand differentiate itself from its competitors.","example_zh":"優異的售後服務幫助該品牌與競爭對手做出區隔。","note":"常搭配 differentiate A from B；名詞為 differentiation。"},{"text":"eye-catching","reading":"adj.","zh":"吸睛的；引人注目的","topic":"行銷業務","example":"The design team created an eye-catching window display for the holiday promotion.","example_zh":"設計團隊為節慶促銷打造了吸睛的櫥窗陳列。","note":"常修飾 display/design/packaging；近義字 striking。"},{"text":"flyer","reading":"n.","zh":"傳單","topic":"行銷業務","example":"Part-time staff will hand out flyers announcing the grand opening at the station entrance.","example_zh":"工讀人員將在車站入口發放宣傳盛大開幕的傳單。","note":"常搭配 hand out/distribute flyers；亦拼作 flier。"},{"text":"focus group","reading":"n.","zh":"焦點團體（市調座談）","topic":"行銷業務","example":"Feedback from the focus group led us to redesign the product's packaging before launch.","example_zh":"焦點團體的回饋促使我們在上市前重新設計產品包裝。","note":"市場調查方法；常搭配 conduct a focus group。"},{"text":"giveaway","reading":"n.","zh":"贈品","topic":"行銷業務","example":"Visitors to our booth will receive a free giveaway while supplies last.","example_zh":"參觀我們攤位的來賓可獲得免費贈品，送完為止。","note":"while supplies last（送完為止）是廣告高頻用語。"},{"text":"markdown","reading":"n.","zh":"降價；折扣金額","topic":"行銷業務","example":"All winter apparel will be subject to a 30 percent markdown starting this weekend.","example_zh":"所有冬季服飾將自本週末起降價百分之三十。","note":"與 markup（加價）相對；動詞為 mark down。"},{"text":"niche","reading":"n.","zh":"利基市場；小眾市場","topic":"行銷業務","example":"The startup found a profitable niche by selling ergonomic accessories for remote workers.","example_zh":"這家新創公司藉由銷售給遠距工作者的人體工學配件，找到了有利可圖的利基市場。","note":"常搭配 niche market/product；指專門的小眾市場。"},{"text":"outreach","reading":"n.","zh":"外展活動；主動接觸","topic":"行銷業務","example":"Our community outreach program has helped the company build a positive local image.","example_zh":"我們的社區外展計畫幫助公司建立了良好的在地形象。","note":"常搭配 community/customer outreach；指主動接觸目標對象的活動。"},{"text":"pitch","reading":"n.","zh":"推銷簡報；提案","topic":"行銷業務","example":"The account manager delivered a persuasive sales pitch to the prospective client.","example_zh":"客戶經理向潛在客戶進行了一場很有說服力的推銷簡報。","note":"常搭配 sales pitch、deliver/make a pitch；動詞為「向…推銷」。"},{"text":"press release","reading":"n.","zh":"新聞稿","topic":"行銷業務","example":"The public relations team will issue a press release announcing the merger on Monday.","example_zh":"公關團隊將於週一發布宣布合併案的新聞稿。","note":"常搭配 issue/release a press release；Part 7 常見文體。"},{"text":"prospect","reading":"n.","zh":"潛在客戶；前景","topic":"行銷業務","example":"The sales team compiled a list of prospects to contact during the trade fair.","example_zh":"業務團隊整理了一份要在商展期間聯繫的潛在客戶名單。","note":"勿與形容詞 prospective（未來的、可能的）混淆。"},{"text":"sales representative","reading":"n.","zh":"業務代表","topic":"行銷業務","example":"A sales representative will contact you within two business days to discuss your requirements.","example_zh":"業務代表將在兩個工作天內與您聯繫，討論您的需求。","note":"常縮寫為 sales rep；business days（工作天）為高頻搭配。"},{"text":"slogan","reading":"n.","zh":"標語；廣告口號","topic":"行銷業務","example":"The agency proposed a catchy slogan to accompany the television commercials.","example_zh":"廣告代理商提出了一句琅琅上口的標語來搭配電視廣告。","note":"常搭配 catchy slogan（琅琅上口的標語）。"},{"text":"sponsor","reading":"v.","zh":"贊助","topic":"行銷業務","example":"Several local businesses have agreed to sponsor the annual charity marathon.","example_zh":"數家在地企業已同意贊助年度慈善馬拉松。","note":"名詞同形；贊助行為的名詞為 sponsorship。"},{"text":"survey","reading":"n.","zh":"問卷調查","topic":"行銷業務","example":"Please take a moment to complete our customer satisfaction survey after your purchase.","example_zh":"購買後請撥冗填寫我們的顧客滿意度問卷。","note":"常搭配 conduct/complete a survey；customer satisfaction survey 高頻。"},{"text":"telemarketing","reading":"n.","zh":"電話行銷","topic":"行銷業務","example":"The firm is expanding its telemarketing department to promote the new insurance plans.","example_zh":"該公司正在擴編電話行銷部門，以推廣新的保險方案。","note":"從業人員稱 telemarketer；與 direct mail（郵寄廣告）同屬直效行銷。"},{"text":"trade show","reading":"n.","zh":"商展；貿易展","topic":"行銷業務","example":"Our company will exhibit its latest medical devices at the international trade show in Osaka.","example_zh":"我們公司將在大阪的國際商展上展出最新的醫療器材。","note":"常搭配 exhibit at a trade show；同義詞 trade fair。"},{"text":"word of mouth","reading":"phr.","zh":"口碑；口耳相傳","topic":"行銷業務","example":"The restaurant attracts most of its new customers through word of mouth rather than paid advertising.","example_zh":"這家餐廳大多數新顧客是靠口碑而非付費廣告吸引來的。","note":"常見片語 by/through word of mouth。"},{"text":"affordable","reading":"adj.","zh":"價格實惠的；負擔得起的","topic":"行銷業務","example":"Our new line of office furniture combines modern design with affordable prices.","example_zh":"我們新系列的辦公家具結合了現代設計與實惠的價格。","note":"常搭配 affordable prices/rates；動詞 afford 後接名詞或 to V。"},{"text":"bargain","reading":"n.","zh":"特價品；划算的交易","topic":"行銷業務","example":"Shoppers can find real bargains during the store's end-of-season clearance event.","example_zh":"顧客可以在該店的換季出清活動中找到真正划算的特價品。","note":"動詞意為「討價還價」；bargain price（特惠價）常見。"},{"text":"bid","reading":"v.","zh":"投標；出價","topic":"行銷業務","example":"Three construction firms will bid on the contract to renovate the convention center.","example_zh":"三家營造公司將投標爭取會議中心的整修合約。","note":"常搭配 bid on/for a contract；名詞同形，winning bid（得標）常見。"},{"text":"catalog","reading":"n.","zh":"型錄；目錄","topic":"行銷業務","example":"Customers may browse our online catalog to compare models before visiting the store.","example_zh":"顧客可先瀏覽我們的線上型錄比較各型號，再前往門市。","note":"英式拼法 catalogue；常搭配 browse a catalog。"},{"text":"clearance sale","reading":"n.","zh":"清倉特賣","topic":"行銷業務","example":"The furniture outlet is holding a clearance sale to make room for next season's inventory.","example_zh":"這家家具暢貨中心正舉辦清倉特賣，為下一季的存貨騰出空間。","note":"常搭配 hold a clearance sale；make room for（騰出空間）高頻。"},{"text":"competitor","reading":"n.","zh":"競爭對手","topic":"行銷業務","example":"By lowering prices, the airline hopes to win customers away from its main competitor.","example_zh":"這家航空公司希望藉由降價，從主要競爭對手那裡搶下顧客。","note":"與 competition（競爭）、competitive（有競爭力的）詞性易混。"},{"text":"exclusive","reading":"adj.","zh":"獨家的；專屬的","topic":"行銷業務","example":"Members enjoy exclusive access to discounts that are not available to the general public.","example_zh":"會員享有一般大眾無法取得的專屬折扣。","note":"常搭配 exclusive offer/interview/distributor（獨家經銷商）。"},{"text":"expand","reading":"v.","zh":"擴展；擴大","topic":"行銷業務","example":"The beverage company intends to expand into Southeast Asian markets next year.","example_zh":"這家飲料公司打算明年進軍東南亞市場。","note":"常搭配 expand into a market/expand operations；名詞為 expansion。"},{"text":"free of charge","reading":"phr.","zh":"免費","topic":"行銷業務","example":"Delivery is free of charge for all orders over NT$3,000 placed through our website.","example_zh":"透過本公司網站下單滿新台幣三千元，即可享免費配送。","note":"同義 at no cost/for free；廣告與訂單信件高頻。"},{"text":"profit margin","reading":"n.","zh":"利潤率；毛利率","topic":"行銷業務","example":"Rising material costs have narrowed the profit margin on our best-selling products.","example_zh":"原物料成本上漲已壓縮了我們暢銷產品的利潤率。","note":"常搭配 narrow/wide profit margin；margin 單獨使用亦可。"},{"text":"profitable","reading":"adj.","zh":"有利潤的；賺錢的","topic":"行銷業務","example":"The overseas branch became profitable within two years of its opening.","example_zh":"海外分公司在開業兩年內就開始獲利。","note":"近義 lucrative；名詞 profitability（獲利能力）。"},{"text":"strategy","reading":"n.","zh":"策略","topic":"行銷業務","example":"The marketing team is developing a new strategy to attract first-time buyers.","example_zh":"行銷團隊正在制定新策略以吸引首購族。","note":"常搭配 develop/adopt a strategy；形容詞 strategic。"},{"text":"segment","reading":"n.","zh":"市場區隔；客層","topic":"行銷業務","example":"The luxury segment of the automobile market grew faster than analysts had expected.","example_zh":"汽車市場的豪華車客層成長速度超出分析師預期。","note":"常搭配 market segment；動詞意為「區隔、劃分」。"},{"text":"saturate","reading":"v.","zh":"使飽和","topic":"行銷業務","example":"Analysts warn that low-cost imitations could soon saturate the smartphone accessory market.","example_zh":"分析師警告，低價仿製品可能很快使智慧型手機配件市場趨於飽和。","note":"常見被動 the market is saturated；名詞 saturation。"},{"text":"state-of-the-art","reading":"adj.","zh":"最先進的","topic":"行銷業務","example":"Our flagship store features state-of-the-art displays that let customers test every product.","example_zh":"我們的旗艦店配備最先進的展示設備，讓顧客能試用每項產品。","note":"只作形容詞用；常修飾 facility/equipment/technology。"},{"text":"best-selling","reading":"adj.","zh":"最暢銷的","topic":"行銷業務","example":"The publisher will reprint the best-selling cookbook to meet growing demand.","example_zh":"出版社將再刷這本最暢銷的食譜書，以因應日益成長的需求。","note":"名詞為 bestseller；meet demand（滿足需求）為高頻搭配。"},{"text":"sample","reading":"n.","zh":"試用品；樣品","topic":"行銷業務","example":"Free samples of the new fragrance will be distributed at the cosmetics counter this weekend.","example_zh":"本週末將在化妝品專櫃發送新香水的免費試用品。","note":"常搭配 free sample、distribute samples；動詞意為「試用、抽樣」。"},{"text":"showcase","reading":"v.","zh":"展示；使亮相","topic":"行銷業務","example":"The exhibition will showcase innovative products from more than 200 local manufacturers.","example_zh":"這場展覽將展示兩百多家本地製造商的創新產品。","note":"名詞同形，指「展示櫃、展示平台」。"},{"text":"unveil","reading":"v.","zh":"發表；首度公開","topic":"行銷業務","example":"The automaker will unveil its first electric truck at the auto show in September.","example_zh":"這家車廠將於九月的車展上發表首款電動貨卡。","note":"常搭配 unveil a plan/product；近義 reveal、launch。"},{"text":"roll out","reading":"phr.","zh":"推出（新產品或服務）","topic":"行銷業務","example":"The bank will roll out its upgraded mobile app to all customers by the end of the month.","example_zh":"該銀行將於月底前向所有客戶推出升級版的行動應用程式。","note":"名詞寫作 rollout；指分階段正式推出。"},{"text":"phase out","reading":"phr.","zh":"逐步淘汰","topic":"行銷業務","example":"The company will phase out the older model once the new version hits the shelves.","example_zh":"新版本上架後，公司將逐步淘汰舊款。","note":"反義 phase in（逐步導入）；hit the shelves（上架）高頻。"},{"text":"reach out","reading":"phr.","zh":"主動聯繫","topic":"行銷業務","example":"Please reach out to our customer service team if you have any questions about your order.","example_zh":"若您對訂單有任何疑問，請主動聯繫我們的客服團隊。","note":"搭配 reach out to sb；商業郵件常用的委婉說法。"},{"text":"sell out","reading":"phr.","zh":"售完；賣光","topic":"行銷業務","example":"The limited-edition sneakers sold out within hours of the online release.","example_zh":"這款限量球鞋在網路開賣後數小時內即售完。","note":"常見被動形 be sold out；名詞/形容詞寫作 sold-out。"},{"text":"appeal to","reading":"phr.","zh":"吸引；對…有吸引力","topic":"行銷業務","example":"The redesigned packaging is intended to appeal to health-conscious shoppers.","example_zh":"重新設計的包裝旨在吸引注重健康的消費者。","note":"appeal to sb 意為「吸引」；名詞 appeal 指「吸引力」。"},{"text":"upscale","reading":"adj.","zh":"高檔的；高消費客層的","topic":"行銷業務","example":"The developer plans to open an upscale shopping mall in the city's financial district.","example_zh":"開發商計畫在市內金融區開設一間高檔購物中心。","note":"常修飾 restaurant/hotel/neighborhood；反義 budget（平價的）。"},{"text":"spokesperson","reading":"n.","zh":"發言人；代言人","topic":"行銷業務","example":"A company spokesperson confirmed that the product recall affects only one batch.","example_zh":"公司發言人證實這次產品召回只影響單一批次。","note":"中性用字，取代 spokesman/spokeswoman；常見於新聞稿。"},{"text":"significantly","reading":"adv.","zh":"顯著地；大幅地","topic":"行銷業務","example":"Online sales increased significantly after the company redesigned its website.","example_zh":"公司改版網站後，線上銷售額大幅成長。","note":"Part 5 高頻副詞；常修飾 increase/decrease/improve。"},{"text":"exclusively","reading":"adv.","zh":"獨家地；僅限","topic":"行銷業務","example":"The designer handbags are sold exclusively at our flagship store downtown.","example_zh":"這些設計師手提包僅在我們市中心的旗艦店獨家販售。","note":"常見句型 available exclusively at/to；Part 5 高頻。"},{"text":"increasingly","reading":"adv.","zh":"日益；越來越","topic":"行銷業務","example":"Shoppers are increasingly turning to mobile apps to compare prices before buying.","example_zh":"消費者越來越常在購買前用手機應用程式比價。","note":"常搭配 become increasingly + adj.；表趨勢的高頻副詞。"},{"text":"steadily","reading":"adv.","zh":"穩定地；持續地","topic":"行銷業務","example":"Membership in the loyalty club has grown steadily since its introduction two years ago.","example_zh":"自兩年前推出以來，會員俱樂部的人數持續穩定成長。","note":"常搭配 grow/increase/decline steadily；描述圖表趨勢常用。"},{"text":"considerably","reading":"adv.","zh":"相當大地；顯著地","topic":"行銷業務","example":"The response rate to the email campaign was considerably better than expected.","example_zh":"這次電子郵件行銷活動的回覆率比預期好上許多。","note":"常修飾比較級（considerably higher/lower）；Part 5 高頻。"},{"text":"baggage allowance","reading":"n.","zh":"行李托運額度","topic":"出差旅遊","example":"Passengers who exceed the baggage allowance will be charged an additional fee at check-in.","example_zh":"超過行李托運額度的旅客，將於報到時被收取額外費用。","note":"常搭配 exceed the baggage allowance；excess baggage 指超重行李。"},{"text":"bellhop","reading":"n.","zh":"飯店行李員","topic":"出差旅遊","example":"A bellhop will take your suitcases to your room while you complete the registration form.","example_zh":"在您填寫住宿登記表時，行李員會將行李送到您的房間。","note":"英式常用 porter；與 concierge（禮賓人員）職務不同。"},{"text":"business class","reading":"n.","zh":"商務艙","topic":"出差旅遊","example":"Executives traveling more than eight hours are permitted to fly business class under the new policy.","example_zh":"依據新規定，飛行超過八小時的主管可搭乘商務艙。","note":"與 economy class（經濟艙）、first class（頭等艙）並列常考。"},{"text":"cancellation","reading":"n.","zh":"取消","topic":"出差旅遊","example":"The hotel charges a cancellation fee for reservations canceled less than 24 hours in advance.","example_zh":"若在入住前二十四小時內取消訂房，飯店將收取取消費用。","note":"常搭配 cancellation fee/policy；動詞為 cancel。"},{"text":"car rental","reading":"n.","zh":"租車（服務）","topic":"出差旅遊","example":"The travel coordinator arranged a car rental so the team could drive to the client's factory.","example_zh":"差旅承辦人安排了租車，讓團隊能開車前往客戶的工廠。","note":"常搭配 car rental agency/counter；rental car 指租來的車。"},{"text":"carousel","reading":"n.","zh":"行李轉盤","topic":"出差旅遊","example":"Luggage from Flight KA118 will arrive on carousel 6 in approximately ten minutes.","example_zh":"KA118 航班的行李約十分鐘後將送達六號行李轉盤。","note":"全稱 baggage carousel；機場廣播（Part 4）高頻場景。"},{"text":"connecting flight","reading":"n.","zh":"轉機航班","topic":"出差旅遊","example":"Because of the delay, several passengers missed their connecting flight to Chicago.","example_zh":"由於班機誤點，數名旅客錯過了飛往芝加哥的轉機航班。","note":"常搭配 miss/catch a connecting flight；connection 亦可指轉機。"},{"text":"declare","reading":"v.","zh":"（向海關）申報","topic":"出差旅遊","example":"Travelers must declare any goods worth more than the duty-free limit upon entering the country.","example_zh":"旅客入境時必須申報任何超過免稅額度的物品。","note":"海關情境常見 nothing to declare（無申報物品）。"},{"text":"destination","reading":"n.","zh":"目的地","topic":"出差旅遊","example":"Please remain seated until the aircraft arrives at its final destination.","example_zh":"在飛機抵達最終目的地之前，請留在座位上。","note":"常搭配 final destination、tourist destination（觀光勝地）。"},{"text":"nonstop","reading":"adj.","zh":"直飛的；不停靠的","topic":"出差旅遊","example":"The airline now offers a nonstop flight between Taipei and Vancouver three times a week.","example_zh":"這家航空公司現在每週提供三班台北直飛溫哥華的航班。","note":"同義 direct flight；亦可作副詞（fly nonstop）。"},{"text":"domestic","reading":"adj.","zh":"國內的","topic":"出差旅遊","example":"Domestic flights depart from Terminal 1, while international flights use Terminal 2.","example_zh":"國內航班從第一航廈出發，國際航班則使用第二航廈。","note":"反義 international；domestic market（國內市場）亦高頻。"},{"text":"duty-free","reading":"adj.","zh":"免稅的","topic":"出差旅遊","example":"Passengers may purchase duty-free items after passing through the security checkpoint.","example_zh":"旅客通過安檢站後即可購買免稅商品。","note":"常搭配 duty-free shop/items；duty 在此指關稅。"},{"text":"excursion","reading":"n.","zh":"短途旅行；遠足行程","topic":"出差旅遊","example":"Conference attendees may join an optional excursion to the historic district on the final day.","example_zh":"與會者可於最後一天參加前往歷史街區的自費短途行程。","note":"常搭配 optional excursion；比 trip 更正式，多指一日遊。"},{"text":"per diem","reading":"n.","zh":"每日出差津貼","topic":"出差旅遊","example":"The company provides a per diem of NT$2,000 to cover meals during overseas business trips.","example_zh":"公司提供每日新台幣兩千元的津貼，支應海外出差期間的餐費。","note":"拉丁文「按日」；常搭配 per diem rate/allowance。"},{"text":"frequent flyer","reading":"n.","zh":"飛行常客","topic":"出差旅遊","example":"Frequent flyers can use their accumulated miles to upgrade to business class.","example_zh":"飛行常客可使用累積的哩程升等至商務艙。","note":"常搭配 frequent flyer program/miles；累積哩程用 accumulate。"},{"text":"front desk","reading":"n.","zh":"（飯店）櫃檯","topic":"出差旅遊","example":"Please return your room key to the front desk before noon on the day of departure.","example_zh":"退房當天請於中午前將房卡歸還櫃檯。","note":"同義 reception desk；front desk clerk 指櫃檯人員。"},{"text":"guided tour","reading":"n.","zh":"導覽行程","topic":"出差旅遊","example":"A guided tour of the manufacturing plant will be offered to all visiting clients.","example_zh":"所有來訪客戶都可參加工廠的導覽行程。","note":"帶隊者為 tour guide；工廠參訪是 Part 4 常見場景。"},{"text":"immigration","reading":"n.","zh":"入境審查；移民關","topic":"出差旅遊","example":"After landing, passengers should proceed to immigration with their passports ready.","example_zh":"降落後，旅客應備妥護照前往入境審查櫃檯。","note":"機場流程順序：immigration（證照查驗）→ baggage claim → customs。"},{"text":"in advance","reading":"phr.","zh":"事先；提前","topic":"出差旅遊","example":"Guests are advised to reserve airport transportation at least two days in advance.","example_zh":"建議旅客至少提前兩天預約機場接送。","note":"常見句型 well in advance、in advance of sth；Part 5 高頻。"},{"text":"landmark","reading":"n.","zh":"地標","topic":"出差旅遊","example":"The city tour includes stops at several famous landmarks, including the old cathedral.","example_zh":"市區觀光行程包含多個著名地標，其中包括那座古老的大教堂。","note":"亦可指「里程碑事件」，如 a landmark decision。"},{"text":"lodging","reading":"n.","zh":"住宿","topic":"出差旅遊","example":"The conference registration fee covers meals but not lodging or transportation.","example_zh":"會議報名費包含餐點，但不含住宿與交通。","note":"常與 meals/transportation 並列；近義 accommodation。"},{"text":"overhead compartment","reading":"n.","zh":"（機艙）座位上方置物櫃","topic":"出差旅遊","example":"Please stow your carry-on luggage in the overhead compartment or under the seat in front of you.","example_zh":"請將隨身行李放入座位上方置物櫃，或前方座椅底下。","note":"常搭配動詞 stow（收放）；機上廣播高頻用語。"},{"text":"no-show","reading":"n.","zh":"未到者；訂位未出現","topic":"出差旅遊","example":"The restaurant now requires a deposit to reduce the number of no-shows at dinner service.","example_zh":"為減少晚餐時段訂位未到的情況，這家餐廳現在要求支付訂金。","note":"訂位、訂房情境常見；deposit（訂金）為相關高頻字。"},{"text":"overbook","reading":"v.","zh":"超額訂位","topic":"出差旅遊","example":"Because the flight was overbooked, the airline offered vouchers to passengers willing to take a later one.","example_zh":"由於班機超賣，航空公司提供折抵券給願意改搭較晚班機的旅客。","note":"常見被動 be overbooked；相關字 bump（因超賣被改搭其他班機）。"},{"text":"redeem","reading":"v.","zh":"兌換（點數、券）","topic":"出差旅遊","example":"Members may redeem their reward points for hotel stays or airline tickets.","example_zh":"會員可將紅利點數兌換為住宿或機票。","note":"常搭配 redeem points/a coupon for sth；名詞 redemption。"},{"text":"room service","reading":"n.","zh":"客房餐飲服務","topic":"出差旅遊","example":"Room service is available 24 hours a day for guests staying on the executive floors.","example_zh":"入住行政樓層的房客可享二十四小時客房餐飲服務。","note":"指送餐到房服務；與 housekeeping（房務清潔）不同。"},{"text":"sightseeing","reading":"n.","zh":"觀光；遊覽","topic":"出差旅遊","example":"The delegation will have a free afternoon for sightseeing before the closing banquet.","example_zh":"代表團在閉幕晚宴前有一個下午的自由時間可以觀光。","note":"常搭配 go sightseeing、sightseeing tour；不可數名詞。"},{"text":"souvenir","reading":"n.","zh":"紀念品","topic":"出差旅遊","example":"The gift shop near the hotel lobby sells local souvenirs and handmade crafts.","example_zh":"飯店大廳旁的禮品店販售當地紀念品與手工藝品。","note":"常搭配 souvenir shop；重音在字尾，拼字易誤為 souvenier。"},{"text":"stopover","reading":"n.","zh":"中途停留；經停","topic":"出差旅遊","example":"The fare includes a two-day stopover in Singapore at no extra charge.","example_zh":"此票價包含在新加坡兩天的中途停留，不另收費。","note":"與 layover 近義，stopover 通常停留較久（過夜以上）。"},{"text":"terminal","reading":"n.","zh":"航廈；航站","topic":"出差旅遊","example":"A free monorail connects the two terminals every five minutes.","example_zh":"免費的單軌電車每五分鐘往返連接兩座航廈。","note":"亦指公車總站（bus terminal）；機場廣播高頻字。"},{"text":"transit","reading":"n.","zh":"轉機；過境；運輸","topic":"出差旅遊","example":"Passengers in transit do not need to collect their checked baggage at this airport.","example_zh":"過境旅客不需要在本機場提領托運行李。","note":"常見 in transit（運送中／過境中）；public transit 指大眾運輸。"},{"text":"transfer","reading":"v.","zh":"轉乘；轉機；調職","topic":"出差旅遊","example":"To reach the convention center, take Line 2 and transfer to the airport express at Central Station.","example_zh":"要前往會議中心，請搭乘二號線並在中央車站轉乘機場快線。","note":"常搭配 transfer to another flight/line；亦指員工調職。"},{"text":"travel agency","reading":"n.","zh":"旅行社","topic":"出差旅遊","example":"The travel agency arranged all the flights and hotel bookings for the sales conference.","example_zh":"旅行社為這場業務會議安排了所有機票與訂房事宜。","note":"承辦人員稱 travel agent；差旅安排情境高頻。"},{"text":"turbulence","reading":"n.","zh":"亂流","topic":"出差旅遊","example":"Please fasten your seat belt, as we are expecting some turbulence during the descent.","example_zh":"由於下降過程中預計會遇到亂流，請繫好安全帶。","note":"常搭配 experience turbulence、fasten your seat belt。"},{"text":"valid","reading":"adj.","zh":"有效的","topic":"出差旅遊","example":"Your passport must be valid for at least six months beyond your intended date of departure.","example_zh":"您的護照效期必須在預定出發日後至少還有六個月。","note":"常搭配 valid until/for；反義 expired（過期的）。"},{"text":"vacate","reading":"v.","zh":"騰出；搬離（房間）","topic":"出差旅遊","example":"Guests are requested to vacate their rooms by 11 a.m. so that housekeeping can prepare for new arrivals.","example_zh":"請房客於上午十一點前騰出房間，以便房務人員為新住客做準備。","note":"常搭配 vacate the room/premises；勿與 vacation（假期）混淆。"},{"text":"wake-up call","reading":"n.","zh":"晨喚服務","topic":"出差旅遊","example":"Mr. Lin requested a wake-up call at 5:30 a.m. so he would not miss his early flight.","example_zh":"林先生要求清晨五點半的晨喚服務，以免錯過一早的班機。","note":"常搭配 request a wake-up call；引申義為「警訊」。"},{"text":"upon arrival","reading":"phr.","zh":"抵達時；一到達就","topic":"出差旅遊","example":"Upon arrival at the hotel, please present a photo ID and the credit card used for the booking.","example_zh":"抵達飯店時，請出示附照片的證件與訂房時使用的信用卡。","note":"upon + V-ing/N 表「一…就…」；Part 5 高頻句型。"},{"text":"behind schedule","reading":"phr.","zh":"進度落後；誤點","topic":"出差旅遊","example":"The train is running about twenty minutes behind schedule due to signal problems.","example_zh":"由於號誌故障，這班列車目前誤點約二十分鐘。","note":"反義 ahead of schedule；on schedule 表「準點」。"},{"text":"ahead of schedule","reading":"phr.","zh":"提前；比預定進度快","topic":"出差旅遊","example":"Thanks to favorable winds, the flight landed thirty minutes ahead of schedule.","example_zh":"由於順風，班機比表定時間提早三十分鐘降落。","note":"與 behind schedule 相對；工程進度情境亦常見。"},{"text":"board","reading":"v.","zh":"登機；上車；上船","topic":"出差旅遊","example":"Passengers seated in rows 20 through 35 may now board the aircraft through Gate 12.","example_zh":"座位在二十至三十五排的旅客，現在可由十二號登機門登機。","note":"boarding 指登機程序；名詞 board 另指董事會。"},{"text":"embassy","reading":"n.","zh":"大使館","topic":"出差旅遊","example":"If you lose your passport abroad, contact the nearest embassy immediately.","example_zh":"若在國外遺失護照，請立即聯繫最近的大使館。","note":"與 consulate（領事館）層級不同；辦簽證情境常見。"},{"text":"extend","reading":"v.","zh":"延長","topic":"出差旅遊","example":"Ms. Chen asked the hotel whether she could extend her stay by two more nights.","example_zh":"陳小姐詢問飯店她是否能再延長住宿兩晚。","note":"常搭配 extend a stay/deadline/warranty；名詞 extension。"},{"text":"inclement","reading":"adj.","zh":"（天氣）惡劣的","topic":"出差旅遊","example":"All afternoon flights were grounded because of inclement weather in the region.","example_zh":"由於該地區天候惡劣，所有下午的航班都被迫停飛。","note":"幾乎只搭配 inclement weather；Part 5 高頻考點。"},{"text":"adjacent","reading":"adj.","zh":"鄰近的；毗鄰的","topic":"出差旅遊","example":"The hotel is adjacent to the convention center, so attendees can walk to all sessions.","example_zh":"這家飯店毗鄰會議中心，與會者可步行前往所有場次。","note":"固定搭配 adjacent to；Part 5 常考介係詞搭配。"},{"text":"accessible","reading":"adj.","zh":"容易到達的；可使用的","topic":"出差旅遊","example":"The resort is easily accessible by shuttle bus from the international airport.","example_zh":"從國際機場搭接駁巴士即可輕鬆抵達這座度假村。","note":"常搭配 accessible by bus/train、accessible to sb。"},{"text":"vicinity","reading":"n.","zh":"鄰近地區；附近","topic":"出差旅遊","example":"There are several affordable restaurants in the vicinity of the conference venue.","example_zh":"會議場地附近有幾家價格實惠的餐廳。","note":"固定用法 in the vicinity of；比 near 正式。"},{"text":"hospitality","reading":"n.","zh":"款待；餐旅服務業","topic":"出差旅遊","example":"We would like to thank our hosts for their warm hospitality during our visit to Seoul.","example_zh":"我們要感謝東道主在我們訪問首爾期間的熱情款待。","note":"hospitality industry 指餐旅業；勿與 hospital（醫院）混淆。"},{"text":"incidental","reading":"adj.","zh":"附帶的；雜項的","topic":"出差旅遊","example":"The company covers airfare and lodging, but incidental expenses are the employee's responsibility.","example_zh":"公司負擔機票與住宿，但雜項支出須由員工自行負責。","note":"常搭配 incidental expenses/charges；飯店常預刷押金支付雜費。"},{"text":"corporate rate","reading":"n.","zh":"公司協議價","topic":"出差旅遊","example":"Employees booking through the travel portal automatically receive the corporate rate at partner hotels.","example_zh":"透過差旅系統訂房的員工，可自動享有合作飯店的公司協議價。","note":"rate 在飯店情境指「房價」；nightly rate 指每晚房價。"},{"text":"deluxe","reading":"adj.","zh":"豪華的","topic":"出差旅遊","example":"For an additional NT$1,500 per night, guests can upgrade to a deluxe room with a harbor view.","example_zh":"每晚加價新台幣一千五百元，房客即可升等至擁有海港景觀的豪華客房。","note":"常見於房型名稱 deluxe room/suite；近義 luxurious。"},{"text":"spacious","reading":"adj.","zh":"寬敞的","topic":"出差旅遊","example":"The newly renovated rooms are more spacious and feature floor-to-ceiling windows.","example_zh":"新整修的客房更加寬敞，並配有落地窗。","note":"常修飾 room/lobby/interior；名詞 space。"},{"text":"scenic","reading":"adj.","zh":"風景優美的","topic":"出差旅遊","example":"The coastal highway offers a scenic route for visitors driving to the resort.","example_zh":"沿海公路為開車前往度假村的旅客提供了一條風景優美的路線。","note":"常搭配 scenic route/view/spot；名詞 scenery（風景）。"},{"text":"lounge","reading":"n.","zh":"貴賓室；休息室","topic":"出差旅遊","example":"Business class passengers may wait in the airline lounge until their flight is called.","example_zh":"商務艙旅客可在航空公司貴賓室等候，直到廣播通知登機。","note":"airport/departure lounge 高頻；亦指飯店交誼廳。"},{"text":"security checkpoint","reading":"n.","zh":"安檢站","topic":"出差旅遊","example":"Allow extra time to pass through the security checkpoint during peak travel season.","example_zh":"旅遊旺季期間，請預留額外時間通過安檢站。","note":"常搭配 go/pass through security；allow extra time 高頻句型。"},{"text":"misplace","reading":"v.","zh":"遺失；放錯地方","topic":"出差旅遊","example":"A passenger who misplaced his boarding pass was asked to return to the check-in counter.","example_zh":"一名遺失登機證的旅客被要求回到報到櫃檯。","note":"比 lose 委婉，指一時找不到；misplaced luggage 常見。"},{"text":"inconvenience","reading":"n.","zh":"不便","topic":"出差旅遊","example":"We apologize for any inconvenience caused by the delay and will provide meal vouchers shortly.","example_zh":"對於誤點造成的任何不便，我們深感抱歉，稍後將提供餐券。","note":"固定句型 We apologize for any inconvenience；動詞用法亦常見。"},{"text":"en route","reading":"phr.","zh":"在途中","topic":"出差旅遊","example":"The sales director is currently en route to the airport and will call you once she lands.","example_zh":"業務總監目前正在前往機場途中，降落後會立即與您聯繫。","note":"源自法文；搭配 en route to + 地點。"},{"text":"peak season","reading":"n.","zh":"旺季","topic":"出差旅遊","example":"Room rates at the beach resort nearly double during the peak season.","example_zh":"這家海濱度假村的房價在旺季幾乎翻倍。","note":"反義 off-season/low season（淡季）；peak hours 指尖峰時段。"},{"text":"drop off","reading":"phr.","zh":"讓（人）下車；歸還（物品）","topic":"出差旅遊","example":"You can drop off the rental car at any of our branches near the airport.","example_zh":"您可以在我們機場附近的任一分店歸還租賃車輛。","note":"與 pick up 相對；名詞寫作 drop-off（point）。"},{"text":"pick up","reading":"phr.","zh":"接（人）；領取（物品）","topic":"出差旅遊","example":"A driver will pick you up at the hotel lobby at 9 a.m. and take you to the client's office.","example_zh":"司機將於上午九點在飯店大廳接您，並送您前往客戶的辦公室。","note":"名詞寫作 pickup；pick up a package（領取包裹）亦高頻。"},{"text":"valet parking","reading":"n.","zh":"代客停車","topic":"餐廳飯店","example":"Valet parking is available to hotel guests at no additional charge.","example_zh":"住宿房客可免費使用代客停車服務。","note":"常搭配 complimentary valet parking；valet 指代客泊車員。"},{"text":"accommodate","reading":"v.","zh":"容納；滿足（需求）","topic":"餐廳飯店","example":"The newly expanded banquet room can accommodate up to 250 guests.","example_zh":"擴建後的宴會廳最多可容納兩百五十位賓客。","note":"accommodate a request（滿足要求）；名詞 accommodations 指住宿。"},{"text":"culinary","reading":"adj.","zh":"烹飪的","topic":"餐廳飯店","example":"The head chef studied at a prestigious culinary institute in Paris.","example_zh":"主廚曾在巴黎一所知名的烹飪學院進修。","note":"常搭配 culinary skills、culinary institute。"},{"text":"entrée","reading":"n.","zh":"主菜","topic":"餐廳飯店","example":"Each entrée on the dinner menu comes with a soup and a garden salad.","example_zh":"晚餐菜單上的每道主菜皆附湯品與田園沙拉。","note":"美式用法指主菜；appetizer 是開胃菜。"},{"text":"à la carte","reading":"adj./adv.","zh":"單點的；單點地","topic":"餐廳飯店","example":"Guests may order à la carte or choose the fixed-price menu.","example_zh":"顧客可以單點，也可以選擇固定價格的套餐。","note":"相對於 set menu／prix fixe（套餐）。"},{"text":"condiment","reading":"n.","zh":"調味料","topic":"餐廳飯店","example":"Condiments such as mustard and ketchup are located at the self-service counter.","example_zh":"芥末醬、番茄醬等調味料放置於自助吧檯。","note":"泛指桌上調味品；seasoning 多指烹調時的調味。"},{"text":"garnish","reading":"v./n.","zh":"以…裝飾（菜餚）；盤飾","topic":"餐廳飯店","example":"The grilled salmon is garnished with fresh herbs and a slice of lemon.","example_zh":"烤鮭魚以新鮮香草與檸檬片點綴。","note":"常見被動用法 be garnished with。"},{"text":"refill","reading":"n./v.","zh":"續杯；再裝滿","topic":"餐廳飯店","example":"Customers who order the lunch special receive free refills on coffee and soft drinks.","example_zh":"點午間特餐的顧客可享咖啡與汽水免費續杯。","note":"free refills（免費續杯）為菜單常見標示。"},{"text":"seasonal","reading":"adj.","zh":"季節性的；當季的","topic":"餐廳飯店","example":"The menu changes monthly to feature seasonal ingredients from local farms.","example_zh":"菜單每月更換，主打當地農場的當季食材。","note":"seasonal menu／seasonal demand 為常見搭配。"},{"text":"signature dish","reading":"n.","zh":"招牌菜","topic":"餐廳飯店","example":"The restaurant's signature dish, braised beef noodles, attracts visitors from across the region.","example_zh":"這家餐廳的招牌菜紅燒牛肉麵吸引各地訪客前來。","note":"signature 亦可修飾 drink、style（招牌飲品、招牌風格）。"},{"text":"seating capacity","reading":"n.","zh":"座位容納量","topic":"餐廳飯店","example":"The main dining hall has a seating capacity of 120, making it suitable for large receptions.","example_zh":"主用餐區座位容納量為一百二十席，適合舉辦大型宴會。","note":"capacity 亦用於 at full capacity（滿載）。"},{"text":"fine dining","reading":"n.","zh":"高級餐飲","topic":"餐廳飯店","example":"After the renovation, the hotel opened a fine dining restaurant on its top floor.","example_zh":"整修完成後，這家飯店在頂樓開設了一間高級餐廳。","note":"相對於 casual dining（休閒餐飲）。"},{"text":"patio","reading":"n.","zh":"露臺；露天座位區","topic":"餐廳飯店","example":"Weather permitting, guests may enjoy their meals on the outdoor patio.","example_zh":"天氣許可的話，顧客可在戶外露臺用餐。","note":"patio seating（戶外座位）；weather permitting 為高頻分詞片語。"},{"text":"overlook","reading":"v.","zh":"俯瞰；忽略","topic":"餐廳飯店","example":"All deluxe rooms overlook the harbor and feature floor-to-ceiling windows.","example_zh":"所有豪華客房均可俯瞰海港，並配有落地窗。","note":"一字多義：俯瞰／忽略，Part 7 常考。"},{"text":"refurbish","reading":"v.","zh":"翻新；整修","topic":"餐廳飯店","example":"The lobby will be closed next month while it is being refurbished.","example_zh":"大廳下個月將因整修而暫停開放。","note":"同義 renovate、remodel；名詞 refurbishment。"},{"text":"room rate","reading":"n.","zh":"房價","topic":"餐廳飯店","example":"Corporate clients are entitled to discounted room rates throughout the year.","example_zh":"企業客戶全年皆可享房價折扣。","note":"rate 亦見於 exchange rate、interest rate。"},{"text":"off-season","reading":"n./adj.","zh":"淡季（的）","topic":"餐廳飯店","example":"Off-season rates are nearly forty percent lower than those in July and August.","example_zh":"淡季房價比七、八月低了將近四成。","note":"亦作 low season；注意連字號寫法。"},{"text":"walk-in","reading":"n./adj.","zh":"未預約（的顧客）","topic":"餐廳飯店","example":"Walk-in customers are welcome, but priority is given to those with reservations.","example_zh":"歡迎未預約的顧客，但已訂位者優先。","note":"walk-in closet 是「更衣室」，意思不同，勿混淆。"},{"text":"adjoining","reading":"adj.","zh":"相鄰的；相連的","topic":"餐廳飯店","example":"The family requested two adjoining rooms on the same floor.","example_zh":"這家人要求同樓層兩間相連的客房。","note":"adjoining rooms（連通房）；adjacent 僅指位置鄰近。"},{"text":"courtesy","reading":"n./adj.","zh":"禮貌；免費招待的","topic":"餐廳飯店","example":"A courtesy shuttle runs between the airport and the hotel every thirty minutes.","example_zh":"機場與飯店之間每三十分鐘一班免費接駁車。","note":"courtesy of（由…提供）；courtesy shuttle 為高頻搭配。"},{"text":"incidentals","reading":"n.","zh":"雜項費用","topic":"餐廳飯店","example":"A credit card is required at check-in to cover incidentals such as minibar charges.","example_zh":"入住時須提供信用卡，以支付迷你吧等雜項費用。","note":"incidental expenses 的簡稱，多用複數。"},{"text":"deposit","reading":"n.","zh":"訂金；押金","topic":"餐廳飯店","example":"A deposit of one night's stay is required to secure your reservation.","example_zh":"須支付一晚房費作為訂金以保留訂房。","note":"pay a deposit；動詞義為「存放、存款」。"},{"text":"proprietor","reading":"n.","zh":"業主；老闆","topic":"餐廳飯店","example":"The proprietor of the café personally greets regular customers every morning.","example_zh":"這家咖啡店的老闆每天早上親自迎接熟客。","note":"同義 owner；勿與 proprietary（專有的）混淆。"},{"text":"decor","reading":"n.","zh":"裝潢；佈置","topic":"餐廳飯店","example":"The restaurant's decor reflects the owner's interest in traditional Taiwanese design.","example_zh":"這家餐廳的裝潢呈現老闆對台灣傳統設計的喜愛。","note":"interior decor（室內裝潢）；動詞 decorate。"},{"text":"ambiance","reading":"n.","zh":"氣氛；情調","topic":"餐廳飯店","example":"Soft lighting and live piano music create a relaxing ambiance in the lounge.","example_zh":"柔和的燈光與現場鋼琴演奏為酒廊營造出放鬆的氣氛。","note":"亦拼作 ambience；同義 atmosphere。"},{"text":"attentive","reading":"adj.","zh":"周到的；細心的","topic":"餐廳飯店","example":"Reviewers praised the attentive staff and the quality of the food.","example_zh":"評論者稱讚服務人員周到以及餐點的品質。","note":"attentive to detail（注重細節）；名詞 attention。"},{"text":"courteous","reading":"adj.","zh":"有禮貌的","topic":"餐廳飯店","example":"Front desk employees are expected to remain courteous even with difficult guests.","example_zh":"即使面對難應付的客人，櫃檯人員也應保持禮貌。","note":"名詞 courtesy；同義 polite。"},{"text":"cordially","reading":"adv.","zh":"誠摯地","topic":"餐廳飯店","example":"You are cordially invited to the grand opening of our new restaurant on May 3.","example_zh":"誠摯邀請您參加本餐廳五月三日的盛大開幕。","note":"cordially invited 為邀請函固定用語。"},{"text":"reasonably","reading":"a
