dv.","zh":"合理地；相當","topic":"餐廳飯店","example":"The bistro serves reasonably priced set lunches for office workers nearby.","example_zh":"這家小餐館為附近上班族提供價格合理的午間套餐。","note":"reasonably priced（價格合理）為高頻搭配。"},{"text":"exceptionally","reading":"adv.","zh":"格外地；非常","topic":"餐廳飯店","example":"The banquet staff did an exceptionally good job handling the last-minute changes.","example_zh":"宴會工作人員在處理臨時變動上表現得格外出色。","note":"修飾形容詞或副詞；勿與 exceptional（傑出的）詞性混淆。"},{"text":"run out of","reading":"phr.","zh":"用完；耗盡","topic":"餐廳飯店","example":"The kitchen ran out of the daily special before 7 p.m. because of high demand.","example_zh":"由於需求踴躍，廚房在晚上七點前就把今日特餐賣完了。","note":"run out of stock／supplies；不及物用 run out。"},{"text":"wait on","reading":"phr.","zh":"服侍；接待（顧客）","topic":"餐廳飯店","example":"Ms. Lopez waited on more than thirty tables during the dinner shift.","example_zh":"羅培茲小姐在晚班期間接待了超過三十桌客人。","note":"勿與 wait for（等待）混淆。"},{"text":"function room","reading":"n.","zh":"宴會廳；多功能活動室","topic":"餐廳飯店","example":"The hotel's function rooms can be reserved for weddings, seminars, and year-end parties.","example_zh":"飯店的宴會廳可供婚宴、研討會與尾牙租用。","note":"function 亦指「活動、宴會」，為 Part 7 常見義。"},{"text":"sanitary","reading":"adj.","zh":"衛生的","topic":"餐廳飯店","example":"Health inspectors visit the kitchen regularly to ensure sanitary conditions.","example_zh":"衛生稽查員定期到廚房查核，確保環境衛生。","note":"名詞 sanitation（公共衛生）。"},{"text":"perishable","reading":"adj.","zh":"易腐壞的","topic":"餐廳飯店","example":"Perishable ingredients are delivered fresh each morning and stored immediately.","example_zh":"易腐壞的食材每天早上新鮮送達並立即存放。","note":"perishable goods／items；反義 non-perishable。"},{"text":"ingredient","reading":"n.","zh":"食材；成分","topic":"餐廳飯店","example":"The chef insists on using only locally grown ingredients in every dish.","example_zh":"主廚堅持每道菜只使用本地種植的食材。","note":"亦指成功的「要素」，如 key ingredient。"},{"text":"cutlery","reading":"n.","zh":"刀叉餐具","topic":"餐廳飯店","example":"Servers should check that the cutlery is polished before the dining room opens.","example_zh":"開店前，服務生應確認刀叉餐具都已擦亮。","note":"美式亦稱 silverware；為不可數名詞。"},{"text":"tableware","reading":"n.","zh":"餐具","topic":"餐廳飯店","example":"The banquet department ordered new tableware for the hotel's anniversary dinner.","example_zh":"宴會部為飯店週年晚宴訂購了新餐具。","note":"泛指杯盤碗筷；不可數名詞。"},{"text":"centerpiece","reading":"n.","zh":"餐桌中央擺飾；核心","topic":"餐廳飯店","example":"Floral centerpieces will be placed on every table at the awards banquet.","example_zh":"頒獎晚宴的每張桌子上都會擺放花藝桌飾。","note":"亦比喻「最重要的部分」，如 the centerpiece of the plan。"},{"text":"resort","reading":"n.","zh":"度假村","topic":"餐廳飯店","example":"The seaside resort offers special weekday packages for corporate retreats.","example_zh":"這家海濱度假村提供企業員工旅遊的平日特惠專案。","note":"as a last resort 意為「最後手段」，語意不同。"},{"text":"waitstaff","reading":"n.","zh":"（餐廳）服務人員","topic":"餐廳飯店","example":"All new waitstaff must complete a two-week training program before serving guests.","example_zh":"所有新進服務人員須完成兩週訓練後才能為顧客服務。","note":"集合名詞，不加 s；涵蓋 waiter 與 waitress。"},{"text":"linens","reading":"n.","zh":"床單織品；桌巾","topic":"餐廳飯店","example":"Housekeeping replaces the bed linens and towels every day at the guest's request.","example_zh":"房客要求時，房務人員每天更換床單與毛巾。","note":"bed linens／table linens；多用複數。"},{"text":"toiletries","reading":"n.","zh":"盥洗用品","topic":"餐廳飯店","example":"Complimentary toiletries, including shampoo and soap, are provided in every bathroom.","example_zh":"每間浴室均提供洗髮精、香皂等免費盥洗用品。","note":"多用複數；常與 complimentary 搭配。"},{"text":"continental breakfast","reading":"n.","zh":"歐陸式早餐","topic":"餐廳飯店","example":"A continental breakfast is served in the lobby from 6:30 to 9:30 a.m.","example_zh":"大廳於上午六點半至九點半供應歐陸式早餐。","note":"內容較簡單，相對於 full／American breakfast。"},{"text":"settle the bill","reading":"phr.","zh":"結帳；付清帳款","topic":"餐廳飯店","example":"Mr. Park asked to settle the bill with his corporate credit card.","example_zh":"朴先生要求用公司信用卡結帳。","note":"settle an account／invoice（結清帳款）亦為高頻。"},{"text":"order form","reading":"n.","zh":"訂購單","topic":"購物訂單","example":"Please complete the attached order form and return it by fax or email.","example_zh":"請填妥附件訂購單，並以傳真或電子郵件回傳。","note":"搭配 fill out／complete an order form。"},{"text":"in stock","reading":"phr.","zh":"有庫存","topic":"購物訂單","example":"The model you requested is currently in stock and can be shipped today.","example_zh":"您詢問的型號目前有庫存，今天即可出貨。","note":"反義 out of stock（缺貨）。"},{"text":"restock","reading":"v.","zh":"補貨","topic":"購物訂單","example":"Store shelves are restocked every morning before the doors open at ten.","example_zh":"每天早上十點開店前，貨架都會補貨完成。","note":"restock the shelves；名詞可作 restocking fee（退貨整新費）。"},{"text":"replenish","reading":"v.","zh":"補充","topic":"購物訂單","example":"Warehouse staff replenish the inventory whenever supplies fall below the minimum level.","example_zh":"存量一低於最低水位，倉庫人員就會補充庫存。","note":"replenish supplies／stock；比 refill 正式。"},{"text":"backlog","reading":"n.","zh":"積壓的訂單（工作）","topic":"購物訂單","example":"Because of the holiday rush, the factory is working overtime to clear the backlog of orders.","example_zh":"因為節慶採購潮，工廠正加班消化積壓的訂單。","note":"a backlog of orders／work；clear a backlog（消化積壓）。"},{"text":"fulfill","reading":"v.","zh":"履行；完成（訂單）","topic":"購物訂單","example":"Our distribution center can fulfill most online orders within 48 hours.","example_zh":"本公司物流中心可在四十八小時內完成多數線上訂單。","note":"fulfill an order／obligation；名詞 fulfillment。"},{"text":"parcel","reading":"n.","zh":"包裹","topic":"購物訂單","example":"Parcels that cannot be delivered will be held at the local post office for ten days.","example_zh":"無法投遞的包裹將在當地郵局保留十天。","note":"同義 package；parcel delivery 包裹遞送。"},{"text":"tracking number","reading":"n.","zh":"（包裹）追蹤號碼","topic":"購物訂單","example":"You will receive a tracking number by email once your order has been shipped.","example_zh":"訂單出貨後，您將收到載有追蹤號碼的電子郵件。","note":"track a shipment（追蹤貨件）為相關高頻搭配。"},{"text":"overnight delivery","reading":"n.","zh":"隔夜送達","topic":"購物訂單","example":"For an additional fee, customers can choose overnight delivery on most items.","example_zh":"多數商品加價後即可選擇隔夜送達服務。","note":"同義 next-day delivery；overnight 亦可作副詞。"},{"text":"proof of purchase","reading":"n.","zh":"購買證明","topic":"購物訂單","example":"A receipt or other proof of purchase is required for all refunds and exchanges.","example_zh":"辦理退款或換貨時，須出示收據或其他購買證明。","note":"退換貨規定的固定用語，Part 7 常見。"},{"text":"store credit","reading":"n.","zh":"商店抵用金","topic":"購物訂單","example":"Items returned without a receipt can be exchanged for store credit only.","example_zh":"無收據的退貨商品僅能折抵為商店抵用金。","note":"issue store credit（發給抵用金）；非現金退款。"},{"text":"gift certificate","reading":"n.","zh":"禮券","topic":"購物訂單","example":"Gift certificates can be redeemed at any of our locations nationwide.","example_zh":"禮券可在全國任一門市兌換使用。","note":"同義 gift card；常與 redeem 搭配。"},{"text":"clearance","reading":"n.","zh":"清倉特賣；出清","topic":"購物訂單","example":"All floor models are on clearance to make room for next year's inventory.","example_zh":"所有展示品正在出清，以騰出空間存放明年的商品。","note":"clearance sale／on clearance；亦有「許可」之義。"},{"text":"vendor","reading":"n.","zh":"供應商；攤商","topic":"購物訂單","example":"All vendors must submit invoices to the accounting department by the 25th.","example_zh":"所有供應商須在二十五日前將發票送交會計部門。","note":"同義 supplier；street vendor 指攤販。"},{"text":"supplier","reading":"n.","zh":"供應商","topic":"購物訂單","example":"We switched to a local supplier to shorten delivery times and reduce costs.","example_zh":"我們改用本地供應商，以縮短交貨時間並降低成本。","note":"supply chain（供應鏈）為相關高頻詞。"},{"text":"requisition","reading":"n.","zh":"請購單；申請","topic":"購物訂單","example":"Submit a purchase requisition to the procurement office before ordering new equipment.","example_zh":"訂購新設備前，請先向採購部門提出請購單。","note":"purchase requisition（請購單）為公司內部文件。"},{"text":"billing statement","reading":"n.","zh":"帳單明細","topic":"購物訂單","example":"Please review your monthly billing statement and report any errors within 30 days.","example_zh":"請核對每月帳單明細，若有錯誤請於三十天內反映。","note":"billing error／billing department 亦為常見搭配。"},{"text":"rectify","reading":"v.","zh":"改正；修正","topic":"購物訂單","example":"We apologize for the billing error and will rectify it immediately.","example_zh":"帳單錯誤造成不便，我們深感抱歉並將立即更正。","note":"rectify an error／a problem；同義 correct。"},{"text":"return policy","reading":"n.","zh":"退貨政策","topic":"購物訂單","example":"Under our return policy, unopened items may be returned within 30 days.","example_zh":"依本店退貨政策，未拆封商品可於三十天內退回。","note":"under the policy（依據政策）為介系詞考點。"},{"text":"faulty","reading":"adj.","zh":"有瑕疵的；故障的","topic":"購物訂單","example":"Customers who receive faulty goods are entitled to a full refund or replacement.","example_zh":"收到瑕疵商品的顧客可獲全額退款或換貨。","note":"同義 defective；be entitled to 為高頻搭配。"},{"text":"in transit","reading":"phr.","zh":"運送途中","topic":"購物訂單","example":"According to the tracking information, your package is still in transit.","example_zh":"根據追蹤資訊，您的包裹仍在運送途中。","note":"damaged in transit（運送途中受損）為理賠常用語。"},{"text":"carton","reading":"n.","zh":"紙箱；紙盒","topic":"購物訂單","example":"Each carton contains twenty-four bottles and should be stored upright.","example_zh":"每箱裝有二十四瓶，應直立存放。","note":"a carton of milk（一盒牛奶）；勿與 cartoon 混淆。"},{"text":"packaging","reading":"n.","zh":"包裝","topic":"購物訂單","example":"The company redesigned its packaging to use recyclable materials.","example_zh":"該公司重新設計包裝，改用可回收材質。","note":"packaging materials；不可數名詞。"},{"text":"assemble","reading":"v.","zh":"組裝；集合","topic":"購物訂單","example":"The bookshelf is easy to assemble and comes with all the necessary tools.","example_zh":"這座書架容易組裝，並附有所有必要工具。","note":"assembly required（需自行組裝）；亦指人「集合」。"},{"text":"durable","reading":"adj.","zh":"耐用的","topic":"購物訂單","example":"These work boots are made of durable leather that withstands daily use.","example_zh":"這款工作靴採用耐磨皮革，經得起每日使用。","note":"durable goods（耐久財）；名詞 durability。"},{"text":"promotional","reading":"adj.","zh":"促銷的","topic":"購物訂單","example":"The promotional price is available only to customers who order before June 30.","example_zh":"促銷價僅限六月三十日前下單的顧客。","note":"promotional code／offer；promotion 亦指「升遷」。"},{"text":"minimum order","reading":"n.","zh":"最低訂購量","topic":"購物訂單","example":"Free shipping applies to purchases that meet the minimum order of NT$1,500.","example_zh":"消費滿最低訂購金額一千五百元即可免運。","note":"meet the minimum order（達到最低訂購門檻）。"},{"text":"unit price","reading":"n.","zh":"單價","topic":"購物訂單","example":"The unit price decreases when customers order more than 100 pieces.","example_zh":"訂購超過一百件時，單價隨之降低。","note":"per unit（每單位）；與 bulk discount 概念相關。"},{"text":"subtotal","reading":"n.","zh":"小計","topic":"購物訂單","example":"The subtotal does not include shipping charges or sales tax.","example_zh":"小計金額不含運費與銷售稅。","note":"與 grand total（總計）相對。"},{"text":"sales tax","reading":"n.","zh":"銷售稅；營業稅","topic":"購物訂單","example":"A five percent sales tax will be added to the total at checkout.","example_zh":"結帳時將於總額外加百分之五的銷售稅。","note":"tax-included（含稅）與 plus tax（另加稅）須分清。"},{"text":"handling fee","reading":"n.","zh":"手續費；處理費","topic":"購物訂單","example":"A small handling fee is charged on all international orders.","example_zh":"所有國際訂單將酌收少許處理費。","note":"shipping and handling（運費及手續費）為固定用語。"},{"text":"upfront","reading":"adj./adv.","zh":"預付的；預先","topic":"購物訂單","example":"Suppliers may ask new clients to pay fifty percent upfront.","example_zh":"供應商可能要求新客戶預付五成款項。","note":"an upfront payment（預付款）；亦指「坦率的」。"},{"text":"money-back guarantee","reading":"n.","zh":"退款保證","topic":"購物訂單","example":"All products come with a 30-day money-back guarantee.","example_zh":"所有商品均享三十天退款保證。","note":"come with（附有）為高頻搭配。"},{"text":"recall","reading":"n./v.","zh":"召回；回想","topic":"購物訂單","example":"The manufacturer issued a recall of the coffee makers due to a wiring problem.","example_zh":"製造商因線路問題宣布召回該款咖啡機。","note":"issue a recall（宣布召回）；亦指「回想起」。"},{"text":"counterfeit","reading":"adj./n.","zh":"仿冒的；贗品","topic":"購物訂單","example":"The website warns shoppers about counterfeit goods sold at unusually low prices.","example_zh":"該網站提醒消費者留意以異常低價出售的仿冒品。","note":"counterfeit bills（偽鈔）；同義 fake。"},{"text":"authentic","reading":"adj.","zh":"正品的；道地的","topic":"購物訂單","example":"Each handbag comes with a certificate proving that it is authentic.","example_zh":"每個手提包都附有證明書，保證為正品。","note":"名詞 authenticity；authentic cuisine 指道地料理。"},{"text":"apparel","reading":"n.","zh":"服飾","topic":"購物訂單","example":"The department store is expanding its men's apparel section next quarter.","example_zh":"這家百貨公司下一季將擴大男性服飾區。","note":"同義 clothing；不可數名詞。"},{"text":"fitting room","reading":"n.","zh":"試衣間","topic":"購物訂單","example":"Customers may take up to six items into the fitting room at one time.","example_zh":"顧客一次最多可帶六件商品進試衣間。","note":"同義 dressing room。"},{"text":"try on","reading":"phr.","zh":"試穿","topic":"購物訂單","example":"Feel free to try on any garment before you decide to buy it.","example_zh":"決定購買前，歡迎試穿任何一件衣服。","note":"代名詞置中：try it on；garment 指單件衣物。"},{"text":"at no extra charge","reading":"phr.","zh":"不另外收費","topic":"購物訂單","example":"Gift wrapping is available at no extra charge during the holiday season.","example_zh":"節慶期間提供禮品包裝服務，不另外收費。","note":"同義 free of charge；charge 指「費用」。"},{"text":"no later than","reading":"phr.","zh":"不遲於","topic":"購物訂單","example":"Payment must be received no later than the tenth of each month.","example_zh":"款項須於每月十日前收到。","note":"表期限的固定片語，Part 5 高頻。"},{"text":"upon receipt","reading":"phr.","zh":"收到時；一收到就","topic":"購物訂單","example":"Please inspect the merchandise upon receipt and report any damage within 48 hours.","example_zh":"收到商品時請立即檢查，如有損壞請於四十八小時內回報。","note":"payable upon receipt（貨到即付）為帳務常用語。"},{"text":"prior to","reading":"phr.","zh":"在…之前","topic":"購物訂單","example":"Orders may be canceled free of charge prior to shipment.","example_zh":"出貨前取消訂單不收取任何費用。","note":"後接名詞或 V-ing；比 before 正式。"},{"text":"in a timely manner","reading":"phr.","zh":"及時地","topic":"購物訂單","example":"Refund requests are processed in a timely manner, usually within five business days.","example_zh":"退款申請會及時處理，通常在五個工作天內完成。","note":"timely 是形容詞，沒有副詞 timelily，Part 5 考點。"},{"text":"turnaround time","reading":"n.","zh":"作業（交件）所需時間","topic":"購物訂單","example":"The print shop offers a 24-hour turnaround time on business card orders.","example_zh":"這家印刷店的名片訂單可在二十四小時內交件。","note":"quick turnaround（快速交件）為常見說法。"},{"text":"patronage","reading":"n.","zh":"惠顧","topic":"購物訂單","example":"We appreciate your continued patronage and look forward to serving you again.","example_zh":"感謝您長期以來的惠顧，期待再次為您服務。","note":"感謝函結尾常用語；patron 指顧客。"},{"text":"supply chain","reading":"n.","zh":"供應鏈","topic":"生產物流","example":"Recent port congestion has disrupted the company's supply chain across Southeast Asia.","example_zh":"近期的港口壅塞已擾亂公司在東南亞的供應鏈。","note":"常見搭配 supply chain disruption（供應鏈中斷）、supply chain management。"},{"text":"carrier","reading":"n.","zh":"貨運業者；承運人","topic":"生產物流","example":"The carrier will notify the recipient once the package arrives at the local hub.","example_zh":"包裹抵達當地轉運站後，貨運業者會通知收件人。","note":"也指航空公司（air carrier）；勿與 courier（快遞）混淆。"},{"text":"cargo","reading":"n.","zh":"貨物；貨運","topic":"生產物流","example":"All cargo must be inspected at the port before it can be loaded onto the vessel.","example_zh":"所有貨物裝上船之前，都必須先在港口接受檢查。","note":"不可數名詞；常見搭配 cargo hold（貨艙）、cargo ship。"},{"text":"pallet","reading":"n.","zh":"棧板","topic":"生產物流","example":"Workers stacked the boxes on wooden pallets so the forklift could move them easily.","example_zh":"工人把箱子疊放在木製棧板上，方便堆高機搬運。","note":"拼字勿與 palette（調色盤）、palate（味覺）混淆。"},{"text":"forklift","reading":"n.","zh":"堆高機","topic":"生產物流","example":"Only certified operators are allowed to drive the forklift inside the warehouse.","example_zh":"只有持有證照的操作員才能在倉庫內駕駛堆高機。","note":"Part 1 圖片題常考；搭配 operate a forklift。"},{"text":"crate","reading":"n.","zh":"板條箱；貨箱","topic":"生產物流","example":"The glassware was packed in wooden crates to prevent damage during shipping.","example_zh":"玻璃器皿裝在木製板條箱中，以防運送過程中受損。","note":"比 box 更堅固的木箱；Part 1 常見單字。"},{"text":"container","reading":"n.","zh":"貨櫃；容器","topic":"生產物流","example":"The shipping company charges a flat rate for each container transported overseas.","example_zh":"船運公司對每個運往海外的貨櫃收取固定費率。","note":"常見搭配 container ship（貨櫃船）、shipping container。"},{"text":"turnaround","reading":"n.","zh":"週轉時間；處理時間","topic":"生產物流","example":"The print shop offers a 24-hour turnaround on all business card orders.","example_zh":"這家印刷廠的所有名片訂單皆可在24小時內完成。","note":"常見搭配 turnaround time；也可指業績好轉。"},{"text":"throughput","reading":"n.","zh":"處理量；吞吐量","topic":"生產物流","example":"Installing the new sorting system doubled the warehouse's daily throughput.","example_zh":"安裝新的分類系統後，倉庫的每日處理量增加了一倍。","note":"指單位時間內的處理量；與 output（產出）意思相近。"},{"text":"stockpile","reading":"v.","zh":"囤積；儲備","topic":"生產物流","example":"The manufacturer began to stockpile key components ahead of the anticipated shortage.","example_zh":"製造商在預期短缺來臨前開始囤積關鍵零組件。","note":"亦可當名詞（儲備量）；語氣比 store 更強調大量儲備。"},{"text":"depot","reading":"n.","zh":"倉庫；集散站","topic":"生產物流","example":"Delivery trucks return to the depot each evening to be loaded for the next day.","example_zh":"配送卡車每天傍晚返回集散站，裝載隔日的貨物。","note":"注意發音字尾 t 不發音；bus depot 指公車調度站。"},{"text":"distribution center","reading":"n.","zh":"物流中心；配送中心","topic":"生產物流","example":"Orders placed before noon are shipped from our regional distribution center the same day.","example_zh":"中午前下的訂單，當天就會從我們的區域物流中心出貨。","note":"與 warehouse 相比更強調配送功能；縮寫 DC。"},{"text":"fulfillment","reading":"n.","zh":"訂單履行；出貨作業","topic":"生產物流","example":"The company outsourced order fulfillment to a third-party logistics provider.","example_zh":"該公司將訂單出貨作業外包給第三方物流業者。","note":"常見搭配 order fulfillment；動詞為 fulfill an order。"},{"text":"purchase order","reading":"n.","zh":"採購單；訂購單","topic":"生產物流","example":"Please include the purchase order number on all invoices to avoid payment delays.","example_zh":"請在所有發票上註明採購單號碼，以免延誤付款。","note":"縮寫 PO；Part 7 商業文件題高頻詞。"},{"text":"subcontractor","reading":"n.","zh":"轉包商；下游承包商","topic":"生產物流","example":"The construction firm hired a subcontractor to handle the electrical work.","example_zh":"這家營造公司僱用轉包商負責電力工程。","note":"sub- 表「下層」；由 contractor 再往下發包的業者。"},{"text":"component","reading":"n.","zh":"零組件；組成部分","topic":"生產物流","example":"A shortage of electronic components forced the plant to reduce production temporarily.","example_zh":"電子零組件短缺迫使工廠暫時減產。","note":"與 part 同義但較正式；key component 為常見搭配。"},{"text":"spare part","reading":"n.","zh":"備用零件","topic":"生產物流","example":"The technician keeps spare parts on hand so that repairs can be completed quickly.","example_zh":"技師隨時備有備用零件，以便快速完成維修。","note":"spare 表「備用的」；spare tire（備胎）同一用法。"},{"text":"batch","reading":"n.","zh":"一批；批次","topic":"生產物流","example":"The entire batch of syrup was discarded after the quality test failed.","example_zh":"品質檢驗未通過後，整批糖漿都被銷毀了。","note":"a batch of 為常見搭配；也用於烘焙（a batch of cookies）。"},{"text":"capacity","reading":"n.","zh":"產能；容量","topic":"生產物流","example":"The plant is currently operating at full capacity to meet holiday demand.","example_zh":"為了因應節慶需求，工廠目前正以全產能運轉。","note":"at full capacity（滿載運轉）為高頻搭配；也指場地容納量。"},{"text":"downtime","reading":"n.","zh":"停機時間；停工期","topic":"生產物流","example":"Regular maintenance is scheduled at night to minimize downtime on the production line.","example_zh":"定期保養安排在夜間進行，以將生產線停機時間降到最低。","note":"常見搭配 minimize/reduce downtime；相反概念為 uptime。"},{"text":"bottleneck","reading":"n.","zh":"瓶頸","topic":"生產物流","example":"Manual data entry has become a bottleneck in the order processing workflow.","example_zh":"人工輸入資料已成為訂單處理流程中的瓶頸。","note":"指流程中拖慢整體速度的環節；動詞搭配 create/remove a bottleneck。"},{"text":"calibrate","reading":"v.","zh":"校準；校正","topic":"生產物流","example":"The scales must be calibrated monthly to ensure accurate measurements.","example_zh":"磅秤必須每月校準，以確保測量準確。","note":"名詞 calibration；儀器設備保養情境常見。"},{"text":"inspect","reading":"v.","zh":"檢查；檢驗","topic":"生產物流","example":"Each unit is inspected for defects before it leaves the assembly area.","example_zh":"每件產品離開組裝區前都會檢查是否有瑕疵。","note":"名詞 inspection；inspector 為檢驗員。"},{"text":"flaw","reading":"n.","zh":"瑕疵；缺陷","topic":"生產物流","example":"A design flaw in the handle caused the product to be pulled from store shelves.","example_zh":"把手的設計瑕疵導致該產品從店面下架。","note":"形容詞 flawed（有缺陷的）、flawless（完美無瑕的）。"},{"text":"shelf life","reading":"n.","zh":"保存期限","topic":"生產物流","example":"The new packaging extends the product's shelf life by up to six months.","example_zh":"新包裝可將產品的保存期限延長最多六個月。","note":"搭配 extend/prolong the shelf life；與 expiration date 相關。"},{"text":"barcode","reading":"n.","zh":"條碼","topic":"生產物流","example":"Scan the barcode on each carton to update the inventory records automatically.","example_zh":"掃描每個紙箱上的條碼，即可自動更新庫存紀錄。","note":"搭配 scan a barcode；QR code 為二維條碼。"},{"text":"bill of lading","reading":"n.","zh":"提單","topic":"生產物流","example":"The importer must present the bill of lading to claim the goods at the port.","example_zh":"進口商必須出示提單，才能在港口提領貨物。","note":"縮寫 B/L；海運文件，勿與 invoice（發票）混淆。"},{"text":"freight forwarder","reading":"n.","zh":"貨運承攬業者","topic":"生產物流","example":"Our freight forwarder arranged both the ocean shipping and the customs paperwork.","example_zh":"我們的貨運承攬業者安排了海運及報關文件。","note":"代客戶安排運輸的中介業者；forward 有「轉寄、轉運」之意。"},{"text":"inbound","reading":"adj.","zh":"入境的；到達的","topic":"生產物流","example":"All inbound shipments are logged at the receiving dock before storage.","example_zh":"所有到貨的貨件在入庫前都會在收貨區登記。","note":"相反詞 outbound；inbound flight 指抵達班機。"},{"text":"outbound","reading":"adj.","zh":"出境的；發出的","topic":"生產物流","example":"Outbound trucks are weighed at the gate before leaving the facility.","example_zh":"出貨卡車離開廠區前會在大門過磅。","note":"與 inbound 相對；outbound shipment 指出貨。"},{"text":"ramp up","reading":"phr.","zh":"提高；擴大（產量）","topic":"生產物流","example":"The factory ramped up production to meet the surge in overseas orders.","example_zh":"工廠提高產量以因應海外訂單激增。","note":"常見搭配 ramp up production/output；ramp 原意為斜坡。"},{"text":"stock up","reading":"phr.","zh":"囤貨；儲備","topic":"生產物流","example":"Retailers usually stock up on seasonal items well before the holidays.","example_zh":"零售商通常在節慶前很早就開始囤積季節性商品。","note":"固定搭配 stock up on + 物品；勿漏掉介系詞 on。"},{"text":"automate","reading":"v.","zh":"使自動化","topic":"生產物流","example":"The warehouse plans to automate its sorting process to reduce labor costs.","example_zh":"倉庫計畫將分類流程自動化以降低人力成本。","note":"名詞 automation；形容詞 automated（自動化的）。"},{"text":"machinery","reading":"n.","zh":"機械；機器（總稱）","topic":"生產物流","example":"Heavy machinery must be shut down completely before any repairs are attempted.","example_zh":"進行任何維修前，重型機械必須完全關閉。","note":"不可數名詞；單一機器用 machine。"},{"text":"plant","reading":"n.","zh":"工廠","topic":"生產物流","example":"The automaker will open a new assembly plant in the industrial park next year.","example_zh":"這家汽車製造商明年將在工業園區開設新的組裝廠。","note":"多益中常指工廠而非植物；manufacturing plant 為高頻搭配。"},{"text":"prototype","reading":"n.","zh":"原型；樣品機","topic":"生產物流","example":"Engineers tested the prototype thoroughly before approving it for mass production.","example_zh":"工程師徹底測試原型後，才核准進入量產。","note":"搭配 develop/test a prototype；產品開發情境常見。"},{"text":"mass production","reading":"n.","zh":"大量生產；量產","topic":"生產物流","example":"The device will enter mass production once the final design is approved.","example_zh":"最終設計核准後，這款裝置就會進入量產。","note":"搭配 enter/go into mass production；mass-produce 為動詞。"},{"text":"productivity","reading":"n.","zh":"生產力","topic":"生產物流","example":"Flexible schedules have noticeably improved productivity on the factory floor.","example_zh":"彈性排班明顯提升了工廠現場的生產力。","note":"搭配 boost/improve productivity；形容詞 productive。"},{"text":"shortage","reading":"n.","zh":"短缺","topic":"生產物流","example":"A labor shortage has delayed shipments from several regional warehouses.","example_zh":"人力短缺已使數個區域倉庫的出貨延誤。","note":"a shortage of + 名詞；相反詞 surplus（過剩）。"},{"text":"deplete","reading":"v.","zh":"耗盡；使大量減少","topic":"生產物流","example":"Strong holiday sales quickly depleted the store's remaining inventory.","example_zh":"節慶期間的熱賣迅速耗盡了店內剩餘的庫存。","note":"常用被動 be depleted；名詞 depletion。"},{"text":"conveyor belt","reading":"n.","zh":"輸送帶","topic":"生產物流","example":"Packages move along the conveyor belt to the loading dock for shipment.","example_zh":"包裹沿著輸送帶送往裝貨區準備出貨。","note":"Part 1 圖片題常見；conveyor 源自 convey（運送）。"},{"text":"overhaul","reading":"v.","zh":"大修；全面翻修","topic":"生產物流","example":"The maintenance crew will overhaul the packaging line during the annual shutdown.","example_zh":"維修團隊將在年度停工期間對包裝線進行大修。","note":"亦可當名詞（a complete overhaul）；比 repair 更全面。"},{"text":"packing slip","reading":"n.","zh":"裝箱單；出貨明細","topic":"生產物流","example":"Check the items against the packing slip as soon as the shipment arrives.","example_zh":"貨件送達後，請立即核對商品與裝箱單。","note":"隨貨附上的明細單；勿與 invoice（請款發票）混淆。"},{"text":"reroute","reading":"v.","zh":"改道；變更路線","topic":"生產物流","example":"Due to the highway closure, all deliveries were rerouted via the coastal road.","example_zh":"由於高速公路封閉，所有配送均改道行經濱海公路。","note":"re-（重新）+ route（路線）；常用於交通與物流公告。"},{"text":"provision","reading":"n.","zh":"條款；規定","topic":"合約法務","example":"Under the provisions of the contract, either party may request a review annually.","example_zh":"依據合約條款，任一方每年皆可要求進行檢視。","note":"與 clause 同義；under the provisions of 為高頻搭配。"},{"text":"terms and conditions","reading":"n.","zh":"條款與細則","topic":"合約法務","example":"Please read the terms and conditions carefully before signing the agreement.","example_zh":"簽署協議前，請詳閱條款與細則。","note":"固定複數用法；網站註冊、合約文件高頻詞。"},{"text":"null and void","reading":"phr.","zh":"無效的","topic":"合約法務","example":"The agreement becomes null and void if payment is not received within thirty days.","example_zh":"若三十天內未收到款項，本協議即告無效。","note":"法律固定用語；兩字連用加強語氣，指完全無法律效力。"},{"text":"enforce","reading":"v.","zh":"執行；強制實施","topic":"合約法務","example":"The city strictly enforces parking regulations in the downtown business district.","example_zh":"市府在市中心商業區嚴格執行停車規定。","note":"搭配 enforce a rule/law/contract；名詞為 enforcement。"},{"text":"abide by","reading":"phr.","zh":"遵守","topic":"合約法務","example":"All tenants must abide by the building regulations listed in the lease.","example_zh":"所有房客都必須遵守租約中所列的大樓規定。","note":"abide by = comply with = observe；介系詞固定用 by。"},{"text":"adhere to","reading":"phr.","zh":"遵守；堅持","topic":"合約法務","example":"Contractors who fail to adhere to safety standards may face penalties.","example_zh":"未遵守安全標準的承包商可能面臨處罰。","note":"adhere to the policy/schedule 為高頻搭配；名詞 adherence。"},{"text":"infringe","reading":"v.","zh":"侵犯（權利）；違反","topic":"合約法務","example":"The court ruled that the rival firm had infringed on the company's patent.","example_zh":"法院裁定對手公司侵犯了該公司的專利。","note":"搭配 infringe on/upon a right；名詞 infringement。"},{"text":"plaintiff","reading":"n.","zh":"原告","topic":"合約法務","example":"The plaintiff claimed that the supplier had failed to honor the delivery terms.","example_zh":"原告主張供應商未履行交貨條款。","note":"相對詞 defendant（被告）；民事訴訟用語。"},{"text":"defendant","reading":"n.","zh":"被告","topic":"合約法務","example":"The defendant denied any breach of the licensing agreement.","example_zh":"被告否認有任何違反授權合約的行為。","note":"與 plaintiff（原告）相對；defend（辯護）的衍生字。"},{"text":"attorney","reading":"n.","zh":"律師","topic":"合約法務","example":"Please have your attorney review the contract before you sign it.","example_zh":"簽約前請先讓您的律師審閱合約。","note":"美式用語；與 lawyer 同義，attorney at law 更正式。"},{"text":"litigation","reading":"n.","zh":"訴訟","topic":"合約法務","example":"Both parties agreed to settle the dispute through mediation rather than litigation.","example_zh":"雙方同意透過調解而非訴訟來解決爭議。","note":"不可數名詞；搭配 avoid/pursue litigation。"},{"text":"lawsuit","reading":"n.","zh":"訴訟案件","topic":"合約法務","example":"The vendor filed a lawsuit against the retailer for unpaid invoices.","example_zh":"供應商因帳款未付而對零售商提起訴訟。","note":"固定搭配 file a lawsuit against（對…提告）。"},{"text":"sue","reading":"v.","zh":"控告；提告","topic":"合約法務","example":"The homeowner threatened to sue the contractor for the construction defects.","example_zh":"屋主威脅要就施工瑕疵控告承包商。","note":"句型 sue A for B（因B控告A）。"},{"text":"settle","reading":"v.","zh":"和解；解決","topic":"合約法務","example":"The two companies settled the dispute out of court last month.","example_zh":"兩家公司上個月已在庭外和解。","note":"settle out of court（庭外和解）；名詞 settlement（和解協議）。"},{"text":"dispute","reading":"n.","zh":"爭議；糾紛","topic":"合約法務","example":"Any dispute arising from this agreement shall be resolved through arbitration.","example_zh":"因本協議產生的任何爭議應透過仲裁解決。","note":"搭配 resolve/settle a dispute；contract dispute 為高頻詞。"},{"text":"mediation","reading":"n.","zh":"調解","topic":"合約法務","example":"The parties reached an agreement after two rounds of mediation.","example_zh":"雙方經過兩輪調解後達成協議。","note":"由中立第三方協助；程度上比 arbitration（仲裁）不具強制力。"},{"text":"verdict","reading":"n.","zh":"判決；裁決","topic":"合約法務","example":"The jury reached a verdict in favor of the plaintiff after two days of deliberation.","example_zh":"陪審團經過兩天審議，做出有利於原告的裁決。","note":"搭配 reach/deliver a verdict；in favor of 表「有利於」。"},{"text":"testify","reading":"v.","zh":"作證","topic":"合約法務","example":"The accountant was asked to testify about the company's financial records.","example_zh":"會計師被要求就公司財務紀錄出庭作證。","note":"名詞 testimony（證詞）；testify in court 為常見搭配。"},{"text":"witness","reading":"n.","zh":"證人；見證人","topic":"合約法務","example":"The contract must be signed in the presence of two witnesses.","example_zh":"本合約必須在兩位見證人在場的情況下簽署。","note":"亦可當動詞（目擊、見證）；witness a signature 指見證簽名。"},{"text":"notarize","reading":"v.","zh":"公證","topic":"合約法務","example":"The lease agreement must be notarized before it is submitted to the agency.","example_zh":"租賃合約必須先經過公證，才能提交給主管機關。","note":"notary public 為公證人；常用被動 have a document notarized。"},{"text":"contractor","reading":"n.","zh":"承包商","topic":"合約法務","example":"The contractor is legally required to complete the project by the agreed date.","example_zh":"承包商依法必須在約定日期前完成工程。","note":"general contractor 為總承包商；勿與 contract（合約）混淆。"},{"text":"addendum","reading":"n.","zh":"附錄；補充條款","topic":"合約法務","example":"The revised payment schedule is attached as an addendum to the original contract.","example_zh":"修訂後的付款時程以補充條款形式附於原合約。","note":"複數為 addenda；與 amendment（修正案）意思相近。"},{"text":"disclose","reading":"v.","zh":"揭露；透露","topic":"合約法務","example":"Employees may not disclose client information to any third party.","example_zh":"員工不得向任何第三方透露客戶資料。","note":"名詞 disclosure；disclose A to B 為常見句型。"},{"text":"non-disclosure agreement","reading":"n.","zh":"保密協議","topic":"合約法務","example":"All consultants must sign a non-disclosure agreement before accessing project files.","example_zh":"所有顧問在取得專案檔案前，必須先簽署保密協議。","note":"縮寫 NDA；sign an NDA 為高頻搭配。"},{"text":"proprietary","reading":"adj.","zh":"專有的；專利的","topic":"合約法務","example":"The software uses proprietary technology that may not be copied without permission.","example_zh":"該軟體使用專有技術，未經許可不得複製。","note":"proprietary information（機密資訊）為高頻搭配。"},{"text":"trademark","reading":"n.","zh":"商標","topic":"合約法務","example":"The company registered its new logo as a trademark in several countries.","example_zh":"該公司已在多國將新標誌註冊為商標。","note":"搭配 register a trademark；符號為 TM 或 R。"},{"text":"intellectual property","reading":"n.","zh":"智慧財產權","topic":"合約法務","example":"The agreement clearly states who owns the intellectual property created during the project.","example_zh":"協議明確載明專案期間產生的智慧財產權歸屬。","note":"縮寫 IP；涵蓋 patent、trademark、copyright。"},{"text":"royalty","reading":"n.","zh":"權利金；版稅","topic":"合約法務","example":"The author receives a ten percent royalty on every copy sold.","example_zh":"作者每售出一本書可獲得百分之十的版稅。","note":"常用複數 royalties；勿與 loyalty（忠誠）拼混。"},{"text":"license","reading":"n.","zh":"執照；授權","topic":"合約法務","example":"The restaurant's business license must be renewed before the end of the year.","example_zh":"這家餐廳的營業執照必須在年底前換發。","note":"英式拼法 licence；licensing agreement 指授權合約。"},{"text":"ratify","reading":"v.","zh":"正式批准；認可","topic":"合約法務","example":"The board must ratify the merger agreement before it takes effect.","example_zh":"合併協議須經董事會正式批准後才生效。","note":"多用於正式文件或條約；名詞 ratification。"},{"text":"revoke","reading":"v.","zh":"撤銷；廢止","topic":"合約法務","example":"The agency may revoke the license if the safety standards are not met.","example_zh":"若未符合安全標準，主管機關得撤銷執照。","note":"搭配 revoke a license/permit；與 cancel 相比更正式。"},{"text":"renew","reading":"v.","zh":"續約；更新","topic":"合約法務","example":"The tenant decided to renew the lease for another two years.","example_zh":"房客決定再續租兩年。","note":"renew a contract/lease/subscription；名詞 renewal。"},{"text":"effective","reading":"adj.","zh":"生效的；有效的","topic":"合約法務","example":"The new pricing policy is effective as of March 1.","example_zh":"新定價政策自三月一日起生效。","note":"effective as of + 日期（自…起生效）為 Part 5 高頻句型。"},{"text":"hereby","reading":"adv.","zh":"特此；茲","topic":"合約法務","example":"The undersigned hereby agrees to the terms set out in this contract.","example_zh":"下方簽署人特此同意本合約所載條款。","note":"正式法律文書用語；常與 agree、certify 連用。"},{"text":"thereafter","reading":"adv.","zh":"此後；之後","topic":"合約法務","example":"Payment is due on delivery, and interest will accrue thereafter on unpaid balances.","example_zh":"款項應於交貨時支付，此後未付餘額將開始計息。","note":"正式書面用語；shortly thereafter 表「不久之後」。"},{"text":"pursuant to","reading":"phr.","zh":"依據；根據","topic":"合約法務","example":"Pursuant to article five, either party may terminate the agreement with written notice.","example_zh":"依據第五條，任一方均可以書面通知終止本協議。","note":"法律正式用語；同義於 in accordance with、under。"},{"text":"in accordance with","reading":"phr.","zh":"依照；符合","topic":"合約法務","example":"All refunds are processed in accordance with the company's return policy.","example_zh":"所有退款均依照公司退貨政策辦理。","note":"Part 5 高頻片語；比 according to 更正式。"},{"text":"subject to","reading":"phr.","zh":"以…為條件；須經…","topic":"合約法務","example":"The job offer is subject to a satisfactory background check.","example_zh":"本聘僱通知須以背景調查合格為前提。","note":"subject to approval/change 為高頻搭配；表「取決於」。"},{"text":"on behalf of","reading":"phr.","zh":"代表","topic":"合約法務","example":"The vice president signed the agreement on behalf of the company.","example_zh":"副總裁代表公司簽署了這份協議。","note":"on behalf of + 人/機構；Part 5 介系詞片語高頻考點。"},{"text":"indemnify","reading":"v.","zh":"賠償；使免於損失","topic":"合約法務","example":"The supplier agrees to indemnify the buyer against any losses caused by defective goods.","example_zh":"供應商同意就瑕疵商品造成的任何損失向買方賠償。","note":"句型 indemnify A against B；名詞 indemnity。"},{"text":"penalty","reading":"n.","zh":"罰款；違約金","topic":"合約法務","example":"A late-payment penalty of two percent will be added to overdue invoices.","example_zh":"逾期未付的發票將加收百分之二的滯納金。","note":"penalty clause 指違約金條款；動詞 penalize。"},{"text":"damages","reading":"n.","zh":"損害賠償金","topic":"合約法務","example":"The court ordered the firm to pay damages for breaching the supply contract.","example_zh":"法院判令該公司因違反供貨合約支付損害賠償金。","note":"法律意義必用複數 damages；單數 damage 指損害本身。"},{"text":"guarantor","reading":"n.","zh":"保證人","topic":"合約法務","example":"Applicants without a credit history must provide a guarantor for the lease.","example_zh":"沒有信用紀錄的申請人必須為租約提供保證人。","note":"guarantee（保證）+ -or（人）；租賃與貸款情境常見。"},{"text":"guarantee","reading":"v.","zh":"保證；擔保","topic":"合約法務","example":"The manufacturer guarantees all parts against defects for three years.","example_zh":"製造商保證所有零件三年內無瑕疵。","note":"亦可當名詞；money-back guarantee 指退款保證。"},{"text":"obligation","reading":"n.","zh":"義務；責任","topic":"合約法務","example":"Signing the form places you under no obligation to purchase the service.","example_zh":"簽署此表單並不代表您有購買該服務的義務。","note":"under no obligation to V 為高頻句型；動詞 oblige。"},{"text":"prohibit","reading":"v.","zh":"禁止","topic":"合約法務","example":"The lease prohibits tenants from subletting the apartment without written consent.","example_zh":"租約禁止房客未經書面同意轉租公寓。","note":"句型 prohibit A from V-ing；同義字 forbid、ban。"},{"text":"restriction","reading":"n.","zh":"限制；規定","topic":"合約法務","example":"The permit imposes strict restrictions on noise levels after 10 p.m.","example_zh":"該許可證對晚上十點後的噪音音量有嚴格限制。","note":"搭配 impose/lift restrictions on；動詞 restrict。"},{"text":"draft","reading":"v.","zh":"草擬；起草","topic":"合約法務","example":"The legal team will draft a new agreement reflecting the revised terms.","example_zh":"法務團隊將依修訂後的條款草擬新協議。","note":"亦可當名詞（草稿）；draft a contract/proposal 為高頻搭配。"},{"text":"execute","reading":"v.","zh":"簽署（使生效）；執行","topic":"合約法務","example":"Both parties must execute the contract before work can begin.","example_zh":"雙方必須完成合約簽署後，工作才能開始。","note":"法律語境指正式簽署使生效；一般語境指執行計畫。"},{"text":"tender","reading":"n.","zh":"投標；投標書","topic":"合約法務","example":"Five construction firms submitted tenders for the new bridge project.","example_zh":"五家營造公司為新橋工程遞交了投標書。","note":"搭配 submit/invite tenders；put out to tender 表「公開招標」。"},{"text":"undersigned","reading":"n.","zh":"（文件的）下方簽署人","topic":"合約法務","example":"The undersigned acknowledges receipt of the equipment listed above.","example_zh":"下方簽署人確認已收到上列設備。","note":"正式文件用語，常作 the undersigned；視為單數或複數皆可。"},{"text":"signatory","reading":"n.","zh":"簽署人；簽約方","topic":"合約法務","example":"All signatories to the agreement will receive a certified copy within a week.","example_zh":"協議的所有簽署方將在一週內收到經認證的副本。","note":"signatory to + 文件；signature（簽名）的相關字。"},{"text":"tenant","reading":"n.","zh":"房客；承租人","topic":"合約法務","example":"Tenants must give the landlord sixty days' notice before moving out.","example_zh":"房客搬離前必須提前六十天通知房東。","note":"與 landlord（房東）相對；tenancy 指租賃期。"},{"text":"violate","reading":"v.","zh":"違反","topic":"合約法務","example":"Employees who violate the confidentiality policy face immediate dismissal.","example_zh":"違反保密政策的員工將立即遭到解僱。","note":"violate a rule/agreement；名詞 violation（違規行為）。"},{"text":"opt out","reading":"phr.","zh":"選擇退出","topic":"合約法務","example":"Subscribers may opt out of the automatic renewal at any time before the billing date.","example_zh":"訂閱者可在扣款日前隨時選擇退出自動續約。","note":"固定搭配 opt out of；相反詞 opt in（選擇加入）。"},{"text":"enter into","reading":"phr.","zh":"簽訂；締結（合約）","topic":"合約法務","example":"The two firms entered into a five-year distribution agreement last quarter.","example_zh":"兩家公司於上一季簽訂了為期五年的經銷協議。","note":"enter into a contract/agreement 為固定搭配，勿漏 into。"},{"text":"firmware","reading":"n.","zh":"韌體","topic":"科技通訊","example":"Please update the printer's firmware before contacting technical support about the error.","example_zh":"聯絡技術支援處理錯誤前,請先更新印表機的韌體。","note":"update the firmware 為常見搭配;與 software(軟體)、hardware(硬體)區分。"},{"text":"interface","reading":"n.","zh":"介面","topic":"科技通訊","example":"The new booking system features a simplified interface that requires very little training.","example_zh":"新的訂位系統採用簡化的介面,幾乎不需要訓練就能上手。","note":"user interface(使用者介面)常縮寫為 UI;動詞義為「互動、對接」。"},{"text":"configure","reading":"v.","zh":"設定;配置","topic":"科技通訊","example":"IT staff will configure each new laptop before distributing it to employees.","example_zh":"資訊人員會先設定好每台新筆電,再發給員工。","note":"名詞為 configuration;常見搭配 configure the settings。"},{"text":"connectivity","reading":"n.","zh":"網路連線能力","topic":"科技通訊","example":"Guests have complained about poor wireless connectivity in the conference rooms.","example_zh":"房客抱怨會議室的無線網路連線品質不佳。","note":"常與 Wi-Fi、network 連用;比 connection 更抽象、指整體連線能力。"},{"text":"cybersecurity","reading":"n.","zh":"資訊安全;網路安全","topic":"科技通訊","example":"All employees must complete cybersecurity training by the end of the quarter.","example_zh":"全體員工必須在本季結束前完成資安訓練。","note":"常見搭配 cybersecurity training/measures(資安訓練/措施)。"},{"text":"outage","reading":"n.","zh":"(服務)中斷;停電","topic":"科技通訊","example":"The service outage lasted three hours and affected customers nationwide.","example_zh":"這次服務中斷持續了三小時,影響全國客戶。","note":"power outage(停電)、network outage(網路中斷)為高頻搭配。"},{"text":"firewall","reading":"n.","zh":"防火牆","topic":"科技通訊","example":"The firewall blocked several unauthorized attempts to access the company database.","example_zh":"防火牆攔截了多次未經授權存取公司資料庫的嘗試。","note":"常與 block、bypass 搭配;資安情境必考字。"},{"text":"log in","reading":"phr.","zh":"登入","topic":"科技通訊","example":"Employees must log in with their new credentials starting Monday.","example_zh":"從週一起,員工必須使用新的帳號密碼登入。","note":"分開寫是動詞片語,合寫 login 是名詞;搭配 log in to the system。"},{"text":"authenticate","reading":"v.","zh":"驗證(身分)","topic":"科技通訊","example":"The system will authenticate users through a code sent to their mobile phones.","example_zh":"系統會透過傳送到手機的驗證碼來驗證使用者身分。","note":"名詞 authentication;two-factor authentication(雙重驗證)常考。"},{"text":"broadband","reading":"n.","zh":"寬頻","topic":"科技通訊","example":"The office is upgrading to a faster broadband connection next month.","example_zh":"辦公室下個月將升級為更快的寬頻連線。","note":"常見搭配 broadband connection/service。"},{"text":"cloud storage","reading":"n.","zh":"雲端儲存空間","topic":"科技通訊","example":"Contracts are now saved to cloud storage so that staff can access them from anywhere.","example_zh":"合約現在都儲存在雲端,員工可以從任何地方存取。","note":"常與 save to、access 搭配;cloud computing 指雲端運算。"},{"text":"compress","reading":"v.","zh":"壓縮","topic":"科技通訊","example":"Please compress the image files before attaching them to the email.","example_zh":"請先壓縮圖片檔,再附加到電子郵件中。","note":"名詞 compression;壓縮檔常稱 zipped file。"},{"text":"corrupted","reading":"adj.","zh":"(檔案)損毀的","topic":"科技通訊","example":"The report file was corrupted during the transfer and must be sent again.","example_zh":"報告檔案在傳輸過程中損毀了,必須重新傳送。","note":"corrupted file(損毀的檔案);corrupt 另有「貪腐的」之意。"},{"text":"debug","reading":"v.","zh":"除錯","topic":"科技通訊","example":"The developers stayed late to debug the payment module before the release.","example_zh":"開發人員加班為付款模組除錯,以趕上發布時程。","note":"由 bug(程式錯誤)加字首 de- 而來;與 troubleshoot 意思相近。"},{"text":"deactivate","reading":"v.","zh":"停用","topic":"科技通訊","example":"Remember to deactivate former employees' accounts on their last day.","example_zh":"記得在離職員工的最後一天停用他們的帳號。","note":"反義為 activate(啟用);與 delete(刪除)不同。"},{"text":"default","reading":"n.","zh":"預設值","topic":"科技通訊","example":"The printer is set to double-sided printing by default.","example_zh":"這台印表機預設為雙面列印。","note":"by default(依預設)為高頻片語;另義為「違約、未履行」。"},{"text":"diagnostic","reading":"adj.","zh":"診斷的","topic":"科技通訊","example":"The technician ran a diagnostic test to identify the cause of the problem.","example_zh":"技術人員執行診斷測試以找出問題的原因。","note":"常搭配 run a diagnostic test;名詞 diagnosis(診斷)。"},{"text":"disconnect","reading":"v.","zh":"中斷連線;切斷","topic":"科技通訊","example":"Please disconnect all devices from the network during the system upgrade.","example_zh":"系統升級期間,請將所有裝置與網路中斷連線。","note":"反義 connect;get disconnected 指通話或網路「斷線」。"},{"text":"enable","reading":"v.","zh":"啟用;使能夠","topic":"科技通訊","example":"Please enable automatic updates so that the software stays secure.","example_zh":"請啟用自動更新,讓軟體保持安全。","note":"enable sb to V(使某人能夠)為 Part 5 常考句型;反義 disable。"},{"text":"functionality","reading":"n.","zh":"功能","topic":"科技通訊","example":"The latest update adds search functionality to the mobile app.","example_zh":"最新的更新為行動應用程式新增了搜尋功能。","note":"指軟體整體「功能性」;function 較泛指單一功能。"},{"text":"help desk","reading":"n.","zh":"資訊服務台","topic":"科技通訊","example":"Contact the help desk at extension 300 if you cannot access your email.","example_zh":"如果無法存取電子郵件,請撥分機 300 聯絡資訊服務台。","note":"亦拼作 helpdesk;與 IT support 意思相近。"},{"text":"hotspot","reading":"n.","zh":"無線網路熱點","topic":"科技通訊","example":"The airport provides free Wi-Fi hotspots in all departure lounges.","example_zh":"機場在所有候機室提供免費 Wi-Fi 熱點。","note":"Wi-Fi hotspot 為固定搭配;另義為「熱門地點」。"},{"text":"inbox","reading":"n.","zh":"收件匣","topic":"科技通訊","example":"Check your inbox for a confirmation message after registering.","example_zh":"註冊後請檢查收件匣是否收到確認信。","note":"反義 outbox(寄件匣);垃圾郵件匣為 spam/junk folder。"},{"text":"innovative","reading":"adj.","zh":"創新的","topic":"科技通訊","example":"The firm is known for its innovative approach to product design.","example_zh":"這家公司以創新的產品設計方法聞名。","note":"動詞 innovate、名詞 innovation;常修飾 solution、design。"},{"text":"modem","reading":"n.","zh":"數據機","topic":"科技通訊","example":"If the connection fails, restart the modem and wait thirty seconds.","example_zh":"如果連線失敗,請重新啟動數據機並等待三十秒。","note":"常與 router(路由器)一起出現。"},{"text":"navigate","reading":"v.","zh":"瀏覽;導覽","topic":"科技通訊","example":"Customers can easily navigate the redesigned website to find product information.","example_zh":"顧客可以輕鬆瀏覽改版後的網站來查詢產品資訊。","note":"navigate a website/menu;名詞 navigation(導覽、導航)。"},{"text":"offline","reading":"adj.","zh":"離線的;停止運作的","topic":"科技通訊","example":"The payment system will be offline for maintenance from midnight to 2 a.m.","example_zh":"付款系統將於午夜至凌晨兩點離線進行維護。","note":"反義 online;go offline 指「離線、暫停服務」。"},{"text":"operational","reading":"adj.","zh":"運作中的;可運作的","topic":"科技通訊","example":"The new data center will be fully operational by the end of March.","example_zh":"新的資料中心將於三月底前全面啟用運作。","note":"fully operational(全面運作)為高頻搭配;另指「營運上的」。"},{"text":"patch","reading":"n.","zh":"修補程式","topic":"科技通訊","example":"Install the latest security patch to protect your computer from the virus.","example_zh":"請安裝最新的安全修補程式,保護電腦免受病毒侵害。","note":"security patch(安全修補程式)常考;動詞義為「修補」。"},{"text":"peripheral","reading":"n.","zh":"周邊設備","topic":"科技通訊","example":"Keyboards, printers, and other peripherals are stored in the supply room.","example_zh":"鍵盤、印表機和其他周邊設備都存放在補給室。","note":"指鍵盤、滑鼠等周邊;形容詞義為「次要的、周邊的」。"},{"text":"portable","reading":"adj.","zh":"可攜式的","topic":"科技通訊","example":"Sales representatives were issued portable projectors for client presentations.","example_zh":"業務代表獲配可攜式投影機,供客戶簡報使用。","note":"portable device/charger 常見;字根 port 意為「攜帶」。"},{"text":"recharge","reading":"v.","zh":"充電","topic":"科技通訊","example":"You can recharge the tablet fully in less than two hours.","example_zh":"這台平板電腦不到兩小時就能充飽電。","note":"rechargeable battery(充電電池)為常見衍生字。"},{"text":"reboot","reading":"v.","zh":"重新開機","topic":"科技通訊","example":"If the screen freezes, reboot the computer and try again.","example_zh":"如果螢幕當機,請重新開機後再試一次。","note":"同義 restart;reboot the system 為固定搭配。"},{"text":"remotely","reading":"adv.","zh":"遠端地","topic":"科技通訊","example":"Employees may work remotely up to three days per week.","example_zh":"員工每週最多可遠端工作三天。","note":"work remotely(遠端工作)為高頻搭配;形容詞 remote。"},{"text":"retrieve","reading":"v.","zh":"取回;讀取(資料)","topic":"科技通訊","example":"Deleted messages can be retrieved from the backup system within thirty days.","example_zh":"刪除的訊息可在三十天內從備份系統中取回。","note":"retrieve data/files 常見;名詞 retrieval。"},{"text":"router","reading":"n.","zh":"路由器","topic":"科技通訊","example":"Place the router in a central location to improve the Wi-Fi signal.","example_zh":"把路由器放在中央位置,以改善 Wi-Fi 訊號。","note":"wireless router 常見;與 modem(數據機)搭配出現。"},{"text":"seamlessly","reading":"adv.","zh":"無縫地;流暢地","topic":"科技通訊","example":"The new app syncs seamlessly with your existing calendar.","example_zh":"新的應用程式能與你現有的行事曆無縫同步。","note":"常修飾 integrate、work;形容詞 seamless。"},{"text":"set up","reading":"phr.","zh":"安裝;架設;設立","topic":"科技通訊","example":"A technician will set up the video equipment before the presentation.","example_zh":"技術人員會在簡報前架設好視訊設備。","note":"名詞為 setup;set up an account/a meeting 皆為常考搭配。"},{"text":"shut down","reading":"phr.","zh":"關機;關閉","topic":"科技通訊","example":"Please shut down your computers before leaving the office on Friday.","example_zh":"週五下班離開辦公室前,請將電腦關機。","note":"名詞為 shutdown;另可指工廠「停工、歇業」。"},{"text":"spam","reading":"n.","zh":"垃圾郵件","topic":"科技通訊","example":"The new filter automatically moves spam to a separate folder.","example_zh":"新的過濾器會自動將垃圾郵件移到獨立的資料夾。","note":"spam filter/folder 常見;為不可數名詞。"},{"text":"spreadsheet","reading":"n.","zh":"試算表","topic":"科技通訊","example":"Enter the monthly sales figures into the shared spreadsheet by Friday.","example_zh":"請在週五前將每月銷售數字輸入共用試算表。","note":"常與 update、enter data into 搭配。"},{"text":"synchronize","reading":"v.","zh":"同步","topic":"科技通訊","example":"The app synchronizes your contacts across all registered devices.","example_zh":"這個應用程式會在所有已註冊的裝置間同步你的聯絡人。","note":"口語縮寫為 sync;句型 synchronize A with B。"},{"text":"technician","reading":"n.","zh":"技術人員","topic":"科技通訊","example":"A technician has been dispatched to repair the copier this afternoon.","example_zh":"已派遣技術人員於今天下午前來修理影印機。","note":"dispatch a technician(派遣技術人員)為高頻搭配。"},{"text":"touchscreen","reading":"n.","zh":"觸控螢幕","topic":"科技通訊","example":"Visitors can check in using the touchscreen kiosk in the lobby.","example_zh":"訪客可以使用大廳的觸控式自助機台辦理報到。","note":"touchscreen kiosk/display 為常見搭配。"},{"text":"transmit","reading":"v.","zh":"傳送;傳輸","topic":"科技通訊","example":"The data is encrypted before it is transmitted to the central server.","example_zh":"資料在傳送到中央伺服器之前會先加密。","note":"名詞 transmission;搭配 transmit data/signals。"},{"text":"uninstall","reading":"v.","zh":"解除安裝","topic":"科技通訊","example":"Uninstall any unused programs to free up storage space.","example_zh":"請解除安裝未使用的程式,以釋出儲存空間。","note":"反義 install;free up space(釋出空間)為常見搭配。"},{"text":"upload","reading":"v.","zh":"上傳","topic":"科技通訊","example":"Please upload the signed contract to the client portal by noon.","example_zh":"請在中午前將簽署好的合約上傳到客戶入口網站。","note":"反義 download;句型 upload A to B。"},{"text":"platform","reading":"n.","zh":"平台","topic":"科技通訊","example":"The company launched an online platform for freelance designers.","example_zh":"這家公司推出了一個給自由接案設計師的線上平台。","note":"online platform 為高頻搭配;另義為「月台」。"},{"text":"automated","reading":"adj.","zh":"自動化的","topic":"科技通訊","example":"Customers receive an automated reply confirming that their order was received.","example_zh":"顧客會收到自動回覆,確認訂單已收到。","note":"automated system/reply 常見;動詞 automate。"},{"text":"verification","reading":"n.","zh":"驗證;核對","topic":"科技通訊","example":"For verification purposes, please enter the code sent to your phone.","example_zh":"為了驗證身分,請輸入傳送到你手機的驗證碼。","note":"identity verification(身分驗證)常見;動詞 verify。"},{"text":"voicemail","reading":"n.","zh":"語音信箱;語音留言","topic":"科技通訊","example":"I left a voicemail asking Mr. Chen to return my call.","example_zh":"我留了語音留言,請陳先生回電。","note":"leave a voicemail(留語音留言)為固定搭配。"},{"text":"wireless","reading":"adj.","zh":"無線的","topic":"科技通訊","example":"The conference room is equipped with a wireless presentation system.","example_zh":"會議室配備了無線簡報系統。","note":"wireless network/connection 常見;反義 wired(有線的)。"},{"text":"adapter","reading":"n.","zh":"轉接器;變壓器","topic":"科技通訊","example":"International travelers should bring a power adapter for their laptops.","example_zh":"出國旅客應為筆電攜帶電源轉接器。","note":"power adapter(電源轉接器)常見;拼字勿與 adopter 混淆。"},{"text":"headset","reading":"n.","zh":"耳機麥克風;頭戴式耳機","topic":"科技通訊","example":"Call center agents are provided with noise-canceling headsets.","example_zh":"客服中心人員都配有降噪耳機麥克風。","note":"headset 含麥克風,與單純的 headphones(耳機)略不同。"},{"text":"cartridge","reading":"n.","zh":"墨水匣;碳粉匣","topic":"科技通訊","example":"Replace the ink cartridge when the print quality begins to fade.","example_zh":"當列印品質開始變淡時,請更換墨水匣。","note":"ink/toner cartridge 為固定搭配。"},{"text":"paper jam","reading":"n.","zh":"卡紙","topic":"科技通訊","example":"The copier stopped because of a paper jam in the rear tray.","example_zh":"影印機因後方紙匣卡紙而停止運作。","note":"clear a paper jam(排除卡紙)常見於機器說明。"},{"text":"put through","reading":"phr.","zh":"(電話)轉接","topic":"科技通訊","example":"Hold on a moment, and I will put you through to the sales department.","example_zh":"請稍候,我幫您轉接到業務部。","note":"句型 put sb through to sb/dept.;為聽力 Part 3 高頻用語。"},{"text":"hang up","reading":"phr.","zh":"掛斷電話","topic":"科技通訊","example":"The caller hung up before the receptionist could take a message.","example_zh":"接待員還來不及記下留言,來電者就掛斷了。","note":"hang up on sb 指「掛某人電話」;過去式為 hung up。"},{"text":"landline","reading":"n.","zh":"市話;室內電話","topic":"科技通訊","example":"Please provide both a landline and a mobile number on the application form.","example_zh":"請在申請表上同時填寫市話與手機號碼。","note":"與 mobile/cell phone(手機)相對。"},{"text":"groceries","reading":"n.","zh":"食品雜貨","topic":"日常生活","example":"Many residents order groceries online and have them delivered weekly.","example_zh":"許多居民在網路上訂購食品雜貨,每週宅配到府。","note":"常用複數;grocery store 指超市、雜貨店。"},{"text":"dry cleaning","reading":"n.","zh":"乾洗;送乾洗的衣物","topic":"日常生活","example":"You can drop off your dry cleaning at the shop next to the bank.","example_zh":"你可以把要乾洗的衣物送到銀行旁邊那家店。","note":"乾洗店為 dry cleaner's;常與 drop off/pick up 搭配。"},{"text":"laundromat","reading":"n.","zh":"自助洗衣店","topic":"日常生活","example":"The apartment building has a laundromat on the ground floor for tenants.","example_zh":"這棟公寓一樓設有供房客使用的自助洗衣店。","note":"英式用 launderette;常與 coin-operated(投幣式)並用。"},{"text":"detergent","reading":"n.","zh":"洗衣精;清潔劑","topic":"日常生活","example":"This detergent removes tough stains even in cold water.","example_zh":"這款洗衣精即使用冷水也能去除頑固污漬。","note":"laundry detergent(洗衣精)為固定搭配。"},{"text":"stain","reading":"n.","zh":"污漬","topic":"日常生活","example":"The cleaner managed to remove the coffee stain from the carpet.","example_zh":"清潔人員成功去除了地毯上的咖啡漬。","note":"remove a stain(去除污漬)常見;stain remover 為去漬劑。"},{"text":"alteration","reading":"n.","zh":"(衣服)修改","topic":"日常生活","example":"The suit needs minor alterations, which will take about three days.","example_zh":"這套西裝需要小幅修改,大約要三天。","note":"指改衣服尺寸;勿與 altercation(爭執)混淆。"},{"text":"tailor","reading":"n.","zh":"裁縫師","topic":"日常生活","example":"The tailor shortened the sleeves and adjusted the waist of the jacket.","example_zh":"裁縫師改短了外套的袖子並調整了腰身。","note":"動詞義為「量身打造」,tailored to one's needs 常考。"},{"text":"security deposit","reading":"n.","zh":"押金","topic":"日常生活","example":"The security deposit will be refunded after the apartment is inspected.","example_zh":"公寓檢查完畢後,押金將會退還。","note":"常與 refund、forfeit(沒收)搭配於租屋情境。"},{"text":"furnished","reading":"adj.","zh":"附家具的","topic":"日常生活","example":"The agency listed a fully furnished apartment within walking distance of the station.","example_zh":"仲介刊登了一間距離車站步行可達、附全套家具的公寓。","note":"fully furnished(附全套家具)常見;反義 unfurnished。"},{"text":"conveniently","reading":"adv.","zh":"便利地","topic":"日常生活","example":"The hotel is conveniently located near the subway station.","example_zh":"這家飯店位置便利,鄰近地鐵站。","note":"conveniently located(位置便利)為 Part 5 高頻搭配。"},{"text":"move in","reading":"phr.","zh":"搬入;入住","topic":"日常生活","example":"The new tenants will move in on the first of August.","example_zh":"新房客將於八月一日搬入。","note":"move-in date 指入住日;反義為 move out(搬離)。"},{"text":"stop by","reading":"phr.","zh":"順道拜訪;順路去","topic":"日常生活","example":"Feel free to stop by the branch anytime to update your account information.","example_zh":"歡迎隨時順道到分行更新您的帳戶資料。","note":"同義 drop by、swing by。"},{"text":"aisle","reading":"n.","zh":"走道;(賣場)貨架通道","topic":"日常生活","example":"Cleaning supplies are in aisle seven, next to the paper products.","example_zh":"清潔用品在第七走道,紙類商品旁邊。","note":"s 不發音;aisle seat 指飛機走道座位。"},{"text":"cashier","reading":"n.","zh":"收銀員","topic":"日常生活","example":"Please present your coupon to the cashier before payment is processed.","example_zh":"結帳前請將折價券出示給收銀員。","note":"與 cash register(收銀機)區分。"},{"text":"sold out","reading":"adj.","zh":"售完的","topic":"日常生活","example":"The concert tickets were sold out within an hour of going on sale.","example_zh":"演唱會門票開賣不到一小時就售完了。","note":"動詞片語為 sell out;與 out of stock(缺貨)意近。"},{"text":"curbside pickup","reading":"n.","zh":"路邊取貨","topic":"日常生活","example":"The supermarket now offers curbside pickup for online orders.","example_zh":"這家超市現在為網路訂單提供路邊取貨服務。","note":"curbside 指「路邊的」;為近年常見的取貨服務用語。"},{"text":"appointment","reading":"n.","zh":"預約;約診","topic":"日常生活","example":"I would like to reschedule my dental appointment for Friday morning.","example_zh":"我想把牙醫預約改到週五早上。","note":"make/reschedule an appointment 為固定搭配;另義為「任命」。"},{"text":"over-the-counter","reading":"adj.","zh":"非處方的;成藥的","topic":"日常生活","example":"The pharmacy carries a wide range of over-the-counter medications for colds and allergies.","example_zh":"這家藥局販售多種治療感冒和過敏的非處方藥。","note":"縮寫 OTC;與 prescription drug(處方藥)相對。"},{"text":"dosage","reading":"n.","zh":"劑量","topic":"日常生活","example":"Do not exceed the recommended dosage printed on the label.","example_zh":"請勿超過標籤上印的建議劑量。","note":"recommended dosage(建議劑量)常考;dose 指單次劑量。"},{"text":"symptom","reading":"n.","zh":"症狀","topic":"日常生活","example":"If symptoms persist for more than a week, please consult a doctor.","example_zh":"如果症狀持續超過一週,請就醫諮詢。","note":"symptoms persist(症狀持續)為藥品說明高頻用語。"},{"text":"allergy","reading":"n.","zh":"過敏","topic":"日常生活","example":"Please inform the server of any food allergies before ordering.","example_zh":"點餐前請告知服務人員您是否有任何食物過敏。","note":"形容詞 allergic,句型 be allergic to 常考。"},{"text":"vaccination","reading":"n.","zh":"疫苗接種","topic":"日常生活","example":"Proof of vaccination may be required for entry to some countries.","example_zh":"入境某些國家可能需要出示疫苗接種證明。","note":"動詞 vaccinate;proof of vaccination 為常見搭配。"},{"text":"physician","reading":"n.","zh":"醫師;內科醫師","topic":"日常生活","example":"Consult your physician before starting any new exercise program.","example_zh":"開始任何新的運動計畫前,請先諮詢您的醫師。","note":"較正式的用字;勿與 physicist(物理學家)混淆。"},{"text":"nutritious","reading":"adj.","zh":"營養的","topic":"日常生活","example":"The cafeteria has added more nutritious options to its lunch menu.","example_zh":"員工餐廳在午餐菜單中增加了更多營養的選項。","note":"名詞 nutrition;比較 nutritional(營養方面的)。"},{"text":"leftovers","reading":"n.","zh":"剩菜;剩餘食物","topic":"日常生活","example":"Store any leftovers in the refrigerator within two hours of cooking.","example_zh":"烹調後兩小時內請將剩菜放入冰箱保存。","note":"常用複數;leftover 亦可作形容詞(剩餘的)。"},{"text":"leak","reading":"n.","zh":"漏水;洩漏","topic":"日常生活","example":"The landlord sent a plumber to fix the leak under the kitchen sink.","example_zh":"房東派水電工來修理廚房水槽下方的漏水。","note":"fix a leak(修理漏水)常見;另指「洩漏(資訊)」。"},{"text":"faucet","reading":"n.","zh":"水龍頭","topic":"日常生活","example":"Please report a dripping faucet to the building manager immediately.","example_zh":"若水龍頭滴水,請立即向大樓管理員反映。","note":"英式用 tap;dripping faucet(滴水的水龍頭)常見。"},{"text":"remodel","reading":"v.","zh":"改建;翻修","topic":"日常生活","example":"The couple plans to remodel their kitchen before selling the house.","example_zh":"這對夫妻打算在賣房前先翻修廚房。","note":"意近 renovate;remodeling project 為常見搭配。"},{"text":"landscaping","reading":"n.","zh":"景觀造景","topic":"日常生活","example":"The homeowners hired a company to handle the landscaping of their backyard.","example_zh":"屋主聘請公司負責後院的景觀造景。","note":"landscaping company/service 常見;動詞為 landscape。"},{"text":"chore","reading":"n.","zh":"家事;雜務","topic":"日常生活","example":"The family shares household chores such as washing dishes and doing laundry.","example_zh":"這家人分擔洗碗、洗衣等家事。","note":"household chores(家事)為固定搭配。"},{"text":"tidy up","reading":"phr.","zh":"整理;收拾","topic":"日常生活","example":"Please tidy up the break room after using it.","example_zh":"使用茶水間後請收拾整潔。","note":"意近 clean up、straighten up。"},{"text":"crosswalk","reading":"n.","zh":"行人穿越道","topic":"日常生活","example":"Drivers must yield to pedestrians waiting at the crosswalk.","example_zh":"駕駛必須禮讓在行人穿越道等候的行人。","note":"英式用 zebra crossing;與 sidewalk(人行道)區分。"},{"text":"intersection","reading":"n.","zh":"十字路口","topic":"日常生活","example":"Turn left at the next intersection, and the bank will be on your right.","example_zh":"在下一個十字路口左轉,銀行就在你的右手邊。","note":"at the intersection of A and B 為指路常用句型。"},{"text":"toll","reading":"n.","zh":"過路費;通行費","topic":"日常生活","example":"Drivers can pay the toll electronically without stopping at the booth.","example_zh":"駕駛可以電子支付過路費,不必在收費站停車。","note":"toll booth(收費站)、toll-free number(免付費電話)常考。"},{"text":"public transit","reading":"n.","zh":"大眾運輸","topic":"日常生活","example":"Employees who use public transit are eligible for a monthly subsidy.","example_zh":"搭乘大眾運輸的員工可獲得每月補助。","note":"亦作 public transportation;transit pass 指定期票。"},{"text":"rush hour","reading":"n.","zh":"尖峰時間","topic":"日常生活","example":"Leave before five o'clock to avoid rush-hour traffic on the highway.","example_zh":"五點前出發,以避開高速公路的尖峰車潮。","note":"常作形容詞用 rush-hour traffic;意近 peak hours。"},{"text":"carpool","reading":"v.","zh":"共乘","topic":"日常生活","example":"Several colleagues carpool to the office to save on fuel costs.","example_zh":"幾位同事共乘上班,以節省油錢。","note":"名詞動詞同形;carpool lane 指共乘車道。"},{"text":"parking permit","reading":"n.","zh":"停車證","topic":"日常生活","example":"A valid parking permit must be displayed on the windshield at all times.","example_zh":"有效停車證必須隨時放置於擋風玻璃上展示。","note":"permit 作名詞時重音在字首;意近 parking pass。"},{"text":"flat tire","reading":"n.","zh":"爆胎;輪胎沒氣","topic":"日常生活","example":"She was late for the meeting because of a flat tire on the highway.","example_zh":"她因為在高速公路上爆胎而開會遲到。","note":"英式拼法為 flat tyre;have/get a flat tire 為常用說法。"},{"text":"tow","reading":"v.","zh":"拖吊","topic":"日常生活","example":"Vehicles parked in front of the loading dock will be towed at the owner's expense.","example_zh":"停在卸貨區前的車輛將被拖吊,費用由車主自行負擔。","note":"tow-away zone(拖吊區)、at the owner's expense 為高頻搭配。"},{"text":"vending machine","reading":"n.","zh":"自動販賣機","topic":"日常生活","example":"A vending machine with snacks and drinks is located near the elevator.","example_zh":"電梯附近設有販售零食和飲料的自動販賣機。","note":"為聽力 Part 1 圖片題常見物品。"},{"text":"withdraw","reading":"v.","zh":"提款;撤回","topic":"日常生活","example":"You can withdraw cash from any of the bank's ATMs without a fee.","example_zh":"你可以在該銀行任一台 ATM 免手續費提領現金。","note":"名詞 withdrawal;另義為「撤回(提案、參賽)」。"},{"text":"bank statement","reading":"n.","zh":"銀行對帳單","topic":"日常生活","example":"Please review your bank statement each month for unauthorized charges.","example_zh":"請每月檢查銀行對帳單,確認有無未經授權的扣款。","note":"monthly statement(每月對帳單)為常見說法。"},{"text":"teller","reading":"n.","zh":"銀行櫃員","topic":"日常生活","example":"The teller helped me open a savings account in less than twenty minutes.","example_zh":"銀行櫃員不到二十分鐘就幫我開好了儲蓄帳戶。","note":"bank teller 為完整說法;ATM 即 automated teller machine。"},{"text":"premium","reading":"n.","zh":"保險費","topic":"日常生活","example":"Installing a security system may lower your insurance premium.","example_zh":"安裝保全系統可能可以降低你的保險費。","note":"insurance premium 為固定搭配;形容詞義為「優質的」。"},{"text":"coverage","reading":"n.","zh":"保險理賠範圍","topic":"日常生活","example":"The travel insurance provides coverage for lost luggage and flight delays.","example_zh":"這份旅遊險提供行李遺失與航班延誤的理賠。","note":"另義為「(新聞)報導」,如 media coverage。"},{"text":"postage","reading":"n.","zh":"郵資","topic":"日常生活","example":"Postage is included in the price for all domestic orders.","example_zh":"所有國內訂單的價格皆已含郵資。","note":"postage and handling(郵資與手續費)常見於帳單。"},{"text":"consignee","reading":"n.","zh":"收貨人","topic":"生產物流","example":"The consignee must present a photo ID before the shipment can be released.","example_zh":"收貨人必須出示附照片的證件，貨物才能放行。","note":"與 consignor（託運人）相對；提單（bill of lading）上必填欄位。"},{"text":"waybill","reading":"n.","zh":"貨運單；運貨清單","topic":"生產物流","example":"Please attach the air waybill to the outside of each carton before pickup.","example_zh":"取件前請將空運貨運單貼在每個紙箱外側。","note":"常見 air waybill（空運提單）；與 invoice（發票）為不同文件。"},{"text":"manifest","reading":"n.","zh":"艙單；載貨清單","topic":"生產物流","example":"Customs officials compared the cargo manifest with the actual contents of the container.","example_zh":"海關人員將載貨清單與貨櫃內實際貨物進行比對。","note":"搭配 cargo/passenger manifest；另有動詞「顯露」之義，Part 7 多考名詞。"},{"text":"consolidate","reading":"v.","zh":"整合；合併（貨物、訂單）","topic":"生產物流","example":"To reduce freight costs, we consolidate small orders into a single weekly shipment.","example_zh":"為降低運費，我們將小額訂單整合為每週一次的出貨。","note":"搭配 consolidate shipments/orders；名詞為 consolidation。"},{"text":"fleet","reading":"n.","zh":"車隊；船隊","topic":"生產物流","example":"The company is upgrading its delivery fleet to electric vans next quarter.","example_zh":"該公司下一季將把送貨車隊升級為電動廂型車。","note":"搭配 a fleet of trucks/vehicles；集合名詞，單數形即可指整批車輛。"},{"text":"vessel","reading":"n.","zh":"船舶；容器","topic":"生產物流","example":"The cargo vessel is scheduled to arrive at the port of Kaohsiung on May 3.","example_zh":"這艘貨輪預定於五月三日抵達高雄港。","note":"cargo vessel＝貨輪；另義「容器」，閱讀時依上下文判斷。"},{"text":"loading dock","reading":"n.","zh":"裝卸貨月台","topic":"生產物流","example":"All deliveries should be made to the loading dock at the rear of the building.","example_zh":"所有貨物請送至大樓後方的裝卸貨月台。","note":"Part 1 圖片常見場景；dock 亦可作動詞（靠泊）。"},{"text":"hand truck","reading":"n.","zh":"手推車（兩輪搬運車）","topic":"生產物流","example":"A worker is moving some boxes with a hand truck.","example_zh":"一名工人正用手推車搬運箱子。","note":"Part 1 高頻；同義 dolly；與 cart（四輪推車）略有不同。"},{"text":"crane","reading":"n.","zh":"起重機；吊車","topic":"生產物流","example":"A crane is lifting a container onto the ship.","example_zh":"一台起重機正將貨櫃吊上船。","note":"Part 1 高頻；另義「鶴」；動詞 crane one's neck（伸長脖子）較少考。"},{"text":"hoist","reading":"v.","zh":"吊起；升起","topic":"生產物流","example":"The workers hoisted the machinery onto the truck with a pulley system.","example_zh":"工人們用滑輪裝置把機器吊上卡車。","note":"Part 1 常見；搭配 hoist... onto/into；比 lift 更強調用器械吊升。"},{"text":"stack","reading":"v.","zh":"堆疊；堆放","topic":"生產物流","example":"Crates are stacked on top of one another in the warehouse.","example_zh":"倉庫裡的板條箱一個個疊放在一起。","note":"Part 1 高頻：be stacked (up)；名詞 a stack of（一疊）。"},{"text":"haul","reading":"v.","zh":"（用卡車等）運送；拖運","topic":"生產物流","example":"The contractor hauls raw materials from the port to the plant every morning.","example_zh":"承包商每天早上將原物料從港口運到工廠。","note":"衍生 long-haul（長途的）；名詞 haulage＝貨運（英式用法）。"},{"text":"stockroom","reading":"n.","zh":"儲藏室；庫房","topic":"生產物流","example":"Extra printer paper is kept in the stockroom next to the mailroom.","example_zh":"備用的影印紙放在收發室旁邊的儲藏室。","note":"比 warehouse（倉庫）規模小，多指店內或辦公室的存貨間。"},{"text":"overstock","reading":"v.","zh":"存貨過多；進貨過量","topic":"生產物流","example":"The store overstocked winter coats and had to mark them down sharply in March.","example_zh":"這家店冬季外套進貨過量，三月時只好大幅降價。","note":"常見被動 be overstocked with；反義概念為 run short of（缺貨）。"},{"text":"spoilage","reading":"n.","zh":"（食品等）腐壞；損耗","topic":"生產物流","example":"Refrigerated trucks help reduce spoilage during long-distance transport.","example_zh":"冷藏貨車有助於減少長途運輸過程中的腐壞損耗。","note":"不可數名詞；搭配 reduce/prevent spoilage；動詞為 spoil。"},{"text":"dispose of","reading":"phr.","zh":"處理掉；丟棄","topic":"生產物流","example":"Please dispose of chemical waste in accordance with local regulations.","example_zh":"請依當地法規處理化學廢棄物。","note":"必接 of，不可只用 dispose；名詞 disposal（waste disposal 廢棄物處理）。"},{"text":"scrap","reading":"v.","zh":"報廢；廢棄（計畫）","topic":"生產物流","example":"Management decided to scrap the outdated equipment rather than repair it.","example_zh":"管理階層決定將老舊設備報廢，而不是維修。","note":"另義取消計畫：scrap a project；名詞 scrap metal（廢金屬）。"},{"text":"dismantle","reading":"v.","zh":"拆卸；拆除","topic":"生產物流","example":"Technicians will dismantle the old assembly equipment over the weekend.","example_zh":"技師將於週末拆卸舊的組裝設備。","note":"反義為 assemble（組裝）；亦可指逐步廢除制度。"},{"text":"retrofit","reading":"v.","zh":"改裝；加裝（新設備於舊系統）","topic":"生產物流","example":"The factory was retrofitted with energy-efficient lighting last year.","example_zh":"這座工廠去年加裝了節能照明設備。","note":"搭配 retrofit A with B；與 renovate（翻修建物）區分。"},{"text":"blueprint","reading":"n.","zh":"藍圖；設計圖","topic":"生產物流","example":"Engineers reviewed the blueprints before construction of the new production line began.","example_zh":"工程師在新產線動工前審閱了設計圖。","note":"亦可比喻「計畫藍圖」：a blueprint for growth。"},{"text":"gauge","reading":"v.","zh":"測量；評估","topic":"生產物流","example":"Sensors gauge the temperature inside the storage facility around the clock.","example_zh":"感測器全天候測量儲存設施內的溫度。","note":"名詞為「量表、儀器」（fuel gauge）；拼字易與 gorge 混淆。"},{"text":"sturdy","reading":"adj.","zh":"堅固的；耐用的","topic":"生產物流","example":"Use sturdy cartons so the merchandise is not crushed in transit.","example_zh":"請使用堅固的紙箱，以免商品在運送途中被壓壞。","note":"同義 durable、solid；常修飾 packaging、furniture。"},{"text":"intact","reading":"adj.","zh":"完好無損的","topic":"生產物流","example":"Please check that the seal is intact before signing for the package.","example_zh":"簽收包裹前，請確認封條完好無損。","note":"只作補語（remain/arrive intact），不放名詞前；勿與 contact 拼混。"},{"text":"airtight","reading":"adj.","zh":"密封的；密不透風的","topic":"生產物流","example":"Perishable goods are packed in airtight containers before shipping.","example_zh":"易腐商品在出貨前會裝入密封容器。","note":"搭配 airtight container/seal；比喻義 an airtight contract（無漏洞的合約）。"},{"text":"serial number","reading":"n.","zh":"序號；產品編號","topic":"生產物流","example":"Please provide the serial number on the back of the device when requesting repairs.","example_zh":"申請維修時，請提供機身背面的產品序號。","note":"保固登錄、召回公告（recall notice）必考詞；縮寫 S/N。"},{"text":"shop floor","reading":"n.","zh":"生產現場；工廠作業區","topic":"生產物流","example":"Safety helmets must be worn at all times on the shop floor.","example_zh":"在生產現場必須全程配戴安全帽。","note":"指工廠實際作業區域，非「商店地板」；常見 on the shop floor。"},{"text":"workmanship","reading":"n.","zh":"做工；工藝品質","topic":"生產物流","example":"The warranty covers any defects in materials or workmanship for two years.","example_zh":"保固涵蓋材料或做工瑕疵，為期兩年。","note":"保固條款固定搭配 defects in workmanship；不可數。"},{"text":"wear and tear","reading":"n.","zh":"（正常使用造成的）磨損","topic":"生產物流","example":"The warranty does not cover damage caused by normal wear and tear.","example_zh":"保固不涵蓋正常磨損造成的損壞。","note":"固定語順不可倒置；常見於保固與租賃條款。"},{"text":"idle","reading":"adj.","zh":"閒置的；停工的","topic":"生產物流","example":"Two production lines sat idle while the parts shipment was delayed.","example_zh":"在零件延遲到貨期間，兩條產線一直閒置。","note":"搭配 sit/stand idle；勿與 idol（偶像）拼混。"},{"text":"stagger","reading":"v.","zh":"錯開（時間）；使交錯","topic":"生產物流","example":"The plant staggers employee shifts to keep the line running around the clock.","example_zh":"工廠將員工班表錯開，讓產線全天候運作。","note":"搭配 stagger shifts/schedules；另義「蹣跚」，多益以「錯開」為主。"},{"text":"standardize","reading":"v.","zh":"使標準化","topic":"生產物流","example":"The company standardized its packing procedures across all distribution sites.","example_zh":"該公司將所有配送據點的包裝流程標準化。","note":"名詞 standardization；常與 procedures、formats 搭配。"},{"text":"optimize","reading":"v.","zh":"使最佳化","topic":"生產物流","example":"New routing software will optimize delivery schedules and cut fuel costs.","example_zh":"新的路線規劃軟體將使配送班表最佳化並降低油料成本。","note":"搭配 optimize efficiency/performance；名詞 optimization。"},{"text":"source","reading":"v.","zh":"採購；（從某處）取得原料","topic":"生產物流","example":"The manufacturer sources most of its components from local suppliers.","example_zh":"這家製造商大部分零件都向本地供應商採購。","note":"動詞用法為多益考點：source A from B；名詞義「來源」較基礎。"},{"text":"conform to","reading":"phr.","zh":"符合（標準、規範）","topic":"生產物流","example":"All packaging must conform to international safety standards.","example_zh":"所有包裝都必須符合國際安全標準。","note":"介系詞用 to；同義 comply with；勿與 confirm（確認）拼混。"},{"text":"carry out","reading":"phr.","zh":"執行；進行","topic":"生產物流","example":"Inspectors will carry out a routine check of the warehouse next Monday.","example_zh":"檢查人員將於下週一對倉庫進行例行檢查。","note":"搭配 carry out an inspection/a survey/repairs；同義 conduct、perform。"},{"text":"keep track of","reading":"phr.","zh":"追蹤；掌握（進度、數量）","topic":"生產物流","example":"The new system helps managers keep track of inventory levels in real time.","example_zh":"新系統協助主管即時掌握庫存水位。","note":"反義 lose track of；受詞常為 inventory、expenses、orders。"},{"text":"hold up","reading":"phr.","zh":"延誤；耽擱","topic":"生產物流","example":"The shipment was held up at customs for three days.","example_zh":"這批貨在海關被延誤了三天。","note":"常用被動 be held up；與 hold on（稍等）、hold off（延後）區分。"},{"text":"scale back","reading":"phr.","zh":"縮減（規模、產量）","topic":"生產物流","example":"The firm scaled back production in response to weaker overseas demand.","example_zh":"因海外需求轉弱，該公司縮減了產量。","note":"同義 cut back on；反義 ramp up/scale up（擴大）。"},{"text":"churn out","reading":"phr.","zh":"大量生產；快速產出","topic":"生產物流","example":"The new plant can churn out five thousand units a day.","example_zh":"新工廠一天可大量生產五千件產品。","note":"略帶「量大、快速」語感；受詞為產品、報告等。"},{"text":"precaution","reading":"n.","zh":"預防措施","topic":"生產物流","example":"As a precaution, workers must wear goggles when operating the cutting machine.","example_zh":"作為預防措施，操作裁切機時工人必須配戴護目鏡。","note":"搭配 take precautions、as a precaution；形容詞 precautionary。"},{"text":"hazardous","reading":"adj.","zh":"危險的；有害的","topic":"生產物流","example":"Hazardous materials must be labeled clearly before they are transported.","example_zh":"危險物質在運送前必須清楚標示。","note":"固定搭配 hazardous materials/waste；名詞 hazard（a fire hazard）。"},{"text":"flammable","reading":"adj.","zh":"易燃的","topic":"生產物流","example":"Flammable liquids should be stored away from direct sunlight.","example_zh":"易燃液體應存放於遠離陽光直射處。","note":"inflammable 意思相同（非反義）；反義為 nonflammable。"},{"text":"protective gear","reading":"n.","zh":"防護裝備","topic":"生產物流","example":"Visitors to the plant are required to wear protective gear at all times.","example_zh":"進入工廠的訪客必須全程穿戴防護裝備。","note":"gear 為不可數集合名詞；同義 protective equipment。"},{"text":"refrigerated","reading":"adj.","zh":"冷藏的","topic":"生產物流","example":"Dairy products are delivered in refrigerated trucks to keep them fresh.","example_zh":"乳製品以冷藏貨車配送以保持新鮮。","note":"搭配 refrigerated truck/storage；名詞 refrigeration（冷藏技術）。"},{"text":"on-site","reading":"adj.","zh":"現場的；就地的","topic":"生產物流","example":"An on-site technician is available to handle equipment problems immediately.","example_zh":"現場配有技師，可立即處理設備問題。","note":"亦作副詞 on site；反義 off-site（場外的）。"},{"text":"until further notice","reading":"phr.","zh":"直到另行通知為止","topic":"生產物流","example":"The east warehouse will remain closed until further notice.","example_zh":"東側倉庫將關閉，直到另行通知為止。","note":"Part 7 公告高頻結尾語；notice 前不加冠詞。"},{"text":"out of service","reading":"phr.","zh":"停用中；故障停機","topic":"生產物流","example":"The freight elevator is out of service while repairs are carried out.","example_zh":"貨梯於維修期間暫停使用。","note":"指設備暫停運作；與 out of order（故障）意思相近，公告常用。"},{"text":"savory","reading":"adj.","zh":"鹹香可口的；開胃的","topic":"餐廳飯店","example":"The menu features both savory dishes and a wide selection of desserts.","example_zh":"菜單上既有鹹食料理，也有豐富的甜點選擇。","note":"與 sweet（甜的）相對；英式拼法 savoury。"},{"text":"portion","reading":"n.","zh":"（食物的）一份；份量","topic":"餐廳飯店","example":"Reviewers praised the restaurant for its generous portions and reasonable prices.","example_zh":"評論者稱讚這家餐廳份量大方、價格合理。","note":"搭配 generous/small portions；另義「部分」（a portion of the budget）。"},{"text":"diner","reading":"n.","zh":"用餐客人；小餐館","topic":"餐廳飯店","example":"Diners can enjoy a complimentary beverage with any lunch entrée.","example_zh":"點任一午間主餐的用餐客人可享一杯免費飲料。","note":"一字兩義：人（用餐者）或美式小餐館；勿與 dinner 拼混。"},{"text":"eatery","reading":"n.","zh":"餐館；飲食店","topic":"餐廳飯店","example":"A popular eatery specializing in noodles has opened near the station.","example_zh":"一家以麵食聞名的人氣餐館在車站附近開幕了。","note":"Part 7 常見的 restaurant 換句話說；同類詞 establishment。"},{"text":"specialty","reading":"n.","zh":"招牌菜；專長","topic":"餐廳飯店","example":"Grilled seafood is the specialty of the house at Harborview Restaurant.","example_zh":"碳烤海鮮是海景餐廳的招牌菜。","note":"固定說法 specialty of the house；英式拼法 speciality。"},{"text":"delicacy","reading":"n.","zh":"佳餚；珍饈","topic":"餐廳飯店","example":"The tasting menu introduces guests to several local delicacies.","example_zh":"品嚐菜單帶領賓客認識多道當地佳餚。","note":"常見 local delicacies；另義「細膩、微妙」較少考。"},{"text":"service charge","reading":"n.","zh":"服務費","topic":"餐廳飯店","example":"A ten percent service charge will be added to the bill for parties of six or more.","example_zh":"六人以上訂位將於帳單加收百分之十的服務費。","note":"與 gratuity/tip（小費）不同：服務費由店家強制收取。"},{"text":"luncheon","reading":"n.","zh":"（正式）午餐會","topic":"餐廳飯店","example":"The awards luncheon will be held in the hotel's main dining room at noon.","example_zh":"頒獎午餐會將於中午在飯店主餐廳舉行。","note":"比 lunch 正式，多指商務或典禮場合；awards luncheon 為高頻搭配。"},{"text":"reception","reading":"n.","zh":"歡迎會；接待處","topic":"餐廳飯店","example":"A welcome reception for conference attendees will be held in the hotel ballroom.","example_zh":"將在飯店宴會廳為與會者舉辦歡迎會。","note":"義項多：歡迎會、接待櫃檯、收訊；與 receptionist（接待員）區分。"},{"text":"gala","reading":"n.","zh":"盛會；慶祝晚會","topic":"餐廳飯店","example":"Tickets for the charity gala include a five-course dinner and live music.","example_zh":"慈善晚會的門票包含五道式晚餐與現場音樂表演。","note":"常見 gala dinner/annual gala；屬正式盛大活動。"},{"text":"dietary","reading":"adj.","zh":"飲食的","topic":"餐廳飯店","example":"Please inform the caterer of any dietary restrictions by Friday.","example_zh":"如有任何飲食限制，請於週五前告知外燴業者。","note":"高頻搭配 dietary restrictions/requirements；名詞為 diet。"},{"text":"waiting list","reading":"n.","zh":"候位名單；候補名單","topic":"餐廳飯店","example":"The restaurant is fully booked tonight, but we can put you on the waiting list.","example_zh":"餐廳今晚已訂滿，但我們可以將您排入候位名單。","note":"搭配 put/place someone on the waiting list；亦拼作 waitlist。"},{"text":"ballroom","reading":"n.","zh":"宴會廳；舞廳","topic":"餐廳飯店","example":"The grand ballroom can accommodate up to four hundred guests for a banquet.","example_zh":"大宴會廳最多可容納四百位賓客舉行宴會。","note":"飯店活動場地公告高頻；與 function room（多功能廳）同類。"},{"text":"chain","reading":"n.","zh":"連鎖（店、飯店）","topic":"餐廳飯店","example":"The hotel chain plans to open three new properties in Southeast Asia.","example_zh":"該連鎖飯店集團計畫在東南亞開設三家新據點。","note":"搭配 hotel/restaurant chain；另義「鏈條」，supply chain 已屬物流用法。"},{"text":"franchise","reading":"n.","zh":"加盟店；特許經營權","topic":"餐廳飯店","example":"She opened a franchise of the well-known coffee shop in her hometown.","example_zh":"她在家鄉開了一家知名咖啡店的加盟店。","note":"franchisee＝加盟主，franchisor＝授權總部；亦可作動詞。"},{"text":"flagship","reading":"n.","zh":"旗艦店；最重要的據點","topic":"餐廳飯店","example":"The company's original Taipei location serves as the flagship of the restaurant group.","example_zh":"該公司位於台北的創始店是這個餐飲集團的旗艦店。","note":"常置於名詞前作形容詞用：flagship store/branch。"},{"text":"outlet","reading":"n.","zh":"門市；分店","topic":"餐廳飯店","example":"The bakery chain now has more than twenty outlets across the country.","example_zh":"這家連鎖烘焙坊目前在全國有超過二十家門市。","note":"一字多義：門市、插座（electrical outlet）、宣洩出口。"},{"text":"establishment","reading":"n.","zh":"（餐飲、營業）場所；機構","topic":"餐廳飯店","example":"Smoking is prohibited anywhere inside the establishment.","example_zh":"本場所內任何地方均禁止吸菸。","note":"Part 7 常作 restaurant/hotel 的換句話說；dining establishment 高頻。"},{"text":"frequent","reading":"v.","zh":"常去；時常光顧","topic":"餐廳飯店","example":"Many office workers frequent the café across from the convention center.","example_zh":"許多上班族常光顧會議中心對面的咖啡館。","note":"動詞用法為考點（重音在後）；形容詞義「頻繁的」重音在前。"},{"text":"foot traffic","reading":"n.","zh":"人流量；來客量","topic":"餐廳飯店","example":"The new location near the subway station gets much more foot traffic.","example_zh":"靠近捷運站的新店面人流量大得多。","note":"選址、業績報告常見；搭配 increase/generate foot traffic。"},{"text":"within walking distance","reading":"phr.","zh":"步行可達的距離內","topic":"餐廳飯店","example":"The hotel is within walking distance of several museums and restaurants.","example_zh":"這家飯店距離多家博物館與餐廳都在步行可達範圍內。","note":"後接 of + 地點；廣告與飯店介紹高頻句型。"},{"text":"getaway","reading":"n.","zh":"度假；小旅行","topic":"餐廳飯店","example":"The resort is offering a special rate for a two-night weekend getaway.","example_zh":"度假村推出兩晚週末小旅行的特惠價。","note":"高頻搭配 weekend getaway；廣告文宣常見。"},{"text":"retreat","reading":"n.","zh":"（公司）僻靜研習營；靜養地","topic":"餐廳飯店","example":"The annual company retreat will take place at a lakeside resort in October.","example_zh":"年度公司研習營將於十月在湖畔度假村舉行。","note":"company/corporate retreat＝公司外地共識營；另義「撤退」。"},{"text":"minibar","reading":"n.","zh":"（客房內）迷你吧","topic":"餐廳飯店","example":"Snacks and drinks from the minibar will be charged to your room.","example_zh":"取用迷你吧的零食與飲料將計入您的房帳。","note":"常與 be charged to one's room（記入房帳）搭配出題。"},{"text":"porter","reading":"n.","zh":"行李員；搬運工","topic":"餐廳飯店","example":"A porter will bring your luggage up to your room shortly.","example_zh":"行李員稍後會將您的行李送到房間。","note":"同義 bellhop；車站、機場的搬運工也稱 porter。"},{"text":"terrace","reading":"n.","zh":"露台；平台","topic":"餐廳飯店","example":"Guests may enjoy breakfast on the rooftop terrace overlooking the harbor.","example_zh":"旅客可以在可俯瞰海港的頂樓露台享用早餐。","note":"與 patio（庭院露台）、balcony（陽台）同類，Part 1 也會出現。"},{"text":"courtyard","reading":"n.","zh":"中庭；庭院","topic":"餐廳飯店","example":"The hotel's courtyard is a popular spot for outdoor wedding receptions.","example_zh":"這家飯店的中庭是舉辦戶外婚宴的熱門地點。","note":"指建築物包圍的露天庭院；飯店設施介紹常見。"},{"text":"spotless","reading":"adj.","zh":"一塵不染的","topic":"餐廳飯店","example":"Guests often mention the spotless rooms in their online reviews.","example_zh":"房客常在網路評論中提到客房一塵不染。","note":"評論文章高頻；同義 immaculate；spot＝污點。"},{"text":"immaculate","reading":"adj.","zh":"潔淨無瑕的；完美的","topic":"餐廳飯店","example":"The dining area was immaculate, and the staff were friendly and efficient.","example_zh":"用餐區潔淨無瑕，員工親切又有效率。","note":"比 clean 更強烈；亦可形容服裝、紀錄（immaculate record）。"},{"text":"cozy","reading":"adj.","zh":"溫馨舒適的","topic":"餐廳飯店","example":"The inn's cozy lounge features a fireplace and comfortable armchairs.","example_zh":"這家旅店溫馨舒適的交誼廳有壁爐和舒服的扶手椅。","note":"多形容小而溫暖的空間；英式拼法 cosy。"},{"text":"quaint","reading":"adj.","zh":"古色古香的；別緻的","topic":"餐廳飯店","example":"The quaint seaside hotel attracts visitors looking for a quiet escape.","example_zh":"這家古色古香的海濱旅館吸引想安靜度假的旅客。","note":"帶「老式而迷人」的正面語感；旅遊文章高頻。"},{"text":"impeccable","reading":"adj.","zh":"無可挑剔的","topic":"餐廳飯店","example":"The restaurant is known
