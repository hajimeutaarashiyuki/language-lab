/* ---- 單一課程頁 ---- */

async function renderLesson(seq, key, id) {
  loadingPage();
  let data;
  try {
    await loadState();
    data = await loadLang(key);
  } catch (e) { if (!stale(seq)) errorPage('#/lessons/' + key); return; }
  if (stale(seq)) return;
  const lessons = lessonsOf(data);
  const idx = lessons.findIndex(ls => ls.id === id);
  if (idx === -1) {
    setPage(
      backBtn('#/lessons/' + key, '返回課程列表'),
      h('div', { class: 'card center-card' },
        h('p', { class: 'big-emoji' }, '😢'),
        h('p', null, '找不到這一課，請回課程列表重新選擇。'),
        h('button', { type: 'button', class: 'btn btn-primary', onclick: () => go('#/lessons/' + key) }, '返回課程列表')
      )
    );
    return;
  }
  const lesson = lessons[idx];
  const nextLesson = lessons[idx + 1] || null;
  const doneBefore = lessonsDoneSet(key).has(id);
  const color = langColor(key);

  let completing = false;
  /** 完課：POST /api/lesson（重複標記由後端冪等處理）→ toast → 前往 nextHash */
  async function completeLesson(nextHash) {
    if (completing) return;
    completing = true;
    let res;
    try {
      res = await api('/api/lesson', { method: 'POST', body: { lang: key, id: id } });
    } catch (e) { completing = false; return; } // toast 已由 api() 顯示
    if (res && Array.isArray(res.lessons_done)) {
      const info = findLangInfo(key);
      if (info) info.lessons_done = res.lessons_done.slice(); // 同步快取，列表立即打勾
    }
    if (stale(seq)) return;
    showToast('已完成「' + (lesson.title || id) + '」🎉', true);
    go(nextHash);
  }

  function finishButtons() {
    const btns = [
      h('button', {
        type: 'button', class: 'btn btn-primary btn-big',
        onclick: () => completeLesson('#/lessons/' + key)
      }, '完成本課 ✓')
    ];
    if (nextLesson) {
      btns.push(h('button', {
        type: 'button', class: 'btn btn-ghost',
        onclick: () => completeLesson('#/lesson/' + key + '/' + nextLesson.id)
      }, '下一課：' + (nextLesson.title || nextLesson.id)));
    }
    return h('div', { class: 'btn-row' }, btns);
  }

  function textNode(sec) {
    return h('p', { class: 'lesson-para' }, markupNodes(sec.body));
  }

  function tipNode(sec) {
    return h('div', { class: 'tip-box' }, '💡 ', markupNodes(sec.body));
  }

  function soundsNode(sec) {
    const cells = (Array.isArray(sec.items) ? sec.items : [])
      .filter(it => it && it.text)
      .map(it =>
        h('button', {
          type: 'button', class: 'sound-cell', title: '點擊發音',
          onclick: () => speak(key, it.text)
        },
          h('span', { class: 'sound-text' }, it.text),
          it.sub ? h('span', { class: 'sound-sub muted' }, it.sub) : null,
          it.zh ? h('span', { class: 'sound-zh muted' }, it.zh) : null
        ));
    return h('section', { class: 'lesson-section' },
      sec.title ? h('h3', { style: 'color:' + color }, sec.title) : null,
      h('div', { class: 'sound-grid' }, cells),
      h('p', { class: 'muted small' }, '🔊 點任一格可發音')
    );
  }

  function tableNode(sec) {
    return h('section', { class: 'lesson-section' },
      sec.title ? h('h3', { style: 'color:' + color }, sec.title) : null,
      h('div', { class: 'table-wrap' },
        h('table', { class: 'lesson-table' },
          (Array.isArray(sec.headers) && sec.headers.length)
            ? h('thead', null, h('tr', null, sec.headers.map(x => h('th', null, x))))
            : null,
          h('tbody', null, (Array.isArray(sec.rows) ? sec.rows : []).map(r =>
            h('tr', null, (Array.isArray(r) ? r : [r]).map(c => h('td', null, c)))))
        )
      )
    );
  }

  /** 隨堂測驗：逐題四選一、即時對錯上色＋詳解，答完顯示本課小結（含完課按鈕） */
  function quizNode(sec) {
    const questions = (Array.isArray(sec.questions) ? sec.questions : [])
      .filter(q => q && Array.isArray(q.options) && q.options.length > 0);
    const area = h('div', { class: 'lesson-quiz' });
    const s = { i: 0, correct: 0, locked: false };

    function renderSummary() {
      area.replaceChildren(
        h('div', { class: 'card center-card' },
          h('p', { class: 'big-emoji' }, questions.length > 0 && s.correct === questions.length ? '💯' : '🏁'),
          h('h2', null, '本課小結'),
          questions.length > 0
            ? h('p', { class: 'result-num', style: 'color:' + color },
                '隨堂測驗答對 ' + s.correct + '/' + questions.length +
                '（' + pct(s.correct, questions.length) + '）')
            : null,
          doneBefore ? h('p', { class: 'muted small' }, '這一課之前已完成，重做不會重複計數。') : null,
          finishButtons()
        )
      );
    }

    function renderQ() {
      if (s.i >= questions.length) { renderSummary(); return; }
      s.locked = false;
      const q = questions[s.i];
      const feedback = h('div', { class: 'quiz-feedback' });
      const nextWrap = h('div', { class: 'btn-row' });
      const optBtns = q.options.map((opt, oi) => {
        const btn = h('button', { type: 'button', class: 'btn opt-btn' }, opt);
        btn.addEventListener('click', () => {
          if (s.locked) return;
          s.locked = true;
          const ok = oi === q.answer;
          if (ok) s.correct++;
          for (const b of optBtns) b.disabled = true;
          if (optBtns[q.answer]) optBtns[q.answer].classList.add('opt-correct');
          if (!ok) btn.classList.add('opt-wrong');
          feedback.replaceChildren(...[
            h('p', { class: ok ? 'fb-ok' : 'fb-no' }, ok ? '✔ 答對了！' : '✘ 答錯了'),
            q.explain_zh ? h('div', { class: 'explain-box' },
              h('p', { class: 'fb-ans' }, '詳解'),
              h('p', null, q.explain_zh)) : null
          ].filter(Boolean));
          nextWrap.replaceChildren(
            h('button', {
              type: 'button', class: 'btn btn-primary',
              onclick: () => { s.i++; renderQ(); }
            }, s.i + 1 >= questions.length ? '看本課小結' : '下一題')
          );
        });
        return btn;
      });
      area.replaceChildren(
        h('div', { class: 'card quiz-card' },
          h('p', { class: 'progress-text' },
            '隨堂測驗 第 ' + (s.i + 1) + '/' + questions.length + ' 題・答對 ' + s.correct),
          h('p', { class: 'quiz-question' }, q.question),
          h('div', { class: 'opt-list' }, optBtns),
          feedback,
          nextWrap
        )
      );
    }

    renderQ();
    return h('section', { class: 'lesson-section' },
      sec.title ? h('h3', { style: 'color:' + color }, sec.title) : null,
      area
    );
  }

  // 依序渲染 sections：連續的內容節合成一張卡片，quiz 自成一區；未知型別跳過
  const flow = [];
  let buf = [];
  function flush() {
    if (buf.length) { flow.push(h('div', { class: 'card lesson-card' }, buf)); buf = []; }
  }
  let hasQuiz = false;
  for (const sec of (Array.isArray(lesson.sections) ? lesson.sections : [])) {
    if (!sec || typeof sec !== 'object') continue;
    if (sec.type === 'text') buf.push(textNode(sec));
    else if (sec.type === 'tip') buf.push(tipNode(sec));
    else if (sec.type === 'sounds') buf.push(soundsNode(sec));
    else if (sec.type === 'table') buf.push(tableNode(sec));
    else if (sec.type === 'quiz') { hasQuiz = true; flush(); flow.push(quizNode(sec)); }
  }
  flush();
  if (!hasQuiz) {
    // 資料缺 quiz 時（容錯）：仍可直接完課
    flow.push(h('div', { class: 'card center-card' },
      doneBefore ? h('p', { class: 'muted small' }, '這一課之前已完成，重做不會重複計數。') : null,
      finishButtons()));
  }

  setPage(
    backBtn('#/lessons/' + key, '返回課程列表'),

/* ===================== 四選一選項（錯誤導向加權抽樣核心） ===================== */

/**
 * 核心純函式：組出 [正解卡＋最多 3 個干擾項] 並洗牌（rand 可注入以便單元測試）。
 * 干擾項候選層級：
 *   A＝該卡 wrong_picks[field]（之前選錯過的選項）：次數降冪逐個擲 70% 機率決定納入，
 *      最多納 2 個（保底 1 個名額給新選項）；已不在任何候選庫的字串仍可直接作為選項。
 *   B＝distractors_zh（field 為 zh 且存在時，從全部隨機抽）
 *   C＝同 topic 池 → D＝全池
 * 全程以顯示欄位值與正解及彼此去重；A/B 產生的合成物件僅含顯示欄位。
 */
function buildMcOptions(card, pool, field, rand) {
  const rnd = rand || Math.random;
  const seen = new Set([card[field]]);
  const picks = [];

  // A 層：wrong_picks[field]，次數高者優先，各擲 70%，最多 2 個
  const wp = card.wrong_picks && card.wrong_picks[field];
  if (wp && typeof wp === 'object' && !Array.isArray(wp)) {
    const keys = Object.keys(wp)
      .filter(k => k && !seen.has(k))
      .sort((a, b) => (Number(wp[b]) || 0) - (Number(wp[a]) || 0));
    for (const k of keys) {
      if (picks.length >= 2) break;
      if (rnd() < 0.7) {
        seen.add(k);
        // 盡量用單字池的原物件（日文 mc_z2f 選項才能照常以假名顯示）；
        // 找不到原物件才合成純顯示選項——但 field==='text' 且含漢字者略過：
        // 合成物件沒有 reading，mc_z2f 會退回顯示漢字而漏題（破壞假名認讀），
        // 寧可不納入；純假名／其他字串仍直接合成（本來就是合法顯示文字）。
        const real = pool.find(it => it !== card && it.text !== card.text && it[field] === k);
        if (real) {
          picks.push(real);
        } else if (!(field === 'text' && hasKanji(k))) {
          const o = {};
          o[field] = k;
          picks.push(o);
        }
      }
    }
  }

  // B 層（僅 field='zh'）→ C 同 topic → D 全池，依序隨機補滿至 3 個
  const tiers = [];
  if (field === 'zh' && Array.isArray(card.distractors_zh)) {
    tiers.push(card.distractors_zh.filter(v => v).map(v => ({ zh: String(v) })));
  }
  const sameTopic = [];
  const others = [];
  for (const it of pool) {
    if (it === card || it.text === card.text) continue;
    if (!it[field]) continue;
    if (card.topic && it.topic === card.topic) sameTopic.push(it);
    else others.push(it);
  }
  tiers.push(sameTopic, others);
  for (const tier of tiers) {
    if (picks.length >= 3) break;
    for (const opt of shuffle(tier, rnd)) {
      if (picks.length >= 3) break;
      const v = opt[field];
      if (!v || seen.has(v)) continue;
      seen.add(v);
      picks.push(opt);
    }
  }
  return shuffle([card].concat(picks), rnd);
}

/* ===================== 智慧練習 ===================== */

/** cloze 顯示文字：優先用後端帶的 cloze 欄位，否則以例句挖空 */
function clozeText(card) {
  if (card.cloze) return String(card.cloze);
  if (card.example && String(card.example).indexOf(card.text) !== -1) {
    return String(card.example).split(card.text).join('＿＿＿');
  }
  return '';
}

/** 後端未帶 format 時的保險：依 lv 對應題型階梯 */
function smartFormat(card) {
  if (card.format) return card.format;
  if (card.verify) return card.verify;
  const lv = typeof card.lv === 'number' ? card.lv : 0;
  const canCloze = clozeText(card) !== '';
  // 日文含漢字（且取得到假名）items 的專屬階梯：lv1 假名認讀、lv2 才進 mc_z2f
  if (jpKana(card)) {
    if (lv <= 0) return 'mc_f2z';
    if (lv === 1) return 'mc_kana';
    if (lv === 2) return 'mc_z2f';
    if (lv === 3) return 'spell';
    if (lv === 4) return 'listen_mc';
    return shuffle(['spell', 'listen_mc', 'mc_kana'].concat(canCloze ? ['cloze'] : []))[0];
  }
  if (lv <= 0) return 'mc_f2z';
  if (lv === 1) return 'mc_z2f';
  if (lv === 2) return 'spell';
  if (lv === 3) return 'listen_mc';
  if (lv === 4) return canCloze ? 'cloze' : 'spell';
  return shuffle(['spell', 'listen_mc'].concat(canCloze ? ['cloze'] : []))[0];
}

/** 智慧練習拼寫比對：沿用既有 normAns 與 spellCandidates 規則 */
function smartSpellOk(card, raw) {
  if (baseLang(card.lang) === 'english') {
    return raw.trim().toLowerCase() === String(card.text).trim().toLowerCase();
  }
  const n = normAns(raw);
  return n !== '' && spellCandidates(card).indexOf(n) !== -1;
}

  );
  if (stale(seq)) return;

  const s = { i: 0, answered: 0, correct: 0, upgrades: 0, maint: 0, verifyList: [], done: false };
  // 整場都是維持卡＝今日到期卡已清空，後端只回傳維持複習
  const allMaint = cards.every(c => c.maintenance);
  let cur = null; // 當前題目的鍵盤操作：{ pick, next, replay }

  const page = setPage(h('div', { id: 'smart-area' }));
  const area = page.querySelector('#smart-area');

  setKeyHandler((e) => {
    if (e.isComposing || e.keyCode === 229) return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
    if (!cur || s.done) return;
    if (e.key >= '1' && e.key <= '4' && cur.pick) cur.pick(Number(e.key) - 1);
    else if (e.key === 'Enter' && cur.next) { e.preventDefault(); cur.next(); }
    else if ((e.key === 's' || e.key === 'S') && cur.replay) cur.replay();
  });

  function renderSummary() {
    s.done = true;
    cur = null;
    const verifyRows = s.verifyList.map(v =>
      h('li', { class: 'verify-item' },
        h('span', { class: 'verify-text' }, v.text),
        v.zh ? h('span', { class: 'muted' }, '（' + v.zh + '）') : null,
        h('span', { class: 'chip chip-static' }, formatName(v.verify))
      ));
    area.replaceChildren(
      h('div', null,
        backBtn(backHash, key === 'all' ? '返回首頁' : '返回'),
        h('div', { class: 'card center-card' },
          h('p', { class: 'big-emoji' }, s.answered > 0 && s.correct === s.answered ? '💯' : '🏁'),
          h('h2', null, '智慧練習結束'),
          h('p', { class: 'result-num', style: 'color:' + color },
            '答對率 ' + pct(s.correct, s.answered) + '（' + s.correct + '/' + s.answered + '）'),
          h('p', null, '掌握度升級：' + s.upgrades + ' 個字'),
          s.maint > 0 ? h('p', null, '維持複習：' + s.maint + ' 張') : null,
          verifyRows.length
            ? h('div', { class: 'verify-list' },
                h('h3', null, '這些字之後會換題型再確認'),
                h('ul', null, verifyRows))
            : null,
          h('div', { class: 'btn-row' },
            h('button', { type: 'button', class: 'btn btn-primary', onclick: () => onRoute() }, '再來一輪'),
            h('button', { type: 'button', class: 'btn btn-ghost', onclick: () => go('#/home') }, '回首頁')
          )
        )
      )
    );
  }

  function renderQ() {
    if (s.i >= cards.length) { renderSummary(); return; }
    const card = cards[s.i];
    const cardColor = key === 'all' ? langColor(card.lang) : color;
    let fmt = smartFormat(card);
    // 容錯：未知題型一律退回 mc_f2z（顯示與回報的 mode 保持一致）
    if (['mc_f2z', 'mc_kana', 'mc_z2f', 'spell', 'listen_mc', 'cloze'].indexOf(fmt) === -1) fmt = 'mc_f2z';
    if (fmt === 'cloze' && clozeText(card) === '') fmt = 'spell';
    if (fmt === 'mc_kana' && !jpKana(card)) fmt = 'mc_f2z'; // 取不到假名（或非日文含漢字）退回一般題
    const base = baseLang(card.lang);
    const showReading = card.reading && (base === 'japanese' || base === 'korean');
    const readingPart = card.reading ? '（' + card.reading + '）' : '';
    const pool = (state.langCache[card.lang] && state.langCache[card.lang].items) || [];

    const feedback = h('div', { class: 'quiz-feedback' });
    const nextWrap = h('div', { class: 'btn-row' });

    let t0 = 0;       // 本題 render 完成的時間（performance.now()）
    let ms = 0;       // 第一次作答動作為止的毫秒數
    let ok = false;
    let revealed = false;
    let posting = false;
    let kanjiLine = null; // 日文假名題面：作答後揭曉漢字用（對錯皆顯示）
    let pickedVal = null;   // 四選一答錯時：所點選項的顯示欄位值
    let pickedField = null; // 四選一答錯時：選項欄位（'zh' 或 'text'）

    function stopClock() { ms = Math.max(1, Math.round(performance.now() - t0)); }

    let advanced = false;
    function advance() {
      // 防重複前進（下一題鈕＋Enter＋自動 timer）；已切頁時不再前進（避免在背景出題、自動播音）
      if (advanced || s.done || stale(seq)) return;
      advanced = true;
      s.i++;
      renderQ();
    }

    /** 作答當下立即送出 POST（答對帶 confidence:"sure"，答錯不帶），回應後補顯示掌握度變化 */
    async function submitResult() {
      if (posting) return;
      posting = true;
      let res = null;
      try {
        res = await postAnswer(card.lang, card.text, ok, true,
          { mode: fmt, ms: ms, confidence: ok ? 'sure' : null,
            picked: ok ? null : pickedVal, picked_field: ok ? null : pickedField });
      } catch (e) {
        if (ok) advance(); // 答錯時保留回饋畫面，仍可按「下一題」
        return;
      }
      if (s.done || stale(seq)) return;
      if (res && typeof res.lv === 'number') {
        const delta = typeof res.delta === 'number' ? res.delta : 0;
        const oldLv = res.lv - delta;
        if (delta > 0) s.upgrades++;
        if (res.verify_next) s.verifyList.push({ text: card.text, zh: card.zh, verify: res.verify_next });
        const extraNodes = [
          h('p', { class: 'lv-line ' + (delta > 0 ? 'lv-up' : (delta < 0 ? 'lv-down' : 'lv-keep')) },
            '掌握度 ' + oldLv + ' → ' + res.lv +
            (delta > 0 ? '（+' + delta + '）' : (delta < 0 ? '（' + delta + '）' : '（不變）'))),
          res.reason_zh ? h('p', { class: 'reason-line muted small' }, res.reason_zh) : null
        ].filter(Boolean);
        feedback.append(...extraNodes);
      }
      if (ok) addTimer(advance, 1100); // 答對：稍候自動進下一題（timer 登記在本頁，切頁即清除）
    }

    /** 作答後回饋並立即送出：答對自動前進；答錯顯示正解＋note，按「下一題」（或 Enter）才前進 */
    function showFeedback(ansLine, ansAlways) {
      revealed = true;
      s.answered++;
      if (ok) s.correct++;
      if (card.maintenance) s.maint++;
      const casualLine = casualLineText(card); // 口語版：對錯皆顯示，位置在漢字揭曉行之後
      const fbNodes = [
        h('p', { class: ok ? 'fb-ok' : 'fb-no' }, ok ? '✔ 答對了！' : '✘ 答錯了'),
        (!ok || ansAlways) ? h('p', { class: 'fb-ans' }, (ok ? '答案：' : '正解：') + ansLine) : null,
        kanjiLine ? h('p', { class: 'fb-ans' }, kanjiLine) : null,
        casualLine ? h('p', { class: 'fb-casual' }, casualLine) : null,
        (!ok && card.note) ? h('p', { class: 'fb-note muted' }, '💡 ' + card.note) : null,
        card.reason_zh ? h('p', { class: 'reason-line muted small' }, '💬 ' + card.reason_zh) : null
      ].filter(Boolean);
      feedback.replaceChildren(...fbNodes);
      const replay = fmt === 'listen_mc' ? () => speak(card.lang, card.text) : null;
      if (ok) {
        nextWrap.replaceChildren();
        cur = { replay: replay };
      } else {
        const nextBtn = h('button', { type: 'button', class: 'btn btn-primary', onclick: advance }, '下一題');
        nextWrap.replaceChildren(nextBtn);
        cur = { next: advance, replay: replay };
        nextBtn.focus();
      }
      submitResult();
    }

    function mcBlock(field, ansLine, ansAlways) {
      const options = buildMcOptions(card, pool, field);
      const optBtns = options.map((opt, idx) => {
        // 日文選項以假名顯示（pool 項目沒有 lang 欄位，語言以 card.lang 為準）；比對仍用物件同一性
        const kana = field === 'text' ? jpKana(opt, card.lang) : null;
        const btn = h('button', { type: 'button', class: 'btn opt-btn' }, kana || opt[field]);
        btn.addEventListener('click', () => choose(idx));
        return btn;
      });
      function choose(idx) {
        if (revealed || idx < 0 || idx >= optBtns.length) return;
        stopClock(); // 第一次作答動作停止計時
        ok = options[idx] === card;
        if (!ok) { pickedVal = options[idx][field]; pickedField = field; } // 錯誤導向：記下所選干擾項
        for (const b of optBtns) b.disabled = true;
        optBtns[options.indexOf(card)].classList.add('opt-correct');
        if (!ok) optBtns[idx].classList.add('opt-wrong');
        showFeedback(ansLine, ansAlways);
      }
      return { optBtns: optBtns, choose: choose };
    }

    function spellForm(ansLine) {
      const input = h('input', {
        type: 'text', class: 'spell-input', autocomplete: 'off',
        autocapitalize: 'off', spellcheck: 'false', placeholder: '輸入答案，不會就直接送出'
      });
      const form = h('form', { class: 'spell-form' },
        input,
        h('button', { type: 'submit', class: 'btn btn-primary' }, '送出')
      );
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (revealed) return;
        stopClock(); // 送出拼寫＝第一次作答動作
        ok = smartSpellOk(card, input.value);
        input.disabled = true;
        showFeedback(ansLine, true);
      });
      // IME（注音／日文輸入法）選字時按 Enter 不送出
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.isComposing || e.keyCode === 229)) e.preventDefault();
      });
      return { input: input, form: form };
    }

    let qCard;
    let focusEl = null;
    if (fmt === 'mc_z2f') {
      // 選項以假名顯示時，答對也揭曉「正解＝漢字（reading）」
      const mc = mcBlock('text', card.text + readingPart, jpKana(card) !== null);
      qCard = h('div', { class: 'card quiz-card' },
        h('p', { class: 'muted small' }, '選出正確的外語'),
        h('p', { class: 'quiz-question' }, card.zh),
        h('div', { class: 'opt-list' }, mc.optBtns),
        feedback, nextWrap
      );
      cur = { pick: mc.choose };
    } else if (fmt === 'listen_mc') {
      const replay = () => speak(card.lang, card.text); // 重播不重計時
      const mc = mcBlock('zh', card.text + readingPart + '＝' + card.zh, true);
      qCard = h('div', { class: 'card quiz-card' },
        h('p', { class: 'muted small' }, '聽發音，選出正確的中文意思'),
        h('button', {
          type: 'button', class: 'listen-big', title: '重播發音（s）',
          'aria-label': '重播發音', onclick: replay
        }, '🔊'),
        h('p', { class: 'muted small center-text' }, '聽不清楚可點 🔊 重播（不重新計時）'),
        h('div', { class: 'opt-list' }, mc.optBtns),
        feedback, nextWrap
      );
      cur = { pick: mc.choose, replay: replay };
    } else if (fmt === 'cloze') {
      const sf = spellForm(card.text + readingPart);
      qCard = h('div', { class: 'card quiz-card' },
        h('p', { class: 'muted small' }, '把例句中的「＿＿＿」拼回來'),
        h('p', { class: 'cloze-box' }, clozeText(card)),
        card.example_zh ? h('p', { class: 'muted' }, '提示：' + card.example_zh) : null,
        sf.form, feedback, nextWrap
      );
      focusEl = sf.input;
      cur = {};
    } else if (fmt === 'spell') {
      const sf = spellForm(card.text + readingPart);
      qCard = h('div', { class: 'card quiz-card' },
        h('p', { class: 'muted small' }, '看中文拼出外語'),
        h('p', { class: 'quiz-question' }, card.zh),
        h('p', { class: 'muted small' },
          base === 'english' ? '請輸入英文單字（不分大小寫）' : '可輸入原文或羅馬拼音'),
        sf.form, feedback, nextWrap
      );
      focusEl = sf.input;
      cur = {};
    } else if (fmt === 'mc_kana') {
      // 假名認讀：題面只顯示假名（無漢字、無 romaji），作答後揭曉漢字（對錯皆顯示）
      kanjiLine = '漢字：' + card.text + readingPart;
      const mc = mcBlock('zh', card.zh, false);
      qCard = h('div', { class: 'card quiz-card' },
        h('p', { class: 'muted small' }, '讀假名，選出正確的中文意思'),
        h('p', { class: 'quiz-question' }, jpKana(card)),
        h('div', { class: 'opt-list' }, mc.optBtns),
        feedback, nextWrap
      );
      cur = { pick: mc.choose };
    } else { // mc_f2z（預設）
      const mc = mcBlock('zh', card.zh, false);
      qCard = h('div', { class: 'card quiz-card' },
        h('p', { class: 'muted small' }, '選出正確的中文意思'),
        h('p', { class: 'quiz-question' }, card.text),
        showReading ? h('p', { class: 'muted' }, card.reading) : null,
        h('div', { class: 'opt-list' }, mc.optBtns),
        feedback, nextWrap
      );
      cur = { pick: mc.choose };
    }

    area.replaceChildren(
      h('div', null,
        allMaint
          ? h('div', { class: 'maint-banner' }, '今日到期卡已清空 🎉 以下是熟練字的維持複習')
          : null,
        h('div', { class: 'flash-top' },
          backBtn(backHash, key === 'all' ? '返回首頁' : '返回'),
          h('div', { class: 'flash-meta' },
            card.maintenance ? h('span', { class: 'badge badge-maint' }, '維持複習') : null,
            h('span', { class: 'badge badge-box', style: 'background:' + cardColor },
              'Lv ' + (typeof card.lv === 'number' ? card.lv : 0)),
            h('span', { class: 'progress-text' }, (s.i + 1) + '/' + cards.length + '・答對 ' + s.correct)
          )
        ),
        h('h1', { class: 'flash-title', style: 'color:' + cardColor }, title),
        h('p', { class: 'center-text muted small' },
          formatName(fmt) + (card.verify ? '・驗證題' : '')),
        qCard
      )
    );
    if (fmt === 'listen_mc') speak(card.lang, card.text); // 進題自動播一次
    if (focusEl) focusEl.focus();
    t0 = performance.now(); // render 完成起算
  }

  renderQ();
}

/* ===================== 選擇題測驗 ===================== */

async function renderQuiz(seq, key) {
  loadingPage();
  let data;
  try { data = await loadLang(key); } catch (e) { if (!stale(seq)) errorPage('#/lang/' + key); return; }
  if (stale(seq)) return;
  const items = (data && data.items) || [];
  const color = langColor(key);
  const base = baseLang(key);

  const setup = { dir: 'f2z', count: 10 };

  function renderSetup() {
    function segBtn(label, on, fn) {
      return h('button', { type: 'button', class: 'seg-btn' + (on ? ' active' : ''), onclick: fn }, label);
    }
    setPage(
      backBtn('#/lang/' + key, '返回'),
      h('h1', { style: 'color:' + color }, '✅ 選擇題測驗'),
      h('div', { class: 'card setup-card' },
        h('h3', null, '出題方向'),
        h('div', { class: 'seg' },
          segBtn('外語 → 中文', setup.dir === 'f2z', () => { setup.dir = 'f2z'; renderSetup(); }),
          segBtn('中文 → 外語', setup.dir === 'z2f', () => { setup.dir = 'z2f'; renderSetup(); })
        ),
        h('h3', null, '題數'),
        h('div', { class: 'seg' },
          segBtn('10 題', setup.count === 10, () => { setup.count = 10; renderSetup(); }),
          segBtn('20 題', setup.count === 20, () => { setup.count = 20; renderSetup(); }),
          segBtn('全部（' + items.length + '）', setup.count === 0, () => { setup.count = 0; renderSetup(); })
        ),
        h('button', { type: 'button', class: 'btn btn-primary btn-big start-btn', onclick: startQuiz }, '開始測驗')
      )
    );
  }

  function startQuiz() {
    cleanup();
    const n = setup.count === 0 ? items.length : Math.min(setup.count, items.length);
    const qs = shuffle(items).slice(0, n);
    const s = { i: 0, correct: 0, locked: false, autoTimer: null };

    function renderEnd() {
      setPage(
        backBtn('#/lang/' + key, '返回'),
        h('div', { class: 'card center-card' },
          h('p', { class: 'big-emoji' }, s.correct === qs.length ? '💯' : '🏁'),
          h('h2', null, '測驗結束'),
          h('p', { class: 'result-num', style: 'color:' + color },
            '答對 ' + s.correct + '/' + qs.length + '（' + pct(s.correct, qs.length) + '）'),
          h('div', { class: 'btn-row' },
            h('button', { type: 'button', class: 'btn btn-primary', onclick: renderSetup }, '再測一次'),
            h('button', { type: 'button', class: 'btn btn-ghost', onclick: () => go('#/lang/' + key) }, '返回')
          )
        )
      );
    }

    function renderQ() {
      if (s.i >= qs.length) { renderEnd(); return; }
      s.locked = false;
      const item = qs[s.i];
      const qField = setup.dir === 'f2z' ? 'text' : 'zh';
      const aField = setup.dir === 'f2z' ? 'zh' : 'text';
      const options = buildMcOptions(item, items, aField);
      const feedback = h('div', { class: 'quiz-feedback' });
      const nextBtnWrap = h('div', { class: 'btn-row' });

      function goNext() {
        if (s.autoTimer) { clearTimeout(s.autoTimer); s.autoTimer = null; }
        s.i++;
        renderQ();
      }

      const optBtns = options.map(opt => {
        const btn = h('button', { type: 'button', class: 'btn opt-btn' }, opt[aField]);
        btn.addEventListener('click', () => {
          if (s.locked) return;
          s.locked = true;
          const ok = opt === item;
          if (ok) s.correct++;
          for (const b of optBtns) {
            b.disabled = true;
            if (b === btn && !ok) b.classList.add('opt-wrong');
          }
          const rightBtn = optBtns[options.indexOf(item)];
          rightBtn.classList.add('opt-correct');
          const ansLine = setup.dir === 'z2f' && item.reading
            ? item.text + '（' + item.reading + '）' : item[aField];
          feedback.append(...[
            h('p', { class: ok ? 'fb-ok' : 'fb-no' }, ok ? '✔ 答對了！' : '✘ 答錯了'),
            h('p', { class: 'fb-ans' }, '正解：' + ansLine),
            item.note ? h('p', { class: 'fb-note muted' }, '💡 ' + item.note) : null
          ].filter(Boolean));
          nextBtnWrap.append(
            h('button', { type: 'button', class: 'btn btn-primary', onclick: goNext }, '下一題')
          );
          postAnswerQuiet(key, item.text, ok,
            ok ? null : { picked: opt[aField], picked_field: aField }); // 錯誤導向：記下所選干擾項
          if (ok) s.autoTimer = addTimer(goNext, 1000);
        });
        return btn;
      });

      setPage(
        h('div', { class: 'flash-top' },
          backBtn('#/lang/' + key, '返回'),
          h('span', { class: 'progress-text' }, '第 ' + (s.i + 1) + '/' + qs.length + ' 題・答對 ' + s.correct)
        ),
        h('div', { class: 'card quiz-card' },
          h('p', { class: 'muted small' }, setup.dir === 'f2z' ? '選出正確的中文意思' : '選出正確的外語'),
          h('p', { class: 'quiz-question' }, item[qField]),
          (setup.dir === 'f2z' && item.reading && (base === 'japanese' || base === 'korean'))
            ? h('p', { class: 'muted' }, item.reading) : null,
          h('div', { class: 'opt-list' }, optBtns),
          feedback,
          nextBtnWrap
        )
      );
    }

    renderQ();
  }

  if (items.length < 4) {
    setPage(backBtn('#/lang/' + key, '返回'),
      h('div', { class: 'card center-card' }, h('p', null, '單字數不足，無法出題。')));
    return;
  }
  renderSetup();
}

/* ===================== 拼寫練習 ===================== */

/** 取得可接受答案（正規化後）：原文、reading、reading 的羅馬拼音／原文部分 */
function spellCandidates(item) {
  const cands = [item.text];
  if (item.reading) {
    cands.push(item.reading);
    const romaji = String(item.reading).replace(/[^\x20-\x7E]/g, '');
    if (romaji.trim()) cands.push(romaji);
    const native = String(item.reading).replace(/[\x21-\x7E]/g, '');
    if (native.trim()) cands.push(native);
  }
  return cands.map(normAns).filter(Boolean);
}

function romajiFirstLetter(item) {
  const romaji = String(item.reading || '').replace(/[^A-Za-z]/g, '');
  return romaji ? romaji[0] : '';
}

async function renderSpell(seq, key) {
  loadingPage();
  let data;
  try { data = await loadLang(key); } catch (e) { if (!stale(seq)) errorPage('#/lang/' + key); return; }
  if (stale(seq)) return;
  const items = (data && data.items) || [];
  const color = langColor(key);
  const base = baseLang(key);
  const isEnglish = base === 'english';

  function startRound() {
    cleanup();
    const round = shuffle(items).slice(0, Math.min(10, items.length));
    const s = { i: 0, correct: 0, locked: false };

    function renderEnd() {
      setPage(
        backBtn('#/lang/' + key, '返回'),
        h('div', { class: 'card center-card' },
          h('p', { class: 'big-emoji' }, s.correct === round.length ? '💯' : '🏁'),
          h('h2', null, '拼寫練習結束'),
          h('p', { class: 'result-num', style: 'color:' + color },
            '答對 ' + s.correct + '/' + round.length + '（' + pct(s.correct, round.length) + '）'),
          h('div', { class: 'btn-row' },
            h('button', { type: 'button', class: 'btn btn-primary', onclick: startRound }, '再來一輪'),
            h('button', { type: 'button', class: 'btn btn-ghost', onclick: () => go('#/lang/' + key) }, '返回')
          )
        )
      );
    }

    function checkInput(item, raw) {
      if (isEnglish) {
        return raw.trim().toLowerCase() === String(item.text).trim().toLowerCase();
      }
      const n = normAns(raw);
      return n !== '' && spellCandidates(item).indexOf(n) !== -1;
    }

    function renderQ() {
      if (s.i >= round.length) { renderEnd(); return; }
      s.locked = false;
      const item = round[s.i];
      const input = h('input', {
        type: 'text', class: 'spell-input', autocomplete: 'off',
        autocapitalize: 'off', spellcheck: 'false', placeholder: '輸入答案後按 Enter'
      });
      const feedback = h('div', { class: 'quiz-feedback' });
      const nextWrap = h('div', { class: 'btn-row' });

      let advanced = false;
      function goNext() {
        if (advanced) return;
        advanced = true;
        s.i++;
        renderQ();
      }

      function reveal(ok) {
        s.locked = true;
        input.disabled = true;
        if (ok) s.correct++;
        const readingPart = item.reading ? '（' + item.reading + '）' : '';
        feedback.replaceChildren(
          h('p', { class: ok ? 'fb-ok' : 'fb-no' }, ok ? '✔ 答對了！' : '✘ 不對喔'),
          h('p', { class: 'fb-ans' }, '答案：' + item.text + readingPart),
          item.note ? h('p', { class: 'fb-note muted' }, '💡 ' + item.note) : null
        );
        nextWrap.replaceChildren(
          speakBtn(key, item.text),
          h('button', { type: 'button', class: 'btn btn-primary', onclick: goNext }, '下一題')
        );
        postAnswerQuiet(key, item.text, ok);
        if (ok) addTimer(goNext, 1200);
      }

      const form = h('form', { class: 'spell-form' },
        input,
        h('button', { type: 'button', class: 'btn btn-ghost', onclick: () => {
          if (s.locked) return;
          let hint = '提示：首字是「' + String(item.text)[0] + '」';
          if (!isEnglish) {
            const r = romajiFirstLetter(item);
            if (r) hint += '，羅馬拼音以「' + r + '」開頭';
          }
          feedback.replaceChildren(h('p', { class: 'fb-hint' }, hint));
        } }, '提示'),
        h('button', { type: 'submit', class: 'btn btn-primary' }, '送出')
      );
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (s.locked) return;
        reveal(checkInput(item, input.value));
      });
      // IME（注音／日文輸入法）選字時按 Enter 不送出
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.isComposing || e.keyCode === 229)) e.preventDefault();
      });

      setPage(
        h('div', { class: 'flash-top' },
          backBtn('#/lang/' + key, '返回'),
          h('span', { class: 'progress-text' }, '第 ' + (s.i + 1) + '/' + round.length + ' 題・答對 ' + s.correct)
        ),
        h('div', { class: 'card quiz-card' },
          h('h1', { class: 'inline-title', style: 'color:' + color }, '⌨️ 拼寫練習'),
          h('p', null, h('span', { class: 'chip chip-static' }, item.topic || '一般')),
          h('p', { class: 'quiz-question' }, item.zh),
          h('p', { class: 'muted small' },
            isEnglish ? '請輸入英文單字（不分大小寫）' : '可輸入原文或羅馬拼音'),
          form,
          feedback,
          nextWrap
        )
      );
      input.focus();
    }

    renderQ();
  }

  if (items.length === 0) {
    setPage(backBtn('#/lang/' + key, '返回'),
      h('div', { class: 'card center-card' }, h('p', null, '目前沒有單字資料。')));
    return;
  }
  startRound();
}

/* ===================== 字母練習 ===================== */

async function renderAlphabet(seq, key) {
  loadingPage();
  let data;
  try { data = await loadLang(key); } catch (e) { if (!stale(seq)) errorPage('#/lang/' + key); return; }
  if (stale(seq)) return;
  const alphabet = (data && data.alphabet) || [];
  const color = langColor(key);

  if (alphabet.length === 0) {
    setPage(backBtn('#/lang/' + key, '返回'),
      h('div', { class: 'card center-card' }, h('p', null, '此語言沒有字母資料。')));
    return;
  }

  const groups = [];
  for (const a of alphabet) {
    if (groups.indexOf(a.group) === -1) groups.push(a.group);
  }
  const groupName = (g) => GROUP_NAME[g] || g;

  const ui = { tab: 'table', mode: 'A', activeGroups: new Set(groups) };

  function renderTabs() {
    return h('div', { class: 'seg tab-seg' },
      h('button', { type: 'button', class: 'seg-btn' + (ui.tab === 'table' ? ' active' : ''),
        onclick: () => { ui.tab = 'table'; render(); } }, '總表'),

        onclick: () => { ui.tab = 'practice'; render(); } }, '練習')
    );
  }

  /* ---- 總表 ---- */
  function renderTable() {
    const sections = groups.map(g => {
      const cells = alphabet.filter(a => a.group === g).map(a =>
        h('button', {
          type: 'button', class: 'alpha-cell', title: '點擊發音',
          onclick: () => speak(key, a.char)
        },
          h('span', { class: 'alpha-char' }, a.char),
          h('span', { class: 'alpha-roman muted' }, a.roman)
        ));
      return h('section', { class: 'alpha-section' },
        h('h3', { style: 'color:' + color }, groupName(g)),
        h('div', { class: 'alpha-grid' }, cells)
      );
    });
    setPage(
      backBtn('#/lang/' + key, '返回'),
      h('h1', { style: 'color:' + color }, '🔤 字母練習'),
      renderTabs(),
      h('p', { class: 'muted small' }, '點任一格可發音'),
      sections
    );
  }

  /* ---- 練習 ---- */
  function renderPractice() {
    const chips = groups.map(g =>
      h('button', {
        type: 'button',
        class: 'chip' + (ui.activeGroups.has(g) ? ' on' : ''),
        onclick: () => {
          if (ui.activeGroups.has(g)) {
            if (ui.activeGroups.size > 1) ui.activeGroups.delete(g);
          } else {
            ui.activeGroups.add(g);
          }
          render();
        }
      }, groupName(g)));

    const modeSeg = h('div', { class: 'seg' },
      h('button', { type: 'button', class: 'seg-btn' + (ui.mode === 'A' ? ' active' : ''),
        onclick: () => { ui.mode = 'A'; render(); } }, '模式 A：看字母拼羅馬音'),

    );

    const quizArea = h('div', null);

    function renderEnd() {

        h('div', { class: 'card center-card' },
          h('p', { class: 'big-emoji' }, s.correct === round.length ? '💯' : '🏁'),
          h('p', { class: 'result-num', style: 'color:' + color },
            '答對 ' + s.correct + '/' + round.length + '（' + pct(s.correct, round.length) + '）'),
          h('button', { type: 'button', class: 'btn btn-primary', onclick: render }, '再來一輪')
        )
      );

        feedback.replaceChildren(
          h('p', { class: ok ? 'fb-ok' : 'fb-no' }, ok ? '✔ 答對了！' : '✘ 答錯了'),

        );
        nextWrap.replaceChildren(
          h('button', { type: 'button', class: 'btn btn-primary', onclick: goNext }, '下一題')
        );
        postAnswerQuiet(key, a.char, ok);
        if (ok) addTimer(goNext, 1000);
      }

        const input = h('input', {
          type: 'text', class: 'spell-input', autocomplete: 'off',
          autocapitalize: 'off', spellcheck: 'false', placeholder: '輸入羅馬拼音'
        });
        const form = h('form', { class: 'spell-form' },
          input,
          h('button', { type: 'submit', class: 'btn btn-primary' }, '送出')
        );
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          if (s.locked) return;
          const val = normAns(input.value);
          const ok = val !== '' && String(a.roman).split('/').map(normAns).indexOf(val) !== -1;
          input.disabled = true;
          finish(ok, true);
        });
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && (e.isComposing || e.keyCode === 229)) e.preventDefault();
        });
        quizArea.replaceChildren(
          h('div', { class: 'card quiz-card' },
            progress,
            h('button', { type: 'button', class: 'alpha-big', title: '點擊發音', onclick: () => speak(key, a.char) }, a.char),
            h('p', { class: 'muted small' }, '請輸入這個字母的羅馬拼音（點字母可發音）'),
            form, feedback, nextWrap
          )
        );
        input.focus();
      } else {
        // 模式 B：干擾項排除相同 roman 的字母
        const seen = new Set([a.roman]);
        const distractors = [];
        for (const cand of shuffle(pool.concat(alphabet))) {
          if (distractors.length >= 3) break;
          if (cand.char === a.char || seen.has(cand.roman)) continue;
          seen.add(cand.roman);
          distractors.push(cand);
        }
        const options = shuffle([a].concat(distractors));
        const optBtns = options.map(opt => {
          const btn = h('button', { type: 'button', class: 'btn opt-btn alpha-opt' }, opt.char);
          btn.addEventListener('click', () => {
            if (s.locked) return;
            const ok = opt === a;
            for (const b of optBtns) b.disabled = true;
            optBtns[options.indexOf(a)].classList.add('opt-correct');
            if (!ok) btn.classList.add('opt-wrong');
            speak(key, a.char);
            finish(ok, true);
          });
          return btn;
        });
        quizArea.replaceChildren(
          h('div', { class: 'card quiz-card' },
            progress,
            h('p', { class: 'quiz-question' }, a.roman),
            h('p', { class: 'muted small' }, '選出對應的字母'),
            h('div', { class: 'opt-list alpha-opt-list' }, optBtns),
            feedback, nextWrap
          )
        );
      }
    }

    setPage(
      backBtn('#/lang/' + key, '返回'),
      h('h1', { style: 'color:' + color }, '🔤 字母練習'),
      renderTabs(),
      modeSeg,
      h('div', { class: 'chip-row' }, chips),
      quizArea
    );
    renderQ();
  }

  function render() {
    cleanup();
    if (ui.tab === 'table') renderTable();
    else renderPractice();
  }

  render();
}

/* ===================== 文法測驗 ===================== */

async function renderGrammar(seq, key) {
  loadingPage();
  let data;
  try { data = await loadLang(key); } catch (e) { if (!stale(seq)) errorPage('#/lang/' + key); return; }
  if (stale(seq)) return;
  const grammar = (data && data.grammar) || [];
  const color = langColor(key);

  if (grammar.length === 0) {
    setPage(backBtn('#/lang/' + key, '返回'),
      h('div', { class: 'card center-card' }, h('p', null, '此語言沒有文法題目。')));
    return;
  }

  function startRound() {
    cleanup();
    const qs = shuffle(grammar);
    const s = { i: 0, correct: 0, locked: false };
    const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];

    function renderEnd() {
      setPage(
        backBtn('#/lang/' + key, '返回'),
        h('div', { class: 'card center-card' },
          h('p', { class: 'big-emoji' }, s.correct === qs.length ? '💯' : '🏁'),
          h('h2', null, '文法測驗結束'),
          h('p', { class: 'result-num', style: 'color:' + color },
            '答對 ' + s.correct + '/' + qs.length + '（' + pct(s.correct, qs.length) + '）'),
          h('div', { class: 'btn-row' },
            h('button', { type: 'button', class: 'btn btn-primary', onclick: startRound }, '再測一次'),
            h('button', { type: 'button', class: 'btn btn-ghost', onclick: () => go('#/lang/' + key) }, '返回')
          )
        )
      );
    }

    function renderQ() {
      if (s.i >= qs.length) { renderEnd(); return; }
      s.locked = false;
      const q = qs[s.i];
      const feedback = h('div', { class: 'quiz-feedback' });
      const nextWrap = h('div', { class: 'btn-row' });

      const optBtns = (q.options || []).map((opt, idx) => {
        const btn = h('button', { type: 'button', class: 'btn opt-btn' },
          '(' + (LETTERS[idx] || idx + 1) + ') ' + opt);
        btn.addEventListener('click', () => {
          if (s.locked) return;
          s.locked = true;
          const ok = idx === q.answer;
          if (ok) s.correct++;
          for (const b of optBtns) b.disabled = true;
          if (optBtns[q.answer]) optBtns[q.answer].classList.add('opt-correct');
          if (!ok) btn.classList.add('opt-wrong');
          feedback.replaceChildren(
            h('p', { class: ok ? 'fb-ok' : 'fb-no' }, ok ? '✔ 答對了！' : '✘ 答錯了'),
            q.explain_zh ? h('div', { class: 'explain-box' },
              h('p', { class: 'fb-ans' }, '詳解'),
              h('p', null, q.explain_zh)) : null
          );
          nextWrap.replaceChildren(
            h('button', { type: 'button', class: 'btn btn-primary', onclick: () => { s.i++; renderQ(); } }, '下一題')
          );
          postAnswerQuiet(key, q.question, ok);
        });
        return btn;
      });

      setPage(
        h('div', { class: 'flash-top' },
          backBtn('#/lang/' + key, '返回'),
          h('span', { class: 'progress-text' }, '第 ' + (s.i + 1) + '/' + qs.length + ' 題・答對 ' + s.correct)
        ),
        h('div', { class: 'card quiz-card' },
          h('h1', { class: 'inline-title', style: 'color:' + color }, '📘 文法測驗'),
          h('p', { class: 'quiz-question grammar-q' }, q.question),
          h('div', { class: 'opt-list' }, optBtns),
          feedback,
          nextWrap
        )
      );
    }

    renderQ();
  }

  startRound();
}

/* ===================== 單字總表 ===================== */

async function renderList(seq, key) {
  loadingPage();
  let data;
  try { data = await loadLang(key); } catch (e) { if (!stale(seq)) errorPage('#/lang/' + key); return; }
  if (stale(seq)) return;
  const items = (data && data.items) || [];
  const color = langColor(key);

  const topics = [];
  for (const it of items) {
    if (it.topic && topics.indexOf(it.topic) === -1) topics.push(it.topic);
  }

  const ui = { q: '', topic: '' };
  const tbody = h('tbody', null);

  function matches(it) {
    if (ui.topic && it.topic !== ui.topic) return false;
    if (!ui.q) return true;
    const q = ui.q.toLowerCase();
    return ['text', 'reading', 'zh'].some(f =>
      String(it[f] || '').toLowerCase().indexOf(q) !== -1);
  }

  function renderRows() {
    const rows = [];
    let count = 0;
    for (const it of items) {
      if (!matches(it)) continue;
      count++;
      const casualLn = casualLineText(it); // 口語版一行（無 casual 欄位時不顯示）
      const detail = h('tr', { class: 'detail-row', hidden: true },
        h('td', { colspan: 5 },
          h('div', { class: 'detail-box' },
            it.example ? h('p', { class: 'detail-example' }, it.example) : null,
            it.example_zh ? h('p', { class: 'muted' }, it.example_zh) : null,
            it.note ? h('p', { class: 'fb-note' }, '💡 ' + it.note) : null,
            casualLn ? h('p', { class: 'detail-casual' }, casualLn) : null,
            (!it.example && !it.note && !casualLn) ? h('p', { class: 'muted' }, '（無例句與備註）') : null
          )
        )
      );
      const row = h('tr', { class: 'word-row', title: '點擊展開例句' },
        h('td', { class: 'td-text' }, it.text),
        h('td', { class: 'td-reading muted' }, it.reading || ''),
        h('td', null, it.zh),
        h('td', null, h('span', { class: 'chip chip-static' }, it.topic || '')),
        h('td', { class: 'td-speak' }, speakBtn(key, it.text))
      );
      row.addEventListener('click', () => { detail.hidden = !detail.hidden; });
      rows.push(row, detail);
    }
    tbody.replaceChildren(...rows);
    countLabel.textContent = '共 ' + count + ' 筆';
  }

  const searchInput = h('input', {
    type: 'search', class: 'search-input', placeholder: '搜尋單字／讀音／中文…',
    'aria-label': '搜尋單字'
  });
  searchInput.addEventListener('input', () => { ui.q = searchInput.value.trim(); renderRows(); });

  const chipRow = h('div', { class: 'chip-row' });
  function renderChips() {
    const mk = (label, val) => {
      const chip = h('button', {
        type: 'button', class: 'chip' + (ui.topic === val ? ' on' : ''),
        onclick: () => { ui.topic = val; renderChips(); renderRows(); }
      }, label);
      return chip;
    };
    chipRow.replaceChildren(mk('全部', ''), ...topics.map(t => mk(t, t)));
  }

  const countLabel = h('span', { class: 'muted small' }, '');

  setPage(
    backBtn('#/lang/' + key, '返回'),
    h('h1', { style: 'color:' + color }, '📋 單字總表'),
    h('div', { class: 'card list-card' },
      h('div', { class: 'list-tools' }, searchInput, countLabel),
      chipRow,
      h('div', { class: 'table-wrap' },
        h('table', { class: 'word-table' },
          h('thead', null, h('tr', null,
            h('th', null, '單字'), h('th', null, '讀音'), h('th', null, '中文'),
            h('th', null, '主題'), h('th', null, '發音'))),
          tbody
        )
      )
    )
  );
  renderChips();
  renderRows();
}

/* ===================== 統計頁 ===================== */

async function renderStats(seq) {
  loadingPage();
  let st;
  let ins = null;
  try {
    const results = await Promise.all([
      loadState(true),
      api('/api/insights').catch(() => null) // 後端尚未支援時安靜略過
    ]);
    st = results[0];
    ins = results[1];
  } catch (e) { if (!stale(seq)) errorPage('#/home'); return; }
  if (stale(seq)) return;

  const today = st.today || { answered: 0, correct: 0 };
  const total = st.total || { answered: 0, correct: 0 };

  const tiles = h('div', { class: 'tile-row tile-row-4' },
    h('div', { class: 'card tile' },
      h('p', { class: 'tile-num' }, '🔥 ' + (st.streak || 0)),
      h('p', { class: 'tile-label' }, '連續學習天數')),
    h('div', { class: 'card tile' },
      h('p', { class: 'tile-num' }, (today.answered || 0) + ' 題'),
      h('p', { class: 'tile-label' }, '今日答題（答對 ' + (today.correct || 0) + '）')),
    h('div', { class: 'card tile' },
      h('p', { class: 'tile-num' }, (total.answered || 0) + ' 題'),
      h('p', { class: 'tile-label' }, '累計答題')),
    h('div', { class: 'card tile' },
      h('p', { class: 'tile-num' }, pct(total.correct || 0, total.answered || 0)),
      h('p', { class: 'tile-label' }, '累計正確率'))
  );

  const langBlocks = (st.languages || []).map(l => {
    const color = langColor(l.key);
    const itemsCount = l.items_count || 0;
    const due = Math.min(l.due_count || 0, itemsCount);
    const fresh = Math.min(l.new_count || 0, itemsCount);
    const learning = Math.max(itemsCount - fresh - due, 0);
    const w = (n) => itemsCount ? (n / itemsCount * 100) : 0;

    const bar = itemsCount
      ? h('div', { class: 'bar-track' },
          due > 0 ? h('div', { class: 'bar-seg', style: 'width:' + w(due) + '%;background:' + color }) : null,
          learning > 0 ? h('div', { class: 'bar-seg', style: 'width:' + w(learning) + '%;background:' + langSoft(l.key) }) : null,
          fresh > 0 ? h('div', { class: 'bar-seg', style: 'width:' + w(fresh) + '%;background:var(--chart-rest)' }) : null)
      : null;

    const legend = h('div', { class: 'legend' },
      h('span', { class: 'legend-item' },
        h('span', { class: 'dot', style: 'background:' + color }), '今日到期 ' + due),
      h('span', { class: 'legend-item' },
        h('span', { class: 'dot', style: 'background:' + langSoft(l.key) }), '學習中 ' + learning),
      h('span', { class: 'legend-item' },
        h('span', { class: 'dot', style: 'background:var(--chart-rest)' }), '新卡 ' + fresh)
    );

    const counts = ['單字 ' + itemsCount, '文法 ' + (l.grammar_count || 0)];
    if (l.alphabet_count > 0) counts.push('字母 ' + l.alphabet_count);

    return h('div', { class: 'card stats-lang-card' },
      h('div', { class: 'lang-bar', style: 'background:' + color }),
      h('div', { class: 'stats-lang-body' },
        h('div', { class: 'lang-card-top' },
          h('h3', { style: 'color:' + color }, l.display_name_zh || l.key),
          h('span', { class: 'badge badge-due' }, '到期 ' + due)
        ),
        h('p', { class: 'muted small' }, counts.join('・')),
        bar,
        legend,
        h('button', { type: 'button', class: 'btn btn-lang', style: 'background:' + color,
          onclick: () => go('#/lang/' + l.key) }, '前往學習')
      )
    );
  });

  // ---- 智慧練習洞察（/api/insights，後端未就緒時不顯示） ----
  const insightNodes = [];
  if (ins) {
    const daily = ins.daily7 || [];
    if (daily.length) {
      const maxA = Math.max(1, ...daily.map(d => d.answered || 0));
      const cols = daily.map(d => {
        const a = d.answered || 0;
        const c = Math.min(d.correct || 0, a);
        const hPx = a > 0 ? Math.max(8, Math.round(a / maxA * 80)) : 4;
        const fillPct = a > 0 ? Math.round(c / a * 100) : 0;
        return h('div', { class: 'mini-col', title: (d.date || '') + '：答 ' + a + '・對 ' + c },
          h('span', { class: 'mini-num muted' }, String(a)),
          h('div', { class: 'mini-bar', style: 'height:' + hPx + 'px' },
            h('div', { class: 'mini-fill', style: 'height:' + fillPct + '%' })
          ),
          h('span', { class: 'mini-date muted' }, String(d.date || '').slice(5)),
          h('span', { class: 'mini-pct muted' }, a > 0 ? pct(c, a) : '—')
        );
      });
      insightNodes.push(
        h('div', { class: 'card daily-card' },
          h('h3', { class: 'insight-title' }, '近 7 天答題量與正確率'),
          h('div', { class: 'mini-chart' }, cols),
          h('p', { class: 'muted small' }, '長條高度＝答題量，深色部分＝答對比例')
        )
      );
    }

    const langIns = (ins.languages || []).map(L => {
      const c = langColor(L.key);
      const dist = (L.lv_dist || []).slice(0, 6);
      while (dist.length < 6) dist.push(0);
      const maxLv = Math.max(1, ...dist);
      const lvRows = dist.map((n, i) =>
        h('div', { class: 'lv-row' },
          h('span', { class: 'lv-label muted small' }, 'L' + i),
          h('div', { class: 'lv-track' },
            n > 0 ? h('div', { class: 'lv-fill', style: 'width:' + Math.round(n / maxLv * 100) + '%;background:' + c }) : null
          ),
          h('span', { class: 'lv-count muted small' }, String(n))
        ));

      const avg = L.avg_ms || {};
      const avgKeys = Object.keys(avg);
      const avgChips = avgKeys.map(k =>
        h('span', { class: 'chip chip-static' }, formatName(k) + ' ' + (avg[k] / 1000).toFixed(1) + ' 秒'));

      const weak = L.weak || [];
      const weakBlock = weak.length
        ? h('div', { class: 'table-wrap' },
            h('table', { class: 'word-table weak-table' },
              h('thead', null, h('tr', null,
                h('th', null, '單字'), h('th', null, '中文'),
                h('th', null, '掌握度'), h('th', null, '答錯'))),
              h('tbody', null, weak.map(w => h('tr', null,
                h('td', { class: 'td-text' }, w.text),
                h('td', null, w.zh),
                h('td', null, 'L' + (w.lv || 0)),
                h('td', null, (w.wrong || 0) + ' 次')
              )))
            ))
        : h('p', { class: 'muted small' }, '目前沒有明顯弱點 🎉');

      return h('div', { class: 'card insight-card' },
        h('div', { class: 'lang-bar', style: 'background:' + c }),
        h('div', { class: 'insight-body' },
          h('h3', { style: 'color:' + c }, L.display_name_zh || L.key),
          h('h4', { class: 'insight-sub' }, '掌握度分布（L0–L5）'),
          h('div', { class: 'lv-dist' }, lvRows),
          h('h4', { class: 'insight-sub' }, '各題型平均反應'),
          avgKeys.length
            ? h('div', { class: 'chip-row' }, avgChips)
            : h('p', { class: 'muted small' }, '尚無作答資料'),
          h('h4', { class: 'insight-sub' }, '弱點單字'),
          weakBlock
        )
      );
    });
    if (langIns.length) insightNodes.push(h('div', { class: 'insight-grid' }, langIns));
  }

  setPage(
    h('h1', null, '📊 學習統計'),
    tiles,
    h('h2', { class: 'section-title' }, '各語言進度'),
    h('div', { class: 'lang-grid' }, langBlocks),
    insightNodes.length ? h('h2', { class: 'section-title' }, '⚡ 智慧練習洞察') : null,
    insightNodes
  );
}

/* ===================== 備份檔還原（P0：進度防丟失） ===================== */

const BACKUP_APP_MARK = 'language-learning-backup';

/** 讀入備份檔文字並還原。完整備份＝驗證後整機還原；單人進度＝匯入目前設定檔。
 *  任何驗證不通過都不寫入任何資料。opt = { fromWelcome, onNeedProfile } */
async function restoreFromText(text, opt) {
  opt = opt || {};
  const isObj = v => typeof v === 'object' && v !== null && !Array.isArray(v);
  let raw;
  try { raw = JSON.parse(String(text || '')); }
  catch (e) { showToast('還原失敗：不是有效的 JSON 格式。'); return; }
  if (!isObj(raw)) { showToast('還原失敗：備份檔必須是 JSON 物件。'); return; }

  if (raw.app === BACKUP_APP_MARK) {
    /* —— 完整備份：先全部驗證，再一次寫回 —— */
    if (raw.version !== 1) { showToast('還原失敗：不支援的備份版本。'); return; }
    if (!isObj(raw.profiles) || !Array.isArray(raw.profiles.list) ||
        raw.profiles.list.length === 0) {
      showToast('還原失敗：備份檔缺少使用者清單。'); return;
    }
    for (const n of raw.profiles.list) {
      if (typeof n !== 'string' || n.trim() === '') {
        showToast('還原失敗：使用者清單格式不正確。'); return;
      }
    }
    if (new Set(raw.profiles.list).size !== raw.profiles.list.length) {
      showToast('還原失敗：使用者清單有重複名字。'); return;
    }
    if (raw.progresses !== undefined && !isObj(raw.progresses)) {
      showToast('還原失敗：progresses 欄位格式不正確。'); return;
    }
    const list = raw.profiles.list.slice();
    const progs = isObj(raw.progresses) ? raw.progresses : {};
    // 用拋棄式引擎逐一驗證每份進度（重用既有 importProgress 驗證，零寫入）
    const tmp = createEngine(DATA, { get: () => null, set: () => {} });
    for (const name of list) {
      const p = progs[name];
      if (p === undefined || p === null) continue;
      try { await tmp.importProgress(JSON.stringify(p)); }
      catch (e) { showToast('還原失敗：使用者「' + name + '」的進度資料不正確。'); return; }
    }
    const current = (typeof raw.profiles.current === 'string' &&
                     list.indexOf(raw.profiles.current) !== -1)
      ? raw.profiles.current : list[0];
    // 整機還原＝裝置狀態等於備份：先清掉「現有但不在備份內」設定檔的進度 key，
    // 避免日後建立同名設定檔時默默繼承孤兒進度
    for (const name of profiles.list()) {
      if (list.indexOf(name) === -1) store.remove(profiles.progressKey(name));
    }
    store.set('ll-profiles', JSON.stringify({ list: list, current: current }));
    for (const name of list) {
      if (isObj(progs[name])) store.set(profiles.progressKey(name), JSON.stringify(progs[name]));
      else store.remove(profiles.progressKey(name));
    }
    showToast('已還原 ' + list.length + ' 位使用者的進度', 'ok');
    reloadForProfile();
    return;
  }

  if (raw.languages !== undefined || raw.daily !== undefined) {
    /* —— 單人進度格式（與 Mac 版 data/progress.json 相同）—— */
    if (!profiles.current()) {
      // 尚無設定檔：先用拋棄式引擎驗證，通過後引導建立名字再匯入
      try {
        await createEngine(DATA, { get: () => null, set: () => {} }).importProgress(String(text));
      } catch (e) {
        showToast(e && e.message ? e.message : '還原失敗：進度檔格式不正確。');
        return;
      }
      if (opt.onNeedProfile) opt.onNeedProfile(String(text));
      else showToast('請先建立設定檔，再匯入單人進度檔');
      return;
    }
    if (!engine) buildEngine();
    let res;
    try { res = await engine.importProgress(String(text)); }
    catch (e) { showToast(e && e.message ? e.message : '匯入失敗'); return; }
    if (res && res.state) state.app = res.state;
    showToast('已將備份匯入設定檔「' + profiles.current() + '」', 'ok');
    if (opt.fromWelcome) reloadForProfile(); else onRoute();
    return;
  }

  showToast('還原失敗：無法辨識的備份檔格式。');
}

/** 隱藏的 file input + 「從備份檔還原」按鈕（歡迎頁與資料頁共用） */
function restoreControl(opt) {
  const input = h('input', {
    type: 'file', accept: '.json,application/json',
    style: 'display:none', 'aria-label': '選擇備份檔'
  });
  input.addEventListener('change', () => {
    const f = (input.files && input.files[0]) || null;
    try { input.value = ''; } catch (e) { /* 忽略 */ }
    if (!f) return;
    if (typeof FileReader === 'undefined') { showToast('此瀏覽器不支援讀取檔案'); return; }
    const reader = new FileReader();
    reader.onload = () => { restoreFromText(reader.result, opt); };
    reader.onerror = () => showToast('讀取檔案失敗，請再試一次');
    reader.readAsText(f);
  });
  const btn = h('button', {
    type: 'button', class: 'btn btn-ghost', onclick: () => input.click()
  }, '📂 從備份檔還原');
  return { input: input, btn: btn };
}

/* ===================== 資料頁（設定檔／匯出／匯入／重置／關於） ===================== */

async function renderData(seq) {
  loadingPage();
  let exported = '';
  try { exported = await engine.exportProgress(); } catch (e) { exported = ''; }
  if (stale(seq)) return;

  /* ---- 設定檔 ---- */
  const curName = profiles.current();
  const allNames = profiles.list();

  function delBtnFor(name) {
    let armed = false;
    let disarmId = null;
    const b = h('button', { type: 'button', class: 'btn btn-ghost profile-del' }, '刪除');
    b.addEventListener('click', () => {
      if (!armed) {
        armed = true;
        b.textContent = '確定刪除？';
        b.classList.remove('btn-ghost');
        b.classList.add('btn-bad');
        disarmId = addTimer(() => {
          armed = false;
          b.textContent = '刪除';
          b.classList.add('btn-ghost');
          b.classList.remove('btn-bad');
        }, 4000);
        return;
      }
      if (disarmId) clearTimeout(disarmId);
      try {
        profiles.remove(name);
      } catch (e) {
        showToast(e && e.message ? e.message : '刪除失敗');
        return;
      }
      showToast('已刪除設定檔「' + name + '」', 'ok');
      if (name === curName) reloadForProfile(); // 刪掉目前使用者：切到剩下的第一個並回首頁
      else onRoute();                           // 其他設定檔：留在本頁重新渲染
    });
    return b;
  }

  const switchRows = allNames.map(name => {
    const isCur = name === curName;
    return h('div', { class: 'profile-row' },
      h('button', {
        type: 'button',
        class: 'btn profile-pick' + (isCur ? ' btn-primary' : ''),
        disabled: isCur,
        onclick: () => {
          try {
            profiles.switchTo(name);
          } catch (e) {
            showToast(e && e.message ? e.message : '切換失敗');
            return;
          }
          showToast('已切換為「' + name + '」', 'ok');
          reloadForProfile();
        }
      }, (isCur ? '✓ ' : '') + name + (isCur ? '（目前）' : '')),
      allNames.length > 1 ? delBtnFor(name) : null
    );
  });

  const addInput = h('input', {
    class: 'spell-input', type: 'text', maxlength: 12,
    placeholder: '新設定檔暱稱（1-12 字）', 'aria-label': '新設定檔暱稱'
  });

  function doAddProfile() {
    const v = profiles.validateName(addInput.value);
    if (!v.ok) { showToast(v.error); return; }
    try {
      profiles.create(v.name); // create 會一併切換為新設定檔
    } catch (e) {
      showToast(e && e.message ? e.message : '建立失敗');
      return;
    }
    showToast('已建立並切換為「' + v.name + '」', 'ok');
    reloadForProfile();
  }

  const addForm = h('form', {
    class: 'spell-form',
    onsubmit: (e) => { e.preventDefault(); doAddProfile(); }
  },
    addInput,
    h('button', { type: 'submit', class: 'btn btn-primary' }, '建立並切換')
  );

  const profileCard = h('div', { class: 'card data-card' },
    h('h3', null, '👤 設定檔'),
    h('p', { class: 'muted small' },
      '目前使用者：「' + curName + '」。同一支手機可多人使用，各設定檔進度完全分開；' +
      '下方的匯出／匯入／重置都只作用於目前設定檔。'),
    h('h4', { class: 'profile-sub' }, '切換'),
    h('div', { class: 'profile-list' }, switchRows),
    h('h4', { class: 'profile-sub' }, '新增'),
    addForm
  );

  /* ---- 備份進度（分享版主打：剪貼簿匯出）／從備份檔還原 ---- */
  const restoreCtl = restoreControl({ fromWelcome: false });

  const exportTa = h('textarea', {
    class: 'data-ta', rows: 8, readonly: true, 'aria-label': '目前進度 JSON'
  });
  exportTa.value = exported;

  async function copyExport() {
    let ok = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(exportTa.value);
        ok = true;
      }
    } catch (e) { ok = false; }
    if (!ok) {
      try {
        exportTa.focus();
        exportTa.select();
        ok = !!(document.execCommand && document.execCommand('copy'));
      } catch (e) { ok = false; }
    }
    if (ok) showToast('已複製進度 JSON，記得貼到備忘錄保存', 'ok');
    else showToast('複製失敗，請長按文字框手動複製');
  }

  const backupCard = h('div', { class: 'card data-card' },
    h('h3', null, '💾 備份進度'),
    h('p', { class: 'muted small' },
      '「' + curName + '」的完整進度 JSON 如下。點「匯出並複製」，複製後貼到備忘錄保存；' +
      'iOS 可能清掉 7 天未使用的網站資料，屆時把備忘錄裡的備份貼回下方「匯入進度」即可救回。'),
    exportTa,
    h('div', { class: 'btn-row' },
      h('button', {
        type: 'button', class: 'btn btn-primary btn-big',
        onclick: copyExport
      }, '📋 匯出並複製'),
      restoreCtl.btn),
    restoreCtl.input
  );

  /* ---- 匯入 ---- */
  const importTa = h('textarea', {
    class: 'data-ta', rows: 6, 'aria-label': '貼上進度 JSON',
    placeholder: '把 Mac 版 data/progress.json 的內容貼到這裡…'
  });

  async function doImport() {
    let res;
    try {
      res = await engine.importProgress(importTa.value);
    } catch (e) {
      showToast(e && e.message ? e.message : '匯入失敗');
      return;
    }
    if (res && res.state) state.app = res.state;
    showToast('匯入成功，進度已全部取代', 'ok');
    onRoute(); // 重新渲染本頁，匯出框同步更新
  }

  const importCard = h('div', { class: 'card data-card' },
    h('h3', null, '📥 匯入進度'),
    h('p', { class: 'muted small' },
      '貼上先前匯出的進度 JSON（或 Mac 版 data/progress.json 的內容），驗證通過後會「整份取代」設定檔「' + curName + '」目前的進度。'),
    importTa,
    h('div', { class: 'btn-row' },
      h('button', { type: 'button', class: 'btn btn-primary', onclick: doImport }, '驗證並匯入')
    )
  );

  /* ---- 重置（二次確認） ---- */
  let armed = false;
  let disarmId = null;
  const resetBtn = h('button', { type: 'button', class: 'btn btn-bad' }, '重置全部進度');
  resetBtn.addEventListener('click', async () => {
    if (!armed) {
      armed = true;
      resetBtn.textContent = '確定重置？再按一次';
      disarmId = addTimer(() => {
        armed = false;
        resetBtn.textContent = '重置全部進度';
      }, 4000);
      return;
    }
    if (disarmId) clearTimeout(disarmId);
    try {
      const res = await engine.resetProgress();
      if (res && res.state) state.app = res.state;
      showToast('已重置全部進度', 'ok');
      onRoute();
    } catch (e) {
      showToast('重置失敗');
    }
  });

  const resetCard = h('div', { class: 'card data-card' },
    h('h3', null, '🗑 重置進度'),
    h('p', { class: 'muted small' },
      '清空「' + curName + '」的所有卡片、每日統計與連續天數，回到全新狀態。此動作無法復原，請先匯出備份。'),
    h('div', { class: 'btn-row' }, resetBtn)
  );

  /* ---- 關於 ---- */
  const langLines = Object.keys(DATA).map(k => {
    const d = DATA[k] || {};
    const nLessons = (d.lessons || []).length;
    return (d.display_name_zh || k) + ' ' + ((d.items || []).length) + ' 字' +
      (nLessons ? '／' + nLessons + ' 課' : '');
  });
  const totalWords = Object.keys(DATA).reduce((sum, k) => sum + ((DATA[k].items || []).length), 0);
  const totalLessons = Object.keys(DATA).reduce((sum, k) => sum + ((DATA[k].lessons || []).length), 0);

  const aboutCard = h('div', { class: 'card data-card' },
    h('h3', null, 'ℹ️ 關於'),
    h('p', null, '語言學習小幫手・手機隨身版 v3・分享版（教學課程＋多人設定檔）'),
    h('p', { class: 'muted small' }, '分享版：用「匯出並複製」把進度貼到備忘錄保存備份。'),
    h('p', { class: 'muted small' }, '版本日期：' + VERSION_DATE),
    h('p', { class: 'muted small' },
      '收錄單字共 ' + totalWords + ' 個、教學課程共 ' + totalLessons + ' 課（' + langLines.join('・') + '）'),
    h('p', { class: 'muted small' },
      '各設定檔的進度分開儲存在此瀏覽器的 localStorage；清除瀏覽資料會一併清掉所有人的進度，記得定期匯出備份。')
  );

  setPage(
    h('h1', null, '💾 資料'),
    profileCard,
    backupCard,
    importCard,
    resetCard,
    aboutCard
  );
}

/* ===================== 歡迎頁（快速登入／建立設定檔／備份還原） ===================== */

function renderWelcome() {
  const names = profiles.list();
  const hasUsers = names.length > 0;
  let pendingImport = null; // 已驗證的單人進度檔，建立設定檔後自動匯入

  const input = h('input', {
    class: 'spell-input welcome-input', type: 'text', maxlength: 12,
    autocomplete: 'off', placeholder: '你的暱稱（1-12 字）', 'aria-label': '暱稱'
  });
  const errP = h('p', { class: 'welcome-err small', role: 'alert' }, '\u00A0');
  const noticeP = h('p', { class: 'muted small welcome-notice' },
    '先建立你的設定檔：同一支手機可以多人使用，每個人的進度完全分開。');

  function submit() {
    const v = profiles.validateName(input.value);
    if (!v.ok) {
      errP.textContent = v.error;
      input.focus();
      return;
    }
    try {
      profiles.create(v.name); // 第一個設定檔會自動承接 v1 舊進度
    } catch (e) {
      errP.textContent = (e && e.message) ? e.message : '建立失敗，請再試一次。';
      return;
    }
    if (pendingImport) {
      // 從備份檔還原（單人格式）引導而來：建立後自動匯入
      const text = pendingImport;
      pendingImport = null;
      buildEngine();
      engine.importProgress(text).then(res => {
        if (res && res.state) state.app = res.state;
        showToast('已建立「' + v.name + '」並匯入備份進度', 'ok');
        reloadForProfile();
      }).catch(e2 => {
        showToast(e2 && e2.message ? e2.message : '匯入失敗');
        reloadForProfile();
      });
      return;
    }
    reloadForProfile();
  }

  const form = h('form', {
    class: 'welcome-form',
    onsubmit: (e) => { e.preventDefault(); submit(); }
  },
    input,
    errP,
    h('button', { type: 'submit', class: 'btn btn-primary btn-big start-btn' },
      hasUsers ? '建立並開始' : '開始學習')
  );

  const addArea = h('div', { class: 'welcome-add' }, noticeP, form);
  let addToggle = null;
  function showAddForm() {
    addArea.style.display = '';
    if (addToggle) addToggle.style.display = 'none';
    try { input.focus(); } catch (e) { /* 忽略 */ }
  }
  if (hasUsers) {
    // 已有設定檔：預設收合輸入區，主畫面是「選擇使用者」
    addArea.style.display = 'none';
    addToggle = h('button', {
      type: 'button', class: 'link-btn', onclick: showAddForm
    }, '＋ 新增使用者');
  }

  const restoreCtl = restoreControl({
    fromWelcome: true,
    onNeedProfile: (text) => {
      pendingImport = text;
      noticeP.textContent = '備份檔已驗證。請先輸入暱稱建立設定檔，完成後會自動匯入這份進度。';
      showAddForm();
    }
  });

  const pickBtns = names.map(name => h('button', {
    type: 'button', class: 'btn btn-primary user-pick-btn',
    onclick: () => {
      try { profiles.switchTo(name); }
      catch (e) { showToast(e && e.message ? e.message : '切換失敗'); return; }
      reloadForProfile(); // 點名字直接進入該設定檔首頁
    }
  }, '👤 ' + name));

  setPage(
    h('div', { class: 'card center-card welcome-card' },
      h('p', { class: 'big-emoji' }, '🌏'),
      h('h1', null, '語言學習小幫手'),
      h('p', { class: 'muted' }, '英・日・韓單字隨身練，進度就存在這支手機裡。'),
      hasUsers ? h('h2', { class: 'welcome-pick-title' }, '選擇使用者') : null,
      hasUsers ? h('div', { class: 'user-pick-list' }, pickBtns) : null,
      addToggle,
      addArea,
      h('div', { class: 'welcome-restore' },
        h('p', { class: 'muted small' }, '手機曾清除資料？用之前的備份檔一鍵還原。'),
        restoreCtl.btn),
      restoreCtl.input
    )
  );
  if (!hasUsers) { try { input.focus(); } catch (e) { /* 忽略 */ } }
}

/* ===================== 啟動 ===================== */

document.getElementById('brand-btn').addEventListener('click', () => go('#/home'));
document.getElementById('nav-home').addEventListener('click', () => go('#/home'));
document.getElementById('nav-stats').addEventListener('click', () => go('#/stats'));
document.getElementById('nav-data').addEventListener('click', () => go('#/data'));
document.getElementById('profile-btn').addEventListener('click', () => go('#/data'));

window.addEventListener('hashchange', onRoute);

/* 儲存加固（best-effort）：請瀏覽器把本站資料標為持久，降低 iOS 閒置清除風險。
 * 不阻塞、不顯示結果。 */
try {
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(() => {});
  }
} catch (e) { /* 忽略 */ }

if (!location.hash) location.hash = '#/home';
/* 快速登入：開啟一律先經過歡迎頁——有設定檔顯示「選擇使用者」、沒有則建立；
 * 選定後才建立引擎進入首頁（engine 為 null 時 onRoute 會守門顯示歡迎頁）。 */
updateProfileChip();
onRoute();

</script>
