에서 만날까요?問見面地點，어디로 갈까요?問目的地。","level":"TOPIK1"},{"text":"버스 타고 가요","reading":"beoseu tago gayo","zh":"搭公車去吧","topic":"邀約出遊","example":"지하철 말고 버스 타고 가요.","example_zh":"不要搭地鐵，搭公車去吧。","note":"타다＝搭乘，交通工具＋타고 가다＝搭…去；택시 타고 가요＝搭計程車去。","level":"TOPIK1"},{"text":"지하철이 더 빨라요","reading":"jihacheori deo ppallayo","zh":"地鐵比較快","topic":"邀約出遊","example":"이 시간에는 지하철이 더 빨라요.","example_zh":"這個時間地鐵比較快。","note":"더＝更；빠르다→빨라요是르不規則變化；首爾地鐵發達，這句超實用。","level":"TOPIK1"},{"text":"걸어서 가요","reading":"georeoseo gayo","zh":"走路去吧","topic":"邀約出遊","example":"가까워요. 그냥 걸어서 가요.","example_zh":"很近，我們就走路去吧。","note":"걸어서＝步行（走著）；걷다→걸어是ㄷ不規則變化。","level":"TOPIK1"},{"text":"오늘은 못 가요","reading":"oneureun mot gayo","zh":"我今天去不了","topic":"邀約出遊","example":"미안해요, 오늘은 못 가요. 일이 있어요.","example_zh":"抱歉，我今天去不了，有事。","note":"못＋動詞＝無法…；婉拒後補一句다음에 꼭 가요（下次一定去）比較不失禮。","level":"TOPIK1"},{"text":"집에 가고 싶어요","reading":"jibe gago sipeoyo","zh":"我想回家了","topic":"邀約出遊","example":"너무 피곤해요. 집에 가고 싶어요.","example_zh":"太累了，我想回家了。","note":"-고 싶어요＝想做…；上班族的國民心聲，開玩笑抱怨時超常說。","level":"TOPIK1"},{"text":"물 주세요","reading":"mul juseyo","zh":"請給我水","topic":"吃飯聊天","example":"저기요, 물 좀 주세요.","example_zh":"不好意思，請給我水。","note":"주다→주세요＝請給我；叫店員先說저기요（那個…不好意思）。韓國餐廳的水通常自助。","level":"TOPIK1"},{"text":"이거 주세요","reading":"igeo juseyo","zh":"請給我這個","topic":"吃飯聊天","example":"이거 주세요. 이거 하나, 이거 둘요.","example_zh":"請給我這個。這個一份、這個兩份。","note":"看不懂菜單時用手指＋이거 주세요就能活下來；거＝것（東西）的口語。","level":"TOPIK1"},{"text":"메뉴판 좀 주세요","reading":"menyupan jom juseyo","zh":"請給我菜單","topic":"吃飯聊天","example":"사장님, 메뉴판 좀 주세요.","example_zh":"老闆，請給我菜單。","note":"좀讓語氣更客氣；叫老闆是사장님，是萬用又討喜的稱呼。","level":"TOPIK1"},{"text":"뭐 먹을까요?","reading":"mwo meogeulkkayo?","zh":"我們吃什麼好呢？","topic":"吃飯聊天","example":"점심에 뭐 먹을까요? — 김치찌개 어때요?","example_zh":"中午吃什麼好呢？——泡菜鍋怎麼樣？","note":"-(으)ㄹ까요?和對方一起商量；먹다→먹을까요。韓國人每天的大哉問。","level":"TOPIK1"},{"text":"아침 먹었어요?","reading":"achim meogeosseoyo?","zh":"你吃早餐了嗎？","topic":"吃飯聊天","example":"아침 먹었어요? — 아니요, 못 먹었어요.","example_zh":"你吃早餐了嗎？——沒有，來不及吃。","note":"아침既是「早上」也是「早餐」；점심＝中午／午餐、저녁＝晚上／晚餐，一詞兩用。","level":"TOPIK1"},{"text":"점심 같이 먹어요","reading":"jeomsim gachi meogeoyo","zh":"中午一起吃吧","topic":"吃飯聊天","example":"이따가 점심 같이 먹어요!","example_zh":"待會中午一起吃吧！","note":"해요體句尾也能當提議「一起…吧」用；同事同學間的日常邀約。","level":"TOPIK1"},{"text":"커피 마셔요?","reading":"keopi masyeoyo?","zh":"你喝咖啡嗎？","topic":"吃飯聊天","example":"커피 마셔요? 아니면 차로 할래요?","example_zh":"你喝咖啡嗎？還是要喝茶？","note":"마시다→마셔요；問對方平常喝不喝，點飲料前的貼心確認。","level":"TOPIK1"},{"text":"저는 아메리카노 주세요","reading":"jeoneun amerikano juseyo","zh":"我要美式咖啡","topic":"吃飯聊天","example":"저는 아이스 아메리카노 주세요.","example_zh":"我要冰美式。","note":"冰美式縮寫아아（아이스 아메리카노）是韓國國民飲料；熱的是따뜻한 아메리카노。","level":"TOPIK1"},{"text":"배불러요","reading":"baebulleoyo","zh":"我吃飽了","topic":"吃飯聊天","example":"아, 진짜 배불러요. 잘 먹었어요.","example_zh":"啊，真的好飽，吃得很滿足。","note":"배（肚子）＋부르다（飽）；和배고파요（餓）是一組；반말是배불러。","level":"TOPIK1"},{"text":"목말라요","reading":"mongmallayo","zh":"我口渴","topic":"吃飯聊天","example":"목말라요. 뭐 마실 거 있어요?","example_zh":"我口渴，有什麼可以喝的嗎？","note":"목（喉嚨）＋마르다（乾）；마실 거＝喝的東西、먹을 거＝吃的東西，口語高頻。","level":"TOPIK1"},{"text":"맛이 어때요?","reading":"masi eottaeyo?","zh":"味道怎麼樣？","topic":"吃飯聊天","example":"맛이 어때요? 입에 맞아요?","example_zh":"味道怎麼樣？合你的胃口嗎？","note":"請人吃東西後的必問句；입에 맞아요?（合胃口嗎？）是更道地的關心。","level":"TOPIK1"},{"text":"조금 짜요","reading":"jogeum jjayo","zh":"有點鹹","topic":"吃飯聊天","example":"이 국은 조금 짜요.","example_zh":"這個湯有點鹹。","note":"짜다＝鹹；相反是싱거워요（太淡）；味道形容詞是點餐聊天的基本配備。","level":"TOPIK1"},{"text":"달아요","reading":"darayo","zh":"很甜","topic":"吃飯聊天","example":"이 케이크 너무 달아요.","example_zh":"這個蛋糕太甜了。","note":"달다＝甜；辣是맵다、酸是시다、苦是쓰다，形容詞背一組最好記。","level":"TOPIK1"},{"text":"이 집 진짜 잘해요","reading":"i jip jinjja jalhaeyo","zh":"這家店真的很好吃","topic":"吃飯聊天","example":"이 집 진짜 잘해요. 맛집이에요.","example_zh":"這家真的很好吃，是名店。","note":"口語用이 집（這家）稱餐廳；맛집＝美食名店，查美食必學單字。","level":"TOPIK1"},{"text":"여기 자주 와요","reading":"yeogi jaju wayo","zh":"我常來這家","topic":"吃飯聊天","example":"여기 자주 와요. 뭐가 맛있는지 알아요.","example_zh":"我常來這家，知道什麼好吃。","note":"帶朋友去愛店時的開場白；자주＝常常、가끔＝偶爾。","level":"TOPIK1"},{"text":"더 드세요","reading":"deo deuseyo","zh":"再多吃一點","topic":"吃飯聊天","example":"많이 있어요. 더 드세요.","example_zh":"還有很多，再多吃一點。","note":"招待客人的熱情用語；드시다是먹다的敬語，對朋友可說더 먹어요。","level":"TOPIK1"},{"text":"조금만 주세요","reading":"jogeumman juseyo","zh":"請給我一點點就好","topic":"吃飯聊天","example":"밥은 조금만 주세요.","example_zh":"飯給我一點點就好。","note":"만＝只、僅；被熱情添菜時的自保句，搭配배불러요使用。","level":"TOPIK1"},{"text":"포장돼요?","reading":"pojangdwaeyo?","zh":"可以外帶嗎？","topic":"吃飯聊天","example":"이거 포장돼요? — 네, 됩니다.","example_zh":"這個可以外帶嗎？——可以。","note":"포장＝包裝／外帶；-돼요?＝可以…嗎？；內用是먹고 가요、外帶是가지고 가요。","level":"TOPIK1"},{"text":"계산할게요","reading":"gyesanhalgeyo","zh":"我要買單","topic":"吃飯聊天","example":"사장님, 계산할게요!","example_zh":"老闆，買單！","note":"계산＝結帳；韓國多半是吃完到櫃檯結帳，不是在座位上買單。","level":"TOPIK1"},{"text":"각자 내요","reading":"gakja naeyo","zh":"我們各付各的吧","topic":"吃飯聊天","example":"오늘은 각자 내요.","example_zh":"今天各付各的吧。","note":"내다＝付（錢）；年輕人也說더치페이（Dutch pay）＝AA制。","level":"TOPIK1"},{"text":"한 잔 더 할래요?","reading":"han jan deo hallaeyo?","zh":"要再喝一杯嗎？","topic":"吃飯聊天","example":"시간 괜찮으면 한 잔 더 할래요?","example_zh":"時間可以的話，要再喝一杯嗎？","note":"잔＝杯（量詞）；韓國聚餐的2차（續攤）文化：一攤吃飯、二攤喝酒或咖啡。","level":"TOPIK1"},{"text":"뭐 시킬까요?","reading":"mwo sikilkkayo?","zh":"我們點什麼好？","topic":"吃飯聊天","example":"뭐 시킬까요? 여기 치킨이 유명해요.","example_zh":"我們點什麼好？這裡的炸雞很有名。","note":"시키다＝點（餐）；外送點餐也用這個字，배달 시켜요＝叫外送。","level":"TOPIK1"},{"text":"김치 좀 더 주세요","reading":"gimchi jom deo juseyo","zh":"請再給我一些泡菜","topic":"吃飯聊天","example":"저기요, 김치 좀 더 주세요.","example_zh":"不好意思，請再給我一些泡菜。","note":"韓國餐廳的반찬（小菜）幾乎都能免費續，大方開口要就對了。","level":"TOPIK1"},{"text":"이거 안 매워요?","reading":"igeo an maewoyo?","zh":"這個不辣嗎？","topic":"吃飯聊天","example":"이거 안 매워요? 저 매운 거 잘 못 먹어요.","example_zh":"這個不辣嗎？我不太能吃辣。","note":"안＋形容詞的否定疑問；點餐前先確認辣度，맵다→매워요是ㅂ不規則變化。","level":"TOPIK1"},{"text":"저는 커피를 못 마셔요","reading":"jeoneun keopireul mot masyeoyo","zh":"我不能喝咖啡","topic":"吃飯聊天","example":"저는 커피를 못 마셔요. 잠을 못 자요.","example_zh":"我不能喝咖啡，會睡不著。","note":"못 마셔요＝（體質上）不能喝；술을 못 마셔요（我不能喝酒）也用同句型，聚餐必備。","level":"TOPIK1"},{"text":"잘 어울려요","reading":"jal eoullyeoyo","zh":"很適合你","topic":"稱讚回應","example":"그 옷 진짜 잘 어울려요!","example_zh":"那件衣服真的很適合你！","note":"어울리다＝相配；稱讚穿搭、髮型的萬用句，比예뻐요更有觀察力。","level":"TOPIK1"},{"text":"최고예요","reading":"choegoyeyo","zh":"最棒了","topic":"稱讚回應","example":"역시 최고예요!","example_zh":"果然最棒了！","note":"최고＝最高、最棒，常配大拇指手勢；역시＝果然，加上去更有捧的效果。","level":"TOPIK1"},{"text":"부러워요","reading":"bureowoyo","zh":"好羨慕","topic":"稱讚回應","example":"여행 가요? 진짜 부러워요!","example_zh":"你要去旅行？真羨慕！","note":"부럽다→부러워요（ㅂ不規則）；聽朋友分享好事時的捧場反應詞。","level":"TOPIK1"},{"text":"짱이에요","reading":"jjangieyo","zh":"超讚","topic":"稱讚回應","example":"이 노래 진짜 짱이에요.","example_zh":"這首歌真的超讚。","note":"짱＝最棒（俚語），朋友間口語；正式場合用최고예요或정말 좋아요。","level":"TOPIK1"},{"text":"노래 진짜 잘하네요","reading":"norae jinjja jalhaneyo","zh":"你唱歌真的很好聽","topic":"稱讚回應","example":"와, 노래 진짜 잘하네요!","example_zh":"哇，你唱歌真的很好聽！","note":"잘하다＋-네요＝當場聽到的讚嘆；KTV必備稱讚句，被稱讚就回아니에요。","level":"TOPIK1"},{"text":"요리 진짜 잘해요","reading":"yori jinjja jalhaeyo","zh":"你真的很會做菜","topic":"稱讚回應","example":"이거 직접 만들었어요? 요리 진짜 잘해요!","example_zh":"這是你自己做的？你真的很會做菜！","note":"직접＝親自；잘해요＝做得好，前面直接放名詞（노래/요리/운동）就能套用。","level":"TOPIK1"},{"text":"눈이 예뻐요","reading":"nuni yeppeoyo","zh":"你的眼睛很漂亮","topic":"稱讚回應","example":"웃을 때 눈이 예뻐요.","example_zh":"你笑起來眼睛很漂亮。","note":"具體稱讚五官比籠統說漂亮更真誠；눈（眼）、미소（微笑）都是安全的稱讚點。","level":"TOPIK1"},{"text":"머리 바꿨어요?","reading":"meori bakkwosseoyo?","zh":"你換髮型了喔？","topic":"稱讚回應","example":"어? 머리 바꿨어요? 잘 어울려요!","example_zh":"咦？你換髮型了？很適合你！","note":"바꾸다＝換；注意到對方的變化是韓國社交的加分技，後面接잘 어울려요最完整。","level":"TOPIK1"},{"text":"아직 잘 못해요","reading":"ajik jal motaeyo","zh":"我還不太行（謙虛）","topic":"稱讚回應","example":"요리 잘하네요! — 아니에요, 아직 잘 못해요.","example_zh":"你好會做菜！——沒有啦，還不太行。","note":"被稱讚技能時的標準謙虛回應；아직＝還（沒）；搭配아니에요一起用。","level":"TOPIK1"},{"text":"칭찬 고마워요","reading":"chingchan gomawoyo","zh":"謝謝你的稱讚","topic":"稱讚回應","example":"칭찬 고마워요. 기분 좋네요.","example_zh":"謝謝你的稱讚，心情真好。","note":"칭찬＝稱讚；不想太謙虛時，大方道謝也是自然的回應方式。","level":"TOPIK1"},{"text":"별거 아니에요","reading":"byeolgeo anieyo","zh":"沒什麼啦","topic":"稱讚回應","example":"와, 대단해요! — 별거 아니에요.","example_zh":"哇，好厲害！——沒什麼啦。","note":"별거＝特別的東西；被道謝或稱讚時輕描淡寫的謙虛說法，口語超高頻。","level":"TOPIK1"},{"text":"운이 좋았어요","reading":"uni joasseoyo","zh":"只是運氣好","topic":"稱讚回應","example":"시험 잘 봤네요! — 그냥 운이 좋았어요.","example_zh":"你考得真好！——只是運氣好而已。","note":"운＝運氣；把成就歸功於運氣的謙虛話術，韓國職場學校都常用。","level":"TOPIK1"},{"text":"ㅇㅇ","reading":"eungeung","zh":"嗯嗯（好／對）","topic":"網路聊天用語","example":"내일 2시 맞지? — ㅇㅇ 맞아","example_zh":"明天兩點對吧？——嗯嗯 對","note":"응응（嗯嗯）的子音縮寫，朋友間快速回覆用；對長輩或不熟的人用會顯得敷衍。","level":"TOPIK1"},{"text":"ㅇㅋ","reading":"okei","zh":"OK（縮寫）","topic":"網路聊天用語","example":"7시에 보자! — ㅇㅋ!","example_zh":"七點見！——OK！","note":"오케이的子音縮寫；正式一點打네~或좋아요，看對象切換。","level":"TOPIK1"},{"text":"ㄱㄱ","reading":"gogo","zh":"走起／開始吧","topic":"網路聊天用語","example":"치킨 시킬까? — ㄱㄱ!","example_zh":"要叫炸雞嗎？——走起！","note":"고고（go go）的子音縮寫，表示贊成馬上行動；遊戲開局也用。","level":"TOPIK1"},{"text":"ㅊㅋㅊㅋ","reading":"chukhachukha","zh":"恭喜恭喜（縮寫）","topic":"網路聊天用語","example":"저 합격했어요! — ㅊㅋㅊㅋ!!","example_zh":"我合格了！——恭喜恭喜！！","note":"축하축하的子音縮寫；完整說法是축하해요（恭喜你），正式場合요別省。","level":"TOPIK1"},{"text":"넵","reading":"nep","zh":"是的（俏皮版）","topic":"網路聊天用語","example":"내일까지 보내 주세요. — 넵!","example_zh":"請明天前傳給我。——好的！","note":"네的變體，比네活潑又不失禮，職場通訊軟體超高頻；還有更軟的넹。","level":"TOPIK1"},{"text":"헉","reading":"heok","zh":"天啊（倒抽一口氣）","topic":"網路聊天用語","example":"헉, 지갑을 집에 놓고 왔어요.","example_zh":"天啊，我把錢包忘在家裡了。","note":"表示驚嚇、慘了的感嘆詞，比헐更有「倒抽一口氣」的感覺；打字聊天都常用。","level":"TOPIK1"},{"text":"프사","reading":"peusa","zh":"大頭貼（頭像）","topic":"網路聊天用語","example":"프사 바꿨네요? 사진 예뻐요.","example_zh":"你換大頭貼了？照片好漂亮。","note":"프로필 사진（profile照片）的縮寫；注意到朋友換프사並稱讚是聊天的好開場。","level":"TOPIK1"},{"text":"갠톡","reading":"gaentok","zh":"私訊（一對一聊天）","topic":"網路聊天用語","example":"자세한 건 갠톡으로 얘기해요.","example_zh":"細節我們私訊聊。","note":"개인 카톡（個人KakaoTalk）的縮寫；群組裡不方便說的事就갠톡。","level":"TOPIK1"},{"text":"꿀잼","reading":"kkuljaem","zh":"超有趣","topic":"網路聊天用語","example":"어제 그 예능 봤어요? 꿀잼이에요.","example_zh":"你看昨天那個綜藝了嗎？超好笑。","note":"꿀（蜂蜜）＋재미（樂趣）＝甜滋滋的有趣；相反是노잼（無聊），一組流行語。","level":"TOPIK1"},{"text":"문자 보낼게요","reading":"munja bonaelgeyo","zh":"我再傳簡訊給你","topic":"網路聊天用語","example":"도착하면 문자 보낼게요.","example_zh":"到了我再傳訊息給你。","note":"문자＝簡訊、보내다＝寄送；-(으)ㄹ게요表示自己的承諾，約見面時常說。","level":"TOPIK1"},{"text":"날씨가 맑아요","reading":"nalssiga malgayo","zh":"天氣晴朗","topic":"日常閒聊","example":"오늘 날씨가 맑아요. 나가요!","example_zh":"今天天氣很晴朗，出門吧！","note":"맑다＝晴朗（發音[말따]）；天氣是韓語聊天最安全的開場話題。","level":"TOPIK1"},{"text":"날씨가 흐려요","reading":"nalssiga heuryeoyo","zh":"天氣陰陰的","topic":"日常閒聊","example":"날씨가 흐려요. 비 올 것 같아요.","example_zh":"天氣陰陰的，好像要下雨了。","note":"흐리다＝陰；和맑다是一組反義詞，看天說一句就是聊天的開始。","level":"TOPIK1"},{"text":"눈이 와요","reading":"nuni wayo","zh":"下雪了","topic":"日常閒聊","example":"밖에 봐요! 눈이 와요!","example_zh":"看外面！下雪了！","note":"下雪也用오다（눈이 오다）；台灣人看到初雪（첫눈）的興奮是韓國朋友愛聊的話題。","level":"TOPIK1"},{"text":"바람이 많이 불어요","reading":"barami mani bureoyo","zh":"風很大","topic":"日常閒聊","example":"오늘 바람이 많이 불어요. 춥게 입지 마세요.","example_zh":"今天風很大，別穿太少。","note":"「颳風」是바람이 불다（불다→불어요）；많이＝多、很。","level":"TOPIK1"},{"text":"비가 그쳤어요","reading":"biga geuchyeosseoyo","zh":"雨停了","topic":"日常閒聊","example":"비가 그쳤어요. 이제 나가도 돼요.","example_zh":"雨停了，現在可以出門了。","note":"그치다＝（雨雪）停；和비가 와요成對記，聊天氣馬上用得到。","level":"TOPIK1"},{"text":"날씨가 따뜻해요","reading":"nalssiga ttatteutaeyo","zh":"天氣暖和","topic":"日常閒聊","example":"이제 봄이에요. 날씨가 따뜻해요.","example_zh":"春天到了，天氣很暖和。","note":"따뜻하다＝溫暖，形容天氣、湯、人心都可以；봄＝春天。","level":"TOPIK1"},{"text":"날씨가 시원해요","reading":"nalssiga siwonhaeyo","zh":"天氣涼爽","topic":"日常閒聊","example":"가을이라서 날씨가 시원해요.","example_zh":"因為是秋天，天氣很涼爽。","note":"시원하다很萬用：天氣涼爽、湯頭爽口、心情暢快都能說시원해요。","level":"TOPIK1"},{"text":"습해요","reading":"seupaeyo","zh":"好潮濕","topic":"日常閒聊","example":"대만 여름은 진짜 습해요.","example_zh":"台灣的夏天真的很潮濕。","note":"습하다＝潮濕；跟韓國朋友解釋台灣的濕熱體感，這個字不可少。","level":"TOPIK1"},{"text":"요즘 미세먼지가 심해요","reading":"yojeum misemeonjiga simhaeyo","zh":"最近空污很嚴重","topic":"日常閒聊","example":"요즘 미세먼지가 심해요. 마스크 꼭 쓰세요.","example_zh":"最近空污很嚴重，一定要戴口罩。","note":"미세먼지＝懸浮微粒（PM2.5），韓國人每天看的指數；심하다＝嚴重。","level":"TOPIK1"},{"text":"장마철이에요","reading":"jangmacheorieyo","zh":"現在是梅雨季","topic":"日常閒聊","example":"지금 한국은 장마철이에요. 매일 비가 와요.","example_zh":"現在韓國是梅雨季，每天都下雨。","note":"장마＝梅雨、철＝季節；韓國梅雨在六七月，和台灣五六月的梅雨可以互相比較。","level":"TOPIK1"},{"text":"태풍이 와요","reading":"taepungi wayo","zh":"颱風要來了","topic":"日常閒聊","example":"이번 주에 태풍이 와요. 조심하세요.","example_zh":"這週颱風要來，小心一點。","note":"태풍跟中文「颱風」發音超像；台灣的颱風假（태풍 휴가）會讓韓國朋友大吃一驚。","level":"TOPIK1"},{"text":"내일 날씨 어때요?","reading":"naeil nalssi eottaeyo?","zh":"明天天氣怎麼樣？","topic":"日常閒聊","example":"내일 날씨 어때요? 소풍 가는데.","example_zh":"明天天氣怎麼樣？我要去野餐。","note":"出遊前必問；「天氣預報」是일기예보，날씨를 확인해요＝確認天氣。","level":"TOPIK1"},{"text":"지금 뭐 해요?","reading":"jigeum mwo haeyo?","zh":"你在做什麼？","topic":"日常閒聊","example":"지금 뭐 해요? 심심하면 통화해요.","example_zh":"你在做什麼？無聊的話來通話吧。","note":"傳訊息開場的國民句；반말是뭐 해?，曖昧期傳這句意義重大。","level":"TOPIK1"},{"text":"그냥 집에 있어요","reading":"geunyang jibe isseoyo","zh":"我就待在家","topic":"日常閒聊","example":"지금 뭐 해요? — 그냥 집에 있어요.","example_zh":"你在做什麼？——就待在家啊。","note":"그냥＝就、只是，韓語口語最高頻的膠水詞之一，答不出理由時說그냥요就好。","level":"TOPIK1"},{"text":"티비 봐요","reading":"tibi bwayo","zh":"我在看電視","topic":"日常閒聊","example":"밥 먹으면서 티비 봐요.","example_zh":"我邊吃飯邊看電視。","note":"티비＝TV；보다→봐요；現在更多人說넷플릭스 봐요（在看Netflix）。","level":"TOPIK1"},{"text":"음악을 들어요","reading":"eumageul deureoyo","zh":"我在聽音樂","topic":"日常閒聊","example":"지하철에서 음악을 들어요.","example_zh":"我在地鐵上聽音樂。","note":"듣다→들어요是ㄷ不規則變化的代表；노래를 들어요也通。","level":"TOPIK1"},{"text":"책을 읽어요","reading":"chaegeul ilgeoyo","zh":"我在看書","topic":"日常閒聊","example":"자기 전에 책을 읽어요.","example_zh":"我睡前會看書。","note":"읽다→읽어요（發音[일거요]）；「看書」韓語用「讀」不用「看」。","level":"TOPIK1"},{"text":"일찍 자요","reading":"iljjik jayo","zh":"早點睡吧","topic":"日常閒聊","example":"내일 일찍 일어나야 해요. 오늘은 일찍 자요.","example_zh":"明天要早起，今天早點睡吧。","note":"일찍＝早、늦게＝晚；睡前聊天的收尾句，搭配잘 자요一起用。","level":"TOPIK1"},{"text":"늦게 일어났어요","reading":"neutge ireonasseoyo","zh":"我睡過頭了","topic":"日常閒聊","example":"오늘 늦게 일어났어요. 지각했어요.","example_zh":"今天睡過頭，遲到了。","note":"일어나다＝起床；지각하다＝遲到；遲到自首時的常用組合。","level":"TOPIK1"},{"text":"어제 잘 잤어요?","reading":"eoje jal jasseoyo?","zh":"你昨天睡得好嗎？","topic":"日常閒聊","example":"어제 잘 잤어요? 피곤해 보여요.","example_zh":"你昨天睡得好嗎？你看起來很累。","note":"자다→잤어요；-아/어 보여요＝看起來…；早上關心朋友的暖心句。","level":"TOPIK1"},{"text":"청소해요","reading":"cheongsohaeyo","zh":"我在打掃","topic":"日常閒聊","example":"주말마다 집을 청소해요.","example_zh":"我每個週末都打掃家裡。","note":"청소하다＝打掃；마다＝每（주말마다＝每個週末）；大掃除是대청소。","level":"TOPIK1"},{"text":"빨래해요","reading":"ppallaehaeyo","zh":"我在洗衣服","topic":"日常閒聊","example":"날씨 좋아서 빨래해요.","example_zh":"天氣好所以我在洗衣服。","note":"빨래＝洗衣（名詞動詞同形）；설거지＝洗碗，家事單字聊日常必備。","level":"TOPIK1"},{"text":"마트에 가요","reading":"mateue gayo","zh":"我要去超市","topic":"日常閒聊","example":"우유가 없어서 마트에 가요.","example_zh":"沒牛奶了，我要去超市。","note":"마트＝大型超市、시장＝傳統市場、편의점＝便利商店，三個場所詞一起記。","level":"TOPIK1"},{"text":"뭐 샀어요?","reading":"mwo sasseoyo?","zh":"你買了什麼？","topic":"日常閒聊","example":"쇼핑 갔다 왔어요? 뭐 샀어요?","example_zh":"你去逛街回來啦？買了什麼？","note":"사다→샀어요；갔다 왔어요＝去了一趟回來，口語高頻表達。","level":"TOPIK1"},{"text":"옷을 샀어요","reading":"oseul sasseoyo","zh":"我買了衣服","topic":"日常閒聊","example":"세일해서 옷을 두 벌 샀어요.","example_zh":"因為特價，我買了兩件衣服。","note":"衣服量詞是벌（한 벌、두 벌）；-아/어서＝因為，口語最常用的原因連接。","level":"TOPIK1"},{"text":"친구를 만났어요","reading":"chingureul mannasseoyo","zh":"我和朋友見了面","topic":"日常閒聊","example":"어제 오랜만에 친구를 만났어요.","example_zh":"昨天和好久不見的朋友見了面。","note":"注意韓語「見朋友」用를不用和：친구를 만나다，是台灣學習者最常錯的助詞之一。","level":"TOPIK1"},{"text":"일이 많아요","reading":"iri manayo","zh":"工作很多","topic":"日常閒聊","example":"요즘 일이 너무 많아요.","example_zh":"最近工作太多了。","note":"많다→많아요（發音[마나요]）；抱怨忙碌的基本句，接피곤해요很順。","level":"TOPIK1"},{"text":"좀 쉬고 싶어요","reading":"jom swigo sipeoyo","zh":"我想休息一下","topic":"日常閒聊","example":"이번 주말에는 좀 쉬고 싶어요.","example_zh":"這個週末我想好好休息一下。","note":"쉬다＝休息；-고 싶어요＝想…；上班族學生的共同心聲。","level":"TOPIK1"},{"text":"푹 쉬세요","reading":"puk swiseyo","zh":"好好休息","topic":"日常閒聊","example":"감기 걸렸어요? 푹 쉬세요.","example_zh":"你感冒了？好好休息。","note":"푹＝充分地、沉沉地；朋友生病或疲累時的關心句，반말是푹 쉬어。","level":"TOPIK1"},{"text":"운동하러 가요","reading":"undonghareo gayo","zh":"我要去運動","topic":"日常閒聊","example":"저녁에 운동하러 가요. 같이 갈래요?","example_zh":"我晚上要去運動，要一起嗎？","note":"-(으)러 가다＝去做…；去健身房口語說헬스장에 가요。","level":"TOPIK1"},{"text":"심심해요","reading":"simsimhaeyo","zh":"好無聊","topic":"日常閒聊","example":"심심해요. 뭐 재미있는 거 없어요?","example_zh":"好無聊，沒什麼有趣的事嗎？","note":"심심하다＝閒得無聊；내용이 지루하다是內容乏味，兩種「無聊」不同。","level":"TOPIK1"},{"text":"재미있어요","reading":"jaemiisseoyo","zh":"很有趣","topic":"日常閒聊","example":"이 드라마 진짜 재미있어요.","example_zh":"這部劇真的很好看。","note":"재미＋있다＝有趣味；口語常縮成재밌어요，追劇聊天最高頻形容詞。","level":"TOPIK1"},{"text":"재미없어요","reading":"jaemieopseoyo","zh":"很無趣","topic":"日常閒聊","example":"그 영화 좀 재미없어요.","example_zh":"那部電影有點無聊。","note":"있어요↔없어요一換就是反義詞；委婉一點前面加좀（有點）。","level":"TOPIK1"},{"text":"기분이 좋아요","reading":"gibuni joayo","zh":"心情很好","topic":"日常閒聊","example":"오늘 왠지 기분이 좋아요.","example_zh":"今天不知道為什麼心情很好。","note":"기분＝心情；왠지＝不知為何；心情不好是기분이 안 좋아요。","level":"TOPIK1"},{"text":"슬퍼요","reading":"seulpeoyo","zh":"好難過","topic":"日常閒聊","example":"드라마 결말이 너무 슬퍼요.","example_zh":"這部劇的結局太讓人難過了。","note":"슬프다→슬퍼요（으不規則）；開心是기뻐요（기쁘다），一組情緒詞。","level":"TOPIK1"},{"text":"졸려요","reading":"jollyeoyo","zh":"好睏","topic":"日常閒聊","example":"점심 먹고 나서 너무 졸려요.","example_zh":"吃完午餐好睏。","note":"졸리다＝睏；飯後睏叫식곤증（食困症），上課上班聊天共鳴度極高。","level":"TOPIK1"},{"text":"더워 죽겠어요","reading":"deowo jukgesseoyo","zh":"熱死了","topic":"日常閒聊","example":"에어컨 켜요. 더워 죽겠어요.","example_zh":"開冷氣吧，熱死了。","note":"-아/어 죽겠어요＝…死了（誇張），배고파 죽겠어요、피곤해 죽겠어요都超常用。","level":"TOPIK1"},{"text":"다행이에요","reading":"dahaengieyo","zh":"太好了／幸好","topic":"日常閒聊","example":"안 다쳤어요? 정말 다행이에요.","example_zh":"你沒受傷？真是太好了。","note":"다행＝幸運、萬幸；聽到壞事化解時的必備反應句。","level":"TOPIK1"},{"text":"아쉬워요","reading":"aswiwoyo","zh":"好可惜","topic":"日常閒聊","example":"벌써 가요? 아쉬워요.","example_zh":"這就要走了？好可惜。","note":"아쉽다＝可惜、捨不得；聚會結束、比賽輸了都能用，情感表達加分詞。","level":"TOPIK1"},{"text":"깜짝 놀랐어요","reading":"kkamjjak nollasseoyo","zh":"嚇我一跳","topic":"日常閒聊","example":"갑자기 부르지 마세요. 깜짝 놀랐어요!","example_zh":"不要突然叫我啦，嚇我一跳！","note":"깜짝＝突然一驚的樣子；놀라다＝吃驚；聽到驚人消息也可以說。","level":"TOPIK1"},{"text":"긴장돼요","reading":"ginjangdwaeyo","zh":"好緊張","topic":"日常閒聊","example":"내일 면접이 있어서 긴장돼요.","example_zh":"明天有面試，好緊張。","note":"긴장되다＝緊張；면접＝面試；朋友回힘내세요幫你打氣。","level":"TOPIK1"},{"text":"떨려요","reading":"tteollyeoyo","zh":"好緊張（心撲通撲通）","topic":"日常閒聊","example":"무대에 올라가기 전에 너무 떨려요.","example_zh":"上台前超緊張的。","note":"떨리다原意是發抖，比긴장돼요更有心跳加速的感覺；期待到發抖也能用。","level":"TOPIK1"},{"text":"웃겨요","reading":"utgyeoyo","zh":"好好笑","topic":"日常閒聊","example":"이 영상 진짜 웃겨요. 한번 봐요.","example_zh":"這個影片真的好好笑，你看一下。","note":"웃기다＝好笑、搞笑；재미있어요是有趣，웃겨요是笑出聲的好笑。","level":"TOPIK1"},{"text":"그거 알아요?","reading":"geugeo arayo?","zh":"你知道嗎？","topic":"日常閒聊","example":"그거 알아요? 그 카페 문 닫았어요.","example_zh":"你知道嗎？那家咖啡廳關門了。","note":"分享八卦、新消息的起手式；알다→알아요；反問我怎麼會知道＝제가 어떻게 알아요?。","level":"TOPIK1"},{"text":"몰라요","reading":"mollayo","zh":"我不知道","topic":"日常閒聊","example":"그 사람 이름요? 저도 잘 몰라요.","example_zh":"那個人的名字？我也不太清楚。","note":"모르다→몰라요（르不規則）；加잘變잘 몰라요語氣更軟，只說몰라요有時顯得冷淡。","level":"TOPIK1"},{"text":"이거 하나 주세요","reading":"igeo hana juseyo","zh":"請給我一個這個","topic":"數字時間","example":"이거 하나 주세요. 아, 두 개 주세요.","example_zh":"請給我一個這個。啊，還是給我兩個。","note":"點餐買東西的基本句；數量用固有數字하나、둘、셋。","level":"TOPIK1"},{"text":"두 개 주세요","reading":"du gae juseyo","zh":"請給我兩個","topic":"數字時間","example":"붕어빵 두 개 주세요.","example_zh":"請給我兩個鯛魚燒。","note":"개＝個（量詞）；둘在量詞前變두（둘→두 개），셋→세 개、넷→네 개。","level":"TOPIK1"},{"text":"몇 개예요?","reading":"myeot gaeyeyo?","zh":"有幾個？","topic":"數字時間","example":"남은 거 몇 개예요? — 세 개요.","example_zh":"剩下幾個？——三個。","note":"몇＋量詞＝幾…；回答時句尾加요（세 개요）是口語的禮貌簡答。","level":"TOPIK1"},{"text":"몇 분이세요?","reading":"myeot buniseyo?","zh":"請問幾位？","topic":"數字時間","example":"몇 분이세요? — 두 명이에요.","example_zh":"請問幾位？——兩位。","note":"進餐廳店員必問的一句，聽懂就好；분是명的敬語量詞。","level":"TOPIK1"},{"text":"두 명이에요","reading":"du myeongieyo","zh":"兩位／兩個人","topic":"數字時間","example":"몇 분이세요? — 두 명이에요.","example_zh":"幾位？——兩位。","note":"回答人數用명；口語也常說두 명이요、둘이요（兩個人）。","level":"TOPIK1"},{"text":"내일 뭐 해요?","reading":"naeil mwo haeyo?","zh":"你明天要做什麼？","topic":"數字時間","example":"내일 뭐 해요? 시간 있으면 놀아요.","example_zh":"你明天要做什麼？有空的話一起玩吧。","note":"韓語用現在式問未來計畫；這句常是邀約的前奏，聽到就準備接招。","level":"TOPIK1"},{"text":"아침 일곱 시에 일어나요","reading":"achim ilgop sie ireonayo","zh":"我早上七點起床","topic":"數字時間","example":"저는 매일 아침 일곱 시에 일어나요.","example_zh":"我每天早上七點起床。","note":"點鐘用固有數字（일곱 시）；에表示時間點；聊作息的基本句。","level":"TOPIK1"},{"text":"밤 열한 시에 자요","reading":"bam yeolhan sie jayo","zh":"我晚上十一點睡","topic":"數字時間","example":"보통 밤 열한 시에 자요.","example_zh":"我通常晚上十一點睡。","note":"열하나→열한 시；밤＝夜晚、새벽＝凌晨，熬夜是밤을 새워요。","level":"TOPIK1"},{"text":"삼십 분 걸려요","reading":"samsip bun geollyeoyo","zh":"要花三十分鐘","topic":"數字時間","example":"여기서 얼마나 걸려요? — 삼십 분 걸려요.","example_zh":"從這裡要多久？——三十分鐘。","note":"걸리다＝花（時間）；問法是얼마나 걸려요?（要多久？），旅行必備。","level":"TOPIK1"},{"text":"집에서 회사까지 한 시간 걸려요","reading":"jibeseo hoesakkaji han sigan geollyeoyo","zh":"從家到公司要一小時","topic":"數字時間","example":"집에서 회사까지 한 시간 걸려요. 너무 멀어요.","example_zh":"從家到公司要一小時，太遠了。","note":"에서～까지＝從…到…；通勤時間是韓國上班族的共同話題。","level":"TOPIK1"},{"text":"일주일에 두 번 운동해요","reading":"iljuire du beon undonghaeyo","zh":"我一週運動兩次","topic":"數字時間","example":"일주일에 두 번 헬스장에 가요.","example_zh":"我一週去兩次健身房。","note":"번＝次（量詞）；期間＋에＋次數＝頻率的說法，聊習慣必用。","level":"TOPIK1"},{"text":"처음이에요","reading":"cheoeumieyo","zh":"我是第一次","topic":"數字時間","example":"한국은 처음이에요? — 네, 처음이에요.","example_zh":"你是第一次來韓國嗎？——對，第一次。","note":"처음＝第一次、最初；旅行、體驗場合高頻；第二次是두 번째。","level":"TOPIK1"},{"text":"벌써 열두 시예요","reading":"beolsseo yeoldu siyeyo","zh":"已經十二點了","topic":"數字時間","example":"벌써 열두 시예요? 시간 진짜 빨라요.","example_zh":"已經十二點了？時間過真快。","note":"벌써＝已經（比想像中快）；聊得盡興看時間時的驚呼，接슬슬 갈까요?（差不多該走了？）。","level":"TOPIK1"},{"text":"조금 이따가 봐요","reading":"jogeum ittaga bwayo","zh":"待會見","topic":"數字時間","example":"지금 준비 중이에요. 조금 이따가 봐요.","example_zh":"我在準備了，待會見。","note":"이따가＝待會（今天之內）；口語常縮成이따 봐요，跟나중에（改天）不同。","level":"TOPIK1"},{"text":"다음 주에 봐요","reading":"daeum jue bwayo","zh":"下週見","topic":"數字時間","example":"그럼 다음 주에 봐요!","example_zh":"那就下週見！","note":"다음 주＝下週、이번 주＝這週、지난주＝上週，一組時間詞一起記。","level":"TOPIK1"},{"text":"지하철역이 어디예요?","reading":"jihacheollyeogi eodiyeyo?","zh":"地鐵站在哪裡？","topic":"求助應急","example":"저기요, 지하철역이 어디예요?","example_zh":"不好意思，地鐵站在哪裡？","note":"역＝站；問路先說저기요或실례지만開頭比較有禮貌。","level":"TOPIK1"},{"text":"이 근처에 편의점이 있어요?","reading":"i geuncheoe pyeonuijeomi isseoyo?","zh":"這附近有便利商店嗎？","topic":"求助應急","example":"이 근처에 편의점이 있어요? — 네, 바로 앞에 있어요.","example_zh":"這附近有便利商店嗎？——有，就在前面。","note":"근처＝附近；換약국（藥局）、화장실（廁所）就能無限套用，旅行萬用句型。","level":"TOPIK1"},{"text":"어떻게 가요?","reading":"eotteoke gayo?","zh":"要怎麼去？","topic":"求助應急","example":"명동에 어떻게 가요? — 지하철 타세요.","example_zh":"明洞要怎麼去？——請搭地鐵。","note":"어떻게＝怎麼；地點＋에 어떻게 가요?是問路核心句型。","level":"TOPIK1"},{"text":"똑바로 가세요","reading":"ttokbaro gaseyo","zh":"請直走","topic":"求助應急","example":"이 길로 똑바로 가세요.","example_zh":"沿這條路直走。","note":"똑바로＝筆直地；也說쭉 가세요（一直走），問路時常聽到。","level":"TOPIK1"},{"text":"왼쪽으로 가세요","reading":"oenjjogeuro gaseyo","zh":"請往左走","topic":"求助應急","example":"저기에서 왼쪽으로 가세요.","example_zh":"在那邊往左轉。","note":"왼쪽＝左邊、오른쪽＝右邊；(으)로表示方向，聽指路必備。","level":"TOPIK1"},{"text":"오른쪽에 있어요","reading":"oreunjjoge isseoyo","zh":"在右邊","topic":"求助應急","example":"출구는 오른쪽에 있어요.","example_zh":"出口在右邊。","note":"位置詞＋에 있어요＝在…；問路聽到的高頻回答句。","level":"TOPIK1"},{"text":"은행 옆에 있어요","reading":"eunhaeng yeope isseoyo","zh":"在銀行旁邊","topic":"求助應急","example":"그 카페는 은행 옆에 있어요.","example_zh":"那家咖啡廳在銀行旁邊。","note":"옆＝旁邊、앞＝前面、뒤＝後面、안＝裡面、밖＝外面，位置詞一組背起來。","level":"TOPIK1"},{"text":"건너편에 있어요","reading":"geonneopyeone isseoyo","zh":"在對面","topic":"求助應急","example":"약국은 길 건너편에 있어요.","example_zh":"藥局在馬路對面。","note":"건너편＝對面；過馬路是길을 건너요，兩個一起記。","level":"TOPIK1"},{"text":"여기에서 멀어요?","reading":"yeogieseo meoreoyo?","zh":"離這裡遠嗎？","topic":"求助應急","example":"거기 여기에서 멀어요? — 아니요, 가까워요.","example_zh":"那裡離這裡遠嗎？——不，很近。","note":"멀다＝遠；問完距離再問얼마나 걸려요?（要多久？）就完整了。","level":"TOPIK1"},{"text":"가까워요","reading":"gakkawoyo","zh":"很近","topic":"求助應急","example":"우리 집에서 역까지 가까워요.","example_zh":"我家離車站很近。","note":"가깝다→가까워요（ㅂ不規則）；和멀어요是一組反義詞。","level":"TOPIK1"},{"text":"걸어서 오 분이에요","reading":"georeoseo o bunieyo","zh":"走路五分鐘就到","topic":"求助應急","example":"가까워요. 걸어서 오 분이에요.","example_zh":"很近，走路五分鐘就到。","note":"걸어서＋時間＝走路…（的距離）；韓國房屋廣告愛用역세권（近車站）這說法。","level":"TOPIK1"},{"text":"몇 번 출구예요?","reading":"myeot beon chulguyeyo?","zh":"幾號出口？","topic":"求助應急","example":"홍대입구역 몇 번 출구예요? — 9번 출구요.","example_zh":"弘大入口站幾號出口？——九號出口。","note":"출구＝出口；韓國人約見面都約地鐵站幾號출구，這句是赴約保命句。","level":"TOPIK1"},{"text":"버스 정류장이 어디예요?","reading":"beoseu jeongnyujangi eodiyeyo?","zh":"公車站在哪裡？","topic":"求助應急","example":"실례지만 버스 정류장이 어디예요?","example_zh":"不好意思，公車站在哪裡？","note":"정류장＝（公車）站牌；地鐵站是역，兩個字別混用。","level":"TOPIK1"},{"text":"이 버스 명동에 가요?","reading":"i beoseu myeongdonge gayo?","zh":"這班公車有到明洞嗎？","topic":"求助應急","example":"기사님, 이 버스 명동에 가요?","example_zh":"司機大哥，這班公車有到明洞嗎？","note":"上車前和司機確認的救命句；기사님＝司機（尊稱）；地名換掉就能通用。","level":"TOPIK1"},{"text":"여기에서 세워 주세요","reading":"yeogieseo sewo juseyo","zh":"請在這裡停車","topic":"求助應急","example":"기사님, 저 앞에서 세워 주세요.","example_zh":"司機大哥，請在前面停。","note":"세우다＝停（車）；搭計程車下車必說；공항까지 가 주세요＝請到機場。","level":"TOPIK1"},{"text":"머리가 아파요","reading":"meoriga apayo","zh":"我頭痛","topic":"求助應急","example":"어제부터 머리가 아파요.","example_zh":"我從昨天開始頭痛。","note":"아프다→아파요；換배（肚子）、목（喉嚨）、이（牙齒）就能描述各種不舒服。","level":"TOPIK1"},{"text":"감기에 걸렸어요","reading":"gamgie geollyeosseoyo","zh":"我感冒了","topic":"求助應急","example":"감기에 걸렸어요. 약 있어요?","example_zh":"我感冒了，有藥嗎？","note":"感冒的搭配動詞是걸리다（감기에 걸리다）；被關心時回금방 나을 거예요（很快就會好）。","level":"TOPIK1"},{"text":"약국이 어디에 있어요?","reading":"yakgugi eodie isseoyo?","zh":"藥局在哪裡？","topic":"求助應急","example":"이 근처에 약국이 어디에 있어요?","example_zh":"這附近哪裡有藥局？","note":"약국＝藥局；韓國藥局招牌上會寫一個大大的약字；감기약＝感冒藥、두통약＝頭痛藥。","level":"TOPIK1"},{"text":"핸드폰 배터리가 없어요","reading":"haendeupon baeteoriga eopseoyo","zh":"我手機沒電了","topic":"求助應急","example":"핸드폰 배터리가 없어요. 충전기 있어요?","example_zh":"我手機沒電了，你有充電器嗎？","note":"핸드폰＝手機（韓式英語）；충전기＝充電器；完全沒電也說방전됐어요。","level":"TOPIK1"},{"text":"와이파이 있어요?","reading":"waipai isseoyo?","zh":"有Wi-Fi嗎？","topic":"求助應急","example":"여기 와이파이 있어요? 비밀번호가 뭐예요?","example_zh":"這裡有Wi-Fi嗎？密碼是多少？","note":"비밀번호＝密碼；韓國咖啡廳幾乎都有Wi-Fi，密碼常印在收據上。","level":"TOPIK1"},{"text":"여기 자리 있어요?","reading":"yeogi jari isseoyo?","zh":"這裡有人坐嗎？","topic":"求助應急","example":"여기 자리 있어요? — 아니요, 앉으세요.","example_zh":"這位子有人嗎？——沒有，請坐。","note":"자리＝位子；字面問「有位子嗎」實際是問「有人坐嗎」；回答앉으세요＝請坐。","level":"TOPIK1"},{"text":"주말 잘 보냈어요?","reading":"jumal jal bonaesseoyo?","zh":"週末過得好嗎？","topic":"打招呼","example":"주말 잘 보냈어요? — 네, 집에서 푹 쉬었어요.","example_zh":"週末過得好嗎？——嗯，我在家好好休息了。","note":"보내다＝度過；週一見面的必用開場白，過去式-았/었어요的高頻應用。","level":"TOPIK2"},{"text":"잘 다녀왔어요?","reading":"jal danyeowasseoyo?","zh":"你回來啦？一切順利嗎？","topic":"打招呼","example":"여행 잘 다녀왔어요? 사진 보여 주세요.","example_zh":"旅行順利回來啦？照片給我看看。","note":"다녀오다＝去一趟回來；對出差、旅行回來的人一定會說這句。","level":"TOPIK2"},{"text":"어디 갔다 왔어요?","reading":"eodi gatda wasseoyo?","zh":"你去哪裡回來了？","topic":"打招呼","example":"얼굴이 탔네요. 어디 갔다 왔어요?","example_zh":"你曬黑了耶，去了哪裡回來？","note":"갔다 오다＝去了一趟，口語超高頻；回答可說「地點＋에 갔다 왔어요」。","level":"TOPIK2"},{"text":"늦어서 미안해요","reading":"neujeoseo mianhaeyo","zh":"抱歉，我遲到了","topic":"打招呼","example":"늦어서 미안해요. 차가 많이 막혔어요.","example_zh":"抱歉我遲到了，路上塞車塞很久。","note":"-아/어서表原因；道歉、道謝的理由只能用-아서，不能用-니까。","level":"TOPIK2"},{"text":"오래 기다렸어요?","reading":"orae gidaryeosseoyo?","zh":"等很久了嗎？","topic":"打招呼","example":"오래 기다렸어요? — 아니에요, 저도 방금 왔어요.","example_zh":"等很久了嗎？——沒有，我也剛到。","note":"赴約碰面的第一句；標準回答是저도 방금 왔어요（我也剛到）。","level":"TOPIK2"},{"text":"먼저 갈게요","reading":"meonjeo galgeyo","zh":"我先走囉","topic":"打招呼","example":"약속이 있어서 먼저 갈게요.","example_zh":"我有約，先走囉。","note":"-(으)ㄹ게요＝告知並承諾自己要做的事；先離開場合的標準句。","level":"TOPIK2"},{"text":"연락할게요","reading":"yeollakalgeyo","zh":"我再聯絡你","topic":"打招呼","example":"도착하면 바로 연락할게요.","example_zh":"我到了就馬上聯絡你。","note":"연락發音為[열락]；道別時的萬用結尾，表「保持聯絡」的承諾。","level":"TOPIK2"},{"text":"도착하면 연락 주세요","reading":"dochakamyeon yeollak juseyo","zh":"到了請聯絡我","topic":"打招呼","example":"조심히 가고 도착하면 연락 주세요.","example_zh":"路上小心，到了聯絡我。","note":"-(으)면＝如果／…的時候；연락 주세요＝請給我聯絡，關心對方的固定句。","level":"TOPIK2"},{"text":"바빠서 연락 못 했어요","reading":"bappaseo yeollak mot haesseoyo","zh":"因為太忙沒能聯絡你","topic":"打招呼","example":"요즘 바빠서 연락 못 했어요. 미안해요.","example_zh":"最近太忙沒能聯絡你，抱歉。","note":"못＋過去式＝想做卻沒能做到；久未聯絡的朋友見面必備開場。","level":"TOPIK2"},{"text":"잘 도착했어요?","reading":"jal dochakaesseoyo?","zh":"順利到了嗎？","topic":"打招呼","example":"집에 잘 도착했어요? — 네, 방금 들어왔어요.","example_zh":"順利到家了嗎？——嗯，剛進門。","note":"道別後傳訊息關心對方的固定句；도착하다＝到達。","level":"TOPIK2"},{"text":"보고 싶었어요","reading":"bogo sipeosseoyo","zh":"我很想你","topic":"打招呼","example":"오랜만이에요! 진짜 보고 싶었어요.","example_zh":"好久不見！真的很想你。","note":"-고 싶다的過去式＝之前一直想；見到面時說보고 싶었어요最自然。","level":"TOPIK2"},{"text":"얼굴 보니까 좋네요","reading":"eolgul bonikka jonneyo","zh":"見到你本人真好","topic":"打招呼","example":"오랜만에 얼굴 보니까 좋네요.","example_zh":"久違地見到你真好。","note":"-(으)니까在此表「一…就發現／覺得」；-네요表當下的感嘆。","level":"TOPIK2"},{"text":"푹 쉬었어요?","reading":"puk swieosseoyo?","zh":"有好好休息嗎？","topic":"打招呼","example":"연휴에 푹 쉬었어요?","example_zh":"連假有好好休息嗎？","note":"푹＝充分地；푹 쉬다（好好休息）、푹 자다（睡飽）是固定搭配。","level":"TOPIK2"},{"text":"먼저 들어갈게요","reading":"meonjeo deureogalgeyo","zh":"我先回去囉","topic":"打招呼","example":"오늘 재미있었어요. 저 먼저 들어갈게요.","example_zh":"今天很開心，我先回去囉。","note":"들어가다在此指回家；下班或聚會先離開時的客氣說法。","level":"TOPIK2"},{"text":"연휴 잘 보내세요","reading":"yeonhyu jal bonaeseyo","zh":"連假愉快","topic":"打招呼","example":"내일부터 연휴네요. 연휴 잘 보내세요!","example_zh":"明天開始放連假了呢，連假愉快！","note":"「名詞＋잘 보내세요」是祝福句型；주말 잘 보내세요＝週末愉快。","level":"TOPIK2"},{"text":"못 만나서 아쉬웠어요","reading":"mot mannaseo aswiwosseoyo","zh":"沒能見到面好可惜","topic":"打招呼","example":"지난번에 못 만나서 아쉬웠어요.","example_zh":"上次沒能見到面好可惜。","note":"아쉽다＝可惜、捨不得，會話高頻情緒詞；-아서連接原因和感受。","level":"TOPIK2"},{"text":"한국에 온 지 일 년 됐어요","reading":"hanguge on ji il nyeon dwaesseoyo","zh":"我來韓國一年了","topic":"自我介紹","example":"한국에 온 지 일 년 됐어요. 이제 좀 익숙해요.","example_zh":"我來韓國一年了，現在比較習慣了。","note":"-(으)ㄴ 지＋時間＋됐어요＝做某事至今多久了；自我介紹超實用句型。","level":"TOPIK2"},{"text":"작년부터 한국어를 배웠어요","reading":"jangnyeonbuteo hangugeoreul baewosseoyo","zh":"我從去年開始學韓文","topic":"自我介紹","example":"작년부터 한국어를 배웠어요. 아직 어려워요.","example_zh":"我從去年開始學韓文，還是很難。","note":"부터＝從…開始；배우다的過去式是배웠어요。","level":"TOPIK2"},{"text":"대학교에서 한국어를 전공했어요","reading":"daehakgyoeseo hangugeoreul jeongonghaesseoyo","zh":"我大學主修韓文","topic":"自我介紹","example":"저는 대학교에서 한국어를 전공했어요.","example_zh":"我大學主修韓文。","note":"전공＝主修；反問對方可說전공이 뭐예요?（你主修什麼？）。","level":"TOPIK2"},{"text":"한국에서 일하고 싶어요","reading":"hangugeseo ilhago sipeoyo","zh":"我想在韓國工作","topic":"自我介紹","example":"졸업하면 한국에서 일하고 싶어요.","example_zh":"畢業之後我想在韓國工作。","note":"-고 싶다接動詞表願望；聊未來規劃的高頻句。","level":"TOPIK2"},{"text":"한국 친구를 사귀고 싶어요","reading":"hanguk chingureul sagwigo sipeoyo","zh":"我想交韓國朋友","topic":"自我介紹","example":"한국 친구를 사귀고 싶어요. 연락처 알려 주세요.","example_zh":"我想交韓國朋友，告訴我你的聯絡方式吧。","note":"사귀다＝結交／交往，交朋友和談戀愛都用這個字。","level":"TOPIK2"},{"text":"한자를 읽을 수 있어요","reading":"hanjareul ilgeul su isseoyo","zh":"我看得懂漢字","topic":"自我介紹","example":"대만 사람이라서 한자를 읽을 수 있어요.","example_zh":"因為我是台灣人，看得懂漢字。","note":"-(으)ㄹ 수 있다＝能夠；台灣學習者的隱藏優勢，韓國人聽了常常覺得厲害。","level":"TOPIK2"},{"text":"중국어랑 영어를 할 수 있어요","reading":"junggugeorang yeongeoreul hal su isseoyo","zh":"我會說中文和英文","topic":"自我介紹","example":"저는 중국어랑 영어를 할 수 있어요.","example_zh":"我會說中文和英文。","note":"-(이)랑＝和（口語）；語言能力用「語言＋하다＋-ㄹ 수 있다」或할 줄 알다。","level":"TOPIK2"},{"text":"한국에 두 번 가 봤어요","reading":"hanguge du beon ga bwasseoyo","zh":"我去過韓國兩次","topic":"自我介紹","example":"한국에 두 번 가 봤어요. 서울이랑 부산이요.","example_zh":"我去過韓國兩次，首爾和釜山。","note":"-아/어 봤어요＝做過、體驗過，比-ㄴ 적 있다更口語；次數用固有數字＋번。","level":"TOPIK2"},{"text":"서울에서 살아 본 적이 있어요","reading":"seoureseo sara bon jeogi isseoyo","zh":"我在首爾住過","topic":"自我介紹","example":"교환학생 때 서울에서 살아 본 적이 있어요.","example_zh":"當交換學生的時候我在首爾住過。","note":"-아/어 본 적이 있다＝有…的經驗；살다＋아 보다→살아 보다。","level":"TOPIK2"},{"text":"아직 한국에 가 본 적이 없어요","reading":"ajik hanguge ga bon jeogi eopseoyo","zh":"我還沒去過韓國","topic":"自我介紹","example":"아직 한국에 가 본 적이 없어서 꼭 가고 싶어요.","example_zh":"我還沒去過韓國，所以一定想去一次。","note":"經驗的否定用-ㄴ 적이 없어요；아직＝還（沒有）。","level":"TOPIK2"},{"text":"드라마 때문에 한국어를 시작했어요","reading":"deurama ttaemune hangugeoreul sijakaesseoyo","zh":"我因為韓劇開始學韓文","topic":"自我介紹","example":"드라마 때문에 한국어를 시작했어요. 대사를 알아듣고 싶었어요.","example_zh":"我因為韓劇開始學韓文，想聽懂台詞。","note":"名詞＋때문에＝因為…；聊學習動機時最常見的說法。","level":"TOPIK2"},{"text":"내년에 한국에 갈 거예요","reading":"naenyeone hanguge gal geoyeyo","zh":"我明年要去韓國","topic":"自我介紹","example":"내년에 한국에 갈 거예요. 벌써 설레요.","example_zh":"我明年要去韓國，已經開始興奮了。","note":"-(으)ㄹ 거예요＝未來計畫；口語中거예요常唸成[꺼에요]。","level":"TOPIK2"},{"text":"유학을 가고 싶어요","reading":"yuhageul gago sipeoyo","zh":"我想去留學","topic":"自我介紹","example":"기회가 되면 한국으로 유학을 가고 싶어요.","example_zh":"有機會的話我想去韓國留學。","note":"유학을 가다＝去留學；교환학생＝交換學生。","level":"TOPIK2"},{"text":"혼자 살고 있어요","reading":"honja salgo isseoyo","zh":"我自己一個人住","topic":"自我介紹","example":"저는 지금 혼자 살고 있어요.","example_zh":"我現在自己一個人住。","note":"-고 있다＝正在／持續的狀態；혼자＝獨自，聊生活近況常用。","level":"TOPIK2"},{"text":"회사에서 삼 년 일했어요","reading":"hoesaeseo sam nyeon ilhaesseoyo","zh":"我在公司工作了三年","topic":"自我介紹","example":"졸업하고 회사에서 삼 년 일했어요.","example_zh":"畢業後我在公司工作了三年。","note":"「期間＋動詞過去式」描述經歷；年數用漢字數字＋년。","level":"TOPIK2"},{"text":"발음이 어려워서 힘들어요","reading":"bareumi eoryeowoseo himdeureoyo","zh":"因為發音很難所以很辛苦","topic":"自我介紹","example":"한국어는 발음이 어려워서 힘들어요.","example_zh":"韓文發音很難，學起來很辛苦。","note":"어렵다是ㅂ不規則：어려워서；-아/어서連接原因與感受。","level":"TOPIK2"},{"text":"아직 잘 못하지만 열심히 하고 있어요","reading":"ajik jal motajiman yeolsimhi hago isseoyo","zh":"雖然還不太會，但我正在努力","topic":"自我介紹","example":"한국어는 아직 잘 못하지만 열심히 하고 있어요.","example_zh":"韓文我還不太會，但正在努力學。","note":"-지만＝雖然…但是；被稱讚時謙虛回應的好句子。","level":"TOPIK2"},{"text":"토픽 시험을 볼 거예요","reading":"topik siheomeul bol geoyeyo","zh":"我要考TOPIK","topic":"自我介紹","example":"내년에 토픽 시험을 볼 거예요.","example_zh":"我明年要考TOPIK。","note":"「考試」韓文說시험을 보다（看考試）；韓檢就叫토픽（TOPIK）。","level":"TOPIK2"},{"text":"어렸을 때부터 그림을 그렸어요","reading":"eoryeosseul ttaebuteo geurimeul geuryeosseoyo","zh":"我從小就畫畫","topic":"興趣嗜好","example":"어렸을 때부터 그림을 그렸어요.","example_zh":"我從小就開始畫畫了。","note":"어렸을 때＝小時候，聊興趣起源必用；그림을 그리다＝畫畫。","level":"TOPIK2"},{"text":"요즘 기타를 배우고 있어요","reading":"yojeum gitareul baeugo isseoyo","zh":"我最近在學吉他","topic":"興趣嗜好","example":"요즘 기타를 배우고 있어요. 아직 초보예요.","example_zh":"我最近在學吉他，還是新手。","note":"요즘＋-고 있다是聊近況的萬用開頭；초보＝新手。","level":"TOPIK2"},{"text":"이 드라마 봤어요?","reading":"i deurama bwasseoyo?","zh":"這部劇你看過嗎？","topic":"興趣嗜好","example":"이 드라마 봤어요? 요즘 완전 인기예요.","example_zh":"這部劇你看過嗎？最近超紅的。","note":"過去式봤어요?在此＝看過了沒；追劇話題的開場句。","level":"TOPIK2"},{"text":"어제 콘서트에 갔다 왔어요","reading":"eoje konseoteue gatda wasseoyo","zh":"我昨天去了演唱會","topic":"興趣嗜好","example":"어제 콘서트에 갔다 왔어요. 목이 다 쉬었어요.","example_zh":"我昨天去了演唱會，嗓子都喊啞了。","note":"갔다 오다＝去了一趟回來；分享行程用過去式갔다 왔어요。","level":"TOPIK2"},{"text":"콘서트에 가 본 적 있어요?","reading":"konseoteue ga bon jeok isseoyo?","zh":"你去過演唱會嗎？","topic":"興趣嗜好","example":"콘서트에 가 본 적 있어요? — 네, 작년에 가 봤어요.","example_zh":"你去過演唱會嗎？——有，去年去過。","note":"口語中적이的이常省略：가 본 적 있어요?；回答用가 봤어요。","level":"TOPIK2"},{"text":"직접 만나 보고 싶어요","reading":"jikjeop manna bogo sipeoyo","zh":"想親眼見到本人","topic":"興趣嗜好","example":"최애를 직접 만나 보고 싶어요.","example_zh":"好想親眼見到我的本命。","note":"직접＝親自；-아/어 보고 싶다＝想試著做做看，願望更委婉。","level":"TOPIK2"},{"text":"피아노를 칠 수 있어요","reading":"pianoreul chil su isseoyo","zh":"我會彈鋼琴","topic":"興趣嗜好","example":"피아노를 칠 수 있어요. 어릴 때 배웠어요.","example_zh":"我會彈鋼琴，小時候學過。","note":"彈奏鍵盤、弦樂器用치다（피아노/기타를 치다）；管樂器用불다。","level":"TOPIK2"},{"text":"재미있어서 시간 가는 줄 몰랐어요","reading":"jaemiisseoseo sigan ganeun jul mollasseoyo","zh":"太有趣了，不知不覺時間就過了","topic":"興趣嗜好","example":"게임이 재미있어서 시간 가는 줄 몰랐어요.","example_zh":"遊戲太好玩，不知不覺時間就過了。","note":"시간 가는 줄 모르다＝忘了時間，超常用慣用語；形容投入某事。","level":"TOPIK2"},{"text":"스트레스 받아서 운동을 시작했어요","reading":"seuteureseu badaseo undongeul sijakaesseoyo","zh":"因為壓力大開始運動","topic":"興趣嗜好","example":"요즘 스트레스 받아서 운동을 시작했어요.","example_zh":"最近壓力大，所以開始運動了。","note":"스트레스 받다＝有壓力、스트레스 풀다＝紓壓，都是高頻搭配。","level":"TOPIK2"},{"text":"그 영화 진짜 재미있었어요","reading":"geu yeonghwa jinjja jaemiisseosseoyo","zh":"那部電影真的很好看","topic":"興趣嗜好","example":"어제 본 그 영화 진짜 재미있었어요.","example_zh":"昨天看的那部電影真的很好看。","note":"評價看過的作品一定用過去式재미있었어요；진짜＝真的（口語）。","level":"TOPIK2"},{"text":"결말이 슬퍼서 울었어요","reading":"gyeolmari seulpeoseo ureosseoyo","zh":"結局太難過我哭了","topic":"興趣嗜好","example":"드라마 결말이 슬퍼서 울었어요.","example_zh":"電視劇結局太悲傷，我哭了。","note":"슬프다是으不規則：슬퍼서；결말＝結局，聊劇聊電影必備。","level":"TOPIK2"},{"text":"팬미팅에 가 보고 싶어요","reading":"paenmitinge ga bogo sipeoyo","zh":"我想去看看粉絲見面會","topic":"興趣嗜好","example":"언젠가 팬미팅에 가 보고 싶어요.","example_zh":"總有一天想去一次粉絲見面會。","note":"팬미팅＝粉絲見面會；언젠가＝總有一天，聊夢想清單常用。","level":"TOPIK2"},{"text":"캠핑해 본 적 있어요?","reading":"kaempinghae bon jeok isseoyo?","zh":"你露營過嗎？","topic":"興趣嗜好","example":"캠핑해 본 적 있어요? 요즘 유행이잖아요.","example_zh":"你露營過嗎？最近很流行嘛。","note":"하다類動詞的經驗＝해 본 적 있다；캠핑（露營）在韓國正流行。","level":"TOPIK2"},{"text":"새로운 취미를 만들고 싶어요","reading":"saeroun chwimireul mandeulgo sipeoyo","zh":"我想培養新的興趣","topic":"興趣嗜好","example":"올해는 새로운 취미를 만들고 싶어요.","example_zh":"今年想培養一個新的興趣。","note":"취미를 만들다＝培養興趣的口語說法；새로운＝新的。","level":"TOPIK2"},{"text":"요즘 이 노래에 빠졌어요","reading":"yojeum i noraee ppajyeosseoyo","zh":"我最近迷上這首歌","topic":"興趣嗜好","example":"요즘 이 노래에 빠졌어요. 매일 들어요.","example_zh":"我最近迷上這首歌，每天都聽。","note":"-에 빠지다＝陷入、迷上；聊追星追劇的超高頻表達。","level":"TOPIK2"},{"text":"기대돼요","reading":"gidaedwaeyo","zh":"好期待","topic":"興趣嗜好","example":"다음 주에 콘서트 가요. 완전 기대돼요!","example_zh":"下週要去演唱會，超期待的！","note":"기대되다＝令人期待；過去式기대됐어요，加強語氣說완전/진짜 기대돼요。","level":"TOPIK2"},{"text":"저도 해 보고 싶어요","reading":"jeodo hae bogo sipeoyo","zh":"我也想試試看","topic":"興趣嗜好","example":"와, 재미있겠네요. 저도 해 보고 싶어요.","example_zh":"哇，聽起來很好玩，我也想試試看。","note":"聽別人分享興趣時的萬用回應；-아/어 보다＝嘗試。","level":"TOPIK2"},{"text":"내일 뭐 할 거예요?","reading":"naeil mwo hal geoyeyo?","zh":"你明天要做什麼？","topic":"邀約出遊","example":"내일 뭐 할 거예요? 시간 있으면 같이 놀아요.","example_zh":"你明天要做什麼？有空的話一起玩吧。","note":"邀約前的試探句；未來式-(으)ㄹ 거예요的疑問用法。","level":"TOPIK2"},{"text":"주말에 약속 있어요?","reading":"jumare yaksok isseoyo?","zh":"你週末有約嗎？","topic":"邀約出遊","example":"이번 주말에 약속 있어요? — 아직 없어요.","example_zh":"這週末你有約嗎？——還沒有。","note":"약속＝約好的事；先問有沒有約再開口邀請，是韓國人的習慣流程。","level":"TOPIK2"},{"text":"같이 갈 수 있어요?","reading":"gachi gal su isseoyo?","zh":"你可以一起去嗎？","topic":"邀約出遊","example":"토요일에 전시회 가는데 같이 갈 수 있어요?","example_zh":"星期六要去看展覽，你可以一起去嗎？","note":"-(으)ㄹ 수 있어요?問對方能不能；同意就回答갈 수 있어요/좋아요。","level":"TOPIK2"},{"text":"저도 가고 싶어요","reading":"jeodo gago sipeoyo","zh":"我也想去","topic":"邀約出遊","example":"거기 좋다고 들었어요. 저도 가고 싶어요!","example_zh":"聽說那裡很棒，我也想去！","note":"저도＝我也；被邀請時最自然的正面回應。","level":"TOPIK2"},{"text":"오늘은 좀 힘들 것 같아요","reading":"oneureun jom himdeul geot gatayo","zh":"今天可能不太行","topic":"邀約出遊","example":"미안해요, 오늘은 좀 힘들 것 같아요.","example_zh":"抱歉，今天可能不太行。","note":"-(으)ㄹ 것 같다婉轉推測；拒絕邀約時比안 돼요客氣得多。","level":"TOPIK2"},{"text":"일이 있어서 못 가요","reading":"iri isseoseo mot gayo","zh":"因為有事去不了","topic":"邀約出遊","example":"그날은 일이 있어서 못 가요. 미안해요.","example_zh":"那天我有事去不了，抱歉。","note":"拒絕的萬用理由句：理由-아서＋못＋動詞；일이 있다＝有事。","level":"TOPIK2"},{"text":"갑자기 일이 생겼어요","reading":"gapjagi iri saenggyeosseoyo","zh":"我突然有事","topic":"邀約出遊","example":"미안해요, 갑자기 일이 생겨서 오늘 못 가요.","example_zh":"抱歉，我突然有事，今天去不了了。","note":"생기다＝發生、冒出來；臨時取消約會的標準說法。","level":"TOPIK2"},{"text":"다음에 꼭 갈게요","reading":"daeume kkok galgeyo","zh":"下次一定去","topic":"邀約出遊","example":"오늘은 안 되지만 다음에 꼭 갈게요.","example_zh":"今天不行，但下次一定去。","note":"꼭＝一定；-(으)ㄹ게요表對對方的承諾，補救拒絕的氣氛。","level":"TOPIK2"},{"text":"시간 되면 같이 가요","reading":"sigan doemyeon gachi gayo","zh":"有空的話一起去吧","topic":"邀約出遊","example":"다음 주에 시간 되면 같이 가요.","example_zh":"下週有空的話一起去吧。","note":"시간(이) 되다＝有空、時間允許；比시간 있으면更常聽到。","level":"TOPIK2"},{"text":"비가 오니까 다음에 가요","reading":"biga onikka daeume gayo","zh":"下雨了，我們下次再去吧","topic":"邀約出遊","example":"오늘은 비가 오니까 다음에 가요.","example_zh":"今天下雨，我們下次再去吧。","note":"後面接提議或命令時，原因要用-(으)니까，不能用-아서——重要文法點。","level":"TOPIK2"},{"text":"어디 가고 싶은 데 있어요?","reading":"eodi gago sipeun de isseoyo?","zh":"有想去的地方嗎？","topic":"邀約出遊","example":"주말에 어디 가고 싶은 데 있어요?","example_zh":"週末有想去的地方嗎？","note":"데＝地方（곳的口語）；-고 싶은＋名詞＝想…的…。","level":"TOPIK2"},{"text":"거기 가 본 적 있어요?","reading":"geogi ga bon jeok isseoyo?","zh":"你去過那裡嗎？","topic":"邀約出遊","example":"거기 가 본 적 있어요? — 아니요, 처음 가 봐요.","example_zh":"你去過那裡嗎？——沒有，第一次去。","note":"規劃行程時互相確認經驗；回答처음이에요＝第一次。","level":"TOPIK2"},{"text":"예약했어요","reading":"yeyakaesseoyo","zh":"我預約好了","topic":"邀約出遊","example":"식당은 일곱 시로 예약했어요.","example_zh":"餐廳我訂了七點。","note":"예약하다＝預約訂位；時間後面接(으)로表示「訂在幾點」。","level":"TOPIK2"},{"text":"제가 예약할게요","reading":"jega yeyakalgeyo","zh":"我來預約","topic":"邀約出遊","example":"그 식당 인기 많으니까 제가 미리 예약할게요.","example_zh":"那家餐廳很熱門，我先來訂位。","note":"제가＋-(으)ㄹ게요＝我來做…；主動攬下任務的句型。","level":"TOPIK2"},{"text":"표를 미리 살까요?","reading":"pyoreul miri salkkayo?","zh":"要先買票嗎？","topic":"邀約出遊","example":"주말이라 사람 많을 것 같은데 표를 미리 살까요?","example_zh":"週末人應該很多，要先買票嗎？","note":"-(으)ㄹ까요?＝要不要…？提議句型；미리＝事先。","level":"TOPIK2"},{"text":"늦을 것 같아요","reading":"neujeul geot gatayo","zh":"我可能會遲到","topic":"邀約出遊","example":"미안해요, 십 분 정도 늦을 것 같아요.","example_zh":"抱歉，我大概會晚十分鐘。","note":"-(으)ㄹ 것 같아요對未來的推測；先報備遲到是基本禮貌。","level":"TOPIK2"},{"text":"재미있을 것 같아요","reading":"jaemiisseul geot gatayo","zh":"感覺會很好玩","topic":"邀約出遊","example":"좋아요, 재미있을 것 같아요!","example_zh":"好啊，感覺會很好玩！","note":"-(으)ㄹ 것 같아요推測未來；答應邀約時加這句氣氛更好。","level":"TOPIK2"},{"text":"이거 먹어 본 적 있어요?","reading":"igeo meogeo bon jeok isseoyo?","zh":"這個你吃過嗎？","topic":"吃飯聊天","example":"이거 먹어 본 적 있어요? 대만 음식이에요.","example_zh":"這個你吃過嗎？是台灣菜。","note":"먹어 보다＝吃看看；介紹台灣美食給韓國朋友的必用句。","level":"TOPIK2"},{"text":"삼겹살 먹어 봤어요?","reading":"samgyeopsal meogeo bwasseoyo?","zh":"你吃過烤五花肉嗎？","topic":"吃飯聊天","example":"삼겹살 먹어 봤어요? 소주랑 같이 먹으면 최고예요.","example_zh":"你吃過烤五花肉嗎？配燒酒一起吃最棒。","note":"-아/어 봤어요?＝吃過沒？比먹어 본 적 있어요?更簡短口語。","level":"TOPIK2"},{"text":"한번 먹어 보세요","reading":"hanbeon meogeo boseyo","zh":"吃吃看吧","topic":"吃飯聊天","example":"이거 진짜 맛있어요. 한번 먹어 보세요.","example_zh":"這個真的很好吃，吃吃看吧。","note":"-아/어 보세요＝請試試看；한번＝（試）一次，讓語氣更輕鬆。","level":"TOPIK2"},{"text":"맛있어서 또 먹고 싶어요","reading":"masisseoseo tto meokgo sipeoyo","zh":"太好吃了還想再吃","topic":"吃飯聊天","example":"지난번 그 집 너무 맛있어서 또 먹고 싶어요.","example_zh":"上次那家太好吃了，我還想再去吃。","note":"또＝再、又；-아서＋-고 싶다把理由和願望串起來。","level":"TOPIK2"},{"text":"배불러서 더 못 먹겠어요","reading":"baebulleoseo deo mot meokgesseoyo","zh":"太飽了，吃不下了","topic":"吃飯聊天","example":"잘 먹었어요. 배불러서 더 못 먹겠어요.","example_zh":"我吃得很好，太飽了吃不下了。","note":"-겠어요在此表「（看來）沒辦法」；배부르다＝飽。","level":"TOPIK2"},{"text":"너무 매워서 물을 많이 마셨어요","reading":"neomu maewoseo mureul mani masyeosseoyo","zh":"太辣了我喝了好多水","topic":"吃飯聊天","example":"떡볶이가 너무 매워서 물을 많이 마셨어요.","example_zh":"辣炒年糕太辣了，我喝了好多水。","note":"맵다是ㅂ不規則：매워서；韓國的「辣」常是甜辣，跟台灣的辣不同。","level":"TOPIK2"},{"text":"점심 뭐 먹었어요?","reading":"jeomsim mwo meogeosseoyo?","zh":"你中午吃了什麼？","topic":"吃飯聊天","example":"점심 뭐 먹었어요? — 김치찌개 먹었어요.","example_zh":"你中午吃了什麼？——吃了泡菜鍋。","note":"跟同事朋友閒聊的高頻句；把점심換成아침/저녁就能套用。","level":"TOPIK2"},{"text":"아직 안 먹었어요","reading":"ajik an meogeosseoyo","zh":"我還沒吃","topic":"吃飯聊天","example":"밥 먹었어요? — 아직 안 먹었어요.","example_zh":"吃飯了嗎？——還沒吃。","note":"안＋過去式＝還沒做；也可只說아직이요（還沒）。","level":"TOPIK2"},{"text":"여기 와 본 적 있어요?","reading":"yeogi wa bon jeok isseoyo?","zh":"你來過這裡嗎？","topic":"吃飯聊天","example":"여기 와 본 적 있어요? — 아니요, 처음 와 봐요.","example_zh":"你來過這裡嗎？——沒有，第一次來。","note":"오다＋아 보다→와 보다；進店裡坐下後的自然開場。","level":"TOPIK2"},{"text":"이 집 진짜 유명해요","reading":"i jip jinjja yumyeonghaeyo","zh":"這家店超有名","topic":"吃飯聊天","example":"이 집 김치찌개가 진짜 유명해요.","example_zh":"這家店的泡菜鍋超有名。","note":"口語稱餐廳為이 집（這家）；맛집＝美食名店。","level":"TOPIK2"},{"text":"제가 주문할게요","reading":"jega jumunhalgeyo","zh":"我來點餐","topic":"吃飯聊天","example":"메뉴 정했어요? 제가 주문할게요.","example_zh":"決定好餐點了嗎？我來點餐。","note":"주문하다＝點餐；呼喚店員說저기요或여기요。","level":"TOPIK2"},{"text":"하나 더 시킬까요?","reading":"hana deo sikilkkayo?","zh":"要再點一份嗎？","topic":"吃飯聊天","example":"양이 좀 적네요. 하나 더 시킬까요?","example_zh":"份量有點少耶，要再點一份嗎？","note":"더＝再、更；數量＋더 시키다＝加點。","level":"TOPIK2"},{"text":"단 거 먹고 싶어요","reading":"dan geo meokgo sipeoyo","zh":"我想吃甜的","topic":"吃飯聊天","example":"스트레스 받아서 단 거 먹고 싶어요.","example_zh":"壓力好大，想吃甜的。","note":"形容詞＋ㄴ 거＝…的東西：단 거/매운 거/뜨거운 거。","level":"TOPIK2"},{"text":"배고파서 죽겠어요","reading":"baegopaseo jukgesseoyo","zh":"我快餓死了","topic":"吃飯聊天","example":"배고파서 죽겠어요. 빨리 주문해요.","example_zh":"我快餓死了，快點餐吧。","note":"-아/어서 죽겠다＝…死了，誇張表達；힘들어 죽겠어요＝累死了。","level":"TOPIK2"},{"text":"입에 맞아요?","reading":"ibe majayo?","zh":"合你的口味嗎？","topic":"吃飯聊天","example":"한국 음식이 입에 맞아요? — 네, 다 맛있어요.","example_zh":"韓國菜合你口味嗎？——嗯，都很好吃。","note":"입에 맞다＝合口味；請客或帶朋友吃飯時的關心句。","level":"TOPIK2"},{"text":"생각보다 맵지 않아요","reading":"saenggakboda maepji anayo","zh":"比想像中不辣","topic":"吃飯聊天","example":"이거 생각보다 맵지 않아요. 먹어 보세요.","example_zh":"這個比想像中不辣，吃吃看。","note":"名詞＋보다＝比…；-지 않다是안的完整形，語氣稍正式。","level":"TOPIK2"},{"text":"발음이 정말 좋아졌어요","reading":"bareumi jeongmal joajyeosseoyo","zh":"你的發音真的變好了","topic":"稱讚回應","example":"발음이 정말 좋아졌어요. 연습 많이 했죠?","example_zh":"你的發音真的變好了，練習很多吧？","note":"形容詞＋아/어지다＝變得…；過去式表示變化已經發生。","level":"TOPIK2"},{"text":"한국어 많이 늘었네요","reading":"hangugeo mani neureonneyo","zh":"你的韓文進步好多耶","topic":"稱讚回應","example":"몇 달 만에 한국어 많이 늘었네요!","example_zh":"才幾個月你的韓文就進步好多耶！","note":"늘다＝進步、增長；-네요表當場發現的感嘆。","level":"TOPIK2"},{"text":"열심히 연습했어요","reading":"yeolsimhi yeonseupaesseoyo","zh":"我很認真練習了","topic":"稱讚回應","example":"감사해요. 매일 열심히 연습했어요.","example_zh":"謝謝，我每天都很認真練習。","note":"被稱讚時說明過程的回應；열심히＝努力地。","level":"TOPIK2"},{"text":"아직 부족해서 더 연습해야 해요","reading":"ajik bujokaeseo deo yeonseupaeya haeyo","zh":"還不夠好，得再多練習","topic":"稱讚回應","example":"아니에요, 아직 부족해서 더 연습해야 해요.","example_zh":"沒有啦，還不夠好，得再多練習。","note":"-아/어야 하다＝必須；부족하다＝不足，謙虛回應的標準句。","level":"TOPIK2"},{"text":"그렇게 말해 줘서 고마워요","reading":"geureoke malhae jwoseo gomawoyo","zh":"謝謝你這麼說","topic":"稱讚回應","example":"그렇게 말해 줘서 고마워요. 힘이 나요.","example_zh":"謝謝你這麼說，我有力量了。","note":"-아/어 줘서 고마워요＝謝謝你為我…；힘이 나다＝來勁、得到鼓勵。","level":"TOPIK2"},{"text":"칭찬해 주셔서 감사해요","reading":"chingchanhae jusyeoseo gamsahaeyo","zh":"謝謝您的稱讚","topic":"稱讚回應","example":"칭찬해 주셔서 감사해요. 더 열심히 할게요.","example_zh":"謝謝您的稱讚，我會更努力的。","note":"주셔서是줘서的敬語形；對長輩、上級用這句更得體。","level":"TOPIK2"},{"text":"어떻게 그렇게 잘해요?","reading":"eotteoke geureoke jalhaeyo?","zh":"你怎麼那麼厲害？","topic":"稱讚回應","example":"어떻게 그렇게 요리를 잘해요?","example_zh":"你怎麼那麼會做菜？","note":"어떻게 그렇게＋動詞＝怎麼能那麼…；由衷佩服的稱讚句。","level":"TOPIK2"},{"text":"저는 그렇게 못 해요","reading":"jeoneun geureoke mot haeyo","zh":"我做不到那樣","topic":"稱讚回應","example":"대단해요. 저는 그렇게 못 해요.","example_zh":"好厲害，我做不到那樣。","note":"못 해요分開寫強調「做不到」；搭配대단해요稱讚對方。","level":"TOPIK2"},{"text":"저도 배우고 싶어요","reading":"jeodo baeugo sipeoyo","zh":"我也好想學","topic":"稱讚回應","example":"너무 잘하네요. 저도 배우고 싶어요.","example_zh":"你太厲害了，我也好想學。","note":"稱讚之後接這句，話題自然延續；對方通常會說가르쳐 줄게요。","level":"TOPIK2"},{"text":"오늘 스타일이 잘 어울려요","reading":"oneul seutairi jal eoullyeoyo","zh":"今天的造型很適合你","topic":"稱讚回應","example":"오늘 스타일이 잘 어울려요. 어디 가요?","example_zh":"今天的造型很適合你，要去哪裡？","note":"어울리다＝適合、相稱；稱讚穿搭比예뻐요更有層次的說法。","level":"TOPIK2"},{"text":"머리 잘랐어요?","reading":"meori jallasseoyo?","zh":"你剪頭髮了？","topic":"稱讚回應","example":"머리 잘랐어요? 잘 어울려요!","example_zh":"你剪頭髮了？很適合你！","note":"머리(를) 자르다＝剪頭髮；注意到對方的變化本身就是稱讚。","level":"TOPIK2"},{"text":"사진보다 실물이 더 멋있어요","reading":"sajinboda silmuri deo meosisseoyo","zh":"你本人比照片還帥","topic":"稱讚回應","example":"와, 사진보다 실물이 더 멋있어요.","example_zh":"哇，你本人比照片還帥。","note":"실물＝本人、實物；也可說실물이 더 예뻐요（本人更漂亮）。","level":"TOPIK2"},{"text":"요리를 진짜 잘하시네요","reading":"yorireul jinjja jalhasineyo","zh":"你菜做得真好","topic":"稱讚回應","example":"이거 직접 만들었어요? 요리를 진짜 잘하시네요.","example_zh":"這是你自己做的？你菜做得真好。","note":"-시-表尊敬＋-네요感嘆；「名詞＋를 잘하다」＝擅長…。","level":"TOPIK2"},{"text":"어디서 샀어요?","reading":"eodiseo sasseoyo?","zh":"在哪裡買的？","topic":"稱讚回應","example":"가방 예쁘네요. 어디서 샀어요?","example_zh":"包包好好看，在哪裡買的？","note":"稱讚完對方的東西後最自然的追問；어디서＝어디에서的縮寫。","level":"TOPIK2"},{"text":"잘될 거예요","reading":"jaldoel geoyeyo","zh":"會順利的","topic":"稱讚回應","example":"너무 걱정하지 마세요. 잘될 거예요.","example_zh":"別太擔心，會順利的。","note":"잘되다＝順利、成功；-(으)ㄹ 거예요在此表推測，鼓勵人的萬用句。","level":"TOPIK2"},{"text":"잘돼서 다행이에요","reading":"jaldwaeseo dahaengieyo","zh":"順利真是太好了","topic":"稱讚回應","example":"면접에 붙었어요? 잘돼서 다행이에요.","example_zh":"你面試上了？順利真是太好了。","note":"다행이다＝幸好、萬幸；替對方鬆一口氣時說。","level":"TOPIK2"},{"text":"정말 잘했어요","reading":"jeongmal jalhaesseoyo","zh":"你做得真好","topic":"稱讚回應","example":"발표 정말 잘했어요. 최고였어요.","example_zh":"你的報告做得真好，超棒的。","note":"잘했어요誇獎已完成的事；잘하네요誇的是能力本身。","level":"TOPIK2"},{"text":"많이 연습하니까 늘었어요","reading":"mani yeonseupanikka neureosseoyo","zh":"因為常練習所以進步了","topic":"稱讚回應","example":"비결이 뭐예요? — 그냥 많이 연습하니까 늘었어요.","example_zh":"祕訣是什麼？——就是常練習所以進步了。","note":"-(으)니까說明理由；비결＝祕訣，回答時謙虛歸功於練習。","level":"TOPIK2"},{"text":"어제 뭐 했어요?","reading":"eoje mwo haesseoyo?","zh":"你昨天做了什麼？","topic":"日常閒聊","example":"어제 뭐 했어요? — 그냥 집에 있었어요.","example_zh":"你昨天做了什麼？——就待在家裡。","note":"過去式閒聊的萬用開場；그냥＝就、只是，會話膠水詞。","level":"TOPIK2"},{"text":"집에서 푹 쉬었어요","reading":"jibeseo puk swieosseoyo","zh":"我在家好好休息了","topic":"日常閒聊","example":"주말에는 집에서 푹 쉬었어요.","example_zh":"週末我就在家好好休息了。","note":"쉬다過去式쉬었어요；집순이/집돌이＝愛宅在家的女生／男生。","level":"TOPIK2"},{"text":"어제 늦게 잤어요","reading":"eoje neutge jasseoyo","zh":"我昨天很晚睡","topic":"日常閒聊","example":"어제 늦게 자서 지금 너무 졸려요.","example_zh":"昨天太晚睡，現在好睏。","note":"늦게＝晚地；자다過去式잤어요；졸리다＝睏。","level":"TOPIK2"},{"text":"잠을 못 자서 피곤해요","reading":"jameul mot jaseo pigonhaeyo","zh":"沒睡好所以很累","topic":"日常閒聊","example":"요즘 잠을 못 자서 피곤해요.","example_zh":"最近都睡不好，好累。","note":"잠을 자다＝睡覺；못 자다＝睡不著／沒能睡，抱怨近況高頻句。","level":"TOPIK2"},{"text":"일이 많아서 정신이 없어요","reading":"iri manaseo jeongsini eopseoyo","zh":"事情太多，忙翻了","topic":"日常閒聊","example":"이번 주는 일이 많아서 정신이 없어요.","example_zh":"這週事情太多，忙得暈頭轉向。","note":"정신이 없다＝忙亂到沒有魂，超高頻慣用語。","level":"TOPIK2"},{"text":"주말에 뭐 할 거예요?","reading":"jumare mwo hal geoyeyo?","zh":"你週末要做什麼？","topic":"日常閒聊","example":"주말에 뭐 할 거예요? — 아직 계획 없어요.","example_zh":"你週末要做什麼？——還沒有計畫。","note":"未來式閒聊萬用句；回答可用계획 없어요（沒計畫）。","level":"TOPIK2"},{"text":"아무것도 안 하고 싶어요","reading":"amugeotdo an hago sipeoyo","zh":"我什麼都不想做","topic":"日常閒聊","example":"너무 피곤해서 아무것도 안 하고 싶어요.","example_zh":"太累了，什麼都不想做。","note":"아무것도＋否定＝什麼都（不）…；躺平心情的標準表達。","level":"TOPIK2"},{"text":"곧 휴가라서 기분이 좋아요","reading":"got hyugaraseo gibuni joayo","zh":"快放假了所以心情很好","topic":"日常閒聊","example":"곧 휴가라서 기분이 좋아요.","example_zh":"快放假了，心情很好。","note":"名詞＋(이)라서＝因為是…；곧＝馬上、不久後。","level":"TOPIK2"},{"text":"비가 올 것 같아요","reading":"biga ol geot gatayo","zh":"好像要下雨了","topic":"日常閒聊","example":"하늘 좀 보세요. 비가 올 것 같아요.","example_zh":"你看天空，好像要下雨了。","note":"-(으)ㄹ 것 같다對未來的推測；天氣話題永遠safe。","level":"TOPIK2"},{"text":"우산을 안 가져와서 걱정이에요","reading":"usaneul an gajyeowaseo geokjeongieyo","zh":"沒帶傘，好擔心","topic":"日常閒聊","example":"우산을 안 가져와서 걱정이에요.","example_zh":"我沒帶傘出來，好擔心。","note":"가져오다＝帶來；걱정이에요＝（這件事）令人擔心。","level":"TOPIK2"},{"text":"요즘 날씨가 이상해요","reading":"yojeum nalssiga isanghaeyo","zh":"最近天氣好奇怪","topic":"日常閒聊","example":"요즘 날씨가 이상해요. 아침엔 춥고 낮엔 더워요.","example_zh":"最近天氣好奇怪，早上冷中午熱。","note":"이상하다＝奇怪；抱怨天氣是萬國通用的閒聊起手式。","level":"TOPIK2"},{"text":"살이 좀 쪘어요","reading":"sari jom jjyeosseoyo","zh":"我胖了一點","topic":"日常閒聊","example":"요즘 맛있는 걸 많이 먹어서 살이 좀 쪘어요.","example_zh":"最近吃太多好吃的，胖了一點。","note":"살이 찌다＝變胖、살이 빠지다＝變瘦；聊身材的高頻搭配。","level":"TOPIK2"},{"text":"다이어트를 시작할 거예요","reading":"daieoteureul sijakal geoyeyo","zh":"我要開始減肥了","topic":"日常閒聊","example":"내일부터 다이어트를 시작할 거예요. 진짜예요!","example_zh":"我明天開始要減肥了，是真的！","note":"다이어트＝減肥（外來語）；「明天開始減肥」在韓國也是經典玩笑。","level":"TOPIK2"},{"text":"그럴 수도 있어요","reading":"geureol sudo isseoyo","zh":"也有可能啦","topic":"日常閒聊","example":"그 사람 바빠서 못 온 거 아니에요? — 그럴 수도 있어요.","example_zh":"他是不是太忙才沒來？——也有可能啦。","note":"-(으)ㄹ 수도 있다＝也有可能；不把話說死的萬用回應。","level":"TOPIK2"},{"text":"제 생각에는 좀 비싼 것 같아요","reading":"je saenggageneun jom bissan geot gatayo","zh":"我覺得有點貴","topic":"日常閒聊","example":"이 가격 어때요? — 제 생각에는 좀 비싼 것 같아요.","example_zh":"這價格怎麼樣？——我覺得有點貴。","note":"제 생각에는＝在我看來，表達意見的開頭；것 같다讓語氣不武斷。","level":"TOPIK2"},{"text":"저는 괜찮은 것 같아요","reading":"jeoneun gwaenchaneun geot gatayo","zh":"我覺得還不錯","topic":"日常閒聊","example":"이 식당 어때요? — 저는 괜찮은 것 같아요.","example_zh":"這家餐廳怎麼樣？——我覺得還不錯。","note":"韓國人表達意見幾乎都加것 같아요緩和語氣，直說괜찮아요反而少見。","level":"TOPIK2"},{"text":"시간이 진짜 빨리 가네요","reading":"sigani jinjja ppalli ganeyo","zh":"時間過得好快喔","topic":"日常閒聊","example":"벌써 칠월이에요. 시간이 진짜 빨리 가네요.","example_zh":"已經七月了，時間過得好快喔。","note":"시간이 가다＝時間流逝；配벌써（已經）使用，感嘆萬用句。","level":"TOPIK2"},{"text":"뭐 해?","reading":"mwo hae?","zh":"在幹嘛？","topic":"網路聊天用語","example":"뭐 해? 심심하면 통화할래?","example_zh":"在幹嘛？無聊的話要通話嗎？","note":"반말，開啟聊天話匣子的國民句；敬語是뭐 해요?。","level":"TOPIK2"},{"text":"지금 통화할 수 있어요?","reading":"jigeum tonghwahal su isseoyo?","zh":"現在方便講電話嗎？","topic":"網路聊天用語","example":"지금 통화할 수 있어요? — 네, 괜찮아요.","example_zh":"現在方便講電話嗎？——可以，沒問題。","note":"통화하다＝通話；打電話前先傳訊確認是韓國人的禮貌。","level":"TOPIK2"},{"text":"나중에 전화할게요","reading":"najunge jeonhwahalgeyo","zh":"我晚點打給你","topic":"網路聊天用語","example":"지금 회의 중이라서 나중에 전화할게요.","example_zh":"我現在在開會，晚點打給你。","note":"나중에＝之後、晚點；-(으)ㄹ게요表承諾回電。","level":"TOPIK2"},{"text":"메시지 봤어요?","reading":"mesiji bwasseoyo?","zh":"你看到訊息了嗎？","topic":"網路聊天用語","example":"어제 보낸 메시지 봤어요?","example_zh":"我昨天傳的訊息你看了嗎？","note":"追問已讀不回時用；更直接的說法是왜 읽씹해요?（幹嘛已讀不回）。","level":"TOPIK2"},{"text":"방금 봤어요","reading":"banggeum bwasseoyo","zh":"我剛剛才看到","topic":"網路聊天用語","example":"미안해요, 메시지 방금 봤어요.","example_zh":"抱歉，訊息我剛剛才看到。","note":"방금＝剛剛；回覆遲了先說這句化解尷尬。","level":"TOPIK2"},{"text":"배터리가 없어서 못 봤어요","reading":"baeteoriga eopseoseo mot bwasseoyo","zh":"手機沒電所以沒看到","topic":"網路聊天用語","example":"폰 배터리가 없어서 못 봤어요. 미안해요.","example_zh":"手機沒電所以沒看到，抱歉。","note":"배터리가 없다＝沒電；已讀不回的經典藉口，폰＝手機（口語）。","level":"TOPIK2"},{"text":"사진 보내 줄 수 있어요?","reading":"sajin bonae jul su isseoyo?","zh":"可以傳照片給我嗎？","topic":"網路聊天用語","example":"아까 찍은 사진 보내 줄 수 있어요?","example_zh":"剛剛拍的照片可以傳給我嗎？","note":"-아/어 줄 수 있어요?＝可以幫我…嗎？請託句型；보내다＝傳送。","level":"TOPIK2"},{"text":"링크 보낼게요","reading":"ringkeu bonaelgeyo","zh":"我傳連結給你","topic":"網路聊天用語","example":"그 가게 링크 보낼게요. 확인해 보세요.","example_zh":"我傳那家店的連結給你，看看吧。","note":"링크＝link；聊天分享資訊的高頻句。","level":"TOPIK2"},{"text":"이따가 연락할게요","reading":"ittaga yeollakalgeyo","zh":"待會聯絡你","topic":"網路聊天用語","example":"지금 좀 바빠요. 이따가 연락할게요.","example_zh":"我現在有點忙，待會聯絡你。","note":"이따가＝待會（今天之內）；나중에則是不確定的「之後」。","level":"TOPIK2"},{"text":"와이파이가 안 돼요","reading":"waipaiga an dwaeyo","zh":"WiFi連不上","topic":"網路聊天用語","example":"여기 와이파이가 안 돼요. 비밀번호 알아요?","example_zh":"這裡WiFi連不上，你知道密碼嗎？","note":"안 되다＝不行、故障，萬用；비밀번호＝密碼。","level":"TOPIK2"},{"text":"영상통화 할까요?","reading":"yeongsangtonghwa halkkayo?","zh":"要視訊嗎？","topic":"網路聊天用語","example":"목소리 듣고 싶어요. 영상통화 할까요?","example_zh":"想聽你的聲音，要視訊嗎？","note":"영상통화＝視訊通話；韓國人多用카톡的페이스톡（FaceTalk）。","level":"TOPIK2"},{"text":"오타예요","reading":"otayeyo","zh":"打錯字了","topic":"網路聊天用語","example":"아, 그거 오타예요. 신경 쓰지 마세요.","example_zh":"啊，那是打錯字，別在意。","note":"오타＝錯字（誤打）；聊天打錯字後的快速澄清。","level":"TOPIK2"},{"text":"잘못 보냈어요","reading":"jalmot bonaesseoyo","zh":"我傳錯了","topic":"網路聊天用語","example":"죄송해요, 다른 사람한테 보낼 걸 잘못 보냈어요.","example_zh":"抱歉，要傳給別人的傳錯給你了。","note":"잘못＋動詞＝做錯…；誤傳訊息的必備救場句。","level":"TOPIK2"},{"text":"지금 바빠서 이따 답장할게요","reading":"jigeum bappaseo itta dapjanghalgeyo","zh":"現在很忙，待會再回你","topic":"網路聊天用語","example":"지금 바빠서 이따 답장할게요. 미안!","example_zh":"現在很忙，待會再回你，抱歉！","note":"답장하다＝回覆訊息；先說一聲就不算읽씹（已讀不回）。","level":"TOPIK2"},{"text":"프사 바꿨네요","reading":"peusa bakkwonneyo","zh":"你換大頭貼了耶","topic":"網路聊天用語","example":"프사 바꿨네요! 사진 잘 나왔어요.","example_zh":"你換大頭貼了耶！照片拍得真好。","note":"프사＝프로필 사진（大頭貼）縮寫；사진이 잘 나오다＝照片拍得好看。","level":"TOPIK2"},{"text":"소식 들었어요?","reading":"sosik deureosseoyo?","zh":"你聽說了嗎？","topic":"網路聊天用語","example":"그 소식 들었어요? 두 사람 사귄대요!","example_zh":"你聽說了嗎？聽說他們兩個在交往！","note":"소식＝消息；-대요＝聽說…，聊八卦的起手式。","level":"TOPIK2"},{"text":"댓글 남길게요","reading":"daetgeul namgilgeyo","zh":"我會留言的","topic":"網路聊天用語","example":"영상 잘 봤어요. 댓글 남길게요.","example_zh":"影片我看了很喜歡，我會留言的。","note":"댓글＝留言、남기다＝留下；댓글 달다也很常用。","level":"TOPIK2"},{"text":"완전 웃겨요","reading":"wanjeon utgyeoyo","zh":"超好笑","topic":"網路聊天用語","example":"이 영상 봤어요? 완전 웃겨요. ㅋㅋㅋ","example_zh":"你看過這支影片嗎？超好笑。ㅋㅋㅋ","note":"완전＝超、完全（口語程度副詞）；웃기다＝好笑、搞笑。","level":"TOPIK2"},{"text":"몇 시에 끝나요?","reading":"myeot sie kkeunnayo?","zh":"幾點結束？","topic":"數字時間","example":"수업이 몇 시에 끝나요? — 여섯 시에 끝나요.","example_zh":"課幾點結束？——六點結束。","note":"끝나다＝結束；問下班、下課時間的高頻句。","level":"TOPIK2"},{"text":"다섯 시에 끝날 것 같아요","reading":"daseot sie kkeunnal geot gatayo","zh":"應該五點會結束","topic":"數字時間","example":"회의는 다섯 시에 끝날 것 같아요.","example_zh":"會議應該五點會結束。","note":"時刻用固有數字＋시；-(으)ㄹ 것 같아요給對方不確定的預估。","level":"TOPIK2"},{"text":"삼십 분 정도 걸려요","reading":"samsip bun jeongdo geollyeoyo","zh":"大概要三十分鐘","topic":"數字時間","example":"집에서 회사까지 삼십 분 정도 걸려요.","example_zh":"從家到公司大概要三十分鐘。","note":"걸리다＝花（時間）；정도＝左右、大概。分鐘用漢字數字＋분。","level":"TOPIK2"},{"text":"얼마나 걸려요?","reading":"eolmana geollyeoyo?","zh":"要多久？","topic":"數字時間","example":"거기까지 얼마나 걸려요?","example_zh":"到那裡要多久？","note":"얼마나＝多少、多久；問交通時間、等待時間都用這句。","level":"TOPIK2"},{"text":"두 시간이나 기다렸어요","reading":"du siganina gidaryeosseoyo","zh":"我等了兩個小時耶","topic":"數字時間","example":"맛집이라서 두 시간이나 기다렸어요.","example_zh":"因為是名店，我等了整整兩個小時。","note":"數量＋(이)나表「多達…」的驚訝語氣；比기다렸어요多了抱怨感。","level":"TOPIK2"},{"text":"시간이 얼마 안 남았어요","reading":"sigani eolma an namasseoyo","zh":"時間不多了","topic":"數字時間","example":"서두르세요. 시간이 얼마 안 남았어요.","example_zh":"快一點，時間不多了。","note":"남다＝剩下；얼마 안＋動詞＝沒剩多少，催促常用。","level":"TOPIK2"},{"text":"세 명이서 갔어요","reading":"se myeongiseo gasseoyo","zh":"我們三個人去的","topic":"數字時間","example":"어제 친구들이랑 세 명이서 갔어요.","example_zh":"昨天和朋友三個人一起去的。","note":"人數＋명이서＝幾個人一起（做）；혼자서＝一個人、둘이서＝兩個人。","level":"TOPIK2"},{"text":"몇 명이 와요?","reading":"myeot myeongi wayo?","zh":"有幾個人來？","topic":"數字時間","example":"모임에 몇 명이 와요? — 다섯 명이요.","example_zh":"聚會有幾個人來？——五個人。","note":"數人用固有數字＋명；回答可簡答「數字＋명이요」。","level":"TOPIK2"},{"text":"두 번째예요","reading":"du beonjjaeyeyo","zh":"第二次了","topic":"數字時間","example":"이 영화 보는 거 두 번째예요.","example_zh":"這部電影我看第二次了。","note":"固有數字＋번째＝第幾次；첫 번째＝第一次（序數）。","level":"TOPIK2"},{"text":"하루에 한 시간씩 공부했어요","reading":"harue han siganssik gongbuhaesseoyo","zh":"我以前每天念一小時","topic":"數字時間","example":"하루에 한 시간씩 한국어를 공부했어요.","example_zh":"我每天念一小時韓文。","note":"-씩＝每次固定的量；分享學習方法的實用句。","level":"TOPIK2"},{"text":"반값이에요","reading":"bangapsieyo","zh":"是半價耶","topic":"數字時間","example":"지금 세일해서 반값이에요!","example_zh":"現在特價，只要半價耶！","note":"반값＝半價；세일하다＝打折特價，購物高頻詞。","level":"TOPIK2"},{"text":"다 해서 얼마예요?","reading":"da haeseo eolmayeyo?","zh":"總共多少錢？","topic":"數字時間","example":"이거랑 이거, 다 해서 얼마예요?","example_zh":"這個和這個，總共多少錢？","note":"다 해서＝全部加起來；也可說전부 얼마예요?。","level":"TOPIK2"},{"text":"카드로 계산할게요","reading":"kadeuro gyesanhalgeyo","zh":"我要刷卡","topic":"數字時間","example":"카드로 계산할게요. — 네, 여기 꽂아 주세요.","example_zh":"我要刷卡。——好，請插這裡。","note":"(으)로表手段；계산하다＝結帳；현금으로＝付現。","level":"TOPIK2"},{"text":"천 원만 깎아 주세요","reading":"cheon wonman kkakka juseyo","zh":"算我便宜一千韓元啦","topic":"數字時間","example":"사장님, 천 원만 깎아 주세요.","example_zh":"老闆，算我便宜一千韓元啦。","note":"깎다＝殺價；만＝就、只，讓請求聽起來小小的；傳統市場可用。","level":"TOPIK2"},{"text":"시간 다 됐어요","reading":"sigan da dwaesseoyo","zh":"時間到了","topic":"數字時間","example":"시간 다 됐어요. 이제 가야 해요.","example_zh":"時間到了，我得走了。","note":"시간이 다 되다＝時間到；搭配가야 해요（得走了）使用。","level":"TOPIK2"},{"text":"휴대폰을 잃어버렸어요","reading":"hyudaeponeul ireobeoryeosseoyo","zh":"我的手機弄丟了","topic":"求助應急","example":"휴대폰을 잃어버렸어요. 어떻게 해요?","example_zh":"我的手機弄丟了，怎麼辦？","note":"잃어버리다＝弄丟；어떻게 해요?＝怎麼辦，求助必備。","level":"TOPIK2"},{"text":"여권을 잃어버려서 큰일 났어요","reading":"yeogwoneul ireobeoryeoseo keunil nasseoyo","zh":"護照弄丟了，慘了","topic":"求助應急","example":"여권을 잃어버려서 큰일 났어요. 대사관이 어디예요?","example_zh":"護照弄丟了慘了，大使館在哪裡？","note":"큰일 나다＝出大事、慘了；旅行應急最重要的一句。","level":"TOPIK2"},{"text":"지하철을 잘못 탔어요","reading":"jihacheoreul jalmot tasseoyo","zh":"我搭錯地鐵了","topic":"求助應急","example":"지하철을 잘못 타서 늦었어요.","example_zh":"我搭錯地鐵所以遲到了。","note":"잘못＋動詞＝做錯…：잘못 타다搭錯、잘못 내리다下錯站。","level":"TOPIK2"},{"text":"길을 몰라서 늦었어요","reading":"gireul mollaseo neujeosseoyo","zh":"因為不認得路所以遲到了","topic":"求助應急","example":"길을 몰라서 늦었어요. 죄송해요.","example_zh":"我不認得路所以遲到了，對不起。","note":"모르다＋아서→몰라서（르不規則）；道歉時附上理由更誠懇。","level":"TOPIK2"},{"text":"어떻게 가야 해요?","reading":"eotteoke gaya haeyo?","zh":"要怎麼去？","topic":"求助應急","example":"명동에 가고 싶은데 어떻게 가야 해요?","example_zh":"我想去明洞，要怎麼去？","note":"-아/어야 해요＝得要…；問路句型「地點＋에 가고 싶은데＋這句」。","level":"TOPIK2"},{"text":"좀 천천히 가 주세요","reading":"jom cheoncheonhi ga juseyo","zh":"請開慢一點","topic":"求助應急","example":"기사님, 좀 천천히 가 주세요.","example_zh":"司機先生，請開慢一點。","note":"計程車必備；相反是빨리 가 주세요（請開快一點）。","level":"TOPIK2"},{"text":"여기서 세워 주세요","reading":"yeogiseo sewo juseyo","zh":"請在這裡停車","topic":"求助應急","example":"저 편의점 앞에서 세워 주세요.","example_zh":"請在那間便利商店前面停。","note":"세우다＝停（車）；搭計程車下車時的必說句。","level":"TOPIK2"},{"text":"머리가 아파서 약을 사고 싶어요","reading":"meoriga apaseo yageul sago sipeoyo","zh":"我頭痛，想買藥","topic":"求助應急","example":"머리가 아파서 약을 사고 싶어요. 두통약 있어요?","example_zh":"我頭痛想買藥，有頭痛藥嗎？","note":"身體部位＋가/이 아프다＝…痛；두통약＝頭痛藥、감기약＝感冒藥。","level":"TOPIK2"},{"text":"예약을 취소하고 싶어요","reading":"yeyageul chwisohago sipeoyo","zh":"我想取消預約","topic":"求助應急","example":"죄송한데 예약을 취소하고 싶어요.","example_zh":"不好意思，我想取消預約。","note":"취소하다＝取消；開頭加죄송한데（不好意思）更客氣。","level":"TOPIK2"},{"text":"환불할 수 있어요?","reading":"hwanbulhal su isseoyo?","zh":"可以退費嗎？","topic":"求助應急","example":"사이즈가 안 맞는데 환불할 수 있어요?","example_zh":"尺寸不合，可以退費嗎？","note":"환불＝退費退款；영수증（收據）通常要帶著。","level":"TOPIK2"},{"text":"교환하고 싶어요","reading":"gyohwanhago sipeoyo","zh":"我想換貨","topic":"求助應急","example":"이거 다른 색으로 교환하고 싶어요.","example_zh":"這個我想換成別的顏色。","note":"교환＝交換、換貨；(으)로表示換成的對象。","level":"TOPIK2"},{"text":"한국어로 설명할 수 없어요","reading":"hangugeoro seolmyeonghal su eopseoyo","zh":"我沒辦法用韓文說明","topic":"求助應急","example":"한국어로 설명할 수 없어요. 사진 보여 드릴게요.","example_zh":"我沒辦法用韓文說明，給您看照片。","note":"-(으)ㄹ 수 없다＝無法；搭配보여 드릴게요（給您看）解決溝通困難。","level":"TOPIK2"},{"text":"여기 와 본 적이 없어서 잘 몰라요","reading":"yeogi wa bon jeogi eopseoseo jal mollayo","zh":"我沒來過這裡，不太清楚","topic":"求助應急","example":"저도 여기 와 본 적이 없어서 잘 몰라요.","example_zh":"我也沒來過這裡，不太清楚。","note":"被問路時的誠實回答；경험 없음＋-아서＋잘 몰라요的組合句。","level":"TOPIK2"},{"text":"무슨 일이 있었어요?","reading":"museun iri isseosseoyo?","zh":"發生什麼事了？","topic":"求助應急","example":"얼굴이 안 좋아요. 무슨 일이 있었어요?","example_zh":"你臉色不太好，發生什麼事了？","note":"過去式있었어요?問已發生的事；現在式무슨 일 있어요?問當下狀況。","level":"TOPIK2"},{"text":"괜찮아질 거예요","reading":"gwaenchanajil geoyeyo","zh":"會好起來的","topic":"求助應急","example":"너무 걱정하지 마세요. 곧 괜찮아질 거예요.","example_zh":"別太擔心，很快就會好起來的。","note":"괜찮다＋아지다＋ㄹ 거예요＝會變好；安慰人的萬用句。","level":"TOPIK2"},{"text":"다쳤어요","reading":"dachyeosseoyo","zh":"我受傷了","topic":"求助應急","example":"넘어져서 다리를 다쳤어요.","example_zh":"我跌倒傷到腿了。","note":"다치다＝受傷；「部位＋를 다쳤어요」說明傷處；넘어지다＝跌倒。","level":"TOPIK2"},{"text":"도와줘서 정말 고마워요","reading":"dowajwoseo jeongmal gomawoyo","zh":"真的很謝謝你幫我","topic":"求助應急","example":"오늘 도와줘서 정말 고마워요. 덕분에 잘 해결했어요.","example_zh":"今天真的很謝謝你幫我，托你的福順利解決了。","note":"-아/어 줘서 고마워요＝謝謝你為我…；덕분에＝托…的福。","level":"TOPIK2"},{"text":"아이고","reading":"aigo","zh":"哎呦、天啊","topic":"日常閒聊","example":"아이고, 다리야. 너무 많이 걸었어.","example_zh":"哎呦，我的腿，走太多路了。","note":"萬用感嘆詞，疲累、心疼、無奈都能用；全年齡通用無失禮風險，長輩使用頻率尤其高，也常說成아이구/아유。","level":"TOPIK1"},{"text":"어머","reading":"eomeo","zh":"哎呀、我的天（驚訝）","topic":"日常閒聊","example":"어머, 이게 누구야! 진짜 오랜만이다.","example_zh":"哎呀，這是誰呀！真的好久不見。","note":"驚訝感嘆詞，女性使用居多，男生用會帶喜感；朋友、長輩面前都能說，不失禮。","level":"TOPIK1"},{"text":"어떡해","reading":"eotteokae","zh":"怎麼辦","topic":"日常閒聊","example":"지갑 놓고 왔어. 어떡해!","example_zh":"錢包忘了帶，怎麼辦！","note":"口語超高頻，自己慌張或替朋友著急都用；拼寫是어떡해（=어떻게 해縮約），網路常有人寫錯。半語感但柔和，對長輩改說어떡해요。","level":"TOPIK1"},{"text":"아 진짜","reading":"a jinjja","zh":"真是的（不耐煩）","topic":"日常閒聊","example":"아 진짜, 버스 또 놓쳤어.","example_zh":"真是的，又錯過公車了。","note":"表達輕微不滿的口頭禪；熟人之間發洩用，對長輩或職場說會顯得沒禮貌、情緒化。","level":"TOPIK1"},{"text":"미치겠다","reading":"michigetda","zh":"要瘋了","topic":"日常閒聊","example":"과제가 산더미야. 미치겠다.","example_zh":"作業堆成山，我要瘋了。","note":"誇張表達快崩潰，太開心也能用（좋아서 미치겠다）；熟人間口語，正式場合、長輩面前避免。","level":"TOPIK1"},{"text":"웬일이야","reading":"wenniriya","zh":"什麼風把你吹來了／太陽打西邊出來","topic":"日常閒聊","example":"네가 먼저 연락을 다 하고, 웬일이야?","example_zh":"你居然主動聯絡我，太陽打西邊出來了？","note":"對意外之事的反應，熟朋友間帶調侃語氣；對長輩要說웬일이세요?，語氣也要收斂成單純驚訝。","level":"TOPIK1"},{"text":"설마","reading":"seolma","zh":"不會吧","topic":"日常閒聊","example":"설마 나 빼고 먹으러 간 거야?","example_zh":"不會吧，你們丟下我去吃了？","note":"表示難以置信，可單獨當反應詞；全年齡通用、無失禮風險，是追劇必聽詞。","level":"TOPIK1"},{"text":"그러게","reading":"geureoge","zh":"就是說啊","topic":"日常閒聊","example":"A: 시간 진짜 빠르다. B: 그러게.","example_zh":"A：時間過得真快。B：就是說啊。","note":"附和神器，「我也正這麼想」；반말，對長輩說그러게요。口語也常聽그니까（그러니까縮約）。","level":"TOPIK1"},{"text":"글쎄","reading":"geulsse","zh":"這個嘛…／很難說","topic":"日常閒聊","example":"글쎄, 나도 잘 모르겠는데.","example_zh":"這個嘛，我也不太確定。","note":"保留答案、爭取思考時間的填充詞；單獨說글쎄是半語，對長輩要說글쎄요。","level":"TOPIK1"},{"text":"아 맞다","reading":"a matda","zh":"啊對了（突然想起）","topic":"日常閒聊","example":"아 맞다, 너한테 줄 게 있어.","example_zh":"啊對了，我有東西要給你。","note":"突然想起事情、轉換話題的口頭禪；朋友間口語，正式簡報中講아 맞다會顯得毛躁。","level":"TOPIK1"},{"text":"있잖아","reading":"itjana","zh":"那個…我跟你說","topic":"日常閒聊","example":"있잖아, 나 사실 할 말 있어.","example_zh":"那個…其實我有話要說。","note":"開啟話題的填充詞，自帶「注意聽我說」效果；반말，對長輩用있잖아요，連用太多會顯得吞吞吐吐。","level":"TOPIK1"},{"text":"근데","reading":"geunde","zh":"不過、話說","topic":"日常閒聊","example":"근데 너 내일 시간 돼?","example_zh":"話說你明天有空嗎？","note":"그런데的縮約，口語出現率天花板級，轉話題神器；任何對象口語都能用，但書面正式文章要寫그런데。","level":"TOPIK1"},{"text":"그냥","reading":"geunyang","zh":"就…沒為什麼、隨便","topic":"日常閒聊","example":"A: 왜 전화했어? B: 그냥. 목소리 듣고 싶어서.","example_zh":"A：幹嘛打給我？B：沒事，就想聽聽你的聲音。","note":"萬用填充詞，「沒特別理由」的曖昧回答；回長輩問話要說그냥요，單說그냥是半語。","level":"TOPIK1"},{"text":"완전","reading":"wanjeon","zh":"超、完全（加強詞）","topic":"日常閒聊","example":"이 노래 완전 좋아. 꼭 들어 봐.","example_zh":"這首歌超讚，一定要聽聽看。","note":"年輕人高頻程度副詞，什麼都能완전一下；口語感強，正式文書、報告別用，對長輩說話多用아주/정말。","level":"TOPIK1"},{"text":"별로","reading":"byeollo","zh":"不怎麼樣、普普","topic":"日常閒聊","example":"A: 그 영화 어땠어? B: 음, 별로야.","example_zh":"A：那部電影怎麼樣？B：嗯，普普。","note":"委婉負評萬用詞；單獨回별로是半語，對長輩說별로예요。比直說싫어（討厭）圓滑得多。","level":"TOPIK1"},{"text":"귀찮아","reading":"gwichana","zh":"懶得弄、好麻煩","topic":"日常閒聊","example":"아, 나가기 귀찮아. 그냥 집에 있을래.","example_zh":"啊，懶得出門，我想直接待在家。","note":"表達提不起勁的高頻詞，年輕人日常口頭禪；반말，在長輩、上司面前喊귀찮아요本身就不太得體。","level":"TOPIK1"},{"text":"알았어","reading":"arasseo","zh":"知道了、好啦","topic":"日常閒聊","example":"알았어, 알았어. 금방 갈게.","example_zh":"好啦好啦，我馬上過去。","note":"반말；對長輩、上司要說알겠습니다/알겠어요。拖長音的「알았어~」帶不耐煩，語氣要注意；網路上也打ㅇㅋ。","level":"TOPIK1"},{"text":"썸","reading":"sseom","zh":"曖昧期","topic":"日常閒聊","example":"두 사람 요즘 썸 타는 것 같아.","example_zh":"那兩個人最近好像在搞曖昧。","note":"從英文something來的流行語，썸 타다＝正處曖昧中，썸남/썸녀＝曖昧對象；年輕人聊八卦必備，長輩世代不一定懂。","level":"TOPIK1"},{"text":"가성비","reading":"gaseongbi","zh":"CP值","topic":"日常閒聊","example":"이 식당 가성비 진짜 좋아.","example_zh":"這家餐廳CP值真的高。","note":"가격 대비 성능（價格對性能）縮寫；購物、美食話題高頻，已進入全年齡日常語，無失禮風險。","level":"TOPIK1"},{"text":"아무거나","reading":"amugeona","zh":"隨便、都可以","topic":"吃飯聊天","example":"A: 뭐 먹을래? B: 난 아무거나 괜찮아.","example_zh":"A：想吃什麼？B：我隨便都行。","note":"被問吃什麼的國民回答；對長輩說아무거나 괜찮아요較婉轉。被回아무거나時，直接提兩個選項讓對方挑最聰明。","level":"TOPIK1"},{"text":"배불러","reading":"baebulleo","zh":"吃飽了、好撐","topic":"吃飯聊天","example":"아, 배불러. 더 못 먹겠어.","example_zh":"啊，好撐，吃不下了。","note":"배고파（餓）的相反；반말，客氣說배불러요。飯後接一句잘 먹었어是標準組合。","level":"TOPIK1"},{"text":"맛집","reading":"matjip","zh":"美食名店","topic":"吃飯聊天","example":"이 근처에 떡볶이 맛집 있는데 갈래?","example_zh":"這附近有家辣炒年糕名店，要去嗎？","note":"맛있는 집縮寫，找餐廳、看評價的關鍵字；IG、地圖搜尋都用它，全年齡通用。","level":"TOPIK1"},{"text":"혼밥","reading":"honbap","zh":"一個人吃飯","topic":"吃飯聊天","example":"오늘은 그냥 혼밥 했어.","example_zh":"今天就自己一個人吃了。","note":"혼자 밥 먹기縮寫；延伸詞혼술（一人喝酒）、혼영（一人看電影），反映韓國一人文化。年輕人日常語。","level":"TOPIK1"},{"text":"먹방","reading":"meokbang","zh":"吃播","topic":"吃飯聊天","example":"요즘 먹방 보면서 밥 먹는 게 습관이 됐어.","example_zh":"最近養成邊看吃播邊吃飯的習慣了。","note":"먹는 방송（吃的節目）縮寫，連英語都直接借用mukbang一詞；聊YouTube、美食話題高頻，全年齡通用，無失禮風險。","level":"TOPIK1"},{"text":"이따 봐","reading":"itta bwa","zh":"待會見","topic":"打招呼","example":"수업 끝나고 이따 봐!","example_zh":"下課後待會見！","note":"이따가 보자的縮約；반말，熟人限定。내일 봐＝明天見可直接套用；對長輩說이따 뵐게요。","level":"TOPIK1"},{"text":"불금","reading":"bulgeum","zh":"狂歡星期五、週五夜","topic":"邀約出遊","example":"오늘 불금인데 치맥 어때?","example_zh":"今天是狂歡星期五，來個炸雞配啤酒如何？","note":"불타는 금요일（燃燒的星期五）縮寫，指週五晚上盡情吃喝玩樂；同事朋友揪聚會的高頻詞，輕鬆但不粗俗，正式文書不用。","level":"TOPIK1"},{"text":"ㄴㄴ","reading":"nono","zh":"不要、不是（子音縮寫）","topic":"網路聊天用語","example":"A: 오늘 갈 거야? B: ㄴㄴ 내일 갈 거야.","example_zh":"A：今天要去嗎？B：不是，我明天去。","note":"노노的子音縮寫；熟人打字限定，語氣直接，婉拒長輩務必用完整敬語句。","level":"TOPIK1"},{"text":"ㄹㅇ","reading":"rieol","zh":"真的、千真萬確（子音縮寫）","topic":"網路聊天用語","example":"그 집 ㄹㅇ 맛있어. 꼭 가 봐.","example_zh":"那家店真的好吃，一定要去。","note":"리얼（real）的子音縮寫，強調「不是開玩笑」；年輕人網路用語，長輩多半看不懂，正式文字別用。","level":"TOPIK1"},{"text":"인정","reading":"injeong","zh":"同意、說得對","topic":"網路聊天用語","example":"A: 이 집이 제일 맛있지. B: 인정.","example_zh":"A：這家最好吃對吧。B：同意。","note":"字面是「承認」，年輕人拿來表達強烈附和，打字縮成ㅇㅈ，反問「ㅇㅈ?」＝「你說是不是？」；朋友間用，對長輩說맞아요。","level":"TOPIK1"},{"text":"노잼","reading":"nojaem","zh":"無聊、不好笑","topic":"網路聊天用語","example":"그 영화 기대했는데 완전 노잼이었어.","example_zh":"那部電影我很期待，結果超無聊。","note":"no＋재미的合成詞，꿀잼的反義；吐槽節目、自嘲냉笑話都用。年輕人用語，對長輩說재미없어요。","level":"TOPIK1"},{"text":"짱","reading":"jjang","zh":"最棒／超讚／第一名","topic":"日常閒聊","example":"이 집 떡볶이 진짜 짱이야!","example_zh":"這家的辣炒年糕真的超讚！","note":"來源說法不一，一說由「장（長，領頭者）」音變而來，1990年代起流行至今。可當名詞（우리 반 짱）或感嘆詞（짱 좋아），也常當接頭詞：짱 맛있어＝超好吃。極口語，朋友間使用。","level":"TOPIK1"},{"text":"멘붕","reading":"menbung","zh":"精神崩潰／腦袋當機","topic":"網路聊天用語","example":"시험 범위 잘못 알아서 완전 멘붕이었어.","example_zh":"我搞錯考試範圍，整個人精神崩潰。","note":"멘탈（mental，心理素質）＋붕괴（崩壞）的縮寫。形容遇到打擊或突發狀況時腦袋一片空白，綜藝節目字幕高頻詞；口語與網路皆通用，正式文書不用。","level":"TOPIK1"},{"text":"치맥","reading":"chimaek","zh":"炸雞配啤酒","topic":"日常閒聊","example":"한강에서 치맥 하는 게 제 로망이에요.","example_zh":"在漢江邊吃炸雞配啤酒是我的夢想。","note":"치킨（炸雞）＋맥주（啤酒）各取首字。韓國國民級宵夜組合，因韓劇《來自星星的你》紅遍亞洲；口語及店家招牌都常見，已幾乎成為一般名詞。","level":"TOPIK1"},{"text":"혼술","reading":"honsul","zh":"獨自小酌／一個人喝酒","topic":"日常閒聊","example":"피곤한 날엔 집에서 혼술 하면서 드라마 봐요.","example_zh":"累的日子我會在家一邊獨自小酌一邊看韓劇。","note":"혼자（獨自）＋술（酒）的縮寫，與혼밥同系列，還有혼영（自己看電影）等衍生詞。曾有同名韓劇《혼술남녀》；中性口語，日常聊天常用。","level":"TOPIK1"},{"text":"인싸","reading":"inssa","zh":"社交咖／圈內人氣王","topic":"網路聊天用語","example":"그 친구는 어딜 가든 인기 많은 인싸예요.","example_zh":"那個朋友不管到哪裡都很受歡迎，是個社交咖。","note":"英語 insider 的韓式縮略，指擅長社交、走在流行尖端的人，反義詞是아싸。校園、職場、綜藝都高頻使用；口語與網路用語，無貶義。","level":"TOPIK1"},{"text":"아싸","reading":"assa","zh":"邊緣人／獨行俠","topic":"網路聊天用語","example":"저는 모임보다 집이 좋은 아싸예요.","example_zh":"比起聚會我更喜歡待在家，是個邊緣人。","note":"英語 outsider 的韓式縮略，與인싸成對。常帶自嘲語氣，自稱時多是玩笑；形容別人時可能傷人，宜避免。注意與感嘆詞「아싸!（耶！太好了）」同形不同義，靠語境區分。朋友間輕鬆口語，正式場合不用。","level":"TOPIK1"},{"text":"심쿵","reading":"simkung","zh":"心動爆擊／小鹿亂撞","topic":"網路聊天用語","example":"웃는 모습 보고 심쿵 했어.","example_zh":"看到他笑的樣子，我的心臟被爆擊了。","note":"심장（心臟）＋쿵（「咚」的擬聲，心跳漏一拍的聲音）。看到帥哥美女或可愛事物時使用，常搭配하다：심쿵 하다；追星族與韓劇字幕高頻詞，輕鬆口語。","level":"TOPIK1"},{"text":"더치페이","reading":"deochipei","zh":"各付各的／AA制","topic":"日常閒聊","example":"우리 부담 없이 더치페이 해요.","example_zh":"我們別有負擔，各付各的吧。","note":"韓式英語 Dutch pay（源自英語 go Dutch）。年輕世代聚餐分帳的標準說法，常搭配하다；同義的流行說法還有엔빵（N빵，按人數均分）。中性詞，日常口語通用，任何對象都能說。","level":"TOPIK1"},{"text":"셀카봉","reading":"selkabong","zh":"自拍棒","topic":"日常閒聊","example":"셀카봉으로 단체 사진을 찍었어요.","example_zh":"我們用自拍棒拍了團體照。","note":"셀카（셀프 카메라「自拍」的縮寫）＋봉（棒）。觀光景點必備單字，店家、機場廣播都會出現；已收入日常詞彙，完全中性。","level":"TOPIK1"},{"text":"꿀팁","reading":"kkultip","zh":"超實用小撇步／實用密技","topic":"網路聊天用語","example":"여행 꿀팁 좀 알려 주세요!","example_zh":"請告訴我一些旅遊的實用小撇步！","note":"꿀（蜂蜜，引申「超棒的」）＋팁（tip，訣竅）。YouTube 影片標題、部落格、聊天都極常見；꿀當接頭詞的同系列還有꿀잼、꿀맛。輕鬆口語。","level":"TOPIK1"},{"text":"밀당","reading":"mildang","zh":"推拉／欲擒故縱","topic":"日常閒聊","example":"연락을 일부러 늦게 하다니, 밀당 하는 거야?","example_zh":"故意晚回訊息，你是在跟我玩推拉嗎？","note":"밀고 당기기（推與拉）的縮寫，指戀愛中若即若離的心理戰，常搭配하다。韓劇戀愛情節必備詞；也可用於談判比喻。輕鬆口語。","level":"TOPIK1"},{"text":"금손","reading":"geumson","zh":"巧手達人／手超巧","topic":"網路聊天用語","example":"이 케이크를 직접 만들었다고? 완전 금손이네!","example_zh":"這個蛋糕是你自己做的？根本是巧手達人！","note":"금（金）＋손（手），字面「金手」，稱讚人手藝精湛（畫畫、烘焙、化妝等），反義詞是똥손。網路社群與日常口語通用的稱讚語。","level":"TOPIK1"},{"text":"똥손","reading":"ttongson","zh":"手殘／做什麼壞什麼的手","topic":"網路聊天用語","example":"저는 똥손이라서 그림을 정말 못 그려요.","example_zh":"我很手殘，真的完全不會畫畫。","note":"똥（便便）＋손（手），與금손成對，多用來自嘲手藝差。語氣詼諧不算粗俗，朋友間與網路常用；正式場合避免。","level":"TOPIK1"},{"text":"케미","reading":"kemi","zh":"默契火花／CP感","topic":"網路聊天用語","example":"두 배우 케미가 진짜 좋네요.","example_zh":"這兩位演員的CP感真的很棒。","note":"英語 chemistry（化學反應）的縮略，指人與人之間擦出的火花與合拍程度。談論韓劇螢幕情侶、綜藝搭檔時必用；口語與娛樂新聞皆常見。","level":"TOPIK1"},{"text":"워라밸","reading":"worabael","zh":"工作與生活的平衡","topic":"日常閒聊","example":"연봉보다 워라밸이 좋은 회사에 다니고 싶어요.","example_zh":"比起年薪，我更想進工作與生活平衡好的公司。","note":"워크 라이프 밸런스（work-life balance）各取首音節的縮寫。求職、職場話題核心詞，新聞報導也常用；屬口語化縮略但接受度極高。","level":"TOPIK1"},{"text":"소확행","reading":"sohwakhaeng","zh":"小確幸／微小而確實的幸福","topic":"日常閒聊","example":"퇴근 후에 마시는 커피 한 잔이 저의 소확행이에요.","example_zh":"下班後喝的一杯咖啡就是我的小確幸。","note":"소소하지만 확실한 행복（微小但確實的幸福）的縮寫，源自村上春樹散文的概念，2018年前後成為韓國生活關鍵字並沿用至今。書面口語皆可，中性偏文青。","level":"TOPIK1"},{"text":"강추","reading":"gangchu","zh":"強力推薦／大推","topic":"網路聊天用語","example":"이 드라마 진짜 강추예요. 꼭 보세요!","example_zh":"這部韓劇我大推，一定要看！","note":"강력（強力）＋추천（推薦）的縮寫，反義詞是비추（不推）。網路評論、聊天分享心得時高頻使用；口語縮略詞，正式文章寫추천합니다。","level":"TOPIK1"},{"text":"열공","reading":"yeolgong","zh":"拚命用功／認真讀書","topic":"網路聊天用語","example":"시험이 다음 주라서 요즘 열공 중이에요.","example_zh":"下週要考試，所以我最近正在拚命用功。","note":"열심히（努力地）＋공부（讀書）的縮寫，常用「열공 중」「열공 모드」。學生族群及打氣訊息常見：열공하세요！＝好好用功喔！輕鬆口語。","level":"TOPIK1"},{"text":"훈남","reading":"hunnam","zh":"暖男／讓人看了心頭一暖的男生","topic":"日常閒聊","example":"새로 온 선생님이 완전 훈남이에요.","example_zh":"新來的老師完全是個暖男。","note":"훈훈하다（暖呼呼、令人心暖）＋남자（男子）。指長相順眼、氣質溫暖的男生，不一定是大帥哥；女生版是훈녀。日常與網路皆常用的正面稱讚，輕鬆口語，朋友間聊天通用。","level":"TOPIK1"},{"text":"모태솔로","reading":"motaesollo","zh":"母胎單身／從出生就沒交過對象","topic":"日常閒聊","example":"저는 아직 연애를 못 해 본 모태솔로예요.","example_zh":"我是還沒談過戀愛的母胎單身。","note":"모태（母胎）＋솔로（solo，單身），字面「從娘胎開始就單身」。可縮寫成모솔；戀愛綜藝高頻詞，多用於自嘲或熟人間調侃，語氣輕鬆無惡意，屬朋友間口語，正式場合不用。","level":"TOPIK1"},{"text":"갑질","reading":"gapjil","zh":"仗勢欺人／耍老大","topic":"日常閒聊","example":"손님이라고 직원에게 갑질 하면 안 돼요.","example_zh":"不能仗著自己是客人就對店員耍威風。","note":"갑（合約中的甲方，引申為強勢方）＋질（表「行為」的貶義接尾詞）。從堅果返航事件後成為社會關鍵字，新聞與日常都通用；帶批判語氣的負面詞。","level":"TOPIK1"},{"text":"금수저","reading":"geumsujeo","zh":"含著金湯匙出生／富二代","topic":"日常閒聊","example":"그 배우는 알고 보니 금수저였대요.","example_zh":"聽說那位演員其實是含著金湯匙出生的。","note":"금（金）＋수저（湯匙筷子組），源自英語諺語 born with a silver spoon。「湯匙階級論」系列詞之首，反義詞흙수저（土湯匙，出身清寒）；聊社會話題時常用，新聞也通用，但當面形容本人帶酸味，宜慎用。","level":"TOPIK1"},{"text":"덕후","reading":"deokhu","zh":"狂熱愛好者／宅粉","topic":"網路聊天用語","example":"저는 10년 차 케이팝 덕후예요.","example_zh":"我是入坑十年的K-POP狂粉。","note":"日語오타쿠（御宅族）韓化為오덕후再縮成덕후，現指對特定領域極度熱衷的人，貶義已淡化。衍生詞極多：덕질（追星活動）、입덕、탈덕（脫坑）。口語與網路通用。","level":"TOPIK1"},{"text":"입덕","reading":"ipdeok","zh":"入坑／開始成為粉絲","topic":"網路聊天用語","example":"무대 영상 하나 보고 바로 입덕 했어요.","example_zh":"看了一支舞台影片就直接入坑了。","note":"입（入）＋덕（덕후的縮略），字面「進入宅界」。常搭配하다；讓人入坑的契機叫입덕 계기，反義詞탈덕＝脫坑。追星圈核心詞彙，輕鬆口語。","level":"TOPIK1"},{"text":"알바","reading":"alba","zh":"打工／兼職","topic":"日常閒聊","example":"방학 때 카페에서 알바 해요.","example_zh":"放假的時候我在咖啡廳打工。","note":"아르바이트（源自德語 Arbeit「工作」，經日語傳入）的縮寫。打工族叫알바생，招募公告寫알바 모집；已是日常標準口語，新聞也直接使用。","level":"TOPIK1"},{"text":"짤","reading":"jjal","zh":"梗圖／網路圖片","topic":"網路聊天用語","example":"아까 보낸 짤 너무 웃겨서 저장했어.","example_zh":"你剛傳的梗圖太好笑了，我存起來了。","note":"源自짤방（짤림 방지，防止文章被刪而附的圖）的縮略，後泛指網路上流傳的圖片、梗圖；動圖叫움짤（움직이는 짤）。聊天室高頻詞，純網路口語，長輩與正式場合不用。","level":"TOPIK1"},{"text":"웃프다","reading":"utpeuda","zh":"又好笑又心酸／笑中帶淚","topic":"網路聊天用語","example":"월급날 통장을 보면 진짜 웃프다.","example_zh":"發薪日看到存摺餘額，真的又好笑又心酸。","note":"웃기다（好笑）＋슬프다（悲傷）的合成形容詞，形容荒謬到讓人苦笑的情境。綜藝字幕、社群貼文常見；口語專用，正式文章不用。","level":"TOPIK1"},{"text":"취향저격","reading":"chwihyangjeogyeok","zh":"正中喜好／完全戳中我的菜","topic":"網路聊天用語","example":"이 노래 완전 제 취향저격이에요.","example_zh":"這首歌完全正中我的喜好。","note":"취향（喜好、品味）＋저격（狙擊），字面「狙擊了我的喜好」。形容事物或人精準命中個人偏好，也有同名歌曲；口語與社群通用的正面詞。","level":"TOPIK1"},{"text":"인생샷","reading":"insaengsyat","zh":"人生美照／此生最滿意的一張照片","topic":"網路聊天用語","example":"여기 야경에서 인생샷 건졌어요!","example_zh":"在這裡的夜景拍到了人生美照！","note":"인생（人生）＋샷（shot），指「一輩子最滿意的照片」。慣用搭配是인생샷을 건지다（撈到人生照）；同系列有인생 영화、인생 맛집（此生最愛的電影／餐廳）。旅遊打卡必備詞，社群與日常口語通用，中性無貶義。","level":"TOPIK1"},{"text":"득템","reading":"deuktem","zh":"入手好物／撿到寶","topic":"網路聊天用語","example":"세일 때 코트를 반값에 득템 했어요.","example_zh":"特賣的時候用半價入手了一件大衣好物。","note":"득（得，獲得）＋템（아이템 item 的縮略），源自線上遊戲「取得道具」，後泛指買到划算好物，常搭配하다。購物分享文高頻詞，輕鬆口語。","level":"TOPIK1"},{"text":"넘사벽","reading":"neomsabyeok","zh":"無法超越的高牆／差距懸殊","topic":"網路聊天用語","example":"그 선배 실력은 진짜 넘사벽이에요.","example_zh":"那位前輩的實力真的是無法超越的高牆。","note":"넘을 수 없는 사차원의 벽（無法跨越的四次元之牆）的縮寫，形容實力或等級差距大到追不上，多用於極端稱讚。網路與口語通用，語氣誇張詼諧。","level":"TOPIK1"},{"text":"케바케","reading":"kebake","zh":"看情況／因個案而異","topic":"網路聊天用語","example":"배송 기간은 케바케라서 정확히 말하기 어려워요.","example_zh":"配送時間因情況而異，很難說得準。","note":"케이스 바이 케이스（case by case）各取首音節的縮寫。回答「不一定、要看狀況」時的萬用語；衍生詞사바사＝사람 바이 사람（因人而異）。口語與網路高頻。","level":"TOPIK1"},{"text":"본방사수","reading":"bonbangsasu","zh":"死守首播／準時收看直播","topic":"網路聊天用語","example":"우리 가수 무대는 무조건 본방사수 해야죠!","example_zh":"我們歌手的舞台當然要死守首播收看！","note":"본방송（首播）＋사수（死守）的縮寫，指不看重播、準時鎖定電視首播以衝收視率。追星族與韓劇迷用語，藝人宣傳時也會喊「본방사수 부탁드려요」。","level":"TOPIK1"},{"text":"눈팅","reading":"nunting","zh":"潛水／只看不留言","topic":"網路聊天用語","example":"저는 그 카페에서 글은 안 쓰고 눈팅만 해요.","example_zh":"我在那個社團只潛水看文，從不發言。","note":"눈（眼睛）＋팅（채팅 chatting 的字尾），字面「用眼睛聊天」，指在群組或論壇只看不回。網路社群專用口語，常搭配하다：눈팅만 하다。","level":"TOPIK1"},{"text":"귀차니즘","reading":"gwichanijeum","zh":"懶病發作／嫌麻煩主義","topic":"網路聊天用語","example":"주말엔 귀차니즘 때문에 하루 종일 누워 있어요.","example_zh":"週末因為懶病發作，一整天都躺著。","note":"귀찮다（嫌麻煩）＋英語接尾詞 -ism（主義），把「什麼都懶得做」戲稱為一種主義。自嘲用的詼諧口語，聊天與社群常見，正式場合不用。","level":"TOPIK1"},{"text":"아점","reading":"ajeom","zh":"早午餐","topic":"日常閒聊","example":"늦게 일어나서 아점으로 라면 먹었어요.","example_zh":"太晚起床，早午餐吃了泡麵。","note":"아침（早餐）＋점심（午餐）各取首字，相當於英語 brunch（韓語也用外來語 브런치，但아점更生活化）。同結構還有점저（午晚餐合併）。日常口語通用，對誰都能說。","level":"TOPIK1"},{"text":"칼퇴","reading":"kaltoe","zh":"準時下班／秒下班","topic":"日常閒聊","example":"오늘은 약속이 있어서 꼭 칼퇴 할 거예요.","example_zh":"今天有約，所以我一定要準時下班。","note":"칼（刀，引申「像刀切一樣分秒不差」）＋퇴근（下班）的縮寫，常搭配하다。上班族心願代名詞，職場話題高頻詞；口語用，對上司說話時宜改用정시 퇴근。","level":"TOPIK1"},{"text":"월요병","reading":"woryobyeong","zh":"星期一症候群／週一憂鬱","topic":"日常閒聊","example":"월요병 때문에 아침부터 힘이 하나도 없어요.","example_zh":"因為星期一症候群，一早就完全提不起勁。","note":"월요일（星期一）＋병（病），指週末結束後不想上班上學的倦怠感。上班族閒聊萬用話題，新聞也常用；中性詼諧，任何場合都能說。","level":"TOPIK1"},{"text":"현타","reading":"hyeonta","zh":"被現實打醒／突然清醒的空虛瞬間","topic":"網路聊天用語","example":"충동구매 하고 나서 현타 왔어요.","example_zh":"衝動購物之後，突然清醒被現實暴擊了。","note":"현실 자각 타임（現實自覺時間）的縮寫，指狂歡或衝動後突然冷靜、直面現實的空虛瞬間，慣用搭配是현타（가） 오다。綜藝與日常對話高頻；輕鬆口語。","level":"TOPIK1"},{"text":"인증샷","reading":"injeungsyat","zh":"認證照／打卡證明照","topic":"網路聊天用語","example":"맛집에 도착하면 인증샷부터 찍어요.","example_zh":"一到美食名店就先拍張認證照。","note":"인증（認證）＋샷（shot），指證明「我來過、我做過」的照片，如景點打卡、投票認證。社群文化核心詞，日常口語通用；動詞搭配찍다、올리다（上傳）。","level":"TOPIK1"},{"text":"소맥","reading":"somaek","zh":"燒啤／燒酒混啤酒","topic":"日常閒聊","example":"회식 때 부장님이 소맥을 말아 주셨어요.","example_zh":"聚餐時部長幫大家調了燒啤。","note":"소주（燒酒）＋맥주（啤酒）各取首字，指兩者混調的國民喝法。慣用動詞是말다：소맥을 말다（調燒啤）。公司聚餐（회식）場景必備詞；成人飲酒話題用語。","level":"TOPIK1"},{"text":"돌직구","reading":"doljikgu","zh":"超直球／有話直說","topic":"日常閒聊","example":"그 친구는 항상 돌직구로 말해서 가끔 당황스러워요.","example_zh":"那個朋友總是有話直說，有時讓人措手不及。","note":"돌（石頭）＋직구（棒球的直球），字面「石頭直球」，比喻不繞彎、直接丟出尖銳問題或實話，常搭配날리다／던지다（投出）。綜藝訪談高頻詞，口語用。","level":"TOPIK1"},{"text":"갓생","reading":"gatsaeng","zh":"神級自律生活／超充實的人生","topic":"網路聊天用語","example":"요즘 아침 6시에 일어나서 운동해요. 갓생 살기로 했거든요.","example_zh":"我最近早上六點起床運動，因為我決定要過神級自律生活。","note":"갓（God，英語「神」）＋인생（人生）的縮略，指自律、充實、令人敬佩的生活方式，慣用搭配是갓생（을） 살다「過神級生活」。2021年起在MZ世代流行並沿用至今，新年目標、讀書帳貼文高頻詞；朋友間與網路的輕鬆口語，正式場合不用。","level":"TOPIK1"},{"text":"뭐라카노?","reading":"mworakano?","zh":"你說什麼啊？","topic":"日常閒聊","level":"TOPIK2","example":"뭐라카노? 하나도 안 들린다.","example_zh":"你說什麼啊？我完全聽不到。","note":"＝標準語的 뭐라고?／뭐라고 하니?；「-카-」是「-라고 하-」的縮約。句尾重音下墜、氣勢強，聽起來像質問，但釜山朋友間多半只是「蛤？你說啥」的日常反應。"},{"text":"어디 가노?","reading":"eodi gano?","zh":"你要去哪？","topic":"日常閒聊","level":"TOPIK2","example":"이 시간에 어디 가노?","example_zh":"這個時間你要去哪？","note":"＝標準語的 어디 가니?／어디 가?。慶尚道規則：有疑問詞（어디、뭐、왜）的問句用 -노，是非問句用 -나。句尾語調下降，和首爾話的上揚疑問正好相反。"},{"text":"밥 뭇나?","reading":"bap munna?","zh":"吃飯了沒？","topic":"日常閒聊","level":"TOPIK2","example":"인자 왔나? 밥 뭇나?","example_zh":"你剛到喔？吃飯了沒？","note":"＝標準語的 밥 먹었어?。먹다 在慶尚道說成 묵다，過去問句 묵었나 再縮成 뭇나；是非問句所以句尾用 -나。和標準語一樣是表達關心的問候，釜山長輩見面第一句常常就是這句。"},{"text":"마!","reading":"ma!","zh":"喂！／欸！","topic":"日常閒聊","level":"TOPIK2","example":"마! 니 어디 가노!","example_zh":"喂！你要去哪啦！","note":"＝標準語的 야!。叫人、喝止、吵架起手式都用，短促有力；電影裡常聽到，現實中釜山人叫朋友也真的這樣喊。只能對平輩或晚輩用，對長輩喊會出大事。"},{"text":"~아이가","reading":"aiga","zh":"～不是嗎／～嘛","topic":"日常閒聊","level":"TOPIK2","example":"니 내 친구 아이가!","example_zh":"你是我朋友嘛（不是嗎）！","note":"＝標準語的 ~잖아／~아니야?。名句「우리가 남이가!（我們又不是外人！）」就是這個句型，現在釜山人平常還是整天講「맞다 아이가!（對嘛！）」；帶著理所當然、拉近關係的語氣，句尾下沉不上揚。"},{"text":"억수로","reading":"eoksuro","zh":"超級、非常","topic":"日常閒聊","level":"TOPIK2","example":"오늘 억수로 덥네.","example_zh":"今天有夠熱。","note":"＝標準語的 엄청／아주。억수 原指傾盆大雨，引申為「非常」；慶尚道人講話愛用它加強語氣，一聽到就知道是南部人。"},{"text":"가시나","reading":"gasina","zh":"丫頭、臭女生（親暱）","topic":"日常閒聊","level":"TOPIK2","example":"야 이 가시나야, 어디 갔다 왔노?","example_zh":"唉唷這丫頭，你跑去哪了？","note":"＝標準語的 계집애／여자애。朋友或長輩對親近女生的稱呼，帶親暱也帶點粗魯，對不熟的人用會失禮；男生版是 머스마（＝사내아이）。"},{"text":"괘안타","reading":"gwaeanta","zh":"沒關係／還不錯","topic":"日常閒聊","level":"TOPIK2","example":"마이 안 아프나? — 괘안타, 괘안타.","example_zh":"不會很痛嗎？——沒事沒事。","note":"＝標準語的 괜찮다／괜찮아。慶尚道把 괜찮다 縮成 괘안타，語速快、尾音乾脆，常連說兩次表示「真的沒事」。"},{"text":"쫌!","reading":"jjom!","zh":"拜託！／夠了喔！","topic":"日常閒聊","level":"TOPIK2","example":"아 쫌! 고마 해라.","example_zh":"唉唷夠了喔！別鬧了。","note":"＝標準語的 좀 그만해／하지 마。좀 的重音強化版，一個字就能表達「你很煩耶、適可而止」；釜山人吵架或撒嬌全靠這個字的聲調變化。"},{"text":"그카지 마라","reading":"geukaji mara","zh":"別那樣啦／別那麼說","topic":"日常閒聊","level":"TOPIK2","example":"그카지 마라, 내 진심이다.","example_zh":"別那樣說啦，我是認真的。","note":"＝標準語的 그러지 마／그렇게 말하지 마。그카다＝그렇게 하다／그렇게 말하다 的縮約，마라 是命令否定；口氣直接，但在慶尚道是朋友間日常的勸阻，不算兇。"},{"text":"니 뭐하노?","reading":"ni mwohano?","zh":"你在幹嘛？","topic":"日常閒聊","level":"TOPIK2","example":"니 지금 뭐하노? 심심하다.","example_zh":"你現在在幹嘛？我好無聊。","note":"＝標準語的 너 뭐 해?。니＝너（你）；有疑問詞所以句尾用 -노。釜山朋友間傳訊息的起手式，等於台灣的「幹嘛」開場。"},{"text":"와 이라노?","reading":"wa irano?","zh":"你幹嘛這樣啦？","topic":"日常閒聊","level":"TOPIK2","example":"와 이라노, 부끄럽구로.","example_zh":"幹嘛這樣啦，很害羞耶。","note":"＝標準語的 왜 이래?／왜 이러니?。와＝왜（為什麼）；驚訝、無奈、被鬧時脫口而出，是韓劇裡釜山角色的高頻台詞。"},{"text":"맞나?","reading":"manna?","zh":"是喔？真的假的？","topic":"日常閒聊","level":"TOPIK2","example":"맞나? 가가 진짜 그캤나?","example_zh":"是喔？他真的那樣說喔？","note":"＝標準語的 그래?／진짜?。慶尚道人的萬用附和語，不是真的在確認對錯，只是「喔喔是喔」的搭腔；句尾輕輕下降帶過。"},{"text":"아이다","reading":"aida","zh":"不是啦","topic":"日常閒聊","level":"TOPIK2","example":"
