아이다, 그런 뜻 아이다.","example_zh":"不是啦，不是那個意思。","note":"＝標準語的 아니다／아니야。아니다 的 ㄴ 脫落變成 아이다，是慶尚道的招牌音變；否認或謙虛時常連說兩次「아이다 아이다」。"},{"text":"단디 해라","reading":"dandi haera","zh":"給我好好做／小心點","topic":"日常閒聊","level":"TOPIK2","example":"처음 하는 기니까 단디 해라.","example_zh":"第一次做，要好好弄喔。","note":"단디＝標準語的 단단히／제대로（確實地）。叮嚀囑咐的代表方言，長輩對出門的晚輩常說「단디 하고 온나」；口氣硬但滿滿是關心。"},{"text":"어데예","reading":"eodeye","zh":"哪裡的話／沒有啦","topic":"日常閒聊","level":"TOPIK2","example":"한국말 잘하시네예. — 어데예, 아직 멀었심더.","example_zh":"你韓語說得真好。——哪裡的話，還差得遠呢。","note":"＝標準語的 아니에요／별말씀을요。字面是「哪裡」，被稱讚時用來謙虛擋回去；-예 是慶尚道的客氣語尾（＝-요），聽起來軟軟的很親切。"},{"text":"우야노","reading":"uyano","zh":"怎麼辦啊","topic":"日常閒聊","level":"TOPIK2","example":"우야노, 지갑 놓고 왔다.","example_zh":"怎麼辦，我錢包忘了帶。","note":"＝標準語的 어떡해／어쩌니。어떻게 하노 的縮約，也常說成 우짜노；慌張、心疼、驚訝都能用，拉長音的「우야노~」是慶尚道阿姨的招牌感嘆。"},{"text":"됐다 마","reading":"dwaetda ma","zh":"算了啦","topic":"日常閒聊","level":"TOPIK2","example":"됐다 마, 내가 한다.","example_zh":"算了啦，我自己來。","note":"＝標準語的 됐어, 그만해。句尾的 마 是慶尚道語氣詞（跟叫人的「마!」不同），有「好了別再說了」的收尾感；賭氣或乾脆放下時用。"},{"text":"퍼뜩 온나","reading":"peotteuk onna","zh":"快點過來","topic":"日常閒聊","level":"TOPIK2","example":"늦겠다, 퍼뜩 온나!","example_zh":"要遲到了，快點過來！","note":"퍼뜩＝標準語的 빨리／얼른；온나＝標準語的 와라（過來）。催促必備組合，媽媽喊小孩吃飯的經典句是「퍼뜩 와서 밥 무라!」。"},{"text":"니캉 내캉","reading":"nikang naekang","zh":"你跟我","topic":"日常閒聊","level":"TOPIK2","example":"니캉 내캉 같이 가면 안 되나?","example_zh":"你跟我一起去不行嗎？","note":"＝標準語的 너랑 나랑。-캉＝助詞 -랑（和）；發音圓滾滾的很可愛，歌謠和綜藝模仿慶尚道方言時必出現。"},{"text":"고맙데이","reading":"gomapdei","zh":"謝謝啦","topic":"日常閒聊","level":"TOPIK2","example":"니 덕분에 잘 뭇다, 고맙데이.","example_zh":"託你的福吃得很飽，謝謝啦。","note":"＝標準語的 고마워／고맙다。句尾 -데이 是慶尚道的親切語尾，把陳述句收得軟軟的；「알았데이（知道了啦）」也是同款用法。"},{"text":"어서 오이소","reading":"eoseo oiso","zh":"歡迎光臨／快請進","topic":"日常閒聊","level":"TOPIK2","example":"어서 오이소! 억수로 싱싱합니더.","example_zh":"歡迎光臨！超級新鮮的喔。","note":"＝標準語的 어서 오세요。-이소 是慶尚道的敬語命令語尾（＝-으세요）；釜山札嘎其市場名句「오이소, 보이소, 사이소（來喔、看喔、買喔）」就是它。"},{"text":"가가 가가?","reading":"gaga gaga?","zh":"那個人就是那個人嗎？","topic":"日常閒聊","level":"TOPIK2","example":"니 어제 말한 가가 가가?","example_zh":"你昨天說的那個人就是這個人喔？","note":"＝標準語的 걔가 걔야?。가＝걔（那個人）；全靠音高重音分辨意思的著名例句，常被綜藝節目拿來考首爾人，是展示慶尚道聲調的定番教材。"}],"grammar":[{"question":"저는 학생___.（我是學生）","options":["이에요","예요","이요","요"],"answer":0,"explain_zh":"名詞結尾有尾音（받침）時接이에요，沒有尾音時接예요。학생的생以ㅇ結尾有尾音，所以是학생이에요。"},{"question":"제 친구는 가수___.（我朋友是歌手）","options":["이에요","예요","은요","이요"],"answer":1,"explain_zh":"가수的수以母音結尾、沒有尾音，所以接예요：가수예요。有尾音才接이에요。"},{"question":"저___ 대만 사람이에요.（我是台灣人）","options":["는","은","이","가"],"answer":0,"explain_zh":"介紹自己時主題用은/는。저沒有尾音接는；은接在有尾音的字後面。이/가用於強調或帶出新資訊，這裡不適合。"},{"question":"이름___ 뭐예요?（你叫什麼名字？）","options":["은","는","이","가"],"answer":2,"explain_zh":"疑問詞（뭐、누구、어디）前面詢問的對象是新資訊，用主格助詞이/가。이름的름有尾音（ㅁ），所以用이：이름이 뭐예요?。"},{"question":"저는 김치___ 좋아해요.（我喜歡泡菜）","options":["을","를","이","가"],"answer":1,"explain_zh":"좋아해요是他動詞，前面的受詞要接을/를。김치的치沒有尾音，所以接를：김치를 좋아해요。"},{"question":"아침에 밥___ 먹어요.（早上吃飯）","options":["을","를","은","는"],"answer":0,"explain_zh":"먹다的受詞接을/를。밥有尾音（ㅂ），所以接을：밥을 먹어요。를接在沒有尾音的字後面。"},{"question":"저는 매일 학교___ 가요.（我每天去學校）","options":["에","에서","를","은"],"answer":0,"explain_zh":"에表示移動的目的地或方向，和가다（去）、오다（來）搭配：학교에 가요。에서表示動作進行的場所，不能和單純的「去」搭配。"},{"question":"도서관___ 공부해요.（在圖書館唸書）","options":["에","에서","로","까지"],"answer":1,"explain_zh":"공부하다（唸書）是在某地進行的動作，動作發生的場所用에서：도서관에서 공부해요。에用於存在或目的地，例如도서관에 있어요。"},{"question":"A: 주말에 뭐 ___? B: 친구를 만나요.（A：週末要做什麼？）","options":["해요","이에요","있어요","예요"],"answer":0,"explain_zh":"問「做什麼」用動詞하다的해요體：뭐 해요?。이에요/예요接名詞表示「是…」，있어요表示「有／在」，語意都不合。"},{"question":"A: 이게 뭐예요? B: 한국어 책___.（B：是韓語書）","options":["예요","이에요","은요","가요"],"answer":1,"explain_zh":"책有尾音（ㄱ），所以接이에요：책이에요。예요接在沒有尾音的名詞後面，例如의자예요。"},{"question":"저는 아침마다 커피___ 마셔요.（我每天早上喝咖啡）","options":["을","를","이","은"],"answer":1,"explain_zh":"마시다（喝）的受詞接을/를。커피的피沒有尾音，所以接를：커피를 마셔요。"},{"question":"내일 시간이 ___?（你明天有時間嗎？）","options":["있어요","해요","가요","이에요"],"answer":0,"explain_zh":"表示「有／擁有」用있어요，否定是없어요。시간이 있어요?＝有時間嗎？해요是「做」、가요是「去」，語意不合。"},{"question":"어디___ 왔어요?（你從哪裡來？）","options":["에","에서","를","와"],"answer":1,"explain_zh":"에서除了表示動作場所，也表示出發點（從…）：어디에서 왔어요?＝你從哪裡來？回答是대만에서 왔어요（我從台灣來）。"},{"question":"매운 음식을 ___ 먹어요.（我不能吃辣的食物）","options":["안","못","잘","더"],"answer":1,"explain_zh":"못表示「能力上做不到」，안表示「主觀上不想做」。「不能吃辣」是能力問題，所以用못 먹어요；如果說안 먹어요是「我（選擇）不吃」。"},{"question":"주말에 같이 영화 ___?（週末要不要一起看電影？）","options":["볼래요","봤어요","보세요","봐요"],"answer":0,"explain_zh":"-(으)ㄹ래요?用於詢問對方的意願、提出邀約：볼래요?＝要看嗎？봤어요是過去式「看了」，보세요是命令「請看」，봐요當疑問時偏向確認而非邀約，最自然的邀約說法是볼래요?。"}],"lessons":[{"id":"kr-01","title":"韓文字是拼出來的","subtitle":"看懂一個字的積木結構，你就贏一半了","minutes":5,"sections":[{"type":"text","body":"很多人第一眼看到韓文，會覺得像神祕符號或圈圈叉叉。先告訴你一個好消息：韓文其實是【拼音文字】，就像注音或英文字母一樣，是用少少的字母「拼」出來的。它叫한글（Hangeul），是十五世紀世宗大王找學者設計的文字，目標就是【讓一般老百姓也學得會】，所以規則非常整齊。你不需要像學漢字那樣背幾千個字——只要學會二十幾個字母和拼法，理論上所有韓文你都唸得出來。"},{"type":"text","body":"韓文最特別的地方是：字母不是一個接一個排成一排，而是【組成一個方塊】，一塊就是一個音節，像堆積木。每一塊最多有三層：\n\n【초성（初聲）】＝開頭的子音\n【중성（中聲）】＝中間的母音\n【종성（終聲）】＝收尾的子音（可有可無）\n\n拿「韓國」的「韓」＝한來拆解看看：\nㅎ（h）＋ㅏ（a）＋ㄴ（n）→ 한（han）\n\n是不是很像注音的「ㄏ＋ㄢ＝韓」？只是韓文把它們【疊在同一個方塊裡】。以後看到韓文，先在心裡把方塊拆開，就一點都不可怕了。"},{"type":"tip","body":"有個小規則先記著：子音ㅇ放在字首時【不發音】，只是佔位用的（因為每個方塊規定要有開頭子音）。所以안唸「an」，不是「ngan」。"},{"type":"sounds","title":"點擊聽發音：拆積木","items":[{"text":"하","sub":"ㅎ + ㅏ = ha","zh":""},{"text":"안","sub":"ㅇ(不發音) + ㅏ + ㄴ = an","zh":""},{"text":"한","sub":"ㅎ + ㅏ + ㄴ = han","zh":"「韓」的音"},{"text":"안녕","sub":"an-nyeong","zh":"嗨（跟好朋友打招呼）"}]},{"type":"quiz","title":"小試身手","questions":[{"question":"한這個字，是由幾個字母拼起來的？","options":["1 個","2 個","3 個","4 個"],"answer":2,"explain_zh":"한＝ㅎ＋ㅏ＋ㄴ，共 3 個字母：開頭子音、中間母音、收尾子音，疊成一個方塊。"},{"question":"韓文的每一個方塊字，代表的是什麼？","options":["一個單字","一個音節","一個句子","一個聲調"],"answer":1,"explain_zh":"一塊＝一個音節。像안녕就是兩個音節、兩個方塊：안＋녕。"},{"question":"초성（初聲）指的是方塊裡的哪個部分？","options":["收尾的子音","中間的母音","開頭的子音","字的聲調"],"answer":2,"explain_zh":"초성＝開頭子音、중성＝中間母音、종성＝收尾子音。照順序記：初、中、終。"},{"question":"안的第一個字母ㅇ，在字首時要怎麼唸？","options":["唸 ng","不發音，只是佔位","唸 h","唸 m"],"answer":1,"explain_zh":"ㅇ在字首不發音，純粹佔開頭子音的位子，所以안唸「an」。它放在字尾時才唸 ng，這個之後會學到。"}]}]},{"id":"kr-02","title":"基本母音 10 個","subtitle":"點在哪邊、加不加橫，一套邏輯全記住","minutes":6,"sections":[{"type":"text","body":"韓文的基本母音有 10 個，全部由三種筆畫組合：【短橫（點）代表天、橫線ㅡ代表地、直線ㅣ代表人】，是不是很有哲學味？實際記的時候更簡單，用「方向」記：\n\n直線在中間，【點朝右（ㅏ）或朝左（ㅓ）】；橫線在中間，【點朝上（ㅗ）或朝下（ㅜ）】。然後有一個萬用規則：【一點變兩點，前面就多一個 y 的音】，例如ㅏ（a）→ㅑ（ya）、ㅗ（o）→ㅛ（yo）。所以你其實只要記 6 個基本形，剩下的用規則推就好。\n\n母音自己不能單獨成塊，前面要放不發音的ㅇ佔位，所以下面的發音練習都寫成아、야這種形式。"},{"type":"table","title":"形狀記憶法","headers":["字母","羅馬拼音","形狀怎麼記","口型提示"],"rows":[["ㅏ","a","點朝右＝嘴巴向外打開","像注音的ㄚ"],["ㅓ","eo","點朝左＝聲音悶回來","嘴巴放鬆的「喔」，比ㅗ開"],["ㅗ","o","點朝上＝聲音往上","嘴唇收圓的ㄛ"],["ㅜ","u","點朝下＝聲音往下","像注音的ㄨ"],["ㅡ","eu","一條地平線","嘴角往兩邊拉的「呃」"],["ㅣ","i","一個人站著","像注音的ㄧ"],["ㅑ ㅕ ㅛ ㅠ","ya yeo yo yu","兩點＝前面加 y","把上面四個加上ㄧ的滑音"]]},{"type":"sounds","title":"點擊聽發音：10 個母音","items":[{"text":"아","sub":"ㅏ · a","zh":""},{"text":"야","sub":"ㅑ · ya","zh":""},{"text":"어","sub":"ㅓ · eo","zh":""},{"text":"여","sub":"ㅕ · yeo","zh":""},{"text":"오","sub":"ㅗ · o","zh":""},{"text":"요","sub":"ㅛ · yo","zh":""},{"text":"우","sub":"ㅜ · u","zh":""},{"text":"유","sub":"ㅠ · yu","zh":""},{"text":"으","sub":"ㅡ · eu","zh":""},{"text":"이","sub":"ㅣ · i","zh":""}]},{"type":"tip","body":"偷偷預告：韓國人傳訊息打「ㅠㅠ」是哭哭的意思——因為ㅠ長得像一雙流眼淚的眼睛。學會母音，連韓國網路梗都看得懂了。"},{"type":"quiz","title":"小試身手","questions":[{"question":"母音上的一點變成兩點（如ㅏ→ㅑ），發音會怎麼變？","options":["前面多一個 y 的音","變成長音","變成鼻音","完全沒變"],"answer":0,"explain_zh":"一點變兩點＝加 y：ㅏ(a)→ㅑ(ya)、ㅓ(eo)→ㅕ(yeo)、ㅗ(o)→ㅛ(yo)、ㅜ(u)→ㅠ(yu)，一條規則搞定四個母音。"},{"question":"ㅓ的羅馬拼音是哪一個？","options":["a","eo","o","u"],"answer":1,"explain_zh":"點朝左的ㅓ是 eo，發音像嘴巴放鬆、開比較大的「喔」。點朝右的ㅏ才是 a。"},{"question":"韓國人聊天打「ㅠㅠ」是什麼意思？","options":["大笑","生氣","哭哭／嗚嗚","驚訝"],"answer":2,"explain_zh":"ㅠ像流淚的眼睛，所以ㅠㅠ（或ㅜㅜ）＝嗚嗚哭哭。大笑是子音ㅋㅋㅋ，之後會學到。"},{"question":"ㅡ（eu）的發音最接近下面哪一個？","options":["嘴巴大開的ㄚ","像ㄧ的音","嘴角往兩邊拉、齒縫擠出來的「呃」","嘴唇收圓的ㄡ"],"answer":2,"explain_zh":"ㅡ是中文沒有的音：嘴巴不圓、嘴角往兩邊拉，喉嚨發出短短的「呃」。多聽幾次音檔模仿看看。"}]}]},{"id":"kr-03","title":"基本子音 14 個","subtitle":"字母形狀就是你的嘴巴構造圖","minutes":7,"sections":[{"type":"text","body":"基本子音有 14 個。當年設計時有個超聰明的巧思：【字母形狀模仿發音時的口腔動作】。例如：\n\n・ㄱ：舌根抬起頂住的樣子 → g/k\n・ㄴ：舌尖頂上排牙齦的樣子 → n\n・ㅁ：嘴唇閉起來的形狀 → m\n・ㅅ：像牙齒的形狀 → s\n・ㅇ：喉嚨的圓形 → 字首不發音\n\n其他子音大多是在這五個基本形上【加筆畫，表示氣更強】：ㄱ→ㅋ、ㄷ→ㅌ、ㅂ→ㅍ、ㅈ→ㅊ。也就是說，長得像的子音，發音位置也一樣，只差送氣強弱。"},{"type":"table","title":"14 個子音與注音對照","headers":["字母","羅馬拼音","接近的注音","小提醒"],"rows":[["ㄱ","g/k","ㄍ～ㄎ之間","字首輕、字中偏濁"],["ㄴ","n","ㄋ",""],["ㄷ","d/t","ㄉ～ㄊ之間","字首輕、字中偏濁"],["ㄹ","r/l","ㄌ","帶一點彈舌，介於 r 和 l"],["ㅁ","m","ㄇ",""],["ㅂ","b/p","ㄅ～ㄆ之間","字首輕、字中偏濁"],["ㅅ","s","ㄙ","遇到ㅣ時唸起來像「西」（拼寫仍是 si）"],["ㅇ","-/ng","（字首不發音）","字尾才唸 ng"],["ㅈ","j","ㄗ～ㄐ之間",""],["ㅊ","ch","ㄘ～ㄑ之間","ㅈ的送氣版"],["ㅋ","k","ㄎ","ㄱ的送氣版"],["ㅌ","t","ㄊ","ㄷ的送氣版"],["ㅍ","p","ㄆ","ㅂ的送氣版"],["ㅎ","h","ㄏ",""]]},{"type":"sounds","title":"點擊聽發音：子音＋ㅏ","items":[{"text":"가","sub":"ga","zh":""},{"text":"나","sub":"na","zh":""},{"text":"다","sub":"da","zh":""},{"text":"라","sub":"ra","zh":""},{"text":"마","sub":"ma","zh":""},{"text":"바","sub":"ba","zh":""},{"text":"사","sub":"sa","zh":""},{"text":"아","sub":"a（ㅇ不發音）","zh":""},{"text":"자","sub":"ja","zh":""},{"text":"차","sub":"cha","zh":""},{"text":"카","sub":"ka","zh":""},{"text":"타","sub":"ta","zh":""},{"text":"파","sub":"pa","zh":""},{"text":"하","sub":"ha","zh":""}]},{"type":"tip","body":"ㄱ標成 g/k、ㄷ標成 d/t，不是課本在耍你——同一個字母在字首聽起來偏清（像ㄎ），夾在母音中間偏濁（像ㄍ）。不用糾結，跟著音檔唸，嘴巴會自己找到位置。"},{"type":"quiz","title":"小試身手","questions":[{"question":"ㅁ的形狀，模仿的是發音時的哪個部位？","options":["舌根","閉起來的嘴唇","牙齒","喉嚨"],"answer":1,"explain_zh":"ㅁ就是嘴唇閉起來的方形，發 m 音。喉嚨的圓形是ㅇ、牙齒是ㅅ、舌根是ㄱ。"},{"question":"ㅎ的發音最接近哪個注音？","options":["ㄏ","ㄋ","ㄇ","ㄌ"],"answer":0,"explain_zh":"ㅎ＝h＝ㄏ。像하（ha）、안녕하세요的하就是它。"},{"question":"ㅋ、ㅌ、ㅍ、ㅊ和ㄱ、ㄷ、ㅂ、ㅈ的關係是什麼？","options":["完全無關","是它們的送氣加強版","是它們的鼻音版","只是寫法不同、發音相同"],"answer":1,"explain_zh":"加一筆＝送氣變強：ㄱ→ㅋ、ㄷ→ㅌ、ㅂ→ㅍ、ㅈ→ㅊ。發音位置相同，只差那口氣。"},{"question":"哪個子音放在字首時不發音？","options":["ㅅ","ㅇ","ㄹ","ㅍ"],"answer":1,"explain_zh":"ㅇ在字首只是佔位不發音（아＝a）；放在字尾當收尾音時才唸 ng。"}]}]},{"id":"kr-04","title":"拼讀組合：가나다라開口唸","subtitle":"子音×母音，你已經能唸出真正的韓文了","minutes":7,"sections":[{"type":"text","body":"字母都認識了，現在把積木疊起來！子音＋母音就是一個完整的音節：ㄱ＋ㅏ＝가（ga）、ㄴ＋ㅜ＝누（nu）。韓國小朋友學拼讀時就是唸【가나다라마바사……】，地位跟我們的ㄅㄆㄇㄈ一樣。"},{"type":"text","body":"疊法只有兩種，看母音的長相決定：\n\n・【直式母音】（ㅏㅑㅓㅕㅣ）：寫在子音的【右邊】→ 가、니\n・【橫式母音】（ㅗㅛㅜㅠㅡ）：寫在子音的【下面】→ 고、누\n\n道理很直觀：直的站旁邊、橫的躺下面，方塊才會方方正正。"},{"type":"table","title":"迷你拼音表（子音×母音）","headers":["","ㅏ (a)","ㅗ (o)","ㅜ (u)","ㅣ (i)"],"rows":[["ㄱ (g)","가 ga","고 go","구 gu","기 gi"],["ㄴ (n)","나 na","노 no","누 nu","니 ni"],["ㄷ (d)","다 da","도 do","두 du","디 di"],["ㄹ (r)","라 ra","로 ro","루 ru","리 ri"],["ㅁ (m)","마 ma","모 mo","무 mu","미 mi"],["ㅅ (s)","사 sa","소 so","수 su","시 si"]]},{"type":"sounds","title":"點擊聽發音：拼讀練習","items":[{"text":"가나다라","sub":"ga-na-da-ra","zh":"韓文的「ㄅㄆㄇㄈ」"},{"text":"나","sub":"na","zh":"我（跟熟朋友說話時用的「我」）"},{"text":"우리","sub":"u-ri","zh":"我們"},{"text":"어디","sub":"eo-di","zh":"哪裡"},{"text":"여기","sub":"yeo-gi","zh":"這裡"},{"text":"가수","sub":"ga-su","zh":"歌手"},{"text":"커피","sub":"keo-pi","zh":"咖啡"}]},{"type":"tip","body":"從今天起，看到韓劇片名、專輯封面、泡麵包裝，都試著拆拆看、唸唸看。拼對一個字的成就感，比背十個單字還持久。"},{"type":"quiz","title":"小試身手","questions":[{"question":"ㄴ＋ㅜ拼起來是哪個字？","options":["누","나","니","노"],"answer":0,"explain_zh":"ㅜ是橫式母音，寫在ㄴ下面＝누（nu）。나是ㄴ＋ㅏ、니是ㄴ＋ㅣ、노是ㄴ＋ㅗ。"},{"question":"ㅗ這種橫式母音，要寫在子音的哪裡？","options":["右邊","下面","上面","左邊"],"answer":1,"explain_zh":"橫式母音（ㅗㅜㅡ等）躺在子音下面，如고、누；直式母音（ㅏㅓㅣ等）站在右邊，如가、니。"},{"question":"어디是什麼意思？","options":["我們","哪裡","這裡","歌手"],"answer":1,"explain_zh":"어디＝哪裡。之後問路的어디예요?（在哪裡？）就是用它。우리＝我們、여기＝這裡、가수＝歌手。"},{"question":"기是由哪兩個字母拼成的？","options":["ㄱ＋ㅣ","ㄴ＋ㅣ","ㄱ＋ㅏ","ㅋ＋ㅣ"],"answer":0,"explain_zh":"기＝ㄱ（g）＋ㅣ（i）＝gi。여기（這裡）的기就是它。"}]}]},{"id":"kr-05","title":"收尾音받침","subtitle":"疊在最下面的第三塊積木，只有 7 種聲音","minutes":7,"sections":[{"type":"text","body":"還記得第一課的한嗎？最下面那個ㄴ就是【받침（收尾音）】——疊在音節方塊最底部的子音。받침原意是「墊子、支架」，很形象吧。\n\n好消息是：雖然很多子音都能當받침，但實際發音【只有 7 種代表音】。而且這 7 種對台灣人不算陌生——ㄱ、ㄷ、ㅂ收尾就像台語的入聲字（例如台語「十」sip 結尾閉嘴唇的感覺），是短促的急煞車，不把音完整發出來。"},{"type":"table","title":"7 種代表音","headers":["代表音","羅馬拼音","感覺","例字"],"rows":[["ㄱ","k","舌根急煞，像台語「國」的尾音","한국（韓國）"],["ㄴ","n","舌尖抵住，像ㄢㄣ的尾音","시간（時間）"],["ㄷ","t","舌尖急煞（ㅅㅈㅊㅌㅎ等收尾都唸它）","듣다（聽）"],["ㄹ","l","舌尖輕捲，像英文的 l","잘（好好地）"],["ㅁ","m","閉上嘴唇哼一下","이름（名字）"],["ㅂ","p","閉上嘴唇急煞，像台語「十」","밥（飯）"],["ㅇ","ng","鼻音，像ㄤㄥ的尾音","학생（學生）"]]},{"type":"sounds","title":"點擊聽發音：받침例字","items":[{"text":"밥","sub":"bap · ㅂ收尾","zh":"飯"},{"text":"한국","sub":"han-guk · ㄴ和ㄱ收尾","zh":"韓國"},{"text":"이름","sub":"i-reum · ㅁ收尾","zh":"名字"},{"text":"학생","sub":"hak-saeng · ㄱ和ㅇ收尾","zh":"學生"},{"text":"잘","sub":"jal · ㄹ收尾","zh":"好好地"},{"text":"시간","sub":"si-gan · ㄴ收尾","zh":"時間"}]},{"type":"tip","body":"ㅅ、ㅈ、ㅊ、ㅌ、ㅎ當받침時通通唸成ㄷ（t）的急煞音。所以看到陌生받침別慌，先想「它屬於 7 種裡的哪一種」。"},{"type":"quiz","title":"小試身手","questions":[{"question":"받침寫在音節方塊的什麼位置？","options":["左上","右上","最下面","寫在前一個字的旁邊"],"answer":2,"explain_zh":"받침（收尾音）疊在方塊最底部，是第三層積木，例如한最下面的ㄴ。"},{"question":"학생這個詞裡，總共有幾個받침？","options":["0 個","1 個","2 個","3 個"],"answer":2,"explain_zh":"학的ㄱ和생的ㅇ，共 2 個받침。所以唸 hak-saeng，一個急煞一個鼻音。"},{"question":"ㅅ當받침的時候，實際唸成哪個代表音？","options":["ㄱ（k）","ㄷ（t）","ㅂ（p）","ㅇ（ng）"],"answer":1,"explain_zh":"ㅅ、ㅈ、ㅊ、ㅌ、ㅎ收尾時全部歸到ㄷ（t）的舌尖急煞音，這就是「很多字母、只有 7 種聲音」的意思。"},{"question":"밥（飯）的收尾音，發音的感覺是？","options":["閉上嘴唇急煞的 p","舌尖的 t","鼻音 ng","捲舌的 r"],"answer":0,"explain_zh":"ㅂ받침＝雙唇閉住、聲音急停，很像台語入聲「十（sip）」的結尾。之後學밥 먹었어요?（吃飯了嗎？）就用得到。"}]}]},{"id":"kr-06","title":"雙子音與複合母音","subtitle":"喉嚨繃緊的緊音，還有ㅐ/ㅔ的世紀難題","minutes":7,"sections":[{"type":"text","body":"先幫第三課的舊朋友取正式名字：가這種基本版子音叫【平音】，카這種加筆畫的送氣加強版叫【激音】。今天要認識第三兄弟——把子音寫兩次的【雙子音（緊音）】：ㄲ、ㄸ、ㅃ、ㅆ、ㅉ。它的訣竅是【喉嚨和肌肉繃緊、完全不送氣】，聲音又短又硬。\n\n拿手掌放嘴巴前面感覺一下三兄弟的差別：\n・가（平音）：輕輕的，一點點氣\n・카（激音）：一大口氣噴在手上\n・까（緊音）：【幾乎沒有氣】，但喉嚨緊緊的、音很結實\n\n有點像台語「餅（piánn）」開頭那種又硬又不噴氣的感覺。網路笑聲ㅋㅋㅋ用的是激音ㅋ，而진짜（真的）的ㅉ就是緊音——唸對了才有那種「真·的·假·的！」的力道。"},{"type":"sounds","title":"點擊聽發音：緊音","items":[{"text":"까","sub":"kka","zh":""},{"text":"따","sub":"tta","zh":""},{"text":"빠","sub":"ppa","zh":""},{"text":"싸","sub":"ssa","zh":""},{"text":"짜","sub":"jja","zh":""},{"text":"진짜","sub":"jin-jja","zh":"真的"},{"text":"오빠","sub":"o-ppa","zh":"哥哥（女生的叫法）"}]},{"type":"text","body":"母音也能組合。最常用的是這幾個：ㅐ（ae）、ㅔ（e）、ㅘ（wa）、ㅝ（wo）、ㅟ（wi）、ㅢ（ui）。還記得第二課「一點變兩點＝加 y」嗎？這裡一樣通用：ㅐ→ㅒ（yae）、ㅔ→ㅖ（ye），像正式回答「是」的예用的就是ㅖ。\n\n然後是初學者的世紀難題：【ㅐ和ㅔ聽起來到底差在哪？】答案讓你安心——【現代韓國人自己也唸得一模一樣】，連他們拼字都會拼錯。所以策略很簡單：發音都唸「ㄝ」就好，【拼寫跟著單字背】：대만（台灣）用ㅐ、게임（遊戲）用ㅔ，看到一個記一個，不用糾結耳朵。"},{"type":"sounds","title":"點擊聽發音：ㅐ/ㅔ常見字","items":[{"text":"대만","sub":"dae-man · 用ㅐ","zh":"台灣"},{"text":"네","sub":"ne · 用ㅔ","zh":"是的"},{"text":"게임","sub":"ge-im · 用ㅔ","zh":"遊戲"},{"text":"어때요?","sub":"eo-ttae-yo · 用ㅐ","zh":"如何？怎麼樣？"}]},{"type":"tip","body":"自我介紹說「我是台灣人」的대만就是ㅐ；約朋友問「星期六如何？」的어때요?也是ㅐ，而且還有緊音ㄸ。這兩個字之後的課會天天見。"},{"type":"quiz","title":"小試身手","questions":[{"question":"緊音（ㄲㄸㅃㅆㅉ）的發音特徵是什麼？","options":["送出一大口氣","喉嚨繃緊、幾乎不送氣","帶鼻音","要捲舌"],"answer":1,"explain_zh":"緊音的關鍵是肌肉繃緊＋不送氣，聲音短而結實。送一大口氣的是激音（ㅋㅌㅍㅊ）。"},{"question":"진짜（真的）裡的ㅉ屬於哪一類？","options":["平音","激音","緊音","收尾音"],"answer":2,"explain_zh":"ㅉ是ㅈ寫兩次的緊音。唸진짜時짜要又短又硬、不噴氣，才有「真的假的！」的味道。"},{"question":"ㅐ和ㅔ在現代韓語口語中的差別是？","options":["差非常多，聽錯會鬧笑話","發音幾乎一樣，靠背單字記拼寫","ㅐ是長音、ㅔ是短音","ㅐ只用在外來語"],"answer":1,"explain_zh":"現代韓國人把ㅐ和ㅔ唸得一樣，連母語者都會拼錯。發音統一唸「ㄝ」，拼寫跟著單字記就好。"},{"question":"대만（台灣）的대，用的是哪個母音？","options":["ㅔ","ㅐ","ㅖ","ㅘ"],"answer":1,"explain_zh":"대만用ㅐ（ae）：daeman。跟韓國朋友自我介紹저는 대만 사람이에요（我是台灣人）時就會寫到它。"}]}]},{"id":"kr-07","title":"連音與音變入門","subtitle":"為什麼먹어요唸成「머거요」？","minutes":6,"sections":[{"type":"text","body":"你可能發現了：韓文有時候【寫的和唸的不一樣】。別怕，這不是陷阱，是為了唸起來順口。音變規則不少，但初學只要抓【最常見的 3 種】就夠用了。\n\n第一種也是最重要的：【連音】。當一個字有받침、下一個字以ㅇ（空位）開頭時，받침會【滑過去佔那個空位】。經典例子：먹어요（吃）——먹的ㄱ滑到어上面，實際唸成【머거요】。寫是먹어요，唸是머거요，就這麼回事。"},{"type":"table","title":"最常見的 3 種音變","headers":["規則","怎麼變","例子","實際唸法"],"rows":[["連音","받침滑到下一個ㅇ的空位","먹어요（吃）","머거요"],["ㅎ弱化","夾在母音間的ㅎ幾乎消失","좋아요（好、讚）","조아요"],["鼻音化","ㅂ遇到ㄴ變成ㅁ","합니다（正式語尾）","함니다"]]},{"type":"sounds","title":"點擊聽發音：寫的vs唸的","items":[{"text":"먹어요","sub":"meogeoyo · 唸[머거요]","zh":"吃"},{"text":"좋아요","sub":"joayo · 唸[조아요]","zh":"好、讚"},{"text":"맛있어요","sub":"masisseoyo · 唸[마시써요]","zh":"好吃"},{"text":"감사합니다","sub":"gamsahamnida · 唸[감사함니다]","zh":"謝謝（正式）"}]},{"type":"tip","body":"不用死背規則！這些音變都是「嘴巴偷懶的自然結果」，跟著音檔多唸幾次，你的嘴巴自己就會變過去。規則只是幫你理解「為什麼聽起來不一樣」。"},{"type":"quiz","title":"小試身手","questions":[{"question":"먹어요實際上唸成什麼？","options":["먹-어-요 一格一格分開唸","머거요","멍어요","메꺼요"],"answer":1,"explain_zh":"먹的받침ㄱ滑到下一格어的ㅇ空位上：먹어요→[머거요]。這就是連音。"},{"question":"連音會在什麼情況下發生？","options":["前字有받침、後字以ㅇ開頭時","兩個字都沒有받침時","只在唱歌的時候","只在正式場合"],"answer":0,"explain_zh":"받침後面接ㅇ開頭（空位）的字，받침就滑過去，例如맛있어요唸[마시써요]。"},{"question":"감사합니다的합니다部分，實際唸成？","options":["합니다，照字唸","함니다","하니다","합미다"],"answer":1,"explain_zh":"ㅂ받침遇到ㄴ會鼻音化變成ㅁ：합니다→[함니다]。以後聽到「感謝哈姆尼達」就知道為什麼了。"},{"question":"좋아요裡的ㅎ怎麼處理？","options":["用力唸得很重","幾乎不發音，唸成[조아요]","變成ㄱ的音","變成ㅁ的音"],"answer":1,"explain_zh":"ㅎ夾在母音之間會弱化到幾乎聽不見：좋아요→[조아요]。按讚的「좋아요」就是這個字。"}]}]},{"id":"kr-08","title":"打招呼句型","subtitle":"拆解안녕하세요，順便學會「我是○○」","minutes":7,"sections":[{"type":"text","body":"終於要開口說整句了！先拆解你一定聽過的안녕하세요：\n\n【안녕】＝漢字「安寧」，就是平安的意思\n【하세요】＝動詞하다（做）的客氣尊敬形\n\n合起來像客氣地問候「您安好嗎？」，所以안녕하세요不分早午晚、對誰都能用，是最萬用的問候。而單獨一句【안녕】是半語（반말），只能對很熟的同齡朋友或晚輩說——對長輩或初次見面的人只說안녕會很失禮，這是韓國文化的大地雷，先記起來。"},{"type":"sounds","title":"點擊聽發音：打招呼","items":[{"text":"안녕하세요","sub":"annyeonghaseyo","zh":"你好（萬用）"},{"text":"안녕","sub":"annyeong","zh":"嗨（只對熟朋友）"},{"text":"만나서 반가워요","sub":"mannaseo bangawoyo","zh":"很高興認識你"}]},{"type":"text","body":"打完招呼就要自我介紹了。韓文的「是～」放在句尾，有兩張面孔：【이에요／예요】。選哪個只看一件事——【前面名詞的最後一個字有沒有받침】：\n\n・有받침 → 이에요：학생【이에요】（是學生，생有ㅇ받침）\n・沒받침 → 예요：가수【예요】（是歌手，수沒받침）\n\n為什麼？有받침時多墊一個이，唸起來才順——還記得第七課的連音嗎？사람이에요會唸成[사라미에요]，람的ㅁ剛好滑到이的空位上。\n\n例句裡有兩個新面孔先打個照面：【저】是「我」的客氣說法（第四課的나只對熟朋友用），後面的【는】是「說到我呢～」的主題小尾巴，先把저는（我呢）當固定組合記住；【제】＝「我的」。至於問名字的이름이 뭐예요?，句中的이也是一個小助詞，現階段把整句當固定句型背起來最省力。"},{"type":"table","title":"이에요／예요 選擇器","headers":["名詞結尾","接什麼","例句","意思"],"rows":[["有받침（학생）","이에요","저는 학생이에요","我是學生"],["沒받침（가수）","예요","제 친구는 가수예요","我朋友是歌手"],["有받침（사람）","이에요","저는 대만 사람이에요","我是台灣人"]]},{"type":"sounds","title":"點擊聽發音：自我介紹","items":[{"text":"저는 대만 사람이에요","sub":"jeoneun daeman saramieyo","zh":"我是台灣人"},{"text":"저는 학생이에요","sub":"jeoneun haksaengieyo","zh":"我是學生"},{"text":"이름이 뭐예요?","sub":"ireumi mwoyeyo?","zh":"你叫什麼名字？"}]},{"type":"tip","body":"跟韓國朋友第一次見面的黃金三句：안녕하세요 → 저는 대만 사람이에요 → 만나서 반가워요。講完這三句，對方通常眼睛會亮起來。"},{"type":"quiz","title":"小試身手","questions":[{"question":"對初次見面的長輩打招呼，應該說哪句？","options":["안녕","안녕하세요","잘 가","야!"],"answer":1,"explain_zh":"안녕하세요對誰都不失禮；안녕是半語，只能對很熟的同齡朋友用，對長輩說會很沒禮貌。"},{"question":"저는 학생___.（我是學生）空格填什麼？","options":["예요","이에요","이야","요"],"answer":1,"explain_zh":"학생的생有받침（ㅇ），所以接이에요：학생이에요。"},{"question":"제 친구는 가수___.（我朋友是歌手）空格填什麼？","options":["예요","이에요","은요","이요"],"answer":0,"explain_zh":"가수的수以母音結尾、沒有받침，所以接예요：가수예요。"},{"question":"안녕하세요的안녕，原本的意思是？","options":["安寧、平安","再見","吃飯了嗎","早上好"],"answer":0,"explain_zh":"안녕＝漢字「安寧」。안녕하세요字面是「願你平安」，所以任何時段、任何對象都適用。"}]}]},{"id":"kr-09","title":"해요體入門","subtitle":"交朋友最好用的說話方式，變化規則一次搞定","minutes":7,"sections":[{"type":"text","body":"韓語說話有「等級」，初學先認識三層就好：\n\n・【합쇼體】（-습니다）：最正式，新聞、面試、對客戶\n・【해요體】（-아/어요）：客氣又不僵硬，日常最常用\n・【반말】（半語）：只對很熟的同齡朋友或晚輩\n\n為什麼交朋友用【해요體】？因為它是「禮貌與親切的甜蜜點」——夠尊重、不失禮，又不會像합쇼體那樣有距離感。對新認識的韓國朋友用해요體，等對方提議말 놓자（我們講半語吧），再切換成반말，這是韓國交友的標準流程。"},{"type":"text","body":"해요體的變化規則，最簡版只有三條：\n\n1. 去掉原形的다，看語幹最後一個母音\n2. 是【ㅏ或ㅗ】→ 接아요；【其他】→ 接어요\n3. 【하다結尾】的動詞 → 直接變해요\n\n例如：가다（去）→ 가＋아요 → 縮成【가요】；먹다（吃）→ 먹＋어요 →【먹어요】；좋아하다（喜歡）→【좋아해요】。就這樣，你已經會變韓語動詞了。"},{"type":"table","title":"動詞變化練習","headers":["原形","規則","해요體","意思"],"rows":[["가다","ㅏ → 아요（縮寫）","가요","去"],["먹다","ㅓ → 어요","먹어요","吃"],["마시다","시＋어요 → 縮成셔요","마셔요","喝"],["있다","有받침擋著不能縮，直接接어요","있어요","有、在"],["좋아하다","하다 → 해요","좋아해요","喜歡"]]},{"type":"sounds","title":"點擊聽發音：해요體動詞","items":[{"text":"가요","sub":"gayo","zh":"去"},{"text":"먹어요","sub":"meogeoyo","zh":"吃"},{"text":"마셔요","sub":"masyeoyo","zh":"喝"},{"text":"있어요","sub":"isseoyo","zh":"有、在"},{"text":"좋아해요","sub":"joahaeyo","zh":"喜歡"},{"text":"케이팝 좋아해요","sub":"keipap joahaeyo","zh":"我喜歡 K-POP（口語常這樣直接說）"}]},{"type":"tip","body":"해요體還有隱藏福利：同一句話【句尾上揚就是問句】。커피 마셔요?（要喝咖啡嗎？）↗、커피 마셔요（我在喝咖啡）↘——不用改字，改語調就好。"},{"type":"quiz","title":"小試身手","questions":[{"question":"跟剛認識的韓國朋友說話，最安全的說話方式是？","options":["반말（半語）","해요體","都用英文","합쇼體全程到底"],"answer":1,"explain_zh":"해요體客氣又親切，是交朋友的預設值。반말要等夠熟、對方提議之後才能用；합쇼體太正式會有距離感。"},{"question":"먹다（吃）的해요體是？","options":["먹아요","먹어요","먹여요","먹해요"],"answer":1,"explain_zh":"먹的母音是ㅓ，不是ㅏ/ㅗ，所以接어요：먹어요。還記得嗎？實際唸起來是[머거요]。"},{"question":"하다（做）的해요體是？","options":["해요","하아요","하요","했요"],"answer":0,"explain_zh":"하다家族是特例，直接變해요。所以좋아하다→좋아해요、말하다→말해요，超多動詞都適用。"},{"question":"가다（去）的語幹母音是ㅏ，所以要接？","options":["아요，而且가아縮成가，變가요","어요，變가어요","여요，變가여요","해요，變가해요"],"answer":0,"explain_zh":"ㅏ/ㅗ接아요；가＋아重複了就縮成一個가，所以是가요。오다（來）同理變와요。"}]}]},{"id":"kr-10","title":"數字與時間","subtitle":"兩套數字系統，用錯場合韓國人會愣一下","minutes":8,"sections":[{"type":"text","body":"韓語有【兩套數字】，這是初學最容易搞混的地方，先把觀念建好：\n\n・【漢字語數字】일、이、삼、사……：從漢字「一二三」來的，發音跟台語有夠像（일=一 il、삼=三 sam），台灣人根本自帶外掛\n・【固有語數字】하나、둘、셋、넷……：韓語土生土長的數法\n\n粗略的分工是：【漢字語管「編號類」】（日期、金額、電話號碼、分鐘），【固有語管「數東西類」】（幾個、幾歲、幾點鐘、幾個人）。拍照倒數「一、二、三！」用的是固有語：하나, 둘, 셋!"},{"type":"sounds","title":"點擊聽發音：兩套數字","items":[{"text":"일, 이, 삼","sub":"il, i, sam · 漢字語","zh":"一、二、三（編號類）"},{"text":"하나, 둘, 셋","sub":"hana, dul, set · 固有語","zh":"一、二、三（數東西類）"}]},{"type":"table","title":"什麼場合用哪套？","headers":["場合","用哪套","例子"],"rows":[["日期、月份","漢字語","칠월 십오일（7月15日）"],["金額","漢字語","만 원（一萬韓元）"],["電話號碼","漢字語","010＝공일공（0唸공）"],["分鐘","漢字語","십 분（10分鐘）"],["點鐘","固有語","세 시（3點）"],["年齡","固有語","스물다섯 살（25歲）"],["數個數、人數","固有語","커피 한 잔（一杯咖啡）"]]},{"type":"text","body":"最經典的混合題：講時間時【「點」用固有語、「分」用漢字語】，同一句話兩套並用——세 시 십 분（3點10分）。\n\n還有一個小變身要注意：固有語數字接單位詞時，前四個會「瘦身」：하나→【한】、둘→【두】、셋→【세】、넷→【네】。所以是한 시（1點）、두 시（2點）、세 시（3點），不是하나 시。"},{"type":"sounds","title":"點擊聽發音：時間與金額","items":[{"text":"지금 몇 시예요?","sub":"jigeum myeot siyeyo?","zh":"現在幾點？"},{"text":"세 시 반이에요","sub":"se si banieyo · 반＝漢字「半」","zh":"三點半"},{"text":"얼마예요?","sub":"eolmayeyo?","zh":"多少錢？"},{"text":"만 원이에요","sub":"man wonieyo","zh":"一萬韓元"}]},{"type":"tip","body":"韓文的「一萬」直接說만，不說일만——所以是만 원（一萬韓元），約台幣兩百多元。去韓國逛街聽到만 원別再等「一」了。"},{"type":"quiz","title":"小試身手","questions":[{"question":"「三點」的韓語怎麼說？","options":["세 시","삼 시","셋 시","서 시"],"answer":0,"explain_zh":"點鐘用固有語，而且셋接시時要瘦身成세：세 시。삼是漢字語，用在分鐘、日期那邊。"},{"question":"唸電話號碼要用哪套數字？","options":["固有語（하나둘셋）","漢字語（일이삼）","兩套隨便混用","只能用英文唸"],"answer":1,"explain_zh":"電話號碼是「編號類」，用漢字語，而且0唸공：010＝공일공。"},{"question":"세 시 십 분（3點10分）這句話，「분（分）」用的是哪套？","options":["漢字語","固有語","兩套都不是","英文外來語"],"answer":0,"explain_zh":"時間是兩套並用的經典：「點」用固有語（세 시）、「分」用漢字語（십 분），一句話裡兩套一起上場。"},{"question":"만 원是多少錢？","options":["十萬韓元","一千韓元","一萬韓元","一百韓元"],"answer":2,"explain_zh":"만＝萬，만 원＝一萬韓元。注意韓文直接說만，不說일만，跟中文習慣不同。"}]}]},{"id":"kr-11","title":"韓國流行語與網路文化","subtitle":"學會拆解新造語，聽懂年輕人在聊什麼","minutes":7,"sections":[{"type":"text","body":"韓國的流行語叫신조어（新造語），它的汰換速度快到連韓國人自己都追不上。為什麼變這麼快？第一，韓國是超高度網路化的社會，大家整天泡在聊天室、留言區和直播彈幕裡，【打字要快】就成了全民運動——能縮就縮、能省就省。第二，綜藝節目和偶像的影響力驚人：一個藝人在節目上講了一個新詞，隔天全國的國高中生都在用。\n\n那為什麼值得學？因為流行語是【交朋友的通關密語】。你跟韓國朋友聊天時，對方丟出一個혼밥或대박，你如果聽得懂、還能自然接話，距離馬上拉近一大截；追劇看綜藝時，字幕上的梗你也才笑得出來。這一課不是要你死背單字，而是教你一套【拆解方法】——以後遇到沒看過的新詞，你自己就能推敲出七八成。"},{"type":"text","body":"韓國新造語看起來千變萬化，其實九成都是這三招變出來的：\n\n【第一招：縮合】兩個詞各取開頭，黏成一個新詞。\n혼밥＝혼자（獨自）＋밥（飯）→「一個人吃飯」\n學會這招你馬上能舉一反三：혼술＝혼자＋술（酒）→「一個人喝酒」。\n\n【第二招：字首縮寫（초성체）】只打每個字的初聲子音，母音全省略。\nㅇㅈ＝인정（認同）的兩個初聲ㅇ、ㅈ →「同意、認證」\n這跟台灣網友只打注音的「ㄏㄏ」（呵呵）是一模一樣的邏輯。同家族還有ㄱㅅ＝감사（感謝）。\n\n【第三招：整句壓縮】把一整句話或片語壓成兩三個字。\n불금＝불타는 금요일（燃燒的星期五）→「狂歡的週五夜」\n注意금요일來自漢字語「金曜日」——很多壓縮詞的零件其實是漢字詞，會中文的你天生就有解碼優勢。\n\n以後看到陌生新詞，照這個 SOP 拆：先猜它是哪一招 → 試著還原成完整的詞或句子 → 再用前後文對答案。這個「拆解反射」才是本課真正要送你的禮物。"},{"type":"sounds","title":"點擊聽發音：高頻流行語點名","items":[{"text":"혼밥","sub":"hon-bap＝혼자＋밥","zh":"一個人吃飯"},{"text":"대박","sub":"dae-bak","zh":"太扯了、超讚（驚嘆萬用詞）"},{"text":"멘붕","sub":"men-bung＝멘탈＋붕괴","zh":"心態崩了"},{"text":"꿀팁","sub":"kkul-tip＝꿀（蜂蜜）＋팁","zh":"超實用的小撇步"},{"text":"불금","sub":"bul-geum＝불타는 금요일","zh":"狂歡的週五夜"},{"text":"치맥","sub":"chi-maek＝치킨＋맥주","zh":"炸雞配啤酒"},{"text":"셀카","sub":"sel-ka＝셀프＋카메라","zh":"自拍"},{"text":"인싸","sub":"in-ssa＝인사이더","zh":"人緣好的圈內人（反義：아싸邊緣人）"}]},{"type":"table","title":"流行語拆解對照表","headers":["流行語","拆解","意思"],"rows":[["혼밥","혼자（獨自）＋밥（飯）","一個人吃飯"],["혼술","혼자（獨自）＋술（酒）","一個人小酌"],["멘붕","멘탈（mental）＋붕괴（崩壞）","心態崩了、大受打擊"],["꿀팁","꿀（蜂蜜）＋팁（tip）","像蜂蜜一樣甜的實用祕訣"],["불금","불타는（燃燒的）＋금요일（星期五）","狂歡的週五夜"],["치맥","치킨（炸雞）＋맥주（啤酒）","炸雞配啤酒的國民組合"],["셀카","셀프（self）＋카메라（camera）","自拍"],["인싸／아싸","인사이더／아웃사이더","圈內人氣王／邊緣人"],["ㅇㅈ","인정（認同）的初聲縮寫","「同意！」「真的！」"],["ㄱㅅ","감사（感謝）的初聲縮寫","「謝啦」（聊天室用）"]]},{"type":"tip","body":"流行語的使用心法只有三句話：一、【聽懂優先】——你的首要目標是聽懂別人在說什麼，不是急著自己用。二、跟熟的年輕朋友聊天時自然用上一兩個，對方會覺得你很上道，好感度大加分。三、【正式場合絕對不要用】——面試、對長輩、寫正式信件時用流行語，就像面試時說「這公司也太甜了吧」，瞬間扣分。拿捏不準的時候，一律選擇不用，先當個安靜的聽懂者就好。"},{"type":"text","body":"【文化補充・見識用】（這一段純粹讓你長見識，不會出現在本課任何練習題裡。）\n\n流行語有【壽命】。上面表格裡的詞都已經活了很多年、進入日常，可以放心學；但也有一大批「當紅炸子雞」可能今年爆紅、明年就過氣——例如어쩔티비（「不然你要怎樣，去看電視啊」的耍賴語）紅極一時後迅速退燒，現在用反而顯得過時；갑분싸（氣氛突然冷掉）也已經從巔峰滑落。這類詞聽懂就好，別花力氣背。\n\n另外有一區是【語域危險區】：有些詞帶粗俗成分，最有名的就是존맛탱（超級好吃，常縮寫成 JMT）——它的존來自粗話존나，年輕人之間講很平常，但從外國人或長輩嘴裡說出來，輕則突兀、重則失禮。類似含존、씨開頭成分的詞都要特別小心。\n\n那怎麼判斷「這個詞我該不該用」？給你三個語感檢查點：一、【電視綜藝的字幕敢不敢打出來】——公開字幕會出現的詞（혼밥、대박）通常安全；二、【什麼年齡層在用】——如果只在國高中生的留言區看到，你先別用；三、【拆開來的零件乾不乾淨】——拆解後含有粗話成分的，一律只聽不說。記住：聽懂是能力，亂用是風險。"},{"type":"quiz","title":"小試身手","questions":[{"question":"혼밥是由哪兩個詞縮合而成的？","options":["혼자（獨自）＋밥（飯）","혼돈（混沌）＋밥（飯）","혼자（獨自）＋방（房間）","결혼（結婚）＋밥（飯）"],"answer":0,"explain_zh":"혼밥＝혼자＋밥，各取開頭黏起來，意思是「一個人吃飯」。同一招還能拆出혼술（一個人喝酒）。"},{"question":"聊天室裡有人回你「ㅇㅈ」，他是把哪個詞縮寫了？","options":["안전（安全）","인정（認同）","일정（日程）","이제（現在）"],"answer":1,"explain_zh":"ㅇㅈ是인정的初聲縮寫——只留每個字開頭的子音ㅇ和ㅈ，意思是「同意！真的！」，邏輯跟台灣網友只打注音的「ㄏㄏ」一樣。順帶一提：안전、일정、이제的初聲其實也都是ㅇㅈ，但聊天室裡ㅇㅈ約定俗成專指인정——初聲縮寫靠的是全民默契，不是每個詞都能縮。"},{"question":"불금的意思是什麼？","options":["禁止用火","狂歡的週五夜","薪水入帳日","失眠的夜晚"],"answer":1,"explain_zh":"불금＝불타는 금요일（燃燒的星期五）整句壓縮而成，指下班下課後可以放心狂歡的週五夜。금요일來自漢字語「金曜日」。"},{"question":"朋友考試考砸了，傳來「멘붕…」，他想表達什麼？","options":["肚子很餓","覺得很好笑","想一個人靜一靜","心態崩了、大受打擊"],"answer":3,"explain_zh":"멘붕＝멘탈（mental）＋붕괴（崩壞）的縮合，就是「心態崩了」。"},{"question":"치맥指的是哪一種國民組合？","options":["起司配麵包","泡菜配白飯","炸雞配啤酒","咖啡配蛋糕"],"answer":2,"explain_zh":"치맥＝치킨（炸雞）＋맥주（啤酒），韓國人看球賽、過불금的經典吃法。"}]}]},{"id":"kr-12","title":"釜山方言入門與各地口音","subtitle":"聽懂釜山腔，追劇、交朋友都多一個世界","minutes":7,"sections":[{"type":"text","body":"為什麼標準語都還沒學完，就要先認識釜山腔？理由很實際：你一定會遇到它。《請回答1997》整部劇從頭到尾滿口釜山腔，《海岸村恰恰恰》裡漁村的爺爺奶奶一開口也是慶尚道方言（사투리），還有一大票綜藝藝人（很多諧星和偶像都是慶尚道出身）平常就這樣講話。慶尚道人口大約占全韓國的【四分之一】，等於你在韓國遇到的每四個人，就可能有一個講話帶這個腔。而且釜山腔有種獨特的魅力：語調起伏大、講話直來直往，聽起來【豪爽又有戲劇感】，韓國人自己也覺得釜山腔「很帥、很有味道」。\n\n它跟標準語（首爾話）差在哪？先抓三個大方向：\n\n1.【語調起伏大】：首爾話相對平，釜山腔像在唱歌，音的高低會區分意思。最有名的例子是「가가 가가?」——同樣四個가，靠語調唸出來就是「那個人是（你說的）那個人嗎？」首爾人自己都學不像。\n\n2.【語尾不一樣】：問句常用 -노／-나 收尾，肯定句愛加 -데이，聽起來特別有勁。\n\n3.【縮約超多】：能省就省、能併就併。標準語的뭐라고 하니，到了釜山直接壓縮成뭐라카노，又短又快。\n\n這一課的目標不是要你「講一口釜山腔」，而是【聽到認得出來、聽得懂】，這樣追劇不用瞪著字幕發呆，遇到釜山朋友也接得上話。"},{"type":"sounds","title":"點擊聽發音：釜山腔核心表現","items":[{"text":"뭐라카노?","sub":"mwo-ra-ka-no?","zh":"你說什麼？（＝標準語뭐라고?）"},{"text":"괘안타","sub":"gwae-an-ta","zh":"沒關係、還行（＝괜찮아）"},{"text":"억수로","sub":"eok-su-ro","zh":"非常、超級（＝정말、너무）"},{"text":"맞나?","sub":"man-na?","zh":"真的嗎？（＝진짜?，釜山人的萬用附和）"},{"text":"뭐 하노?","sub":"mwo ha-no?","zh":"你在幹嘛？（＝뭐 해?）"},{"text":"오이소","sub":"o-i-so","zh":"快進來、歡迎光臨（＝어서 오세요，市場常聽到）"},{"text":"밥 뭇나?","sub":"bap mun-na?","zh":"吃飯了嗎？（＝밥 먹었어?）"},{"text":"알았데이","sub":"a-rat-de-i","zh":"知道了喔～（-데이是釜山招牌語尾）"}]},{"type":"table","title":"標準語 vs 釜山話對照表","headers":["標準語（首爾話）","釜山話","中文意思","小筆記"],"rows":[["뭐라고?","뭐라카노?","你說什麼？","-라고 하-常縮成-라카-，釜山腔招牌"],["괜찮아","괘안타","沒關係","母音縮約＋語尾變硬，聽起來乾脆"],["정말／너무","억수로","非常、超","억수로 맛있다＝超好吃"],["진짜?","맞나?","真的嗎？","附和神句，聊天可以一直맞나?下去"],["뭐 해?","뭐 하노?","你在幹嘛？","有疑問詞（뭐、와、어디）的問句用-노"],["어서 오세요","오이소","歡迎光臨、快進來","札嘎其市場阿姨的招呼聲"],["밥 먹었어?","밥 뭇나?","吃飯了嗎？","是非題型的問句用-나收尾"],["語尾規則","-노／-나／-데이","問句與強調","疑問詞問句→-노；是非問句→-나；肯定強調→-데이"]]},{"type":"tip","body":"使用心法三條：1.【聽懂優先】——方言先求聽得懂，不用急著開口模仿。2.【語調是靈魂】——釜山腔的精髓在高低起伏，光背單字對照表、用首爾話的平板語調唸出來，一秒破功；想學像，去多聽劇裡角色怎麼「唱」。3. 放心用出來——你一個外國人冒出一句「맞나?」或「억수로 맛있어예!」，釜山朋友通常會先愣住然後【笑到不行、瞬間跟你變熟】，這是最划算的社交投資。"},{"type":"text","body":"【文化補充・見識用】這一段純粹帶你開開眼界，【不列入練習、也不會出現在任何題目】，輕鬆看過就好。\n\n韓國的方言地圖不是只有釜山。去旅遊時你可能還會遇到：\n\n・【濟州島（제주 방언）】：差異大到常被說「像另一種語言」，連首爾人都聽不太懂。招牌句是혼저 옵서예（歡迎光臨），在濟州的觀光區到處看得到這句標語；熱門劇《苦盡柑來遇見你》的原文片名폭싹 속았수다也是濟州話，意思是「您真的辛苦了」。\n\n・【全羅道】：語尾愛加個軟軟的 -잉，像그래잉～，聽起來特別親切、有人情味，光州、全州一帶常聽到。\n\n・【忠清道】：出了名的慢悠悠，語尾拖長變 -유，像그래유～，韓國人常拿「忠清道人講話急不得」開玩笑。\n\n記住一件事就好：韓國雖然不大，口音風景卻很豐富。之後聽到「不像課本」的韓語，別懷疑自己白學了——那可能只是換了一個道而已。"},{"type":"quiz","title":"釜山腔小測驗","questions":[{"question":"釜山朋友瞇著眼問你「뭐라카노?」，對應標準語的哪一句？","options":["뭐라고?","어디 가?","밥 먹었어?","잘 자"],"answer":0,"explain_zh":"뭐라카노?＝뭐라고?（你說什麼？）。-라고 하-縮成-라카-，再配上疑問詞問句的-노語尾，是最經典的釜山句。"},{"question":"你不小心撞到釜山朋友，他揮揮手說「괘안타」，意思是？","options":["好痛","沒關係","你完蛋了","我餓了"],"answer":1,"explain_zh":"괘안타＝괜찮아（沒關係）。母音縮約、語尾變乾脆，是釜山腔「話越短越豪爽」的代表。"},{"question":"「이 국밥 억수로 맛있다!」裡的억수로，相當於標準語的？","options":["조금（一點點）","정말／너무（非常）","아마（大概）","나중에（之後）"],"answer":1,"explain_zh":"억수로＝정말、너무（非常、超）。整句是「這碗湯飯超好吃！」，在釜山吃돼지국밥時可以現學現賣。"},{"question":"釜山話裡，帶疑問詞（뭐、와、어디）的問句，語尾最常用哪一個？","options":["-노","-데이","-습니다","-야"],"answer":0,"explain_zh":"疑問詞問句用-노：뭐 하노?（你在幹嘛？）、와 그라노?（你幹嘛這樣？）。是非問句才用-나，肯定強調用-데이。"},{"question":"「밥 뭇나?」對應標準語的哪一句？","options":["밥 먹었어?","뭐 먹을래?","잘 먹었습니다","배불러?"],"answer":0,"explain_zh":"밥 뭇나?＝밥 먹었어?（吃飯了嗎？）。먹었-縮成뭇-，是非問句收-나。跟標準語一樣，這句重點是關心，不是真的在問菜單。"}]}]}]}};

/* engine.js — 語言學習小幫手 學習引擎（純 JS 移植版）
 *
 * 1:1 移植自 study_app.py 的 Progress / WebApp 邏輯：
 *   - SRS：Leitner 5 盒，間隔 0/1/2/4/7 天；記得升盒（最多 5）、不記得回第 1 盒。
 *   - 自適應引擎：lv 0-5 題型階梯、verify 優先、速度分類（預設門檻 / EWMA 相對門檻）、
 *     連續快答跳升、未到期卡答對只重設 due、可疑答對凍結 box/due。
 *   - 日文「含漢字」items 改走假名認讀階梯（JP_KANJI_LADDER，lv1=mc_kana）；
 *     items 有 distractors_zh（≥3）時 session 卡帶出「全部」精準辨析干擾項，
 *     由前端加權抽樣挑選。
 *   - 錯誤導向選項：答錯且帶合法 picked/picked_field 時把所選錯誤選項記入
 *     卡片 wrong_picks（{zh:{選項:次數}, text:{...}}，每 field 上限 8 個 key、
 *     超出淘汰次數最低者）；session 卡帶出 wrong_picks 原物件供前端加權重現。
 *   - 維持複習：已見過、未到期、lv≥3 的卡按比例回鍋（base 15%、下限 2；
 *     到期卡清空時純維持複習上限 10）。
 *   - 教學課程：語言資料頂層 lessons（含 id 的物件才算）；完成課程冪等記錄於
 *     progress 根層 "lessons": {語言: [id, ...]}，只更新 streak/last_study_date、
 *     不動 daily 答題統計（對應 Python touch_study_day）。
 *   - 級別系統（v5）：LEVEL_ORDER 語言（日/韓）依 items 實際出現的 level 算出
 *     可用級別；新卡只出「級別序位 ≤ 目前級別」的 items（無 level 視為最低級），
 *     到期卡與維持卡不受限。目前級別記於 progress 根層 "levels": {語言: 級別}，
 *     缺漏／格式錯誤／不可用值一律容錯回最低可用級別；state 各語言另帶
 *     current_level 與 level_counts（無級別功能為 null）。
 *   - 口語變體：item 有 casual（dict 且 text 非空）時 session 卡原樣帶出。

    function assignFormat(entry, card) {
      var text = entry.text;
      var example = entry.example;
      var clozeOk = (typeof example === "string" && example !== "" &&
                     !!text && example.indexOf(text) !== -1);
      var jpKanji = (entry.lang === "japanese" && jpHasKanji(text) &&
                     !!jpKana(entry.reading));
      var lv = cardLv(card);
      var verify = cardVerify(card);
      var fmt, reason;
      if (verify !== null && ADAPTIVE_FORMATS.indexOf(verify) !== -1) {
        fmt = verify;
        if (fmt === "cloze" && !clozeOk) fmt = "spell";
        reason = (VERIFY_REASONS[fmt] !== undefined) ? VERIFY_REASONS[fmt] : REASON_VERIFY_OTHER;
        entry.verify = fmt;   // 前端據此標示「驗證題」
      } else if (lv >= MAX_LV) {
        var choices = (jpKanji ? ["spell", "listen_mc", "mc_kana"]
                               : ["spell", "listen_mc"])
                        .concat(clozeOk ? ["cloze"] : []);
        fmt = choice(choices);
        reason = REASON_LV5;
      } else {
        var ladder = jpKanji ? JP_KANJI_LADDER : LV_LADDER;
        fmt = (ladder[lv] !== undefined) ? ladder[lv] : "mc_f2z";
        reason = (LADDER_REASONS[fmt] !== undefined) ? LADDER_REASONS[fmt] : LADDER_REASONS.mc_f2z;
        if (fmt === "cloze" && !clozeOk) {
          fmt = "spell";
          reason = REASON_LV4_NO_CLOZE;
        }
      }
      entry.format = fmt;
      entry.lv = lv;
      entry.reason_zh = reason;
      if (fmt === "cloze") {
        // Python str.replace 會取代全部出現位置
        entry.cloze = example.split(text).join(CLOZE_BLANK);
      }
    }

    // ── WebApp._item_entry ──
    function getStr(it, key) {
      return hasOwn(it, key) ? it[key] : "";
    }

    function itemEntry(code, it, card) {
      var entry = {
        lang: code,
        text: getStr(it, "text"),
        reading: getStr(it, "reading"),
        zh: getStr(it, "zh"),
        topic: getStr(it, "topic"),
        example: getStr(it, "example"),
        example_zh: getStr(it, "example_zh"),
        note: getStr(it, "note"),
        box: 1,
      };
      // 口語變體：item 有 casual（dict 且 text 非空）時原樣帶出
      var casual = getOwn(it, "casual");
      if (isPlainObject(casual) && casual.text) {
        entry.casual = casual;
      }
      // 精準辨析干擾項（目前用於日文）：有才帶，前端出題優先採用；
      // 帶出全部（每字 6 個），由前端加權抽樣挑選
      var ds = getOwn(it, "distractors_zh");
      if (Array.isArray(ds) && ds.length >= 3) {
        entry.distractors_zh = ds.map(function (x) { return String(x); });
      }
      // 錯誤導向選項：卡片記過答錯選項就帶出（物件照原樣），前端加權重現
      if (isPlainObject(card)) {
        var wp = getOwn(card, "wrong_picks");
        if (isPlainObject(wp) && Object.keys(wp).length > 0) {
          entry.wrong_picks = wp;
        }
      }
      return entry;
    }

    // ── WebApp._maintenance_entry ──
    function maintenanceEntry(code, it, card) {
      var entry = itemEntry(code, it, card);
      entry.box = cardBox(card);
      assignFormat(entry, card);
      entry.maintenance = true;
      entry.reason_zh = MAINT_REASON_PREFIX + entry.reason_zh;
      return entry;
    }

    // ── WebApp.session_cards ──
    function sessionCards(langKey, limit, mode) {
      var adaptive = (mode === "adaptive");
      var list = (langKey === "all") ? langs : [byKey[langKey]];
      var dueCards = [];
      var newCards = [];
      var maintPool = [];   // [code, item, card]：已見過、未到期、lv≥3
      list.forEach(function (lang) {
        var code = lang.language;
        var cards = progress.cards(code);
        lang.items.forEach(function (it) {
          var key = it.text || "";
          var card = getOwn(cards, key);
          var entry;
          if (!isPlainObject(card)) {
            // 新卡（從未作答）受級別過濾；到期卡與維持卡不受限
            if (!levelOk(code, it)) return;
            entry = itemEntry(code, it);
            if (adaptive) assignFormat(entry, null);
            newCards.push(entry);
          } else if (cardDue(card)) {
            entry = itemEntry(code, it, card);
            entry.box = cardBox(card);
            if (adaptive) assignFormat(entry, card);
            dueCards.push(entry);
          } else if (adaptive && cardLv(card) >= MAINT_MIN_LV) {
            maintPool.push([code, it, card]);
          }
        });
      });
      shuffle(dueCards);
      shuffle(newCards);
      var result = dueCards.concat(newCards);
      if (limit !== null && limit !== undefined) result = result.slice(0, limit);
      if (adaptive) {
        if (result.length) {
          // base 非空：抽 base 15%（至少 2 張）維持卡一起洗牌；
          // 維持卡是 limit 之外的額外加碼。
          var m = Math.min(maintPool.length,
                           Math.max(MAINT_MIN_DRAW,
                                    Math.floor(result.length * MAINT_PCT / 100)));
          if (m > 0) {
            sample(maintPool, m).forEach(function (triple) {
              result.push(maintenanceEntry(triple[0], triple[1], triple[2]));
            });
            shuffle(result);
          }
        } else if (maintPool.length) {
          // 今日到期卡已清空：回傳純維持複習，讓使用者永遠有東西可刷。
          var k = Math.min(limit || MAINT_PURE_MAX, MAINT_PURE_MAX);
          result = sample(maintPool, Math.min(maintPool.length, k)).map(function (triple) {
            return maintenanceEntry(triple[0], triple[1], triple[2]);
          });
        }
      }
      return { cards: result };
    }

    // ── WebApp._classify_speed ──
    function classifySpeed(mode, ms) {
      if (!ms || ms <= 0 || typeof mode !== "string" || !hasOwn(SPEED_DEFAULTS, mode)) {
        return "normal";
      }
      if (ms > ABS_SLOW_MS) return "slow";
      var data = progress.data;
      var modeN = isPlainObject(data.mode_n) ? data.mode_n : {};
      var modeMs = isPlainObject(data.mode_ms) ? data.mode_ms : {};
      var n = toInt(getOwn(modeN, mode) || 0, 0);
      var ewma = getOwn(modeMs, mode);
      if (n >= 3 && typeof ewma === "number" && isFinite(ewma) && ewma > 0) {
        if (ms < 0.7 * ewma) return "fast";
        if (ms > 1.6 * ewma) return "slow";
        return "normal";
      }
      var fastT = SPEED_DEFAULTS[mode][0];
      var slowT = SPEED_DEFAULTS[mode][1];
      if (ms < fastT) return "fast";
      if (ms > slowT) return "slow";
      return "normal";
    }

    // ── WebApp._update_mode_stats ──
    function updateModeStats(mode, ms) {
      if (!ms || ms <= 0 || typeof mode !== "string" || !hasOwn(SPEED_DEFAULTS, mode)) return;
      var pair = progress.modeStats();
      var modeMs = pair[0], modeN = pair[1];
      var old = getOwn(modeMs, mode);
      var n = toInt(getOwn(modeN, mode) || 0, 0);
      if (n > 0 && typeof old === "number" && isFinite(old) && old > 0) {
        modeMs[mode] = pyRound(0.8 * old + 0.2 * ms);
      } else {
        modeMs[mode] = Math.trunc(ms);
      }
      modeN[mode] = n + 1;
    }

    // ── WebApp._record_wrong_pick ──
    // 答錯時記錄實際點選的錯誤選項到 card.wrong_picks。
    // 結構 {"zh": {選項: 次數}, "text": {...}}；次數遞增，每個 field 最多
    // 保留 WRONG_PICKS_MAX 個 key，超出時淘汰次數最低者
    // （平手時同 Python min：取迭代順序中的第一個）。
    // picked 與正解相同或為空白時忽略不記；欄位不合法也忽略。
    function recordWrongPick(langKey, text, card, picked, pickedField) {
      if (WRONG_PICK_FIELDS.indexOf(pickedField) === -1 || typeof picked !== "string") {
        return;
      }
      picked = picked.trim();
      if (!picked) return;
      var byText = getOwn(itemsByText, langKey);
      var it = byText ? getOwn(byText, text) : undefined;
      var answer = String((isPlainObject(it) && hasOwn(it, pickedField)
                           ? it[pickedField] : "") || "");
      if (picked === answer.trim()) return;
      var wp = getOwn(card, "wrong_picks");
      if (!isPlainObject(wp)) {
        wp = card.wrong_picks = {};
      }
      var bucket = getOwn(wp, pickedField);
      if (!isPlainObject(bucket)) {
        bucket = wp[pickedField] = {};
      }
      try {
        bucket[picked] = pyInt(getOwn(bucket, picked) || 0) + 1;
      } catch (e) {
        bucket[picked] = 1;
      }
      function count(k) { return toInt(getOwn(bucket, k) || 0, 0); }
      var keys = Object.keys(bucket);
      while (keys.length > WRONG_PICKS_MAX) {
        var minK = keys[0];
        for (var i = 1; i < keys.length; i++) {
          if (count(keys[i]) < count(minK)) minK = keys[i];
        }
        delete bucket[minK];
        keys = Object.keys(bucket);
      }
    }

    // ── WebApp._answer_item ──
    function answerItem(langKey, text, correct, srs, mode, ms, confidence,
                        picked, pickedField) {
      var card = progress.card(langKey, text);
      if (!correct) {
        recordWrongPick(langKey, text, card, picked, pickedField);
      }
      var wasDue = cardDue(card);
      var lvOld = cardLv(card);
      var fastOld = cardFast(card);
      var verifyBefore = cardVerify(card);
      var speed = classifySpeed(mode, ms);

      var box = null;
      var due = null;
      var lvNew, fastNew, verifyNew, reason;
      if (!correct) {
        lvNew = Math.max(lvOld - 2, 0);
        fastNew = 0;
        verifyNew = null;
        reason = "答錯了，掌握度下降，之後會加強複習這個字。";
      } else {
        updateModeStats(mode, ms);
        var suspicious = (confidence === "guess") || (speed === "slow");
        if (suspicious) {
          lvNew = lvOld;
          fastNew = 0;
          verifyNew = (mode === "spell" || mode === "cloze") ? "listen_mc" : "spell";
          var verifyZh = (verifyNew === "listen_mc") ? "聽力" : "拼寫";
          if (confidence === "guess") {
            reason = "既然是用猜的，掌握度先不變，之後會用" + verifyZh + "再確認一次。";
          } else {
            reason = "答對了，但反應偏慢，先不升級，之後會用" + verifyZh + "確認是真的記得。";
          }
        } else {
          if (confidence === "hesitant") {
            lvNew = lvOld;
            fastNew = 0;
            reason = "答對了，不過有些猶豫，掌握度先維持不變。";
          } else if (speed === "fast" || confidence === "fast") {
            lvNew = Math.min(lvOld + 1, MAX_LV);
            fastNew = fastOld + 1;
            if (fastNew >= 2) {
              lvNew = Math.min(lvNew + 1, MAX_LV);
              reason = "連續快答全對，掌握度跳升！";
            } else {
              reason = "又快又準，掌握度上升！";
            }
          } else {
            lvNew = Math.min(lvOld + 1, MAX_LV);
            fastNew = 0;
            reason = "答對了，掌握度上升。";
          }
          if (lvNew === lvOld && lvOld === MAX_LV && confidence !== "hesitant") {
            reason = "答對了，掌握度已是最高，繼續保持！";
          }
          // verify 清除時機：以 verify 題型答對且速度非 slow 且非 guess
          if (verifyBefore && mode === verifyBefore &&
              speed !== "slow" && confidence !== "guess") {
            verifyNew = null;
            reason = "換題型驗證通過，看來你是真的記得這個字！";
          } else {
            verifyNew = verifyBefore;
          }
        }
      }

      card.lv = lvNew;
      card.fast = fastNew;
      card.verify = verifyNew;

      var pair;
      if (!correct) {
        if (srs) {
          pair = progress.rateFlashcard(langKey, text, false);
          box = pair[0]; due = pair[1];
        } else {
          progress.record(false, langKey, text);
        }
      } else if (srs && !wasDue) {
        // 未到期卡答對（任何速度/信心）：box 不變，due 重設為
        // 今天＋該盒間隔；「不推進排程」規則只適用於到期卡。
        box = cardBox(card);
        due = addDaysStr((BOX_INTERVALS[box] !== undefined) ? BOX_INTERVALS[box] : 0);
        card.due = due;
        progress.record(true, langKey, text);
      } else if (confidence === "guess" || speed === "slow") {
        // 到期卡可疑的對：box 與 due 完全不動，只記統計
        progress.record(true, langKey, text);
        if (srs) {
          box = cardBox(card);
          due = (card.due === undefined) ? null : card.due;
        }
      } else {
        if (srs) {
          pair = progress.rateFlashcard(langKey, text, true);
          box = pair[0]; due = pair[1];
        } else {
          progress.record(true, langKey, text);
        }
      }

      return [box, due, lvNew, lvNew - lvOld, verifyNew, reason];
    }

    // ── WebApp.answer ──
    function answer(langKey, text, correct, srs, mode, ms, confidence,
                    picked, pickedField) {
      var box = null, due = null, lv = null, delta = 0, verifyNext = null, reason = "";
      if (text && itemTexts[langKey] && itemTexts[langKey].has(text)) {
        // 單字卡：走自適應引擎（含 SRS 與統計；答錯且帶合法
        // picked/picked_field 時另記 wrong_picks）
        var r = answerItem(langKey, text, correct, srs, mode, ms, confidence,
                           picked, pickedField);
        box = r[0]; due = r[1]; lv = r[2]; delta = r[3]; verifyNext = r[4]; reason = r[5];
      } else {
        // 字母／文法等非單字內容：維持現狀，只記每日統計
        progress.record(correct);
      }
      return {
        ok: true, box: box, due: due, state: state(),
        lv: lv, delta: delta, verify_next: verifyNext, reason_zh: reason,
      };
    }

    // ── WebApp.complete_lesson ──
    // 標記課程完成（重複標記冪等）；只更新 streak/last_study_date，
    // 不動 daily 答題統計。
    function completeLesson(langKey, lessonId) {
      var done = progress.lessonsDone(langKey);
      if (done.indexOf(lessonId) === -1) done.push(lessonId);
      progress.touchStudyDay();
      progress.save();
      return { ok: true, lessons_done: done.slice() };
    }

    // ── WebApp.insights ──
    function insights() {
      var p = progress.data;
      var rawMs = isPlainObject(p.mode_ms) ? p.mode_ms : {};
      var avgMs = {};
      Object.keys(rawMs).forEach(function (k) {
        var v = rawMs[k];
        if (typeof v === "number" && isFinite(v)) avgMs[k] = pyRound(v);
      });
      var languages = langs.map(function (lang) {
        var code = lang.language;
        var cards = progress.cards(code);
        var lvDist = [0, 0, 0, 0, 0, 0];
        var weak = [];
        lang.items.forEach(function (it) {
          var key = it.text || "";
          var card = getOwn(cards, key);
          if (!isPlainObject(card)) {
            lvDist[0] += 1;   // 未作答過的卡計入 lv0
            return;
          }
          var lv = cardLv(card);
          lvDist[lv] += 1;
          var wrong = toInt(card.wrong || 0, 0);
          var cor = toInt(card.correct || 0, 0);
          if (wrong >= 1) {
            weak.push({
              text: key,
              zh: getStr(it, "zh"),
              lv: lv,
              wrong: wrong,
              correct: cor,
            });
          }
        });
        weak.sort(function (a, b) {
          if (b.wrong !== a.wrong) return b.wrong - a.wrong;
          var ra = a.correct / (a.correct + a.wrong);
          var rb = b.correct / (b.correct + b.wrong);
          return ra - rb;
        });
        return {
          key: code,
          display_name_zh: lang.display_name_zh,
          lv_dist: lvDist,
          weak: weak.slice(0, 8),
          avg_ms: avgMs,
        };
      });
      var daily = isPlainObject(p.daily) ? p.daily : {};
      var daily7 = [];
      for (var i = 6; i >= 0; i--) {
        var d = addDaysStr(-i);
        var day = getOwn(daily, d);
        if (!isPlainObject(day)) day = {};
        daily7.push({
          date: d,
          answered: toInt(day.answered || 0, 0),
          correct: toInt(day.correct || 0, 0),
        });
      }
      return {
        languages: languages,
        daily7: daily7,
        streak: toInt(p.streak || 0, 0),
      };
    }

    // ── 對外 API（皆 async；資料形狀與 study_app.py 各端點一致）──────

    return {
      // GET /api/state
      apiState: async function () {
        return state();
      },

      // GET /api/language/<key>
      apiLanguage: async function (key) {
        var lang = getOwn(byKey, key);
        if (!lang) throw new Error("找不到語言：" + key);
        return lang.raw;
      },

      // GET /api/session?lang=&limit=&mode=
      apiSession: async function (lang, limit, mode) {
        var langKey = (typeof lang === "string" && lang.trim() !== "") ? lang.trim() : "all";
        if (langKey !== "all" && !hasOwn(byKey, langKey)) {
          throw new Error("找不到語言：" + langKey);
        }
        var lim = null;
        if (limit !== null && limit !== undefined && String(limit).trim() !== "") {
          if (typeof limit === "number") {
            if (!Number.isInteger(limit)) throw new Error("limit 必須是整數");
            lim = limit;
          } else {
            try { lim = pyInt(String(limit).trim()); }
            catch (e) { throw new Error("limit 必須是整數"); }
          }
          if (lim < 0) throw new Error("limit 不可為負數");
        }
        var m = (typeof mode === "string" && mode.trim() !== "") ? mode.trim() : "adaptive";
        if (m !== "adaptive" && m !== "classic") {
          throw new Error("mode 必須是 adaptive 或 classic");
        }
        return sessionCards(langKey, lim, m);
      },

      // POST /api/answer
      apiAnswer: async function (body) {
        if (!isPlainObject(body)) throw new Error("JSON 格式錯誤");
        var langKey = body.lang;
        if (typeof langKey !== "string" || !hasOwn(byKey, langKey)) {
          throw new Error("找不到語言：" + langKey);
        }
        var text = body.text;
        if (typeof text !== "string" || text.trim() === "") {
          throw new Error("缺少 text 欄位");
        }
        var correct = body.correct;
        if (typeof correct !== "boolean") {
          throw new Error("correct 必須是布林值");
        }
        var srs = Boolean(body.srs);
        if (srs && !(itemTexts[langKey] && itemTexts[langKey].has(text))) {
          throw new Error("找不到單字：" + text);
        }
        // 可選新欄位（缺漏或格式不符時忽略，確保舊呼叫行為完全不變）
        var mode = body.mode;
        mode = (typeof mode === "string" && mode.trim() !== "") ? mode.trim() : null;
        var ms = toInt(body.ms || 0, 0);
        if (ms < 0) ms = 0;
        var confidence = body.confidence;
        if (CONFIDENCES.indexOf(confidence) === -1) confidence = null;
        // 錯誤導向選項：僅 correct=false 且兩欄位皆合法時才會被記錄
        var picked = body.picked;
        if (typeof picked !== "string" || picked.trim() === "") picked = null;
        var pickedField = body.picked_field;
        if (WRONG_PICK_FIELDS.indexOf(pickedField) === -1) pickedField = null;
        if (picked === null || pickedField === null) {
          picked = null;
          pickedField = null;
        }
        return answer(langKey, text, correct, srs, mode, ms, confidence,
                      picked, pickedField);
      },

      // POST /api/lesson
      apiLesson: async function (lang, id) {
        if (typeof lang !== "string" || !hasOwn(byKey, lang)) {
          throw new Error("找不到語言：" + lang);
        }
        if (typeof id !== "string" ||
            !(lessonIds[lang] && lessonIds[lang].has(id))) {
          throw new Error("找不到課程：" + id);
        }
        return completeLesson(lang, id);
      },

      // POST /api/set_level（錯誤訊息與 Python _handle_set_level 逐字相同）
      apiSetLevel: async function (lang, level) {
        if (typeof lang !== "string" || !hasOwn(byKey, lang)) {
          throw new Error("找不到語言：" + lang);
        }
        var avail = getOwn(levels, lang);
        if (!avail || !avail.length) {
          throw new Error("此語言沒有級別功能");
        }
        if (typeof level !== "string" || avail.indexOf(level) === -1) {
          throw new Error("無效的級別：" + level);
        }
        return setLevel(lang, level);
      },

      // GET /api/insights
      apiInsights: async function () {
        return insights();
      },

      // 匯出進度（JSON 字串，格式與 data/progress.json 完全相同）
      exportProgress: async function () {
        return JSON.stringify(progress.data, null, 2);
      },

      // 匯入進度：驗證結構後整份取代並存檔；非法時 throw 繁中錯誤訊息
      importProgress: async function (str) {
        if (typeof str !== "string" || str.trim() === "") {
          throw new Error("匯入失敗：請提供進度 JSON 字串。");
        }
        var raw;
        try { raw = JSON.parse(str); }
        catch (e) { throw new Error("匯入失敗：不是有效的 JSON 格式。"); }
        if (!isPlainObject(raw)) {
          throw new Error("匯入失敗：進度檔必須是 JSON 物件。");
        }
        if (!isPlainObject(raw.languages)) {
          throw new Error("匯入失敗：缺少 languages 欄位或格式不正確。");
        }
        if (!isPlainObject(raw.daily)) {
          throw new Error("匯入失敗：缺少 daily 欄位或格式不正確。");
        }
        var lk, ck, dk;
        for (lk in raw.languages) {
          if (!hasOwn(raw.languages, lk)) continue;
          var lv = raw.languages[lk];
          if (!isPlainObject(lv)) {
            throw new Error("匯入失敗：languages." + lk + " 格式不正確。");
          }
          if (lv.cards !== undefined && lv.cards !== null && !isPlainObject(lv.cards)) {
            throw new Error("匯入失敗：languages." + lk + ".cards 格式不正確。");
          }
          if (isPlainObject(lv.cards)) {
            for (ck in lv.cards) {
              if (!hasOwn(lv.cards, ck)) continue;
              if (!isPlainObject(lv.cards[ck])) {
                throw new Error("匯入失敗：languages." + lk + ".cards 內的卡片「" + ck + "」格式不正確。");
              }
            }
          }
        }
        for (dk in raw.daily) {
          if (!hasOwn(raw.daily, dk)) continue;
          if (!isPlainObject(raw.daily[dk])) {
            throw new Error("匯入失敗：daily." + dk + " 格式不正確。");
          }
        }
        if (raw.streak !== undefined && raw.streak !== null &&
            typeof raw.streak !== "number" && typeof raw.streak !== "string") {
          throw new Error("匯入失敗：streak 欄位格式不正確。");
        }
        if (raw.last_study_date !== undefined && raw.last_study_date !== null &&
            typeof raw.last_study_date !== "string") {
          throw new Error("匯入失敗：last_study_date 欄位格式不正確。");
        }
        if (raw.mode_ms !== undefined && !isPlainObject(raw.mode_ms)) {
          throw new Error("匯入失敗：mode_ms 欄位格式不正確。");
        }
        if (raw.mode_n !== undefined && !isPlainObject(raw.mode_n)) {
          throw new Error("匯入失敗：mode_n 欄位格式不正確。");
        }
        progress.data = Progress.defaultData();
        progress._merge(raw);
        progress.save();
        return { ok: true, state: state() };
      },

      // 清除全部進度並存檔
      resetProgress: async function () {
        progress.data = Progress.defaultData();
        progress.save();
        return { ok: true, state: state() };
      },
    };
  }

  // ── 匯出（瀏覽器 + Node）──────────────────────────────────────────

  if (typeof module !== "undefined" && module.exports) {
    module.exports = { createEngine: createEngine };
  }
  if (typeof window !== "undefined") {
    window.createEngine = createEngine;
  } else if (typeof globalThis !== "undefined") {
    globalThis.createEngine = createEngine;
  }
})();

/* profiles.js — 使用者設定檔管理（隨身版 v2）
 *
 * 讓同一支手機（或分享出去的同一個檔案）可以多人使用，進度互不干擾：
 *   - localStorage "ll-profiles" = {"list":["名字",...],"current":"名字"}
 *   - 每個設定檔的進度各自存在 "language-learning-progress:<名字>"
 *   - v1 舊 key "language-learning-progress" 有資料時，建立第一個設定檔的
 *     當下靜默搬移進該設定檔（搬移後刪除舊 key），v1 使用者升級不掉進度。
 *
 * 用法：
 *   const profiles = createProfileStore(store);
 *     store = {get(key): string|null, set(key, value), remove(key)}
 *             （localStorage 包裝或記憶體物件皆可）
 *   方法：load / list / current / validateName / create / switchTo /
 *         remove / progressKey。create、switchTo、remove 失敗時 throw
 *         繁中錯誤訊息。
 *
 * 同時支援瀏覽器（window.createProfileStore）與 Node（module.exports）。
 */
(function () {
  "use strict";

  var PROFILES_KEY = "ll-profiles";
  var LEGACY_PROGRESS_KEY = "language-learning-progress"; // v1 單人版舊 key
  var MAX_NAME_LEN = 12;

  function progressKey(name) {
    return LEGACY_PROGRESS_KEY + ":" + name;
  }

  function isPlainObject(v) {
    return typeof v === "object" && v !== null && !Array.isArray(v);
  }

  function createProfileStore(store) {
    if (!store || typeof store.get !== "function" ||
        typeof store.set !== "function" || typeof store.remove !== "function") {
      throw new Error("store 必須提供 get()、set()、remove() 方法");
    }

    // 讀取設定檔清單；不存在或格式壞掉時回 null（視同首次開啟）
    function load() {
      var txt;
      try { txt = store.get(PROFILES_KEY); } catch (e) { return null; }
      if (txt === null || txt === undefined || txt === "") return null;
      var raw;
      try { raw = JSON.parse(txt); } catch (e) { return null; }
      if (!isPlainObject(raw)) return null;
      var list = (Array.isArray(raw.list) ? raw.list : []).filter(function (n) {
        return typeof n === "string" && n.trim() !== "";
      });
      if (!list.length) return null;
      var current = (typeof raw.current === "string" && list.indexOf(raw.current) !== -1)
        ? raw.current
        : list[0];
      return { list: list, current: current };
    }

    function save(p) {
      store.set(PROFILES_KEY, JSON.stringify({ list: p.list, current: p.current }));
    }

    // 暱稱驗證：去頭尾空白後 1-12 字、不可空白、不可與現有設定檔重複
    function validateName(name, list) {
      if (typeof name !== "string") {
        return { ok: false, error: "請輸入暱稱。" };
      }
      var n = name.trim();
      if (!n) return { ok: false, error: "暱稱不可空白。" };
      var len;
      try { len = Array.from(n).length; } catch (e) { len = n.length; }
      if (len > MAX_NAME_LEN) {
        return { ok: false, error: "暱稱最長 " + MAX_NAME_LEN + " 個字。" };
      }
      if (list && list.indexOf(n) !== -1) {
        return { ok: false, error: "已有同名設定檔，請換一個暱稱。" };
      }
      return { ok: true, name: n };
    }

    // v1 舊 key 有資料 → 搬進指定設定檔並刪除舊 key；回傳是否有搬移
    function migrateLegacy(name) {
      var old;
      try { old = store.get(LEGACY_PROGRESS_KEY); } catch (e) { old = null; }
      if (old === null || old === undefined || old === "") return false;
      store.set(progressKey(name), old);
      store.remove(LEGACY_PROGRESS_KEY);
      return true;
    }

    // 建立設定檔並切換為目前使用者；第一個設定檔會承接 v1 舊進度
    function create(name) {
      var p = load();
      var v = validateName(name, p ? p.list : []);
      if (!v.ok) throw new Error(v.error);
      var isFirst = (p === null);
      if (isFirst) p = { list: [], current: "" };
      p.list.push(v.name);
      p.current = v.name;
      save(p);
      if (isFirst) migrateLegacy(v.name);
      return v.name;
    }

    function switchTo(name) {
      var p = load();
      if (!p || p.list.indexOf(name) === -1) {
        throw new Error("找不到設定檔：" + name);
      }
      p.current = name;
      save(p);
      return name;
    }

    // 刪除設定檔（連同其進度 key）；不可刪最後一個。回傳刪除後的目前使用者
    function remove(name) {
      var p = load();
      if (!p || p.list.indexOf(name) === -1) {
        throw new Error("找不到設定檔：" + name);
      }
      if (p.list.length <= 1) {
        throw new Error("至少要保留一個設定檔，無法刪除。");
      }
      p.list = p.list.filter(function (n) { return n !== name; });
      if (p.current === name) p.current = p.list[0];
      save(p);
      store.remove(progressKey(name));
      return p.current;
    }

    return {
      load: load,
      list: function () { var p = load(); return p ? p.list.slice() : []; },
      current: function () { var p = load(); return p ? p.current : null; },
      validateName: function (name) {
        var p = load();
        return validateName(name, p ? p.list : []);
      },
      create: create,
      switchTo: switchTo,
      remove: remove,
      progressKey: progressKey,
    };
  }

  if (typeof module !== "undefined" && module.exports) {
    module.exports = { createProfileStore: createProfileStore };
  }
  if (typeof window !== "undefined") {
    window.createProfileStore = createProfileStore;
  } else if (typeof globalThis !== "undefined") {
    globalThis.createProfileStore = createProfileStore;
  }
})();

/* ============================================================
 * 語言學習小幫手 — 前端 SPA（原生 JS、無框架、無外部資源）
 * hash 路由：#/home、#/lang/<key>、#/flash/<key|all>、#/smart/<key|all>、
 *           #/quiz/<key>、#/spell/<key>、#/alphabet/<key>、#/grammar/<key>、
 *           #/list/<key>、#/stats、#/lessons/<key>、#/lesson/<key>/<id>、#/data
 * ============================================================ */
'use strict';

/* ===================== 常數 ===================== */

const LANG_COLOR = {
  english: 'var(--lang-en)',
  japanese: 'var(--lang-jp)',
  korean: 'var(--lang-kr)'
};
const LANG_SOFT = {
  english: 'var(--lang-en-soft)',
  japanese: 'var(--lang-jp-soft)',
  korean: 'var(--lang-kr-soft)'
};
const PRIMARY = 'var(--primary)';
const VERSION_DATE = '2026-07-29';
const VOICE_LANG = { english: 'en-US', japanese: 'ja-JP', korean: 'ko-KR' };
const GROUP_NAME = { hiragana: '平假名', katakana: '片假名' };
const FLASH_LIMIT = 20;
const FORMAT_ZH = {
  mc_f2z: '選擇題（外語→中文）',
  mc_kana: '選擇題（假名認讀）',
  mc_z2f: '選擇題（中文→外語）',
  spell: '拼寫',
  listen_mc: '聽力選擇',
  cloze: '例句填空',
  flash: '單字卡'
};

function formatName(fmt) { return FORMAT_ZH[fmt] || fmt; }

/* ===================== 全域狀態 ===================== */

const state = {
  app: null,        // GET /api/state 的結果
  langCache: {},    // key -> GET /api/language/<key> 的結果
  timers: [],       // 本頁註冊的 setTimeout id（切頁清除）
  keyHandler: null, // 本頁註冊的 document keydown handler（切頁清除）
  seq: 0,           // 路由序號，避免非同步 render 蓋到新頁
  toastTimer: null
};

const appRoot = document.getElementById('app');

/* ===================== 小工具 ===================== */

/** 建立 DOM 元素；children 一律以 textContent 方式插入，防 XSS */
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style') el.style.cssText = v;
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : String(v));
    }
  }
  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

function shuffle(arr, rand) {
  const rnd = rand || Math.random;
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pct(correct, total) {
  if (!total) return '—';
  return Math.round((correct / total) * 100) + '%';
}

function baseLang(key) {
  if (!key) return null;
  for (const b of ['english', 'japanese', 'korean']) {
    if (key === b || key.indexOf(b) !== -1) return b;
  }
  return null;
}

function langColor(key) {
  return LANG_COLOR[baseLang(key)] || PRIMARY;
}

function langSoft(key) {
  return LANG_SOFT[baseLang(key)] || 'var(--primary-soft)';
}

/** 是否含漢字（日文「假名認讀」分級出題用） */
function hasKanji(s) {
  return /[\u4E00-\u9FFF]/.test(String(s || ''));
}

/** 從 reading（「假名 空格 romaji」格式）取開頭連續非 ASCII 字元段；取不到回空字串 */
function kanaOf(card) {
  const m = /^[^\x00-\x7F]+/.exec(String((card && card.reading) || '').trim());
  return m ? m[0] : '';
}

/** 日文卡且 text 含漢字時回傳假名題面，否則回 null（null＝照常顯示 text）。
 *  langKey 供本身沒有 lang 欄位的項目（經典測驗 items、單字池）指定語言。 */
function jpKana(card, langKey) {
  if (baseLang(langKey || card.lang) !== 'japanese') return null;
  if (!hasKanji(card.text)) return null;
  return kanaOf(card) || null;
}

/* ---- 口語變體與級別（v5）：欄位缺漏（舊後端）時一律回 null，整體優雅隱藏 ---- */

/** item.casual 容錯：dict 且 text 非空才回傳原物件，否則 null */
function casualOf(item) {
  const c = item && item.casual;
  if (!c || typeof c !== 'object' || Array.isArray(c)) return null;
  if (!String(c.text || '').trim()) return null;
  return c;
}

/** 口語版顯示行：「💬 口語版：text（reading）」；無 casual 回 null */
function casualLineText(item) {
  const c = casualOf(item);
  if (!c) return null;
  const reading = String(c.reading || '').trim();
  return '💬 口語版：' + String(c.text).trim() + (reading ? '（' + reading + '）' : '');
}

/** /api/state 語言物件的級別資料：{ current, names, counts }；無級別功能回 null。
 *  names 沿用後端依 LEVEL_ORDER 排序的 level_counts 鍵序。 */
function levelInfoOf(info) {
  if (!info || !info.current_level) return null;
  const lc = info.level_counts;
  if (!lc || typeof lc !== 'object' || Array.isArray(lc)) return null;
  const names = Object.keys(lc);
  if (!names.length) return null;
  return { current: String(info.current_level), names: names, counts: lc };
}

function addTimer(fn, ms) {
  const id = setTimeout(fn, ms);
  state.timers.push(id);
  return id;
}

function todayText() {
  try {
    return new Date().toLocaleDateString('zh-TW', {
      year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
    });
  } catch (e) {
    return new Date().toISOString().slice(0, 10);
  }
}

/** 拼寫比對用正規化：轉小寫、移除所有空白與標點符號 */
function normAns(s) {
  return String(s || '').toLowerCase().replace(/[\s\p{P}\p{S}]/gu, '');
}

/* ===================== Toast ===================== */

function showToast(msg, ok) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('ok', !!ok);
  t.classList.add('show');
  if (state.toastTimer) clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(() => t.classList.remove('show'), 4000);
}

/* ===================== API ===================== */

/* 本地引擎 + 使用者設定檔（v3）：
 * 進度依設定檔分開存 localStorage（"language-learning-progress:<暱稱>"），
 * 設定檔清單存 "ll-profiles"；localStorage 不可用時退回記憶體（僅本次瀏覽有效）。 */
const store = (() => {
  const mem = Object.create(null);
  return {
    get(k) {
      try {
        const v = localStorage.getItem(k);
        if (v !== null) return v;
      } catch (e) { /* localStorage 不可用 */ }
      return (k in mem) ? mem[k] : null;
    },
    set(k, v) {
      try { localStorage.setItem(k, v); } catch (e) { /* 空間不足等，僅記憶體保存 */ }
      mem[k] = v;
    },
    remove(k) {
      try { localStorage.removeItem(k); } catch (e) { /* 忽略 */ }
      delete mem[k];
    }
  };
})();

const profiles = createProfileStore(store);
let engine = null;

/** 以「目前設定檔」的進度 key 重建學習引擎 */
function buildEngine() {
  const key = profiles.progressKey(profiles.current());
  engine = createEngine(DATA, {
    get() { return store.get(key); },
    set(s) { store.set(key, s); }
  });
}

/** 頂欄顯示目前設定檔名（點擊跳資料頁）；尚未建立設定檔時隱藏 */
function updateProfileChip() {
  const btn = document.getElementById('profile-btn');
  if (!btn) return;
  const name = profiles.current();
  btn.textContent = '👤 ' + (name || '');
  btn.style.display = (name && engine) ? '' : 'none'; // 快速登入頁（尚未選人）不顯示
}

/** 切換／建立設定檔後：重建引擎、清空快取（state／語言資料）、導回首頁重新載入 */
function reloadForProfile() {
  buildEngine();
  state.app = null;
  state.langCache = {};
  updateProfileChip();
  go('#/home');
  onRoute();
}

/* api()：以本地引擎取代原本的 fetch 後端，呼叫端的路徑字串完全不變 */
async function api(path, opts) {
  opts = opts || {};
  try {
    let m;
    if (path === '/api/state') return await engine.apiState();
    if ((m = path.match(/^\/api\/language\/([^/?]+)$/))) {
      return await engine.apiLanguage(decodeURIComponent(m[1]));
    }
    if (path === '/api/session' || path.indexOf('/api/session?') === 0) {
      const q = new URLSearchParams(path.split('?')[1] || '');
      return await engine.apiSession(q.get('lang'), q.get('limit'), q.get('mode'));
    }
    if (path === '/api/answer') return await engine.apiAnswer(opts.body || {});
    if (path === '/api/lesson') {
      const b = opts.body || {};
      return await engine.apiLesson(b.lang, b.id);
    }
    if (path === '/api/set_level') {
      const b = opts.body || {};
      return await engine.apiSetLevel(b.lang, b.level);
    }
    if (path === '/api/insights') return await engine.apiInsights();
    if (path === '/api/say') return { ok: true }; // 隨身版：發音只用瀏覽器語音合成
    throw new Error('未知的 API 路徑：' + path);
  } catch (e) {
    showToast(e && e.message ? e.message : '發生錯誤');
    throw e;
  }
}

async function loadState(force) {
  if (!state.app || force) state.app = await api('/api/state');
  return state.app;
}

async function loadLang(key) {
  if (!state.langCache[key]) state.langCache[key] = await api('/api/language/' + encodeURIComponent(key));
  return state.langCache[key];
}

/** 送出作答；成功後同步全域 state。extra 可帶 { mode, ms, confidence, picked, picked_field }（皆可選） */
async function postAnswer(lang, text, correct, srs, extra) {
  const body = { lang: lang, text: text, correct: !!correct, srs: !!srs };
  if (extra) {
    if (extra.mode) body.mode = extra.mode;
    if (typeof extra.ms === 'number') body.ms = Math.round(extra.ms);
    if (extra.confidence) body.confidence = extra.confidence;
    if (extra.picked) body.picked = extra.picked;
    if (extra.picked_field) body.picked_field = extra.picked_field;
  }
  const res = await api('/api/answer', { method: 'POST', body: body });
  if (res && res.state) state.app = res.state;
  return res;
}

/** 非 SRS 作答：背景送出，失敗只顯示 toast、不中斷流程。extra 同 postAnswer（可選） */
function postAnswerQuiet(lang, text, correct, extra) {
  postAnswer(lang, text, correct, false, extra).catch(() => {});
}

/* ===================== 發音 ===================== */

// 預先觸發 voices 載入（部分瀏覽器為非同步），並監聽 voiceschanged 更新快取
let voicesCache = [];
function refreshVoices() {
  try { voicesCache = speechSynthesis.getVoices() || []; } catch (e) { voicesCache = []; }
}
try {
  if (window.speechSynthesis) {
    refreshVoices();
    speechSynthesis.onvoiceschanged = refreshVoices;
  }
} catch (e) { /* 忽略 */ }

function sayFallback(lang, text) {
  /* 隨身版：無後端可代打，發音只靠瀏覽器 speechSynthesis，此處靜默。 */
}

function speak(lang, text) {
  if (!text) return;
  const tag = VOICE_LANG[baseLang(lang)];
  if (!tag) { sayFallback(lang, text); return; }
  try {
    if (window.speechSynthesis && window.SpeechSynthesisUtterance) {
      const prefix = tag.slice(0, 2).toLowerCase();
      const voices = voicesCache.length ? voicesCache : (speechSynthesis.getVoices() || []);
      const voice = voices.find(v => String(v.lang || '').toLowerCase().replace('_', '-').startsWith(prefix));
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      if (voice) u.voice = voice; // 找不到完全對應的語音時交給系統依 lang 挑
      u.lang = tag;
      u.rate = 0.95;
      speechSynthesis.speak(u);
      return;
    }
  } catch (e) { /* 靜默 */ }
  sayFallback(lang, text);
}

function speakBtn(lang, text, extraClass) {
  return h('button', {
    type: 'button',
    class: 'btn btn-ghost speak-btn' + (extraClass ? ' ' + extraClass : ''),
    title: '發音（s）',
    'aria-label': '發音',
    onclick: (e) => { e.stopPropagation(); speak(lang, text); }
  }, '🔊');
}

/* ===================== 路由 ===================== */

function go(hash) { location.hash = hash; }

function cleanup() {
  for (const id of state.timers) clearTimeout(id);
  state.timers = [];
  if (state.keyHandler) {
    document.removeEventListener('keydown', state.keyHandler);
    state.keyHandler = null;
  }
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) { /* 忽略 */ }
}

function setKeyHandler(fn) {
  state.keyHandler = fn;
  document.addEventListener('keydown', fn);
}

function setPage(...nodes) {
  const page = h('div', { class: 'page' }, nodes);
  appRoot.replaceChildren(page);
  window.scrollTo(0, 0);
  return page;
}

function setNavActive(name) {
  document.getElementById('nav-home').classList.toggle('active', name === 'home');
  document.getElementById('nav-stats').classList.toggle('active', name === 'stats');
  document.getElementById('nav-data').classList.toggle('active', name === 'data');
}

function onRoute() {
  cleanup();
  const seq = ++state.seq;
  if (!engine) { renderWelcome(); return; } // 首次開啟：先建立設定檔
  const hash = location.hash || '#/home';
  let m;
  if (hash === '#/home' || hash === '#/' || hash === '#') {
    setNavActive('home'); renderHome(seq);
  } else if (hash === '#/stats') {
    setNavActive('stats'); renderStats(seq);
  } else if (hash === '#/data') {
    setNavActive('data'); renderData(seq);
  } else if ((m = hash.match(/^#\/lang\/([\w-]+)$/))) {
    setNavActive(''); renderLangMenu(seq, m[1]);
  } else if ((m = hash.match(/^#\/lessons\/([\w-]+)$/))) {
    setNavActive(''); renderLessons(seq, m[1]);
  } else if ((m = hash.match(/^#\/lesson\/([\w-]+)\/([\w-]+)$/))) {
    setNavActive(''); renderLesson(seq, m[1], m[2]);
  } else if ((m = hash.match(/^#\/flash\/([\w-]+)$/))) {
    setNavActive(''); renderFlash(seq, m[1]);
  } else if ((m = hash.match(/^#\/smart\/([\w-]+)$/))) {
    setNavActive(''); renderSmart(seq, m[1]);
  } else if ((m = hash.match(/^#\/quiz\/([\w-]+)$/))) {
    setNavActive(''); renderQuiz(seq, m[1]);
  } else if ((m = hash.match(/^#\/spell\/([\w-]+)$/))) {
    setNavActive(''); renderSpell(seq, m[1]);
  } else if ((m = hash.match(/^#\/alphabet\/([\w-]+)$/))) {
    setNavActive(''); renderAlphabet(seq, m[1]);
  } else if ((m = hash.match(/^#\/grammar\/([\w-]+)$/))) {
    setNavActive(''); renderGrammar(seq, m[1]);
  } else if ((m = hash.match(/^#\/list\/([\w-]+)$/))) {
    setNavActive(''); renderList(seq, m[1]);
  } else {
    go('#/home');
  }
}

function stale(seq) { return seq !== state.seq; }

function loadingPage() {
  setPage(h('p', { class: 'loading' }, '載入中…'));
}

function errorPage(backHash) {
  setPage(
    h('div', { class: 'card center-card' },
      h('p', { class: 'big-emoji' }, '😢'),
      h('p', null, '資料載入失敗，請重試一次。'),
      h('button', { type: 'button', class: 'btn btn-primary', onclick: () => go(backHash || '#/home') }, '返回')
    )
  );
}

function backBtn(hash, label) {
  return h('button', {
    type: 'button', class: 'btn btn-ghost back-btn',
    onclick: () => go(hash)
  }, '← ' + (label || '返回首頁'));
}

function findLangInfo(key) {
  if (!state.app || !state.app.languages) return null;
  return state.app.languages.find(l => l.key === key) || null;
}

async function renderLangMenu(seq, key) {
  loadingPage();
  try { await loadState(); } catch (e) { if (!stale(seq)) errorPage('#/home'); return; }
  if (stale(seq)) return;

  function featureCard(emoji, title, desc, hash, badgeText, badgeClass) {

  cards.push(

      '推薦', 'badge-reco'),
    featureCard('🃏', '經典單字卡', '間隔重複記憶（Leitner 盒）', '#/flash/' + key,
      info.due_count > 0 ? '到期 ' + info.due_count : null),
    featureCard('✅', '選擇題測驗', '四選一，測驗單字理解', '#/quiz/' + key),
    featureCard('⌨️', '拼寫練習', '看中文拼出外語', '#/spell/' + key)
  );
  if (info.alphabet_count > 0) {
    cards.push(featureCard('🔤', '字母練習', '字母總表與認讀練習', '#/alphabet/' + key));
  }
  if (info.grammar_count > 0) {
    cards.push(featureCard('📘', '文法測驗', '文法選擇題與詳解', '#/grammar/' + key));
  }
  cards.push(featureCard('📋', '單字總表', '搜尋、瀏覽全部單字', '#/list/' + key));

  // ── 級別系統（B6）：後端有帶 current_level＋level_counts 才顯示，舊後端整體隱藏 ──
  const lvl = levelInfoOf(info);
  let levelBlock = null;
  if (lvl) {
    let switching = false; // 防連點重複 POST
    const chips = lvl.names.map(name => {
      const on = name === lvl.current;
      const chip = h('button', {
        type: 'button',
        class: 'chip chip-level' + (on ? ' on' : ''),

/** 將含【重點】標記的文字轉成節點陣列（純 textContent 切割，不用 innerHTML） */
function markupNodes(body) {
  const s = String(body || '');
  const nodes = [];
  const re = /【([^】]*)】/g;
  let last = 0;
  let m;
  while ((m = re.exec(s)) !== null) {
    if (m.index > last) nodes.push(s.slice(last, m.index));
    if (m[1]) nodes.push(h('strong', { class: 'em-mark' }, m[1]));
    last = m.index + m[0].length;
  }
  if (last < s.length) nodes.push(s.slice(last));
  return nodes;
}

/** 取語言資料中的課程清單（缺漏、非陣列、無 id 一律容錯） */
function lessonsOf(data) {
  if (!data || !Array.isArray(data.lessons)) return [];
  return data.lessons.filter(ls => ls && typeof ls === 'object' && ls.id);
}

/** 已完成課程 id 集合（取自 /api/state，舊後端無此欄位時為空集合） */
function lessonsDoneSet(key) {
  const info = findLangInfo(key);
  return new Set((info && Array.isArray(info.lessons_done)) ? info.lessons_done : []);
}

/* ---- 課程列表 ---- */

async function renderLessons(seq, key) {
  loadingPage();

    await loadState();
    data = await loadLang(key);
  } catch (e) { if (!stale(seq)) errorPage('#/lang/' + key); return; }
  if (stale(seq)) return;
  const info = findLangInfo(key);
  const lessons = lessonsOf(data);

  const color = langColor(key);

  if (lessons.length === 0) {

  const rows = lessons.map((ls, i) => {
    const isDone = done.has(ls.id);
    return h('button', {
      type: 'button',

        ls.subtitle ? h('span', { class: 'lesson-sub muted small' }, ls.subtitle) : null
      ),
      h('span', { class: 'lesson-meta' },
        ls.minutes ? h('span', { class: 'chip chip-static' }, '約 ' + ls.minutes + ' 分鐘') : null,
        isDone ? h('span', { class: 'lesson-check' }, '✓ 已完成') : null
      )
    );
  });

  setPage(
    backBtn('#/lang/' + key, '返回'),
    h('div', { class: 'lang-page-header', style: 'border-color:' + color },
      h('h1', { style: 'color:' + color }, '📖 教學課程'),
      h('p', { class: 'muted' },
