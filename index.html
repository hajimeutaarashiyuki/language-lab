。最有關西味的句型之一，告白或聊喜好都用得上。","distractors_zh":["你喜歡嗎？","我以前喜歡","我沒那麼喜歡","喜歡就拿去","我開玩笑的啦","我最討厭了"]},{"text":"なんぼ","reading":"なんぼ nanbo","zh":"多少錢","topic":"日常閒聊","level":"N5","example":"おっちゃん、これなんぼ？","example_zh":"老闆，這個多少錢？","note":"＝標準語的「いくら」。在大阪的市場、商店街買東西聊天必備；「なんぼでも」＝「要多少有多少」。","distractors_zh":["幾點？","幾個人？","什麼東西？","在哪裡買的？","可以便宜一點嗎？","在幾樓？"]},{"text":"ほな","reading":"ほな hona","zh":"那麼、那就（道別或轉話題）","topic":"日常閒聊","level":"N5","example":"ほな、また明日な！","example_zh":"那就明天見囉！","note":"＝標準語的「それでは／じゃあ」。道別或切換話題時用，「ほな行こか」＝「那我們走吧」；輕快又親切，是關西日常道別的定番。","distractors_zh":["真的嗎？","等等我","好久不見","不要走","我回來了","歡迎光臨"]},{"text":"あほ","reading":"あほ aho","zh":"笨蛋、傻瓜（帶親暱感）","topic":"日常閒聊","level":"N5","example":"なにしてんねん、あほやなあ。","example_zh":"你在幹嘛啦，真是傻瓜耶。","note":"＝標準語的「ばか」。在關西「あほ」是朋友間帶笑意的吐槽，不太傷人；反而說「ばか」關西人會覺得刺耳——和關東正好相反，這個微妙差異務必記住。","distractors_zh":["好棒喔","討厭鬼","膽小鬼","小氣鬼","懶惰蟲","騙子"]},{"text":"ぼちぼち","reading":"ぼちぼち bochibochi","zh":"馬馬虎虎、差不多（該做了）","topic":"日常閒聊","level":"N5","example":"A：最近どう？ B：まあ、ぼちぼちやな。","example_zh":"A：最近怎樣？ B：嗯，馬馬虎虎啦。","note":"＝標準語的「まあまあ／そろそろ」。被問近況時的經典關西回答；「ぼちぼち行こか」＝「差不多該走了吧」，語感悠哉不慌不忙。","distractors_zh":["糟透了","好得不得了","快一點","突然地","到處走走","心跳加速"]},{"text":"おもろい","reading":"おもろい omoroi","zh":"有趣、好笑","topic":"日常閒聊","level":"N5","example":"あの先生の話、めっちゃおもろいで。","example_zh":"那位老師講話超好笑的。","note":"＝標準語的「面白い」。關西人把「有不有趣」看得很重，被說「おもろいなあ」是很高的稱讚；反義吐槽是「おもんない（好無聊）」。","distractors_zh":["好無聊","好重喔","好聰明","好奇怪","很老套","好感人"]},{"text":"かまへん","reading":"かまへん kamahen","zh":"沒關係、不要緊","topic":"日常閒聊","level":"N5","example":"A：ちょっと遅れそう。ごめん！ B：かまへん、かまへん。","example_zh":"A：我可能會遲到一下，抱歉！ B：沒關係、沒關係。","note":"＝標準語的「かまわない／大丈夫」。原諒對方或表示不介意時用，連說兩次更道地；展現關西人爽快大方的氣氛。","distractors_zh":["我很介意喔","幫幫我","別管我","這樣不行","隨你高興","太誇張了吧"]},{"text":"ほんで","reading":"ほんで honde","zh":"然後、所以","topic":"日常閒聊","level":"N5","example":"ほんで、そのあとどうなったん？","example_zh":"然後咧？後來怎麼樣了？","note":"＝標準語的「それで」。聽朋友講八卦時催促下文的必備接續詞，「ほんでほんで？」＝「然後咧然後咧？」，表示聽得很起勁。","distractors_zh":["順帶一提","話說回來","雖然如此","總而言之","首先","就這樣結束了"]},{"text":"どないしたん","reading":"どないしたん donai shitan","zh":"怎麼了？","topic":"日常閒聊","level":"N5","example":"元気ないやん。どないしたん？","example_zh":"你看起來沒精神耶，怎麼了？","note":"＝標準語的「どうしたの」。關心朋友的溫暖問句；「どない？」單用＝「どう？（如何？）」，例如「調子どない？（最近如何？）」。","distractors_zh":["你要怎麼做？","到底在哪裡？","你做了什麼好事？","不要這樣啦","請問你哪位？","好久不見"]},{"text":"まいど","reading":"まいど maido","zh":"歡迎光臨／謝謝惠顧（招呼語）","topic":"日常閒聊","level":"N5","example":"まいど！今日は何にしましょ？","example_zh":"歡迎歡迎！今天要來點什麼？","note":"＝標準語的「毎度ありがとうございます」的簡略說法。大阪商人打招呼、接電話的招牌用語，主要是店家大叔、生意人在用，年輕人日常少講；在商店街聽到就知道人在關西，熟男之間也可當「嗨！」用。","distractors_zh":["每次都遲到","麻煩死了","再見囉","初次見面","買一送一","慢走不送"]},{"text":"なおす","reading":"なおす naosu","zh":"收拾、放回原位（關西用法）","topic":"日常閒聊","level":"N5","example":"この皿、棚になおしといて。","example_zh":"幫我把這個盤子收回櫃子裡。","note":"標準語的「なおす」只有「修理、治好」的意思，但關西弁多了「＝標準語的 片付ける（收拾、歸位）」的用法；在關西朋友家聽到別誤會成「拿去修理」。","distractors_zh":["丟掉","打破","拿出來","洗乾淨","借給別人","賣掉"]},{"text":"うち","reading":"うち uchi","zh":"我（女性自稱）","topic":"日常閒聊","level":"N5","example":"うちも一緒に行きたいわあ。","example_zh":"人家也想一起去啦。","note":"＝標準語的「わたし」。關西女性常用的第一人稱，聽起來親切可愛；注意「うち」在全日本也可指「我家」，要靠上下文分辨。","distractors_zh":["你","他","大家","內心","小孩","那個人"]}],"grammar":[{"question":"わたし＿学生です。","options":["は","が","を","に"],"answer":0,"explain_zh":"「は」是主題助詞，標示句子的主題「我」，整句意思是「我是學生」。「が」用於強調或新資訊的主語，「を」標示動作對象，「に」表示時間或方向，都不適合這裡的自我介紹句。注意「は」當助詞時唸 wa。"},{"question":"毎日りんご＿食べます。","options":["は","が","を","で"],"answer":2,"explain_zh":"「を」標示他動詞的受詞（動作對象），「りんごを食べます」＝吃蘋果。「は」是主題、「が」是主語、「で」表示地點或手段，都不能標示「吃」的對象。"},{"question":"明日、学校＿行きます。","options":["を","に","で","は"],"answer":1,"explain_zh":"移動動詞「行きます」的目的地用「に」（或「へ」）標示，「学校に行きます」＝去學校。「で」表示動作進行的地點（在某處做某事），不用於單純的移動目的地。"},{"question":"図書館＿勉強します。","options":["に","を","で","が"],"answer":2,"explain_zh":"「で」表示動作發生的場所，「図書館で勉強します」＝在圖書館唸書。「に」表示存在或到達的地點（例：図書館にいます），但「唸書」是動作，動作發生地要用「で」。"},{"question":"これは何です＿。","options":["ね","よ","か","わ"],"answer":2,"explain_zh":"「か」放在句尾把直述句變成疑問句，「これは何ですか」＝這是什麼？日文疑問句不一定要問號，加「か」即可。「ね」表示尋求同意，「よ」表示提醒告知，都不是疑問。"},{"question":"＿は私の本です。（東西在自己手上）","options":["これ","それ","あれ","どれ"],"answer":0,"explain_zh":"こ／そ／あ／ど系統：「これ」指離說話者近的東西，東西在自己手上當然用「これ」。「それ」指離聽話者近、「あれ」指離兩人都遠、「どれ」是疑問詞「哪一個」。"},{"question":"「あなたの傘はどれですか。」句中「どれ」的意思是？","options":["這個","那個","哪一個","那裡"],"answer":2,"explain_zh":"「どれ」是「ど」系疑問詞，意思是「（三個以上之中的）哪一個」，整句＝「你的傘是哪一把？」。「這個」是これ、「那個」是それ／あれ、「那裡」是そこ／あそこ。"},{"question":"私は猫＿好きです。","options":["を","が","で","へ"],"answer":1,"explain_zh":"「好き（喜歡）」是な形容詞，喜歡的對象用「が」標示：「猫が好きです」＝我喜歡貓。中文的「喜歡」是動詞所以容易想用「を」，這是台灣學習者最常見的錯誤之一，要特別記住「が好き」。"},{"question":"毎朝コーヒーを飲み＿。（表示每天的習慣）","options":["ます","ました","ません","ましょう"],"answer":0,"explain_zh":"「ます」是動詞的禮貌體現在形，表示現在的習慣或未來的動作，「毎朝飲みます」＝每天早上都喝。「ました」是過去、「ません」是否定、「ましょう」是「一起～吧」的提議，都不符合表達習慣的語意。"},{"question":"昨日、映画を見＿。","options":["ます","ました","ません","ましょう"],"answer":1,"explain_zh":"句首有「昨日（昨天）」，是過去的事，動詞要用過去禮貌形「ました」：「昨日、映画を見ました」＝昨天看了電影。時間詞和動詞時態必須一致。"},{"question":"部屋に猫＿います。","options":["は","が","を","で"],"answer":1,"explain_zh":"存在句「（場所）に（物／人）が います・あります」中，存在的主體用「が」標示：「部屋に猫がいます」＝房間裡有貓。有生命用「います」、無生命用「あります」。"},{"question":"一緒に昼ご飯を食べ＿か。（邀約對方）","options":["ます","ません","ました","ましょう"],"answer":1,"explain_zh":"「〜ませんか」是客氣的邀約句型，字面是否定疑問「不～嗎？」，實際意思是「要不要一起～？」：「一緒に食べませんか」＝要不要一起吃？「ましょうか」也能用於提議，但空格後已有「か」，填「ましょう」會變成商量語氣，邀約別人時最自然的是「ませんか」。"},{"question":"バス＿学校に行きます。","options":["で","に","を","は"],"answer":0,"explain_zh":"「で」除了表示動作地點，也表示手段、工具，「バスで行きます」＝搭公車去。交通工具＋「で」是固定用法；「に」在本句已用於目的地「学校に」。"},{"question":"＿レストランはおいしいですか。（指離聽話者近的那間）","options":["この","その","あの","どの"],"answer":1,"explain_zh":"「その＋名詞」指離聽話者近（或剛才話題中提到）的事物，所以是「その レストラン」＝你那邊／你說的那間餐廳。「この」離說話者近、「あの」離兩人都遠、「どの」是「哪一間」。注意這組必須接名詞，不能單獨使用。"},{"question":"私は日本人＿ありません。","options":["では","には","とは","へは"],"answer":0,"explain_zh":"「です」的禮貌否定形是「ではありません」：「日本人ではありません」＝我不是日本人。口語常說「じゃありません」或「じゃないです」。其他選項無法構成「です」的否定形。"}],"lessons":[{"id":"jp-01","title":"日文文字系統","subtitle":"三種文字一次看懂，還有你的漢字優勢","minutes":5,"sections":[{"type":"text","body":"歡迎來到日文的世界！先別急著背五十音，我們先搞清楚一件事：日文的一句話裡，其實同時混用了【三種文字】。看看這句：「私はアニメが好きです」（我喜歡動畫）——「私」「好」是漢字，「は」「が」「です」是平假名，「アニメ」是片假名。三種文字不是互相取代，而是像一個團隊各司其職。"},{"type":"table","title":"三種文字的分工","headers":["文字","長相","負責的工作","例子"],"rows":[["平假名","圓圓軟軟","文法骨架：助詞、語尾變化、日本原有的字","は、です、ありがとう"],["片假名","方方直直","外來語、外國人名地名、強調","アニメ、ラーメン、カラオケ"],["漢字","你早就認識","表達主要意思：名詞、動詞的核心","私、台湾、勉強"]]},{"type":"text","body":"身為台灣人，你已經「免費」認識兩千多個漢字——日本學生要學到高中才學完的東西，你入學第一天就會了。看日文文章常常能猜出五六成意思，這是超大的優勢。但小心！【有些漢字在日文裡的意思跟中文完全不一樣】，直接用中文腦去讀會鬧笑話。下面這幾個是最經典的陷阱。"},{"type":"sounds","title":"點擊聽發音：台灣人最容易誤會的漢字","items":[{"text":"勉強","sub":"べんきょう benkyou","zh":"唸書、學習（不是「勉強接受」的勉強！）"},{"text":"手紙","sub":"てがみ tegami","zh":"信（不是衛生紙！）"},{"text":"大丈夫","sub":"だいじょうぶ daijoubu","zh":"沒問題、不要緊（不是男子漢！）"},{"text":"娘","sub":"むすめ musume","zh":"女兒（不是媽媽！）"},{"text":"新聞","sub":"しんぶん shinbun","zh":"報紙（不是電視新聞！）"}]},{"type":"tip","body":"看到漢字先開心，再查一下發音和意思。把日文漢字當成「長得像的遠房親戚」，不要當成同一個人——長相熟悉，脾氣可能完全不同。"},{"type":"quiz","title":"小試身手","questions":[{"question":"日文句子裡負責「助詞、語尾變化」等文法工作的文字是？","options":["平假名","片假名","漢字","羅馬字"],"answer":0,"explain_zh":"平假名是日文的文法骨架，像「は」「です」這些助詞和句尾都是平假名。片假名管外來語，漢字管主要意思。"},{"question":"「アニメ」「ラーメン」這種線條方方直直的文字是？","options":["漢字","平假名","片假名","注音符號"],"answer":2,"explain_zh":"片假名的筆畫方正直硬，專門用來寫外來語和外國名字。平假名則是圓圓軟軟的。"},{"question":"日文的「勉強」是什麼意思？","options":["勉強、將就","唸書、學習","強迫別人","加油打氣"],"answer":1,"explain_zh":"「勉強（べんきょう）」在日文是「唸書、學習」。「日本語を勉強しています」＝我正在學日文，完全沒有中文「將就」的意思。"},{"question":"日本朋友說要寄「手紙」給你，他要寄的是？","options":["衛生紙","紙鈔","信","名片"],"answer":2,"explain_zh":"「手紙（てがみ）」是信。這是最經典的中日漢字陷阱之一，在日本跟人要「手紙」對方會拿信紙給你，不是衛生紙。"}]}]},{"id":"jp-02","title":"五十音的結構","subtitle":"行與段的地圖：背的是規律，不是 46 個隨機符號","minutes":5,"sections":[{"type":"text","body":"五十音聽起來很嚇人：「天啊，要背 46 個符號！」其實完全不是這樣。五十音是一張【超有規律的地圖】：橫向叫【行】，每一行共用同一個子音（か行全部 k 開頭）；縱向叫【段】，每一段共用同一個母音（あ段全部以 a 結尾）。先看地圖，再認字，事半功倍。"},{"type":"table","title":"平假名五十音地圖","headers":["行＼段","a","i","u","e","o"],"rows":[["あ行（母音）","あ","い","う","え","お"],["か行（k）","か","き","く","け","こ"],["さ行（s）","さ","し","す","せ","そ"],["た行（t）","た","ち","つ","て","と"],["な行（n）","な","に","ぬ","ね","の"],["は行（h）","は","ひ","ふ","へ","ほ"],["ま行（m）","ま","み","む","め","も"],["や行（y）","や","―","ゆ","―","よ"],["ら行（r）","ら","り","る","れ","ろ"],["わ行（w）","わ","―","―","―","を"],["撥音（鼻音）","ん","―","―","―","―"]]},{"type":"text","body":"所以你真正要背的是：【5 個母音＋每行一個子音】。子音 k 配上母音 a、i、u、e、o，就自動生出かきくけこ；換成 s 就是さしすせそ。少數幾個字（し、ち、つ、ふ）發音有點特別，之後遇到再圈起來就好。順帶一提，表格裡 a、i、u、e、o 這種【用英文字母標注日文發音】的寫法叫「羅馬拼音」，本課程採用全世界最通行的 Hepburn（黑本式）拼音，之後每個單字都會附上。這張地圖以後查字典、打字、學動詞變化全都用得到，是整個日文的骨架。"},{"type":"sounds","title":"點擊聽發音：一切的基礎——五個母音","items":[{"text":"あ","sub":"a（嘴巴自然張開，像注音的「ㄚ」）","zh":""},{"text":"い","sub":"i（嘴角往兩邊，像「一」）","zh":""},{"text":"う","sub":"u（嘴唇放鬆，不用嘟太圓）","zh":""},{"text":"え","sub":"e（像注音的「ㄝ」）","zh":""},{"text":"お","sub":"o（像注音的「ㄛ」）","zh":""}]},{"type":"tip","body":"背五十音永遠【一行一行背】：かきくけこ、さしすせそ……像唱歌一樣有節奏。不要跳著背，「行與段」的位置感之後學文法還會一直用到。"},{"type":"quiz","title":"小試身手","questions":[{"question":"「か行」的五個假名（かきくけこ）共用什麼？","options":["同一個母音","同一個子音 k","同樣的筆畫數","同樣的聲調"],"answer":1,"explain_zh":"「行」是子音家族：か行全部以子音 k 開頭，再分別配上母音 a、i、u、e、o。母音相同的家族叫「段」。"},{"question":"「あ段」是所有母音為 a 的假名，下面哪一個屬於あ段？","options":["か","き","く","け"],"answer":0,"explain_zh":"か＝ka，母音是 a，所以屬於あ段。き（ki）在い段、く（ku）在う段、け（ke）在え段。"},{"question":"背五十音時，真正的核心是？","options":["46 個毫無關聯的符號","5 個母音＋每行的子音規律","全部漢字的讀音","英文字母對照表"],"answer":1,"explain_zh":"五十音是「子音 × 母音」的組合地圖。抓住 5 個母音和每行的子音，46 個假名就是規律的排列，不是隨機符號。"},{"question":"子音 s 遇到母音 a，會組成哪個假名？","options":["さ","し","す","せ"],"answer":0,"explain_zh":"s＋a＝sa＝さ。し是 shi（い段）、す是 su（う段）、せ是 se（え段）。"}]}]},{"id":"jp-03","title":"あ〜な行：前 25 個假名","subtitle":"用形狀聯想記字，一次拿下半張地圖","minutes":8,"sections":[{"type":"text","body":"今天正式開始認字！我們一口氣拿下前五行：あ、か、さ、た、な，共 25 個假名——超過一半了。記形狀最好的方法是【聯想】：平假名多半是從漢字草書簡化來的，用「它長得像什麼」來記，比死背快十倍。下面的小抄挑幾個最好記的給你。"},{"type":"table","title":"形狀聯想小抄","headers":["假名","羅馬拼音","聯想"],"rows":[["あ","a","從漢字「安」變來，仔細看中間藏著一個「女」"],["い","i","從「以」變來，就是「以」的左半邊兩筆"],["う","u","從「宇」變來，像「宇」的上面兩筆"],["か","ka","從「加」變來，右上那一點是「加」的口"],["き","ki","像一把鑰匙（key），發音剛好也是 ki"],["さ","sa","長得像き少一橫，唸 sa"],["し","shi","一根釣魚線垂下來，甩竿「咻」（shi）"],["つ","tsu","像一道小海浪，浪打過來「tsu〜」"],["な","na","從「奈」變來，左上還留著「奈」的影子"]]},{"type":"sounds","title":"點擊聽發音：あ行・か行","items":[{"text":"あ","sub":"a","zh":""},{"text":"い","sub":"i","zh":""},{"text":"う","sub":"u","zh":""},{"text":"え","sub":"e","zh":""},{"text":"お","sub":"o","zh":""},{"text":"か","sub":"ka","zh":""},{"text":"き","sub":"ki","zh":""},{"text":"く","sub":"ku","zh":""},{"text":"け","sub":"ke","zh":""},{"text":"こ","sub":"ko","zh":""}]},{"type":"sounds","title":"點擊聽發音：さ行・た行（注意三個例外！）","items":[{"text":"さ","sub":"sa","zh":""},{"text":"し","sub":"shi（例外！不是 si）","zh":""},{"text":"す","sub":"su","zh":""},{"text":"せ","sub":"se","zh":""},{"text":"そ","sub":"so","zh":""},{"text":"た","sub":"ta","zh":""},{"text":"ち","sub":"chi（例外！不是 ti）","zh":""},{"text":"つ","sub":"tsu（例外！不是 tu）","zh":""},{"text":"て","sub":"te","zh":""},{"text":"と","sub":"to","zh":""}]},{"type":"tip","body":"た行有兩個叛徒：ち唸 chi、つ唸 tsu，不是 ti、tu；加上さ行的し（shi），這三個是五十音最重要的例外，現在就把它們圈起來。"},{"type":"sounds","title":"點擊聽發音：な行＋你已經看得懂的單字","items":[{"text":"な","sub":"na","zh":""},{"text":"に","sub":"ni","zh":""},{"text":"ぬ","sub":"nu","zh":""},{"text":"ね","sub":"ne","zh":""},{"text":"の","sub":"no","zh":""},{"text":"あした","sub":"a-shi-ta ashita","zh":"明天"},{"text":"きのう","sub":"ki-no-u kinou","zh":"昨天"},{"text":"ねこ","sub":"ne-ko neko","zh":"貓"},{"text":"いち","sub":"i-chi ichi","zh":"一"},{"text":"に","sub":"ni","zh":"二"},{"text":"さん","sub":"sa-n san","zh":"三"}]},{"type":"quiz","title":"小試身手","questions":[{"question":"「し」的羅馬拼音是？","options":["si","shi","chi","tsu"],"answer":1,"explain_zh":"し是さ行的例外，唸 shi 不是 si。chi 是ち、tsu 是つ，這三個例外要一起記。"},{"question":"下面哪個假名唸「tsu」？","options":["ち","つ","て","と"],"answer":1,"explain_zh":"つ唸 tsu（像小海浪）。ち唸 chi、て唸 te、と唸 to。"},{"question":"「あした（明天）」的第二個假名「し」屬於哪一行？","options":["あ行","さ行","た行","な行"],"answer":1,"explain_zh":"し是さ行的い段（sa shi su se so 的第二個）。雖然發音是 shi，家族仍然是 s 家的。"},{"question":"「く」的發音是？","options":["ku","ke","ko","ka"],"answer":0,"explain_zh":"く在か行的う段，k＋u＝ku。け是 ke、こ是 ko、か是 ka。"}]}]},{"id":"jp-04","title":"は〜ん：五十音完賽","subtitle":"剩下 21 個一次收完，含「は唸 wa」的例外預告","minutes":8,"sections":[{"type":"text","body":"今天把剩下的假名一次收完：は、ま、や、ら、わ行，加上特立獨行的「ん」——收完這 21 個，46 個基本假名就全部到手了！這幾行大致都很乖，只有幾個特別的地方，我會沿路提醒你。"},{"type":"sounds","title":"點擊聽發音：は行・ま行","items":[{"text":"は","sub":"ha","zh":""},{"text":"ひ","sub":"hi","zh":""},{"text":"ふ","sub":"fu（介於 hu 和 fu 之間，輕輕吹氣）","zh":""},{"text":"へ","sub":"he","zh":""},{"text":"ほ","sub":"ho","zh":""},{"text":"ま","sub":"ma","zh":""},{"text":"み","sub":"mi","zh":""},{"text":"む","sub":"mu","zh":""},{"text":"め","sub":"me","zh":""},{"text":"も","sub":"mo","zh":""}]},{"type":"text","body":"先埋個伏筆：【は當助詞的時候唸 wa，不唸 ha】。你一定聽過「こんにちは」（konnichiwa）——句尾那個字其實就是は！因為它原本是助詞，所以保留了 wa 的唸法。第 9 課講助詞時會完整解釋，現在先記口訣：句子中間或句尾孤零零的は，十之八九唸 wa。"},{"type":"sounds","title":"點擊聽發音：や行・ら行・わ行・ん","items":[{"text":"や","sub":"ya","zh":""},{"text":"ゆ","sub":"yu","zh":""},{"text":"よ","sub":"yo","zh":""},{"text":"ら","sub":"ra（舌尖輕彈上顎）","zh":""},{"text":"り","sub":"ri","zh":""},{"text":"る","sub":"ru","zh":""},{"text":"れ","sub":"re","zh":""},{"text":"ろ","sub":"ro","zh":""},{"text":"わ","sub":"wa","zh":""},{"text":"を","sub":"o（只當助詞使用）","zh":""},{"text":"ん","sub":"n（唯一沒有母音的假名）","zh":""}]},{"type":"sounds","title":"點擊聽發音：馬上就能唸的單字","items":[{"text":"わたし","sub":"wa-ta-shi watashi","zh":"我"},{"text":"ひま","sub":"hi-ma hima","zh":"有空、閒"},{"text":"ほんとう","sub":"ho-n-to-u hontou","zh":"真的"},{"text":"またあした","sub":"ma-ta-a-shi-ta mata ashita","zh":"明天見"}]},{"type":"tip","body":"ら行不是英文的 R 也不是 L：舌尖在上顎輕輕彈一下就好，聽起來介於「ㄌ」和「ㄖ」之間。唸得不夠標準沒關係，日本人一定聽得懂。"},{"type":"quiz","title":"小試身手","questions":[{"question":"「こんにちは」句尾的「は」唸什麼？","options":["ha","wa","ba","pa"],"answer":1,"explain_zh":"這個は原本是助詞，所以唸 wa——整句是 konnichiwa。は當助詞時一律唸 wa，第 9 課會再詳細說明。"},{"question":"唯一一個不含母音的假名是？","options":["ん","を","わ","む"],"answer":0,"explain_zh":"ん只有鼻音 n，沒有母音，也不能當一個字的開頭。を唸 o、わ唸 wa、む唸 mu，都含母音。"},{"question":"「を」平常什麼時候會用到？","options":["當名詞的開頭","只當助詞使用","表示疑問","外來語專用"],"answer":1,"explain_zh":"現代日文的を只有一個工作：當助詞標示動作對象（第 9 課登場），發音同お（o）。一般單字裡不會出現。"},{"question":"「ふ」的發音比較接近？","options":["用力咬唇的英文 F","輕輕吹氣的 fu","捲舌的 hu","台語的「褲」"],"answer":1,"explain_zh":"ふ介於 hu 和 fu 之間：嘴唇不咬、不太圓，像吹蠟燭前輕輕吐氣。Hepburn 拼音寫作 fu。"},{"question":"「ほんとう（真的）」裡的「ん」，羅馬拼音寫成？","options":["m","n","ng","不用寫"],"answer":1,"explain_zh":"ん的 Hepburn 拼音是 n：ho-n-to-u → hontou。它自己占一拍，唸的時候不要吞掉。"}]}]},{"id":"jp-05","title":"濁音與半濁音","subtitle":"兩個小記號，舊假名變新聲音","minutes":6,"sections":[{"type":"text","body":"好消息：接下來不用再背新形狀了！日文用兩個小記號讓舊假名變出新聲音：【濁點「゛」（右上角兩點）】和【半濁點「゜」（右上角小圈圈）】。加上濁點，聲音會「變濁」——原本清脆的 k、s、t、h，變成聲帶震動的 g、z、d、b。你可以把手放在喉嚨上感覺：唸 ka 喉嚨不震，唸 ga 會震。"},{"type":"table","title":"點點圈圈變音表","headers":["原本","加記號之後","變化規律"],"rows":[["か行（k）","が行（g）","か ka → が ga、こ ko → ご go"],["さ行（s）","ざ行（z）","さ sa → ざ za，但し shi → じ ji"],["た行（t）","だ行（d）","た ta → だ da，但ち → ぢ ji、つ → づ zu"],["は行（h）＋゛","ば行（b）","は ha → ば ba、ほ ho → ぼ bo"],["は行（h）＋゜","ぱ行（p）","は ha → ぱ pa、ひ hi → ぴ pi"]]},{"type":"sounds","title":"點擊聽發音：清濁比一比","items":[{"text":"か","sub":"ka（清）","zh":""},{"text":"が","sub":"ga（濁：か＋゛）","zh":""},{"text":"た","sub":"ta（清）","zh":""},{"text":"だ","sub":"da（濁：た＋゛）","zh":""},{"text":"は","sub":"ha（清）","zh":""},{"text":"ば","sub":"ba（濁：は＋゛）","zh":""},{"text":"ぱ","sub":"pa（半濁：は＋゜）","zh":""}]},{"type":"sounds","title":"點擊聽發音：用得到的單字","items":[{"text":"てがみ","sub":"te-ga-mi tegami","zh":"信（第 1 課的陷阱漢字「手紙」！）"},{"text":"ともだち","sub":"to-mo-da-chi tomodachi","zh":"朋友"},{"text":"げんき","sub":"ge-n-ki genki","zh":"有精神、健康"},{"text":"だいがくせい","sub":"da-i-ga-ku-se-i daigakusei","zh":"大學生"},{"text":"かんぱい","sub":"ka-n-pa-i kanpai","zh":"乾杯"}]},{"type":"tip","body":"小圈圈「゜」是は行的專利，只有ぱぴぷぺぽ這五個。另外じ（し＋゛）和ぢ（ち＋゛）發音相同，現代日文幾乎都用じ；ず和づ也一樣，都唸 zu。"},{"type":"quiz","title":"小試身手","questions":[{"question":"「か」加上濁點「゛」之後唸什麼？","options":["ga","ka","pa","ba"],"answer":0,"explain_zh":"か行加濁點變が行：k 變成 g，所以か ka → が ga。ba 是は＋゛、pa 是は＋゜。"},{"question":"小圈圈「゜」（半濁點）只能加在哪一行？","options":["か行","さ行","た行","は行"],"answer":3,"explain_zh":"半濁點是は行專用：はひふへほ → ぱぴぷぺぽ（pa pi pu pe po）。其他行都不能加圈圈。"},{"question":"「かんぱい（乾杯）」的「ぱ」是怎麼來的？","options":["は加濁點゛","は加半濁點゜","ば加濁點゛","一個全新的假名"],"answer":1,"explain_zh":"ぱ＝は＋小圈圈゜，唸 pa。加兩點゛的話是ば（ba），完全不同的音，喝酒前看清楚。"},{"question":"「じ」和「ぢ」的發音關係是？","options":["完全不同","發音相同，都唸 ji","只有聲調不同","ぢ不發音"],"answer":1,"explain_zh":"じ和ぢ在現代日文發音相同（ji），一般單字幾乎都寫じ。ず和づ也同理，都唸 zu。"}]}]},{"id":"jp-06","title":"拗音、促音、長音","subtitle":"きょ、っ、おう——長度和停頓會改變意思","minutes":7,"sections":[{"type":"text","body":"今天學三個讓發音「變形」的規則：拗音（合體音）、促音（停頓音）、長音（拉長音）。規則本身不難，但它們決定了日文的節奏，而且【長度不同，意思就完全不同】——這是台灣學習者最容易忽略、也最容易鬧笑話的地方。"},{"type":"text","body":"【拗音】＝ い段假名＋縮小的ゃ、ゅ、ょ，兩個字【合唸成一拍】。き＋小さいょ＝きょ（kyo），一口氣滑出來，不是 ki-yo 兩拍。你早就聽過拗音了：東京（とうきょう）、旅行（りょこう）、勉強（べんきょう）裡全都有。判斷訣竅：ゃゅょ寫得比較小就是拗音，正常大小的や、ゆ、よ就是獨立一拍。"},{"type":"sounds","title":"點擊聽發音：拗音練習","items":[{"text":"きょ","sub":"kyo（き＋小ょ，一拍）","zh":""},{"text":"しゃ","sub":"sha（し＋小ゃ）","zh":""},{"text":"じゅ","sub":"ju（じ＋小ゅ）","zh":""},{"text":"りょ","sub":"ryo（り＋小ょ）","zh":""},{"text":"きょう","sub":"kyou","zh":"今天"},{"text":"りょこう","sub":"ryokou","zh":"旅行"},{"text":"べんきょう","sub":"benkyou","zh":"唸書、學習"}]},{"type":"text","body":"【促音】＝ 縮小的っ。它本身不出聲，而是【停頓一拍】，像音樂的休止符：喉嚨憋住，再爆出下一個音。ちょっと（chotto，等一下）中間就要憋一下再說 to。你出門時說的いってきます（我出門了）也有促音。羅馬拼音的寫法是把下一個子音重複寫：chotto、ittekimasu。【長音】則相反＝把母音拉長一拍，例如お段後面加う：ありがとう的とう就是長音；え段後面加い通常也是長音，像第 5 課的だいがくせい，せい要拉長唸。"},{"type":"sounds","title":"點擊聽發音：長度決定意思！","items":[{"text":"おばさん","sub":"obasan（4 拍）","zh":"阿姨"},{"text":"おばあさん","sub":"obaasan（5 拍，多一拍長音）","zh":"奶奶、老太太"},{"text":"おじさん","sub":"ojisan","zh":"叔叔"},{"text":"おじいさん","sub":"ojiisan","zh":"爺爺、老先生"},{"text":"ちょっと","sub":"chotto（っ＝停一拍）","zh":"等一下、有一點"},{"text":"いってきます","sub":"ittekimasu","zh":"我出門了"}]},{"type":"tip","body":"日文的節奏單位是「拍」：拗音きょ算一拍、促音っ算一拍（無聲）、長音多一拍。心裡打拍子唸：おばさん 4 拍、おばあさん 5 拍——把阿姨叫成奶奶，友誼可能就沒了。"},{"type":"quiz","title":"小試身手","questions":[{"question":"「きょ」的正確唸法是？","options":["ki-yo，兩拍","kyo，一拍","ko，一拍","kya，一拍"],"answer":1,"explain_zh":"小的ょ表示拗音：き和ょ合體成 kyo，一口氣一拍唸完。如果寫成正常大小的きよ才是 ki-yo 兩拍。"},{"question":"促音「っ」要怎麼發音？","options":["唸 tsu","停頓一拍，不出聲","把前面的母音拉長","小聲唸一次"],"answer":1,"explain_zh":"小っ不發音，作用是停頓一拍：喉嚨憋住再爆出下一個音，像ちょっと的 cho（憋）to。正常大小的つ才唸 tsu。"},{"question":"「おばあさん」的意思是？","options":["阿姨","奶奶、老太太","姊姊","媽媽"],"answer":1,"explain_zh":"おばあさん（obaasan，5 拍）是奶奶；少一拍的おばさん（obasan，4 拍）才是阿姨。長音差一拍，輩分差一輩。"},{"question":"「ちょっと」總共有幾拍？","options":["2 拍","3 拍","4 拍","5 拍"],"answer":1,"explain_zh":"ちょ（拗音一拍）＋っ（促音一拍）＋と（一拍）＝3 拍。唸的時候：cho—（停）—to。"}]}]},{"id":"jp-07","title":"片假名與外來語","subtitle":"同樣的發音、不同的形狀，動漫迷的必修課","minutes":6,"sections":[{"type":"text","body":"好消息：片假名【不用學新發音】！它和平假名一一對應、同音不同形——就像英文的大寫和小寫。ア＝あ、カ＝か、ン＝ん。片假名負責外來語、外國人名地名和強調，對愛看動漫、愛喝手搖飲的你來說超實用：アニメ、ラーメン、タピオカ全是片假名。"},{"type":"table","title":"平假名 vs 片假名對照（節選）","headers":["平假名","片假名","羅馬拼音"],"rows":[["あ","ア","a"],["い","イ","i"],["う","ウ","u"],["か","カ","ka"],["さ","サ","sa"],["し","シ","shi"],["つ","ツ","tsu"],["そ","ソ","so"],["ら","ラ","ra"],["ん","ン","n"]]},{"type":"text","body":"片假名的長音不用う，直接畫一條線【ー】：ラーメン的ー就是把 ra 拉長一拍。另外有兩對雙胞胎要小心：【シ（shi）vs ツ（tsu）】和【ン（n）vs ソ（so）】。分辨口訣：シ和ン的小點偏【橫躺】、最後一筆由下往上挑；ツ和ソ的小點偏【站立】、最後一筆由上往下撇。"},{"type":"sounds","title":"點擊聽發音：你早就會的外來語","items":[{"text":"アニメ","sub":"a-ni-me anime","zh":"動畫"},{"text":"カラオケ","sub":"ka-ra-o-ke karaoke","zh":"卡拉OK"},{"text":"ラーメン","sub":"raamen（ー＝長音）","zh":"拉麵"},{"text":"ゲーム","sub":"geemu","zh":"電玩遊戲"},{"text":"ドラマ","sub":"do-ra-ma dorama","zh":"連續劇、日劇"},{"text":"スタンプ","sub":"su-ta-n-pu sutanpu","zh":"貼圖"},{"text":"タピオカミルクティー","sub":"tapioka mirukutii","zh":"珍珠奶茶"}]},{"type":"tip","body":"外來語多半來自英文，但發音已經「日文化」：要用日文的拍子唸才道地。ゲーム是 ge-e-mu 三拍，不是英文的 game——用英文發音日本人反而聽不懂。"},{"type":"quiz","title":"小試身手","questions":[{"question":"片假名和平假名的關係是？","options":["發音相同、形狀不同","發音不同、形狀相同","完全無關的兩套系統","片假名是漢字的簡體"],"answer":0,"explain_zh":"兩套假名一一對應、發音完全相同，只是字形不同、分工不同：平假名管文法，片假名管外來語。"},{"question":"片假名的長音記號是？","options":["う","゛","ー","っ"],"answer":2,"explain_zh":"片假名長音直接畫一條線ー，像ラーメン、ゲーム。う是平假名的長音寫法，゛是濁點，っ是促音。"},{"question":"「ラーメン」的意思是？","options":["咖哩","拉麵","壽司","烏龍麵"],"answer":1,"explain_zh":"ラーメン＝拉麵（ra-a-me-n，4 拍）。這個詞本來就是從中文「拉麵」傳過去的，繞了一圈又回來了。"},{"question":"「シ、ツ、ソ、ン」這四個雙胞胎裡，唸「tsu」的是哪一個？","options":["シ","ツ","ソ","ン"],"answer":1,"explain_zh":"ツ的兩個小點站立、最後一筆由上往下撇。シ是 shi（點橫躺、往上挑）、ソ是 so、ン是 n，這四個是片假名最有名的雙胞胎。"}]}]},{"id":"jp-08","title":"基本句型：です／ます","subtitle":"禮貌體是什麼？套公式開口說第一句日文","minutes":6,"sections":[{"type":"text","body":"文字關卡全部通過，開始說句子！日文分「常體」（對熟朋友、家人）和【禮貌體】（對剛認識的人、長輩、店員）。禮貌體的招牌就是句尾的【です】和【ます】——把「客氣」全部打包在句尾。零基礎先學禮貌體最安全，走遍日本都不失禮。"},{"type":"text","body":"最基本的句型：【A は B です】＝「A 是 B」。注意！這裡的は是助詞，唸 wa——第 4 課的伏筆正式回收。「私は台湾人です」（watashi wa taiwanjin desu）＝我是台灣人。把 B 換掉，就能介紹身分、職業、興趣，一個公式打天下。"},{"type":"table","title":"套公式練習：A は B です","headers":["日文","羅馬拼音","中文"],"rows":[["私は台湾人です","watashi wa taiwanjin desu","我是台灣人"],["私は大学生です","watashi wa daigakusei desu","我是大學生"],["私は会社員です","watashi wa kaishain desu","我是上班族"],["趣味は旅行です","shumi wa ryokou desu","我的興趣是旅行"]]},{"type":"text","body":"想問問題？句尾加一個【か】就好，連問號都可以省：「お名前は何ですか」（請問你叫什麼名字？）。動詞的禮貌體則用【ます】結尾：「日本語を勉強しています」（我正在學日文）——〜しています是「正在做〜」的固定句型，句中的を就是第 4 課預告過的助詞（標示動作對象，下一課正式介紹），現在先整句背起來。過去式則是【ました】：「台湾から来ました」（我從台灣來，から＝「從〜」）。"},{"type":"sounds","title":"點擊聽發音：開口說說看","items":[{"text":"私は台湾人です","sub":"watashi wa taiwanjin desu","zh":"我是台灣人"},{"text":"大学生です","sub":"daigakusei desu","zh":"我是大學生"},{"text":"お名前は何ですか","sub":"onamae wa nan desu ka","zh":"請問你叫什麼名字？"},{"text":"台湾から来ました","sub":"taiwan kara kimashita","zh":"我從台灣來"},{"text":"日本語を勉強しています","sub":"nihongo o benkyou shite imasu","zh":"我正在學日文"}]},{"type":"tip","body":"日文超愛省略「我」：自我介紹時直接說「大学生です」反而更自然，不用每一句都わたし開頭——聽的人知道你在說自己。"},{"type":"quiz","title":"小試身手","questions":[{"question":"對初次見面的日本人說話，應該用哪種說法最安全？","options":["常體","禮貌體（です／ます）","全部用漢字筆談","英文就好"],"answer":1,"explain_zh":"禮貌體（です／ます結尾）對任何人都不失禮，是零基礎的最佳選擇。常體只對熟朋友和家人使用。"},{"question":"「私は台湾人です」的「は」唸什麼？","options":["ha","wa","ba","不發音"],"answer":1,"explain_zh":"這個は是主題助詞，所以唸 wa：watashi wa taiwanjin desu。は只有在單字內部才唸 ha。"},{"question":"要把「これは何です＿」變成疑問句，句尾要加？","options":["ね","よ","か","わ"],"answer":2,"explain_zh":"句尾加か就是疑問句：「これは何ですか」＝這是什麼？ね是尋求同意（對吧），よ是提醒告知，都不是疑問。"},{"question":"「台湾から来ました」的「ました」表示？","options":["未來","現在進行","過去","命令"],"answer":2,"explain_zh":"ます的過去式是ました：「来ました」＝來了（已經發生）。現在進行是「〜しています」，像「勉強しています」。"}]}]},{"id":"jp-09","title":"助詞入門：は／が／を／に／で","subtitle":"句子的快遞標籤，各自有各自的工作","minutes":7,"sections":[{"type":"text","body":"日文的語序很自由，為什麼日本人不會搞混「誰吃了誰」？因為每個名詞後面都掛著一張【助詞】小標籤，寫明它在句子裡的工作——就像寄包裹要貼標籤：收件人、寄件人、內容物一目瞭然。助詞就是句子的【快遞標籤】，貼對了，字序怎麼排都不會誤會。"},{"type":"table","title":"五大助詞的工作","headers":["助詞","唸法","工作","比喻"],"rows":[["は","wa","標示主題：這句話在講誰","聚光燈——打在主角身上"],["が","ga","標示主語、新資訊、喜好的對象","舉手——「是我！」"],["を","o","標示動作的對象（受詞）","箭靶——動作射向誰"],["に","ni","目的地、時間、存在的地點","圖釘——釘在地圖或月曆上"],["で","de","動作發生的場所、使用的工具","舞台——在哪裡演這齣戲"]]},{"type":"text","body":"實際走一遍：「私は学生です」——は把聚光燈打在「我」身上。「りんごを食べます」——を告訴你「吃」的箭靶是蘋果。「学校に行きます」——に把目的地釘在學校。「図書館で勉強します」——で說明「唸書」這齣戲在圖書館的舞台上演。最後一個大魔王：中文說「喜歡貓」感覺像動詞吃受詞，但日文的「好き」是形容詞，喜歡的對象要用が：【猫が好きです】——這是台灣人最常犯的錯，現在就記牢！"},{"type":"sounds","title":"點擊聽發音：五大助詞例句","items":[{"text":"私は台湾人です","sub":"watashi wa taiwanjin desu","zh":"我是台灣人（は＝主題）"},{"text":"りんごを食べます","sub":"ringo o tabemasu","zh":"吃蘋果（を＝動作對象）"},{"text":"学校に行きます","sub":"gakkou ni ikimasu","zh":"去學校（に＝目的地）"},{"text":"図書館で勉強します","sub":"toshokan de benkyou shimasu","zh":"在圖書館唸書（で＝動作場所）"},{"text":"猫が好きです","sub":"neko ga suki desu","zh":"我喜歡貓（が＝喜好對象）"}]},{"type":"tip","body":"に vs で 快速判斷：只是「到達、存在」用に（学校に行きます）；要在那裡「做動作」用で（図書館で勉強します）。問自己：有沒有在那裡演戲？有就用で。"},{"type":"quiz","title":"小試身手","questions":[{"question":"わたし＿学生です。","options":["は","が","を","に"],"answer":0,"explain_zh":"「は」是主題助詞，把聚光燈打在「我」身上：我是學生。注意這個は唸 wa。を標示動作對象、に是目的地，都不適合這句。"},{"question":"毎日りんご＿食べます。","options":["は","が","を","で"],"answer":2,"explain_zh":"「吃」的箭靶是蘋果，動作對象用を：「りんごを食べます」。這個を唸 o。"},{"question":"図書館＿勉強します。","options":["に","を","で","が"],"answer":2,"explain_zh":"「唸書」是在圖書館上演的動作，動作發生的場所用で。に只表示到達或存在（例：図書館にいます），沒有演戲的成分。"},{"question":"私は猫＿好きです。","options":["を","が","で","に"],"answer":1,"explain_zh":"「好き」是形容詞，喜歡的對象用が：「猫が好きです」。中文的「喜歡」是動詞所以很想用を——這是台灣學習者最常見的錯誤，記住「が好き」！"},{"question":"明日、学校＿行きます。","options":["を","に","で","は"],"answer":1,"explain_zh":"移動的目的地用に（圖釘釘在學校）：「学校に行きます」＝去學校。で是動作發生的場所，不用於單純移動的終點。"}]}]},{"id":"jp-10","title":"打招呼與自我介紹","subtitle":"把前九課全部串起來，完成你的日文出道作","minutes":6,"sections":[{"type":"text","body":"最後一課！我們把前九課學的假名、發音規則、です／ます句型和助詞全部組合起來，完成一段能實戰的自我介紹。先從一天的打招呼開始——注意「こんにちは」「こんばんは」句尾的は都唸 wa，因為它們原本就是助詞（第 4 課和第 9 課的知識在這裡會合了）。"},{"type":"table","title":"一天的打招呼","headers":["時機","日文","羅馬拼音"],"rows":[["早上","おはようございます","ohayou gozaimasu"],["白天見面","こんにちは","konnichiwa"],["晚上見面","こんばんは","konbanwa"],["睡前","おやすみなさい","oyasuminasai"],["道別","じゃあ、またね","jaa, mata ne"]]},{"type":"sounds","title":"點擊聽發音：打招呼","items":[{"text":"おはようございます","sub":"ohayou gozaimasu（よう＝長音）","zh":"早安"},{"text":"こんにちは","sub":"konnichiwa（は唸 wa！）","zh":"你好／午安"},{"text":"こんばんは","sub":"konbanwa","zh":"晚安（晚上見面時）"},{"text":"はじめまして","sub":"hajimemashite","zh":"初次見面，你好"},{"text":"また明日","sub":"mata ashita","zh":"明天見"}]},{"type":"text","body":"接著是重頭戲：完整自我介紹範本。把它背起來，就是你的日文出道作。仔細看，裡面藏了多少學過的東西：【勉強（べんきょう）】有拗音和長音、【は】唸 wa、【を】唸 o、句句都是禮貌體です／ます——前九課一次驗收。其中「〜と呼んでください」（請叫我〜）用到還沒教的文法，先整句當模板背起來就好。"},{"type":"sounds","title":"點擊聽發音：完整自我介紹範本（跟著唸）","items":[{"text":"はじめまして","sub":"hajimemashite","zh":"初次見面，你好"},{"text":"私は台湾人です","sub":"watashi wa taiwanjin desu","zh":"我是台灣人"},{"text":"アミと呼んでください","sub":"ami to yonde kudasai","zh":"請叫我阿美（換成你的名字）"},{"text":"大学生です","sub":"daigakusei desu","zh":"我是大學生"},{"text":"日本語を勉強しています","sub":"nihongo o benkyou shite imasu","zh":"我正在學日文"},{"text":"趣味は旅行です","sub":"shumi wa ryokou desu","zh":"我的興趣是旅行"},{"text":"よろしくお願いします","sub":"yoroshiku onegaishimasu","zh":"請多多指教"}]},{"type":"tip","body":"自我介紹的結尾一定要說「よろしくお願いします」（請多多指教）——這是日本社交的萬用結尾，說的時候微微點頭鞠躬，好感度直接加倍。"},{"type":"quiz","title":"小試身手","questions":[{"question":"早上在學校遇到老師，應該說？","options":["こんばんは","おはようございます","おやすみなさい","ただいま"],"answer":1,"explain_zh":"早上用「おはようございます」。こんばんは是晚上見面用、おやすみなさい是睡前說、ただいま是回到家說「我回來了」。"},{"question":"「はじめまして」什麼時候用？","options":["每天見面都說","初次見面時","道別時","吃飯前"],"answer":1,"explain_zh":"はじめまして＝「初次見面，你好」，只在第一次見面時說，是自我介紹的開場白。之後見面就用こんにちは等日常招呼。"},{"question":"自我介紹的結尾最適合說哪一句？","options":["さようなら","いってきます","よろしくお願いします","ごちそうさまでした"],"answer":2,"explain_zh":"「よろしくお願いします」（請多多指教）是自我介紹的標準結尾。さようなら是再見、いってきます是出門說的、ごちそうさまでした是吃飽後說的。"},{"question":"「日本語を勉強しています」的「勉強」是什麼意思？","options":["勉強、將就","學習","很強壯","努力工作"],"answer":1,"explain_zh":"第 1 課的陷阱漢字回收！「勉強（べんきょう）」是唸書、學習，整句＝我正在學日文。注意べんきょう裡有拗音きょ和長音。"},{"question":"「こんにちは」的正確羅馬拼音是？","options":["konnichiha","konnichiwa","konnichiba","konnitiwa"],"answer":1,"explain_zh":"句尾的は是助詞出身，唸 wa：konnichiwa。另外ち的 Hepburn 拼音是 chi 不是 ti，所以 konnitiwa 也不對。"}]}]},{"id":"jp-11","title":"関西弁入門與各地口音","subtitle":"聽懂大阪腔，綜藝節目瞬間好笑十倍","minutes":7,"sections":[{"type":"text","body":"你有沒有發現，日本綜藝節目裡最好笑的藝人，講話好像跟課本不太一樣？沒錯，他們多半講的是【関西弁】（關西腔）——大阪、京都、神戶一帶的方言。日本搞笑藝人有超高比例來自關西，吐槽文化就是從那裡長出來的，所以想看懂日綜、聽懂梗，關西腔幾乎是必修。而且如果你去日本留學或打工度假，關西是台灣人的熱門去處，交到的朋友一開口很可能就是滿滿的大阪腔。整體感覺上：關東（東京）的標準語語調平穩、用詞收斂，給人禮貌冷靜的印象；關西腔則是語調起伏大、節奏像唱歌，用詞直接又熱情，整個氛圍就是「自來熟」。同一句話，東京人說像新聞主播，大阪人說像在跟你搏感情——先抓住這個大方向，細節我們慢慢聽。"},{"type":"sounds","title":"點擊聽發音：關西腔核心表現","items":[{"text":"めっちゃ","sub":"metcha","zh":"超級、非常（＝標準語的とても）。「めっちゃおいしい」＝超好吃，年輕人連在東京都會講"},{"text":"ほんま","sub":"honma","zh":"真的（＝標準語的本当）。「ほんま？」＝真的假的？關西人一天要講幾十次"},{"text":"あかん","sub":"akan","zh":"不行、糟糕（＝標準語的だめ）。「それはあかんで」＝那樣不行啦"},{"text":"ちゃう","sub":"chau","zh":"不對、不是（＝標準語的違う）。連講兩次「ちゃうちゃう」＝不是不是啦"},{"text":"おおきに","sub":"ookini","zh":"謝謝（＝標準語的ありがとう）。京都、大阪的老店家結帳時常聽到"},{"text":"なんでやねん","sub":"nande yanen","zh":"「搞什麼啦！／哪有這樣的啦！」——關西吐槽的靈魂金句，聽到這句通常伴隨一個拍手或拍頭"},{"text":"せやな","sub":"seyana","zh":"對啊、就是說啊（＝標準語的そうだね）。附和專用，聊天潤滑劑"}]},{"type":"table","title":"標準語 vs 関西弁對照表","headers":["意思","標準語（東京）","関西弁（大阪）","小筆記"],"rows":[["不行、不可以","だめ","あかん","「あかんあかん！」連發＝超級不行"],["真的","本当（ほんとう）","ほんま","「ほんまに？」＝真的嗎？"],["非常、超","とても","めっちゃ","已紅遍全日本的關西輸出品"],["不對、不是","違う（ちがう）","ちゃう","「ちゃうねん」＝不是這樣啦（準備開始解釋）"],["謝謝","ありがとう","おおきに","觀光地店家的招牌台詞"],["對啊、是啊","そうだね","せやな","朋友聊天附和神器"],["為什麼啦！","なんでだよ","なんでやねん","吐槽標配，語調要往上甩"]]},{"type":"tip","body":"學方言的心法是【聽懂優先，開口隨緣】。你的目標是看綜藝不用暫停查字典、跟關西朋友聊天跟得上，而不是把自己變成大阪人。如果你偶爾冒出一句「ほんま？」「めっちゃええやん」，關西朋友通常會超開心、覺得你很可愛；但腔調不到位還整段硬講，反而容易尷尬——就像外國人硬要模仿台灣國語，講得好是親切，講不好是綜藝效果。先用標準語打好底，方言當調味料撒一點就好。"},{"type":"text","body":"【文化補充・純見識，不列入練習】日本的方言可不只關西腔，這段帶你環島聽個氣氛就好，任何題目都不會考。九州的【博多弁】（福岡一帶）被日本人票選為「最可愛方言」常勝軍：問句尾巴變成「〜と？」（「何しようと？」＝你在幹嘛呀？）、強調時句尾加「〜ばい」、告白說「好いとう」（すいとう）＝我喜歡你，整個軟萌。【東北弁】則以含糊的口音出名，冷到嘴巴不想張開的感覺，日劇裡的鄉下阿公阿嬤常操這種腔，連日本年輕人有時都聽不太懂。最特別的是【沖繩】：「めんそーれ」（歡迎光臨）、「にふぇーでーびる」（謝謝），源自琉球王國的語言底子，跟本土日語差距大到語言學家把它當另一種語言。再補兩個觀光熱區給你長長見識（一樣不會考）。【北海道弁】：去札幌玩很可能聽到「なまら」＝とても（超級），「なまらうまい」＝超好吃；句尾愛加「〜っしょ」表示「對吧？」（「いいっしょ？」＝不錯吧？）；還有超傳神的「しばれる」＝凍える，形容那種零下十幾度、寒氣鑽進骨頭的冷——本州的「寒い」根本不夠用，得用「しばれる」才到位。最後是【京都・京言葉】：明明跟大阪同屬關西，氣質卻天差地遠——大阪腔熱情外放，京言葉優雅婉轉。老舖門口迎客說「おいでやす」（歡迎光臨），敬語愛用「〜はる」（「先生が言うたはる」＝老師說了，聽起來柔柔的）。更有名的是「京都人說法」文化哏：京都人講話出了名的委婉，話中常有話——例如你提了個邀約，對方微笑說「考えとくわ」（我考慮看看），在京都語境裡十之八九是客氣地拒絕你了。之後看日劇或動畫聽到這些奇妙尾音，你就能會心一笑：喔～這角色是九州人、北海道人，還是講話很「京都」！這樣就夠了。"},{"type":"quiz","title":"關西腔小試身手","questions":[{"question":"大阪朋友大喊「あかん！」，用標準語說是哪一個？","options":["だめ","すごい","ありがとう","そうだね"],"answer":0,"explain_zh":"「あかん」＝標準語的「だめ」（不行、糟糕）。想像手機快掉進水裡的瞬間，大阪人喊的就是「あかんあかん！」。"},{"question":"標準語的「とても美味しい」（非常好吃），換成關西腔會怎麼說？","options":["ほんまおいしい","めっちゃおいしい","ちゃうおいしい","おおきにおいしい"],"answer":1,"explain_zh":"「とても」的關西版是「めっちゃ」，所以是「めっちゃおいしい」。「ほんまおいしい」雖然也是關西人會講的話，但「ほんま」對應的是「本当に」（真的），不是「とても」；「ちゃう」是「不對」，「おおきに」是「謝謝」，更對不上。"},{"question":"在京都老店結帳，老闆娘笑著說「おおきに」，她的意思是？","options":["歡迎光臨","請再來","謝謝","不行喔"],"answer":2,"explain_zh":"「おおきに」＝關西版的「ありがとう」（謝謝）。原本是「大きに（＝非常）ありがとう」的縮短版，只留下前半。"},{"question":"朋友誤會你的意思，你想用關西腔說「不是不是啦！」，該說？","options":["せやなせやな","ほんまほんま","あかんあかん","ちゃうちゃう"],"answer":3,"explain_zh":"「違う」的關西版是「ちゃう」，連講兩次「ちゃうちゃう」就是「不是不是啦」。「せやな」是附和「對啊」，方向完全相反。"},{"question":"綜藝裡吐槽役一邊拍手一邊喊的關西經典台詞「なんでやねん」，最接近的意思是？","options":["「哪有這樣的啦！」","「太厲害了吧！」","「我先走囉！」","「肚子好餓喔！」"],"answer":0,"explain_zh":"「なんでやねん」是關西吐槽的靈魂，相當於「為什麼會這樣啦！／哪有這樣的！」。搭檔講了蠢話，吐槽役立刻用這句接，是日本漫才的基本節奏。"}]}]}]},"korean":{"language":"korean","display_name_zh":"韓文","alphabet":[{"char":"ㄱ","roman":"g/k","group":"基本子音"},{"char":"ㄴ","roman":"n","group":"基本子音"},{"char":"ㄷ","roman":"d/t","group":"基本子音"},{"char":"ㄹ","roman":"r/l","group":"基本子音"},{"char":"ㅁ","roman":"m","group":"基本子音"},{"char":"ㅂ","roman":"b/p","group":"基本子音"},{"char":"ㅅ","roman":"s","group":"基本子音"},{"char":"ㅇ","roman":"-/ng","group":"基本子音"},{"char":"ㅈ","roman":"j","group":"基本子音"},{"char":"ㅊ","roman":"ch","group":"基本子音"},{"char":"ㅋ","roman":"k","group":"基本子音"},{"char":"ㅌ","roman":"t","group":"基本子音"},{"char":"ㅍ","roman":"p","group":"基本子音"},{"char":"ㅎ","roman":"h","group":"基本子音"},{"char":"ㄲ","roman":"kk","group":"雙子音"},{"char":"ㄸ","roman":"tt","group":"雙子音"},{"char":"ㅃ","roman":"pp","group":"雙子音"},{"char":"ㅆ","roman":"ss","group":"雙子音"},{"char":"ㅉ","roman":"jj","group":"雙子音"},{"char":"ㅏ","roman":"a","group":"基本母音"},{"char":"ㅑ","roman":"ya","group":"基本母音"},{"char":"ㅓ","roman":"eo","group":"基本母音"},{"char":"ㅕ","roman":"yeo","group":"基本母音"},{"char":"ㅗ","roman":"o","group":"基本母音"},{"char":"ㅛ","roman":"yo","group":"基本母音"},{"char":"ㅜ","roman":"u","group":"基本母音"},{"char":"ㅠ","roman":"yu","group":"基本母音"},{"char":"ㅡ","roman":"eu","group":"基本母音"},{"char":"ㅣ","roman":"i","group":"基本母音"},{"char":"ㅐ","roman":"ae","group":"複合母音"},{"char":"ㅒ","roman":"yae","group":"複合母音"},{"char":"ㅔ","roman":"e","group":"複合母音"},{"char":"ㅖ","roman":"ye","group":"複合母音"},{"char":"ㅘ","roman":"wa","group":"複合母音"},{"char":"ㅙ","roman":"wae","group":"複合母音"},{"char":"ㅚ","roman":"oe","group":"複合母音"},{"char":"ㅝ","roman":"wo","group":"複合母音"},{"char":"ㅞ","roman":"we","group":"複合母音"},{"char":"ㅟ","roman":"wi","group":"複合母音"},{"char":"ㅢ","roman":"ui","group":"複合母音"}],"items":[{"text":"안녕하세요","reading":"annyeonghaseyo","zh":"你好","topic":"打招呼","example":"안녕하세요! 오늘 날씨 좋네요.","example_zh":"你好！今天天氣真好。","note":"最通用的존댓말問候，任何時段都能用；對親近朋友可改用반말的안녕。","level":"TOPIK1","casual":{"text":"안녕","reading":"annyeong","note":"반말問候，只對熟的同齡朋友或晚輩；對長輩、店員或初次見面的人說會失禮。年輕人傳訊息也常打「하이」。"}},{"text":"안녕","reading":"annyeong","zh":"嗨（半語）","topic":"打招呼","example":"안녕! 오랜만이야.","example_zh":"嗨！好久不見。","note":"반말，只能對同齡好友或晚輩用；對長輩或初次見面的人用會很失禮。","level":"TOPIK1"},{"text":"처음 뵙겠습니다","reading":"cheoeum boepgetseumnida","zh":"初次見面（很正式）","topic":"打招呼","example":"처음 뵙겠습니다. 잘 부탁드립니다.","example_zh":"初次見面，請多多指教。","note":"합쇼體的正式說法，適合正式場合或對長輩；朋友間用만나서 반가워요就好。","level":"TOPIK2","casual":{"text":"반가워","reading":"bangawo","note":"朋友介紹的同齡新朋友之間可直接說반가워；正式場合、對長輩仍要用처음 뵙겠습니다，一開口就用반말會顯得沒分寸。"}},{"text":"만나서 반가워요","reading":"mannaseo bangawoyo","zh":"很高興認識你","topic":"打招呼","example":"만나서 반가워요. 이야기 많이 들었어요.","example_zh":"很高興認識你，久仰大名。","note":"初次見面必備句；반말是만나서 반가워，更正式是반갑습니다。","level":"TOPIK1","casual":{"text":"만나서 반가워","reading":"mannaseo bangawo","note":"반말，確定對方同齡或已說好講半語時用；場合不明時先用해요體最保險。"}},{"text":"잘 지냈어요?","reading":"jal jinaesseoyo?","zh":"最近過得好嗎？","topic":"打招呼","example":"오랜만이에요. 잘 지냈어요?","example_zh":"好久不見，最近過得好嗎？","note":"對一陣子沒見的朋友用；반말是잘 지냈어?。回答可以說네, 잘 지냈어요。","level":"TOPIK1","casual":{"text":"잘 지냈어?","reading":"jal jinaesseo?","note":"반말，熟朋友久別重逢用；訊息裡也常只打「잘 지냈지?」。對長輩要說잘 지내셨어요?。"}},{"text":"오랜만이에요","reading":"oraenmanieyo","zh":"好久不見","topic":"打招呼","example":"와, 진짜 오랜만이에요!","example_zh":"哇，真的好久不見！","note":"반말是오랜만이야；更正式可說오랜만입니다。","level":"TOPIK1","casual":{"text":"오랜만이야","reading":"oraenmaniya","note":"반말，熟朋友限定；網路聊天常再縮成「간만이야」。對長輩說오랜만입니다。"}},{"text":"안녕히 가세요","reading":"annyeonghi gaseyo","zh":"再見（對要離開的人說）","topic":"打招呼","example":"","example_zh":"","note":"自己留在原地、對方離開時說；如果是自己離開，要對留下的人說안녕히 계세요，兩句別搞混。","level":"TOPIK1","casual":{"text":"잘 가","reading":"jal ga","note":"반말道別，只對親近同齡朋友或晚輩；對長輩或不熟的人一定要用안녕히 가세요，說잘 가會很失禮。"}},{"text":"안녕히 계세요","reading":"annyeonghi gyeseyo","zh":"再見（自己離開時說）","topic":"打招呼","example":"","example_zh":"","note":"自己要走、對方留下時說；掛電話或離開店家時也常用。","level":"TOPIK1","casual":{"text":"나 갈게","reading":"na galge","note":"반말「我先走囉」，熟朋友聚會先離開時的自然說法；對長輩要說먼저 가 보겠습니다。"}},{"text":"잘 가","reading":"jal ga","zh":"再見／路上小心（半語）","topic":"打招呼","example":"잘 가! 내일 봐.","example_zh":"再見！明天見。","note":"반말，只對親近朋友用；존댓말可說잘 가요或조심히 가세요。","level":"TOPIK1"},{"text":"또 만나요","reading":"tto mannayo","zh":"下次再見","topic":"打招呼","example":"오늘 즐거웠어요. 또 만나요!","example_zh":"今天很開心，下次再見！","note":"道別時表達想再見面的心意，交朋友時很好用；반말是또 만나자。","level":"TOPIK1","casual":{"text":"또 보자","reading":"tto boja","note":"반말；口語中「見面」多用보다而非만나다，또 보자比또 만나자更常聽到。熟人限定。"}},{"text":"좋은 아침이에요","reading":"joeun achimieyo","zh":"早安","topic":"打招呼","example":"","example_zh":"","note":"早上打招呼用；其實韓國人早上也常直接說안녕하세요。","level":"TOPIK1","casual":{"text":"굿모닝","reading":"gunmoning","note":"韓式英語，年輕同事、朋友間輕鬆打招呼用；對長輩、正式場合仍說안녕하세요或안녕하십니까。"}},{"text":"잘 자요","reading":"jal jayo","zh":"晚安（睡前）","topic":"打招呼","example":"늦었네요. 잘 자요!","example_zh":"很晚了，晚安！","note":"睡前道晚安用；반말是잘 자，對長輩要說안녕히 주무세요。","level":"TOPIK1","casual":{"text":"잘 자","reading":"jal ja","note":"반말晚安，熟朋友或情侶用；訊息裡年輕人也打「굿밤」（good night縮語）。對長輩要說안녕히 주무세요。"}},{"text":"어서 오세요","reading":"eoseo oseyo","zh":"歡迎光臨","topic":"打招呼","example":"","example_zh":"","note":"進店家時店員會說的話，聽懂就好；朋友來家裡玩也可以這樣歡迎對方。","level":"TOPIK1","casual":{"text":"어서 와","reading":"eoseo wa","note":"반말歡迎詞，朋友來自己家玩時說；綜藝節目名「어서와~ 한국은 처음이지?」就是它。店家對客人永遠用어서 오세요。"}},{"text":"수고하셨습니다","reading":"sugohasyeotseumnida","zh":"辛苦了","topic":"打招呼","example":"오늘 수고하셨습니다!","example_zh":"今天辛苦了！","note":"工作、活動結束時互相慰勞的話，職場文化必備；對平輩朋友可說수고했어요。","level":"TOPIK2","casual":{"text":"수고했어","reading":"sugohaesseo","note":"반말，只能對平輩同事或晚輩說；千萬別對上司說，對上司要說고생 많으셨습니다。輕鬆場合也常只說「수고~」。"}},{"text":"잘 부탁드립니다","reading":"jal butakdeurimnida","zh":"請多多指教","topic":"打招呼","example":"앞으로 잘 부탁드립니다.","example_zh":"今後請多多指教。","note":"自我介紹結尾的固定句，類似日文的「請多關照」；朋友間可說잘 부탁해요。","level":"TOPIK2","casual":{"text":"잘 부탁해","reading":"jal butakae","note":"반말，對同齡朋友或晚輩用；對長輩、正式自我介紹一定用잘 부탁드립니다。"}},{"text":"이름이 뭐예요?","reading":"ireumi mwoyeyo?","zh":"你叫什麼名字？","topic":"自我介紹","example":"이름이 뭐예요? 저는 유진이에요.","example_zh":"你叫什麼名字？我是宥真。","note":"해요體的問法，適合同輩之間；對長輩要用更尊敬的성함이 어떻게 되세요?。","level":"TOPIK1","casual":{"text":"이름이 뭐야?","reading":"ireumi mwoya?","note":"반말，只對明顯同齡或年幼者用；對初次見面的成年人直接用반말問名字非常失禮。"}},{"text":"성함이 어떻게 되세요?","reading":"seonghami eotteoke doeseyo?","zh":"請問您貴姓大名？","topic":"自我介紹","example":"","example_zh":"","note":"성함是이름的敬語，對長輩或正式場合使用，顯得有禮貌。","level":"TOPIK2"},{"text":"저는 대만 사람이에요","reading":"jeoneun daeman saramieyo","zh":"我是台灣人","topic":"自我介紹","example":"저는 대만 사람이에요. 대만 알아요?","example_zh":"我是台灣人，你知道台灣嗎？","note":"대만＝台灣；韓國人對台灣的珍珠奶茶（버블티）和小籠包很熟悉，是很好的話題。","level":"TOPIK1","casual":{"text":"나 대만 사람이야","reading":"na daeman saramiya","note":"반말版自我介紹：저→나、이에요→이야；只在已經講好말 놓기（說半語）的朋友間用。"}},{"text":"저는 대만에서 왔어요","reading":"jeoneun daemaneseo wasseoyo","zh":"我從台灣來","topic":"自我介紹","example":"","example_zh":"","note":"에서表示出發點；自我介紹時和저는 대만 사람이에요搭配使用。","level":"TOPIK1"},{"text":"저는 타이베이에 살아요","reading":"jeoneun taibeie sarayo","zh":"我住在台北","topic":"自我介紹","example":"저는 타이베이에 살아요. 서울하고 비슷해요.","example_zh":"我住在台北，和首爾有點像。","note":"에＋살다表示居住地點；也可換成고향은 타이베이예요（我的家鄉是台北）。","level":"TOPIK1","casual":{"text":"나 타이베이 살아","reading":"na taibei sara","note":"반말，口語常把助詞에直接省略（타이베이에→타이베이）；熟人閒聊時這樣說最自然。"}},{"text":"저는 학생이에요","reading":"jeoneun haksaengieyo","zh":"我是學生","topic":"自我介紹","example":"저는 대학생이에요.","example_zh":"我是大學生。","note":"대학생＝大學生、대학원생＝研究生；학생有尾音所以接이에요。","level":"TOPIK1","casual":{"text":"나 학생이야","reading":"na haksaengiya","note":"반말；口語中主題助詞는也常省略，直接「나 학생이야」。對長輩或正式場合用저는 학생이에요。"}},{"text":"저는 회사원이에요","reading":"jeoneun hoesawonieyo","zh":"我是上班族","topic":"自我介紹","example":"","example_zh":"","note":"회사원泛指公司職員；介紹職業時的常用句型是저는＋職業＋이에요/예요。","level":"TOPIK1"},{"text":"무슨 일을 하세요?","reading":"museun ireul haseyo?","zh":"你從事什麼工作？","topic":"自我介紹","example":"","example_zh":"","note":"用하세요帶敬語比較有禮貌；初次見面問工作在韓國很常見，不算失禮。","level":"TOPIK1","casual":{"text":"무슨 일 해?","reading":"museun il hae?","note":"반말，省略助詞을；只對同齡熟人用，對年長者問職業務必用하세요的敬語形。"}},{"text":"몇 살이에요?","reading":"myeot sarieyo?","zh":"你幾歲？","topic":"自我介紹","example":"실례지만 몇 살이에요?","example_zh":"不好意思，請問你幾歲？","note":"韓國人常問年齡是為了決定稱謂（哥哥姊姊等）；問長輩要改用연세가 어떻게 되세요?，並先說실례지만緩和語氣。","level":"TOPIK1","casual":{"text":"몇 살이야?","reading":"myeot sariya?","note":"반말，只對明顯比自己小或同齡熟人用；年齡本身是敏感話題，對長輩絕對要用연세가 어떻게 되세요?。"}},{"text":"저는 스물다섯 살이에요","reading":"jeoneun seumuldaseot sarieyo","zh":"我二十五歲","topic":"自我介紹","example":"","example_zh":"","note":"說年齡用固有數字（하나、둘…）；韓國2023年起改用滿年齡（만 나이），聊年齡時可以確認一下。","level":"TOPIK1"},{"text":"한국어를 배우고 있어요","reading":"hangugeoreul baeugo isseoyo","zh":"我正在學韓語","topic":"自我介紹","example":"요즘 한국어를 배우고 있어요.","example_zh":"我最近在學韓語。","note":"-고 있어요表示正在進行；說出這句韓國朋友通常會很開心並放慢語速。","level":"TOPIK1","casual":{"text":"한국어 배우는 중이야","reading":"hangugeo baeuneun jungiya","note":"반말；-는 중이야（正在…中）是口語愛用句型，助詞를一併省略。熟朋友間用。"}},{"text":"한국어를 조금 할 줄 알아요","reading":"hangugeoreul jogeum hal jul arayo","zh":"我會說一點韓語","topic":"自我介紹","example":"","example_zh":"","note":"-(으)ㄹ 줄 알다表示會做某事；搭配천천히 말해 주세요（請說慢一點）更實用。","level":"TOPIK2","casual":{"text":"한국어 쪼금 해","reading":"hangugeo jjogeum hae","note":"반말；쪼금是조금的口語加強版，帶可愛感。年輕人之間常這樣自謙，正式場合說조금 할 줄 압니다。"}},{"text":"어디에서 왔어요?","reading":"eodieseo wasseoyo?","zh":"你來自哪裡？","topic":"自我介紹","example":"","example_zh":"","note":"問對方出身地；也可以說고향이 어디예요?（你家鄉在哪？）。","level":"TOPIK1","casual":{"text":"어디서 왔어?","reading":"eodiseo wasseo?","note":"반말；어디에서縮成어디서是口語鐵則，連해요體口語也多說어디서 왔어요?。熟人或對晚輩用。"}},{"text":"대만에 와 본 적이 있어요?","reading":"daemane wa bon jeogi isseoyo?","zh":"你來過台灣嗎？","topic":"自我介紹","example":"대만에 와 본 적이 있어요? 야시장 꼭 가 보세요.","example_zh":"你來過台灣嗎？一定要去逛夜市。","note":"-아/어 본 적이 있다表示經驗；邀請對方來台灣玩是拉近距離的好話題。","level":"TOPIK2","casual":{"text":"대만 와 봤어?","reading":"daeman wa bwasseo?","note":"반말；口語把「-아 본 적이 있다」直接簡化成過去式와 봤어?，更輕快。熟朋友間用。"}},{"text":"우리 친구 해요","reading":"uri chingu haeyo","zh":"我們當朋友吧","topic":"自我介紹","example":"나이도 같은데 우리 친구 해요.","example_zh":"年紀一樣，我們當朋友吧。","note":"韓國的친구通常指同齡朋友；同齡朋友熟了之後會提議말 놓다（改說半語）。","level":"TOPIK1","casual":{"text":"우리 친구 하자","reading":"uri chingu haja","note":"반말勸誘形-자；同齡人互相確認年紀後常接著說「말 놓자」（我們說半語吧），這是韓國交友的關鍵一步。"}},{"text":"취미가 뭐예요?","reading":"chwimiga mwoyeyo?","zh":"你的興趣是什麼？","topic":"興趣嗜好","example":"취미가 뭐예요? 저는 여행을 좋아해요.","example_zh":"你的興趣是什麼？我喜歡旅行。","note":"認識新朋友的萬用開場問題；반말是취미가 뭐야?。","level":"TOPIK1","casual":{"text":"취미가 뭐야?","reading":"chwimiga mwoya?","note":"반말，熟朋友間用；更口語的問法是「주말에 뭐 하고 놀아?」（週末都玩什麼？）。"}},{"text":"제 취미는 여행이에요","reading":"je chwimineun yeohaengieyo","zh":"我的興趣是旅行","topic":"興趣嗜好","example":"","example_zh":"","note":"제＝저의（我的）縮寫；回答句型是제 취미는＋名詞＋이에요/예요。","level":"TOPIK1"},{"text":"저는 음악 듣는 걸 좋아해요","reading":"jeoneun eumak deunneun geol joahaeyo","zh":"我喜歡聽音樂","topic":"興趣嗜好","example":"","example_zh":"","note":"動詞＋는 걸 좋아해요＝喜歡做某事；걸是것을的口語縮寫。","level":"TOPIK1","casual":{"text":"나 음악 듣는 거 좋아해","reading":"na eumak deunneun geo joahae","note":"반말；걸（것을）在口語再鬆一點就說거，助詞完全省略是聊天常態。熟人間用。"}},{"text":"케이팝을 좋아해요","reading":"keipabeul joahaeyo","zh":"我喜歡K-POP","topic":"興趣嗜好","example":"케이팝을 좋아해요. 특히 아이돌 노래요.","example_zh":"我喜歡K-POP，特別是偶像的歌。","note":"K-POP是和韓國人聊天的超級破冰話題；可以接著問최애가 누구예요?（你的本命是誰？）。","level":"TOPIK1","casual":{"text":"나 케이팝 좋아해","reading":"na keipap joahae","note":"반말＋省略助詞을；追星聊天的起手式，接著就能問최애가 누구야?（本命是誰？）。"}},{"text":"어떤 가수를 좋아해요?","reading":"eotteon gasureul joahaeyo?","zh":"你喜歡哪位歌手？","topic":"興趣嗜好","example":"","example_zh":"","note":"어떤＝哪種、哪位；把가수換成배우（演員）、음식（食物）就能延伸話題。","level":"TOPIK1","casual":{"text":"어떤 가수 좋아해?","reading":"eotteon gasu joahae?","note":"반말；口語也常用무슨 가수 좋아해?。對剛認識的人保持해요體較安全。"}},{"text":"드라마 자주 봐요?","reading":"deurama jaju bwayo?","zh":"你常看韓劇嗎？","topic":"興趣嗜好","example":"요즘 무슨 드라마 봐요?","example_zh":"你最近在看什麼劇？","note":"韓劇是共同話題寶庫；口語中常省略助詞（드라마를→드라마），聽起來更自然。","level":"TOPIK1","casual":{"text":"드라마 자주 봐?","reading":"deurama jaju bwa?","note":"반말；語尾去掉요就是半語，語調上揚表疑問。只對熟人用。"}},{"text":"저는 영화 보는 것을 좋아해요","reading":"jeoneun yeonghwa boneun geoseul joahaeyo","zh":"我喜歡看電影","topic":"興趣嗜好","example":"","example_zh":"","note":"보는 것을＝「看」這件事；口語常縮成보는 걸。","level":"TOPIK1"},{"text":"운동을 좋아해요?","reading":"undongeul joahaeyo?","zh":"你喜歡運動嗎？","topic":"興趣嗜好","example":"무슨 운동을 좋아해요?","example_zh":"你喜歡什麼運動？","note":"韓國人流行헬스（上健身房）、등산（爬山）、야구（棒球）；台灣人愛棒球這點很有共鳴。","level":"TOPIK1","casual":{"text":"운동 좋아해?","reading":"undong joahae?","note":"반말＋省略을；朋友間閒聊句。要更具體可問헬스 해?（有上健身房嗎？）。"}},{"text":"저는 등산을 자주 가요","reading":"jeoneun deungsaneul jaju gayo","zh":"我常去爬山","topic":"興趣嗜好","example":"","example_zh":"","note":"자주＝經常；爬山在韓國是全民運動，週末山上滿滿都是人。","level":"TOPIK1"},{"text":"게임 좋아해요?","reading":"geim joahaeyo?","zh":"你喜歡玩遊戲嗎？","topic":"興趣嗜好","example":"같이 게임할래요?","example_zh":"要一起打電動嗎？","note":"韓國電競文化盛行，롤（英雄聯盟）幾乎人人知道；一起打遊戲是快速變熟的方法。","level":"TOPIK1","casual":{"text":"겜 좋아해?","reading":"gem joahae?","note":"겜是게임的縮語，年輕人口語和訊息高頻；반말，熟人限定，長輩多半聽不懂겜。"}},{"text":"사진 찍는 걸 좋아해요","reading":"sajin jjingneun geol joahaeyo","zh":"我喜歡拍照","topic":"興趣嗜好","example":"","example_zh":"","note":"찍다＝拍（照）；可延伸說인생샷（人生美照）這個流行語。","level":"TOPIK1"},{"text":"요리하는 것을 좋아해요","reading":"yorihaneun geoseul joahaeyo","zh":"我喜歡做菜","topic":"興趣嗜好","example":"대만 요리를 만들어 줄게요.","example_zh":"我做台灣菜給你吃。","note":"請韓國朋友吃台灣家常菜是很棒的交流方式；요리하다＝做菜。","level":"TOPIK1"},{"text":"주말에 보통 뭐 해요?","reading":"jumare botong mwo haeyo?","zh":"你週末通常做什麼？","topic":"興趣嗜好","example":"","example_zh":"","note":"보통＝通常；這句能自然帶出對方的生活習慣和興趣，比直接問취미更口語。","level":"TOPIK1","casual":{"text":"주말에 보통 뭐 해?","reading":"jumare botong mwo hae?","note":"반말；比問취미更自然的破冰句。熟人間用，對剛認識的人保留요即可。"}},{"text":"독서를 좋아해요","reading":"dokseoreul joahaeyo","zh":"我喜歡閱讀","topic":"興趣嗜好","example":"","example_zh":"","note":"독서＝讀書（閱讀興趣）；공부（唸書）和독서不同，別混用。","level":"TOPIK1","casual":{"text":"책 읽는 거 좋아해","reading":"chaek ingneun geo joahae","note":"口語幾乎不說「독서를 좋아해요」——太像作文；實際會話說책 읽는 거 좋아해（요），這是課本腔與母語腔的經典差距。"}},{"text":"우리 취미가 같네요!","reading":"uri chwimiga ganneyo!","zh":"我們興趣一樣耶！","topic":"興趣嗜好","example":"우리 취미가 같네요! 다음에 같이 해요.","example_zh":"我們興趣一樣耶！下次一起吧。","note":"-네요表示驚訝或感嘆，發現共同點時說這句可以瞬間拉近距離。","level":"TOPIK1","casual":{"text":"우리 취미 똑같네!","reading":"uri chwimi ttokganne!","note":"반말；口語愛用똑같다（一模一樣）取代같다，語氣更興奮。熟人間拉近距離用。"}},{"text":"시간 있어요?","reading":"sigan isseoyo?","zh":"你有空嗎？","topic":"邀約出遊","example":"내일 시간 있어요?","example_zh":"你明天有空嗎？","note":"邀約的起手式；반말是시간 있어?。","level":"TOPIK1","casual":{"text":"시간 돼?","reading":"sigan dwae?","note":"반말；口語問有沒有空常用되다：시간 돼?（時間可以嗎？）。客氣版是시간 돼요?，對長輩說시간 괜찮으세요?。"}},{"text":"주말에 시간 있어요?","reading":"jumare sigan isseoyo?","zh":"你週末有空嗎？","topic":"邀約出遊","example":"","example_zh":"","note":"에表示時間點；주말＝週末、평일＝平日。","level":"TOPIK1","casual":{"text":"주말에 뭐 해?","reading":"jumare mwo hae?","note":"韓國人約人前習慣先問「週末要幹嘛？」探口風，對方說沒事再開口約——比直接問有沒有空更道地。반말，熟人用。"}},{"text":"같이 밥 먹을래요?","reading":"gachi bap meogeullaeyo?","zh":"要一起吃飯嗎？","topic":"邀約出遊","example":"언제 같이 밥 먹을래요?","example_zh":"什麼時候要一起吃個飯？","note":"-(으)ㄹ래요?詢問對方意願；韓國人說「改天一起吃飯」（언제 밥 한번 먹어요）有時只是客套，要約就給出具體時間。","level":"TOPIK1","casual":{"text":"밥 먹으러 갈래?","reading":"bap meogeureo gallae?","note":"반말；訊息裡年輕人更會打「밥 ㄱ?」（ㄱ＝가자，走吧）。對長輩用식사 같이 하실래요?。"}},{"text":"커피 한잔 할래요?","reading":"keopi hanjan hallaeyo?","zh":"要喝杯咖啡嗎？","topic":"邀約出遊","example":"","example_zh":"","note":"韓國咖啡廳文化超發達，약속（約見面）常常就是喝咖啡聊天。","level":"TOPIK1","casual":{"text":"커피 한잔 할래?","reading":"keopi hanjan hallae?","note":"반말；訊息縮寫版是「커피 ㄱ?」。跟不熟的人喝咖啡邀約保留요更穩妥。"}},{"text":"같이 영화 볼래요?","reading":"gachi yeonghwa bollaeyo?","zh":"要一起看電影嗎？","topic":"邀約出遊","example":"","example_zh":"","note":"같이＝一起，發音是[가치]；把영화換成전시회（展覽）、콘서트（演唱會）就能套用。","level":"TOPIK1","casual":{"text":"영화 볼래?","reading":"yeonghwa bollae?","note":"반말；口語常把같이省了，語境就懂是一起。約會邀請的經典句，熟人限定。"}},{"text":"언제 만날까요?","reading":"eonje mannalkkayo?","zh":"我們什麼時候見面好呢？","topic":"邀約出遊","example":"","example_zh":"","note":"-(으)ㄹ까요?表示和對方商量；반말是언제 만날까?。","level":"TOPIK1","casual":{"text":"언제 볼까?","reading":"eonje bolkka?","note":"반말；朋友間約見面幾乎都說보다不說만나다——언제 볼까?比언제 만날까?自然得多。"}},{"text":"어디에서 만날까요?","reading":"eodieseo mannalkkayo?","zh":"我們在哪裡見面好呢？","topic":"邀約出遊","example":"홍대입구역에서 만날까요?","example_zh":"要在弘大入口站見面嗎？","note":"에서表示動作發生地點；韓國人習慣約在地鐵站출구（出口）幾號見。","level":"TOPIK1","casual":{"text":"어디서 볼까?","reading":"eodiseo bolkka?","note":"반말；어디에서→어디서、만나다→보다雙重口語化。韓國人習慣接著講地鐵站幾號出口。"}},{"text":"토요일 어때요?","reading":"toyoil eottaeyo?","zh":"星期六如何？","topic":"邀約出遊","example":"","example_zh":"","note":"어때요?＝如何？提議時間、地點、食物都能用，超實用。","level":"TOPIK1","casual":{"text":"토요일 어때?","reading":"toyoil eottae?","note":"반말；去掉요即半語。提議時間、地點、菜色都能套，熟人間萬用。"}},{"text":"좋아요, 그때 봐요","reading":"joayo, geuttae bwayo","zh":"好啊，到時候見","topic":"邀約出遊","example":"","example_zh":"","note":"答應邀約的自然回覆；그때＝那個時候；반말是좋아, 그때 보자。","level":"TOPIK1","casual":{"text":"콜! 그때 보자","reading":"kol! geuttae boja","note":"콜（call）＝「成交！」，年輕人答應提議的口頭禪；그때 보자是반말。對長輩回좋습니다, 그때 뵙겠습니다。"}},{"text":"미안해요, 그날은 약속이 있어요","reading":"mianhaeyo, geunareun yaksogi isseoyo","zh":"抱歉，那天我有約了","topic":"邀約出遊","example":"","example_zh":"","note":"약속＝約會、約定（不限戀愛）；婉拒後補一句다음에 같이 가요會更周到。","level":"TOPIK1","casual":{"text":"미안, 그날 약속 있어","reading":"mian, geunal yaksok isseo","note":"반말；미안해요→미안、助詞은/이全省，是訊息婉拒的標準形。對長輩務必用죄송해요, 그날은 선약이 있어요。"}},{"text":"다음에 같이 가요","reading":"daeume gachi gayo","zh":"下次一起去吧","topic":"邀約出遊","example":"","example_zh":"","note":"다음에＝下次；語氣友善，婉拒或道別時都好用。","level":"TOPIK1","casual":{"text":"다음에 같이 가자","reading":"daeume gachi gaja","note":"반말勸誘形-자；婉拒後補這句可以保住約下次的溫度。熟人間用。"}},{"text":"제가 데리러 갈게요","reading":"jega derireo galgeyo","zh":"我去接你","topic":"邀約出遊","example":"","example_zh":"","note":"-(으)러 가다表示去做某事；-(으)ㄹ게요表示自己的承諾，體貼度滿分。","level":"TOPIK1","casual":{"text":"내가 데리러 갈게","reading":"naega derireo galge","note":"반말；제가→내가是敬語轉半語的關鍵替換。朋友、情侶間的體貼句。"}},{"text":"몇 시에 만날까요?","reading":"myeot sie mannalkkayo?","zh":"幾點見面好呢？","topic":"邀約出遊","example":"몇 시에 만날까요? 두 시 어때요?","example_zh":"幾點見面好呢？兩點如何？","note":"時間的「點」用固有數字：한 시、두 시、세 시。","level":"TOPIK1","casual":{"text":"몇 시에 볼까?","reading":"myeot sie bolkka?","note":"반말；同樣用보다取代만나다。訊息裡常再縮成「몇 시?」兩個字解決。"}},{"text":"늦지 마세요","reading":"neutji maseyo","zh":"別遲到喔","topic":"邀約出遊","example":"","example_zh":"","note":"-지 마세요＝請不要…；朋友間可開玩笑地說늦지 마!。","level":"TOPIK1","casual":{"text":"늦지 마!","reading":"neutji ma!","note":"반말命令形，只對熟朋友半開玩笑用；對長輩或不熟的人說늦지 마세요，語氣也要放軟。"}},{"text":"오늘 정말 즐거웠어요","reading":"oneul jeongmal jeulgeowosseoyo","zh":"今天真的很開心","topic":"邀約出遊","example":"오늘 정말 즐거웠어요. 다음에 또 만나요.","example_zh":"今天真的很開心，下次再約。","note":"約會、聚會結束後的完美收尾句，通常會再傳一次訊息表達，這是韓國的社交禮貌。","level":"TOPIK1","casual":{"text":"오늘 진짜 재밌었어","reading":"oneul jinjja jaemisseosseo","note":"口語幾乎不用즐겁다這種書面詞，都說재밌다；정말也多換成진짜。반말，熟人聚會後傳訊息用。"}},{"text":"밥 먹었어요?","reading":"bap meogeosseoyo?","zh":"你吃飯了嗎？","topic":"吃飯聊天","example":"밥 먹었어요? 아직이면 같이 먹어요.","example_zh":"你吃飯了嗎？還沒的話一起吃吧。","note":"韓國人的國民問候語，其實是關心不是真的問；就像台灣人說「呷飽未」。","level":"TOPIK1","casual":{"text":"밥 먹었어?","reading":"bap meogeosseo?","note":"반말國民問候；訊息裡還會縮成「밥은?」兩個字。對長輩要說식사하셨어요?。"}},{"text":"배고파요","reading":"baegopayo","zh":"我餓了","topic":"吃飯聊天","example":"배고파요. 밥 먹으러 가요.","example_zh":"我餓了，去吃飯吧。","note":"반말是배고파；相反是배불러요（我吃飽了）。","level":"TOPIK1","casual":{"text":"배고파 죽겠어","reading":"baegopa jukgesseo","note":"-아/어 죽겠다＝「…得要死」，口語誇張法的代表；반말，熟人間抱怨用，正式場合別說죽겠다。"}},{"text":"뭐 먹고 싶어요?","reading":"mwo meokgo sipeoyo?","zh":"你想吃什麼？","topic":"吃飯聊天","example":"","example_zh":"","note":"-고 싶어요表示想做某事；韓國人常回아무거나（隨便都行），這時就換你提議吧。","level":"TOPIK1","casual":{"text":"뭐 먹을래?","reading":"mwo meogeullae?","note":"반말；-을래?問對方意願比먹고 싶어?更常用。對方回아무거나（隨便）時就換你提議。"}},{"text":"저는 매운 음식을 좋아해요","reading":"jeoneun maeun eumsigeul joahaeyo","zh":"我喜歡吃辣的","topic":"吃飯聊天","example":"","example_zh":"","note":"매운 음식＝辣的食物；韓國的辣和台灣不同，是又辣又甜的辣，敢吃辣會被稱讚。","level":"TOPIK1","casual":{"text":"나 매운 거 좋아해","reading":"na maeun geo joahae","note":"반말；口語用매운 거（辣的東西）不說매운 음식，음식聽起來像營養師在講話。熟人間用。"}},{"text":"매운 거 잘 못 먹어요","reading":"maeun geo jal mot meogeoyo","zh":"我不太能吃辣","topic":"吃飯聊天","example":"매운 거 잘 못 먹어요. 덜 맵게 해 주세요.","example_zh":"我不太能吃辣，請做得不要太辣。","note":"잘 못＋動詞＝不太會…；點餐時說덜 맵게（辣度減量）很實用。","level":"TOPIK1","casual":{"text":"나 맵찔이야","reading":"na maepjjiriya","note":"맵찔이＝맵다＋찌질이，「不能吃辣的俗辣」，年輕人自嘲流行語；熟人間玩笑用，對長輩或正式場合說매운 거 잘 못 먹어요。"}},{"text":"이거 진짜 맛있어요","reading":"igeo jinjja masisseoyo","zh":"這個真的好吃","topic":"吃飯聊天","example":"","example_zh":"","note":"진짜＝真的（口語）；更誇張可以說대박 맛있어요（好吃到不行）。","level":"TOPIK1","casual":{"text":"이거 완전 꿀맛이야","reading":"igeo wanjeon kkulmasiya","note":"꿀맛（蜂蜜般的味道）＝超好吃，口語高頻又安全的稱讚；年輕人也說개맛있다、존맛탱（JMT），但那些帶粗俗語感，對長輩或職場說等於講髒話，聽得懂就好、別跟著用。"}},{"text":"맛있게 드세요","reading":"masitge deuseyo","zh":"請慢用","topic":"吃飯聊天","example":"","example_zh":"","note":"드시다是먹다的敬語；開動前對方說這句，回네, 잘 먹겠습니다就對了。","level":"TOPIK1","casual":{"text":"맛있게 먹어","reading":"masitge meogeo","note":"반말，對朋友或晚輩說；드세요是敬語드시다，對長輩絕不能換成먹어。"}},{"text":"잘 먹겠습니다","reading":"jal meokgetseumnida","zh":"我開動了","topic":"吃飯聊天","example":"","example_zh":"","note":"飯前固定用語，字面是「我會好好地吃」，被請客時說更是必備禮貌。","level":"TOPIK1","casual":{"text":"잘 먹을게","reading":"jal meogeulge","note":"반말，朋友請客時用；正式聚餐或對長輩仍用잘 먹겠습니다，這句禮貌不能省。"}},{"text":"잘 먹었습니다","reading":"jal meogeotseumnida","zh":"我吃飽了／謝謝招待","topic":"吃飯聊天","example":"","example_zh":"","note":"飯後固定用語；和잘 먹겠습니다（飯前）是一組，時態不同別搞混。","level":"TOPIK1","casual":{"text":"잘 먹었어","reading":"jal meogeosseo","note":"반말，跟朋友吃完飯說；常搭配아 배불러（好撐）。對請客的長輩一定說잘 먹었습니다。"}},{"text":"건배!","reading":"geonbae!","zh":"乾杯！","topic":"吃飯聊天","example":"자, 건배해요!","example_zh":"來，乾杯！","note":"和長輩喝酒時要雙手拿杯、側身喝，這是重要的韓國酒桌禮儀。","level":"TOPIK1","casual":{"text":"짠!","reading":"jjan!","note":"碰杯時的擬聲詞，朋友喝酒場合比건배更常聽到；正式宴席、對長輩帶頭敬酒仍用건배하겠습니다。"}},{"text":"제가 살게요","reading":"jega salgeyo","zh":"我請客","topic":"吃飯聊天","example":"오늘은 제가 살게요.","example_zh":"今天我請客。","note":"사다在這裡是「請客」；韓國常由年長者或先提議的人買單，比較少各付各的。","level":"TOPIK1","casual":{"text":"내가 쏠게","reading":"naega ssolge","note":"쏘다（開槍→豪爽請客）是口語流行說法，「今天我開槍請客！」的氣勢；熟人間用，正式場合說제가 사겠습니다。"}},{"text":"다음에는 제가 살게요","reading":"daeumeneun jega salgeyo","zh":"下次換我請","topic":"吃飯聊天","example":"","example_zh":"","note":"被請客後這樣回，表示想繼續來往，是維持友誼的漂亮話。","level":"TOPIK1","casual":{"text":"다음엔 내가 살게","reading":"daeumen naega salge","note":"반말；다음에는縮成다음엔是口語常態。被朋友請客後回這句，友誼長存。"}},{"text":"뭐 마실래요?","reading":"mwo masillaeyo?","zh":"你要喝什麼？","topic":"吃飯聊天","example":"","example_zh":"","note":"마시다＝喝；在咖啡廳幫朋友點餐時的常用句。","level":"TOPIK1","casual":{"text":"뭐 마실래?","reading":"mwo masillae?","note":"반말；咖啡廳幫朋友點單用。對長輩要說뭐 드시겠어요?（드시다敬語）。"}},{"text":"한국 음식을 좋아해요","reading":"hanguk eumsigeul joahaeyo","zh":"我喜歡韓國菜","topic":"吃飯聊天","example":"한국 음식을 좋아해요. 특히 삼겹살이요.","example_zh":"我喜歡韓國菜，特別是烤五花肉。","note":"說出具體菜名（떡볶이、김치찌개、삼겹살）會讓話題更熱絡。","level":"TOPIK1","casual":{"text":"나 한식 좋아해","reading":"na hansik joahae","note":"口語說한식（韓食）比한국 음식簡潔；반말，熟人聊天用。中式是중식、日式是일식，一起記。"}},{"text":"치맥 먹으러 갈래요?","reading":"chimaek meogeureo gallaeyo?","zh":"要去吃炸雞配啤酒嗎？","topic":"吃飯聊天","example":"","example_zh":"","note":"치맥＝치킨（炸雞）＋맥주（啤酒），韓國的國民組合；-(으)러 가다＝去做某事。","level":"TOPIK1","casual":{"text":"치맥 갈래?","reading":"chimaek gallae?","note":"반말；連먹으러都省掉，치맥本身就是行程。訊息裡打「치맥 ㄱㄱ」更年輕人。熟人限定。"}},{"text":"한국어 잘하시네요","reading":"hangugeo jalhasineyo","zh":"你韓語說得真好","topic":"稱讚回應","example":"","example_zh":"","note":"韓國人對外國人說韓語幾乎必給這句鼓勵；-시-是敬語，對朋友說잘하네요即可。","level":"TOPIK1","casual":{"text":"한국어 잘하네","reading":"hangugeo jalhane","note":"반말，只能對同齡朋友或晚輩說；-시-拿掉就沒有敬意了，對長輩或初次見面的人務必保留잘하시네요。"}},{"text":"아니에요, 아직 멀었어요","reading":"anieyo, ajik meoreosseoyo","zh":"沒有啦，還差得遠","topic":"稱讚回應","example":"","example_zh":"","note":"韓國文化重視謙虛，被稱讚時先謙虛再道謝最得體；아직 멀었어요字面是「還很遠」。","level":"TOPIK1","casual":{"text":"아니야, 아직 멀었어","reading":"aniya, ajik meoreosseo","note":"반말謙虛回應；朋友間被稱讚也可以裝哭說아직 멀었어 ㅠㅠ。對長輩用아니에요版本。"}},{"text":"정말 대단해요","reading":"jeongmal daedanhaeyo","zh":"真的很厲害","topic":"稱讚回應","example":"혼자 다 했어요? 정말 대단해요!","example_zh":"你自己全部完成？真的很厲害！","note":"대단하다＝了不起；반말是대단해。","level":"TOPIK1","casual":{"text":"진짜 대단해","reading":"jinjja daedanhae","note":"반말；年輕人還會說쩐다/쩔어（屌爆了），但那是俚語，對長輩、職場都不能用。"}},{"text":"오늘 옷이 예뻐요","reading":"oneul osi yeppeoyo","zh":"你今天的衣服好漂亮","topic":"稱讚回應","example":"","example_zh":"","note":"예쁘다多用於物品或女生；稱讚男生帥用멋있어요。","level":"TOPIK1","casual":{"text":"오늘 옷 예쁘다!","reading":"oneul ot yeppeuda!","note":"形容詞原形-다當感嘆用（예쁘다!＝好漂亮啊！）是口語的自然讚嘆法；반말語感，熟人間用。"}},{"text":"감사합니다","reading":"gamsahamnida","zh":"謝謝（正式）","topic":"稱讚回應","example":"","example_zh":"","note":"最安全的道謝，任何場合都不失禮；更輕鬆的說法是고마워요。","level":"TOPIK1","casual":{"text":"고마워","reading":"gomawo","note":"반말道謝，熟朋友限定；訊息裡年輕人打「ㄱㅅ」（감사縮寫）。對長輩、店員、職場一律감사합니다。"}},{"text":"고마워요","reading":"gomawoyo","zh":"謝謝（해요體）","topic":"稱讚回應","example":"도와줘서 고마워요.","example_zh":"謝謝你幫我。","note":"朋友間的自然道謝；반말是고마워，正式場合用감사합니다。","level":"TOPIK1","casual":{"text":"땡큐","reading":"ttaengkyu","note":"韓式英語thank you，朋友間輕鬆道謝，訊息也打땡큐~；帶玩笑感，對長輩或正式場合失禮。"}},{"text":"천만에요","reading":"cheonmaneyo","zh":"不客氣","topic":"稱讚回應","example":"","example_zh":"","note":"教科書標準說法，實際口語更常聽到아니에요（沒什麼）。","level":"TOPIK1","casual":{"text":"아니야, 뭘","reading":"aniya, mwol","note":"母語者幾乎不說천만에요，朋友道謝時回아니야~或뭘~（這算什麼）最自然；對長輩回아니에요。"}},{"text":"과찬이세요","reading":"gwachaniseyo","zh":"您過獎了","topic":"稱讚回應","example":"","example_zh":"","note":"有點正式的謙虛回應，用在長輩或客套場合，朋友間說아니에요就好。","level":"TOPIK2"},{"text":"멋있어요","reading":"meosisseoyo","zh":"好帥／好棒","topic":"稱讚回應","example":"오늘 진짜 멋있어요!","example_zh":"你今天真的好帥！","note":"稱讚外表或表現都行；口語常說멋져요，반말是멋있어。","level":"TOPIK1","casual":{"text":"멋지다!","reading":"meotjida!","note":"感嘆형原形-다；朋友間讚嘆用，也常說멋져!。對長輩說멋지세요/멋있으세요加敬語。"}},{"text":"귀여워요","reading":"gwiyeowoyo","zh":"好可愛","topic":"稱讚回應","example":"","example_zh":"","note":"韓國人也常用귀엽다形容行為可愛；對不熟的異性使用要注意分寸。","level":"TOPIK1","casual":{"text":"귀엽다!","reading":"gwiyeopda!","note":"感嘆形，看到可愛事物脫口而出；반말語感，熟人間用。對不熟異性說要注意分寸，跟原句相同。"}},{"text":"목소리가 좋네요","reading":"moksoriga jonneyo","zh":"你的聲音真好聽","topic":"稱讚回應","example":"","example_zh":"","note":"-네요表示當下的感嘆；具體的稱讚比籠統的更讓人開心。","level":"TOPIK1"},{"text":"센스가 있으시네요","reading":"senseuga isseusineyo","zh":"你很有品味／很機靈","topic":"稱讚回應","example":"","example_zh":"","note":"센스（sense）是韓式外來語，指眼光好、反應快，送禮或穿搭被稱讚센스是高評價。","level":"TOPIK2","casual":{"text":"센스 있네!","reading":"senseu inne!","note":"반말；-시-去掉就是對平輩晚輩版。同事間評穿搭、禮物很好用；對長輩保留있으시네요。"}},{"text":"덕분이에요","reading":"deokbunieyo","zh":"託你的福","topic":"稱讚回應","example":"다 덕분이에요. 고마워요.","example_zh":"都是託你的福，謝謝。","note":"把功勞歸給對方的謙虛說法；덕분에＋句子＝多虧了…。","level":"TOPIK1","casual":{"text":"다 네 덕이야","reading":"da ne deogiya","note":"반말；네（你的）口語唸成니[ni]以免和내（我的）搞混。熟朋友間把功勞歸給對方的暖心話。"}},{"text":"별말씀을요","reading":"byeolmalsseumeullyo","zh":"哪裡的話","topic":"稱讚回應","example":"","example_zh":"","note":"對長輩的道謝或稱讚謙虛回應時用，禮貌度高。","level":"TOPIK2"},{"text":"힘내세요","reading":"himnaeseyo","zh":"加油","topic":"稱讚回應","example":"시험 잘 볼 거예요. 힘내세요!","example_zh":"考試一定會順利的，加油！","note":"힘＝力量、내다＝拿出；安慰朋友時搭配파이팅!（fighting）更有活力，반말是힘내。","level":"TOPIK1","casual":{"text":"힘내! 파이팅!","reading":"himnae! paiting!","note":"반말打氣組合，朋友考試、面試前必說；파이팅也常寫成화이팅。對長輩說힘내세요，파이팅對長輩用要斟酌場合。"}},{"text":"오늘 날씨가 좋네요","reading":"oneul nalssiga jonneyo","zh":"今天天氣真好","topic":"日常閒聊","example":"","example_zh":"","note":"天氣是萬用開場白；-네요讓語氣聽起來像自然的感嘆而不是報告。","level":"TOPIK1","casual":{"text":"오늘 날씨 좋다!","reading":"oneul nalssi jota!","note":"感嘆形-다＋省助詞가，自言自語或跟朋友說都行；반말語感，對長輩用좋네요。"}},{"text":"요즘 어떻게 지내요?","reading":"yojeum eotteoke jinaeyo?","zh":"最近過得怎麼樣？","topic":"日常閒聊","example":"","example_zh":"","note":"요즘＝最近；比잘 지냈어요?更日常，適合常見面的朋友。","level":"TOPIK1","casual":{"text":"요즘 뭐 하고 지내?","reading":"yojeum mwo hago jinae?","note":"반말；比어떻게 지내?更具體、更好接話的問法。熟朋友久違聯絡的開場白。"}},{"text":"바빠요?","reading":"bappayo?","zh":"你忙嗎？","topic":"日常閒聊","example":"요즘 많이 바빠요?","example_zh":"最近很忙嗎？","note":"傳訊息開頭的體貼問法；반말是바빠?。","level":"TOPIK1","casual":{"text":"바빠?","reading":"bappa?","note":"반말；訊息開場的體貼句，常寫成「바쁘냐?」帶玩笑感。對長輩用바쁘세요?。"}},{"text":"요즘 좀 바빠요","reading":"yojeum jom bappayo","zh":"最近有點忙","topic":"日常閒聊","example":"","example_zh":"","note":"좀＝조금（一點）的縮寫，口語超常用。","level":"TOPIK1"},{"text":"피곤해요","reading":"pigonhaeyo","zh":"我好累","topic":"日常閒聊","example":"어제 잠을 못 자서 피곤해요.","example_zh":"昨天沒睡好，好累。","note":"반말是피곤해；韓國人聊天超常說피곤하다，很有共鳴的一句。","level":"TOPIK1","casual":{"text":"피곤해 죽겠어","reading":"pigonhae jukgesseo","note":"죽겠어誇張法，上班族學生的每日名言；반말，熟人間抱怨用，對長輩說피곤하네요就好。"}},{"text":"오늘 뭐 했어요?","reading":"oneul mwo haesseoyo?","zh":"你今天做了什麼？","topic":"日常閒聊","example":"","example_zh":"","note":"했어요是하다的過去式；朋友間閒聊、訊息裡都常用。","level":"TOPIK1","casual":{"text":"오늘 뭐 했어?","reading":"oneul mwo haesseo?","note":"반말；情侶、好友每日訊息的固定句。對長輩加요並用敬語오늘 뭐 하셨어요?。"}},{"text":"비가 와요","reading":"biga wayo","zh":"下雨了","topic":"日常閒聊","example":"비가 와요. 우산 있어요?","example_zh":"下雨了，你有傘嗎？","note":"韓文的下雨是「雨來了」（비가 오다）；下雨天韓國人習慣吃부침개（煎餅）配막걸리（小米酒）。","level":"TOPIK1","casual":{"text":"비 온다","reading":"bi onda","note":"動詞-ㄴ다當感嘆（下雨了耶！）是半語的自然感嘆法；看窗外自言自語或跟熟人說。對長輩說비 오네요。"}},{"text":"날씨가 너무 더워요","reading":"nalssiga neomu deowoyo","zh":"天氣好熱","topic":"日常閒聊","example":"","example_zh":"","note":"너무＝太、非常；台灣的濕熱天氣正好可以拿來聊。","level":"TOPIK1","casual":{"text":"더워 죽겠어","reading":"deowo jukgesseo","note":"죽겠다誇張法；夏天的國民台詞。반말，熟人間用；跟長輩聊天氣說너무 덥네요。"}},{"text":"날씨가 추워요","reading":"nalssiga chuwoyo","zh":"天氣好冷","topic":"日常閒聊","example":"","example_zh":"","note":"韓國冬天可到零下十幾度，跟韓國朋友聊台灣「濕冷」的體感差異很有趣。","level":"TOPIK1"},{"text":"그래요?","reading":"geuraeyo?","zh":"是喔？／這樣啊？","topic":"日常閒聊","example":"","example_zh":"","note":"萬用附和語，表示有在聽；語調上揚是疑問，下降是理解。반말是그래?。","level":"TOPIK1","casual":{"text":"그래?","reading":"geurae?","note":"반말附和，聊天潤滑劑；語調上揚是「是喔？」、拉長下降是「這樣啊~」。對長輩維持그래요?或아, 네~。"}},{"text":"맞아요","reading":"majayo","zh":"沒錯","topic":"日常閒聊","example":"맞아요, 저도 그렇게 생각해요.","example_zh":"沒錯，我也這麼想。","note":"表示同意的高頻附和語；반말是맞아。","level":"TOPIK1","casual":{"text":"맞아 맞아","reading":"maja maja","note":"口語愛疊字：맞아 맞아（對對對）比單說맞아更有共鳴感；반말，熟人間用，對長輩說맞아요。"}},{"text":"진짜요?","reading":"jinjjayo?","zh":"真的嗎？","topic":"日常閒聊","example":"","example_zh":"","note":"口語比정말요?更常用；반말是진짜?，聊天時的必備反應詞。","level":"TOPIK1","casual":{"text":"진짜?","reading":"jinjja?","note":"반말反應詞天王；訊息裡年輕人也打「ㄹㅇ?」（리얼，真假？）。對長輩保留진짜요?或정말요?。"}},{"text":"저도요","reading":"jeodoyo","zh":"我也是","topic":"日常閒聊","example":"","example_zh":"","note":"도＝也；반말是나도，找到共同點時馬上接這句。","level":"TOPIK1","casual":{"text":"나도","reading":"nado","note":"반말；저도요→나도，找到共同點時秒接。激動時疊字說나도 나도!。對長輩用저도요。"}},{"text":"무슨 일 있어요?","reading":"museun il isseoyo?","zh":"發生什麼事了嗎？","topic":"日常閒聊","example":"표정이 안 좋네요. 무슨 일 있어요?","example_zh":"你臉色不太好，發生什麼事了嗎？","note":"關心朋友的溫暖問句；무슨 일＝什麼事。","level":"TOPIK1","casual":{"text":"무슨 일 있어?","reading":"museun il isseo?","note":"반말關心句；看朋友臉色不對時用，也常說왜 그래?（怎麼了？）。對長輩加요並放軟語氣。"}},{"text":"걱정하지 마세요","reading":"geokjeonghaji maseyo","zh":"別擔心","topic":"日常閒聊","example":"","example_zh":"","note":"-지 마세요＝請不要…；반말是걱정하지 마或걱정 마。","level":"TOPIK1","casual":{"text":"걱정 마","reading":"geokjeong ma","note":"반말；口語連하지都省，걱정 마兩個詞收尾。安慰熟朋友用，對長輩說걱정하지 마세요。"}},{"text":"카톡 해요","reading":"katok haeyo","zh":"用KakaoTalk聊吧","topic":"網路聊天用語","example":"이따가 카톡 해요.","example_zh":"待會用KakaoTalk聊。","note":"카톡＝카카오톡（KakaoTalk）縮寫，韓國人幾乎人人都用，地位等於台灣的LINE。","level":"TOPIK1","casual":{"text":"톡해","reading":"tokae","note":"카톡再縮成톡，「톡해~」（傳訊息給我）是年輕人道別時的高頻句；반말，熟人限定。"}},{"text":"카톡 아이디 알려 주세요","reading":"katok aidi allyeo juseyo","zh":"請告訴我你的KakaoTalk ID","topic":"網路聊天用語","example":"","example_zh":"","note":"알려 주세요＝請告訴我；交換카톡是韓國交朋友的標準流程。","level":"TOPIK1","casual":{"text":"카톡 아이디 뭐야?","reading":"katok aidi mwoya?","note":"반말直球問法，同齡新朋友間常用；對長輩或商務場合仍用알려 주세요/알려 주시겠어요?。"}},{"text":"ㅋㅋㅋ","reading":"kekeke","zh":"哈哈哈（韓式笑聲）","topic":"網路聊天用語","example":"진짜 웃겨요 ㅋㅋㅋ","example_zh":"真的好好笑 ㅋㅋㅋ","note":"模擬크크笑聲的子音ㅋ，等於台灣的「哈哈哈」；只打一個ㅋ可能顯得敷衍，多打幾個比較熱情。","level":"TOPIK1"},{"text":"ㅎㅎ","reading":"hehe","zh":"呵呵（微笑）","topic":"網路聊天用語","example":"","example_zh":"","note":"比ㅋㅋ溫和收斂的笑，語氣友善；對長輩傳訊息用ㅎㅎ比ㅋㅋ安全。","level":"TOPIK1"},{"text":"ㅠㅠ","reading":"yuyu","zh":"嗚嗚（哭哭表情）","topic":"網路聊天用語","example":"시험 망했어요 ㅠㅠ","example_zh":"考試考砸了 ㅠㅠ","note":"母音ㅠ長得像流淚的眼睛；也寫成ㅜㅜ，表達難過、撒嬌都可以。","level":"TOPIK1"},{"text":"대박","reading":"daebak","zh":"太讚了／不得了","topic":"網路聊天用語","example":"대박! 진짜예요?","example_zh":"太扯了！真的假的？","note":"驚訝、讚嘆都能用的萬能流行語，正負面情境皆可；朋友間口語，正式場合別用。","level":"TOPIK1"},{"text":"헐","reading":"heol","zh":"傻眼／天啊","topic":"網路聊天用語","example":"","example_zh":"","note":"表示震驚或無言的感嘆詞，類似台灣的「傻眼」；屬於年輕人口語。","level":"TOPIK1"},{"text":"인스타 해요?","reading":"inseuta haeyo?","zh":"你有玩Instagram嗎？","topic":"網路聊天用語","example":"인스타 해요? 맞팔해요!","example_zh":"你有玩IG嗎？互追吧！","note":"인스타＝인스타그램縮寫；맞팔＝互相追蹤，交換IG是年輕人交友定番。","level":"TOPIK1","casual":{"text":"인스타 있어?","reading":"inseuta isseo?","note":"반말；問「你有IG嗎」用있어?比해?更常見，接著說맞팔하자（互追吧）。年輕人交友定番。"}},{"text":"팔로우할게요","reading":"pallouhalgeyo","zh":"我會追蹤你","topic":"網路聊天用語","example":"","example_zh":"","note":"팔로우＝follow的韓式外來語；-(으)ㄹ게요表示自己主動要做的事。","level":"TOPIK1","casual":{"text":"맞팔하자","reading":"matpalhaja","note":"맞팔＝맞팔로우（互相追蹤）縮寫＋반말勸誘-자；年輕人網路交友用語，對長輩或商業帳號說팔로우할게요。"}},{"text":"셀카","reading":"selka","zh":"自拍","topic":"網路聊天用語","example":"같이 셀카 찍어요!","example_zh":"一起自拍吧！","note":"셀카＝셀프 카메라縮寫；合照則說같이 사진 찍어요。","level":"TOPIK1"},{"text":"답장 늦어서 미안해요","reading":"dapjang neujeoseo mianhaeyo","zh":"抱歉回覆晚了","topic":"網路聊天用語","example":"","example_zh":"","note":"답장＝回訊；-아/어서表示原因；韓國人回訊速度快，晚回補這句很加分。","level":"TOPIK1","casual":{"text":"답 늦어서 미안 ㅠㅠ","reading":"dap neujeoseo mian","note":"반말；답장縮成답、미안해요縮成미안，加ㅠㅠ軟化語氣是訊息文化的標配。對長輩用답장이 늦어 죄송합니다。"}},{"text":"이모티콘","reading":"imotikon","zh":"貼圖／表情符號","topic":"網路聊天用語","example":"이 이모티콘 너무 귀여워요.","example_zh":"這個貼圖太可愛了。","note":"KakaoTalk的貼圖文化和LINE類似，送朋友이모티콘是小小的心意。","level":"TOPIK1"},{"text":"단톡방","reading":"dantokbang","zh":"群組聊天室","topic":"網路聊天用語","example":"","example_zh":"","note":"단체 카카오톡 방（團體聊天房）的縮寫，等於LINE群組。","level":"TOPIK1"},{"text":"읽씹","reading":"ikssip","zh":"已讀不回","topic":"網路聊天用語","example":"읽씹하지 마세요 ㅠㅠ","example_zh":"不要已讀不回啦 ㅠㅠ","note":"읽다（讀）＋씹다（嚼／無視）的合成流行語；年輕人俚語，只在熟人間開玩笑用。","level":"TOPIK1"},{"text":"최애","reading":"choeae","zh":"本命／最愛","topic":"網路聊天用語","example":"최애가 누구예요?","example_zh":"你的本命是誰？","note":"최애＝最愛，追星族指最喜歡的成員；聊K-POP時的關鍵單字。","level":"TOPIK1"},{"text":"하나, 둘, 셋","reading":"hana, dul, set","zh":"一、二、三（固有數字）","topic":"數字時間","example":"하나, 둘, 셋! 찍을게요.","example_zh":"一、二、三！要拍囉。","note":"固有數字用於數個數、年齡、點鐘；拍照倒數也用它。","level":"TOPIK1"},{"text":"일, 이, 삼","reading":"il, i, sam","zh":"一、二、三（漢字數字）","topic":"數字時間","example":"","example_zh":"","note":"漢字數字用於日期、金額、電話號碼、分鐘；發音和台語有點像，台灣人好記。","level":"TOPIK1"},{"text":"지금 몇 시예요?","reading":"jigeum myeot siyeyo?","zh":"現在幾點？","topic":"數字時間","example":"","example_zh":"","note":"몇＝幾；「點」用固有數字、「分」用漢字數字，是初學最容易搞混的地方。","level":"TOPIK1"},{"text":"세 시 반이에요","reading":"se si banieyo","zh":"三點半","topic":"數字時間","example":"","example_zh":"","note":"반＝半；셋在시前要變成세（셋→세 시）。","level":"TOPIK1"},{"text":"오늘 며칠이에요?","reading":"oneul myeochirieyo?","zh":"今天幾號？","topic":"數字時間","example":"","example_zh":"","note":"며칠＝幾號，注意不寫成몇일；日期用漢字數字。","level":"TOPIK1"},{"text":"칠월 십오일이에요","reading":"chirwol siboirieyo","zh":"是七月十五日","topic":"數字時間","example":"","example_zh":"","note":"月份用漢字數字＋월；注意六月是유월、十月是시월，發音特殊。","level":"TOPIK1"},{"text":"무슨 요일이에요?","reading":"museun yoirieyo?","zh":"今天星期幾？","topic":"數字時間","example":"","example_zh":"","note":"요일＝星期；월화수목금토일分別對應星期一到日，跟日文的曜日同源。","level":"TOPIK1"},{"text":"금요일이에요","reading":"geumyoirieyo","zh":"是星期五","topic":"數字時間","example":"불금이에요!","example_zh":"是火熱星期五（週五夜）！","note":"불금＝불타는 금요일（燃燒的星期五），類似「週五夜狂歡」的流行語。","level":"TOPIK1"},{"text":"생일이 언제예요?","reading":"saengiri eonjeyeyo?","zh":"你生日是什麼時候？","topic":"數字時間","example":"","example_zh":"","note":"韓國人生日早上喝미역국（海帶湯）；記住朋友生日傳祝福訊息很重要。","level":"TOPIK1"},{"text":"전화번호가 뭐예요?","reading":"jeonhwabeonhoga mwoyeyo?","zh":"你的電話號碼是多少？","topic":"數字時間","example":"","example_zh":"","note":"號碼用漢字數字唸；0唸공，例如010是공일공。","level":"TOPIK1"},{"text":"얼마예요?","reading":"eolmayeyo?","zh":"多少錢？","topic":"數字時間","example":"이거 얼마예요?","example_zh":"這個多少錢？","note":"購物必備句；金額用漢字數字＋원（韓元）。","level":"TOPIK1"},{"text":"만 원이에요","reading":"man wonieyo","zh":"一萬韓元","topic":"數字時間","example":"","example_zh":"","note":"注意韓文的一萬直接說만，不說일만；一萬韓元約台幣兩百多元。","level":"TOPIK1"},{"text":"한 시간 후에 만나요","reading":"han sigan hue mannayo","zh":"一小時後見","topic":"數字時間","example":"","example_zh":"","note":"시간＝小時（時間長度）用固有數字；후에＝之後、전에＝之前。","level":"TOPIK1"},{"text":"십 분만 기다려 주세요","reading":"sip bunman gidaryeo juseyo","zh":"請等我十分鐘","topic":"數字時間","example":"","example_zh":"","note":"분（分鐘）用漢字數字；만＝只、僅僅，加上去語氣更客氣。","level":"TOPIK1"},{"text":"내일 오후 두 시 어때요?","reading":"naeil ohu du si eottaeyo?","zh":"明天下午兩點如何？","topic":"數字時間","example":"","example_zh":"","note":"오전＝上午、오후＝下午；둘在시前變成두（둘→두 시）。","level":"TOPIK1"},{"text":"도와주세요","reading":"dowajuseyo","zh":"請幫幫我","topic":"求助應急","example":"","example_zh":"","note":"緊急求助用；緊急程度高時可大喊도와주세요!，一般請求用下一句更客氣。","level":"TOPIK1","casual":{"text":"도와줘","reading":"dowajwo","note":"반말求助，熟朋友間用；訊息裡也常撒嬌式地打도와줘 ㅠㅠ。對陌生人、長輩求助一定用도와주세요。"}},{"text":"좀 도와주시겠어요?","reading":"jom dowajusigesseoyo?","zh":"可以幫我一下嗎？","topic":"求助應急","example":"","example_zh":"","note":"-아/어 주시겠어요?是非常客氣的請求句型；좀讓語氣更軟。","level":"TOPIK2","casual":{"text":"나 좀 도와줄래?","reading":"na jom dowajullae?","note":"반말請託；-아 줄래?問意願、좀軟化語氣。熟朋友間拜託小事用，對長輩用주시겠어요?敬語形。"}},{"text":"한국어를 잘 못해요","reading":"hangugeoreul jal motaeyo","zh":"我韓語說得不好","topic":"求助應急","example":"한국어를 잘 못해요. 영어로 해도 돼요?","example_zh":"我韓語不好，可以用英文嗎？","note":"遇到聽不懂時先說這句，對方通常會放慢或改用簡單的字。","level":"TOPIK1","casual":{"text":"나 한국어 잘 못해","reading":"na hangugeo jal motae","note":"반말；跟語言交換的同齡朋友先打預防針用。對初次見面或長輩仍用해요體。"}},{"text":"천천히 말해 주세요","reading":"cheoncheonhi malhae juseyo","zh":"請說慢一點","topic":"求助應急","example":"","example_zh":"","note":"천천히＝慢慢地；-아/어 주세요＝請幫我…，初學者保命句。","level":"TOPIK1","casual":{"text":"천천히 말해 줘","reading":"cheoncheonhi malhae jwo","note":"반말請求；-아 줘是-아 주세요的半語。只對熟朋友用，對老師、長輩保留주세요。"}},{"text":"다시 한번 말해 주세요","reading":"dasi hanbeon malhae juseyo","zh":"請再說一次","topic":"求助應急","example":"","example_zh":"","note":"다시＝再、한번＝一次；口語也常說네?（什麼？）請對方重複，但對長輩用這句更禮貌。","level":"TOPIK1","casual":{"text":"뭐라고?","reading":"mworago?","note":"口語沒聽清楚時最常說的其實是뭐라고?（你說什麼？）；반말，熟人限定。對長輩要說네?或다시 한번 말씀해 주세요，直接뭐라고?會被瞪。"}},{"text":"이게 무슨 뜻이에요?","reading":"ige museun tteusieyo?","zh":"這是什麼意思？","topic":"求助應急","example":"","example_zh":"","note":"뜻＝意思；學語言時常用，也可指著單字問이 단어 무슨 뜻이에요?。","level":"TOPIK1","casual":{"text":"이거 뭔 뜻이야?","reading":"igeo mwon tteusiya?","note":"반말；무슨口語縮成뭔。跟語伴請教單字時好用，對老師、長輩用무슨 뜻이에요?。"}},{"text":"화장실이 어디예요?","reading":"hwajangsiri eodiyeyo?","zh":"廁所在哪裡？","topic":"求助應急","example":"","example_zh":"","note":"어디예요?＝在哪裡？把화장실換成지하철역（地鐵站）、편의점（便利商店）就能通用。","level":"TOPIK1","casual":{"text":"화장실 어디야?","reading":"hwajangsil eodiya?","note":"반말，只對同行熟友用；問店員、路人一定要說화장실이 어디예요?，對陌生人用반말非常失禮。"}},{"text":"길을 잃었어요","reading":"gireul ireosseoyo","zh":"我迷路了","topic":"求助應急","example":"길을 잃었어요. 여기가 어디예요?","example_zh":"我迷路了，這裡是哪裡？","note":"잃다＝丟失；迷路時搭配手機地圖給對方看最有效。","level":"TOPIK1"},{"text":"지갑을 잃어버렸어요","reading":"jigabeul ireobeoryeosseoyo","zh":"我的錢包不見了","topic":"求助應急","example":"","example_zh":"","note":"잃어버리다＝弄丟；휴대폰（手機）、여권（護照）都能套進去，旅行必備。","level":"TOPIK2"},{"text":"여기가 어디예요?","reading":"yeogiga eodiyeyo?","zh":"這裡是哪裡？","topic":"求助應急","example":"","example_zh":"","note":"여기＝這裡、거기＝那裡（近對方）、저기＝那裡（都遠）。","level":"TOPIK1","casual":{"text":"여기 어디야?","reading":"yeogi eodiya?","note":"반말，跟朋友迷路時脫口而出的話；問路人時務必用어디예요?敬語形。"}},{"text":"영어 할 수 있어요?","reading":"yeongeo hal su isseoyo?","zh":"你會說英文嗎？","topic":"求助應急","example":"","example_zh":"","note":"-(으)ㄹ 수 있다＝能夠…；也可以問중국어 할 수 있어요?（你會說中文嗎？）。","level":"TOPIK1","casual":{"text":"영어 돼?","reading":"yeongeo dwae?","note":"口語用되다問「行不行」：영어 돼?（英文通嗎？）超簡潔；반말，熟人限定，對陌生人說영어 가능하세요?。"}},{"text":"몸이 안 좋아요","reading":"momi an joayo","zh":"我身體不舒服","topic":"求助應急","example":"오늘 몸이 안 좋아요. 먼저 갈게요.","example_zh":"我今天不太舒服，先走了。","note":"안＋形容詞＝否定；請假或提早離開時的常用理由。","level":"TOPIK1","casual":{"text":"나 컨디션 안 좋아","reading":"na keondisyeon an joa","note":"口語愛用외來語컨디션（condition）講身體狀態；반말，跟朋友請假、取消約會時用。對上司說몸이 안 좋습니다。"}},{"text":"병원에 가야 해요","reading":"byeongwone gaya haeyo","zh":"我需要去醫院","topic":"求助應急","example":"","example_zh":"","note":"-아/어야 해요＝必須…；韓國的약국（藥局）也能處理小病痛。","level":"TOPIK1","casual":{"text":"병원 가야 돼","reading":"byeongwon gaya dwae","note":"口語中-아야 하다幾乎都說成-아야 되다（가야 돼）；반말＋省助詞에。對長輩說가야 돼요/가야 합니다。"}},{"text":"경찰서가 어디예요?","reading":"gyeongchalseoga eodiyeyo?","zh":"警察局在哪裡？","topic":"求助應急","example":"","example_zh":"","note":"韓國報警電話是112、火警救護是119，和台灣的110／119不同，要記住。","level":"TOPIK1"},{"text":"잠깐만요","reading":"jamkkanmannyo","zh":"等一下／借過一下","topic":"求助應急","example":"","example_zh":"","note":"請對方稍等或在人群中借過都用這句；잠시만요意思相同、更正式一點。","level":"TOPIK1","casual":{"text":"잠깐만!","reading":"jamkkanman!","note":"반말，對朋友喊「等等！」；訊息裡縮成잠만（等一下下）。對陌生人、長輩要說잠깐만요/잠시만요。"}},{"text":"어디 가요?","reading":"eodi gayo?","zh":"你要去哪？（路上招呼）","topic":"打招呼","example":"어, 어디 가요? — 마트에 가요.","example_zh":"咦，你要去哪？——我要去超市。","note":"熟人路上碰到的招呼語，像台灣的「要去哪呀」，不一定要認真回答；가다→가요是最基本的해요體變化。","level":"TOPIK1"},{"text":"내일 봐요","reading":"naeil bwayo","zh":"明天見","topic":"打招呼","example":"먼저 갈게요. 내일 봐요!","example_zh":"我先走了，明天見！","note":"보다→봐요；道別高頻句，반말是내일 봐，也可換成이따 봐요（待會見）。","level":"TOPIK1"},{"text":"들어가세요","reading":"deureogaseyo","zh":"請回吧／請慢走","topic":"打招呼","example":"네, 그럼 들어가세요~","example_zh":"好，那您請回吧～","note":"字面是「請進去」，掛電話或道別時對對方說，意思是「回去吧、慢走」；電話結尾超常聽到。","level":"TOPIK1"},{"text":"조심히 가세요","reading":"josimhi gaseyo","zh":"路上小心","topic":"打招呼","example":"밤이 늦었어요. 조심히 가세요.","example_zh":"很晚了，路上小心。","note":"送別時體貼的一句；반말是조심히 가，也常說조심해서 가세요。","level":"TOPIK1"},{"text":"다녀오겠습니다","reading":"danyeoogetseumnida","zh":"我出門了","topic":"打招呼","example":"엄마, 다녀오겠습니다!","example_zh":"媽，我出門了！","note":"出門前對家人說的固定句；口語常說다녀올게요，跟日文的「行ってきます」用法一樣。","level":"TOPIK1"},{"text":"다녀왔어요","reading":"danyeowasseoyo","zh":"我回來了","topic":"打招呼","example":"다녀왔어요. 오늘 진짜 피곤해요.","example_zh":"我回來了，今天真的好累。","note":"回家時說的固定句，和다녀오겠습니다是一組；家人會回응, 왔어?（嗯，回來啦？）。","level":"TOPIK1"},{"text":"어서 와요","reading":"eoseo wayo","zh":"快進來／歡迎（對朋友）","topic":"打招呼","example":"어서 와요. 밖에 춥죠?","example_zh":"快進來，外面很冷吧？","note":"朋友來家裡時的歡迎語；어서 오세요是店家對客人，對朋友用어서 와요更自然，반말是어서 와。","level":"TOPIK1"},{"text":"주말 잘 보내세요","reading":"jumal jal bonaeseyo","zh":"週末愉快","topic":"打招呼","example":"그럼 주말 잘 보내세요!","example_zh":"那就祝你週末愉快！","note":"週五道別的定番句；보내다＝度過，回答可以說네, 주말 잘 보내요（好，你也週末愉快）。","level":"TOPIK1"},{"text":"가족이 몇 명이에요?","reading":"gajogi myeot myeongieyo?","zh":"你家有幾個人？","topic":"自我介紹","example":"가족이 몇 명이에요? — 네 명이에요.","example_zh":"你家有幾個人？——四個人。","note":"認識新朋友的常見話題；명是「名、人」的量詞，搭配固有數字（한 명、두 명）。","level":"TOPIK1"},{"text":"우리 가족은 네 명이에요","reading":"uri gajogeun ne myeongieyo","zh":"我家有四個人","topic":"自我介紹","example":"우리 가족은 네 명이에요. 부모님하고 언니가 있어요.","example_zh":"我家有四個人，有爸媽和姊姊。","note":"韓語習慣說우리 가족（我們家）而不是제 가족；넷在量詞前變成네（넷→네 명）。","level":"TOPIK1"},{"text":"아버지는 회사에 다니세요","reading":"abeojineun hoesae daniseyo","zh":"我爸爸在公司上班","topic":"自我介紹","example":"아버지는 회사에 다니세요. 어머니는 선생님이세요.","example_zh":"我爸爸在公司上班，媽媽是老師。","note":"다니다＝（固定往返）上班上學；注意韓語對自己的父母也要用敬語-세요，和中文習慣不同。","level":"TOPIK1"},{"text":"어머니는 요리를 잘하세요","reading":"eomeonineun yorireul jalhaseyo","zh":"我媽媽很會做菜","topic":"自我介紹","example":"어머니는 요리를 진짜 잘하세요.","example_zh":"我媽媽真的很會做菜。","note":"잘하다＝擅長；口語叫媽媽是엄마、爸爸是아빠，正式介紹用어머니、아버지。","level":"TOPIK1"},{"text":"형이 한 명 있어요","reading":"hyeongi han myeong isseoyo","zh":"我有一個哥哥（男生說）","topic":"自我介紹","example":"형이 한 명 있어요. 두 살 위예요.","example_zh":"我有一個哥哥，大我兩歲。","note":"韓語稱謂分說話者性別：男生的哥哥是형、女生的哥哥是오빠，搞錯會很好笑。","level":"TOPIK1"},{"text":"오빠","reading":"oppa","zh":"哥哥（女生稱呼）","topic":"自我介紹","example":"우리 오빠는 군인이에요.","example_zh":"我哥哥是軍人。","note":"女生叫親哥哥、年長男性朋友都用오빠；追星族叫偶像也是오빠，是韓劇高頻詞。","level":"TOPIK1"},{"text":"누나","reading":"nuna","zh":"姊姊（男生稱呼）","topic":"自我介紹","example":"누나가 서울에 살아요.","example_zh":"我姊姊住在首爾。","note":"男生叫姊姊或年長女性朋友用누나；女生叫姊姊則是언니。","level":"TOPIK1"},{"text":"언니","reading":"eonni","zh":"姊姊（女生稱呼）","topic":"自我介紹","example":"언니, 이거 어때요?","example_zh":"姊姊，這個怎麼樣？","note":"女生叫姊姊或年長女性朋友用언니；在服飾店、餐廳叫女店員也常用언니。","level":"TOPIK1"},{"text":"동생이 있어요?","reading":"dongsaengi isseoyo?","zh":"你有弟弟妹妹嗎？","topic":"自我介紹","example":"동생이 있어요? — 네, 여동생이 하나 있어요.","example_zh":"你有弟弟妹妹嗎？——有，我有一個妹妹。","note":"동생不分性別指弟妹；要區分時說남동생（弟弟）、여동생（妹妹）。","level":"TOPIK1"},{"text":"저는 외동이에요","reading":"jeoneun oedongieyo","zh":"我是獨生子女","topic":"自我介紹","example":"형제 있어요? — 아니요, 저는 외동이에요.","example_zh":"你有兄弟姊妹嗎？——沒有，我是獨生子女。","note":"외동＝獨生子女；問兄弟姊妹可以說형제가 어떻게 되세요?。","level":"TOPIK1"},{"text":"할아버지","reading":"harabeoji","zh":"爺爺","topic":"自我介紹","example":"할아버지는 올해 여든이세요.","example_zh":"爺爺今年八十歲。","note":"對長輩年齡用敬語이세요；路上稱呼不認識的老爺爺也可用할아버지。","level":"TOPIK1"},{"text":"할머니","reading":"halmeoni","zh":"奶奶","topic":"自我介紹","example":"주말에 할머니 집에 가요.","example_zh":"週末要去奶奶家。","note":"外公外婆前面加외：외할아버지、외할머니；口語常直接都叫할머니。","level":"TOPIK1"},{"text":"부모님과 같이 살아요","reading":"bumonimgwa gachi sarayo","zh":"我和父母住在一起","topic":"自我介紹","example":"저는 아직 부모님과 같이 살아요.","example_zh":"我還和父母住在一起。","note":"부모님＝父母（님表尊敬）；과/와＝和，前面有尾音用과、沒有用와。","level":"TOPIK1"},{"text":"혼자 살아요","reading":"honja sarayo","zh":"我一個人住","topic":"自我介紹","example":"저는 학교 근처에서 혼자 살아요.","example_zh":"我在學校附近一個人住。","note":"혼자＝獨自；獨居在韓國叫자취（자취해요），大學生聊天高頻詞。","level":"TOPIK1"},{"text":"강아지를 키워요","reading":"gangajireul kiwoyo","zh":"我養狗","topic":"自我介紹","example":"강아지를 한 마리 키워요. 사진 볼래요?","example_zh":"我養了一隻狗，要看照片嗎？","note":"키우다＝養；動物量詞用마리；貓是고양이，寵物話題是聊天神器。","level":"TOPIK1"},{"text":"남자 친구 있어요?","reading":"namja chingu isseoyo?","zh":"你有男朋友嗎？","topic":"自我介紹","example":"혹시 남자 친구 있어요?","example_zh":"請問你有男朋友嗎？","note":"남자 친구＝男友、여자 친구＝女友；一般男性友人會說남자 사람 친구（남사친）區分。","level":"TOPIK1"},{"text":"결혼했어요?","reading":"gyeolhonhaesseoyo?","zh":"你結婚了嗎？","topic":"自我介紹","example":"실례지만 결혼했어요? — 아니요, 아직 미혼이에요.","example_zh":"不好意思，你結婚了嗎？——沒有，還單身。","note":"韓國人初見面常問婚姻狀況，不算失禮；回答可用미혼（未婚）、기혼（已婚）。","level":"TOPIK1"},{"text":"대학교에 다녀요","reading":"daehakgyoe danyeoyo","zh":"我在上大學","topic":"自我介紹","example":"지금 대학교에 다녀요. 3학년이에요.","example_zh":"我現在在上大學，三年級。","note":"다니다用於固定往返的地方（學校、公司、補習班）；회사에 다녀요＝在上班。","level":"TOPIK1"},{"text":"아르바이트를 해요","reading":"areubaiteureul haeyo","zh":"我在打工","topic":"自我介紹","example":"카페에서 아르바이트를 해요.","example_zh":"我在咖啡廳打工。","note":"來自德語Arbeit的外來語，口語幾乎都縮成알바：알바해요。","level":"TOPIK1"},{"text":"가족 사진이에요","reading":"gajok sajinieyo","zh":"這是我的家庭照","topic":"自我介紹","example":"이거 우리 가족 사진이에요. 이쪽이 엄마예요.","example_zh":"這是我們的全家福，這位是我媽媽。","note":"拿手機照片介紹家人超實用；이쪽이＝這位（這邊）是介紹人的客氣說法。","level":"TOPIK1"},{"text":"아저씨","reading":"ajeossi","zh":"大叔","topic":"自我介紹","example":"아저씨, 여기 얼마예요?","example_zh":"大叔，這個多少錢？","note":"稱呼中年男性；對年輕一點的男性亂叫아저씨對方可能會受傷，要小心用。","level":"TOPIK1"},{"text":"아주머니","reading":"ajumeoni","zh":"大嬸／阿姨","topic":"自我介紹","example":"아주머니, 이거 좀 주세요.","example_zh":"阿姨，請給我這個。","note":"稱呼中年女性；餐廳裡更親切的叫法是이모（姨母），老闆娘聽了會開心。","level":"TOPIK1"},{"text":"노래방에 자주 가요","reading":"noraebange jaju gayo","zh":"我常去KTV","topic":"興趣嗜好","example":"스트레스 받으면 노래방에 자주 가요.","example_zh":"壓力大的時候我常去KTV。","note":"노래방＝KTV，韓國聚會的定番行程；一個人去唱叫혼코노，也是流行語。","level":"TOPIK1"},{"text":"노래 잘 불러요?","reading":"norae jal bulleoyo?","zh":"你唱歌好聽嗎？","topic":"興趣嗜好","example":"노래 잘 불러요? 같이 노래방 가요!","example_zh":"你唱歌好聽嗎？一起去KTV吧！","note":"부르다→불러요是르不規則變化；「唱歌」是노래를 부르다。","level":"TOPIK1"},{"text":"요즘 웹툰을 봐요","reading":"yojeum weptuneul bwayo","zh":"我最近在看網路漫畫","topic":"興趣嗜好","example":"요즘 웹툰을 봐요. 추천해 줄까요?","example_zh":"我最近在看網漫，要推薦給你嗎？","note":"웹툰（webtoon）是韓國的國民娛樂，很多韓劇都改編自웹툰，是很好的聊天話題。","level":"TOPIK1"},{"text":"유튜브를 자주 봐요","reading":"yutyubeureul jaju bwayo","zh":"我常看YouTube","topic":"興趣嗜好","example":"요즘 유튜브를 자주 봐요. 먹방 좋아해요.","example_zh":"我最近常看YouTube，喜歡看吃播。","note":"먹방（吃播）、브이로그（vlog）都是延伸話題；看유튜브學韓語也是好方法。","level":"TOPIK1"},{"text":"야구 보는 걸 좋아해요","reading":"yagu boneun geol joahaeyo","zh":"我喜歡看棒球","topic":"興趣嗜好","example":"야구 보는 걸 좋아해요. 대만도 야구가 인기 많아요.","example_zh":"我喜歡看棒球，台灣棒球也很紅。","note":"韓國職棒（KBO）應援文化超熱鬧；台韓都愛棒球，這個話題很容易聊起來。","level":"TOPIK1"},{"text":"요즘 기타를 배워요","reading":"yojeum gitareul baewoyo","zh":"我最近在學吉他","topic":"興趣嗜好","example":"요즘 기타를 배워요. 아직 잘 못 쳐요.","example_zh":"我最近在學吉他，還彈不太好。","note":"배우다→배워요；「彈」吉他鋼琴用치다（기타를 치다、피아노를 치다）。","level":"TOPIK1"},{"text":"그림 그리는 걸 좋아해요","reading":"geurim geurineun geol joahaeyo","zh":"我喜歡畫畫","topic":"興趣嗜好","example":"저는 그림 그리는 걸 좋아해요. 주로 카페에서 그려요.","example_zh":"我喜歡畫畫，通常在咖啡廳畫。","note":"「畫畫」是그림을 그리다，名詞動詞同源好記；그리다→그려요。","level":"TOPIK1"},{"text":"춤을 춰요","reading":"chumeul chwoyo","zh":"我跳舞","topic":"興趣嗜好","example":"취미로 케이팝 커버 댄스를 춰요.","example_zh":"我的興趣是跳K-POP翻跳。","note":"「跳舞」是춤을 추다（추다→춰요）；커버 댄스（cover dance）是韓流圈常用詞。","level":"TOPIK1"},{"text":"수영을 못해요","reading":"suyeongeul motaeyo","zh":"我不會游泳","topic":"興趣嗜好","example":"저는 수영을 못해요. 좀 가르쳐 주세요.","example_zh":"我不會游泳，教教我吧。","note":"못＝做不到（能力不足）、안＝不做（自己選擇），意思差很多別搞混。","level":"TOPIK1"},{"text":"콘서트에 가 봤어요?","reading":"konseoteue ga bwasseoyo?","zh":"你去過演唱會嗎？","topic":"興趣嗜好","example":"콘서트에 가 봤어요? — 네, 작년에 갔어요.","example_zh":"你去過演唱會嗎？——有，去年去的。","note":"-아/어 봤어요＝做過（經驗）；追星聊天必備句，回答可以接著說去過誰的演唱會。","level":"TOPIK1"},{"text":"산책을 좋아해요","reading":"sanchaegeul joahaeyo","zh":"我喜歡散步","topic":"興趣嗜好","example":"저녁에 공원에서 산책하는 걸 좋아해요.","example_zh":"我喜歡晚上在公園散步。","note":"산책하다＝散步；約會提議같이 산책할래요?（要一起散步嗎？）很自然。","level":"TOPIK1"},{"text":"쇼핑을 좋아해요","reading":"syopingeul joahaeyo","zh":"我喜歡逛街購物","topic":"興趣嗜好","example":"쇼핑을 좋아해요. 특히 옷 구경이요.","example_zh":"我喜歡逛街，特別是看衣服。","note":"구경＝逛、參觀；아이쇼핑（eye shopping）＝只逛不買，是韓式英語。","level":"TOPIK1"},{"text":"지금 가요","reading":"jigeum gayo","zh":"我現在過去","topic":"邀約出遊","example":"어디예요? — 지금 가요!","example_zh":"你在哪？——我現在過去！","note":"赴約傳訊高頻句；韓語常用現在式表達「馬上要做」，不用特別加未來式。","level":"TOPIK1"},{"text":"지금 가고 있어요","reading":"jigeum gago isseoyo","zh":"我在路上了","topic":"邀約出遊","example":"미안해요, 지금 가고 있어요. 조금만 기다려요.","example_zh":"抱歉，我在路上了，再等我一下。","note":"-고 있어요＝正在…；遲到時的保命句，搭配금방 도착해요（馬上到）使用。","level":"TOPIK1"},{"text":"거의 다 왔어요","reading":"geoui da wasseoyo","zh":"我快到了","topic":"邀約出遊","example":"거의 다 왔어요. 2분만요!","example_zh":"我快到了，再兩分鐘！","note":"거의＝幾乎、다＝全部；字面「幾乎全來了」＝快到了，赴約必備句。","level":"TOPIK1"},{"text":"언제 와요?","reading":"eonje wayo?","zh":"你什麼時候到？","topic":"邀約出遊","example":"언제 와요? 저 먼저 주문할까요?","example_zh":"你什麼時候到？我先點餐嗎？","note":"等人時催促的自然問法；오다→와요；반말是언제 와?。","level":"TOPIK1"},{"text":"빨리 와요","reading":"ppalli wayo","zh":"快點來","topic":"邀約出遊","example":"다들 기다려요. 빨리 와요!","example_zh":"大家都在等，快點來！","note":"빨리＝快點，韓國人的口頭禪，反映빨리빨리文化；반말是빨리 와。","level":"TOPIK1"},{"text":"미안해요, 조금 늦어요","reading":"mianhaeyo, jogeum neujeoyo","zh":"抱歉，我會晚一點到","topic":"邀約出遊","example":"미안해요, 조금 늦어요. 차가 막혀요.","example_zh":"抱歉，我會晚一點到，塞車了。","note":"늦다＝遲、晚；차가 막혀요（塞車）是最常用的遲到理由。","level":"TOPIK1"},{"text":"어디예요?","reading":"eodiyeyo?","zh":"你在哪／到哪了？","topic":"邀約出遊","example":"어디예요? 저 도착했어요.","example_zh":"你到哪了？我到了。","note":"打電話找人第一句幾乎都是這句；問「人」在哪和問「地方」在哪都用어디예요?。","level":"TOPIK1"},{"text":"저 왔어요","reading":"jeo wasseoyo","zh":"我到了","topic":"邀約出遊","example":"저 왔어요. 어디에 앉아 있어요?","example_zh":"我到了，你坐在哪？","note":"到達集合地點時傳的訊息；也可以說도착했어요（到達了）。","level":"TOPIK1"},{"text":"놀러 오세요","reading":"nolleo oseyo","zh":"來我家玩吧","topic":"邀約出遊","example":"우리 집에 놀러 오세요. 요리해 줄게요.","example_zh":"來我家玩吧，我做菜給你吃。","note":"놀다＋-(으)러 오다＝來玩；대만에 놀러 오세요（來台灣玩）交朋友必說。","level":"TOPIK1"},{"text":"같이 갈래요?","reading":"gachi gallaeyo?","zh":"要一起去嗎？","topic":"邀約出遊","example":"내일 시장에 가요. 같이 갈래요?","example_zh":"我明天要去市場，要一起去嗎？","note":"萬用邀約句；-(으)ㄹ래요?問對方意願，語氣輕鬆不強迫。","level":"TOPIK1"},{"text":"쇼핑하러 갈래요?","reading":"syopinghareo gallaeyo?","zh":"要去逛街嗎？","topic":"邀約出遊","example":"주말에 쇼핑하러 갈래요? 세일해요.","example_zh":"週末要去逛街嗎？現在特價。","note":"-(으)러 가다＝去做某事；세일（sale）＝特價，逛街高頻外來語。","level":"TOPIK1"},{"text":"바다 보러 가요","reading":"bada boreo gayo","zh":"去看海吧","topic":"邀約出遊","example":"날씨 좋은데 바다 보러 가요!","example_zh":"天氣這麼好，去看海吧！","note":"바다＝海；韓國人週末愛去강릉、부산看海，台灣人可以推薦花東。","level":"TOPIK1"},{"text":"어디로 갈까요?","reading":"eodiro galkkayo?","zh":"我們去哪好呢？","topic":"邀約出遊","example":"어디로 갈까요? — 홍대 어때요?","example_zh":"我們去哪好呢？——弘大怎麼樣？","note":"(으)로表示方向；어디
