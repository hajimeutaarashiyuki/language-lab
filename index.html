然櫃檯會找不到。"},{"text":"What time is check-in?","reading":"phr.","zh":"幾點可以入住？","topic":"住宿","example":"What time is check-in? We land pretty early in the morning.","example_zh":"幾點可以入住？我們一大早就落地了。","note":"多數飯店下午三點後才能入住。太早到可以問 Could I check in early?，不行的話至少能寄放行李。"},{"text":"Could I have a late check-out?","reading":"phr.","zh":"可以讓我晚一點退房嗎？","topic":"住宿","example":"Could I have a late check-out? My flight isn't until 9 p.m.","example_zh":"可以讓我晚一點退房嗎？我的班機晚上九點才飛。","note":"退房前一天先問成功率較高，淡季常可免費延到中午十二點或一點；旺季可能要加半天房費，先問清楚 Is there a charge?。"},{"text":"Do you have any rooms available?","reading":"phr.","zh":"請問還有空房嗎？","topic":"住宿","example":"Do you have any rooms available for tonight, just one night?","example_zh":"今晚還有空房嗎？只住一晚。","note":"walk-in（沒預訂直接上門）詢問用。可接著問 What's your best rate?（最優惠價是多少），現場價有時比網路貴，比價再決定。"},{"text":"Is breakfast included?","reading":"phr.","zh":"有含早餐嗎？","topic":"住宿","example":"Is breakfast included, or is it extra?","example_zh":"有含早餐嗎，還是要另外付？","note":"included（含在內）是旅遊萬用字，也可問 Is tax included?。歐洲訂房常見 B&B 就是 bed and breakfast 含早餐的意思。"},{"text":"What's the Wi-Fi password?","reading":"phr.","zh":"Wi-Fi 密碼是什麼？","topic":"住宿","example":"What's the Wi-Fi password? Is it the same on every floor?","example_zh":"Wi-Fi 密碼是什麼？每層樓都一樣嗎？","note":"在咖啡店、餐廳也是同一句。Wi-Fi 唸 why-fy，台式唸法「威壓」外國人會聽不懂，這是很常見的溝通卡關點。"},{"text":"The Wi-Fi isn't working.","reading":"phr.","zh":"Wi-Fi 不能用。","topic":"住宿","example":"The Wi-Fi isn't working in my room. Could you check it?","example_zh":"我房間的 Wi-Fi 不能用，可以幫我看看嗎？","note":"...isn't working 是「東西壞了、不能用」的萬用句型，冷氣、電視、吹風機都能套。比 It's broken 更常用於設備故障。"},{"text":"The air conditioning is broken.","reading":"phr.","zh":"冷氣壞了。","topic":"住宿","example":"The air conditioning is broken, and the room is really stuffy.","example_zh":"冷氣壞了，房間很悶。","note":"口語常縮寫成 AC（The AC is broken.）。歐洲許多老飯店根本沒冷氣，夏天訂房前先確認有沒有 air conditioning。"},{"text":"There's no hot water in my room.","reading":"phr.","zh":"我房間沒有熱水。","topic":"住宿","example":"There's no hot water in my room. Could someone take a look?","example_zh":"我房間沒有熱水，可以請人來看看嗎？","note":"There's no + 名詞是回報「缺東西」的萬用開頭：There's no towel / toilet paper / soap。反映問題時語氣平穩效果最好。"},{"text":"Could I get some extra towels?","reading":"phr.","zh":"可以多給我幾條毛巾嗎？","topic":"住宿","example":"Could I get some extra towels and another pillow, please?","example_zh":"可以多給我幾條毛巾和一顆枕頭嗎？","note":"extra 是「額外的」，跟櫃檯要備品的關鍵字。環保趨勢下毛巾常兩天換一次，需要就直接開口，不用不好意思。"},{"text":"Could you keep my luggage until this afternoon?","reading":"phr.","zh":"可以幫我寄放行李到下午嗎？","topic":"住宿","example":"We've checked out, but could you keep my luggage until this afternoon?","example_zh":"我們退房了，但可以幫我寄放行李到下午嗎？","note":"退房後、班機前的空檔必用句。也可說 store my luggage。領行李時憑寄放牌（tag），部分飯店期待給行李員小費。"},{"text":"Could I switch to a quieter room?","reading":"phr.","zh":"可以幫我換一間安靜一點的房間嗎？","topic":"住宿","example":"Could I switch to a quieter room? Mine faces the main road.","example_zh":"可以換一間安靜一點的房間嗎？我這間面對大馬路。","note":"switch to / change to 都可以。給出具體原因（面馬路、電梯旁）成功率高很多，第一晚就反映比住到一半才說好談。"},{"text":"I'd like to extend my stay by one night.","reading":"phr.","zh":"我想多住一晚。","topic":"住宿","example":"I'd like to extend my stay by one night if the room is still free.","example_zh":"如果房間還有空的話，我想多住一晚。","note":"extend my stay 是延長住宿的正式講法，口語也可說 stay one more night。延住價格不一定跟原本一樣，記得先確認房價。"},{"text":"I locked myself out of my room.","reading":"phr.","zh":"我把自己鎖在房間外面了。","topic":"住宿","example":"I locked myself out of my room. Could you help me get back in?","example_zh":"我把自己鎖在門外了，可以幫我開門嗎？","note":"飯店房門幾乎都是自動上鎖，出門記得帶房卡。櫃檯通常會核對姓名和證件才補發卡片，是正常程序不是刁難。"},{"text":"The room smells like smoke.","reading":"phr.","zh":"房間有菸味。","topic":"住宿","example":"The room smells like smoke. I booked a non-smoking room.","example_zh":"房間有菸味，我訂的是禁菸房。","note":"smell like + 名詞描述氣味問題很好用。在禁菸房抽菸多數飯店會收高額清潔費（cleaning fee），千萬別以身試法。"},{"text":"Is there a curfew?","reading":"phr.","zh":"有門禁時間嗎？","topic":"住宿","example":"Is there a curfew, or can we come back late?","example_zh":"有門禁嗎？還是我們可以晚點回來？","note":"青年旅館和民宿常見問題，部分宗教區或家庭式住宿真的有門禁。順便問 Is the front desk open 24 hours?（櫃檯是24小時的嗎）。"},{"text":"I booked a bed in a mixed dorm.","reading":"phr.","zh":"我訂了男女混合房的一個床位。","topic":"住宿","example":"I booked a bed in a mixed dorm for two nights.","example_zh":"我訂了男女混合房的床位，住兩晚。","note":"青旅用語：dorm 多人房、mixed 男女混合、female-only 女性專用。住青旅是交外國朋友最容易的場合，交誼廳一句 Where are you from? 就能開聊。"},{"text":"Do you have a laundry service?","reading":"phr.","zh":"你們有洗衣服務嗎？","topic":"住宿","example":"Do you have a laundry service, or is there a laundromat nearby?","example_zh":"你們有洗衣服務嗎？還是附近有自助洗衣店？","note":"laundromat 是美式的自助洗衣店，英式叫 launderette。長途旅行帶少一點衣服、中途洗衣，行李會輕很多。"},{"text":"Could you call a taxi for me?","reading":"phr.","zh":"可以幫我叫計程車嗎？","topic":"住宿","example":"Could you call a taxi for me? I need to leave for the airport at five.","example_zh":"可以幫我叫計程車嗎？我五點要出發去機場。","note":"請櫃檯代叫車通常比路邊攔車可靠，清晨班機前一晚先預約。可加一句 How much will it roughly cost?（大概多少錢）。"},{"text":"split the bill","reading":"phr.","zh":"分攤帳單、各付各的","topic":"餐廳點餐","example":"Let's just split the bill; it's easier.","example_zh":"我們就平分帳單吧，比較簡單。","note":"split 是平均分攤；「各付各的」另一個說法是 go Dutch（口語）。跟新朋友吃飯先講好怎麼付，歐美平分或各付都很常見，不搶著請客也完全不失禮。"},{"text":"on the house","reading":"phr.","zh":"店家招待、免費贈送","topic":"餐廳點餐","example":"The dessert is on the house. Enjoy!","example_zh":"甜點是本店招待的，請享用！","note":"聽懂用的：店家請客的意思。朋友之間說 It's on me. 則是「我請客」。被招待時道謝就好，不用堅持付錢。"},{"text":"A table for two, please.","reading":"phr.","zh":"兩位，謝謝。","topic":"餐廳點餐","example":"Hi, a table for two, please. Do you have one by the window?","example_zh":"你好，兩位，謝謝。有靠窗的位子嗎？","note":"進餐廳的第一句話。歐美餐廳多半要在門口等帶位（wait to be seated），自己直接走進去坐是常見的文化地雷。"},{"text":"Do you take reservations?","reading":"phr.","zh":"你們接受訂位嗎？","topic":"餐廳點餐","example":"Do you take reservations, or is it walk-in only?","example_zh":"你們接受訂位嗎，還是只收現場客人？","note":"walk-in only 表示不收訂位、現場排隊。熱門餐廳常要提前好幾天訂位，也可問 How long is the wait?（要等多久）。"},{"text":"Could we see the menu?","reading":"phr.","zh":"可以給我們看菜單嗎？","topic":"餐廳點餐","example":"Could we see the menu? And do you have an English one?","example_zh":"可以給我們菜單嗎？有英文版的嗎？","note":"非英語系國家旅行時 Do you have an English menu? 超實用。現在很多店改用 QR code 菜單，掃不出來就直接開口要紙本。"},{"text":"What do you recommend?","reading":"phr.","zh":"你推薦什麼？","topic":"餐廳點餐","example":"It's our first time here. What do you recommend?","example_zh":"我們第一次來，你推薦什麼？","note":"對服務生說，既能點到招牌菜又能開啟互動。更道地一點可問 What's popular here?，通常會得到很熱情的回答。"},{"text":"What's today's special?","reading":"phr.","zh":"今日特餐是什麼？","topic":"餐廳點餐","example":"What's today's special? Is it seafood?","example_zh":"今日特餐是什麼？是海鮮嗎？","note":"special 是當日限定或優惠餐點，常寫在黑板上。服務生口頭介紹 specials 時語速通常很快，聽不清楚就請對方再說一次。"},{"text":"We're still deciding.","reading":"phr.","zh":"我們還在考慮（還沒決定要點什麼）。","topic":"餐廳點餐","example":"Are you ready to order? — We're still deciding. Could we have a few more minutes?","example_zh":"準備好點餐了嗎？——我們還在考慮，可以再給我們幾分鐘嗎？","note":"服務生來得太快時的救援句，也可說 We need a few more minutes.。在歐美這樣說完全不失禮，服務生會晚點再過來。"},{"text":"We're ready to order.","reading":"phr.","zh":"我們準備好點餐了。","topic":"餐廳點餐","example":"Excuse me, we're ready to order now.","example_zh":"不好意思，我們可以點餐了。","note":"歐美餐廳不流行大聲喊服務生，跟服務生眼神接觸、微微舉手即可。台式的大聲「服務生！」在國外會顯得很突兀。"},{"text":"I'll have the salmon.","reading":"phr.","zh":"我要點鮭魚。","topic":"餐廳點餐","example":"I'll have the salmon, and she'll have the pasta.","example_zh":"我要鮭魚，她要義大利麵。","note":"點餐最自然的句型就是 I'll have the + 菜名，比 I want... 委婉。菜名前加 the 是指菜單上的那道菜。"},{"text":"I'd like my steak medium rare.","reading":"phr.","zh":"我的牛排要三分熟。","topic":"餐廳點餐","example":"How would you like your steak? — I'd like it medium rare.","example_zh":"您的牛排要幾分熟？——我要三分熟（medium rare）。","note":"熟度由生到熟：rare、medium rare、medium、medium well、well done。西方牛排同一個熟度普遍比台灣的更生、血水更多，怕太生可以直接點 medium 以上。"},{"text":"Could I substitute the fries with a salad?","reading":"phr.","zh":"可以把薯條換成沙拉嗎？","topic":"餐廳點餐","example":"Could I substitute the fries with a salad? — Sure, no problem.","example_zh":"可以把薯條換成沙拉嗎？——當然，沒問題。","note":"美國餐廳對換配菜（substitution）接受度很高，開口就對了，有時會加一點錢。醬料放旁邊則說 dressing on the side。"},{"text":"Do you have any vegetarian options?","reading":"phr.","zh":"你們有素食的選擇嗎？","topic":"餐廳點餐","example":"Do you have any vegetarian options? My friend doesn't eat meat.","example_zh":"你們有素食選項嗎？我朋友不吃肉。","note":"vegetarian 吃蛋奶素、vegan 全素連蛋奶都不吃。台式素食不吃蔥蒜的需求要另外說明：no garlic or onion, please。"},{"text":"I'm allergic to peanuts.","reading":"phr.","zh":"我對花生過敏。","topic":"餐廳點餐","example":"Just so you know, I'm allergic to peanuts. Is this dish safe for me?","example_zh":"先跟你說一下，我對花生過敏，這道菜我可以吃嗎？","note":"保命句。allergic to + 過敏原：shellfish 帶殼海鮮、dairy 乳製品、gluten 麩質。過敏務必主動講，歐美餐廳都會認真處理。"},{"text":"Does this have pork in it?","reading":"phr.","zh":"這道菜裡面有豬肉嗎？","topic":"餐廳點餐","example":"Does this have pork in it? I don't eat pork.","example_zh":"這裡面有豬肉嗎？我不吃豬肉。","note":"Does this have ... in it? 是確認成分的萬用句，替換 nuts、alcohol、cilantro（香菜）都行。飲食禁忌直接講清楚，別靠猜。"},{"text":"Can we get some water for the table?","reading":"phr.","zh":"可以給我們這桌一些水嗎？","topic":"餐廳點餐","example":"Can we get some water for the table? Tap water is fine.","example_zh":"可以給我們一些水嗎？自來水就可以了。","note":"美國餐廳的 tap water（生飲自來水）免費；歐洲點 water 常會端出要錢的瓶裝水，想省錢就明確說 tap water, please。"},{"text":"Could I get a refill?","reading":"phr.","zh":"可以幫我續杯嗎？","topic":"餐廳點餐","example":"Could I get a refill on the iced tea?","example_zh":"冰茶可以幫我續杯嗎？","note":"美國很多餐廳汽水和咖啡免費續杯（free refills），這在歐洲很少見，每杯都算錢，點之前可先問 Are refills free?。"},{"text":"This isn't what I ordered.","reading":"phr.","zh":"這不是我點的。","topic":"餐廳點餐","example":"Sorry, this isn't what I ordered. I had the chicken sandwich.","example_zh":"不好意思，這不是我點的，我點的是雞肉三明治。","note":"上錯菜時平靜指出即可，開頭加 Sorry 或 Excuse me 緩和語氣。歐美服務生通常會直接道歉換餐，不需要不好意思。"},{"text":"Everything was great, thanks.","reading":"phr.","zh":"一切都很棒，謝謝。","topic":"餐廳點餐","example":"How was everything? — Everything was great, thanks.","example_zh":"餐點都還好嗎？——一切都很棒，謝謝。","note":"服務生中途來問 How is everything? 是例行關心，這句是標準回應。真的有問題也可趁這時提出，這正是反映的好時機。"},{"text":"Could you wrap this up for me?","reading":"phr.","zh":"可以幫我把這個打包嗎？","topic":"餐廳點餐","example":"Could you wrap this up for me? I'd hate to waste it.","example_zh":"可以幫我打包嗎？丟掉太可惜了。","note":"也可說 Could I get a box?。美國打包剩菜非常普遍不丟臉；歐洲部分高級餐廳較少見打包文化，看場合開口。"},{"text":"Could we get separate checks?","reading":"phr.","zh":"可以幫我們分開結帳嗎？","topic":"餐廳點餐","example":"Could we get separate checks? There are four of us.","example_zh":"可以分開結帳嗎？我們有四個人。","note":"最好在點餐時就先講，結帳才說有些店家會面有難色。英式說 separate bills。和 split the bill（平分一張帳單）意思不同。"},{"text":"Check, please.","reading":"phr.","zh":"麻煩結帳。","topic":"餐廳點餐","example":"Excuse me, check, please. — Sure, I'll be right back.","example_zh":"不好意思，麻煩結帳。——好的，馬上來。","note":"美式 check、英式 bill。歐美餐廳大多桌邊結帳，不是去櫃檯；遠遠對服務生做簽名手勢也通，但開口說更清楚。"},{"text":"Is the tip included?","reading":"phr.","zh":"帳單有含小費嗎？","topic":"餐廳點餐","example":"Is the tip included, or should I add it myself?","example_zh":"小費已經含在裡面了嗎，還是我要自己加？","note":"美國內用給 15-20% 小費是常態；帳單上有 service charge / gratuity 字樣就是已含。歐洲多數含服務費，留零錢意思一下即可。"},{"text":"Could I get this to go?","reading":"phr.","zh":"這個可以幫我做成外帶嗎？","topic":"餐廳點餐","example":"Could I get this to go? We're in a bit of a hurry.","example_zh":"這個可以外帶嗎？我們有點趕時間。","note":"to go 是美式「外帶」，英式說 takeaway。店員問 For here or to go?（內用還是外帶）是速食店必考題，先準備好答案。"},{"text":"I'm good, thanks.","reading":"phr.","zh":"不用了，謝謝（我這樣就好）。","topic":"餐廳點餐","example":"Would you like another drink? — I'm good, thanks.","example_zh":"還要再來一杯嗎？——不用了，謝謝。","note":"美式口語婉拒的萬用句，語氣輕鬆不失禮，店員問要不要加點、要不要袋子都可以用。字面是「我很好」，實際意思是「不用了」。"},{"text":"fitting room","reading":"n.","zh":"試衣間","topic":"購物殺價","example":"The fitting room is in the back, next to the mirrors.","example_zh":"試衣間在後面，鏡子旁邊。","note":"美式 fitting room 或 dressing room，英式 changing room。進試衣間店員常會數件數給牌子，出來要歸還。"},{"text":"rip-off","reading":"n.","zh":"坑人、敲竹槓的東西","topic":"購物殺價","example":"Ten dollars for a bottle of water? That's a rip-off.","example_zh":"一瓶水要十美元？根本是坑人。","note":"跟朋友抱怨用的口語，別當著店員的面說，等於指控對方坑錢，場面會很僵。動詞用法：I got ripped off.（我被坑了）。"},{"text":"on sale","reading":"phr.","zh":"特價中、打折中","topic":"購物殺價","example":"These shoes are on sale, thirty percent off.","example_zh":"這雙鞋在特價，打七折。","note":"on sale 是特價，for sale 是出售中（不一定打折），一字之差意思差很多。30% off 是「減三成」，等於台灣說的打七折。"},{"text":"buy one get one free","reading":"phr.","zh":"買一送一","topic":"購物殺價","example":"The sign says buy one get one free on all T-shirts.","example_zh":"牌子上寫所有 T 恤買一送一。","note":"常縮寫成 BOGO。變化型 buy one get one half off 是第二件半價，結帳前看清楚條件，別以為都是送整件。"},{"text":"tax refund","reading":"n.","zh":"退稅","topic":"購物殺價","example":"Can I get a tax refund on this purchase as a tourist?","example_zh":"我是觀光客，這筆消費可以退稅嗎？","note":"歐洲、日本等地對旅客有退稅制度，結帳時主動出示護照並問這句。歐洲通常在機場辦理，要預留排隊時間，收據和商品要備查。"},{"text":"How much is this?","reading":"phr.","zh":"這個多少錢？","topic":"購物殺價","example":"Excuse me, how much is this? I don't see a price tag.","example_zh":"不好意思，這個多少錢？我沒看到標價。","note":"問價基本句。複數商品用 How much are these?。市集裡沒標價的東西，問價常是殺價的開場白，先聽對方開多少。"},{"text":"I'm just looking, thanks.","reading":"phr.","zh":"我只是看看，謝謝。","topic":"購物殺價","example":"Can I help you find anything? — I'm just looking, thanks.","example_zh":"需要幫您找什麼嗎？——我只是看看，謝謝。","note":"店員上前招呼時的標準回應，說完店員就會讓你自己逛。這在歐美是完全正常的互動，不用覺得拒絕人很尷尬。"},{"text":"Can I try this on?","reading":"phr.","zh":"我可以試穿這件嗎？","topic":"購物殺價","example":"Can I try this on? Where's the fitting room?","example_zh":"我可以試穿嗎？試衣間在哪裡？","note":"try on 是試穿衣服鞋子；試吃是 try / sample。有些國家（如部分歐洲小店）試穿前要先問，直接拿進去可能被制止。"},{"text":"Do you have this in a smaller size?","reading":"phr.","zh":"這個有小一號的嗎？","topic":"購物殺價","example":"Do you have this in a smaller size? The medium is a bit loose.","example_zh":"這件有小一號的嗎？M 號有點鬆。","note":"Do you have this in...? 是購物萬用句型，可換 a larger size、size 8。歐美尺碼普遍比亞洲大一到兩號，試穿再買最保險。"},{"text":"Do you have this in another color?","reading":"phr.","zh":"這個有其他顏色嗎？","topic":"購物殺價","example":"Do you have this in another color, maybe black or navy?","example_zh":"這個有其他顏色嗎？黑色或深藍色之類的。","note":"店員若回 Let me check in the back.（我去倉庫查一下）就稍等。缺貨時可問 Can you check another store?（可以幫我查別間店嗎）。"},{"text":"Do you take credit cards?","reading":"phr.","zh":"你們收信用卡嗎？","topic":"購物殺價","example":"Do you take credit cards, or is it cash only?","example_zh":"你們收信用卡嗎，還是只收現金？","note":"市集攤販常 cash only（只收現金）。歐美刷卡機常會問 credit or debit，觀光客選 credit 即可；小額交易有些店設最低消費。"},{"text":"Can you give me a discount?","reading":"phr.","zh":"可以給我打個折嗎？","topic":"購物殺價","example":"Can you give me a discount if I buy three of these?","example_zh":"如果我買三個，可以給我打個折嗎？","note":"適合市集、紀念品店、小店；在歐美連鎖百貨和超市殺價是行不通的，店員只會尷尬。搭配買多件一起談最自然。"},{"text":"That's a bit over my budget.","reading":"phr.","zh":"這有點超出我的預算。","topic":"購物殺價","example":"It's beautiful, but that's a bit over my budget.","example_zh":"很漂亮，但有點超出我的預算。","note":"軟性殺價句：不批評商品、只談自己預算，攤販常會主動降價。先讚美再說預算不夠，是最不傷感情的講價方式。"},{"text":"Could you come down a little?","reading":"phr.","zh":"價格可以再降一點嗎？","topic":"購物殺價","example":"Could you come down a little? How about fifteen?","example_zh":"可以再便宜一點嗎？十五元怎麼樣？","note":"come down 指降價。殺價要笑著談，保持輕鬆像玩遊戲；在東南亞、中東市集殺價是文化的一部分，開價常有五成以上空間。"},{"text":"What's your best price?","reading":"phr.","zh":"你最低可以算多少？","topic":"購物殺價","example":"I'm paying cash. What's your best price?","example_zh":"我付現金，你最低可以算多少？","note":"請對方直接出底價的講法，搭配付現（paying cash）更有談判力。對方報價後你再還一個更低的，中間值成交很常見。"},{"text":"How about twenty dollars for both?","reading":"phr.","zh":"兩個算二十美元怎麼樣？","topic":"購物殺價","example":"How about twenty dollars for both? Then I'll take them now.","example_zh":"兩個一起算二十美元怎麼樣？可以的話我現在就買。","note":"How about + 價格是出價句型，打包多件一起談（bundle）是市集殺價最有效的招式。出價後就閉嘴等對方回應，先開口的人常讓步。"},{"text":"I saw it cheaper at another stall.","reading":"phr.","zh":"我在別攤看到更便宜的。","topic":"購物殺價","example":"I saw it cheaper at another stall, but I like yours better.","example_zh":"我在別攤有看到更便宜的，但我比較喜歡你的。","note":"比價施壓句，後面接一句稱讚對方的貨可以軟化語氣。stall 是市集攤位。講這句要自然，被拆穿在唬人就尷尬了。"},{"text":"I'll think about it.","reading":"phr.","zh":"我再考慮一下。","topic":"購物殺價","example":"Thanks for your time. I'll think about it.","example_zh":"謝謝你的介紹，我再考慮一下。","note":"禮貌脫身句，也是殺價殺手鐧：作勢離開時攤販常會喊出最低價。真的不想買就微笑說這句然後走，不必有罪惡感。"},{"text":"I'll take it.","reading":"phr.","zh":"我買了、就要這個。","topic":"購物殺價","example":"Okay, twelve is fine. I'll take it.","example_zh":"好，十二元可以，我買了。","note":"決定購買的收尾句，複數說 I'll take them / I'll take two.。注意殺價殺到對方答應後才說這句，成交後反悔在市集是大忌。"},{"text":"It's a deal.","reading":"phr.","zh":"成交！","topic":"購物殺價","example":"Eighteen for the two bags? — It's a deal.","example_zh":"兩個包十八元？——成交！","note":"雙方談定價格時說，常配一個握手。口語也常聽到單獨一個字 Deal!。deal 另有「划算」之意：That's a good deal.（很划算）。"},{"text":"Can I return this if it doesn't fit?","reading":"phr.","zh":"如果不合身，我可以拿回來退嗎？","topic":"購物殺價","example":"Can I return this if it doesn't fit? I'm leaving town on Friday.","example_zh":"如果不合身可以退嗎？我星期五就要離開了。","note":"美國退貨文化非常寬鬆，多數店家保留收據即可退；市集攤販則幾乎不能退，買前想清楚。收據 receipt 一定要留著。"},{"text":"I'd like a refund, please.","reading":"phr.","zh":"我想要退款。","topic":"購物殺價","example":"This charger stopped working the next day. I'd like a refund, please.","example_zh":"這個充電器隔天就壞了，我想退款。","note":"refund 是退錢，exchange 是換貨，先想好要哪一種。說明問題時附上收據，語氣堅定但客氣，成功率最高。"},{"text":"Could I exchange this for a different size?","reading":"phr.","zh":"我可以換一個不同尺寸的嗎？","topic":"購物殺價","example":"Could I exchange this for a different size? I still have the receipt.","example_zh":"我可以換一個尺寸嗎？收據我還留著。","note":"exchange for + 想換的東西。吊牌（tag）別急著剪，未使用、吊牌完整是多數店家換貨的條件。"},{"text":"Is this handmade?","reading":"phr.","zh":"這是手工做的嗎？","topic":"購物殺價","example":"Is this handmade? The pattern is really beautiful.","example_zh":"這是手工做的嗎？花紋真的很漂亮。","note":"市集聊天兼探價值的問句，攤主多半樂於介紹，聊開之後談價格反而更好談。對手工藝品表現興趣是很好的破冰方式。"},{"text":"Cash or card?","reading":"phr.","zh":"付現金還是刷卡？","topic":"購物殺價","example":"That'll be 24.50. Cash or card? — Card, please.","example_zh":"總共 24.50 元，付現還是刷卡？——刷卡，謝謝。","note":"收銀員必問句，聽懂就能秒答 Card, please. 或 Cash.。歐洲很多地方感應支付非常普及，北歐部分店家甚至不收現金。"},{"text":"Mind if I join you?","reading":"phr.","zh":"介意我加入嗎？（可以跟你坐嗎？）","topic":"交朋友開場","example":"The bar's pretty full. Mind if I join you?","example_zh":"吧台滿滿的，介意我坐這嗎？","note":"青旅交誼廳、酒吧併桌的自然開場。回答 Not at all 或 Go ahead 是「請」。這是搭話最低壓力的起手式，比直接問問題不突兀。"},{"text":"What brings you here?","reading":"phr.","zh":"什麼風把你吹來的？（你怎麼會來這？）","topic":"交朋友開場","example":"What brings you here? Traveling or work?","example_zh":"你怎麼會來這？來玩還是工作？","note":"比生硬的 Why are you here? 友善很多，是開啟旅人閒聊的經典問句。對方回答後接著問細節，話題就展開了。"},{"text":"Where are you from?","reading":"phr.","zh":"你從哪裡來的？","topic":"交朋友開場","example":"Where are you from? — Canada. How about you? — Taiwan.","example_zh":"你從哪來？——加拿大，你呢？——台灣。","note":"旅途破冰第一名問句。回答後主動反問 How about you? 讓對話來回，是延續話題的關鍵習慣。很多人不太認得台灣，可補一句 It's near Japan.。"},{"text":"Is this your first time here?","reading":"phr.","zh":"你第一次來這裡嗎？","topic":"交朋友開場","example":"Is this your first time here? — Yeah, any tips? — Oh, you have to try the street food.","example_zh":"你第一次來嗎？——對啊，有什麼建議嗎？——喔，你一定要試試路邊小吃。","note":"既能搭話又能討到在地情報。若對方是常客，順勢請教推薦景點，話題自然延伸又能拉近距離。"},{"text":"I love your jacket. Where did you get it?","reading":"phr.","zh":"我很喜歡你的外套，哪裡買的？","topic":"交朋友開場","example":"I love your jacket. Where did you get it? — Thanks! I found it at a market here.","example_zh":"我很喜歡你的外套，哪買的？——謝謝！我在這邊的市集找到的。","note":"稱讚式開場，真誠具體最有效（指出喜歡哪一點）。歐美對陌生人的善意讚美接受度高，但點到為止，別過度盯著對方看。"},{"text":"How long have you been traveling?","reading":"phr.","zh":"你已經旅行多久了？","topic":"交朋友開場","example":"How long have you been traveling? — About three months now.","example_zh":"你旅行多久了？——大概三個月了。","note":"長期背包客社群的熱門話題，一問常能聊很久。用現在完成進行式表示「一直到現在」，是聊旅程的地道句型。"},{"text":"What do you do for fun?","reading":"phr.","zh":"你平常喜歡做什麼？（你的興趣是？）","topic":"交朋友開場","example":"What do you do for fun back home? — I'm really into rock climbing.","example_zh":"你在家鄉平常喜歡做什麼？——我超愛攀岩的。","note":"比 What's your hobby?（很像教科書）自然道地。想問職業則用 What do you do?（你做哪一行），別跟這句搞混。"},{"text":"No way, me too!","reading":"phr.","zh":"不會吧，我也是！","topic":"交朋友開場","example":"I'm from Taiwan. — No way, me too! Which city?","example_zh":"我來自台灣。——不會吧，我也是！你哪個城市的？","note":"找到共同點時的熱情回應，瞬間拉近距離。me too 用於肯定句附和；若對方講的是否定句（I don't...），要用 me neither 附和。"},{"text":"That sounds amazing!","reading":"phr.","zh":"聽起來超棒的！","topic":"交朋友開場","example":"We hiked to the summit at sunrise. — That sounds amazing! Was it tough?","example_zh":"我們爬到山頂看日出。——聽起來超棒的！會很累嗎？","note":"積極回應對方的分享，再追問一個問題，是讓聊天不冷場的黃金公式。sounds 後面接形容詞（great / fun / tough）。"},{"text":"What's it like living in Berlin?","reading":"phr.","zh":"住在柏林是什麼感覺？","topic":"交朋友開場","example":"What's it like living in Berlin? I've always wanted to visit.","example_zh":"住在柏林是什麼感覺？我一直很想去。","note":"What's it like...? 請對方描述經驗或感受，能引出長回答、避免只有一句話就冷場。是深入話題、展現好奇心的好用句型。"},{"text":"How about you?","reading":"phr.","zh":"那你呢？","topic":"交朋友開場","example":"I'm traveling for a month. How about you?","example_zh":"我要旅行一個月，那你呢？","note":"把話丟回去、讓對話一來一往最關鍵的一句。台灣人常犯的毛病是被問完就句點，記得答完主動反問，聊天才會活。"},{"text":"Are you traveling solo?","reading":"phr.","zh":"你是一個人旅行嗎？","topic":"交朋友開場","example":"Are you traveling solo, or with friends?","example_zh":"你是自己一個人旅行，還是跟朋友一起？","note":"solo travel（獨自旅行）社群很大，這句常帶出「要不要一起行動」的邀約。給出選項（or with friends）讓對方好回答。"},{"text":"We should hang out sometime.","reading":"phr.","zh":"我們找時間一起出來玩吧。","topic":"交朋友開場","example":"This was fun. We should hang out sometime while you're in town.","example_zh":"今天很開心，你還在這的時候我們找時間再出來玩吧。","note":"hang out 是「一起消磨時間、閒晃」，交朋友核心動詞。這句是軟性邀約，通常接著就會交換聯絡方式把它敲定。"},{"text":"Do you want to grab a coffee sometime?","reading":"phr.","zh":"要不要找時間一起喝杯咖啡？","topic":"交朋友開場","example":"Do you want to grab a coffee sometime this week?","example_zh":"這禮拜要不要找時間喝杯咖啡？","note":"grab a coffee / grab a bite / grab a drink 是輕鬆邀約的萬用句，壓力小、對方好答應。grab 帶「隨意、快速」的輕鬆感。"},{"text":"A few of us are going to the night market. Want to come?","reading":"phr.","zh":"我們幾個要去逛夜市，要一起來嗎？","topic":"交朋友開場","example":"A few of us are going to the night market tonight. Want to come?","example_zh":"我們幾個今晚要去逛夜市，要一起來嗎？","note":"團體邀約比一對一更沒壓力，對方也更容易點頭。Want to come? / Want to join? 是最口語的收尾，不用加主詞。"},{"text":"Let's swap numbers.","reading":"phr.","zh":"我們交換一下電話吧。","topic":"交朋友開場","example":"Let's swap numbers so we can meet up tomorrow.","example_zh":"我們交換電話吧，這樣明天可以碰面。","note":"swap = exchange，交換聯絡方式最口語的說法。給個具體理由（好約明天）會很自然，比空口要電話不尷尬。"},{"text":"Are you on Instagram?","reading":"phr.","zh":"你有用 Instagram 嗎？","topic":"交朋友開場","example":"Are you on Instagram? It's easier to keep in touch there.","example_zh":"你有用 IG 嗎？在那邊比較好保持聯絡。","note":"旅途中互加社群比要電話更自然、門檻更低，年輕人尤其愛用。on + 平台名（on WhatsApp / on TikTok）表示「有在用」。"},{"text":"What's your WhatsApp?","reading":"phr.","zh":"你的 WhatsApp 是多少？","topic":"交朋友開場","example":"What's your WhatsApp? I'll send you the photos we took.","example_zh":"你的 WhatsApp 是？我把我們拍的照片傳給你。","note":"台灣人習慣用 Line，但歐美、東南亞主流是 WhatsApp，出國前先裝一個。提個傳照片的理由，要聯絡方式就順理成章。"},{"text":"Let's stay in touch.","reading":"phr.","zh":"我們保持聯絡吧。","topic":"交朋友開場","example":"It was great meeting you. Let's stay in touch!","example_zh":"很高興認識你，我們保持聯絡吧！","note":"道別時的溫暖收尾，也可說 keep in touch。真心想聯絡的話當場就交換聯絡方式，不然這句常淪為客套。"},{"text":"It was really nice meeting you.","reading":"phr.","zh":"很高興認識你。","topic":"交朋友開場","example":"I've got to run, but it was really nice meeting you.","example_zh":"我得走了，不過很高興認識你。","note":"初次見面道別的標準句（用過去式 meeting，因為見面這件事要結束了）。可搭配握手；歐美初識通常不擁抱，看關係熟度而定。"},{"text":"Let's keep in touch. Here's my Instagram.","reading":"phr.","zh":"保持聯絡吧，這是我的 IG。","topic":"交朋友開場","example":"Let's keep in touch. Here's my Instagram — just search this handle.","example_zh":"保持聯絡吧，這是我的 IG，搜這個帳號就好。","note":"handle 指社群帳號名稱。當場把手機拿出來互追，比只說「保持聯絡」實際得多，回國後才真的聯絡得上。"},{"text":"Maybe another time?","reading":"phr.","zh":"改天吧？","topic":"交朋友開場","example":"I'm pretty wiped out tonight. Maybe another time?","example_zh":"我今晚累壞了，改天好嗎？","note":"婉拒邀約又保留餘地的禮貌句。先給個原因（累了）再說這句，對方不會覺得被打槍。wiped out = 累壞了。"},{"text":"Thanks, but I'm gonna call it a night.","reading":"phr.","zh":"謝了，但我今晚要早點休息了。","topic":"交朋友開場","example":"Thanks for the invite, but I'm gonna call it a night.","example_zh":"謝謝你的邀請，但我今晚要早點休息了。","note":"call it a night 是「今天到此為止、要去睡了」，禮貌退場的地道說法。先謝謝邀請再婉拒，是不失禮的公式。"},{"text":"That's really kind of you, but I already have plans.","reading":"phr.","zh":"你人真好，但我已經有安排了。","topic":"交朋友開場","example":"That's really kind of you, but I already have plans tonight.","example_zh":"你人真好，但我今晚已經有安排了。","note":"婉拒時先肯定對方的好意再拒絕，是最不傷感情的說法。歐美文化裡直接說 No 沒關係，但加個理由和謝意更圓融。"},{"text":"Can I take a rain check?","reading":"phr.","zh":"這次先算了，下次好嗎？","topic":"交朋友開場","example":"I'd love to, but can I take a rain check? I'm swamped this week.","example_zh":"我很想去，但可以改期嗎？我這禮拜忙翻了。","note":"take a rain check 是「這次不行、改天再約」的美式慣用語，帶「有意願、只是時間不巧」的暗示，比直接拒絕友善。swamped = 忙爆。"},{"text":"I'd love to, but I have an early start tomorrow.","reading":"phr.","zh":"我很想去，但我明天要早起。","topic":"交朋友開場","example":"I'd love to, but I have an early start tomorrow. Next time for sure!","example_zh":"我很想去，但我明天要早起。下次一定！","note":"I'd love to, but... 是婉拒的黃金句型：先表達意願，再給理由。結尾補 Next time for sure 讓對方感受到你是真心想聚，只是這次不巧。"},{"text":"Excuse me, how do I get to the train station?","reading":"phr.","zh":"不好意思，請問火車站怎麼走？","topic":"問路求助","example":"Excuse me, how do I get to the train station? I think I'm a little lost.","example_zh":"不好意思，請問火車站怎麼走？我好像有點迷路了。","note":"最安全的問路萬用句。先說 Excuse me 引起注意再問，比劈頭就問路更有禮貌。"},{"text":"Could you point me in the right direction?","reading":"phr.","zh":"可以幫我指一下方向嗎？","topic":"問路求助","example":"I'm looking for the museum. Could you point me in the right direction?","example_zh":"我在找博物館，可以幫我指一下方向嗎？","note":"當你只需要大方向、不用詳細路線時很好用，語氣輕鬆不會給對方壓力。"},{"text":"How long does it take to get there?","reading":"phr.","zh":"到那裡要多久？","topic":"問路求助","example":"How long does it take to get there on foot?","example_zh":"走路過去要多久？","note":"可加 on foot／by bus／by train 指定交通方式。問時間比問距離更實用。"},{"text":"Am I going the right way?","reading":"phr.","zh":"我走的方向對嗎？","topic":"問路求助","example":"Sorry to bother you — am I going the right way to the harbor?","example_zh":"抱歉打擾一下，我這樣走去港口方向對嗎？","note":"走到一半不確定時攔人確認用。Sorry to bother you 當開頭很英式禮貌，美式也通用。"},{"text":"Which way is the exit?","reading":"phr.","zh":"出口在哪個方向？","topic":"問路求助","example":"Excuse me, which way is the exit? I need the one for Fifth Avenue.","example_zh":"不好意思，出口在哪邊？我要往第五大道那個。","note":"地鐵站、商場常有多個出口，直接指定街名或地標最快。"},{"text":"Is there a restroom around here?","reading":"phr.","zh":"這附近有廁所嗎？","topic":"問路求助","example":"Is there a restroom around here I can use?","example_zh":"這附近有我可以用的廁所嗎？","note":"美式用 restroom／bathroom，英式用 toilet／the loo。對店員問時通常需要消費才借用。"},{"text":"Could you show me on the map?","reading":"phr.","zh":"可以在地圖上指給我看嗎？","topic":"問路求助","example":"I don't really speak the language — could you show me on the map?","example_zh":"我不太會講當地語言，可以在地圖上指給我看嗎？","note":"聽不懂口頭路線時的救星，把手機地圖遞過去讓對方點，比硬聽有效。"},{"text":"Where can I catch a taxi?","reading":"phr.","zh":"哪裡可以攔到計程車？","topic":"問路求助","example":"Where can I catch a taxi at this hour?","example_zh":"這個時間哪裡攔得到計程車？","note":"catch/grab a taxi 是道地講法。很多城市不能路邊隨招，要到 taxi stand（排班站）。"},{"text":"Does this bus go to the airport?","reading":"phr.","zh":"這班公車有到機場嗎？","topic":"問路求助","example":"Excuse me, does this bus go to the airport? I have a flight at noon.","example_zh":"不好意思，這班公車有到機場嗎？我中午有班機。","note":"上車前對司機確認最保險。可換 this train／this line 問。"},{"text":"Which platform is it for the downtown train?","reading":"phr.","zh":"往市中心的列車在幾號月台？","topic":"問路求助","example":"Which platform is it for the downtown train?","example_zh":"往市中心的列車在幾號月台？","note":"platform（月台）英美通用；美式口語有時說 track。趕車時直接問站務員最快。"},{"text":"Do I need to transfer?","reading":"phr.","zh":"我需要轉車嗎？","topic":"問路求助","example":"To get to the stadium, do I need to transfer, or is it a direct line?","example_zh":"去體育場我需要轉車嗎，還是有直達？","note":"transfer=轉乘（英式也說 change）。搞清楚要不要換線能省下很多迷路時間。"},{"text":"Which stop should I get off at?","reading":"phr.","zh":"我應該在哪一站下車？","topic":"問路求助","example":"I'm going to the night market — which stop should I get off at?","example_zh":"我要去夜市，應該在哪一站下車？","note":"get off=下車（車、船、飛機）；get out of 只用於汽車。可請司機到站提醒你。"},{"text":"Could you let me know when we get there?","reading":"phr.","zh":"到站時可以提醒我一下嗎？","topic":"問路求助","example":"I'm not sure where to get off. Could you let me know when we get there?","example_zh":"我不確定在哪下車，到站時可以提醒我一下嗎？","note":"對公車司機或鄰座乘客都能用，怕坐過站時很實用，對方通常樂意幫忙。"},{"text":"Is it far from here?","reading":"phr.","zh":"離這裡遠嗎？","topic":"問路求助","example":"The gallery you mentioned — is it far from here?","example_zh":"你說的那間藝廊離這裡遠嗎？","note":"最口語的距離問法。對方常回 just around the corner（就在轉角）或 a few blocks（幾個街區）。"},{"text":"around the corner","reading":"phr.","zh":"在轉角處／很近","topic":"問路求助","example":"The pharmacy? It's just around the corner, next to the bakery.","example_zh":"藥局嗎？就在轉角，麵包店隔壁。","note":"聽路時的高頻回覆，指「很近、一下就到」。聽懂這句就知道不用搭車。"},{"text":"a couple of blocks away","reading":"phr.","zh":"隔幾個街區（不遠）","topic":"問路求助","example":"The subway entrance is a couple of blocks away, past the traffic lights.","example_zh":"地鐵入口在過幾個街區、過紅綠燈之後。","note":"block（街區）是美式問路核心單位，台灣沒有對應概念，要習慣用它抓距離。"},{"text":"Go straight and turn left at the lights.","reading":"phr.","zh":"直走，在紅綠燈那裡左轉。","topic":"問路求助","example":"Go straight and turn left at the lights — you'll see it on your right.","example_zh":"直走，在紅綠燈左轉，就會在你右手邊看到。","note":"聽路指引的標準句型。the lights=紅綠燈（traffic lights）。先記方向詞才聽得懂回覆。"},{"text":"I'm looking for this address.","reading":"phr.","zh":"我在找這個地址。","topic":"問路求助","example":"I'm looking for this address — is it nearby?","example_zh":"我在找這個地址，在附近嗎？","note":"把地址寫下或秀在手機上，配這句遞給對方，比念地址給對方聽更不會出錯。"},{"text":"Could you speak a little slower, please?","reading":"phr.","zh":"可以請你講慢一點嗎？","topic":"問路求助","example":"Sorry, my English isn't great — could you speak a little slower, please?","example_zh":"抱歉我英文沒很好，可以請你講慢一點嗎？","note":"聽不懂時先降速再說。承認自己英文普通反而讓對方更耐心，不必覺得丟臉。"},{"text":"Sorry, I didn't catch that.","reading":"phr.","zh":"抱歉，我沒聽清楚。","topic":"問路求助","example":"Sorry, I didn't catch that — did you say left or right?","example_zh":"抱歉我沒聽清楚，你是說左還是右？","note":"didn't catch that=沒聽清楚，比 I don't understand 更自然、不失禮，還能順勢複述確認。"},{"text":"Is this the right way to the beach?","reading":"phr.","zh":"往海灘是走這邊嗎？","topic":"問路求助","example":"Is this the right way to the beach, or should I go back?","example_zh":"往海灘是走這邊嗎，還是我該往回走？","note":"拿著方向直接確認的問法，比重新問整條路線省事，對方點頭或搖頭你就懂。"},{"text":"Where's the nearest ATM?","reading":"phr.","zh":"最近的提款機在哪？","topic":"問路求助","example":"Where's the nearest ATM? I need to get some cash.","example_zh":"最近的提款機在哪？我需要領點現金。","note":"ATM 英美通用；英式也說 cashpoint。海外提款機常收手續費，找銀行內的較安全。"},{"text":"Can you recommend a good place to eat nearby?","reading":"phr.","zh":"可以推薦附近好吃的地方嗎？","topic":"問路求助","example":"Can you recommend a good place to eat nearby? Something local would be great.","example_zh":"可以推薦附近好吃的地方嗎？在地的最好。","note":"問路順便問美食超實用。加 something local 會得到觀光客不知道的私房店。"},{"text":"Which entrance should I use?","reading":"phr.","zh":"我該從哪個入口進去？","topic":"問路求助","example":"The station has several gates — which entrance should I use for the airport line?","example_zh":"車站有好幾個閘門，去機場線要走哪個入口？","note":"大車站、大景點常有多入口，先問清楚能少走冤枉路，尤其拖行李時。"},{"text":"I think I'm lost.","reading":"phr.","zh":"我好像迷路了。","topic":"問路求助","example":"I think I'm lost — I've been walking in circles for ten minutes.","example_zh":"我好像迷路了，我在原地繞了十分鐘。","note":"坦白說迷路反而讓路人更願意細心指路。walk in circles=原地打轉。"},{"text":"Is there a shortcut?","reading":"phr.","zh":"有沒有近路？","topic":"問路求助","example":"Is there a shortcut, or should I just follow the main road?","example_zh":"有沒有近路，還是我照大馬路走就好？","note":"趕時間時可問，但在陌生城市走近路要衡量安全，天黑寧可走主要幹道。"},{"text":"Hi, is this seat taken?","reading":"phr.","zh":"嗨，這位子有人坐嗎？","topic":"交朋友開場","example":"Hi, is this seat taken? Mind if I join you?","example_zh":"嗨，這位子有人坐嗎？介意我坐這嗎？","note":"咖啡廳、青旅、活動場合最自然的破冰開場，問完常能順勢聊起來。"},{"text":"How long are you traveling for?","reading":"phr.","zh":"你這趟旅行多久？","topic":"交朋友開場","example":"How long are you traveling for? I'm on a two-week trip myself.","example_zh":"你這趟旅行多久？我自己是兩週的行程。","note":"背包客圈的經典話題，接著能聊路線、下一站，很容易變成同行夥伴。"},{"text":"I love your bag — where did you get it?","reading":"phr.","zh":"我很喜歡你的包，在哪買的？","topic":"交朋友開場","example":"I love your bag — where did you get it? I've been looking for one like that.","example_zh":"我很喜歡你的包，在哪買的？我一直在找這種的。","note":"真誠的讚美是最好的搭話由頭。針對「物品」讚美比針對外貌安全，較不會被誤會。"},{"text":"How's your day going?","reading":"phr.","zh":"你今天過得如何？","topic":"交朋友開場","example":"Hey, how's your day going so far?","example_zh":"嘿，你今天到目前為止過得怎樣？","note":"比 How are you 更真心、更能引出真實回答的問候，適合和店員、鄰座暖場。"},{"text":"I couldn't help but notice your T-shirt.","reading":"phr.","zh":"我不小心注意到你的T恤（找話題）","topic":"交朋友開場","example":"I couldn't help but notice your T-shirt — are you a fan of that band too?","example_zh":"我剛好注意到你的T恤，你也是那個樂團的粉絲嗎？","note":"以共同點切入的高招開場。couldn't help but notice=忍不住注意到，語氣自然不突兀。"},{"text":"Are you here for the event too?","reading":"phr.","zh":"你也是來參加這活動的嗎？","topic":"交朋友開場","example":"Are you here for the event too? I don't really know anyone.","example_zh":"你也是來參加這活動的嗎？我其實不太認識人。","note":"在活動、研討會、演唱會場合的萬用破冰，坦承不認識人反而拉近距離。"},{"text":"Do you come here often?","reading":"phr.","zh":"你常來這裡嗎？","topic":"交朋友開場","example":"Do you come here often? I'm trying to find the best coffee in town.","example_zh":"你常來這嗎？我在找城裡最好的咖啡。","note":"這句在酒吧對陌生人講易被當搭訕老哏，加上具體目的（找咖啡）就自然多了。"},{"text":"My name's Vincent, by the way.","reading":"phr.","zh":"對了，我叫Vincent。","topic":"交朋友開場","example":"My name's Vincent, by the way. I don't think we've met.","example_zh":"對了，我叫Vincent，我們應該還沒正式認識。","note":"聊到一半自然報名字的方式。by the way 讓交換姓名不顯刻意，接著問對方名字。"},{"text":"It's really nice to meet you.","reading":"phr.","zh":"很高興認識你。","topic":"交朋友開場","example":"It's really nice to meet you — I hope we run into each other again.","example_zh":"很高興認識你，希望之後還能再遇到。","note":"初次見面收尾用。搭配握手（美式）常見；有些文化偏好點頭或輕擁，觀察對方動作再回應。"},{"text":"What's the story behind that?","reading":"phr.","zh":"那背後有什麼故事嗎？","topic":"交朋友開場","example":"You have a tattoo of a compass — what's the story behind that?","example_zh":"你有個羅盤刺青，那背後有什麼故事嗎？","note":"延續話題的神句，讓對方多說。人都愛分享自己的故事，用它把閒聊變深聊。"},{"text":"Tell me more about that.","reading":"phr.","zh":"再多跟我說說。","topic":"交朋友開場","example":"You lived in Iceland for a year? Tell me more about that!","example_zh":"你在冰島住過一年？再多跟我說說！","note":"表達真心好奇、鼓勵對方繼續講。聆聽時搭配眼神接觸，西方視為投入與尊重。"},{"text":"Same here!","reading":"phr.","zh":"我也是！（有同感）","topic":"交朋友開場","example":"You're vegetarian? Same here! Let's find a place we can both eat.","example_zh":"你吃素？我也是！我們來找間都能吃的店。","note":"找到共同點時的即時回應，能快速拉近距離。比 Me too 更口語、有活力。"},{"text":"We should grab a coffee sometime.","reading":"phr.","zh":"我們改天可以去喝杯咖啡。","topic":"交朋友開場","example":"This was fun — we should grab a coffee sometime while you're in town.","example_zh":"聊得很開心，趁你還在這，我們改天去喝杯咖啡吧。","note":"從陌生人升級朋友的邀約起手式。grab a coffee 很隨性、壓力小，比直接約晚餐更好開口。"},{"text":"Can I get your number?","reading":"phr.","zh":"可以跟你要電話嗎？","topic":"交朋友開場","example":"Can I get your number, or are you on WhatsApp?","example_zh":"可以跟你要電話嗎，還是你有用WhatsApp？","note":"要聯絡方式的直接問法。旅人間更常換社群或通訊軟體；歐洲多用WhatsApp，美國多用簡訊/IG。"},{"text":"Let's keep in touch.","reading":"phr.","zh":"我們保持聯絡吧。","topic":"交朋友開場","example":"Let's keep in touch — send me a message when you get to Tokyo.","example_zh":"我們保持聯絡，你到東京時傳個訊息給我。","note":"道別時最溫暖的一句。keep in touch 有真心想繼續往來的意味，比 see you around 更進一步。"},{"text":"Do you want to join us?","reading":"phr.","zh":"你要不要一起來？","topic":"交朋友開場","example":"We're heading to the night market — do you want to join us?","example_zh":"我們要去逛夜市，你要不要一起來？","note":"臨時邀約同行的自然說法，青旅、旅途中很常見，被邀者常爽快答應。"},{"text":"That sounds great, count me in.","reading":"phr.","zh":"聽起來很棒，算我一個。","topic":"交朋友開場","example":"A day trip to the coast? That sounds great, count me in!","example_zh":"去海邊一日遊？聽起來很棒，算我一個！","note":"答應邀約的活力回應。count me in=算我一份，展現熱情，讓對方知道你真的想去。"},{"text":"Thanks for the invite, but I already have plans.","reading":"phr.","zh":"謝謝你邀我，但我已經有安排了。","topic":"交朋友開場","example":"Thanks for the invite, but I already have plans tonight. Maybe next time?","example_zh":"謝謝你邀我，但我今晚已經有安排了，下次好嗎？","note":"禮貌婉拒的黃金公式：先道謝＋給理由＋留後路（maybe next time）。直接說 No 在西方顯得冷淡。"},{"text":"I'd love to, but I'm pretty tired tonight.","reading":"phr.","zh":"我很想去，但我今晚有點累。","topic":"交朋友開場","example":"I'd love to, but I'm pretty tired tonight — rain check?","example_zh":"我很想去，但今晚有點累，改天可以嗎？","note":"I'd love to, but... 是婉拒黃金句型，先表達意願再拒絕，對方不會覺得被打槍。"},{"text":"No worries, maybe some other time.","reading":"phr.","zh":"沒關係，改天再說。","topic":"交朋友開場","example":"You can't come? No worries, maybe some other time.","example_zh":"你來不了？沒關係，改天再說。","note":"當你被對方婉拒時的體貼回應，讓對方沒有壓力。No worries 是澳洲、英美都通用的萬用寬慰語。"},{"text":"So what do you do?","reading":"phr.","zh":"你是做什麼的？（工作）","topic":"閒聊話題","example":"So what do you do? I work in marketing myself.","example_zh":"你是做什麼的？我自己是做行銷的。","note":"英美閒聊問職業的標準句，what do you do 已默認指工作。回答後常互相追問細節延續話題。"},{"text":"What are your plans for the weekend?","reading":"phr.","zh":"你週末有什麼計畫？","topic":"閒聊話題","example":"What are your plans for the weekend? Anything exciting?","example_zh":"你週末有什麼計畫？有什麼好玩的嗎？","note":"週四、週五超好用的閒聊題，同事、新朋友都適用，是拉近關係的安全話題。"},{"text":"Have you been to any good restaurants lately?","reading":"phr.","zh":"你最近有去什麼不錯的餐廳嗎？","topic":"閒聊話題","example":"Have you been to any good restaurants lately? I'm always looking for recommendations.","example_zh":"你最近有去什麼不錯的餐廳嗎？我一直在找口袋名單。","note":"美食是跨文化最安全的閒聊題，人人都有話講，還能換情報。"},{"text":"The weather's been crazy lately, hasn't it?","reading":"phr.","zh":"最近天氣很誇張對吧？","topic":"閒聊話題","example":"The weather's been crazy lately, hasn't it? It was freezing this morning.","example_zh":"最近天氣很誇張對吧？今天早上冷死了。","note":"天氣是英語圈萬年破冰題，尤其英國人。附加問句 hasn't it 邀請對方回應，讓對話滾動。"},{"text":"Have you seen any good movies recently?","reading":"phr.","zh":"你最近有看什麼好看的電影嗎？","topic":"閒聊話題","example":"Have you seen any good movies recently? I need something to watch this weekend.","example_zh":"你最近有看什麼好看的電影嗎？我週末想找片看。","note":"影劇是老少咸宜的閒聊題。若對方沒看電影，可自然轉成 What do you like to watch？"},{"text":"How was your weekend?","reading":"phr.","zh":"你週末過得如何？","topic":"閒聊話題","example":"Morning! How was your weekend? Do anything fun?","example_zh":"早安！你週末過得如何？有做什麼好玩的嗎？","note":"週一開場的黃金問候，展現關心。對方回答後記得追問一個細節才不會冷場。"},{"text":"Are you into sports?","reading":"phr.","zh":"你喜歡運動嗎？","topic":"閒聊話題","example":"Are you into sports? There's a big game on tonight.","example_zh":"你有在看運動嗎？今晚有場大比賽。","note":"be into=熱衷於，很道地。運動在很多國家是超強黏著劑，但先探口風別預設對方懂。"},{"text":"Do you have any trips coming up?","reading":"phr.","zh":"你最近有要去哪玩嗎？","topic":"閒聊話題","example":"Do you have any trips coming up? I'm dying to go somewhere warm.","example_zh":"你最近有要去哪玩嗎？我超想去溫暖的地方。","note":"旅遊是熱門話題，coming up=即將到來。旅人之間聊這個能立刻找到共鳴。"},{"text":"What kind of music are you into?","reading":"phr.","zh":"你喜歡哪種音樂？","topic":"閒聊話題","example":"What kind of music are you into? I'm always looking for new stuff.","example_zh":"你喜歡哪種音樂？我一直在找新東西聽。","note":"音樂偏好是了解一個人的好切入點，也常牽出演唱會、樂團等延伸話題。"},{"text":"Have you lived here long?","reading":"phr.","zh":"你在這裡住很久了嗎？","topic":"閒聊話題","example":"Have you lived here long? What's it like living in this city?","example_zh":"你在這裡住很久了嗎？住在這座城市感覺如何？","note":"對當地人閒聊的好開頭，能自然過渡到請對方分享在地觀點、私房景點。"},{"text":"How do you know the host?","reading":"phr.","zh":"你跟主人是怎麼認識的？","topic":"閒聊話題","example":"How do you know the host? I used to work with her.","example_zh":"你跟主人是怎麼認識的？我以前跟她共事過。","note":"派對、聚會中破冰神句，因為在場每個人都有答案，話題自然展開。"},{"text":"What's your favorite thing about this city?","reading":"phr.","zh":"你最喜歡這座城市哪一點？","topic":"閒聊話題","example":"What's your favorite thing about this city? I'm only here for a few days.","example_zh":"你最喜歡這座城市哪一點？我只待幾天。","note":"讓當地人打開話匣、分享驕傲的問法，比生硬地問景點更有溫度、更好聊。"},{"text":"Have you tried the local food yet?","reading":"phr.","zh":"你吃過在地美食了嗎？","topic":"閒聊話題","example":"Have you tried the local food yet? You have to try the dumplings here.","example_zh":"你吃過在地美食了嗎？你一定要試試這裡的水餃。","note":"旅人之間的萬用話題，還能互換必吃清單，實用又能拉近距離。"},{"text":"That reminds me of a story.","reading":"phr.","zh":"這讓我想到一個故事。","topic":"閒聊話題","example":"That reminds me of a story — the same thing happened to me in Bangkok!","example_zh":"這讓我想到一個故事，同樣的事在曼谷也發生在我身上！","note":"接話延伸的自然橋段，讓閒聊變成有來有往的分享，避免變成一問一答。"},{"text":"What made you decide to travel solo?","reading":"phr.","zh":"你怎麼會決定自己一個人旅行？","topic":"閒聊話題","example":"What made you decide to travel solo? That takes guts.","example_zh":"你怎麼會決定自己一個人旅行？很有勇氣耶。","note":"深入了解對方的問法，what made you=什麼原因讓你。加一句讚美讓對方更願意分享。"},{"text":"How do you like it so far?","reading":"phr.","zh":"你目前覺得如何？","topic":"閒聊話題","example":"You just arrived? How do you like it so far?","example_zh":"你剛到嗎？目前覺得如何？","note":"問對方對地方、活動、食物的即時感想，so far=到目前為止，是流暢閒聊的黏著句。"},{"text":"I've always wanted to visit your country.","reading":"phr.","zh":"我一直很想去你的國家。","topic":"閒聊話題","example":"You're from New Zealand? I've always wanted to visit your country!","example_zh":"你是紐西蘭來的？我一直很想去你的國家！","note":"表達對對方家鄉的興趣，能瞬間拉近距離，接著請對方推薦景點就聊不完了。"},{"text":"What's the food like where you're from?","reading":"phr.","zh":"你家鄉的食物是怎樣的？","topic":"閒聊話題","example":"What's the food like where you're from? I love trying new dishes.","example_zh":"你家鄉的食物是怎樣的？我很愛嘗鮮。","note":"美食＋家鄉雙重安全題，讓對方帶著驕傲介紹自己文化，幾乎沒有人不愛聊。"},{"text":"Do you have any siblings?","reading":"phr.","zh":"你有兄弟姊妹嗎？","topic":"閒聊話題","example":"Do you have any siblings? I'm the youngest of three.","example_zh":"你有兄弟姊妹嗎？我是三個裡最小的。","note":"聊家庭的輕鬆入門，siblings=兄弟姊妹（不分性別）。西方閒聊聊手足OK，但別急著追問婚姻小孩。"},{"text":"What's been keeping you busy lately?","reading":"phr.","zh":"你最近都在忙什麼？","topic":"閒聊話題","example":"What's been keeping you busy lately? You seem to have a lot going on.","example_zh":"你最近都在忙什麼？你好像很多事在進行。","note":"比 Are you busy 更能引出具體回答，展現關心，適合已認識、想更新近況的朋友。"},{"text":"I know what you mean.","reading":"phr.","zh":"我懂你的意思。","topic":"閒聊話題","example":"Travel can be exhausting sometimes. I know what you mean.","example_zh":"旅行有時候真的很累，我懂你的意思。","note":"表達共鳴、讓對方覺得被理解的黏著語，讓閒聊更有溫度，比只點頭更有回應感。"},{"text":"Oh really? How come?","reading":"phr.","zh":"喔真的嗎？怎麼會？","topic":"閒聊話題","example":"You're moving to Berlin? Oh really? How come?","example_zh":"你要搬去柏林？喔真的嗎？怎麼會？","note":"how come=為什麼（比 why 更口語親切），用來追問原因、表達好奇，讓對話繼續滾。"},{"text":"What do you usually do on a day off?","reading":"phr.","zh":"你休假日通常都做什麼？","topic":"閒聊話題","example":"What do you usually do on a day off? I like to just relax at home.","example_zh":"你休假日通常都做什麼？我喜歡在家放鬆。","note":"了解對方生活步調的溫和問法，也容易找到共同嗜好，是安全又能延伸的話題。"},{"text":"Anyway, it was great chatting with you.","reading":"phr.","zh":"總之，跟你聊天很開心。","topic":"閒聊話題","example":"Anyway, it was great chatting with you — I should get going.","example_zh":"總之，跟你聊天很開心，我該走了。","note":"禮貌結束閒聊的收尾句。Anyway 是自然轉場信號，暗示要告一段落，比突然離開有禮貌。"},{"text":"What's your handle?","reading":"phr.","zh":"你的帳號名稱是什麼？","topic":"網路社交","example":"What's your handle? I'll follow you back.","example_zh":"你的帳號是什麼？我會回追你。","note":"handle=社群平台的@帳號名稱，很道地。比說 username 更口語，年輕人都這樣講。"},{"text":"Let's connect on LinkedIn.","reading":"phr.","zh":"我們來加LinkedIn吧。","topic":"網路社交","example":"It was great talking business with you — let's connect on LinkedIn.","example_zh":"跟你聊生意很愉快，我們來加LinkedIn吧。","note":"LinkedIn用於職場人脈，connect 是專有動詞。旅途認識同行、想保持專業聯繫時用這個而非IG。"},{"text":"I'll send you a friend request.","reading":"phr.","zh":"我會傳好友邀請給你。","topic":"網路社交","example":"I'll send you a friend request on Facebook when I get back to the hostel.","example_zh":"我回青旅後會在臉書傳好友邀請給你。","note":"friend request=好友邀請，Facebook 用語。中年以上族群仍多用FB；年輕人偏好IG/追蹤制。"},{"text":"Follow me and I'll follow you back.","reading":"phr.","zh":"追蹤我，我會回追你。","topic":"網路社交","example":"Follow me and I'll follow you back — I post a lot about hiking.","example_zh":"追蹤我，我會回追你，我常po登山的東西。","note":"follow back=回追，IG/X的核心互動詞。互追是網路交友的入門儀式，很隨性。"},{"text":"Feel free to DM me anytime.","reading":"phr.","zh":"隨時都可以私訊我。","topic":"網路社交","example":"Feel free to DM me anytime if you need tips for Osaka.","example_zh":"如果你需要大阪的旅遊撇步，隨時私訊我。","note":"DM=direct message（私訊），可當動詞用（DM me）。feel free 讓對方沒有打擾你的顧慮。"},{"text":"I'll tag you in the photo.","reading":"phr.","zh":"我會在照片裡標註你。","topic":"網路社交","example":"That group shot came out great — I'll tag you in the photo.","example_zh":"那張合照拍得超好，我會標註你。","note":"tag=標註。標人前最好先問一聲，有些人不喜歡被公開標記，這是網路禮貌。"},{"text":"Can you send me that pic?","reading":"phr.","zh":"你可以把那張照片傳給我嗎？","topic":"網路社交","example":"Can you send me that pic? My phone died before I could take one.","example_zh":"你可以把那張照片傳給我嗎？我手機在拍之前就沒電了。","note":"pic=picture 的口語縮寫。旅途中互傳照片是延續友誼的好由頭，順便換聯絡方式。"},{"text":"Let's take a selfie!","reading":"phr.","zh":"我們來自拍一張！","topic":"網路社交","example":"This view is incredible — let's take a selfie!","example_zh":"這景色太美了，我們來自拍一張！","note":"selfie=自拍，全球通用。提議合照是自然拉近距離的動作，多數旅人都樂意。"},{"text":"I'll add you on WhatsApp.","reading":"phr.","zh":"我用WhatsApp加你。","topic":"網路社交","example":"What's your number? I'll add you on WhatsApp.","example_zh":"你電話幾號？我用WhatsApp加你。","note":"WhatsApp 是歐洲、中南美、東南亞的主流通訊軟體，出國交友記得裝，比簡訊更常用。"},{"text":"Did you see my message?","reading":"phr.","zh":"你有看到我的訊息嗎？","topic":"網路社交","example":"Hey, did you see my message? I sent you the address for tomorrow.","example_zh":"嘿，你有看到我的訊息嗎？我把明天的地址傳給你了。","note":"追訊息的自然問法，語氣中性不催促。對方已讀不回時別急，文化不同回覆速度差很多。"},{"text":"I'll shoot you a text.","reading":"phr.","zh":"我會傳訊息給你。","topic":"網路社交","example":"Once I book the tickets, I'll shoot you a text.","example_zh":"我一訂好票就傳訊息給你。","note":"shoot someone a text=傳個簡訊給某人，很美式口語，比 send a message 更隨性有活力。"},{"text":"Let's start a group chat.","reading":"phr.","zh":"我們來開個群組。","topic":"網路社交","example":"There are six of us now — let's start a group chat to plan the trip.","example_zh":"現在我們有六個人，來開個群組規劃行程吧。","note":"group chat=群組聊天。一群旅伴要協調行程時超實用，開群組是團體約玩的標配。"},{"text":"I posted a story about it.","reading":"phr.","zh":"我發了一則限時動態。","topic":"網路社交","example":"The concert was amazing — I posted a story about it, check it out!","example_zh":"演唱會超讚，我發了限動，去看看！","note":"story=IG/FB限時動態（24小時消失）。post a story 是分享日常的主要方式，年輕人溝通的一環。"},{"text":"What's your username so I can find you?","reading":"phr.","zh":"你的帳號名是什麼，這樣我才找得到你？","topic":"網路社交","example":"What's your username so I can find you? There are a lot of similar names.","example_zh":"你的帳號名是什麼，我才找得到你？同名的很多。","note":"當名字太菜市場搜不到時的問法，直接要精確帳號名比用真名找更快。"},{"text":"Just scan my QR code.","reading":"phr.","zh":"掃我的QR碼就好。","topic":"網路社交","example":"Easier to just scan my QR code — here, let me pull it up.","example_zh":"掃我的QR碼比較快，來，我調出來。","note":"IG、LINE、微信都有加好友QR碼，當場掃最快又不會拼錯帳號，跨語言時特別好用。"},{"text":"I don't really use Facebook anymore.","reading":"phr.","zh":"我現在不太用臉書了。","topic":"網路社交","example":"I don't really use Facebook anymore — is Instagram okay?","example_zh":"我現在不太用臉書了，用IG可以嗎？","note":"婉轉表達自己不用某平台、改推薦別的。順便反問對方偏好，避免加了卻不常上線。"},{"text":"I'll drop you my number.","reading":"phr.","zh":"我把電話給你。","topic":"網路社交","example":"I'll drop you my number in case you need anything while I'm in town.","example_zh":"我把電話給你，我還在這時你有需要都可以找我。","note":"drop someone your number=把號碼給某人，口語隨性。in case=以防萬一，展現願意幫忙的善意。"},{"text":"Sorry for the late reply.","reading":"phr.","zh":"抱歉這麼晚才回。","topic":"網路社交","example":"Sorry for the late reply — I've been traveling with no signal.","example_zh":"抱歉這麼晚才回，我一直在旅行沒訊號。","note":"回覆遲了的禮貌開場，附個理由更周到。西方朋友對慢回多半理解，不必過度道歉。"},{"text":"Let's plan to meet up when you're in town.","reading":"phr.","zh":"你來的時候我們約見面。","topic":"網路社交","example":"You're coming to Taipei next month? Let's plan to meet up when you're in town!","example_zh":"你下個月要來台北？你來的時候我們約見面！","note":"meet up=碰面聚聚。把網路友誼延伸到現實的關鍵句，展現真心想再見面，不只是客套。"},{"text":"Thanks for the follow!","reading":"phr.","zh":"謝謝你追蹤我！","topic":"網路社交","example":"Thanks for the follow! Loved meeting you at the hostel.","example_zh":"謝謝你追蹤我！很開心在青旅認識你。","note":"被追蹤後回個訊息破冰，順勢私訊聊起來。是把「互追」變成「真朋友」的小動作。"},{"text":"Can I share this photo of us?","reading":"phr.","zh":"我可以分享這張我們的合照嗎？","topic":"網路社交","example":"Can I share this photo of us? I'll ask before I post anything with you in it.","example_zh":"我可以分享這張我們的合照嗎？有你入鏡的我都會先問。","note":"貼有他人的照片前先徵求同意，是重要的網路禮貌，也是尊重隱私的加分表現。"},{"text":"My inbox is always open.","reading":"phr.","zh":"我的私訊隨時歡迎。","topic":"網路社交","example":"If you ever want travel advice, my inbox is always open.","example_zh":"如果你需要旅遊建議，我的私訊隨時歡迎。","note":"溫暖的收尾邀請，inbox=私訊收件匣。表示樂意保持聯絡，讓對方感覺被歡迎。"},{"text":"Let me screenshot that.","reading":"phr.","zh":"我截個圖。","topic":"網路社交","example":"That restaurant recommendation looks great — let me screenshot that.","example_zh":"那間餐廳推薦看起來很棒，我截個圖。","note":"screenshot 可當動詞。旅途中截圖存地址、地圖、推薦超實用，也是聊天時的自然動作。"},{"text":"Do you use LINE or WhatsApp?","reading":"phr.","zh":"你是用LINE還是WhatsApp？","topic":"網路社交","example":"Do you use LINE or WhatsApp? I want to make sure we can stay in touch.","example_zh":"你是用LINE還是WhatsApp？我想確認我們能保持聯絡。","note":"各國主流通訊軟體不同（台日韓用LINE、歐美中南美用WhatsApp），先問清楚才不會白加。"},{"text":"Can you help me? This is an emergency.","reading":"phr.","zh":"你可以幫我嗎？這是緊急狀況。","topic":"緊急狀況","example":"Can you help me? This is an emergency — my friend just collapsed.","example_zh":"你可以幫我嗎？這是緊急狀況，我朋友剛剛昏倒了。","note":"求救的第一句，明確說出 emergency 讓對方立刻進入狀況、優先處理。"},{"text":"Call an ambulance!","reading":"phr.","zh":"叫救護車！","topic":"緊急狀況","example":"Call an ambulance! Someone's hurt over here.","example_zh":"叫救護車！這裡有人受傷了。","note":"危急時直接下指令。歐洲通用緊急電話112、美國911、英國999，先記下當地號碼。"},{"text":"I need to see a doctor.","reading":"phr.","zh":"我需要看醫生。","topic":"緊急狀況","example":"I'm not feeling well — I need to see a doctor. Is there a clinic nearby?","example_zh":"我不太舒服，我需要看醫生，附近有診所嗎？","note":"身體不適求助的標準句。clinic=診所（小病），hospital=醫院（急重症），先分清楚。"},{"text":"Where's the nearest hospital?","reading":"phr.","zh":"最近的醫院在哪？","topic":"緊急狀況","example":"Where's the nearest hospital? I think I need stitches.","example_zh":"最近的醫院在哪？我想我需要縫幾針。","note":"受傷時最關鍵的一問。stitches=縫針。出國前記下投保的海外急難救助電話備用。"},{"text":"I've lost my passport.","reading":"phr.","zh":"我護照弄丟了。","topic":"緊急狀況","example":"I've lost my passport — what should I do? Is there an embassy in this city?","example_zh":"我護照弄丟了，我該怎麼辦？這城市有大使館嗎？","note":"護照遺失先報警拿報案證明，再聯絡我國駐外館處（台灣是外交部或代表處）補發。"},{"text":"My wallet was stolen.","reading":"phr.","zh":"我的錢包被偷了。","topic":"緊急狀況","example":"My wallet was stolen on the train — I need to report it to the police.","example_zh":"我的錢包在火車上被偷了，我需要報警。","note":"stolen（被偷）不同於 lost（弄丟），保險理賠常要求警方報案證明，用詞要精準。"},{"text":"I need to report a theft.","reading":"phr.","zh":"我要報案（失竊）。","topic":"緊急狀況","example":"I need to report a theft. Can you tell me where the police station is?","example_zh":"我要報失竊案，可以告訴我警察局在哪嗎？","note":"theft=竊盜。到警局說這句，對方就知道要幫你做筆錄、開報案證明給保險用。"},{"text":"Someone's following me.","reading":"phr.","zh":"有人在跟蹤我。","topic":"緊急狀況","example":"Someone's following me — can I walk with you to the main street?","example_zh":"有人在跟蹤我，我可以跟你一起走到大馬路嗎？","note":"感到危險時就近向店家或人群求助。走進商店、找店員是比獨自逃跑更安全的做法。"},{"text":"I feel dizzy and sick.","reading":"phr.","zh":"我覺得頭暈想吐。","topic":"緊急狀況","example":"I feel dizzy and sick — I think I need to sit down.","example_zh":"我覺得頭暈想吐，我想我需要坐下來。","note":"描述症狀讓旁人判斷嚴重度。dizzy=頭暈、nauseous/sick=噁心想吐，症狀講清楚才好求助。"},{"text":"I think I'm having an allergic reaction.","reading":"phr.","zh":"我想我過敏發作了。","topic":"緊急狀況","example":"I think I'm having an allergic reaction — my throat feels tight.","example_zh":"我想我過敏發作了，我喉嚨覺得緊緊的。","note":"過敏反應可能致命，喉嚨緊、呼吸困難要立刻求救。有 EpiPen（腎上腺素筆）者隨身攜帶。"},{"text":"I've been in an accident.","reading":"phr.","zh":"我出車禍了／我發生意外了。","topic":"緊急狀況","example":"I've been in an accident — no one's badly hurt, but we need the police.","example_zh":"我出車禍了，沒人重傷，但我們需要報警。","note":"accident 泛指意外（車禍、跌倒等）。租車出遊要保全險，事故現場先拍照存證再處理。"},{"text":"I need to cancel my credit card.","reading":"phr.","zh":"我需要停掉我的信用卡。","topic":"緊急狀況","example":"My card was stolen — I need to cancel my credit card right away.","example_zh":"我的卡被偷了，我需要馬上停卡。","note":"卡片遺失被盜立即打發卡行掛失。出國前把銀行海外客服電話另存一份，錢包被偷才找得到。"},{"text":"Is there a pharmacy open right now?","reading":"phr.","zh":"現在有藥局開著嗎？","topic":"緊急狀況","example":"Is there a pharmacy open right now? I need something for a fever.","example_zh":"現在有藥局開著嗎？我需要退燒的藥。","note":"pharmacy（美）/chemist（英）=藥局。很多國家藥師可給成藥建議，小病先問藥師省時。"},{"text":"I lost my phone.","reading":"phr.","zh":"我手機掉了。","topic":"緊急狀況","example":"I lost my phone — can I use yours to call my hotel?","example_zh":"我手機掉了，可以借你的打給我飯店嗎？","note":"手機遺失先借電話聯絡，並用他人裝置遠端鎖定/清除。事先記幾個重要號碼在紙上。"},{"text":"Can I borrow your phone? It's urgent.","reading":"phr.","zh":"可以借你手機嗎？很緊急。","topic":"緊急狀況","example":"Can I borrow your phone? It's urgent — I need to reach my family.","example_zh":"可以借你手機嗎？很緊急，我需要聯絡家人。","note":"強調 urgent 讓對方願意出借。借手機時當著對方面撥打，能減少對方戒心。"},{"text":"I don't feel safe here.","reading":"phr.","zh":"我在這裡覺得不安全。","topic":"緊急狀況","example":"I don't feel safe here — could you help me get a taxi?","example_zh":"我在這裡覺得不安全，可以幫我叫台計程車嗎？","note":"直接說出不安全的感受並提出具體請求。相信直覺，感覺不對就趕快離開現場。"},{"text":"Please leave me alone.","reading":"phr.","zh":"請你離我遠一點／別煩我。","topic":"緊急狀況","example":"Please leave me alone. I'm not interested.","example_zh":"請你離我遠一點，我沒興趣。","note":"被糾纏騷擾時的堅定拒絕，語氣要果斷。堅定＞禮貌，必要時提高音量引起旁人注意。"},{"text":"Where can I find the lost and found?","reading":"phr.","zh":"失物招領處在哪？","topic":"緊急狀況","example":"I left my bag on the bus — where can I find the lost and found?","example_zh":"我把包包忘在公車上了，失物招領處在哪？","note":"lost and found（美）/lost property（英）=失物招領。車站、機場、景點多半設有，別急著放棄。"},{"text":"I need to contact my embassy.","reading":"phr.","zh":"我需要聯絡我的大使館。","topic":"緊急狀況","example":"This is serious — I need to contact my embassy right away.","example_zh":"這很嚴重，我需要立刻聯絡我的大使館。","note":"護照遺失、被捕、重大意外時聯繫駐外館處。台灣旅客可撥外交部旅外急難救助專線。"},{"text":"Could you call the police for me?","reading":"phr.","zh":"可以幫我報警嗎？","topic":"緊急狀況","example":"Could you call the police for me? I don't speak the language well.","example_zh":"可以幫我報警嗎？我當地語言講不太好。","note":"語言不通時請當地人代為報警最有效，對方能把細節講清楚，也能幫忙溝通。"},{"text":"I'm not feeling well.","reading":"phr.","zh":"我人不太舒服。","topic":"緊急狀況","example":"I'm not feeling well — I might need to lie down for a bit.","example_zh":"我人不太舒服，我可能需要躺一下。","note":"身體不適的通用委婉說法，適合先告知同行者或求助。症狀嚴重再具體描述給醫護。"},{"text":"Is there a doctor who speaks English?","reading":"phr.","zh":"有會講英文的醫生嗎？","topic":"緊急狀況","example":"Is there a doctor who speaks English? I want to describe my symptoms clearly.","example_zh":"有會講英文的醫生嗎？我想把症狀講清楚。","note":"在非英語系國家就醫時很關鍵。也可先問飯店櫃檯推薦有英語服務的診所或國際醫院。"},{"text":"It hurts right here.","reading":"phr.","zh":"這裡痛。","topic":"緊急狀況","example":"It hurts right here when I press on it.","example_zh":"我按這裡的時候會痛。","note":"看醫生時語言不通，用手指位置＋這句最直接。搭配比劃身體部位，醫護就能懂。"},{"text":"Help! Somebody, please!","reading":"phr.","zh":"救命！誰來幫幫忙！","topic":"緊急狀況","example":"Help! Somebody, please — call the police!","example_zh":"救命！誰來幫幫忙！快報警！","note":"危急時最直接的呼救。大聲喊叫吸引注意本身就是自保手段，別怕引人側目。"}],"grammar":[],"lessons":[{"id":"tv-01","title":"機場到飯店一路通","subtitle":"報到、安檢、入境、搭車到入住，一條龍關鍵句","minutes":8,"sections":[{"type":"text","body":"出國第一關不是玩，是「移動」：報到櫃檯→安檢→飛機→入境審查→搭車→飯店入住。好消息是，這整條路上的英文對話【劇本幾乎是固定的】——對方會問什麼、你該答什麼，九成可以事先準備。\n\n先給你一個萬用心法：聽不懂時不要慌，這條路上的問題大多是【資訊確認題】，對方要的只是：你是誰（護照）、去哪裡（目的地）、待多久（天數）、做什麼（觀光）。抓住這四件事，就算單字沒全聽懂，也猜得到他在問什麼。\n\n另一個保命句先背起來：Could you say that again, please?（可以請你再說一次嗎？）說這句完全不丟臉，機場人員每天都在講。"},{"type":"sounds","title":"點擊聽發音：報到與安檢","items":[{"text":"I'd like to check in for my flight to Tokyo.","sub":"I'd like to... 是最禮貌好用的開場","zh":"我想辦理飛東京的登機報到。"},{"text":"Can I have a window seat, please?","sub":"aisle seat 就是走道位","zh":"可以給我靠窗的座位嗎？"},{"text":"I have one bag to check and one carry-on.","sub":"check＝託運；carry-on＝隨身行李","zh":"我有一件託運行李和一件隨身行李。"},{"text":"Please take out your laptop and liquids.","sub":"安檢人員的高頻指令，聽懂就好","zh":"請把筆電和液體拿出來。"},{"text":"Do I need to take off my shoes?","sub":"take off＝脫掉，不確定就直接問","zh":"我需要脫鞋嗎？"}]},{"type":"table","title":"入境審查問答劇本：他問什麼、你答什麼","headers":["審查官會問","意思","你的標準答案"],"rows":[["What's the purpose of your visit?","來做什麼？","Sightseeing. / I'm here on vacation.（觀光／度假）"],["How long will you be staying?","待多久？","Five days.（直接說天數最乾脆）"],["Where will you be staying?","住哪裡？","At the ABC Hotel in Shinjuku.（說飯店名，訂房單先印好）"],["Is this your first visit?","第一次來嗎？","Yes, it is. / No, this is my second time."],["Do you have a return ticket?","有回程機票嗎？","Yes, here it is.（邊說邊出示）"]]},{"type":"tip","body":"入境審查的鐵則：【答案越短越好】。他問 How long will you be staying? 你回 Five days. 就夠了，不用造完整句子。多說反而容易講錯或引來更多問題。記住：這不是口說考試，是資訊確認。"},{"type":"sounds","title":"點擊聽發音：搭車與入住","items":[{"text":"Where can I catch the airport shuttle?","sub":"shuttle＝接駁車；也可換成 bus / train / taxi","zh":"我要在哪裡搭機場接駁車？"},{"text":"Does this bus go to the city center?","sub":"Does this ___ go to ___? 是萬用確認句","zh":"這班巴士有到市中心嗎？"},{"text":"Could you take me to this hotel, please?","sub":"搭計程車直接秀出飯店地址最保險","zh":"可以載我到這間飯店嗎？"},{"text":"I have a reservation under the name Chen.","sub":"under the name＋姓氏＝用某某名字訂的","zh":"我有訂房，姓陳。"},{"text":"What time is check-out?","sub":"順便問 Is breakfast included?（含早餐嗎）","zh":"退房時間是幾點？"},{"text":"Could I have a late check-out?","sub":"Could I have...? 提出請求的黃金句型","zh":"可以讓我晚一點退房嗎？"}]},{"type":"quiz","title":"小試身手","questions":[{"question":"入境審查官問你 What's the purpose of your visit?，最合適的回答是？","options":["Five days.","Sightseeing.","At the ABC Hotel.","Yes, it is."],"answer":1,"explain_zh":"purpose＝目的，他在問你來做什麼，回 Sightseeing.（觀光）就對了。Five days. 是回答待多久，At the ABC Hotel. 是回答住哪裡——問句抓「關鍵字」就不會答錯格。"},{"question":"你在報到櫃檯想要走道座位，該怎麼說？","options":["Can I have an aisle seat, please?","Please take out your laptop.","I have one bag to check.","What time is check-out?"],"answer":0,"explain_zh":"aisle seat＝走道位（aisle 的 s 不發音，唸起來跟英文 I'll 一樣，像中文的「愛歐」再收一個 l 音），window seat＝靠窗位。Can I have..., please? 是點什麼、要什麼都能用的萬用請求句。"},{"question":"到了飯店櫃檯，你想說「我有訂房，姓陳」，哪句正確？","options":["I want a room now.","Do I need to take off my shoes?","I have a reservation under the name Chen.","Does this bus go to the city center?"],"answer":2,"explain_zh":"reservation＝預訂，under the name＋姓氏是報訂房大名的固定講法。I want a room now. 文法沒錯但像沒訂房又態度很衝，別用。"},{"question":"審查官講太快你沒聽懂，最好的反應是？","options":["保持沉默，點頭微笑","說 Could you say that again, please?","隨便回答 Yes","轉頭離開隊伍"],"answer":1,"explain_zh":"沒聽懂就請對方再說一次，這在機場非常正常。亂答 Yes 最危險——萬一他問的是「你有帶違禁品嗎」就麻煩大了。"},{"question":"你想確認這班車有沒有到市中心，該用哪句？","options":["Where is the city center?","I'd like to check in.","Could I have a late check-out?","Does this bus go to the city center?"],"answer":3,"explain_zh":"Does this ___ go to ___? 是交通確認萬用句，把 bus 換成 train、把目的地換掉就能走遍全世界。Where is...? 是問地點在哪，不是問車到不到。"}]}]},{"id":"tv-02","title":"吃飯購物實戰","subtitle":"點餐客製、結帳、退換貨、殺價的句型公式","minutes":8,"sections":[{"type":"text","body":"吃飯和購物是旅行中開口頻率最高的場景，而且有一個共同的核心句型，先把它刻在腦子裡：\n\n【Could I have ＋ 想要的東西 ＋ , please?】\n\n點餐：Could I have the pasta, please?\n要求：Could I have the bill, please?（結帳）\n購物：Could I have a smaller size, please?\n\n一個句型打天下。接下來的重點是【客製化】——出國吃飯最怕的不是點不到餐，是點到不敢吃的東西。記住兩個公式：\n\n・不要某東西：【without ＋ 食材】→ Could I have it without cilantro?（不要香菜）\n・改成某東西：【with ＋ 食材 ＋ instead】→ With rice instead, please.（換成飯）"},{"type":"sounds","title":"點擊聽發音：點餐與修改需求","items":[{"text":"Could I see the menu, please?","sub":"入座後的第一句","zh":"可以給我看菜單嗎？"},{"text":"What do you recommend?","sub":"不知道點什麼就問這句，店員最愛答","zh":"你推薦什麼？"},{"text":"Could I have this without onions?","sub":"without＋食材＝不要加","zh":"這道可以不要加洋蔥嗎？"},{"text":"Does this contain peanuts? I'm allergic.","sub":"allergic＝過敏，有過敏一定要先講","zh":"這裡面有花生嗎？我會過敏。"},{"text":"Could we get separate checks?","sub":"分開結帳；一起結是 one check","zh":"我們可以分開結帳嗎？"},{"text":"Could I have the bill, please?","sub":"美式常說 check，英式常說 bill，都通","zh":"麻煩幫我結帳。"}]},{"type":"table","title":"購物三大情境句型公式","headers":["情境","句型公式","例句"],"rows":[["試穿試用","Can I try ___ on?","Can I try this on?（我可以試穿這件嗎）"],["換尺寸顏色","Do you have this in ___?","Do you have this in a medium / in black?（有 M 號／黑色嗎）"],["退貨","I'd like to return this. + 原因","I'd like to return this. It doesn't fit.（不合身）"],["換貨","Could I exchange this for ___?","Could I exchange this for a larger size?（換大一號）"],["殺價","Could you give me a discount if ___?","Could you give me a discount if I buy two?（買兩件有折扣嗎）"]]},{"type":"tip","body":"殺價小心機：先問 Is this your best price?（這是最低價了嗎），比直接喊 Too expensive! 有禮貌又有效。在市集殺價可以玩「轉身走」戰術，但百貨公司和連鎖店是不二價的，開口殺價反而尷尬。另外，退換貨一定要帶收據——店員第一句幾乎都是 Do you have the receipt?（receipt 的 p 不發音，唸「瑞西特」）。"},{"type":"sounds","title":"點擊聽發音：結帳、退換貨、殺價","items":[{"text":"Do you take credit cards?","sub":"take＝接受；付現金是 pay in cash","zh":"你們收信用卡嗎？"},{"text":"I'd like to return this. Here's my receipt.","sub":"退貨句＋收據，一次到位","zh":"我想退這個，這是我的收據。"},{"text":"Could I exchange this for a different color?","sub":"exchange A for B＝用A換B","zh":"我可以換不同顏色的嗎？"},{"text":"Is this your best price?","sub":"殺價起手式，語氣要笑笑的","zh":"這是最低價了嗎？"},{"text":"I'll take it if you can do twenty dollars.","sub":"I'll take it＝我買了；do＋價格＝算這個價","zh":"如果算我二十美金，我就買。"}]},{"type":"quiz","title":"小試身手","questions":[{"question":"你對香菜過敏，點餐時想說「這道不要加香菜」，該怎麼說？","options":["Could I have this without cilantro?","Could I have more cilantro?","I'll take the cilantro.","Do you have this in cilantro?"],"answer":0,"explain_zh":"without＋食材＝不要加。第二句是「多加香菜」，正好相反；有過敏最好再補一句 I'm allergic.（我會過敏），店家會特別小心。"},{"question":"吃完飯想請店員結帳，下面哪句最自然？","options":["Give me money.","Could I have the bill, please?","What do you recommend?","Can I try this on?"],"answer":1,"explain_zh":"the bill（英式）或 the check（美式）都是帳單，配上 Could I have..., please? 就是標準結帳句。Give me money. 意思是「給我錢」——這是搶劫，不是結帳。"},{"question":"你買的衣服不合身想退貨，進店第一句該說？","options":["Is this your best price?","Does this contain peanuts?","I'd like to return this. It doesn't fit.","Could we get separate checks?"],"answer":2,"explain_zh":"return＝退貨，補一句原因 It doesn't fit.（不合身）更順利。記得帶收據，店員八成會問 Do you have the receipt?"},{"question":"在市集看上一個包，想試探能不能便宜一點，最得體的開場是？","options":["This is garbage.","I have no money.","Give me a discount now.","Is this your best price?"],"answer":3,"explain_zh":"Is this your best price? 是禮貌又有效的殺價起手式。批評商品或命令對方降價只會讓氣氛變僵——殺價是談笑，不是吵架。"},{"question":"結帳前你問店員 Do you take credit cards?，這裡的 take 是什麼意思？","options":["拿走","搭乘","接受（某種付款方式）","花費時間"],"answer":2,"explain_zh":"take 在付款情境＝接受：Do you take credit cards?＝你們收信用卡嗎。順便記：pay in cash＝付現金、tap to pay＝感應支付。"}]}]},{"id":"tv-03","title":"交朋友開場白","subtitle":"搭話、聊下去、換聯絡方式、邀約與婉拒","minutes":8,"sections":[{"type":"text","body":"旅行最美的紀念品常常是「人」。但很多人卡在第一步：怎麼開口？先記住搭話的黃金原則——【從當下共享的情境開場】，而不是憑空自我介紹。你們正在排同一個隊、看同一場表演、住同一間青旅，這就是最自然的開場素材：\n\n・Is this seat taken?（這位子有人坐嗎？）\n・The view is amazing, isn't it?（風景超美的，對吧？）\n・Are you traveling too?（你也在旅行嗎？）\n\n安全話題清單：旅行計畫、食物、對方國家、興趣嗜好。地雷話題：薪水、年齡、感情狀態、政治宗教——初次見面先避開，就像你也不希望陌生人一開口就問你薪水多少。"},{"type":"sounds","title":"點擊聽發音：自然開場白","items":[{"text":"Hi! Is this seat taken?","sub":"咖啡廳、車站、青旅交誼廳都好用","zh":"嗨！這個位子有人坐嗎？"},{"text":"Where are you from?","sub":"旅人之間的國民問候","zh":"你來自哪裡？"},{"text":"How long have you been traveling?","sub":"問旅程，話匣子直接打開","zh":"你旅行多久了？"},{"text":"This place is amazing, isn't it?","sub":"句尾 isn't it? 是找認同的搭話神器","zh":"這地方超棒的，對吧？"},{"text":"I'm from Taiwan. Have you ever been there?","sub":"介紹自己順便丟話題給對方","zh":"我來自台灣，你去過嗎？"}]},{"type":"text","body":"開場成功後，怎麼讓對話不冷掉？祕訣是【follow-up 三連技】：\n\n1.【追問細節】：對方說去過京都 → Really? What was your favorite part?（真的？你最喜歡哪部分？）\n2.【分享自己】：對方答完，補一句自己的經驗 → I've always wanted to go there!（我一直很想去！）\n3.【拋回問題】：用 What about you?（那你呢？）或 How about you? 把球丟回去。\n\n公式：【對方說 A → 追問 A 的細節 → 分享你和 A 的關聯 → 拋回問題】。只要循環這一套，聊三十分鐘不是問題。萬用反應詞也備幾個：Really?（真的嗎）、That sounds amazing!（聽起來超棒）、No way!（不會吧）——有反應，對方才有動力繼續說。"},{"type":"sounds","title":"點擊聽發音：換聯絡方式、邀約與婉拒","items":[{"text":"It was really nice talking to you.","sub":"收尾或換聯絡方式前的緩衝句","zh":"跟你聊天真的很開心。"},{"text":"Can I add you on Instagram?","sub":"add you on＋平台名，換 WhatsApp / LINE 都通","zh":"我可以加你的 Instagram 嗎？"},{"text":"Let's keep in touch!","sub":"keep in touch＝保持聯絡","zh":"我們保持聯絡吧！"},{"text":"A few of us are grabbing dinner tonight. Want to join us?","sub":"grab＋餐＝隨性吃一頓；Want to join us? 超好用","zh":"我們幾個今晚要去吃晚餐，要一起來嗎？"},{"text":"I'd love to, but I have an early flight tomorrow.","sub":"婉拒公式：I'd love to, but＋理由","zh":"我很想去，但我明天一早的飛機。"},{"text":"Maybe next time! Enjoy your trip!","sub":"婉拒後的暖心收尾","zh":"下次吧！祝你玩得開心！"}]},{"type":"tip","body":"婉拒的黃金公式：【I'd love to, but ＋ 理由】。先說 I'd love to（我很想）再說 but，對方感受到的是「你想來但來不了」，而不是「你不想來」。直接說 No, I can't. 文法正確但溫度是零。反過來，如果你被婉拒了也別往心裡去——回一句 No worries! Maybe next time!（沒關係，下次吧）就是最漂亮的風度。"},{"type":"quiz","title":"小試身手","questions":[{"question":"在青旅交誼廳想跟旁邊的旅人搭話，哪句開場最自然？","options":["How much money do you make?","How old are you?","Hi! Is this seat taken?","Are you single?"],"answer":2,"explain_zh":"從當下情境開場最自然，Is this seat taken? 就是經典起手式。薪水、年齡、感情狀態都是初次見面的地雷話題，再熟一點再說。"},{"question":"對方說 I just came back from Kyoto.（我剛從京都回來），最能讓對話聊下去的回應是？","options":["OK.","Really? What was your favorite part?","I see. Goodbye!","That's your problem."],"answer":1,"explain_zh":"follow-up 第一招：追問細節。Really? 先給反應，再問 What was your favorite part? 讓對方有得說。只回 OK. 等於親手把對話掐熄。"},{"question":"聊得很開心，想跟對方交換 Instagram，該怎麼說？","options":["Give me your phone.","You must follow me.","Can I add you on Instagram?","What's your password?"],"answer":2,"explain_zh":"Can I add you on ＋平台名，是換聯絡方式的標準句，前面加一句 It was really nice talking to you. 更自然。Give me your phone. 是「把手機給我」，聽起來像搶手機。"},{"question":"新朋友約你晚上聚餐，但你明早要趕飛機，最得體的婉拒是？","options":["No.","I'd love to, but I have an early flight tomorrow.","Don't ask me again.","I don't like dinner."],"answer":1,"explain_zh":"婉拒公式＝I'd love to, but＋理由：先表達「我很想」，再給原因，對方完全不會受傷。結尾再補 Maybe next time! 就滿分了。"},{"question":"想用「那你呢？」把問題拋回給對方，英文該說？","options":["What about you?","Who are you?","So what?","You again?"],"answer":0,"explain_zh":"What about you?（或 How about you?）是把球丟回去的萬用句，讓對話你來我往。So what?（那又怎樣）是嗆聲用的，千萬別搞混。"}]}]}]},"japanese":{"language":"japanese","display_name_zh":"日文","alphabet":[{"char":"あ","roman":"a","group":"hiragana"},{"char":"い","roman":"i","group":"hiragana"},{"char":"う","roman":"u","group":"hiragana"},{"char":"え","roman":"e","group":"hiragana"},{"char":"お","roman":"o","group":"hiragana"},{"char":"か","roman":"ka","group":"hiragana"},{"char":"き","roman":"ki","group":"hiragana"},{"char":"く","roman":"ku","group":"hiragana"},{"char":"け","roman":"ke","group":"hiragana"},{"char":"こ","roman":"ko","group":"hiragana"},{"char":"さ","roman":"sa","group":"hiragana"},{"char":"し","roman":"shi","group":"hiragana"},{"char":"す","roman":"su","group":"hiragana"},{"char":"せ","roman":"se","group":"hiragana"},{"char":"そ","roman":"so","group":"hiragana"},{"char":"た","roman":"ta","group":"hiragana"},{"char":"ち","roman":"chi","group":"hiragana"},{"char":"つ","roman":"tsu","group":"hiragana"},{"char":"て","roman":"te","group":"hiragana"},{"char":"と","roman":"to","group":"hiragana"},{"char":"な","roman":"na","group":"hiragana" ょう","reading":"いっしょによいちにいきましょう issho ni yoichi ni ikimashou","zh":"一起去逛夜市吧","topic":"邀約出遊","example":"","example_zh":"","note":"帶日本朋友逛台灣夜市超受歡迎；「ましょう」的語氣比「ませんか」更積極。","distractors_zh":["一起去夜店吧","晚上一起去市場買菜吧","一起去看夜景吧","一起去逛早市吧","一起去吃宵夜吧","你去過夜市嗎？"],"level":"N5","casual":{"text":"一緒に夜市行こうよ","reading":"いっしょによいちいこうよ issho ni yoichi ikou yo","note":"朋友間的積極邀約；省略「に」＋意向形「行こう」＋「よ」，是最自然的口語節奏。"}},{"text":"遅れてすみません","reading":"おくれてすみません okurete sumimasen","zh":"抱歉，我遲到了","topic":"邀約出遊","example":"","example_zh":"","note":"日本文化非常重視守時，會遲到最好提前傳訊息，見面時先道歉。","distractors_zh":["抱歉，這麼晚打擾你","抱歉，我快遲到了","抱歉，我會晚一點到","抱歉，我忘記了","抱歉，我睡過頭了","抱歉，我先走一步了"],"level":"N5","casual":{"text":"ごめん、遅れた！","reading":"ごめん、おくれた gomen, okureta","note":"對朋友遲到道歉；更誠懇可說「ほんとごめん！」。對上司、長輩必須用「遅れてすみません／申し訳ありません」。"}},{"text":"お花見に行きませんか","reading":"おはなみにいきませんか ohanami ni ikimasen ka","zh":"要不要去賞櫻？","topic":"邀約出遊","example":"","example_zh":"","note":"春天限定的邀約；賞櫻是日本重要的社交活動，跟朋友野餐聊天。","distractors_zh":["要不要去看煙火？","要不要去逛花市？","要不要去賞楓？","要不要去賞月？","要不要去買花？","要不要去野餐？"],"level":"N5","casual":{"text":"花見行かない？","reading":"はなみいかない hanami ikanai","note":"朋友間春天的邀約；去掉美化語「お」、改用「〜ない？」句型，隨性許多。"}},{"text":"お腹がすきました","reading":"おなかがすきました onaka ga sukimashita","zh":"我肚子餓了","topic":"吃飯聊天","example":"","example_zh":"","note":"朋友間常說常體的「お腹すいた」。","distractors_zh":["我肚子好痛","我口好渴","我沒什麼食慾","我吃得好飽","位子空出來了","這道菜我很喜歡"],"level":"N5","casual":{"text":"お腹すいた","reading":"おなかすいた onaka suita","note":"朋友、家人之間喊餓；男生粗獷一點會說「腹減った」。對長輩用「お腹がすきました」較妥。"}},{"text":"何を食べたいですか","reading":"なにをたべたいですか nani o tabetai desu ka","zh":"你想吃什麼？","topic":"吃飯聊天","example":"","example_zh":"","note":"「動詞ます形去ます＋たい」表示想做某事。","distractors_zh":["你吃了什麼？","你吃過飯了嗎？","有什麼好吃的？","你想喝什麼？","你想做什麼菜？","有什麼不敢吃的嗎？"],"level":"N5","casual":{"text":"何食べたい？","reading":"なにたべたい nani tabetai","note":"朋友間討論吃什麼的高頻句；省略「を」和「ですか」。"}},{"text":"いただきます","reading":"いただきます itadakimasu","zh":"開動了（我要吃了）","topic":"吃飯聊天","example":"","example_zh":"","note":"吃飯前必說，表達對食物與做菜者的感謝，是重要的餐桌禮儀。","distractors_zh":["請慢用（請對方享用）","謝謝招 ","reading":"たんじょうびいつ tanjoubi itsu","note":"朋友間；省略「は」和「ですか」。"}},{"text":"何歳ですか","reading":"なんさいですか nansai desu ka","zh":"你幾歲？","topic":"數字時間","example":"","example_zh":"","note":"問年齡在日本較敏感，熟了再問比較好；更客氣的說法是「おいくつですか」。","distractors_zh":["你幾年級？","你屬什麼生肖？","你哪一年出生的？","你們差幾歲？","你是什麼星座？","你有幾個兄弟姊妹？"],"level":"N5","casual":{"text":"いくつ？","reading":"いくつ ikutsu","note":"熟朋友之間才能問年齡；日本人不太問初見面的人年齡，問長輩年齡更是大忌。"}},{"text":"すみません","reading":"すみません sumimasen","zh":"不好意思／抱歉／謝謝","topic":"求助應急","example":"","example_zh":"","note":"叫住店員、問路、道歉、道謝都可用，是日本生活最高頻的一個詞。","distractors_zh":["沒關係／不要緊","不客氣（回應道謝時）","萬分抱歉（鄭重道歉）","打擾了（進門時）","失陪了（先離開時）","我不住在這裡"],"level":"N5","casual":{"text":"ごめん","reading":"ごめん gomen","note":"朋友、家人之間道歉，語氣更軟可說「ごめんね」；對長輩、陌生人一定用「すみません」或「ごめんなさい」。"}},{"text":"助けてください","reading":"たすけてください tasukete kudasai","zh":"請幫幫我／救命","topic":"求助應急","example":"","example_zh":"","note":"緊急狀況求助用；一般請人幫小忙說「手伝ってもらえますか」即可。","distractors_zh":["請幫我一個小忙","饒了我吧","請告訴我該怎麼辦","請幫我保管行李","請為我加油","請聽我說"],"level":"N5","casual":{"text":"助けて！","reading":"たすけて tasukete","note":"緊急時喊出來的直接形；真正危急時不必顧敬語，喊「助けて！」最快最有效。"}},{"text":"道に迷いました","reading":"みちにまよいました michi ni mayoimashita","zh":"我迷路了","topic":"求助應急","example":"すみません、道に迷いました。駅はどこですか。","example_zh":"不好意思，我迷路了，請問車站在哪裡？","note":"問路開場白；日本人多半會熱心指路甚至帶你走一段。","distractors_zh":["我很猶豫、拿不定主意","我給人添麻煩了","我走錯路了","我正在路上","我找不到出口","我錯過站了"],"level":"N5","casual":{"text":"道分かんなくなっちゃった","reading":"みちわかんなくなっちゃった michi wakannaku nacchatta","note":"跟朋友通話時說自己迷路；「わからない→わかんない」「〜てしまった→〜ちゃった」都是高頻縮約。向陌生人問路仍用禮貌體。"}},{"text":"駅はどこですか","reading":"えきはどこですか eki wa doko desu ka","zh":"車站在哪裡？","topic":"求助應急","example":"","example_zh":"","note":"「〜はどこですか」是問地點的萬用句型。","distractors_zh":["公車站牌在哪裡？","這裡是哪一站？","車站的出口在哪裡？","售票處在哪裡？","月台在哪裡？","車站遠嗎？"],"level":"N5","casual":{"text":"駅どこ？","reading":"えきどこ eki doko","note":"朋友間；向陌生人問路務必用「すみません、駅はどこですか」。"}},{"text":"トイレはどこですか","reading":"トイレはどこですか toire wa doko desu ka","zh":"廁所在哪裡？","topic":"求助應急","example":"","example_zh":"","note":"商店、車站都能用；更客氣可說「お手洗いはどこですか」。","distractors_zh":["浴室在哪裡？","可以借用一下廁所嗎？","廁所現在有人嗎？","洗手台在哪裡？","更衣室在哪裡？","廁所有衛生紙嗎？"],"level":"N5","casual":{"text":"トイレどこ？","reading":"トイレどこ toire doko","note":"朋友間；在店裡問店員仍用「トイレはどこですか」。"}},{"text":"もう一度お願いします","reading":"もういちどおねがいします mou ichido onegaishimasu","zh":"請再說一次","topic":"求助應急","example":"","example_zh":"","note":"聽不清楚時用，比只說「え？」有禮貌得多。","distractors_zh":["請再給我一個","請再等我一下","麻煩你了（拜託）","請再確認一次","請再考慮一下","請下次再來"],"level":"N5","casual":{"text":"もう一回言って？","reading":"もういっかいいって mou ikkai itte","note":"朋友間沒聽清楚時用；口語「一度」常說成「一回」。對長輩用「もう一度お願いします」。"}},{"text":"ゆっくり話してください","reading":"ゆっくりはなしてください yukkuri hanashite kudasai","zh":"請說慢一點","topic":"求助應急","example":"","example_zh":"","note":"初學者保命句；可加「すみません」開頭更客氣。","distractors_zh":["請慢慢來，不用急","請好好休息","請大聲一點說","請小聲一點說","請簡單一點說","請走慢一點"],"level":"N5"},{"text":"日本語がわかりません","reading":"にほんごがわかりません nihongo ga wakarimasen","zh":"我聽不懂日文","topic":"求助應急","example":"","example_zh":"","note":"可改說「少しだけわかります（我只懂一點點）」，對方會放慢速度。","distractors_zh":["我不會說日文","我聽不清楚","我沒學過日文","我不知道那件事","日文好難","我聽不懂英文"],"level":"N5","casual":{"text":"日本語わかんない","reading":"にほんごわかんない nihongo wakannai","note":"「わからない→わかんない」是口語鼻音化縮約；對朋友用，向陌生人求助時說「わかりません」較妥。"}},{"text":"英語を話せますか","reading":"えいごをはなせますか eigo o hanasemasu ka","zh":"你會說英文嗎？","topic":"求助應急","example":"","example_zh":"","note":"「話せます」是「話す」的可能形，表示會說。","distractors_zh":["請用英文說","你聽得懂英文嗎？","我可以說英文嗎？","你會說日文嗎？","你會寫英文嗎？","你的英文真好"],"level":"N4","casual":{"text":"英語話せる？","reading":"えいごはなせる eigo hanaseru","note":"朋友間；問陌生人或店員用「英語を話せますか」。"}},{"text":"財布をなくしました","reading":"さいふをなくしました saifu o nakushimashita","zh":"我的錢包不見了","topic":"求助應急","example":"","example_zh":"","note":"遺失物品可到「交番（派出所）」求助，日本失物找回率很高。","distractors_zh":["我的錢包被偷了","我把錢包忘在家裡了","我身上沒錢了","我把手機弄丟了","我把護照弄丟了","我的錢包找到了"],"level":"N5","casual":{"text":"財布なくした！","reading":"さいふなくした saifu nakushita","note":"跟同行朋友驚呼時用；到警察局報案時仍用「財布をなくしました」。"}},{"text":"気分が悪いです","reading":"きぶんがわるいです kibun ga warui desu","zh":"我不太舒服","topic":"求助應急","example":"","example_zh":"","note":"身體不適時說；「具合が悪いです」也通用。","distractors_zh":["我心情很差","我感冒了","這裡空氣不好","我想吐","我頭很痛","現場氣氛很僵"],"level":"N5","casual":{"text":"ちょっと気持ち悪いかも","reading":"ちょっときもちわるいかも chotto kimochi warui kamo","note":"跟朋友說身體不舒服，「かも」緩和語氣；注意「気持ち悪い」也可指噁心想吐或「好噁」。"}},{"text":"病院に行きたいです","reading":"びょういんにいきたいです byouin ni ikitai desu","zh":"我想去醫院","topic":"求助應急","example":"","example_zh":"","note":"「〜たいです」表示想做某事；情況緊急可請人叫救護車（救急車）。","distractors_zh":["請帶我去醫院","我必須去醫院","我想去藥局買藥","我不想去醫院","我想去派出所","我要預約看診"],"level":"N5"},{"text":"警察を呼んでください","reading":"けいさつをよんでください keisatsu o yonde kudasai","zh":"請幫我叫警察","topic":"求助應急","example":"","example_zh":"","note":"日本報警電話是110，救護車與消防是119，跟台灣不同要記清楚。","distractors_zh":["請幫我叫救護車","請問派出所在哪裡？","請把警察的電話告訴我","請幫我叫計程車","請不要叫警察","請唸給我聽"],"level":"N5"},{"text":"写真を撮ってもらえますか","reading":"しゃしんをとってもらえますか shashin o totte moraemasu ka","zh":"可以幫我拍照嗎？","topic":"求助應急","example":"","example_zh":"","note":"「〜てもらえますか」是請求協助的客氣句型，旅遊必備。","distractors_zh":["我可以幫你拍照嗎？","我可以在這裡拍照嗎？","可以給我這張照片嗎？","可以幫我錄影嗎？","可以再拍一張嗎？","可以幫我拿一下東西嗎？"],"level":"N4","casual":{"text":"写真撮って！","reading":"しゃしんとって shashin totte","note":"請朋友幫忙拍照；拜託路人要用「すみません、写真を撮ってもらえますか」。"}},{"text":"Wi-Fiはありますか","reading":"ワイファイはありますか waifai wa arimasu ka","zh":"有 Wi-Fi 嗎？","topic":"求助應急","example":"","example_zh":"","note":"「〜はありますか」用來詢問有無某物；咖啡廳、飯店都用得到。","distractors_zh":["Wi-Fi 密碼是多少？","Wi-Fi 是免費的嗎？","Wi-Fi 連不上了","有插座嗎？","Wi-Fi 訊號好嗎？","可以幫我連 Wi-Fi 嗎？"],"level":"N5","casual":{"text":"Wi-Fiある？","reading":"ワイファイある waifai aru","note":"朋友間或到朋友家時問；對店員用「Wi-Fiはありますか」。"}},{"text":"おかえりなさい","reading":"おかえりなさい okaerinasai","zh":"歡迎回來","topic":"打招呼","example":"A：ただいま。 B：おかえりなさい。","example_zh":"A：我回來了。 B：歡迎回來。","note":"回應「ただいま」的固定說法；對家人朋友可只說「おかえり」。","level":"N5"},{"text":"いってらっしゃい","reading":"いってらっしゃい itterasshai","zh":"路上小心（送人出門時）","topic":"打招呼","example":"A：いってきます。 B：いってらっしゃい。","example_zh":"A：我出門了。 B：路上小心。","note":"回應「いってきます」的固定說法，家人、室友之間每天都會用。","level":"N5"},{"text":"お先に失礼します","reading":"おさきにしつれいします osaki ni shitsurei shimasu","zh":"我先走了／先告辭了","topic":"打招呼","example":"お先に失礼します。また明日。","example_zh":"我先走囉，明天見。","note":"比別人先下班、先離開時說；對方通常回「お疲れ様でした」。","level":"N5"},{"text":"ようこそ","reading":"ようこそ youkoso","zh":"歡迎","topic":"打招呼","example":"ようこそ台湾へ！","example_zh":"歡迎來到台灣！","note":"迎接來訪的朋友時用；「ようこそ〜へ」＝歡迎來到某地。","level":"N5"},{"text":"気をつけて","reading":"きをつけて ki o tsukete","zh":"路上小心","topic":"打招呼","example":"じゃあ、またね。気をつけて。","example_zh":"那再見囉，路上小心。","note":"道別時的貼心一句；禮貌體說「気をつけてください」。","level":"N5"},{"text":"よい週末を","reading":"よいしゅうまつを yoi shuumatsu o","zh":"祝你週末愉快","topic":"打招呼","example":"じゃあ、よい週末を！","example_zh":"那麼，祝你週末愉快！","note":"星期五道別時常用，後面省略了「お過ごしください」。","level":"N5"},{"text":"お大事に","reading":"おだいじに odaiji ni","zh":"請保重（對生病的人）","topic":"打招呼","example":"A：風邪をひきました。 B：そうですか。お大事に。","example_zh":"A：我感冒了。 B：這樣啊，請保重。","note":"對生病或不舒服的人說；藥局和醫院的人也常對你說這句。","level":"N5"},{"text":"家族は四人です","reading":"かぞくはよにんです kazoku wa yonin desu","zh":"我家有四個人","topic":"自我介紹","example":"家族は四人です。両親と兄と私です。","example_zh":"我家有四個人，爸媽、哥哥和我。","note":"「四人」唸「よにん」；一人（ひとり）、二人（ふたり）是特殊唸法。","level":"N5"},{"text":"父","reading":"ちち chichi","zh":"爸爸（對外人稱自己的父親）","topic":"自我介紹","example":"父は会社員です。","example_zh":"我爸爸是上班族。","note":"對外人說自己爸爸用「父」，稱呼別人的爸爸用「お父さん」。","level":"N5"},{"text":"母","reading":"はは haha","zh":"媽媽（對外人稱自己的母親）","topic":"自我介紹","example":"母は料理が上手です。","example_zh":"我媽媽很會做菜。","note":"對外人說自己媽媽用「母」，稱呼別人的媽媽用「お母さん」。","level":"N5"},{"text":"兄","reading":"あに ani","zh":"哥哥（自己的）","topic":"自我介紹","example":"兄が一人います。","example_zh":"我有一個哥哥。","note":"稱呼別人的哥哥用「お兄さん」。","level":"N5"},{"text":"姉","reading":"あね ane","zh":"姊姊（自己的）","topic":"自我介紹","example":"姉は台北で働いています。","example_zh":"我姊姊在台北工作。","note":"稱呼別人的姊姊用「お姉さん」。","level":"N5"},{"text":"弟","reading":"おとうと otouto","zh":"弟弟","topic":"自我介紹","example":"弟は高校生です。","example_zh":"我弟弟是高中生。","note":"稱呼別人的弟弟用「弟さん」。","level":"N5"},{"text":"妹","reading":"いもうと imouto","zh":"妹妹","topic":"自我介紹","example":"妹は大学生です。","example_zh":"我妹妹是大學生。","note":"稱呼別人的妹妹用「妹さん」。","level":"N5"},{"text":"両親","reading":"りょうしん ryoushin","zh":"父母、雙親","topic":"自我介紹","example":"両親は台南に住んでいます。","example_zh":"我爸媽住在台南。","note":"說別人的父母要加「ご」：ご両親。","level":"N5"},{"text":"お父さん","reading":"おとうさん otousan","zh":"爸爸（稱呼別人的父親）","topic":"自我介紹","example":"お父さんはお元気ですか。","example_zh":"你爸爸最近好嗎？","note":"在家裡叫自己的爸爸也用「お父さん」；對外人提自己爸爸才用「父」。","level":"N5"},{"text":"お母さん","reading":"おかあさん okaasan","zh":"媽媽（稱呼別人的母親）","topic":"自我介紹","example":"お母さんの料理はおいしいですか。","example_zh":"你媽媽做的菜好吃嗎？","note":"在家裡叫自己的媽媽也用「お母さん」。","level":"N5"},{"text":"おじいちゃん","reading":"おじいちゃん ojiichan","zh":"爺爺、外公","topic":"自我介紹","example":"おじいちゃんは八十歳です。","example_zh":"我爺爺八十歲。","note":"口語親暱說法；較正式是「おじいさん」，對外人謙稱「祖父（そふ）」。","level":"N5"},{"text":"おばあちゃん","reading":"おばあちゃん obaachan","zh":"奶奶、外婆","topic":"自我介紹","example":"おばあちゃんのご飯が大好きです。","example_zh":"我最愛奶奶做的飯。","note":"口語親暱說法；較正式是「おばあさん」，對外人謙稱「祖母（そぼ）」。","level":"N5"},{"text":"姉が二人います","reading":"あねがふたりいます ane ga futari imasu","zh":"我有兩個姊姊","topic":"自我介紹","example":"A：兄弟はいますか。 B：姉が二人います。","example_zh":"A：你有兄弟姊妹嗎？ B：我有兩個姊姊。","note":"家人人數用「一人、二人＋います」；「います」用於人和動物。","level":"N5"},{"text":"一人っ子です","reading":"ひとりっこです hitorikko desu","zh":"我是獨生子／獨生女","topic":"自我介紹","example":"A：兄弟はいますか。 B：いえ、一人っ子です。","example_zh":"A：你有兄弟姊妹嗎？ B：沒有，我是獨生子。","note":"「一人っ子」＝獨生子女，聊家庭話題常用到。","level":"N5"},{"text":"家族と住んでいます","reading":"かぞくとすんでいます kazoku to sunde imasu","zh":"我和家人住在一起","topic":"自我介紹","example":"今も家族と住んでいます。","example_zh":"我現在還和家人住在一起。","note":"「と」＝和…一起；台灣人和家人同住很常見，這樣回答很自然。","level":"N5"},{"text":"一人暮らしです","reading":"ひとりぐらしです hitorigurashi desu","zh":"我自己一個人住","topic":"自我介紹","example":"大学から一人暮らしです。","example_zh":"我從大學開始就自己住。","note":"「一人暮らし」＝獨居；聊生活話題的高頻詞。","level":"N5"},{"text":"何人家族ですか","reading":"なんにんかぞくですか nannin kazoku desu ka","zh":"你家有幾個人？","topic":"自我介紹","example":"A：何人家族ですか。 B：五人家族です。","example_zh":"A：你家有幾個人？ B：我家有五個人。","note":"問家庭人數的固定說法，回答用「〜人家族です」。","level":"N5"},{"text":"歌を歌うのが好きです","reading":"うたをうたうのがすきです uta o utau no ga suki desu","zh":"我喜歡唱歌","topic":"興趣嗜好","example":"歌を歌うのが好きです。カラオケに行きましょう！","example_zh":"我喜歡唱歌，我們去唱卡拉OK吧！","note":"動詞辭書形＋「のが好きです」＝喜歡做某事。","level":"N5"},{"text":"泳ぐのが好きです","reading":"およぐのがすきです oyogu no ga suki desu","zh":"我喜歡游泳","topic":"興趣嗜好","example":"夏は海で泳ぐのが好きです。","example_zh":"夏天我喜歡去海邊游泳。","note":"「泳ぐ」的ます形是「泳ぎます」。","level":"N5"},{"text":"毎朝走っています","reading":"まいあさはしっています maiasa hashitte imasu","zh":"我每天早上跑步","topic":"興趣嗜好","example":"毎朝、公園を走っています。","example_zh":"我每天早上在公園跑步。","note":"「〜ています」也可表示習慣；慢跑也說「ジョギング」。","level":"N5"},{"text":"サッカー","reading":"サッカー sakkaa","zh":"足球","topic":"興趣嗜好","example":"サッカーを見るのが好きです。","example_zh":"我喜歡看足球。","note":"世界盃期間的熱門話題；踢足球＝「サッカーをする」。","level":"N5"},{"text":"本を読むのが好きです","reading":"ほんをよむのがすきです hon o yomu no ga suki desu","zh":"我喜歡看書","topic":"興趣嗜好","example":"本を読むのが好きです。特に小説です。","example_zh":"我喜歡看書，特別是小說。","note":"「読む」的ます形是「読みます」；「特に」＝特別是。","level":"N5"},{"text":"絵を描くのが好きです","reading":"えをかくのがすきです e o kaku no ga suki desu","zh":"我喜歡畫畫","topic":"興趣嗜好","example":"暇な時、絵を描くのが好きです。","example_zh":"有空的時候我喜歡畫畫。","note":"「描く」唸「かく」，專指畫圖；寫字的「書く」同音。","level":"N5"},{"text":"ダンス","reading":"ダンス dansu","zh":"跳舞、舞蹈","topic":"興趣嗜好","example":"ダンスを習っています。","example_zh":"我在學跳舞。","note":"「習う」＝跟老師學；K-POP舞蹈話題也很好聊。","level":"N5"},{"text":"週末はよくゲームをします","reading":"しゅうまつはよくゲームをします shuumatsu wa yoku geemu o shimasu","zh":"我週末常打電動","topic":"興趣嗜好","example":"週末はよくゲームをします。","example_zh":"我週末常打電動。","note":"「よく」＝常常；「ゲームをする」＝打電動。","level":"N5"},{"text":"どんな音楽が好きですか","reading":"どんなおんがくがすきですか donna ongaku ga suki desu ka","zh":"你喜歡什麼樣的音樂？","topic":"興趣嗜好","example":"A：どんな音楽が好きですか。 B：J-POPが好きです。","example_zh":"A：你喜歡什麼樣的音樂？ B：我喜歡J-POP。","note":"「どんな＋名詞」＝什麼樣的…；把音楽換成映画、料理都能問。","level":"N5"},{"text":"一緒に行きましょう","reading":"いっしょにいきましょう issho ni ikimashou","zh":"一起去吧","topic":"邀約出遊","example":"A：コンビニに行きます。 B：あ、私も。一緒に行きましょう。","example_zh":"A：我要去便利商店。 B：啊，我也要，一起去吧。","note":"「行く」的ます形是「行きます」；「ましょう」表示邀對方一起做。","level":"N5"},{"text":"買い物に行きませんか","reading":"かいものにいきませんか kaimono ni ikimasen ka","zh":"要不要去逛街買東西？","topic":"邀約出遊","example":"週末、一緒に買い物に行きませんか。","examp
