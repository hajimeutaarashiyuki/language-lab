<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="英日韓三語言學習小幫手：教學課程、智慧單字卡、發音練習">
<link rel="manifest" href="manifest.webmanifest">
</head>
<title>語言學習小幫手</title>
<style>
/* ============================================================
 * 語言學習小幫手 — 手機隨身版樣式（單檔、無外部資源）
 * 色彩全面 token 化；深色主題三層覆寫：
 *   1) @media (prefers-color-scheme: dark) 重定義 token
 *   2) :root[data-theme="dark"] 再覆寫一次（勝過 media）
 *   3) :root[data-theme="light"] 覆寫回淺色（勝過 media dark）
 * ============================================================ */

:root {
  color-scheme: light;
  --bg: #F5F6F8;
  --card: #FFFFFF;
  --inset: #F5F6F8;
  --inset-hover: #E9ECF1;
  --ink: #2B3240;
  --muted: #6B7280;
  --line: #E4E7EC;
  --primary: #1F3864;
  --primary-soft: #1F386499;
  --on-accent: #FFFFFF;
  --lang-en: #2E74B5;
  --lang-en-soft: #2E74B599;
  --lang-jp: #C0504D;
  --lang-jp-soft: #C0504D99;
  --lang-kr: #27807F;
  --lang-kr-soft: #27807F99;
  --good: #27793F;
  --good-bg: #E8F5EC;
  --bad: #BB3A34;
  --bad-bg: #FBEAE9;
  --warn: #9C6712;
  --reco-bg: rgba(31, 56, 100, 0.10);
  --chart-rest: #D5D9E0;
  --ring: rgba(31, 56, 100, 0.4);
  --radius: 14px;
  --shadow: 0 2px 10px rgba(31, 56, 100, 0.08);
  --shadow-hover: 0 6px 18px rgba(31, 56, 100, 0.14);
}

/* 深色不是反轉：深藍灰底、卡片略亮一階、語言色微調亮度保持對比 */
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #141926;
    --card: #1D2433;
    --inset: #273043;
    --inset-hover: #2F3A50;
    --ink: #E7EBF4;
    --muted: #9AA4B8;
    --line: #303A4E;
    --primary: #6B90CB;
    --primary-soft: #6B90CB99;
    --on-accent: #10182A;
    --lang-en: #5D9BD8;
    --lang-en-soft: #5D9BD899;
    --lang-jp: #D9736F;
    --lang-jp-soft: #D9736F99;
    --lang-kr: #46A8A6;
    --lang-kr-soft: #46A8A699;
    --good: #5CB77E;
    --good-bg: #21382B;
    --bad: #E0837D;
    --bad-bg: #40282A;
    --warn: #D9A24C;
    --reco-bg: rgba(107, 144, 203, 0.18);
    --chart-rest: #3A4358;
    --ring: rgba(125, 162, 220, 0.55);
    --shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
    --shadow-hover: 0 6px 18px rgba(0, 0, 0, 0.45);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #141926;
  --card: #1D2433;
  --inset: #273043;
  --inset-hover: #2F3A50;
  --ink: #E7EBF4;
  --muted: #9AA4B8;
  --line: #303A4E;
  --primary: #6B90CB;
  --primary-soft: #6B90CB99;
  --on-accent: #10182A;
  --lang-en: #5D9BD8;
  --lang-en-soft: #5D9BD899;
  --lang-jp: #D9736F;
  --lang-jp-soft: #D9736F99;
  --lang-kr: #46A8A6;
  --lang-kr-soft: #46A8A699;
  --good: #5CB77E;
  --good-bg: #21382B;
  --bad: #E0837D;
  --bad-bg: #40282A;
  --warn: #D9A24C;
  --reco-bg: rgba(107, 144, 203, 0.18);
  --chart-rest: #3A4358;
  --ring: rgba(125, 162, 220, 0.55);
  --shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
  --shadow-hover: 0 6px 18px rgba(0, 0, 0, 0.45);
}

:root[data-theme="light"] {
  color-scheme: light;
  --bg: #F5F6F8;
  --card: #FFFFFF;
  --inset: #F5F6F8;
  --inset-hover: #E9ECF1;
  --ink: #2B3240;
  --muted: #6B7280;
  --line: #E4E7EC;
  --primary: #1F3864;
  --primary-soft: #1F386499;
  --on-accent: #FFFFFF;
  --lang-en: #2E74B5;
  --lang-en-soft: #2E74B599;
  --lang-jp: #C0504D;
  --lang-jp-soft: #C0504D99;
  --lang-kr: #27807F;
  --lang-kr-soft: #27807F99;
  --good: #27793F;
  --good-bg: #E8F5EC;
  --bad: #BB3A34;
  --bad-bg: #FBEAE9;
  --warn: #9C6712;
  --reco-bg: rgba(31, 56, 100, 0.10);
  --chart-rest: #D5D9E0;
  --ring: rgba(31, 56, 100, 0.4);
  --shadow: 0 2px 10px rgba(31, 56, 100, 0.08);
  --shadow-hover: 0 6px 18px rgba(31, 56, 100, 0.14);
}

* { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
}

html, body {
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 16px;
  line-height: 1.65;
  -webkit-tap-highlight-color: transparent;
}

h1 { font-size: 26px; margin: 0 0 6px; }
h2 { font-size: 21px; margin: 0 0 6px; }
h3 { font-size: 17px; margin: 14px 0 8px; }
p { margin: 6px 0; }
ul { margin: 6px 0; padding-left: 22px; }

.muted { color: var(--muted); }
.small { font-size: 14px; }
.center-text { text-align: center; }

:focus-visible {
  outline: 3px solid var(--ring);
  outline-offset: 2px;
}

/* 數字統計對齊 */
.tile-num, .progress-text, .result-num,
.mini-num, .mini-pct, .mini-date, .lv-count {
  font-variant-numeric: tabular-nums;
}

/* ---------------- 頂部品牌列 ---------------- */

.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--card);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
  padding-top: env(safe-area-inset-top);
}

.topbar-inner {
  max-width: 980px;
  margin: 0 auto;
  padding: 6px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

/* 目前設定檔（點擊跳資料頁） */
.profile-chip {
  border: none;
  background: var(--inset);
  color: var(--primary);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  padding: 6px 14px;
  min-height: 44px;
  border-radius: 999px;
  cursor: pointer;
  max-width: 45%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  transition: background 0.15s;
}
.profile-chip:hover { background: var(--inset-hover); }

.brand {
  border: none;
  background: none;
  color: var(--primary);
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  padding: 6px 12px;
  min-height: 44px;
  border-radius: 8px;
  font-family: inherit;
}
.brand:hover { background: var(--inset); }

/* ---------------- 底部主導覽（拇指可及） ---------------- */

.bottom-nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 60;
  display: flex;
  justify-content: center;
  gap: 4px;
  background: var(--card);
  border-top: 1px solid var(--line);
  padding: 6px max(10px, env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
}

.bnav-btn {
  flex: 1 1 0;
  max-width: 180px;
  min-height: 48px;
  border: none;
  background: none;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  border-radius: 12px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  transition: background 0.15s, color 0.15s;
}
.bnav-btn:hover { color: var(--primary); }
.bnav-btn.active {
  color: var(--primary);
  background: var(--reco-bg);
}
.bnav-ico { font-size: 20px; line-height: 1; }

/* ---------------- Toast ---------------- */

#toast {
  position: fixed;
  top: calc(12px + env(safe-area-inset-top));
  left: 50%;
  transform: translate(-50%, -90px);
  background: var(--bad);
  color: var(--on-accent);
  padding: 10px 22px;
  border-radius: 10px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
  font-size: 15px;
  font-weight: 600;
  z-index: 100;
  opacity: 0;
  transition: transform 0.25s ease, opacity 0.25s ease;
  pointer-events: none;
  max-width: 90vw;
}
#toast.show {
  transform: translate(-50%, 0);
  opacity: 1;
}
#toast.ok, #toast.toast-ok { background: var(--good); }

/* ---------------- 頁面容器 ---------------- */

#app { min-height: 70vh; }

.page {
  max-width: 980px;
  margin: 0 auto;
  padding: 22px max(16px, env(safe-area-inset-right)) calc(92px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  animation: fadeIn 0.28s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

.loading {
  text-align: center;
  color: var(--muted);
  padding: 60px 0;
}

/* ---------------- 卡片與按鈕 ---------------- */

.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
}

.btn {
  font-family: inherit;
  font-size: 16px;
  border: none;
  border-radius: 10px;
  padding: 10px 20px;
  min-height: 44px;
  cursor: pointer;
  background: var(--inset);
  color: var(--ink);
  transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s, filter 0.15s;
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.btn:active { transform: translateY(0) scale(0.97); box-shadow: none; }
.btn:disabled { cursor: default; opacity: 0.75; transform: none; box-shadow: none; }

.btn-primary { background: var(--primary); color: var(--on-accent); }
.btn-primary:hover { filter: brightness(1.12); }

.btn-ghost {
  background: var(--card);
  border: 1px solid var(--line);
  color: var(--primary);
}

.btn-lang {
  color: var(--on-accent);
  font-weight: 600;
  margin-top: 12px;
  width: 100%;
}
.btn-lang:hover { filter: brightness(1.1); }

.btn-big { font-size: 18px; padding: 14px 30px; }

.btn-good { background: var(--good); color: var(--on-accent); }
.btn-bad { background: var(--bad); color: var(--on-accent); }
.btn-mid { background: var(--warn); color: var(--on-accent); }

.btn-row {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 14px;
}

.back-btn { margin-bottom: 16px; }

.badge {
  display: inline-block;
  font-size: 13px;
  font-weight: 600;
  padding: 2px 10px;
  border-radius: 999px;
  white-space: nowrap;
}
.badge-due { background: var(--bad-bg); color: var(--bad); }
.badge-ok { background: var(--good-bg); color: var(--good); }
.badge-box { color: var(--on-accent); }
.badge-reco { background: var(--reco-bg); color: var(--primary); }
.badge-maint { background: var(--good-bg); color: var(--good); }

.section-title { margin: 30px 0 14px; color: var(--primary); }

.center-card {
  text-align: center;
  padding: 40px 24px;
  max-width: 560px;
  margin: 0 auto;
}

.big-emoji { font-size: 54px; margin: 0 0 8px; }
.result-num { font-size: 22px; font-weight: 700; }

.move-list {
  text-align: left;
  display: inline-block;
  margin: 8px auto;
  background: var(--inset);
  border-radius: 10px;
  padding: 10px 18px;
}
.move-list h3 { margin: 0 0 4px; font-size: 15px; }
.move-list ul { list-style: none; padding: 0; margin: 0; }

/* ---------------- 首頁 ---------------- */

.home-header { margin-bottom: 18px; }
.home-header h1 { color: var(--primary); }

.btn-hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  width: 100%;
  padding: 20px;
  border-radius: var(--radius);
  margin-bottom: 22px;
  box-shadow: var(--shadow);
}
.btn-hero:hover { box-shadow: var(--shadow-hover); }
.hero-title { font-size: 21px; font-weight: 700; }
.hero-sub { font-size: 14px; opacity: 0.85; }

.tile-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 10px;
}
.tile-row-4 { grid-template-columns: repeat(4, 1fr); }

.tile { text-align: center; padding: 18px 12px; }
.tile-num { font-size: 28px; font-weight: 700; color: var(--primary); margin: 0; }
.tile-label { color: var(--muted); font-size: 14px; margin: 4px 0 0; }

.lang-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}

.lang-card, .stats-lang-card {
  padding: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: box-shadow 0.15s ease, transform 0.15s ease;
}
.lang-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }

.lang-bar { height: 6px; width: 100%; }

.lang-card-body, .stats-lang-body {
  padding: 16px 18px 18px;
  display: flex;
  flex-direction: column;
  flex: 1;
}
.lang-card-body .btn, .stats-lang-body .btn { margin-top: auto; }

.lang-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.lang-card-top h2, .lang-card-top h3 { margin: 0; }

/* ---------------- 語言功能選單 ---------------- */

.lang-page-header {
  border-left: 6px solid var(--primary);
  padding-left: 14px;
  margin-bottom: 20px;
}

.feature-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}

.feature-card {
  display: flex;
  align-items: center;
  gap: 14px;
  text-align: left;
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-size: 16px;
  min-height: 44px;
  transition: box-shadow 0.15s ease, transform 0.15s ease;
}
.feature-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
.feature-card:active { transform: translateY(0) scale(0.99); }

.feature-emoji { font-size: 32px; }
.feature-text { display: flex; flex-direction: column; gap: 2px; }
.feature-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

/* ---------------- 單字卡 ---------------- */

.flash-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.flash-meta { display: flex; align-items: center; gap: 10px; }

.progress-text { font-weight: 600; color: var(--muted); }

.flash-title { text-align: center; margin: 0 0 16px; }

.flash-wrap {
  perspective: 1200px;
  max-width: 620px;
  margin: 0 auto;
}

.flash-card {
  display: block;
  width: 100%;
  height: 350px;
  border: none;
  background: none;
  padding: 0;
  cursor: pointer;
  font-family: inherit;
  perspective: 1200px;
}

.fc-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.55s cubic-bezier(0.4, 0.1, 0.2, 1);
}
.flash-card.flipped .fc-inner { transform: rotateY(180deg); }

.fc-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  overflow-y: auto;
  text-align: center;
}
.fc-back { transform: rotateY(180deg); }

.fc-text { font-size: 34px; font-weight: 700; margin: 0; word-break: break-word; }
.fc-reading { font-size: 18px; margin: 8px 0 0; }
.fc-hint { position: absolute; bottom: 12px; left: 0; right: 0; margin: 0; }

.fc-zh { font-size: 28px; font-weight: 700; margin: 0 0 8px; }
.fc-note {
  font-size: 15px;
  background: var(--inset);
  border-radius: 10px;
  padding: 8px 12px;
  margin: 8px 0;
}
.fc-example { font-size: 16px; margin: 8px 0 2px; }
.fc-example-zh { font-size: 15px; margin: 0; }

.flash-tools { text-align: center; margin-top: 14px; }

.speak-btn { font-size: 20px; padding: 8px 14px; }

.answer-row .btn { min-width: 160px; }

/* ---------------- 測驗共用 ---------------- */

.setup-card { max-width: 560px; margin: 16px auto 0; }
.setup-card h3 { margin-top: 18px; }
.setup-card h3:first-child { margin-top: 0; }
.start-btn { width: 100%; margin-top: 22px; }

.seg {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 6px 0 4px;
}

.seg-btn {
  font-family: inherit;
  font-size: 15px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  border-radius: 999px;
  padding: 8px 18px;
  min-height: 44px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s, transform 0.12s;
}
.seg-btn:hover { transform: translateY(-1px); }
.seg-btn.active {
  background: var(--primary);
  border-color: var(--primary);
  color: var(--on-accent);
  font-weight: 600;
}

.tab-seg { margin-bottom: 14px; }

.quiz-card { max-width: 680px; margin: 16px auto 0; }
.inline-title { font-size: 20px; margin: 0 0 10px; }

.quiz-question { font-size: 24px; font-weight: 700; margin: 10px 0; }
.grammar-q { font-size: 20px; line-height: 1.7; }

.opt-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 16px 0 4px;
}

.opt-btn {
  text-align: left;
  background: var(--inset);
  border: 2px solid transparent;
  font-size: 17px;
  padding: 12px 16px;
}
.opt-btn:hover:not(:disabled) { background: var(--inset-hover); }
.opt-btn:disabled { opacity: 1; }

.opt-correct {
  background: var(--good-bg) !important;
  border-color: var(--good) !important;
  color: var(--good);
  font-weight: 700;
}
.opt-wrong {
  background: var(--bad-bg) !important;
  border-color: var(--bad) !important;
  color: var(--bad);
  font-weight: 700;
}

.quiz-feedback { margin-top: 10px; }
.fb-ok { color: var(--good); font-weight: 700; font-size: 17px; }
.fb-no { color: var(--bad); font-weight: 700; font-size: 17px; }
.fb-ans { font-weight: 600; }
.fb-note {
  background: var(--inset);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 15px;
}
.fb-hint { color: var(--primary); font-weight: 600; }

.explain-box {
  background: var(--inset);
  border-radius: 10px;
  padding: 10px 14px;
  margin-top: 8px;
}
.explain-box .fb-ans { margin: 0 0 4px; }

/* ---------------- 拼寫練習 ---------------- */

.spell-form {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 10px;
}

.spell-input {
  flex: 1;
  min-width: 200px;
  font-family: inherit;
  font-size: 18px;
  padding: 10px 14px;
  min-height: 44px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--card);
  color: var(--ink);
}
.spell-input:focus-visible { outline: 3px solid var(--ring); }

/* ---------------- 字母練習 ---------------- */

.alpha-section { margin-top: 18px; }

.alpha-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
  gap: 8px;
}

.alpha-cell {
  font-family: inherit;
  border: none;
  background: var(--card);
  border-radius: 10px;
  box-shadow: var(--shadow);
  padding: 10px 4px;
  min-height: 44px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
  color: var(--ink);
}
.alpha-cell:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
.alpha-cell:active { transform: scale(0.95); }

.alpha-char { font-size: 24px; font-weight: 700; }
.alpha-roman { font-size: 13px; }

.alpha-big {
  display: block;
  font-family: inherit;
  font-size: 64px;
  font-weight: 700;
  color: var(--ink);
  background: var(--inset);
  border: none;

const DATA = {"english":{"language":"english","display_name_zh":"英文(多益)","alphabet":[],"items":[{"text":"supervisor","reading":"n.","zh":"主管；上司","topic":"辦公室","example":"Please ask your supervisor to sign the leave request form before submitting it.","example_zh":"請在送出請假單前,先請你的主管簽名。","note":"常見搭配 immediate supervisor(直屬主管);勿與 supervision(監督)混淆。"},{"text":"photocopier","reading":"n.","zh":"影印機","topic":"辦公室","example":"The photocopier on the third floor is out of order, so please use the one near the mailroom.","example_zh":"三樓的影印機故障了,請改用收發室旁邊那台。","note":"同義字 copier;out of order(故障)是 Part 7 高頻搭配。"},{"text":"stationery","reading":"n.","zh":"文具","topic":"辦公室","example":"Orders for stationery should be placed with the administrative office by the end of each month.","example_zh":"文具訂購應於每月月底前向行政部門提出。","note":"拼字易與 stationary(靜止的)混淆,-ery 結尾才是文具。"},{"text":"cubicle","reading":"n.","zh":"辦公隔間","topic":"辦公室","example":"New hires will be assigned a cubicle on the fourth floor next to the design team.","example_zh":"新進員工將被分配到四樓設計團隊旁的辦公隔間。","note":"常搭配 assign a cubicle(分配隔間座位)。"},{"text":"memo","reading":"n.","zh":"備忘錄;內部通知","topic":"辦公室","example":"According to the memo, the parking garage will be closed for repairs this Friday.","example_zh":"根據這份內部通知,停車場本週五將關閉維修。","note":"全稱 memorandum;memo 是 Part 7 常見的文章類型。"},{"text":"paperwork","reading":"n.","zh":"文書作業","topic":"辦公室","example":"Completing the paperwork for the new vendor took the entire afternoon.","example_zh":"完成新供應商的文書作業花了一整個下午。","note":"不可數名詞,不加 s;常搭配 complete / process the paperwork。"},{"text":"deadline","reading":"n.","zh":"截止期限","topic":"辦公室","example":"The team worked overtime to meet the deadline for the annual report.","example_zh":"團隊為了趕上年度報告的截止期限而加班。","note":"固定搭配 meet / miss / extend a deadline。"},{"text":"delegate","reading":"v.","zh":"委派;授權","topic":"辦公室","example":"An effective manager knows how to delegate routine tasks to team members.","example_zh":"有效率的主管懂得把例行工作委派給團隊成員。","note":"delegate A to B(把 A 委派給 B);名詞 delegate 指「代表」。"},{"text":"archive","reading":"v.","zh":"歸檔;存檔","topic":"辦公室","example":"All invoices older than seven years are archived in the basement storage room.","example_zh":"所有超過七年的請款單都歸檔存放在地下室儲藏室。","note":"亦作名詞 the archives(檔案庫)。"},{"text":"clerical","reading":"adj.","zh":"文書的;辦事員的","topic":"辦公室","example":"The position involves clerical duties such as filing documents and answering phones.","example_zh":"這個職位包含歸檔文件與接聽電話等文書工作。","note":"常搭配 clerical duties / clerical error(文書錯誤)。"},{"text":"workload","reading":"n.","zh":"工作量","topic":"辦公室","example":"The department hired two temporary workers to ease the heavy workload during tax season.","example_zh":"部門聘了兩名臨時人員,以減輕報稅季的沉重工作量。","note":"常搭配 heavy / reduce / ease the workload。"},{"text":"office supplies","reading":"phr.","zh":"辦公用品","topic":"辦公室","example":"Requests for office supplies must be approved by the department head.","example_zh":"辦公用品的申請必須經部門主管核准。","note":"supplies 恆用複數;供應商是 supplier,勿混淆。"},{"text":"renovate","reading":"v.","zh":"整修;翻新","topic":"辦公室","example":"The company plans to renovate the lobby to create a more welcoming reception area.","example_zh":"公司計畫整修大廳,打造更友善的接待空間。","note":"名詞 renovation;常見句型 be closed for renovation(s)。"},{"text":"malfunction","reading":"n.","zh":"故障","topic":"辦公室","example":"A malfunction in the air-conditioning system forced the staff to relocate to another floor.","example_zh":"空調系統故障,迫使員工移到另一層樓辦公。","note":"亦可當動詞;近義 breakdown、out of order。"},{"text":"designate","reading":"v.","zh":"指定;指派","topic":"辦公室","example":"Visitors must park only in the spaces designated for guests.","example_zh":"訪客只能停在指定的來賓車位。","note":"高頻搭配 designated area / designated smoking section。"},{"text":"streamline","reading":"v.","zh":"簡化;使更有效率","topic":"辦公室","example":"The new software will streamline the approval process for expense reports.","example_zh":"新軟體將簡化費用報告的核准流程。","note":"常搭配 streamline the process / operations。"},{"text":"procedure","reading":"n.","zh":"程序;步驟","topic":"辦公室","example":"All staff must follow the standard procedure when reporting a workplace accident.","example_zh":"所有員工在通報職場意外時,都必須遵循標準程序。","note":"常搭配 follow / standard procedure;勿與 proceed(動詞)混淆。"},{"text":"agenda","reading":"n.","zh":"議程","topic":"會議簡報","example":"The first item on the agenda is the review of last quarter's sales figures.","example_zh":"議程的第一項是檢視上一季的銷售數字。","note":"固定搭配 on the agenda(在議程上)。"},{"text":"minutes","reading":"n.","zh":"會議紀錄","topic":"會議簡報","example":"Ms. Park will take the minutes and distribute them to all attendees by Friday.","example_zh":"朴小姐將負責做會議紀錄,並在週五前發給所有與會者。","note":"此義恆用複數;固定搭配 take the minutes。"},{"text":"adjourn","reading":"v.","zh":"休會;使延會","topic":"會議簡報","example":"The chairperson adjourned the meeting until further data could be collected.","example_zh":"主席宣布休會,待蒐集到更多資料後再續。","note":"常見句 The meeting was adjourned.(會議結束/休會)。"},{"text":"unanimous","reading":"adj.","zh":"一致同意的","topic":"會議簡報","example":"The board reached a unanimous decision to expand into the Southeast Asian market.","example_zh":"董事會一致決議進軍東南亞市場。","note":"固定搭配 unanimous decision / vote;副詞 unanimously。"},{"text":"consensus","reading":"n.","zh":"共識","topic":"會議簡報","example":"After two hours of discussion, the committee finally reached a consensus on the budget.","example_zh":"經過兩小時討論,委員會終於就預算達成共識。","note":"固定搭配 reach a consensus on...。"},{"text":"preside","reading":"v.","zh":"主持(會議)","topic":"會議簡報","example":"Vice President Lin will preside over the shareholders' meeting in the CEO's absence.","example_zh":"執行長不在時,將由林副總主持股東會議。","note":"固定搭配 preside over a meeting;勿與 president 詞性混淆。"},{"text":"postpone","reading":"v.","zh":"延期","topic":"會議簡報","example":"The product demonstration has been postponed until next Wednesday because of a scheduling conflict.","example_zh":"由於行程衝突,產品展示已延到下週三。","note":"後接動名詞 postpone doing;近義 put off、delay。"},{"text":"convene","reading":"v.","zh":"召開;集會","topic":"會議簡報","example":"The committee will convene at 9 A.M. to discuss the merger proposal.","example_zh":"委員會將於上午九點召開會議,討論合併提案。","note":"convene a meeting(召開會議);正式用語。"},{"text":"attendee","reading":"n.","zh":"出席者;與會者","topic":"會議簡報","example":"Each attendee will receive a copy of the presentation slides after the workshop.","example_zh":"每位與會者在工作坊結束後都會拿到一份簡報投影片。","note":"-ee 表「被…的人/參加者」;attendance 是「出席率」。"},{"text":"handout","reading":"n.","zh":"講義;發放的資料","topic":"會議簡報","example":"Please refer to page three of the handout for the detailed schedule.","example_zh":"詳細時程請參閱講義第三頁。","note":"常見句 refer to the handout;動詞片語是 hand out(發放)。"},{"text":"keynote","reading":"n.","zh":"主題演講","topic":"會議簡報","example":"Dr. Alvarez will deliver the keynote address at this year's technology conference.","example_zh":"阿瓦雷茲博士將在今年的科技大會上發表主題演講。","note":"固定搭配 keynote speaker / keynote address。"},{"text":"podium","reading":"n.","zh":"講台","topic":"會議簡報","example":"The speaker stepped up to the podium and thanked the organizers for the invitation.","example_zh":"講者走上講台,感謝主辦單位的邀請。","note":"常搭配 step up to / stand at the podium。"},{"text":"brainstorm","reading":"v.","zh":"腦力激盪","topic":"會議簡報","example":"The marketing team met to brainstorm ideas for the holiday campaign.","example_zh":"行銷團隊開會腦力激盪,為節慶活動想點子。","note":"常搭配 brainstorm ideas / a brainstorming session。"},{"text":"elaborate","reading":"v.","zh":"詳細說明","topic":"會議簡報","example":"Could you elaborate on the risks mentioned in your presentation?","example_zh":"你能詳細說明簡報中提到的風險嗎?","note":"固定搭配 elaborate on...;作形容詞時意為「精心製作的」。"},{"text":"summarize","reading":"v.","zh":"總結;摘要","topic":"會議簡報","example":"At the end of the meeting, the chair summarized the key decisions for the record.","example_zh":"會議結束時,主席為留存紀錄總結了各項重要決議。","note":"名詞 summary;常見句 in summary(總而言之)。"},{"text":"objection","reading":"n.","zh":"異議;反對","topic":"會議簡報","example":"If there are no objections, the proposal will be put to a vote immediately.","example_zh":"如果沒有異議,提案將立即付諸表決。","note":"固定搭配 raise an objection to...;動詞 object to + N/V-ing。"},{"text":"quarterly","reading":"adj.","zh":"每季的","topic":"會議簡報","example":"The quarterly review meeting has been moved to the main conference room.","example_zh":"季度檢討會議已改到大會議室舉行。","note":"亦可當副詞;相關字 annually(每年)、biweekly(隔週)。"},{"text":"applicant","reading":"n.","zh":"應徵者;申請人","topic":"人事招募","example":"All applicants must submit two letters of recommendation along with their résumés.","example_zh":"所有應徵者都必須連同履歷繳交兩封推薦信。","note":"勿與 application(申請書)、apply(動詞)混淆。"},{"text":"candidate","reading":"n.","zh":"候選人;人選","topic":"人事招募","example":"The hiring committee narrowed the list down to three qualified candidates.","example_zh":"招聘委員會將名單縮減至三位合格的人選。","note":"常搭配 qualified / successful candidate。"},{"text":"résumé","reading":"n.","zh":"履歷","topic":"人事招募","example":"Please e-mail your résumé and cover letter to the human resources department.","example_zh":"請將履歷與求職信以電子郵件寄至人力資源部。","note":"英式常用 CV;固定搭配 cover letter(求職信)。"},{"text":"qualification","reading":"n.","zh":"資格;條件","topic":"人事招募","example":"A master's degree in finance is a preferred qualification for this position.","example_zh":"財務碩士學位是這個職位的加分資格條件。","note":"常搭配 meet the qualifications;形容詞 qualified。"},{"text":"recruit","reading":"v.","zh":"招募","topic":"人事招募","example":"The firm plans to recruit twenty engineers for its new research center.","example_zh":"該公司計畫為新研究中心招募二十名工程師。","note":"名詞 recruitment;new recruit 指「新進人員」。"},{"text":"promote","reading":"v.","zh":"升遷;晉升","topic":"人事招募","example":"Ms. Ito was promoted to regional manager after five years of outstanding service.","example_zh":"伊藤小姐在五年傑出表現後,升任區域經理。","note":"固定句型 be promoted to + 職位;另義為「促銷」。"},{"text":"probation","reading":"n.","zh":"試用期","topic":"人事招募","example":"New employees are on probation for the first three months of employment.","example_zh":"新進員工到職後的前三個月為試用期。","note":"固定搭配 on probation / probationary period。"},{"text":"compensation","reading":"n.","zh":"薪酬;補償","topic":"人事招募","example":"The compensation package includes a base salary, bonuses, and stock options.","example_zh":"薪酬方案包含底薪、獎金與股票選擇權。","note":"高頻搭配 compensation package;動詞 compensate for。"},{"text":"benefits","reading":"n.","zh":"福利","topic":"人事招募","example":"In addition to competitive pay, the company offers generous benefits such as health insurance.","example_zh":"除了有競爭力的薪資,公司還提供醫療保險等優渥福利。","note":"此義恆用複數;常搭配 fringe benefits(額外福利)。"},{"text":"retire","reading":"v.","zh":"退休","topic":"人事招募","example":"Mr. Doyle will retire in June after thirty years with the company.","example_zh":"多伊爾先生在公司服務三十年後,將於六月退休。","note":"名詞 retirement;搭配 retire from + 職務。"},{"text":"resign","reading":"v.","zh":"辭職","topic":"人事招募","example":"The sales director resigned to pursue a career in consulting.","example_zh":"業務總監辭職,轉而投入顧問工作。","note":"resign from a position;名詞 resignation(辭呈)。"},{"text":"vacancy","reading":"n.","zh":"職缺;空缺","topic":"人事招募","example":"There is currently a vacancy for an accountant in our Taipei branch.","example_zh":"我們台北分公司目前有一個會計職缺。","note":"常搭配 fill a vacancy(補上職缺);在飯店情境指「空房」。"},{"text":"orientation","reading":"n.","zh":"新人訓練;說明會","topic":"人事招募","example":"All new hires are required to attend a two-day orientation next Monday.","example_zh":"所有新進員工都必須參加下週一起為期兩天的新人訓練。","note":"常搭配 attend an orientation (session)。"},{"text":"evaluate","reading":"v.","zh":"評估;考核","topic":"人事招募","example":"Supervisors evaluate each employee's performance at the end of the year.","example_zh":"主管會在年底考核每位員工的績效。","note":"名詞 evaluation;高頻搭配 performance evaluation。"},{"text":"tenure","reading":"n.","zh":"任期;任職期間","topic":"人事招募","example":"During her tenure as CEO, the company's revenue tripled.","example_zh":"在她擔任執行長期間,公司營收成長為三倍。","note":"常見句型 during one's tenure as + 職位。"},{"text":"workforce","reading":"n.","zh":"勞動力;全體員工","topic":"人事招募","example":"Nearly half of the company's workforce now works remotely at least two days a week.","example_zh":"公司近半數員工現在每週至少遠距工作兩天。","note":"常搭配 skilled workforce / reduce the workforce(裁員)。"},{"text":"severance","reading":"n.","zh":"資遣費;遣散","topic":"人事招募","example":"Laid-off workers will receive a severance package equal to three months' salary.","example_zh":"被資遣的員工將獲得相當於三個月薪資的資遣方案。","note":"高頻搭配 severance pay / package。"},{"text":"invoice","reading":"n.","zh":"發票;請款單","topic":"財務會計","example":"Please pay the enclosed invoice within thirty days to avoid a late fee.","example_zh":"請於三十天內支付隨附的請款單,以免產生滯納金。","note":"常搭配 issue / settle an invoice;收據是 receipt,勿混淆。"},{"text":"reimburse","reading":"v.","zh":"核銷;償還(費用)","topic":"財務會計","example":"Employees will be reimbursed for travel expenses upon submission of original receipts.","example_zh":"員工提交正本收據後,即可核銷差旅費用。","note":"句型 reimburse sb for sth;名詞 reimbursement。"},{"text":"audit","reading":"n.","zh":"審計;查帳","topic":"財務會計","example":"An external firm will conduct the annual audit of our financial statements.","example_zh":"外部事務所將對我們的財務報表進行年度審計。","note":"常搭配 conduct an audit;auditor 是「查帳員」。"},{"text":"budget","reading":"n.","zh":"預算","topic":"財務會計","example":"The project was completed on time and under budget.","example_zh":"這項專案如期完成,而且沒有超出預算。","note":"高頻搭配 within / under / over budget。"},{"text":"expenditure","reading":"n.","zh":"支出;經費","topic":"財務會計","example":"The finance team is looking for ways to cut unnecessary expenditures.","example_zh":"財務團隊正在尋找削減不必要支出的方法。","note":"近義 expense;反義 income、revenue。"},{"text":"revenue","reading":"n.","zh":"營收;收入","topic":"財務會計","example":"Overseas sales now account for forty percent of the company's total revenue.","example_zh":"海外銷售目前占公司總營收的百分之四十。","note":"常搭配 generate revenue;profit(利潤)是扣除成本後的數字。"},{"text":"deficit","reading":"n.","zh":"赤字;不足額","topic":"財務會計","example":"The department must reduce spending to make up for this year's budget deficit.","example_zh":"該部門必須減少開支,以彌補今年的預算赤字。","note":"反義 surplus;高頻搭配 budget deficit。"},{"text":"surplus","reading":"n.","zh":"盈餘;過剩","topic":"財務會計","example":"Thanks to strong sales, the company reported a budget surplus for the third year in a row.","example_zh":"由於銷售強勁,公司連續第三年出現預算盈餘。","note":"反義 deficit;亦可指「過剩的物資」。"},{"text":"fiscal","reading":"adj.","zh":"財政的;會計的","topic":"財務會計","example":"The new fiscal year begins on April 1 for most Japanese companies.","example_zh":"多數日本公司的新會計年度自四月一日開始。","note":"高頻搭配 fiscal year(會計年度)。"},{"text":"installment","reading":"n.","zh":"分期付款(的一期)","topic":"財務會計","example":"Customers may pay for the equipment in twelve monthly installments.","example_zh":"顧客可以分十二個月分期付款購買這套設備。","note":"固定搭配 in installments / monthly installment。"},{"text":"overdue","reading":"adj.","zh":"逾期的","topic":"財務會計","example":"This is a reminder that your payment of $450 is now two weeks overdue.","example_zh":"在此提醒您,您 450 美元的款項已逾期兩週。","note":"常搭配 overdue payment / balance;due 是「到期的」。"},{"text":"ledger","reading":"n.","zh":"帳簿;分類帳","topic":"財務會計","example":"Every transaction must be recorded in the general ledger by the end of the day.","example_zh":"每筆交易都必須在當天結束前登錄到總帳。","note":"固定搭配 general ledger(總帳)。"},{"text":"asset","reading":"n.","zh":"資產","topic":"財務會計","example":"The auditors reviewed the company's assets, including real estate and equipment.","example_zh":"查帳員檢視了公司的資產,包括不動產與設備。","note":"反義 liability(負債);比喻用法指「人才、優勢」。"},{"text":"liability","reading":"n.","zh":"負債;法律責任","topic":"財務會計","example":"The balance sheet lists all of the firm's assets and liabilities.","example_zh":"資產負債表列出公司所有的資產與負債。","note":"會計義常用複數 liabilities;另義為「法律責任」。"},{"text":"depreciation","reading":"n.","zh":"折舊","topic":"財務會計","example":"The accountant calculated the depreciation of the delivery vehicles over five years.","example_zh":"會計師計算了送貨車輛五年間的折舊。","note":"動詞 depreciate;反義 appreciation(增值)。"},{"text":"transaction","reading":"n.","zh":"交易","topic":"財務會計","example":"For security reasons, all online transactions are encrypted.","example_zh":"基於安全考量,所有線上交易都經過加密。","note":"常搭配 process / complete a transaction。"},{"text":"remittance","reading":"n.","zh":"匯款","topic":"財務會計","example":"Please include the invoice number with your remittance so we can process it promptly.","example_zh":"匯款時請註明請款單編號,以便我們迅速處理。","note":"動詞 remit;常見於付款通知信件。"},{"text":"campaign","reading":"n.","zh":"行銷活動;宣傳活動","topic":"行銷業務","example":"The advertising campaign for the new smartphone will launch next month.","example_zh":"新款智慧型手機的廣告宣傳活動將於下個月展開。","note":"高頻搭配 advertising / marketing campaign、launch a campaign。"},{"text":"promotion","reading":"n.","zh":"促銷;宣傳","topic":"行銷業務","example":"As part of the summer promotion, all swimwear is thirty percent off.","example_zh":"作為夏季促銷的一部分,所有泳裝一律七折。","note":"另一常考義為「升遷」,需依上下文判斷。"},{"text":"brochure","reading":"n.","zh":"宣傳手冊;簡介","topic":"行銷業務","example":"The travel agency's brochure describes several package tours to Europe.","example_zh":"旅行社的宣傳手冊介紹了多個歐洲套裝行程。","note":"相關字 flyer(傳單)、pamphlet(小冊子)。"},{"text":"endorse","reading":"v.","zh":"代言;背書支持","topic":"行銷業務","example":"The famous athlete was paid to endorse the company's new line of running shoes.","example_zh":"這位知名運動員受聘為公司新系列跑鞋代言。","note":"名詞 endorsement;另義為在支票背面「背書」。"},{"text":"launch","reading":"v.","zh":"推出;上市","topic":"行銷業務","example":"The company will launch its redesigned website at the trade show in Berlin.","example_zh":"公司將在柏林的商展上發表改版後的網站。","note":"高頻搭配 launch a product / campaign;亦可當名詞。"},{"text":"market share","reading":"phr.","zh":"市場占有率","topic":"行銷業務","example":"Aggressive pricing helped the brand increase its market share in the region.","example_zh":"積極的定價策略協助該品牌提高了在該地區的市占率。","note":"常搭配 gain / increase / lose market share。"},{"text":"target audience","reading":"phr.","zh":"目標客群","topic":"行銷業務","example":"The survey will help us identify the target audience for the new fitness app.","example_zh":"這項調查將協助我們找出新健身應用程式的目標客群。","note":"相關說法 target market / target customers。"},{"text":"competitive","reading":"adj.","zh":"有競爭力的;競爭的","topic":"行銷業務","example":"We offer competitive prices and free delivery on orders over $100.","example_zh":"我們提供有競爭力的價格,滿一百美元即免運費。","note":"高頻搭配 competitive price / salary / edge(競爭優勢)。"},{"text":"publicity","reading":"n.","zh":"宣傳;知名度","topic":"行銷業務","example":"The charity event generated a great deal of positive publicity for the sponsor.","example_zh":"這場慈善活動為贊助商帶來大量正面宣傳。","note":"常搭配 generate / gain publicity;public(大眾)的衍生字。"},{"text":"testimonial","reading":"n.","zh":"使用者見證;推薦文","topic":"行銷業務","example":"Customer testimonials on the website praise the product's durability.","example_zh":"網站上的顧客見證都稱讚這項產品的耐用度。","note":"勿與 testimony(法庭證詞)混淆。"},{"text":"lucrative","reading":"adj.","zh":"獲利豐厚的","topic":"行銷業務","example":"The consulting firm signed a lucrative contract with a major automaker.","example_zh":"這家顧問公司與一家大型汽車製造商簽下獲利豐厚的合約。","note":"常搭配 lucrative contract / market;近義 profitable。"},{"text":"quota","reading":"n.","zh":"配額;業績目標","topic":"行銷業務","example":"Every sales representative is expected to meet a monthly quota of fifty units.","example_zh":"每位業務代表每月應達成五十件的銷售目標。","note":"固定搭配 meet / exceed a quota。"},{"text":"prospective","reading":"adj.","zh":"潛在的;未來的","topic":"行銷業務","example":"The seminar is designed to introduce prospective clients to our services.","example_zh":"這場說明會旨在向潛在客戶介紹我們的服務。","note":"高頻搭配 prospective client / buyer;勿與 perspective(觀點)混淆。"},{"text":"referral","reading":"n.","zh":"轉介;推薦","topic":"行銷業務","example":"Most of our new customers come to us through referrals from existing clients.","example_zh":"我們大多數的新顧客都是由既有客戶轉介而來。","note":"常搭配 customer referral / referral program。"},{"text":"subscribe","reading":"v.","zh":"訂閱","topic":"行銷業務","example":"Subscribe to our newsletter to receive exclusive discounts and product updates.","example_zh":"訂閱我們的電子報,即可獲得專屬折扣與產品消息。","note":"固定搭配 subscribe to...;名詞 subscription。"},{"text":"demographics","reading":"n.","zh":"人口統計資料;客群結構","topic":"行銷業務","example":"The marketing plan was adjusted after a study of the region's demographics.","example_zh":"在研究該地區的人口結構後,行銷計畫做了調整。","note":"常用複數;形容詞 demographic(人口統計的)。"},{"text":"boost","reading":"v.","zh":"提升;增加","topic":"行銷業務","example":"The loyalty program is expected to boost repeat purchases by twenty percent.","example_zh":"這個會員方案預計能讓回購率提升百分之二十。","note":"高頻搭配 boost sales / morale(士氣);亦可當名詞。"},{"text":"itinerary","reading":"n.","zh":"行程表","topic":"出差旅遊","example":"According to the itinerary, we will visit the factory on Tuesday morning.","example_zh":"根據行程表,我們將於週二上午參觀工廠。","note":"常搭配 detailed itinerary / confirm the itinerary。"},{"text":"boarding pass","reading":"phr.","zh":"登機證","topic":"出差旅遊","example":"Please have your boarding pass and passport ready at the gate.","example_zh":"請在登機門備妥您的登機證與護照。","note":"相關字 boarding gate(登機門)、board(登機)。"},{"text":"layover","reading":"n.","zh":"轉機停留","topic":"出差旅遊","example":"The flight to Frankfurt includes a two-hour layover in Dubai.","example_zh":"飛往法蘭克福的航班中途會在杜拜停留兩小時。","note":"近義 stopover;direct flight(直飛)則無轉機。"},{"text":"accommodation","reading":"n.","zh":"住宿","topic":"出差旅遊","example":"Conference registration includes accommodation for two nights at the venue hotel.","example_zh":"會議報名費包含會場飯店兩晚住宿。","note":"英式常用複數 accommodations;動詞 accommodate 另義「容納」。"},{"text":"reservation","reading":"n.","zh":"預訂","topic":"出差旅遊","example":"I would like to make a reservation for a double room for March 3.","example_zh":"我想預訂三月三日的一間雙人房。","note":"固定搭配 make / confirm / cancel a reservation。"},{"text":"departure","reading":"n.","zh":"出發;離境","topic":"出差旅遊","example":"Passengers should arrive at the airport at least two hours before departure.","example_zh":"旅客應至少於起飛前兩小時抵達機場。","note":"反義 arrival;常搭配 departure time / lounge。"},{"text":"customs","reading":"n.","zh":"海關","topic":"出差旅遊","example":"All travelers must declare imported goods when going through customs.","example_zh":"所有旅客通過海關時都必須申報進口物品。","note":"固定搭配 go through customs / customs declaration。"},{"text":"baggage claim","reading":"phr.","zh":"行李提領處","topic":"出差旅遊","example":"After landing, please proceed to baggage claim area B to pick up your luggage.","example_zh":"降落後請前往 B 行李提領區領取行李。","note":"baggage 與 luggage 皆不可數;相關字 carousel(行李轉盤)。"},{"text":"round-trip","reading":"adj.","zh":"來回的","topic":"出差旅遊","example":"A round-trip ticket to Osaka costs less than two one-way tickets.","example_zh":"一張大阪來回機票比兩張單程票便宜。","note":"反義 one-way(單程的);英式說法為 return ticket。"},{"text":"aisle seat","reading":"phr.","zh":"靠走道座位","topic":"出差旅遊","example":"Mr. Weber requested an aisle seat so he could stretch his legs during the flight.","example_zh":"韋伯先生要求靠走道的座位,以便飛行途中伸展雙腿。","note":"相對用語 window seat(靠窗座位);aisle 的 s 不發音。"},{"text":"jet lag","reading":"phr.","zh":"時差(不適)","topic":"出差旅遊","example":"She scheduled a rest day after arriving in New York to recover from jet lag.","example_zh":"她在抵達紐約後安排了一天休息,以調整時差。","note":"常見句 suffer from jet lag;time difference 指單純的時間差。"},{"text":"visa","reading":"n.","zh":"簽證","topic":"出差旅遊","example":"Check whether you need a business visa before booking your flight to the conference.","example_zh":"訂機票參加會議前,請先確認是否需要商務簽證。","note":"常搭配 apply for / obtain a visa。"},{"text":"carry-on","reading":"n.","zh":"隨身行李","topic":"出差旅遊","example":"Each passenger may bring one carry-on and one personal item into the cabin.","example_zh":"每位乘客可攜帶一件隨身行李與一件個人物品進入機艙。","note":"亦作形容詞 carry-on luggage;托運行李是 checked baggage。"},{"text":"shuttle","reading":"n.","zh":"接駁車","topic":"出差旅遊","example":"A complimentary shuttle runs between the airport and the hotel every thirty minutes.","example_zh":"機場與飯店之間每三十分鐘有一班免費接駁車。","note":"高頻搭配 shuttle bus / shuttle service。"},{"text":"delay","reading":"n.","zh":"延誤","topic":"出差旅遊","example":"Due to heavy fog, passengers experienced delays of up to three hours.","example_zh":"由於濃霧,旅客經歷了長達三小時的延誤。","note":"常見句 be delayed / without delay(立刻)。"},{"text":"confirm","reading":"v.","zh":"確認","topic":"出差旅遊","example":"Please call the airline to confirm your flight twenty-four hours before departure.","example_zh":"請在起飛前二十四小時致電航空公司確認航班。","note":"名詞 confirmation;高頻搭配 confirmation number(確認編號)。"},{"text":"currency exchange","reading":"phr.","zh":"貨幣兌換(處)","topic":"出差旅遊","example":"The currency exchange counter at the airport offers less favorable rates than local banks.","example_zh":"機場的貨幣兌換櫃檯匯率比當地銀行差。","note":"相關字 exchange rate(匯率)。"},{"text":"cuisine","reading":"n.","zh":"料理;菜餚","topic":"餐廳飯店","example":"The hotel restaurant is famous for its authentic Italian cuisine.","example_zh":"這家飯店餐廳以道地的義大利料理聞名。","note":"常搭配 local / authentic cuisine;發音近似「葵勁」,注意拼字。"},{"text":"beverage","reading":"n.","zh":"飲料","topic":"餐廳飯店","example":"The conference fee includes lunch and unlimited beverages.","example_zh":"會議費用包含午餐與無限暢飲的飲料。","note":"比 drink 正式;常見於菜單與機上廣播。"},{"text":"complimentary","reading":"adj.","zh":"免費贈送的","topic":"餐廳飯店","example":"All guests receive a complimentary breakfast and free Wi-Fi access.","example_zh":"所有房客都享有免費早餐與無線網路。","note":"勿與 complementary(互補的)混淆;近義 free of charge。"},{"text":"banquet","reading":"n.","zh":"宴會","topic":"餐廳飯店","example":"The awards banquet will be held in the grand ballroom on Saturday evening.","example_zh":"頒獎宴會將於週六晚間在大宴會廳舉行。","note":"高頻搭配 banquet hall / awards banquet。"},{"text":"buffet","reading":"n.","zh":"自助餐","topic":"餐廳飯店","example":"The lunch buffet features a wide selection of seafood and desserts.","example_zh":"午間自助餐提供多樣的海鮮與甜點。","note":"字尾 t 不發音;常搭配 buffet-style dinner。"},{"text":"appetizer","reading":"n.","zh":"開胃菜","topic":"餐廳飯店","example":"For an appetizer, I recommend the grilled shrimp with garlic butter.","example_zh":"開胃菜方面,我推薦蒜香奶油烤蝦。","note":"菜單順序:appetizer → main course(主菜)→ dessert(甜點)。"},{"text":"concierge","reading":"n.","zh":"飯店禮賓人員","topic":"餐廳飯店","example":"The concierge can help you book theater tickets and arrange transportation.","example_zh":"禮賓人員可以協助您訂購劇院門票並安排交通。","note":"源自法文;常見搭配 concierge desk / service。"},{"text":"occupancy","reading":"n.","zh":"住房率;使用率","topic":"餐廳飯店","example":"The resort reported an occupancy rate of ninety-five percent during the holiday season.","example_zh":"這家度假村在假期期間的住房率高達百分之九十五。","note":"高頻搭配 occupancy rate;maximum occupancy 指「容納上限」。"},{"text":"check-in","reading":"n.","zh":"入住登記;報到","topic":"餐廳飯店","example":"Check-in begins at 3 P.M., but guests may store their luggage at the front desk earlier.","example_zh":"下午三點開始辦理入住,但房客可提前將行李寄放在櫃檯。","note":"反義 check-out;動詞形式分寫為 check in。"},{"text":"amenity","reading":"n.","zh":"便利設施","topic":"餐廳飯店","example":"Hotel amenities include a fitness center, a rooftop pool, and a business lounge.","example_zh":"飯店設施包括健身中心、頂樓泳池與商務貴賓室。","note":"常用複數 amenities;勿與 facility 完全劃上等號,前者強調舒適便利。"},{"text":"cater","reading":"v.","zh":"承辦外燴;提供餐飲","topic":"餐廳飯店","example":"The bistro also caters corporate events for up to two hundred guests.","example_zh":"這家小餐館也承辦最多兩百人的企業活動外燴。","note":"cater to 意為「迎合、滿足」;名詞 catering(外燴服務)。"},{"text":"patron","reading":"n.","zh":"顧客;常客","topic":"餐廳飯店","example":"Regular patrons of the café receive a free drink after every ten purchases.","example_zh":"這家咖啡館的常客每消費十次可獲得一杯免費飲品。","note":"近義 customer;patronage 指「惠顧」。"},{"text":"utensil","reading":"n.","zh":"餐具;用具","topic":"餐廳飯店","example":"Plastic utensils will be replaced with biodegradable ones next month.","example_zh":"塑膠餐具下個月將改為可生物分解的材質。","note":"kitchen utensils 指「廚房用具」;刀叉匙合稱 cutlery。"},{"text":"gratuity","reading":"n.","zh":"小費","topic":"餐廳飯店","example":"A fifteen percent gratuity is automatically added to parties of six or more.","example_zh":"六人以上的訂位將自動加收百分之十五的小費。","note":"菜單常見字,等同 tip;service charge 是「服務費」。"},{"text":"vegetarian","reading":"adj.","zh":"素食的;吃素的","topic":"餐廳飯店","example":"Please let us know in advance if you require a vegetarian meal.","example_zh":"如果您需要素食餐點,請提前告知我們。","note":"相關字 vegan(全素);dietary restrictions 指「飲食限制」。"},{"text":"suite","reading":"n.","zh":"套房","topic":"餐廳飯店","example":"The executive suite offers a panoramic view of the harbor.","example_zh":"行政套房可欣賞海港的全景。","note":"發音同 sweet;勿與 suit(西裝)拼字混淆。"},{"text":"housekeeping","reading":"n.","zh":"房務部;客房清潔","topic":"餐廳飯店","example":"Please contact housekeeping if you need extra towels or pillows.","example_zh":"如需額外的毛巾或枕頭,請聯絡房務部。","note":"常見句 Housekeeping cleans the rooms daily.。"},{"text":"purchase","reading":"v.","zh":"購買","topic":"購物訂單","example":"Customers who purchase two items online will receive free shipping.","example_zh":"線上購買兩件商品的顧客可享免運費。","note":"亦作名詞;proof of purchase 指「購買證明」。"},{"text":"refund","reading":"n.","zh":"退款","topic":"購物訂單","example":"You may request a full refund within fourteen days of delivery.","example_zh":"您可在到貨後十四天內申請全額退款。","note":"固定搭配 full refund / issue a refund;動詞重音在後。"},{"text":"exchange","reading":"v.","zh":"換貨;交換","topic":"購物訂單","example":"Items on sale may be exchanged but cannot be returned for a refund.","example_zh":"特價商品可以換貨,但不能退款。","note":"常見句 exchange A for B;return 是「退貨」。"},{"text":"receipt","reading":"n.","zh":"收據","topic":"購物訂單","example":"Please keep your receipt as proof of purchase in case you need a repair under warranty.","example_zh":"請保留收據作為購買證明,以便保固維修時使用。","note":"p 不發音;勿與 recipe(食譜)混淆。"},{"text":"warranty","reading":"n.","zh":"保固","topic":"購物訂單","example":"The laptop comes with a two-year warranty covering parts and labor.","example_zh":"這台筆電附有兩年保固,涵蓋零件與工資。","note":"固定搭配 under warranty(在保固期內)。"},{"text":"merchandise","reading":"n.","zh":"商品","topic":"購物訂單","example":"Damaged merchandise should be reported to customer service within seven days.","example_zh":"商品若有損壞,應於七天內通報客服。","note":"不可數名詞;近義 goods、products。"},{"text":"voucher","reading":"n.","zh":"折價券;禮券","topic":"購物訂單","example":"As an apology for the delay, we have enclosed a $20 gift voucher.","example_zh":"為了對延誤致歉,我們隨函附上二十美元禮券。","note":"近義 coupon、gift certificate;常搭配 redeem a voucher(兌換)。"},{"text":"bulk","reading":"n.","zh":"大量;大宗","topic":"購物訂單","example":"Retailers that buy in bulk qualify for an additional ten percent discount.","example_zh":"大量進貨的零售商可再享九折優惠。","note":"固定搭配 in bulk / bulk order(大宗訂單)。"},{"text":"discount","reading":"n.","zh":"折扣","topic":"購物訂單","example":"Members enjoy a fifteen percent discount on all regular-priced items.","example_zh":"會員購買所有原價商品可享八五折。","note":"搭配 offer / give a discount on...;動詞用法亦常見。"},{"text":"retail","reading":"n.","zh":"零售","topic":"購物訂單","example":"Ms. Lopez has worked in retail for more than ten years.","example_zh":"羅培茲小姐已在零售業工作超過十年。","note":"retail price(零售價);retailer 是「零售商」。"},{"text":"wholesale","reading":"adj.","zh":"批發的","topic":"購物訂單","example":"The boutique buys handbags at wholesale prices directly from the manufacturer.","example_zh":"這家精品店直接向製造商以批發價進貨手提包。","note":"反義 retail;wholesaler 是「批發商」。"},{"text":"out of stock","reading":"phr.","zh":"缺貨","topic":"購物訂單","example":"The item you ordered is temporarily out of stock and will ship next week.","example_zh":"您訂購的商品暫時缺貨,將於下週出貨。","note":"反義 in stock(有現貨);stock 亦指「股票」。"},{"text":"back order","reading":"phr.","zh":"延期交貨(訂單)","topic":"購物訂單","example":"The printer is on back order and is expected to arrive in ten business days.","example_zh":"這台印表機目前延期交貨,預計十個工作天後到貨。","note":"固定搭配 on back order;business day 指「工作日」。"},{"text":"defective","reading":"adj.","zh":"有瑕疵的","topic":"購物訂單","example":"Defective products can be returned for a replacement free of charge.","example_zh":"瑕疵品可免費退回更換。","note":"高頻搭配 defective item / merchandise;名詞 defect(瑕疵)。"},{"text":"checkout","reading":"n.","zh":"結帳","topic":"購物訂單","example":"Enter the promo code at checkout to receive your discount.","example_zh":"結帳時輸入優惠代碼即可獲得折扣。","note":"飯店情境指「退房」;動詞分寫為 check out。"},{"text":"place an order","reading":"phr.","zh":"下訂單","topic":"購物訂單","example":"You can place an order by phone, online, or at any of our retail locations.","example_zh":"您可以透過電話、網路或任一門市下訂單。","note":"相關搭配 process / cancel / track an order。"},{"text":"loyalty program","reading":"phr.","zh":"會員集點方案","topic":"購物訂單","example":"Join our loyalty program to earn points on every purchase.","example_zh":"加入我們的會員集點方案,每次消費都能累積點數。","note":"常搭配 earn / redeem points(累積/兌換點數)。"},{"text":"inventory","reading":"n.","zh":"庫存;存貨","topic":"生產物流","example":"The store conducts a full inventory count at the end of every quarter.","example_zh":"這家商店每季末進行一次完整盤點。","note":"固定搭配 take inventory(盤點);近義 stock。"},{"text":"warehouse","reading":"n.","zh":"倉庫","topic":"生產物流","example":"All returned goods are inspected at the central warehouse before being restocked.","example_zh":"所有退回的商品在重新上架前,都會在中央倉庫檢查。","note":"相關字 storage(儲存)、depot(倉庫、站場)。"},{"text":"shipment","reading":"n.","zh":"出貨;貨件","topic":"生產物流","example":"The next shipment of office chairs is scheduled to arrive on Thursday.","example_zh":"下一批辦公椅預計週四到貨。","note":"shipping 指「運送(費)」;shipment 指「一批貨」。"},{"text":"freight","reading":"n.","zh":"貨運;貨物","topic":"生產物流","example":"Heavy machinery is usually transported by rail freight to reduce costs.","example_zh":"重型機械通常以鐵路貨運運送以降低成本。","note":"常搭配 freight charges(貨運費用)、air freight(空運)。"},{"text":"assembly line","reading":"phr.","zh":"組裝線;生產線","topic":"生產物流","example":"Robots now perform most of the welding on the assembly line.","example_zh":"現在組裝線上大部分的焊接工作都由機器人執行。","note":"相關字 assemble(組裝)、assembly plant(組裝廠)。"},{"text":"manufacture","reading":"v.","zh":"製造","topic":"生產物流","example":"The components are manufactured in Vietnam and assembled in Taiwan.","example_zh":"這些零件在越南製造,並在台灣組裝。","note":"名詞 manufacturer(製造商);近義 produce。"},{"text":"procurement","reading":"n.","zh":"採購","topic":"生產物流","example":"The procurement department is negotiating better terms with several suppliers.","example_zh":"採購部門正與多家供應商協商更好的條件。","note":"動詞 procure;比 purchasing 更正式,常指企業採購。"},{"text":"logistics","reading":"n.","zh":"物流;後勤","topic":"生產物流","example":"Improved logistics allowed the company to cut delivery times in half.","example_zh":"物流的改善讓公司將交貨時間縮短了一半。","note":"常搭配 logistics company / manager;單複數同形。"},{"text":"dispatch","reading":"v.","zh":"派送;發送","topic":"生產物流","example":"Orders received before noon are dispatched from the warehouse the same day.","example_zh":"中午前收到的訂單當天就會從倉庫發出。","note":"近義 send out;亦可指「派遣人員」。"},{"text":"expedite","reading":"v.","zh":"加速(處理)","topic":"生產物流","example":"Please expedite the shipment, as the client needs the parts by Friday.","example_zh":"請加速出貨,因為客戶週五前就需要這些零件。","note":"高頻搭配 expedite the process / delivery;近義 speed up。"},{"text":"fragile","reading":"adj.","zh":"易碎的","topic":"生產物流","example":"Boxes marked \"fragile\" must be handled with care during loading.","example_zh":"標示「易碎」的箱子在裝載時必須小心搬運。","note":"固定搭配 handle with care(小心輕放)。"},{"text":"consignment","reading":"n.","zh":"託運(的一批貨)","topic":"生產物流","example":"A consignment of medical supplies was cleared through customs this morning.","example_zh":"一批醫療用品今天上午通關完成。","note":"on consignment 指「寄售」;consignee 是「收貨人」。"},{"text":"quality control","reading":"phr.","zh":"品質管制","topic":"生產物流","example":"Every unit passes through three stages of quality control before packaging.","example_zh":"每件產品在包裝前都要經過三道品質管制程序。","note":"縮寫 QC;相關字 inspection(檢驗)。"},{"text":"output","reading":"n.","zh":"產量;產出","topic":"生產物流","example":"The new machinery increased the plant's monthly output by twenty-five percent.","example_zh":"新機器讓工廠的月產量提高了百分之二十五。","note":"反義 input;近義 production、yield。"},{"text":"raw material","reading":"phr.","zh":"原物料","topic":"生產物流","example":"Rising costs of raw materials have forced the factory to raise its prices.","example_zh":"原物料成本上漲,迫使工廠調高售價。","note":"常用複數 raw materials;finished goods 指「成品」。"},{"text":"distributor","reading":"n.","zh":"經銷商","topic":"生產物流","example":"The company appointed a new distributor to cover the South American market.","example_zh":"公司指定了一家新經銷商負責南美市場。","note":"動詞 distribute(配送、分發);supplier 是「供應商」。"},{"text":"lead time","reading":"phr.","zh":"前置時間;交期","topic":"生產物流","example":"The standard lead time for custom furniture is six to eight weeks.","example_zh":"客製化家具的標準交期為六到八週。","note":"常搭配 shorten / reduce the lead time。"},{"text":"comply","reading":"v.","zh":"遵守","topic":"合約法務","example":"All suppliers must comply with our environmental standards.","example_zh":"所有供應商都必須遵守我們的環保標準。","note":"固定搭配 comply with + 規定;名詞 compliance。"},{"text":"contract","reading":"n.","zh":"合約","topic":"合約法務","example":"Both parties signed the contract after two rounds of negotiations.","example_zh":"經過兩輪協商後,雙方簽署了合約。","note":"高頻搭配 sign / renew / terminate a contract。"},{"text":"clause","reading":"n.","zh":"條款","topic":"合約法務","example":"The confidentiality clause prohibits employees from disclosing client information.","example_zh":"保密條款禁止員工洩露客戶資訊。","note":"近義 provision、term;文法中另指「子句」。"},{"text":"terminate","reading":"v.","zh":"終止","topic":"合約法務","example":"Either party may terminate the agreement with sixty days' written notice.","example_zh":"任一方均可在提前六十天書面通知後終止本協議。","note":"名詞 termination;近義 end、cancel。"},{"text":"breach","reading":"n.","zh":"違約;違反","topic":"合約法務","example":"Failure to deliver the goods on time constitutes a breach of contract.","example_zh":"未能準時交貨即構成違約。","note":"固定搭配 breach of contract;亦可當動詞。"},{"text":"negotiate","reading":"v.","zh":"協商;談判","topic":"合約法務","example":"The union will negotiate with management over wages next week.","example_zh":"工會下週將與資方就薪資進行協商。","note":"搭配 negotiate with sb over/on sth;名詞 negotiation。"},{"text":"binding","reading":"adj.","zh":"有約束力的","topic":"合約法務","example":"Once signed, the agreement is legally binding on both parties.","example_zh":"一經簽署,本協議即對雙方具有法律約束力。","note":"固定搭配 legally binding;動詞 bind。"},{"text":"amendment","reading":"n.","zh":"修正(案)","topic":"合約法務","example":"Any amendment to the contract must be made in writing and signed by both parties.","example_zh":"合約的任何修正都必須以書面為之,並經雙方簽署。","note":"動詞 amend;搭配 make an amendment to...。"},{"text":"confidential","reading":"adj.","zh":"機密的","topic":"合約法務","example":"All client records are strictly confidential and may not be shared with third parties.","example_zh":"所有客戶資料均屬高度機密,不得與第三方分享。","note":"高頻搭配 strictly confidential / confidential information。"},{"text":"arbitration","reading":"n.","zh":"仲裁","topic":"合約法務","example":"Any disputes arising from this contract shall be settled through arbitration.","example_zh":"因本合約產生的任何爭議,應透過仲裁解決。","note":"常見句 settle a dispute through arbitration;mediation 是「調解」。"},{"text":"patent","reading":"n.","zh":"專利","topic":"合約法務","example":"The engineer filed a patent for the new battery technology last year.","example_zh":"這位工程師去年為新電池技術申請了專利。","note":"固定搭配 file for / obtain a patent;trademark 是「商標」。"},{"text":"copyright","reading":"n.","zh":"著作權;版權","topic":"合約法務","example":"Reproducing this material without permission is a violation of copyright law.","example_zh":"未經許可重製本資料即違反著作權法。","note":"相關字 intellectual property(智慧財產權)。"},{"text":"regulation","reading":"n.","zh":"法規;規定","topic":"合約法務","example":"The plant was fined for failing to meet new safety regulations.","example_zh":"該工廠因未符合新的安全法規而遭罰款。","note":"常搭配 comply with regulations;rules and regulations 為慣用語。"},{"text":"waive","reading":"v.","zh":"免除;放棄(權利)","topic":"合約法務","example":"The bank agreed to waive the annual fee for the first year.","example_zh":"銀行同意免除第一年的年費。","note":"高頻搭配 waive a fee / right;名詞 waiver(棄權書)。"},{"text":"stipulate","reading":"v.","zh":"規定;載明","topic":"合約法務","example":"The lease stipulates that tenants are responsible for minor repairs.","example_zh":"租約載明房客須負責小型修繕。","note":"常見句型 stipulate that + 子句;名詞 stipulation。"},{"text":"expiration","reading":"n.","zh":"到期;期滿","topic":"合約法務","example":"Please renew your membership before the expiration date to keep your benefits.","example_zh":"請在到期日前續約會員,以保留您的權益。","note":"高頻搭配 expiration date;動詞 expire。"},{"text":"consent","reading":"n.","zh":"同意","topic":"合約法務","example":"Written consent from the property owner is required before any alterations are made.","example_zh":"進行任何改建前,必須取得屋主的書面同意。","note":"固定搭配 written consent / without one's consent。"},{"text":"attachment","reading":"n.","zh":"附件;附加檔案","topic":"科技通訊","example":"Please find the attachment containing the revised proposal.","example_zh":"請查收附件中的修訂版提案。","note":"高頻句 Please find attached...;動詞 attach。"},{"text":"install","reading":"v.","zh":"安裝","topic":"科技通訊","example":"The IT team will install the new accounting software on all computers this weekend.","example_zh":"資訊團隊本週末將在所有電腦上安裝新的會計軟體。","note":"名詞 installation;勿與 installment(分期付款)混淆。"},{"text":"upgrade","reading":"v.","zh":"升級","topic":"科技通訊","example":"We recommend upgrading your operating system to improve security.","example_zh":"我們建議升級您的作業系統以提升安全性。","note":"亦作名詞;飯店情境指「升等(房型)」。"},{"text":"troubleshoot","reading":"v.","zh":"排除故障","topic":"科技通訊","example":"The manual includes a section to help users troubleshoot common printer problems.","example_zh":"使用手冊包含協助使用者排除常見印表機問題的章節。","note":"名詞 troubleshooting;客服情境高頻字。"},{"text":"compatible","reading":"adj.","zh":"相容的","topic":"科技通訊","example":"This headset is compatible with most laptops and mobile devices.","example_zh":"這款耳機與大多數筆電及行動裝置相容。","note":"固定搭配 be compatible with...;名詞 compatibility。"},{"text":"database","reading":"n.","zh":"資料庫","topic":"科技通訊","example":"Customer contact information is stored in a secure central database.","example_zh":"客戶聯絡資料儲存在安全的中央資料庫中。","note":"常搭配 update / access the database。"},{"text":"encryption","reading":"n.","zh":"加密","topic":"科技通訊","example":"All payment data is protected by advanced encryption technology.","example_zh":"所有付款資料都受到先進加密技術的保護。","note":"動詞 encrypt;相關字 password protection。"},{"text":"bandwidth","reading":"n.","zh":"頻寬","topic":"科技通訊","example":"Streaming the training videos requires more bandwidth than our current plan provides.","example_zh":"串流播放訓練影片所需的頻寬超過我們目前方案所提供的。","note":"口語中亦引申為「餘力、時間」。"},{"text":"server","reading":"n.","zh":"伺服器","topic":"科技通訊","example":"The website was temporarily unavailable while the server was being maintained.","example_zh":"伺服器維護期間,網站暫時無法使用。","note":"餐廳情境指「服務生」,需依上下文判斷。"},{"text":"glitch","reading":"n.","zh":"小故障","topic":"科技通訊","example":"A software glitch caused some customers to be billed twice.","example_zh":"軟體的小故障導致部分顧客被重複收費。","note":"近義 bug;比 breakdown(大故障)程度輕。"},{"text":"teleconference","reading":"n.","zh":"電話會議;視訊會議","topic":"科技通訊","example":"The quarterly results will be discussed in a teleconference with overseas branches.","example_zh":"季度業績將透過與海外分公司的視訊會議進行討論。","note":"相關字 video conference、conference call。"},{"text":"notification","reading":"n.","zh":"通知","topic":"科技通訊","example":"You will receive an e-mail notification once your package has been shipped.","example_zh":"包裹寄出後,您將收到電子郵件通知。","note":"動詞 notify sb of sth;近義 notice(書面通知)。"},{"text":"backup","reading":"n.","zh":"備份","topic":"科技通訊","example":"Remember to make a backup of your files before installing the update.","example_zh":"安裝更新前,記得先備份你的檔案。","note":"動詞分寫為 back up;亦指「後援、支援」。"},{"text":"browse","reading":"v.","zh":"瀏覽","topic":"科技通訊","example":"Visitors can browse our full catalog on the company website.","example_zh":"訪客可以在公司網站上瀏覽完整型錄。","note":"browser 是「瀏覽器」;在商店情境指「隨意逛逛」。"},{"text":"specification","reading":"n.","zh":"規格","topic":"科技通訊","example":"The technical specifications for the new tablet are listed on the last page of the brochure.","example_zh":"新款平板的技術規格列在手冊的最後一頁。","note":"常用複數 specifications(口語 specs);動詞 specify。"},{"text":"obsolete","reading":"adj.","zh":"過時的;淘汰的","topic":"科技通訊","example":"The company phased out its obsolete equipment and invested in automation.","example_zh":"公司逐步淘汰過時設備,並投資自動化。","note":"近義 outdated;become obsolete(變得過時)為常見搭配。"},{"text":"user-friendly","reading":"adj.","zh":"容易使用的","topic":"科技通訊","example":"Reviewers praised the app's user-friendly interface and fast loading speed.","example_zh":"評論者稱讚這款應用程式介面容易使用、載入速度快。","note":"高頻搭配 user-friendly interface / design。"},{"text":"commute","reading":"v.","zh":"通勤","topic":"日常生活","example":"Many employees commute to the office by high-speed rail from neighboring cities.","example_zh":"許多員工從鄰近城市搭高鐵通勤上班。","note":"亦作名詞;commuter 是「通勤者」。"},{"text":"pedestrian","reading":"n.","zh":"行人","topic":"日常生活","example":"The city plans to widen the sidewalks to make the streets safer for pedestrians.","example_zh":"市府計畫拓寬人行道,讓街道對行人更安全。","note":"常搭配 pedestrian crossing(行人穿越道)。"},{"text":"utility","reading":"n.","zh":"公共事業;水電瓦斯","topic":"日常生活","example":"The monthly rent includes all utilities except internet service.","example_zh":"月租金包含網路以外的所有水電瓦斯費用。","note":"常用複數 utilities;utility bill 指「水電帳單」。"},{"text":"lease","reading":"n.","zh":"租約","topic":"日常生活","example":"The tenant decided to renew the lease for another two years.","example_zh":"房客決定再續租兩年。","note":"固定搭配 sign / renew a lease;動詞義為「出租、租用」。"},{"text":"landlord","reading":"n.","zh":"房東","topic":"日常生活","example":"The landlord agreed to repaint the apartment before the new tenants moved in.","example_zh":"房東同意在新房客搬入前重新粉刷公寓。","note":"相對字 tenant(房客);女性房東可稱 landlady。"},{"text":"appliance","reading":"n.","zh":"家電","topic":"日常生活","example":"The store offers free installation on all major household appliances.","example_zh":"這家店為所有大型家電提供免費安裝。","note":"高頻搭配 household / kitchen appliances。"},{"text":"errand","reading":"n.","zh":"差事;跑腿","topic":"日常生活","example":"She left the office early to run a few errands before the bank closed.","example_zh":"她提早離開辦公室,趕在銀行關門前辦幾件雜事。","note":"固定搭配 run errands(辦雜事、跑腿)。"},{"text":"prescription","reading":"n.","zh":"處方箋","topic":"日常生活","example":"You can pick up your prescription at the pharmacy counter in twenty minutes.","example_zh":"您可以在二十分鐘後到藥局櫃檯領取處方藥。","note":"固定搭配 fill a prescription(配藥);動詞 prescribe。"},{"text":"pharmacy","reading":"n.","zh":"藥局","topic":"日常生活","example":"The pharmacy is open twenty-four hours and offers a home delivery service.","example_zh":"這家藥局二十四小時營業,並提供送藥到府服務。","note":"pharmacist 是「藥師」;美式亦稱 drugstore。"},{"text":"detour","reading":"n.","zh":"繞道;改道","topic":"日常生活","example":"Drivers should take a detour via Oak Street while the bridge is under repair.","example_zh":"橋梁維修期間,駕駛應改道行經橡樹街。","note":"固定搭配 take a detour;交通公告高頻字。"},{"text":"congestion","reading":"n.","zh":"壅塞","topic":"日常生活","example":"Traffic congestion near the stadium is expected before the concert begins.","example_zh":"演唱會開始前,體育場附近預計會出現交通壅塞。","note":"高頻搭配 traffic congestion;形容詞 congested。"},{"text":"municipal","reading":"adj.","zh":"市政的","topic":"日常生活","example":"The municipal government will open a new public library in the spring.","example_zh":"市政府將於春天啟用一座新的公共圖書館。","note":"常搭配 municipal government / services。"},{"text":"recycle","reading":"v.","zh":"回收","topic":"日常生活","example":"Residents are encouraged to recycle glass, paper, and plastic separately.","example_zh":"居民被鼓勵將玻璃、紙類與塑膠分開回收。","note":"名詞 recycling;相關字 sustainable(永續的)。"},{"text":"donate","reading":"v.","zh":"捐贈","topic":"日常生活","example":"The company donates a portion of its profits to local charities every year.","example_zh":"這家公司每年捐出一部分利潤給當地慈善機構。","note":"句型 donate sth to sb;名詞 donation。"},{"text":"checkup","reading":"n.","zh":"健康檢查","topic":"日常生活","example":"Employees are entitled to a free annual checkup at the clinic downstairs.","example_zh":"員工每年可在樓下的診所享有一次免費健康檢查。","note":"固定搭配 annual checkup / regular checkup。"},{"text":"plumber","reading":"n.","zh":"水電工;水管工","topic":"日常生活","example":"The landlord sent a plumber to fix the leaking faucet in the kitchen.","example_zh":"房東派了一位水電工來修理廚房漏水的水龍頭。","note":"b 不發音;相關字 leak(漏水)、faucet(水龍頭)。"},{"text":"fare","reading":"n.","zh":"車資;票價","topic":"日常生活","example":"Bus fares will increase by ten percent starting next month.","example_zh":"公車票價下個月起將調漲百分之十。","note":"常搭配 bus / taxi / train fare;勿與 fee(手續費)混淆。"},{"text":"clock in","reading":"phr.","zh":"打卡上班","topic":"辦公室","example":"All warehouse staff are required to clock in no later than 8:30 a.m. each weekday.","example_zh":"所有倉儲人員每個平日最晚須於上午八點三十分打卡上班。","note":"相反詞 clock out（打卡下班）；也可說 punch in/out。"},{"text":"payroll","reading":"n.","zh":"薪資名冊；發薪作業","topic":"辦公室","example":"The payroll department will process salary payments on the last business day of each month.","example_zh":"薪資部門將於每月最後一個營業日處理薪資發放。","note":"on the payroll 指「受僱於公司」；勿與 payment（付款）混淆。"},{"text":"overtime","reading":"n.","zh":"加班；加班費","topic":"辦公室","example":"Employees must obtain prior approval from their manager before working overtime.","example_zh":"員工加班前必須先取得經理核准。","note":"常見搭配 work overtime、overtime pay（加班費）。"},{"text":"intern","reading":"n.","zh":"實習生","topic":"辦公室","example":"Each intern will be assigned a mentor during the twelve-week summer program.","example_zh":"在為期十二週的暑期計畫中，每位實習生都會被指派一位導師。","note":"internship 為「實習（期間）」；動詞用法 intern at a company。"},{"text":"personnel","reading":"n.","zh":"全體員工；人事部門","topic":"辦公室","example":"Only authorized personnel are permitted to enter the server room on the fifth floor.","example_zh":"只有獲授權的人員才可進入五樓的伺服器機房。","note":"為集合名詞不加 s；勿與 personal（個人的）拼錯。"},{"text":"headquarters","reading":"n.","zh":"總部；總公司","topic":"辦公室","example":"The company will relocate its headquarters to Taichung early next year.","example_zh":"該公司明年初將把總部遷至台中。","note":"字尾恆有 s，單複數同形；縮寫 HQ。"},{"text":"branch","reading":"n.","zh":"分公司；分行","topic":"辦公室","example":"Our Kaohsiung branch will remain open until 7 p.m. during the holiday season.","example_zh":"我們高雄分公司在節慶期間將營業至晚上七點。","note":"branch office（分公司）；branch manager（分行經理）為高頻搭配。"},{"text":"shredder","reading":"n.","zh":"碎紙機","topic":"辦公室","example":"Please put all outdated client records through the shredder to protect confidential information.","example_zh":"請將所有過期的客戶資料放入碎紙機銷毀，以保護機密資訊。","note":"動詞 shred（撕碎）；常與 confidential documents 搭配出題。"},{"text":"filing cabinet","reading":"n.","zh":"檔案櫃","topic":"辦公室","example":"Signed contracts should be stored in the locked filing cabinet next to the manager's desk.","example_zh":"已簽署的合約應存放在經理桌旁上鎖的檔案櫃中。","note":"file（歸檔）為動詞；keep files in the cabinet 為常見搭配。"},{"text":"bulletin board","reading":"n.","zh":"布告欄","topic":"辦公室","example":"The revised holiday schedule has been posted on the bulletin board in the break room.","example_zh":"修訂後的假期時間表已張貼在休息室的布告欄上。","note":"post a notice on the bulletin board 是 Part 1 圖片題常見敘述。"},{"text":"break room","reading":"n.","zh":"員工休息室","topic":"辦公室","example":"A new coffee machine has been installed in the break room for all employees to use.","example_zh":"休息室新裝了一台咖啡機，供全體員工使用。","note":"也作 breakroom；take a break（休息一下）為相關片語。"},{"text":"receptionist","reading":"n.","zh":"櫃檯接待員","topic":"辦公室","example":"Visitors should sign in with the receptionist before proceeding to the meeting area.","example_zh":"訪客前往會議區之前，應先向櫃檯接待員登記。","note":"reception desk（接待櫃檯）；勿與 recipient（收件人）混淆。"},{"text":"extension","reading":"n.","zh":"分機；延長","topic":"辦公室","example":"For billing inquiries, please call our accounting office at extension 214.","example_zh":"帳務問題請撥打會計室分機 214。","note":"另一常考義為 deadline extension（期限延長）。"},{"text":"courier","reading":"n.","zh":"快遞（員／公司）","topic":"辦公室","example":"The signed agreement was sent by courier to ensure it arrives before Friday.","example_zh":"已簽署的協議以快遞寄出，以確保週五前送達。","note":"by courier（以快遞方式）；courier service 為高頻搭配。"},{"text":"correspondence","reading":"n.","zh":"往來信件；通信","topic":"辦公室","example":"Please direct all future correspondence regarding the merger to our legal department.","example_zh":"有關合併案的後續往來信件，請一律寄給本公司法務部門。","note":"不可數名詞；business correspondence（商務書信）常見於 Part 7。"},{"text":"enclosure","reading":"n.","zh":"（信件的）附件","topic":"辦公室","example":"As noted in the enclosure, your updated insurance policy takes effect on May 1.","example_zh":"如附件所述，您更新後的保單自五月一日起生效。","note":"紙本信件用 enclosure，電子郵件的附件用 attachment。"},{"text":"proofread","reading":"v.","zh":"校對","topic":"辦公室","example":"Please proofread the annual report carefully before it is sent to the printer.","example_zh":"請在年度報告送印前仔細校對。","note":"proofread a document for errors；名詞為 proofreading。"},{"text":"duplicate","reading":"v.","zh":"複製；複印","topic":"辦公室","example":"Please duplicate the signed form and keep one copy for your own records.","example_zh":"請將已簽名的表格複印一份，自行留存一份副本。","note":"in duplicate（一式兩份）；名詞重音在第一音節。"},{"text":"shift","reading":"n.","zh":"輪班；班次","topic":"辦公室","example":"Employees on the night shift receive an additional allowance of NT$300 per day.","example_zh":"值夜班的員工每天可額外領取新台幣三百元津貼。","note":"day/night shift、work in shifts（輪班制）為常見搭配。"},{"text":"sick leave","reading":"n.","zh":"病假","topic":"辦公室","example":"Employees requesting sick leave of more than three days must provide a doctor's note.","example_zh":"請病假超過三天的員工必須提供醫師證明。","note":"take/request sick leave；annual leave 為「年假」。"},{"text":"timesheet","reading":"n.","zh":"工時表","topic":"辦公室","example":"Submit your timesheet to the payroll office by noon every Friday.","example_zh":"請於每週五中午前將工時表送交薪資部門。","note":"fill out a timesheet（填寫工時表）為高頻搭配。"},{"text":"wage","reading":"n.","zh":"（時薪、日薪制的）工資","topic":"辦公室","example":"The company raised the hourly wage for part-time staff at the beginning of the year.","example_zh":"公司於年初調高了兼職人員的時薪。","note":"wage 多指按時計酬，salary 指月薪或年薪。"},{"text":"raise","reading":"n.","zh":"加薪","topic":"辦公室","example":"After leading the project successfully, Ms. Chen asked her director for a raise.","example_zh":"成功帶領專案之後，陳小姐向主管提出加薪要求。","note":"get/ask for a raise；英式用 pay rise；勿與 rise（上升）混淆。"},{"text":"bonus","reading":"n.","zh":"獎金；紅利","topic":"辦公室","example":"All full-time employees will receive a year-end bonus equal to one month's salary.","example_zh":"所有正職員工將獲得相當於一個月薪資的年終獎金。","note":"year-end bonus（年終獎金）、performance bonus（績效獎金）。"},{"text":"incentive","reading":"n.","zh":"獎勵；誘因","topic":"辦公室","example":"The sales team is offered cash incentives for exceeding their monthly targets.","example_zh":"業務團隊若超越每月目標，即可獲得現金獎勵。","note":"incentive to do sth；incentive program（獎勵方案）為高頻搭配。"},{"text":"appraisal","reading":"n.","zh":"考核；評估","topic":"辦公室","example":"Annual performance appraisals will be conducted by each department head in December.","example_zh":"年度績效考核將由各部門主管於十二月進行。","note":"performance appraisal（績效考核）；動詞為 appraise。"},{"text":"subordinate","reading":"n.","zh":"部屬；下屬","topic":"辦公室","example":"An effective manager gives subordinates clear instructions and timely feedback.","example_zh":"有效率的主管會給部屬明確的指示與及時的回饋。","note":"反義概念為 superior（上司）；亦可作形容詞「次要的」。"},{"text":"counterpart","reading":"n.","zh":"（職務）對應的人；對口","topic":"辦公室","example":"Ms. Lin will meet her counterpart at the Tokyo office to align the launch schedule.","example_zh":"林小姐將與東京辦公室的對口人員會面，以協調上市時程。","note":"指「另一單位中職位相當者」，Part 7 高頻字。"},{"text":"workstation","reading":"n.","zh":"工作座位；工作站","topic":"辦公室","example":"Please keep your workstation tidy and lock your computer whenever you step away.","example_zh":"請保持工作座位整潔，離開座位時務必鎖定電腦。","note":"與 cubicle（隔間座位）常一起出現在辦公室情境。"},{"text":"ergonomic","reading":"adj.","zh":"符合人體工學的","topic":"辦公室","example":"The company purchased ergonomic chairs to reduce back strain among office staff.","example_zh":"公司添購了符合人體工學的座椅，以減少內勤人員的背部不適。","note":"ergonomic chair/keyboard 為常見搭配；名詞為 ergonomics。"},{"text":"administrative","reading":"adj.","zh":"行政的","topic":"辦公室","example":"Ms. Kao handles administrative tasks such as scheduling, filing, and ordering supplies.","example_zh":"高小姐負責排程、歸檔與訂購用品等行政事務。","note":"administrative assistant（行政助理）為高頻職稱。"},{"text":"dress code","reading":"n.","zh":"服裝規定","topic":"辦公室","example":"The office dress code has been relaxed to business casual during the summer months.","example_zh":"夏季期間辦公室服裝規定放寬為商務休閒。","note":"comply with the dress code；business casual（商務休閒）常一起考。"},{"text":"telecommute","reading":"v.","zh":"遠距上班","topic":"辦公室","example":"Staff members may telecommute up to two days a week with their manager's consent.","example_zh":"員工經主管同意後，每週最多可遠距上班兩天。","note":"同義說法 work remotely / work from home。"},{"text":"flextime","reading":"n.","zh":"彈性工時","topic":"辦公室","example":"Under the new flextime policy, employees may start work anytime between 8 and 10 a.m.","example_zh":"根據新的彈性工時制度，員工可在上午八點至十點之間任選時間上班。","note":"也拼作 flexitime；flexible working hours 為同義說法。"},{"text":"punctual","reading":"adj.","zh":"準時的","topic":"辦公室","example":"Being punctual for client appointments reflects well on the entire firm.","example_zh":"與客戶約定準時赴約，能為整間公司留下好印象。","note":"副詞 punctually；名詞 punctuality 亦常考。"},{"text":"authorize","reading":"v.","zh":"授權；批准","topic":"辦公室","example":"Only the finance director is authorized to approve purchases over NT$100,000.","example_zh":"只有財務長獲授權可核准超過新台幣十萬元的採購。","note":"be authorized to do sth；名詞 authorization（授權書）。"},{"text":"approve","reading":"v.","zh":"核准；批准","topic":"辦公室","example":"Your leave request will be processed once your supervisor has approved it.","example_zh":"你的請假申請經主管核准後即會處理。","note":"approve a request（及物）；approve of（贊成）意思不同。"},{"text":"revise","reading":"v.","zh":"修訂；修改","topic":"辦公室","example":"Please revise the proposal to reflect the updated budget figures before Monday.","example_zh":"請在週一前修改提案，以反映更新後的預算數字。","note":"revised edition/schedule（修訂版／修改後的時程）為高頻搭配。"},{"text":"circulate","reading":"v.","zh":"傳閱；流通","topic":"辦公室","example":"A memo about the new security procedures will be circulated to all departments today.","example_zh":"一份關於新保全程序的備忘錄今天將傳閱至所有部門。","note":"circulate a memo/document 為辦公室高頻搭配。"},{"text":"forward","reading":"v.","zh":"轉寄；轉交","topic":"辦公室","example":"Kindly forward this e-mail to anyone who was unable to attend the training session.","example_zh":"請將這封電子郵件轉寄給未能參加訓練課程的同仁。","note":"forward A to B；look forward to（期待）為不同片語。"},{"text":"recipient","reading":"n.","zh":"收件人；受領者","topic":"辦公室","example":"The recipient must sign for the package upon delivery to the front desk.","example_zh":"包裹送達櫃檯時，收件人必須簽收。","note":"award recipient（得獎者）亦常見；勿與 receptionist 混淆。"},{"text":"urgent","reading":"adj.","zh":"緊急的","topic":"辦公室","example":"Please mark the message as urgent so that the director reads it immediately.","example_zh":"請將訊息標示為緊急，讓主管立即閱讀。","note":"urgent request/matter；副詞 urgently 常見於徵才廣告。"},{"text":"promptly","reading":"adv.","zh":"迅速地；準時地","topic":"辦公室","example":"All customer complaints should be handled promptly and courteously.","example_zh":"所有客訴都應迅速且有禮地處理。","note":"Part 5 高頻副詞；promptly at nine（九點整）亦常考。"},{"text":"accordingly","reading":"adv.","zh":"因此；相應地","topic":"辦公室","example":"The deadline has been moved up; please adjust your work schedule accordingly.","example_zh":"截止日已提前，請相應調整你的工作排程。","note":"Part 5 高頻轉承副詞；常置於句尾修飾整句。"},{"text":"respectively","reading":"adv.","zh":"分別地","topic":"辦公室","example":"The sales and marketing teams will move to the third and fifth floors, respectively.","example_zh":"業務團隊與行銷團隊將分別搬至三樓與五樓。","note":"用於依序對應前述項目；勿與 respectfully（恭敬地）混淆。"},{"text":"temporarily","reading":"adv.","zh":"暫時地","topic":"辦公室","example":"The elevator will be temporarily out of service while maintenance is carried out.","example_zh":"維修期間電梯將暫停使用。","note":"temporarily closed/unavailable 為公告高頻用語。"},{"text":"thoroughly","reading":"adv.","zh":"徹底地；仔細地","topic":"辦公室","example":"Review the contract thoroughly before forwarding it to the client for signature.","example_zh":"在把合約轉交客戶簽署前，請先徹底檢閱。","note":"thoroughly review/inspect 為 Part 5 高頻搭配。"},{"text":"fill out","reading":"phr.","zh":"填寫（表格）","topic":"辦公室","example":"New employees must fill out the enrollment form to join the company insurance plan.","example_zh":"新進員工必須填寫加保表格，以加入公司保險方案。","note":"fill out a form＝fill in a form；受詞為表格類名詞。"},{"text":"follow up","reading":"phr.","zh":"後續追蹤；跟進","topic":"辦公室","example":"I will follow up with the supplier tomorrow to confirm the delivery date.","example_zh":"我明天會向供應商跟進，確認交貨日期。","note":"follow up on/with；名詞與形容詞寫作 follow-up。"},{"text":"take over","reading":"phr.","zh":"接手；接任","topic":"辦公室","example":"Ms. Huang will take over the manager's duties while he is on leave.","example_zh":"經理休假期間，將由黃小姐接手他的職務。","note":"take over duties/a position；名詞 takeover 指「收購」。"},{"text":"call in sick","reading":"phr.","zh":"打電話請病假","topic":"辦公室","example":"If you need to call in sick, please notify your supervisor before 9 a.m.","example_zh":"若需打電話請病假，請於上午九點前通知主管。","note":"Part 3 對話高頻情境；與 sick leave 一起記。"},{"text":"petty cash","reading":"n.","zh":"零用金","topic":"辦公室","example":"Small office purchases under NT$1,000 can be paid for out of petty cash.","example_zh":"低於新台幣一千元的小額辦公採購可由零用金支付。","note":"petty cash fund（零用金）；petty 原意為「小額的」。"},{"text":"expense report","reading":"n.","zh":"費用報銷單","topic":"辦公室","example":"Attach all original receipts when you submit your expense report for the business trip.","example_zh":"提交出差費用報銷單時，請附上所有正本收據。","note":"submit/file an expense report；與 reimburse（核銷）常一起出現。"},{"text":"maintenance","reading":"n.","zh":"維修；保養","topic":"辦公室","example":"The air-conditioning system will undergo routine maintenance this Saturday morning.","example_zh":"空調系統將於本週六上午進行例行保養。","note":"routine/regular maintenance；動詞為 maintain。"},{"text":"premises","reading":"n.","zh":"場所；營業處所","topic":"辦公室","example":"Smoking is strictly prohibited anywhere on the company premises.","example_zh":"公司場所內任何地方都嚴禁吸菸。","note":"恆用複數形；on the premises（在場所內）為高頻搭配。"},{"text":"relocate","reading":"v.","zh":"搬遷；調往他處","topic":"辦公室","example":"The design team will relocate to the newly renovated office on the eighth floor.","example_zh":"設計團隊將搬遷至八樓新裝修的辦公室。","note":"relocate to＋地點；名詞 relocation（搬遷）亦常考。"},{"text":"mandatory","reading":"adj.","zh":"強制的；必須的","topic":"辦公室","example":"Attendance at the fire safety training is mandatory for all staff members.","example_zh":"全體員工皆須強制參加消防安全訓練。","note":"同義字 compulsory、required；反義字 optional。"},{"text":"eligible","reading":"adj.","zh":"符合資格的","topic":"辦公室","example":"Employees who have completed one year of service are eligible for paid annual leave.","example_zh":"服務滿一年的員工即符合帶薪年假的資格。","note":"be eligible for＋名詞／to＋原形動詞；勿與 legible（字跡清楚的）混淆。"},{"text":"entitle","reading":"v.","zh":"使有資格；使有權","topic":"辦公室","example":"This coupon entitles the holder to a 20 percent discount on office furniture.","example_zh":"此優惠券使持有人享有辦公家具八折優惠。","note":"be entitled to＋名詞為 Part 5 高頻句型。"},{"text":"perk","reading":"n.","zh":"（工作的）額外福利","topic":"辦公室","example":"Free gym membership is one of the most popular perks the company offers.","example_zh":"免費健身房會籍是公司提供最受歡迎的額外福利之一。","note":"口語感較強；正式說法為 fringe benefits。"},{"text":"turnover","reading":"n.","zh":"人員流動率；營業額","topic":"辦公室","example":"The firm reduced staff turnover by improving benefits and offering flexible schedules.","example_zh":"該公司透過改善福利與提供彈性排班，降低了人員流動率。","note":"staff turnover（流動率）與 annual turnover（年營業額）兩義都常考。"},{"text"
